해<br>제가 너무 너무 너무 사랑하는 우리 대학원생들과<br>아내와 기준이 그리고 기현이를 데리고 그곳을 방문했습니다.<br>가보니, 너무 훌륭한 장애인 체육 시설을 가지고 있었고,<br>사실 제가 그곳을 오늘 처음 가 보았다는 사실이 부끄러웠습니다.<br>그리고, 그곳에서 생활하는 장애인들 중에는<br>생각보다 중증인 장애인들이 많이 있었습니다.<br>2014년<br>저 분들을 더 많이 만나뵐 것 같습니다.<br>아니 만나뵙고 싶습니다.<br>한국 전쟁후<br>버려진 혼혈 고아들을 8명이나 입양하신분,<br>그리고도 한국의 고아들을 생각하면 마음이 불편하여<br>그 입양한 고아들을 데리고 한국에 오셔서<br>고양 시골에 텐트를 치고<br>한국의 고아들을 위해 집을 지으신 분,<br>홀트. 선생님과<br>그 가족에 2013년 이 다 가기전에 감사하다는 인사를 전합니다.<br>감.사.합.니.다.<br>존.경.합.니.다.<br>사.랑.합.니.다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02u6QCg1WmJJmS1AxAAPAs7RYqHHjeXuUuRwoWKKXUFQhQ8M2VRvRqgxjQTsutmydkl?__cft__[0]=AZU-8-twke6jCBs3f2MKTZFyC9V6dU8dDQvQRDRPUMmEqzjabltnBlQx4NmeX3UlHX4ZD0YLOG6dOloXgUZL5woNfkWxgsthTTQ5H4brg2ngO7ICsNn0uo77HDxX_ctLyYzUlLJzFs-t1GE7MSbnytzY&__tn__=%2CO%2CP-R"}, {"id": 49, "date": "2013년 12월 31일", "year": 2013, "title": "기쁜일도 많았고", "themes": [6, 8], "content_html": "<p>기쁜일도 많았고<br>힘들일도 많았고<br>슬픈일도 많았던<br>2013년이 이렇게 지나갑니다.<br>저는 지금 2013년 마지막 퇴근을 합니다.<br>강의와 보직과 연구로 많이 바빴지만,<br>퇴근할 수 있는 직장이 있음에 감사하고,<br>사랑하는 누님을 올해 보내드렸지만,<br>누님과 함께한 45년간의 삶이 있었음에 감사하고,<br>가족과 떨어져 있어서 힘들었지만,<br>떨어져 있을 수 밖에 없었던 가족이 있음에 감사하고,<br>잦은 해외 출장 때문에 몸과 마음이 힘들었지만,<br>해외 출장으로 얻은 다양한 경험과 견문의 기회에 감사하고,<br>뼈속부터 죄인인 죄성으로 힘들었지만,<br>죄인으로서 나는 예수님의 없으면 살수 없다는 깨달음에 감사하고,<br>함께 기도할 수 있는 사람이 있었음에 감사하고,<br>부족하나마 나의 가르침에 귀 기울여 준 사람이 있음에 감사하고,<br>늘 부족한 아들을 챙겨주시는 부모님이 계심에 감사하고,<br>부족한 저를 위해 늘 기도해 주시는 장인 장모님께 감사하고,<br>부족한 저를 가르쳐 주며 함께 연구해 주신 공동연구원 교수님들께 감사하고,<br>장애인 체육의 발전을 위해서 함께 노력해 주신<br>대학과 단체의 여러분들께 감사하고,<br>함께 이스라엘과 일본을 함께 간<br>아버지와 형님, 누님과 같은 목사님들께 감사하고,<br>늘 하늘로 부터 오는 말씀의 양식을 먹여주신<br>이규 목사님과 아름다운 교회 교역자 분과 교인 여러분에게 감사하고,<br>부담 스러울 수도 있는 친구인 저를<br>격려해 주고 함께 시간을 보내준 친구들에게 감사하고,<br>부족한 저와 함께 세계 최고의 학과를 만들기 위해<br>노력하고 계신, 그리고 앞에서 이끌어주시는<br>연세대학교 스포츠레저학과 교수님들에게 감사하고,<br>누구보다 저와 많은 시간을 함께 보내며<br>까탈스러운 나를 견뎌준 세계 최고 대학원생들에게 감사하고<br>누구보다 저를 믿어주고 격려해준<br>아내와 기준이 기현이에게 감사합니다.<br>2014년 새해에는 더욱 감사한 일들이 많을 것을 기대합니다.<br>모두 새해 복 많이 받으세요~~^^.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02u6QCg1WmJJmS1AxAAPAs7RYqHHjeXuUuRwoWKKXUFQhQ8M2VRvRqgxjQTsutmydkl?__cft__[0]=AZU-8-twke6jCBs3f2MKTZFyC9V6dU8dDQvQRDRPUMmEqzjabltnBlQx4NmeX3UlHX4ZD0YLOG6dOloXgUZL5woNfkWxgsthTTQ5H4brg2ngO7ICsNn0uo77HDxX_ctLyYzUlLJzFs-t1GE7MSbnytzY&__tn__=%2CO%2CP-R"}, {"id": 50, "date": "2014년 1월 1일", "year": 2014, "title": "응답하라 1994", "themes": [3, 9, 10], "content_html": "<p>응답하라 1994<br>지난 한 학기 기러기를 하며<br>주말에 나의 친구가 되어준 드라마다.<br>신촌을<br>연세대학을<br>우리 세대를<br>반영한 드라마<br>마지막 편은 아내와 함께 보았다.<br>마지막 편을 보면서 가슴이 먹먹해 졌다.<br>X 세대.<br>아날로그와 디지털을 동시에 경험한 세대<br>국가 부도 사태를 겪은 세대<br>우리 세대<br>장한 세대<br>내가 본 최고의 드라마~~!</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02vk4x1YfLYuCZfiHKUqeZSKFR6JiiZurZqGVCrXfnGmrWa6AZkhef6LwbMXGqnoXKl?__cft__[0]=AZWgD4je65KLK0E-thy11Rm8BbdPdqlumb6Jnlbgwr3aq3Jr6kNUnH34y102Fx-ZrZsGQDe-HG1GCD6uQMtxDnsWit49Rv6y4SDLGR4xeV2GEbIoc4e6qfb9wpnXPYbjdl41_sxIt7XTw4gXOdANrNCK&__tn__=%2CO%2CP-R"}, {"id": 51, "date": "2014년 1월 12일", "year": 2014, "title": "넓은 어깨! 떡 벌어진 가슴!", "themes": [7, 2, 3, 4], "content_html": "<p>넓은 어깨! 떡 벌어진 가슴!<br>그렇다. 많은 사람들이 나에게 넓은 어깨를 가졌다고 한다.<br>총각때는 나의 넓은 어깨를 보고 기대고 싶은 어깨라는 고백도 받아보았다.<br>나는 또한 큰 가슴을 가졌다.<br>대학교 2학년 때에는 큰 가슴을 무기로 미스터 연세 대회에도 나갔었다.<br>그런데, 미스터 연세 대회에서 8강이 겨루는 본선에 진출하지 못하고 떨어졌다.<br>이.유.는?<br>불균형적으로 큰 가.슴...이었다.<br>삼두 포즈를 잡아도 가슴.<br>이두 포즈를 잡아도 가슴.<br>활배근 포즈를 잡아도 가슴.<br>정말 가슴밖에 안 보였다고 한다.<br>지금도 가슴 근육하나는 젊은 20대에 뒤지지 않는다고 자부한다.<br>이런 가슴과 근육질 몸매를 갖게 된 이유는 ?<br>물론 요즘은 지방으로 덮여 있지만!<br>바로 여성형 유방 때문이다. 이유는 정확하게 모르지만, 혹시 중학교 1학년 때 앓게 되었던 B<br>형 간염이 아닌가 생각한다. B형 간염이 우리집에 돌았고, 나와 누나들은 간염을 앓게 되었다.<br>그리고, 눈이 노랗게 황달증세를 보이자, 절대 안정을 주장하며 의사는 나에게 모든 운동과 신체<br>활동을 금했다. 그리고, 빨리 병에서 낫게 하고자, 나의 어머니는 나에게 영양가가 많은 음식은<br>다 만들어 먹이셨다. 그 결과 나는 뚱뚱한 체형을 갖게 되었다. 그런데, 그 중에서도 유독 가슴<br>에 많이 살이 찌게 된 것 같았다.<br>수돗가에서 웃통을 벗은 모습을 본 친구들이 여자 가슴보다 크다고 놀렸고, 난 그럴 때마다 가슴<br>이 쳐진 모습을 보이기 싫어 운동을 했다. 고등학교 때에는 역도부에 들어가 운동을 했고, 특히<br>가슴 운동을 많이 했다. 큰 여성 형 가슴에 근육을 채워 넣는다고 생각하고 운동을 했던 것 같<br>다.<br>그러던 것이 지금도 마찬가지다. 한 2주만 운동을 쉬면, 나의 가슴은 다시 쳐지기 시작한다. 그<br>러니, 운동을 할 수 밖에! 가슴만 크면 너무 불균형하니까, 팔 운동도 하고, 어깨 운동도하고, 다<br>리 운동도 하고, 복근 운동도 하면서 40대 중반이지만 아직도 근력은 20대 부럽지 않게 유지하<br>고 있다.<br>나의 연약함이 나에게 준 선물이다.<br>Those of you who do not read Korean may wonder what these pictures are!<br>These picturese are from body building competition which I participated in 23<br>years ago.<br>Of couse I failed to proceed to the final round.<br>The reason was unbalanced body.<br>My chest was too big compared to other parts of my body!<br>The reason for my big chest is due to female type of boobs I have!<br>Even now, if I do not work out for about two weeks, I feel my chest sagging!<br>It is a signal for me to work out.<br>Female type boobs. The reason for big chest!<br>It was my weakness! But my weakness became my strength.</p>", "images": ["pdf2_page30_img0.jpeg"]}, {"id": 52, "date": "2014년 1월 17일", "year": 2014, "title": "사랑하는 성제야", "themes": [8, 3, 10, 4], "content_html": "<p>사랑하는 성제야<br>조금 전에 성제와 전화를 끊고<br>잠시 컴퓨터를 들어 몇 자 적는다.<br>성제를 처음 만난 게 안디옥 교회 친교실이었는데.<br>아마 그게 2000년 쯤 되나?<br>한 15년 전 쯤 되나보다.<br>그게 우리의 인연의 시작이었지.<br>다른 사람은 웃긴다고 할지 몰라도<br>나는 성제를 아들로 삼았었단다.<br>성제의 성공이 나의 기쁨이었고<br>성제의 아픔이 나의 아픔이었고<br>내 인생에서 통곡을 하면서 울었던 적이<br>한 세 번 정도 있었는데,<br>그중에 한 번은 너 때문이었단다.<br>원주민 선교를 준비하고 있었는데,<br>네가 많이 힘들어 하고 있었는데,<br>무슨 이유에서인지 너에게 다가가지 못하고 있던 나의 모습이<br>마치 아들이 배가 고파 죽게 되었는데<br>나는 아버지로서 너무 무능력하여<br>밥을 먹일 수가 없는 그런 상황으로 인식이 되었었다.<br>그래서 그냥 목놓아 울었었단다.<br>넌 몰랐을거야.<br>오늘 처음 이야기 하는 거니까.<br>그리고나서, 우리 집에 함께 살았었던 것 같다.<br>성제는 내게 정말 하나님께서 보내주신 선물이다.<br>‘성제’ 라는 이름 만으로도 나의 마음이 따뜻해 지니까!<br>그냥 만나서 아무것도 안 해도 그냥 좋으니까!<br>성제가 지금 병마와 싸우고 있지만,<br>그리고 이 싸움이 쉬운 싸움이 아니지만,<br>그거 아니?<br>이미 이 싸움은 우리가 이긴 싸움인 거야!<br>성제는 이 싸움을 잘 싸웠고,<br>그리고 지금도 잘 싸우고 있는거야~<br>하나님께서 성제를 기적같이 치유해 주실 수도 있고,<br>혹은 하나님께서 성제를 그분 곁으로 부르실 수도 있지만,<br>어쨌든 하나님이 성제를 사랑하시고,<br>그리고 성제를 위해서 최고의 삶을 디자인 해 놓으셨을 테니까.<br>성제가 보고 싶은데,<br>내가 너무 멀리 있구나,<br>목소리라도 들을 수 있을 때에,<br>얼굴을 볼 수 있을 때에 더 많이 볼걸,<br>이란 후회는 하지 않을께.<br>사랑한다 성제야!<br>고맙다 성제야!</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02fCKaC7pF1CdtM5B6LvJeEqS27y62DTJAnRzHArL7WyVkCvKLvP8fiQSbUojxvVYZl?__cft__[0]=AZW3fUZTeYXYMXbpweVp7kMsq91wdG0_R6fz5hyHAvcH3LEKuy3Noef0rds4Hd2Lj4T734m82RygQPcz3EmYhs_cdVGwq_BwYG7G3vbRYSpHsrkUGVRhv4kGLlUSbzkSMn5VdpFljjxwqINmk1Emqato&__tn__=%2CO%2CP-R"}, {"id": 53, "date": "2014년 1월 22일", "year": 2014, "title": "에드먼튼 대학병원 앞 팀 홀튼 Tim Horton!", "themes": [8, 10], "content_html": "<p>에드먼튼 대학병원 앞 팀 홀튼 Tim Horton!<br>와서 앉아 있는 것 만으로도 가슴이 벅차오르는<br>많은 추억과 기억이 고스란히 담겨있는 곳입니다.<br>나의 인생을 바꾼 하나의 질문!<br>어떤 질문을 던지는 가에 따라<br>인생이 바뀔 수 있다는 것을 깨닫게 된 질문<br>Why Not Edmonton?<br>이런 나의 질문에<br>하나님께서 Why not! if my people pray!<br>라고 말씀해주신지<br>17년이 흘렀네요.<br>Why not?<br>Why not!</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid034q8HA1FMu4XdUfFEwMyTexpsVQ7c2gCcYMJKgmPac8wmDfqvo5AQJ1RBZ6LHoLo1l?__cft__[0]=AZX7SmYt78DGQJ153UuLcZiM9SMJ6vK0Q7AaQ_FWJtW-hm2XQlWkLCp-JpXv6uImYP1uN63QKLN-O0db1qpI53QnXIbL8yeMdyEK8AxQUobR5066gQdsgS-WG8xXNRQLS_ehdoxn62VKY7cbWcFxykZW&__tn__=%2CO%2CP-R"}, {"id": 54, "date": "2014년 1월 30일", "year": 2014, "title": "여기 캘거리는 지금 눈이 내린다 .", "themes": [3, 10, 8, 4], "content_html": "<p>여기 캘거리는 지금 눈이 내린다 .<br>하늘을 보자하니 , 꽤 내릴 것 같다.<br>오늘은 문득 본지 꽤 오래된<br>영화가 한 편 생각이 난다.<br>오래 되었다고 해 봤자,<br>한 ... 한달 정도 된 것 같다..<br>나는 영화 보는 것을 좋아한다 .<br>영화를 통해서 인생을 보고,<br>내가 경험해 보지 않은 것을 느끼고 ,<br>영화를 보는 만큼은 세상의 모든 짐도,<br>세상의 모든 걱정도 ,<br>세상의 모든 힘듦이 사라지는 것을 느낀다 .<br>한 달 쯤 전에 아내와 함께<br>어바웃 타임이란 영화를 보았다 .<br>다들 로멘스 영화라고 , 꼭 봐야할 영화라고하기에<br>큰 기대를 가지고 , 기현이를 고모집에 맡기고 보았다 .<br>영화가 끝나고 엔딩 크레딧이 올라갈 때 드는 생각!<br>이게 다야?!<br>이건 로멘스 영화라기 보다는<br>인생의 철학이 담긴 영화였다 .<br>아버지와 아들의 사랑<br>남자와 여자의 사랑<br>그리고 무엇보다<br>인생을 어떻게 살아야 할 지에 대한<br>철학이 담긴 영화였다 .<br>그리고 , 영화를 보고 집으로 오면서<br>아내와 이야기를 나누었다 .<br>만약 내가 과거로 돌아가<br>나의 과거를 바꿀 수 있다면 ,<br>무엇을 바꿀 것인가 .....!<br>1989년 8월 1일<br>한강시민공원에서 내가 보트에 기름을 넣고<br>시동을 걸던 순간... 시동을 걸지 않았더라면 ,<br>(시동을 거는 순간 보트는 불이났고 ,<br>난 전신 화상을 입었다 )<br>1985년 봄<br>나보다 싸움 못하는 친구와 말다툼하다가<br>그 친구를 모독하지 않았더라면 ..<br>(욕을 하고 돌아서는 나는<br>그 친구가 휘두른 주먹에 맞아<br>턱뼈가 부러져 병원에 15일 간 입원했다 .<br>퇴원하기가 죽기보다 싫었다 )<br>1980년 학교 등굣길에<br>길을 건너며 오른쪽이 아니라 왼쪽을 먼저 보았더라면<br>(난 트럭 짐칸 고리에 턱을 꿰어 한참을 끌려갔다 ).<br>1991년 신체검사때<br>습관성 어깨 탈골을 까먹지 않고 이야기 했더라면 ,<br>(난 간염, 턱관절 이상, 전신화상 으로 삼급이 3개였고 , 어깨 탈골까지 이야기 했다면 군대 면제)<br>1989년 자살까지 생각했던<br>첫사랑의 열병을 시작하지 않았더라면 ,<br>내가 만약 ADHD 가 아니었다면 ,<br>내가 만약 공부를 더 잘했다면 ,<br>나의 부모님에 더 학력이 좋았다면 ,<br>나의 자녀가 더 똑똑했으면 ,<br>나의 자녀가 더 말을 잘들었으면 ,<br>이런 식으로 끊임없이 과거와 현재를 되돌아보며<br>.. 했다면 , 이라는 식으로 상상을 하다보니 ...<br>정말 이런 어려운 과거가 없었다면 ,<br>과연 나는 ‘나’ 일까?<br>바꾸었으면 할 정도로 어려운 과거<br>힘든 순간들이 없었다면 ,<br>나는 나일 수 없을 것이다 .<br>만약 나에게 기회가 주어진다고 하더라도<br>과거로 돌아가 바꾸고 싶은 과거는 없었다 .<br>내가 성공했다는 것이 아니라 ,<br>지금 생각하면 후회할 법한 모든 일들이<br>지금 생각해 보면 나에게 축복이었으니 말이다 .<br>마치 성경에 요셉의 이야기와 같다.<br>요셉이 자신의 형제들에 의해<br>이집트로 팔려가지 않았다면 ,<br>요셉에 보디발의 아내의 유혹을 이겨낸 댓가로<br>감옥에 가지 않았다면 ,<br>감옥에서 꿈을 해석해준 술맡은 관원장이<br>자신을 잊지 않았다면 ,<br>요셉은 이집트의 총리가 되어<br>그 지역일대를 가뭄으로 인한 굶주림으로부터<br>구원할 수 없었을 것이다 .<br>그래서 요셉은 형제들에게<br>‘나를 이곳에 보낸 것은 당신들이 아니라 ,<br>하나님입니다 ’ 라고 고백을 한 것이다 .<br>요셉은 바로 과거를 재해석 한 것이다 .<br>자신의 저주를 축복으로 바꾸어 해석을 한 것이다 .<br>그래서 어바웃타임이 이야기하는 교훈은 결국<br>과거를 가서 바꾸자가 아니고 ,<br>과거를 재해석하고<br>오늘 하루를 마치 두 번째 살듯이<br>현재 일어나는 모든 일을<br>긍정적으로 해석하고 살자는 이야기다 .<br>마치 현재를 살면서 과거를 살듯이 사는 것<br>이것이 바로 믿음인 것이다 .<br>과거에 아무리 힘이 들었던 일이라도<br>3도 화상의 치료로 거의 죽을 뻔한 고통도 ,<br>공부를 잘 못해서 우열반중 열반에 들어간 쪽팔림도<br>싸우다 맞아 턱뼈가 부러진 일생일대의 창피한 일도<br>정말 다시는 기억하고 싶지 않은 나의 실수도<br>지나고 보면 다 웃으면서 이야기 할 수 있는 것이다 .<br>웃으며 이야기 할 정도가 아니라 ,<br>오히려 나의 과거의 어려움을 통해<br>힘을 얻는 사람이 있으니 ,<br>이런 부족함과 연약함을 통해<br>오히려 하나님께서 영광 받으실 일들이 생기니<br>만약 내가 현재 내게 있는 어려움을<br>과거의 에피소드로 볼 수 있는 눈이 있다면 어떨까 ?<br>바로 이것이 믿음으로 산다는 것이 아닐까 ?<br>이런 믿음을 갖고 싶다.<br>난 오늘 아내에게 불편한 말을 하고,<br>혼자 스타벅스에 앉아 카레멜이 들어간 음료를 마시고 있다.<br>ㅋㅋ 후회하지 않도록 집에 들어가<br>수술 후 회복하느라 힘들어 하는 아내에게<br>따뜻한 말을 한 마디 전해야겠다 .</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid029ebYf69tsARDhdc8AipBWAReYXcTKfK5645LVTGUiHJiCdpcF1B1Aaw5YRm6X6FAl?__cft__[0]=AZWFcSqr0xQ3-8iAd9N1D8CNyt8SR8OXptEjHvIQ-9Mohuw53HUT1sTC9lBWVPT4TLuv0Ofo8cu3Qrn3CwGx0PNaPvZLreYKUHkowrLaSWecI1pJNrPoaqgEbBI30ScH3s-w_mLPehc5R7CcJToDzbVy&__tn__=%2CO%2CP-R"}, {"id": 55, "date": "2014년 2월 1일", "year": 2014, "title": "의사들은 나같은 사람을", "themes": [8], "content_html": "<p>Doctors define and categorize person like me as<br>Attention Deficit Hyperactivity Disorder<br>의사들은 나같은 사람을<br>주의력 결핍 과잉행동 장애라고 부르고 범주화 합니다.<br>그러나<br>BUT<br>God defines and categorizes person like me as<br>ADHD<br>Active,<br>Deligent<br>Highly-sensitive<br>Delightful<br>하지만<br>하나님은 우리 같은 사람을<br>이렇게 부르십니다<br>Active (활동적이고)<br>Deligent (부지런하고)<br>Highly-sensitive (다른 사람들의 필요와 감정에 민감하고)<br>Delightful (밝은 성격의 소요자)<br>라고 말입니다.<br>나는 자랑스러운 ADHD 입니다.<br>I am proudly ADHD!</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02jXPsG3x7KpBAaM6sv52gopXd7z7qtMDA6fppmK33efsG7DS7dzGpSd1nDBbzGvAfl?__cft__[0]=AZUx1ydEn294Dy7F5DNcd5-mhAWo_VU70Jzm0ryYA5OJBiP9XgSo8Q6zhsCd0oBpFWUAC5jVPyFCWfX5fLvgtbVzuMMaO8vXAjHe-CS--XD87S2CWjQrz0CIuBLjfG05tiTDQNa4q8JL28xzuNhl7dvi&__tn__=%2CO%2CP-R"}, {"id": 56, "date": "2014년 2월 6일", "year": 2014, "title": "당황스러운 일입니다 .", "themes": [13, 12, 9, 2], "content_html": "<p>당황스러운 일입니다.<br>아니, 황당한 일이지요.<br>어제 아침 7시에 미국 산타페에 가는 비행기를 탔어야 했는데,<br>캘거리 미국 이민국에 붙잡혀 있다가<br>입국을 거부당했습니다.<br>완전. 제 잘못입니다.<br>늘 미국비자가 있었기에,<br>그리고 늘 미국을 다녔기에,<br>아무 생각 없이 있다가<br>출국 7시간전에 그 사실을 깨닫고<br>미국 대사관에 입국신청을 했지만,<br>아마 그 시간에는 아무도 일을 하지 않았나 봅니다.<br>그래서....<br>참석했어야 하는 미국 산타페의 Keystone 학회를 가지 못했습니다.<br>비행기표를 바꾸려 했더니 2900불을 달라고 하네요.<br>만약에 우리 학생이 나같은 이유로 미국에 못갔다면,<br>이 병shoe 라고 했겠지요.<br>그래도 자학을 하지는 않으려고 합니다.<br>집에 일찍 돌아가 다시 아이들 학교를 바려다주고<br>스타벅스에 앉아 말씀을 묵상하며 어찌할까 하다가<br>계획을 급 수정하여<br>밴프에 있는 Keystone 학회로 왔습니다.<br>사실 주제는 비슷하긴 합니다.<br>여기는 Cell Signaling 과 Cancer Stem Cell 이 주제고<br>산타페는 Epigenetics 와 Cancer 인데요...<br>나를 기다리던 동우와 민석이는<br>산타페에 나 없이 있게 되었네요.<br>어쩌면 내가 그곳에 있는 것 보다 좋아할지도...<br>난 어차피 캘거리에 있었기에<br>진아와 상의하고 어제 바로 밴프학회로 왔습니다.<br>담당자는 원래 차액인 85불을 면제해 주고 등록을 바꾸어 주었네요.<br>와서 정말 영어 맞나 할 정도로 강연자의 내용을 이해하지 못하고 있습니다.<br>그래도, 가끔 알아 들을 수 있는 내용이 나오긴 하는데요,<br>듣고 또 검색하다보니 내가 생각했던 것 보다 훨씬 재미있는 분야이네요.<br>더욱 재미있는 것은 평소에 존경하는 종양내과<br>김태일교수님께서도 와 계시네요.<br>오늘은 점심도 함께 하면서<br>궁금했던 것 다 물어보며 장시간에 걸쳐<br>교수님을 질문으로 고문하고 있습니다.<br>동우와 민석이에게는 미안하지만 (괜히 고아를 만든 것 같은)<br>어쩌면 여기에서 더 많이 배우는 지도 모르겠습니다.<br>심지어는 포스터 발표까지 하게 해 주어<br>오늘 저녁에는 포스터를 붙여놓고<br>그 앞에서 한참 썰을 풀어야 하네요.<br>Cancer Stem Cell 과 WNT, NOTCH, Hedgehog signaling<br>이 주제인 학회에서<br>대장암 환자가 운동하니 인슐린 떨어지고 당뇨지표들이<br>좋아졌다는 발표를 하자고 하니 쌩뚱맞고 또 쪽팔리기도 하지만,<br>What the heck 뭐 여기 있는 분들은 운동을 잘 모르니,<br>그냥 썰을 풀면 아마 다 그냥 믿을 껄요?<br>밖에 보이는 밴프 경관이 놀랍습니다.<br>하지만 영하 23도인 밖에 나가고 싶지는 않네요.<br>나의 실수가 부른 엉뚱한 해프닝을 즐기고 있습니다.<br>난 이렇게 실수도 많고, 모자른 사람입니다.<br>전라도 사투리로 모질이 (모지리) 라고 하나요~~^^<br>나는 A.D.H.D입니다.<br>A: Active, D: Diligent, H: High sensitive, D: Delightful</p>", "images": ["pdf2_page37_img0.jpeg"]}, {"id": 57, "date": "2014년 2월 11일", "year": 2014, "title": "진아는 제 아내입니다 .", "themes": [3], "content_html": "<p>진아는 제 아내입니다.<br>그런데 저의 베프 (Best friend) 이고도 합니다.<br>거의 모든 여가 시간을 함께 하지요.<br>Jina is my wife<br>But, she is more than just my wife, she is my best friend.<br>We spend most of my free time together<br>많은 대화와 사랑을 나누지요.<br>We share love and also our emotion.<br>그래서 떨어져 있는 것이 더욱 힘든 일인가 봅니다.<br>앞으로 한 두 달간은 또 롱디 관계가 되네요~~<br>That is why it is much harder to be apart<br>We will have a long distance relationship for next few months<br>그래서 제 큰아들에게 이야기 했습니다.<br>That is why I told my older son, David<br>내 아내를 돌려도~~~<br>I need my wife back!<br>그래서..<br>올 여름에는 한국으로 돌아올 예정입니다.<br>She will be back to Korea this summer!<br>\"남편과 아내가 함께 하니, 하나님이 보시기에 좋았더라\"<br>\"It is good for husband and wife to be together“</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02oBorpEum16cVNFi1mfTtchNV4jpkPCxzyc56zM1MvPNZRT3NPqcRmnb8QrnhGroql?__cft__[0]=AZV8f91PXaYkNIYPhsbGkaiRNR6Ooc-IdZsp57oxSb6zI0fGkhAV3nLjZsxOmw05m708xYc91nW4CrvUQlqjYvMDWAGMisjTzpH1iFEnt6nslhhBNeEthQcZ_lhvhUTM0iszFgndOx9DvNVbAd9mDmaa&__tn__=%2CO%2CP-R"}, {"id": 58, "date": "2014년 3월 11일", "year": 2014, "title": "참 어리석었습니다 .", "themes": [8, 7, 1], "content_html": "<p>참 어리석었습니다.<br>하나님께서 제게 맡겨주신 일인데<br>하나님께서 제게 부탁하신 일인데<br>마치 제가 잘 나서 그일을 하는 줄 알았습니다.<br>참 어리석었습니다.<br>하나님께서 제게 부탁하신<br>하나님께서 제게 맡겨주신 너무 귀한 존재인데<br>그냥 제가 함부로 대해도 되는 줄 알았습니다.<br>돈 몇푼 쥐어주면<br>내 사람이 되는 줄 알았습니다.<br>교수라는 직위로<br>윽박지르고 위에서 누르며<br>사랑으로 지도한다고 착각하고 살았습니다.<br>힘들다고 하면<br>난 더 힘들었다고 하고<br>어렵다고 하면<br>어려운 것을 극복해야 성장한다고 하며<br>죽을 것 같다고 하면<br>맨탈이 안 좋다고 정죄했습니다.<br>조금 일이 잘되면<br>목에 힘이들어가고<br>일이 꼬이고 안풀리면<br>다른 사람을 원망했습니다.<br>아~~<br>난 언제쯤 겉과 속이 일치할까요?<br>나의 겉이 속만큼 썩고 주름져야 겉과 속이 같아지까요?<br>겸손 Humility<br>깨어짐 Brokenness<br>취약함 Vulnerability<br>성결 Purity<br>이 네가지가<br>앞으로 교회와 한반도에 주신<br>하나님의 네가지 열쇠라고 떠들도 다니면서도<br>그것이 나의 겸손<br>나의 깨어짐<br>나의 vulnerability<br>그리고 나의 성결인줄 착각했었습니다.<br>그것은 애초부터<br>주님의 겸손<br>주님의 깨어짐<br>주님의 vulnerability<br>주님의 성결이었습니다.<br>나는 애초부터<br>겸손할 수 없는 사람이고<br>깨어지고 깨어져도 깨어지길 거부하는 사람이고<br>Vulnerable 하다고 하면서도<br>누군가 그 부분을 건드리면 화부터 내는 모자라는 사람이고<br>원래 성결과는 거리가 먼 사람인것을<br>오늘 다시 한 번 깨달았습니다.<br>기도하는데<br>떠오르는 여러 얼굴들<br>그 앞에 정말 무릎꿇고 용서를 구하고 싶습니다.<br>주님 앞에 정말 죄송합니다.<br>이런 부족한 사람때문에<br>힘들어하는 많은 이들에게 위로를 전합니다.<br>민망하지만,<br>죄송하지만,<br>바리새인과 서기관들을 책망하시다가도<br>어미닭이 새끼닭을 날개 아래 모음같이<br>예수님께서 저들이 주님 앞에 나오길 기다린다는<br>좋은 소식을 믿고<br>오늘 다시 주님의 품안에 들어가길 사모합니다.<br>그안에서 다시 회복하고 살아날 수 있기를 사모합니다.<br>그 주님의 품안에 안깁니다.<br>주님의 겸손, 깨어짐, 취약성 그리고 순결함<br>그 안으로 들어가 안식할 수 있기를 간절히 사모합니다.<br>샬롬!</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0256k8ND5J61B6Lhc8zW1JRAMeYDhfS1okxrzvxezgJ2QC6RHdgczKyXRusBCoBKHpl?__cft__[0]=AZV6Os8YR3ya8RRJVn5XTUVqKIZ8oRAGJNCrVczTXsP90qeT8fg7rG38SqRNrT3-J6Frk9ZfSKas9oyPK6SYBnwGIS0TECAGTTBUohjAbB8w4433PFlb-LKU5E_fGGfctZ0i-Xgt9oQTfAvhJSfZptWZ&__tn__=%2CO%2CP-R"}, {"id": 59, "date": "2014년 3월 14일", "year": 2014, "title": "1996년 아틀란타 패랄림픽", "themes": [11], "content_html": "<p>1996년 아틀란타 패랄림픽<br>카페에 앉아서 차를 마시다가 소아마비 여자분 한 분을 만나뵈었습니다.<br>같은 한국 분인 것이 신기해 인사를 드렸었죠<br>그리고 그날 저녁 다시 그분께 전화를 받았습니다.<br>IPC 위원장에게 한국인 대학원생이 있다는 것을 듣고<br>꼭 만나고 싶었다고.<br>그래서 그날 바로 그 분을 뵙고 이야기를 나누다 보니<br>제 유치원 (파랑새유치원) 동창 성훈이 어머님이란 것을<br>알게 되었습니다.<br>우리 사이에는 '정립회관 아줌마' 로 통했었죠!<br>그리고, 그 분은 제게 파란색으로 된 파일을 전해 주셨습니다.<br>읽어보라고.<br>전 그 파일을 읽으며 충격과 감동에 빠졌습니다.<br>1970년대, 80년대까지<br>한국에서 장애인이란 이유로<br>공무원 시험 자체를 볼 수 없고,<br>고등학교에서 입학을 거부당하고,<br>의대를 합격해 놓도고 입학을 거부당하고,<br>사법고시를 패스 했음에도 불구하고 발령이 나지 않았다는 사실을<br>저는 그때 처음 알았습니다.<br>그런 사실을 몰랐다는 것에 스스로 챙피했고,<br>이런 일들이 내가 사는 시대에 있었다는 것에 분노했고,<br>그런 일이 있을 때마다, 그 일선에 황연대 선생님께서 있었다는 사실에<br>너무 감사했습니다.<br>소아마비장애인들을 위해서 세워진<br>정립회관에서 밤샘데모를 하고,<br>대통령에게 편지를 쓰고,<br>기자들을 모아 기자회견을 하고,<br>김수환 추기경을 찾아가 카톨릭의대 입학거부문제를 해결하고,<br>그리고.....<br>그런데, 놀랐던 것은<br>이런 분의 이름으로된 상이 IPC 에 존재한다는 것이었습니다.<br>황연대 성취상 (당시는 황연대 극복상)<br>패랄림픽의 패막식에 순금 75그람 (두냥)으로 만든 메달은<br>남자 한명, 여자 한명에게 준다는 것이었습니다.<br>그런데, 그 사실만 정해졌을 뿐,<br>어떠한 것도 아직 정해지지 않은 상황..<br>제가 그 상의 행정을 갑자기 맡아 운영을 하게 되었죠.<br>그리고, 이런 분을 기리며,<br>이상을 통해 장애인들에게 새로운 힘과 꿈을 줄 수있는 일이라면,<br>내가 정말 최선을 다해서 도와야 겠다고 결심했습니다.<br>이게, 18년 전의 일이네요.<br>그동안 많은 선수들을 만나고 (하계 평균 80명, 동계 평균 25명 추천)<br>그들을 인터뷰하고<br>그리고 IPC 회장, 부회장들과 회의를 하고<br>상의 여러 규정을 만들고,<br>무엇보다 상의 수여를 위해 필요한 재정을<br>기업에서, 혹은 시에서, 혹은 장애인 체육회에서<br>혹은 개인들에게서, 혹은 없으면......<br>정말 어떻게 지금까지 해 왔는지,<br>기적이라고 밖에<br>그리고 여러분들의 관심과 도움의 결과라고 밖에 할 수 없는<br>한 번 상을 운영할 때마다 약 3-4000 만원가량 돈이 드는데...<br>상의 전반을 운영하다보니 많이 어려울 때가 있습니다.<br>여기 저기 도움을 요청하다 보면, 치사하게 느껴지기도 하고요,<br>IPC 와 혹은 조직위원회들과 협의를 하다보면 화가치밀어<br>2004년도에는 거의 심장마비 직전까지 가기도 하고요,<br>그런데, 선수들을 만나 그들의 이야기를 듣다보면,<br>정말 놀라운 감동의 스토리를 듣다보면,<br>눈물을 흘리며 저들을 인터뷰하다보면,<br>'내가 정말 잘하고 있구나' 라는 생각을 하게 됩니다.<br>이번에는 상을 받는 네델란드의 비비안이란 선수는<br>27살에 골육종으로 다리를 절단하고<br>4개월만에 다시 스노우보드를 타기 시작하고,<br>암이 폐로 전이했음에도<br>수술을 받으며 포기하지 않고 계속 운동을 하고,<br>패라 스노우보드를 보급하고 선수를 육성하기 위해<br>자신의 시간과 돈을 들여 후진양성에 힘을써<br>자신이 키운 선수 5명이 패랄림픽에 참여하고<br>43세인 스노우보드 선수로서는 고령의 나이에<br>세계 랭킹 1위로서 여기 소치에 참여했네요.<br>더 많은 사회에 기여를 하기 위해<br>재단을 만들어 운영하는 그녀...<br>정말 '황연대 성취상'을 받기에 충분한 자격을 갖추었죠!!<br>이런 분들을 인터뷰하고 만나는 것은<br>이상을 운영하면서 얻은 가장 큰 축복입니다.<br>이 상의 시작이 88서울 패랄림픽인데,<br>우리가 유치한 평창은 2018년이니<br>정확하게 30년 만에 한국에 돌아옵니다.<br>소박한 꿈이 있다면,<br>지난 30년간 이상을 수상한 분들을<br>찾아가 그 삶의 스토리를 발굴하고,<br>타큐멘타리 영화를 만들고,<br>그 스토리를 IPC 와 함께 책으로 출간하고 싶습니다.<br>그래서 2018년 평창 폐막식에 이들을 모두 초대하면 어떨까요?<br>팔과 다리가 마비되었지마 나보다 빠르게 수영하는 스웨덴의 David Lega, 이 친구는 성취성을<br>계기로<br>스웨덴의<br>국민적<br>영웅이<br>되고<br>나중에는<br>변호사가<br>되었지요<br>http://www.davidlega.com/en/<br>절단된 다리를 가지고 패랄림픽 뿐 아니라 올림픽에 나가 세계 10위를 한 Natali De Natalie<br>du Toit - Swimming - Paralympic Athlete<br>척수손상 장애인으로서 피부암 투병중에도 치료를 받아가며<br>미국의 아이스슬레지하키 주장으로 팀을 이끌어<br>토리노 대회에서 동메달을 목에 걸었던 Lonnie Hannah<br>이들의 이야기를 세상에 소개하고 싶습니다.<br>정말 이들이야 말로 True Achiever 라고 하고 싶습니다.<br>저는 제가 처음에는 이 상을<br>그리고 황연대 선생님을 돕는다고 생각했습니다.<br>그런데, 이 상은 여러 모로 저를 돕고 있었습니다.<br>소치에서<br>http://www.youtube.com/watch?v=WFx5lp159mU</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02ztDpoDKk2uZdiS7BfdXfKZ73D7c9ViVSNWtGqzD5x5HELx3WXDQTTyh7W2RwHnEpl?__cft__[0]=AZXHifdpt9RDv40fGHbf-_RHsFhPp3nosCFAtmyXq-RQrjbU_vGiGfICEeDZKg3Zf6jWKeHqbWABtwegdvQrHSnIz0prKk47Cs8CWYdxd_M0ue0mkERrNAUN3kMjKeB90jZQdDaEsGSwa6iy4dWB0_nv&__tn__=%2CO%2CP-R"}, {"id": 60, "date": "2014년 4월 6일", "year": 2014, "title": "만남!", "themes": [3, 10, 5, 8], "content_html": "<p>만남!<br>누군가를 만난다는 것은 빅뱅이다.<br>수십만 시간을 전혀 다른 삶을 살아온 한 사람 과<br>또 다른 전혀 다른 사람을 살아온 한 사람이<br>충돌하는 것!<br>수많은 사람을 만나<br>마음을 주고 받으며<br>사랑을 주고 받으며<br>상처를 주고 받으며<br>말로 상처를 주기도 하고<br>말로 상처를 받고도 하고<br>표정으로 상처를 주기도 하고<br>표정으로 상처를 받기도 하고<br>때로는 잊을 수 있을 정도의 상처<br>때로는 평생 잊을 수 없는 상처<br>극복하여 성장의 디딤돌이 되게 하는 상처<br>넘어져 힘들게 만드는 걸림돌이 되게 하는 상처<br>상처를 겪으며<br>성격을 만들고<br>인성을 만들고<br>세상과 반응하며 살아간다.<br>전혀 다른 인생이<br>함께 사랑하며 살아간다는 것<br>서로 싸우되 죽이지 않고 (영적, 정서적)<br>살아간다는 것<br>그건 기적이다.<br>누군가를 사랑한다는 것은<br>자신의 마음을 열어준다는 것<br>상대방으로 하여금<br>내 마음 깊은 곳에 들어와<br>나의 감정을 건들여도 좋다는 것<br>하지만, 그로 말미암아<br>썩은 냄새가 나올 때엔<br>스스로도 당황하고<br>상대방도 당황하고<br>서로의 악취에 당황하고<br>서로를 멀리한다.<br>하지만,<br>‘사랑은 자신을 취약하게 내어주는 것’<br>'Love is making oneself vulnerable'<br>이란 사실을 이해한다면,<br>악취가 나온 후에는<br>향기가 나올 수도 있다는 것을 안다면<br>서로의 악취를 참아주고<br>그 냄새가 지나가도록 기다려 준다면<br>물론 또 다른 악취가 있겠지만<br>함께 그 시간을 견뎌낸다면<br>그 두 사람의 화학 작용은<br>세상에서 가장 향기로운 향기를 낼 것이다.<br>사랑의 묘약은 악취를 향기로 바꾼다<br>사랑은<br>상대방을 억지로 바꾸려 하지 않는 것<br>그냥 바라봐 주고,<br>참아주고,<br>기다려 주는 것<br>그래도 변하지 않을 땐,<br>그땐, 그 사람의 허물을 있는 그대로 받아주는 것,<br>그 허물을 받아주고 보면,<br>허물은 아름다움으로 변해있는 것을 깨닫는 것,<br>주고 주고 또 주고도<br>혹시 상대방에게 부족한 것이 없는 지 돌아보는 것<br>그렇게 우주와 우주가 만나<br>서로를 자신의 우주로 바꾸려 하지 않는다면,<br>우리를 만드신 분의 우주 안으로 함께 들어간다면<br>새로운 우주가 또 하나 탄생한다.<br>바로.<br>가정이라는 우주<br>그곳은 사람들이 찾아와 쉼을 얻는<br>기쁨과 삶의 가치를 찾는<br>아름다움과 견딤과 소망이 함께 교차하는<br>새로운 곳!<br>그래서 사랑은 할 만한 가치가 있나 보다<br>그래서 행복한 결혼은 아름다운가 보다<br>나루세의 결혼식이 있는 부산에 기차를 타고 가면서...</p>\n<p>•<br>1<br>활동 중</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02jzv5j89KGiETMNoszSK2LTdGDCVZyAxMp1zLx9iHoyciBXEtCgCpzJmK9UamNh2ql?__cft__[0]=AZVvDT899AyLX2tnAoH3bBox5TYBK91xJ0-1vkFhXu52TywvYNbG4FRNk2hJmj5nOoT45iuC7tCH99EStLe0iJFNFOOVSItCYYqivqzaUx-cXVgTVDyrTe4CFrpPyatZRvdum8tSwX1gy0VSoSgXOcjK&__tn__=%2CO%2CP-R"}, {"id": 61, "date": "2014년 5월 8일", "year": 2014, "title": "영어 논문 작성법 특강을 하려고 합니다 .", "themes": [13, 9], "content_html": "<p>영어 논문 작성법 특강을 하려고 합니다.<br>우리 대학원생들 9명과 함께 미국에 있는 학회에 가려고합니다.<br>비행기 값이 겁나 비싸네요~~^^.<br>그래서, 학생들과 논의하다가<br>영어 논문 작성법 특강을 하기로 했습니다.<br>이번 특강을 통한 수익의 100%는 대학원생들<br>학회 참가비용으로 사용되어집니다.<br>요사이 각 대학에서 영어로 논문을 작성하게 하고<br>SCI 논문을 필수로 요구하는 곳이 늘어나고 있는데요,<br>제가 지난 10년간 연세대학교에서<br>영어논문작성법강의한 내용을 집대성 하려고요.<br>그리고, 지난 20년간 영어 논문을 쓰고<br>투고하고, 재투고하면서 생긴 자료들을 공유하려고요<br>그리고, 엑기스를 뽑아 학생들에게 가르치려고요.<br>제가 교수생활을 하다보니,<br>많은 해외 SCI 혹은 SCIE 급의 논문을 개제하고<br>또 수 없이 많은 논문을 심사하고,<br>또 일부 SCI급 논문의 editorial board member,<br>그리고 최근에는 International Journal of Endocrinology 의<br>guest editor 로서 논문 한 권을 펴낸 경험들을 전수하려고 합니다.<br>영어로 논문을 쓰려고 하는 학자분들 (대학원생, 연구원, 교수님) 을<br>전공을 불문하고 환영합니다.<br>일시는 5월 24일 토요일 1시부터 5시까지 합니다.<br>장소는 연세대학교 스포츠과학관 302호 고요<br>비용은 일인당 5만원 (교재와 간식포함) 입니다.<br>인원은 선착순 80명으로 제한합니다.<br>영어 잘 못해도 괜찮습니다.<br>참가 신청은 이메일 urspecial@yonsei.ac.kr 로 해주시거나<br>제가 쪽지를 보내주시기 바랍니다.<br>그리고, 제 친구분들은 이 소식을 share 해 주시면,<br>관심있고 또 필요한 분들이 더 참여할 수 있겠죠~~^^,</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid03dEX6k1vbvBFWC3bKSB5k8FYBa5jh2jrsx7iMzj9c1iwqWiWZTG7fq4qgU8aTtMbl?__cft__[0]=AZUPbVMGPdvG5XG6vVxVutaC8pvr48GsHrdsbMOmHywPnYF31XuR_3YBQOKCto9vYpfTWmJbCaFLlVQTxCWUgRrLbuHp5H7Z42p_av9BwrHyBZ7DH6HwzJ6khMvriAbxsBo7htn005mnDSM5QM2I5AxV&__tn__=%2CO%2CP-R"}, {"id": 62, "date": "2014년 5월 10일", "year": 2014, "title": "어린이날 vs. 어버이날", "themes": [3, 16, 4, 1], "content_html": "<p>어린이날 vs. 어버이날<br>전 올해 최고로 우울한 어린이날을 보냈습니다.<br>\"너무 좋은 날씨의 어린이 날,<br>길거리 밝은 웃음 속의 어린이와<br>아이의 손을 꼭 잡은 부모님의 흐뭇한 표정<br>아이의 해맑은 웃음을 보며 저절로 지어진 미소<br>떠오르는 캐나다의 기현이와 기준이<br>그리움으로 사무치는 가슴\"<br>어린이날 우울했던 이유는<br>우리 부모님이 나에게 어린이날 용돈을 주지 않으셔서가<br>아니었습니다....<br>나도 우리 애들이 옆에만 있다면,<br>더 많이 사랑해주고, 아껴주고, 재미있게 해줄 자신이 있는데,<br>그 사랑을 배풀 아이들이 지금 옆에 없는 거죠....<br>우울해 지는 거죠...<br>그렇게 우울하게 어린이 날을<br>대신 사랑하는 우리 대학원생들과 논문을 쓰며 보냈습니다.<br>그리고, 이어 다가온 어버이날.<br>정말 다 망가진 거의 수십년된 전화기를 쓰시는 부모님을 생각하며<br>두 대의 무선전화기가 함께 있는 전화기를 사들고,<br>제과점에 들려 카네이션이 올려 있는 케익을 사서,<br>오래 간만에 이쁜 카드에 두 분을 위해 정성스레 글을 쓰고<br>얼마 안되지만 용돈을 넣어<br>함께 케익에 촛불을 끄며 함께 서로의 사랑을 확인하며 웃었습니다.<br>그런데, 차마 어버이의 노래를 부르진 못했습니다.<br>지난번 어버이의 노래가 스승의 노래로 끝나버린<br>황당함 때문만이 아니라,<br>차마 울컥할 것 같아서...<br>아직 건강히 계신 두분<br>부쩍 많이 서로 싸우시면서도<br>서로를 더욱 사랑하고 더더욱 의지하시는 두분<br>요즘 허리 아파 아무것도 못하겠다시면서도<br>하루 세시간씩 운동하시는 어머니,<br>기억력이 나빠졌다고 하시며<br>치매로 행여나 자녀들 고생시킬까봐<br>기억력 좋아지는 약을 샀다가 어머니에게 잔소리 들으신 아버님<br>케익 한 번 사들고 가면<br>그렇게 좋아하시는 부모님을 바라보며,<br>함께 밥을 먹을때마다,<br>'이렇게 함께 먹으니 밥이 훨씬 맛있다' 라며<br>몇번이고 이야기 하시며 좋아하시는 어머니,<br>'바쁜일 없으면 와서 밥먹고 가라' 고 늘 말씀하시는 아버지<br>자식을 향한 사랑을 어떻게 표현할지 몰라<br>자꾸 내 밥그릇에 음식을 올려놓으면,<br>살찐다며 짜증내는 불효자의 모습...<br>그래도, 나에게 베풀어주신 부모님의 사랑에 비교할 순 없지만,<br>조금이나마 나의 사랑을 표현할 수 있었던<br>어버이날은 행복한 날이었습니다.<br>사랑은 역시 받는 것 보다 주는 것입니다.<br>하지만, 때로는 가만히 다른 이로 하여금<br>나를 향한 사랑을 표현할 기회를 주는 것 역시<br>사랑인가 보네요<br>특히 부모님들에게는<br>두분 정말 오래 오래 건강하게 사셨으면 좋겠습니다.</p>", "images": ["pdf2_page50_img0.jpeg"]}, {"id": 63, "date": "2014년 5월 24일", "year": 2014, "title": "오늘 여러 분들의 도움으로 감사하게 영어논문 작성법 특강을 마쳤습니다", "themes": [6, 9, 13, 4], "content_html": "<p>오늘 여러 분들의 도움으로 감사하게 영어논문 작성법 특강을 마쳤습니다. 도와주신 이철원, 원<br>도연 교수님께도 감사드립니다. 또한 오늘 세미나를 위해 정말 고생 많이 한 Dong-Woo Derek<br>Kang Hyuna Park 그리고 우리 연구실 식구들에게도 진심으로 감사를 드립니다.<br>오셨던 분들에게 부디 유익한 시간이었기를 바랍니다.</p>", "images": ["pdf2_page47_img0.jpeg"]}, {"id": 64, "date": "2014년 5월 29일", "year": 2014, "title": "이번 여정의 첫번째 공동 세미나를 성공", "themes": [9, 8, 13], "content_html": "<p>We have just completed wonderful first day of seminar series at Dana Dana-Farber<br>Cancer Institute, Harvard Medical School!<br>I was so proud of my graduate students.<br>이번 여정의 첫번째 공동 세미나를 성공<br>적으로 끝냈습니다. 대장암과 유방암 그<br>리고 암 역학 분야의 대가들인 Dr.<br>Meyerhardt, Ligibel 그리고 Edward<br>Giovannucci 교수님들과의 재미 있고<br>알찬 세미나였습니다.<br>우리 대학원생들과 연구원들이 정말 자랑<br>스러운 시간이었습니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0w5wq9evUwm7WmRdN1886zCjHSA3xU3gzWNQXABRWWM9M2WHYsLRfVLRdgxvb4rBYl?__cft__[0]=AZV89sBmsNufZ79ffQPYuDXbca_ZERMonmCVKdHZ2YrQR4Xo0z12dRsX4Xc4YcLfGezVgyeB8LXgTL2mAk3vWFvZLEr5QaJsaBYFnq1Wl2hc62kzJNXQtD-QGLwPCqYZL1MyO3Fy5-iOG9sQrl6mfGBR1KxQB4wTmaJgrU6e0C4opg&__tn__=%2CO%2CP-R", "images": ["pdf2_page47_img3.jpeg"]}, {"id": 65, "date": "2014년 6월 1일", "year": 2014, "title": "미국 암학회에서 멋지게 발표해버린 우리 학생들과 ...", "themes": [13, 9], "content_html": "<p>Good poster presentation by my students at ASCO<br>미국 암학회에서 멋지게 발표해버린 우리 학생들과...</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0w5wq9evUwm7WmRdN1886zCjHSA3xU3gzWNQXABRWWM9M2WHYsLRfVLRdgxvb4rBYl?__cft__[0]=AZV89sBmsNufZ79ffQPYuDXbca_ZERMonmCVKdHZ2YrQR4Xo0z12dRsX4Xc4YcLfGezVgyeB8LXgTL2mAk3vWFvZLEr5QaJsaBYFnq1Wl2hc62kzJNXQtD-QGLwPCqYZL1MyO3Fy5-iOG9sQrl6mfGBR1KxQB4wTmaJgrU6e0C4opg&__tn__=%2CO%2CP-R", "images": ["pdf2_page48_img0.jpeg"]}, {"id": 66, "date": "2014년 6월 2일", "year": 2014, "title": "사랑에도 타이밍이 있나요 ?", "themes": [3], "content_html": "<p>사랑에도 타이밍이 있나요?<br>좋은 만남이란 완전하지는 않지만<br>스스로 행복할 수 있는 한 사람과<br>또 다른 한 사람이 만났을 때에 가장 아름다운 만남이 된다.<br>때로는 스스로 행복하지 않고,<br>스스로 만족하지도 못하는 사람이,<br>‘사랑하는 사람을 만나면, 나도 행복해 질수 있다‘ 는<br>생각을 가지고 연애를 시작해<br>서로 상처만 주고 끝나는 경우가 많다.<br>그러나, 또 다른 한 사람의 사랑이<br>다른 사람의 모든 허물을 덮어줄 수 있을<br>정도로 클 때에,<br>완전하지도 않고 상처투성이었던 사람이 치유되어지고<br>서로를 통해 행복해 질 수 있는 관계가 되기도 한다.<br>그러나, 또한 반대로<br>완전하고 스스로 행복한 사람들 둘이 만나서<br>서로를 힘들게 하고 불행하게 만들 수도 있다.<br>따라서, 성공적인 연애를 위해서<br>좋은 사람을 만나는 것도 중요하지만,<br>우리 자신이 좋은 사람이 되는 것이<br>더욱 중요할 수 있다고 하겠다.<br>그리고 더욱 중요한 것은<br>사랑하는 사람과 내가 만나서<br>둘이 서로에게 어떤 영향을 미칠 것인가?<br>그리고 둘의 만남이<br>다른 사람들에게 어떤 영향을 미칠 것인지 역시 생각해 봐야 한다.<br>따라서, 아름다운 연애, 성공적인 연애,<br>행복한 연애를 위해서 누구를 만나는가와<br>또 내가 그 사람에게 어떤 사람이 될 것인가?<br>그리고 우리는 어떤 커플로 세상에 영향력을 줄 것인가와 더불어<br>그 사람과 언제 얼마나 빨리 관계를 발전시켜 나아갈 것인가 역시 중요하다.<br>내가 아는 한 사람은<br>자신이 가르치는 고등학교의 한 제자와 결혼했다.<br>이 두 사람은 수 십년 째 행복한 가정을 꾸리고 살고 있으며,<br>주위 사람들의 모범이 되고 있다.<br>어찌 보면, 제자를 사랑한 교사,<br>그리고 교사를 사랑한 여고생으로<br>사회의 지탄을 받을 수 있는 모습이기도 하지만,<br>이 두 사람은 서로를 향한 사랑은 감추고,<br>속으로 아름답게 지켜 오다가,<br>여고생이 졸업하고,<br>대학생이 돼서야 만남을 시작했다.<br>그리고 그 사랑은 아름답게 발전하여,<br>극기야 결혼까지 이르게 된 것이다.<br>만약에 이 두 사람이 모 핸드폰 회사의 광고와 같이<br>“생각대로 해” 를 외치며,<br>교사와 학생의 신분으로 연애를 시작했다면,<br>원조 교제와 변태의 소리를 들으며,<br>사회적으로 매장이 되었을 것이다.<br>우리는 서로 사랑한다고 하더라도<br>보다 발전된 관계를 위해,<br>그리고 서로를 위해 내려 놓을 줄 도 알아야 한다.<br>혹자를 이렇게 이야기 할지도 모르겠다.<br>“그렇게 내려 놓았다가,<br>그 사람이 다른 사람을 만나면 어떻게 하죠?<br>당신이 책임질 건가요?”<br>내 생각에는 관계를 내려 놓았을 때에<br>그 사람이 다른 사람을 만나 당신을 떠났다면,<br>그 사람은 당신과 만나서는 안되는 사람이었을 것이다.<br>안되는 관계를 붙들어 두려고,<br>사정하고, 머리를 굴리고, 심지어는 죽겠다고 협박할 때에<br>그 관계는 서로를 힘들게 할 뿐만 아니라,<br>주위 사람들 마저 힘들게 한다.<br>그러나, 관계를 내려 놓았을 때에,<br>오히려 적절한 타이밍 가운데<br>그 사람을 만나 사랑을 이룰 확률은 오히려 높아질 것이다.<br>내가 아는 또 한 사람은 나이 차이가 상당히 나는 커플이다.<br>남자와 여자 모두 상당히 많은 나이 차이를 극복하고<br>서로 사랑하는 사이가 되었다.<br>그러나, 여자의 집은 절대 반대를 외치며<br>유학하고 있는 딸이 있는 곳으로 아버님이 비행기를 타고와<br>서로 사귀지 말 것을 권유하였다.<br>그러나, 두 사람은 서로를 향한 사랑을 접을 수 없었고,<br>결국 그 아버지는 유학하고 있던 딸을 데리고<br>한국으로 돌아가 버렸다.<br>그리고, 얼마 후 그 여자는 다른 사람을 만나 결혼을 하였다.<br>그리고 그 남자 역시 또 다른 여자를 만나 결혼하여 가정을 꾸렸다.<br>지금 생각해 보면, 만약 저들이 잠시 자신의 사랑을 내려 놓고,<br>부모에게 순종하였으면 어떻게 되었을까 생각해 본다.<br>서로에 대한 확신을 가지고 있다고 하더라도,<br>잠시 자신의 마음을 내려놓고<br>최고의 타이밍을 기다려 보았다면 저들의 관계가 어떻게 되었을까?<br>또는 반대로 내 주위에는<br>서로를 향한 사랑의 타이밍을 놓치고<br>오랫동안 힘들어 하다가 첫 만남을 가지고 서로 사랑을 고백한지 15년 만에 다시 만나 결혼한<br>커플도 있다.<br>그들은 주위의 헤어짐의 권유를 듣지 말고,<br>그때 서로의 사랑을 발전시키고 결혼을 했어야 했었다.<br>15년이란 시간동안 그 여자는 한 번의 결혼의 실패를 경험했고,<br>많이 힘들었고, 그리고 그 여자만큼이나<br>그 남자는 더욱 힘들어 했다.<br>물론, 이 사랑의 이야기는 15년이 지난 후에야<br>서로 사랑하는 가운데 양가의 축복을 받으며 결혼하게 되었지만,<br>내가 보기에는 사랑의 타이밍을 한 번 놓친 것에 대해<br>너무 큰 대가를 치룬 것 같아 안타깝다.<br>이렇듯, 사랑에는 타이밍이 있다.<br>더욱 행복하고 아름다운 연애를 위해서는<br>‘사랑하면 모든 것이 해결되어질 것이다’ 라는<br>막연한 믿음이 아니라,<br>자신의 현재의 모습과 상황<br>그리고 상대방이 현재 처한 상황을<br>냉정하게 바라보고, 타이밍을 분별하는 것이 중요하다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02jf9bSSY7EiZkj5xkgxpUVF4WXK7KZnuhn6ahzWre4HgUiiwL1SSg1mFNr8cUK7hCl?__cft__[0]=AZU2JxaBmBCsFMjxOmuWmmKeAD2t2NI9WelzmpD9wrQenXIL1Ywn4Qwo2PluIfiiCBjTaRGJkB3oTcv4kvsLs5cMd67OMA5HpRzpGKiV0RCRRoLtBNyvnHjJi2KMMmiUlJhBWSihnQ949gILFK7rgtnb&__tn__=%2CO%2CP-R"}, {"id": 67, "date": "2014년 6월 14일", "year": 2014, "title": "\"나는 마흔 다섯 살이고 , 나의 최고의 절정기에 있다\"", "themes": [9, 13, 5], "content_html": "<p>I am fourty five and I am peaking!<br>\"나는 마흔 다섯 살이고, 나의 최고의 절정기에 있다\"<br>라는 모토를 가지고 모두 열심히 운동 합시다!<br>라고 이야기 하려 했습니다.<br>대학교때 들던 중량 보다 더 많은 중량을 들 수 있고,<br>더 많은 윗몸 일으키기를 할 수 있으며,<br>더 빨리는 아니지만 더 오래 뛸 수 있다며,<br>'모두 운동을 열심히 합시다'<br>라고 하려고 했는데....<br>이 생각을 하고 얼마 지나지 않아...<br>갑자기 심장이 건너뛰기 시작했습니다.<br>그게 너무 심해 심장이 세네번 뛰면 한 번을 건너뛰는..<br>이런 불쌍사가...<br>함께 일하시는 의사 선생님께 여쭈었더니<br>부정맥 중아 하나인 PVC 라고 하더라고요<br>열심히 논문을 검색해 봤더니<br>이걸로 죽는 경우는 극히 드물더라고요...<br>그래도 영..<br>그리고 제가 건강검진이 있었습니다.<br>그래서, 혈당, 인슐린 그리고 콜레스테롤을 낮추려고 매일 열심히 산을 다녔습니다.<br>\"I am forty five and I am peaking\" 을 외치며 말이죠.<br>매일 산에 다니며,<br>역시 내 체력을 짱이야~~~<br>라며 자만하고 내려왔는데,<br>갑자기 항문에 이상한 것이 잡히는 것이었습니다.<br>이게 뭐지?<br>순간 제가 요즘 열심히 연구하는 '직장암'<br>혹은 '항문 암'???<br>앗. 그럼 평생 장루를 차야하는가?<br>이런...<br>바로 이분야 최고 전문가이신 김모 교수님께<br>전화를 드렸습니다.<br>교수님은 원래 외래가 없으신대도 불구하고<br>저를 봐 주신다고 바로 병원으로 달려오라고 하셨습니다.<br>그래서, 열심히 달려갔더니..<br>거기에는 평소 연구때 만나던 간호사님,<br>팰로우 선생님...<br>그리고 그 교수님...<br>저보고 바지를 내리고 엎드리라고!!<br>\"여기서요? 아니 이분들이 보는데???\"<br>꼭 그래야만 하나요? 라고 묻고 싶었지만..<br>저는 어린 양 처럼~~<br>네.<br>공손히 대답하고 순종했습니다.<br>그리고, 교수님이 장갑을 끼시더니..<br>이후로 차마 설명은....<br>그러시더니,<br>심각한 얼굴로<br>\"전형적인 치질증상이구만\"<br>쥐구멍이라도 찾고 싶은!<br>치질 땜에 그 바쁜 교수님을!<br>그리고 그 다음 말이 더 저를 아프게 했습니다!<br>요새 좀 많이 걸었니?<br>\"아뇨! 뭐! 조금!\"<br>혈액검사에 콜레스테롤 낮추려고...<br>라고 차마 이야기 하지는 않았습니다.<br>그래도, 저를 운동 전문가로 인정해 주시는 분 앞에서.<br>이렇게 저의 새로운 모토<br>'나는 마흔 다섯 살입니다. 그리고 나는 최고의 절정기에 있다'<br>는 여지 없이<br>'나는 마흔 다섯 살 입니다. 저는 바보입니다'<br>로 바뀌었습니다.<br>그냥 앞으로는 마흔 다섯 짜리 바보로 살까 합니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0xWcqNJtyZPiXyjWJR4sMcfNpwH2cLYs6zUGrw4sQ3cajgNoCYW3HQ4YpMprCBAuBl?__cft__[0]=AZV0_oFWRo6f9EUhRn3XgCy_EnkY0SWgoitdeAttvEi2Fuih5tuumzNvli5MVl0zE6hcH7lqcvI8RNt0wexLfsKBQAXa--_bm-zuMn77HEs-7xScGGRY1522EXSiOr8P6SdwL7D6An_DN6PAq-A5OlPr&__tn__=%2CO%2CP-R"}, {"id": 68, "date": "2014년 6월 27일", "year": 2014, "title": "어제는", "themes": [10, 16, 9, 4], "content_html": "<p>어제는<br>대학의 장애학생교육위원회 회의를 진행하다<br>울컥하고 말을 잇지 못했다.<br>장애가 있는 자녀를 학교에 보내놓고,<br>당연히 학교에 요구할 사항이 있는데,<br>너무 많은 것을 학교에 요구하면,<br>혹시 학교가 앞으로 장애학생을 안 받아 줄까봐,<br>(실제로, 주변 학교에서 있는 이야기란 사실에 분노가 일지만)<br>혹시 자신의 자녀에게 불이익이 가지는 않을까? 하는 마음에<br>마땅히 요구해야 할 사항을 요구하지 못하고<br>마음으로 삭히시는 부모님의 마음<br>장애학생 부모 간담회가 있다고 비행기를 타고 단숨에 달려와<br>학생들을 배려해 주는 학교에 너무 감사하다고 눈물짓는 아버지의 마음<br>장애를 가진 자녀가 대학에 들어가<br>혼자 등하교를 하는 자녀를 보며 마음 졸이며 기도하는 부모의 마음<br>혹시 장애를 가진 아들의 짝이 싫어하지는 않을까해서<br>짝이된 부모에게 미리 사과하며 인사하는 부모의 마음<br>이런 분들이 이런 마음을 갖지 않도록<br>학교가 더 많이 배려하고, 더 많이 노력해야 하는데,<br>이게 나의 임무고 책임인데 ㅠㅠ<br>시각장애인 학생을 앞에 놓고<br>00 도 학교에 다니나요? 라는 말을 듣는 부모님의 마음<br>장애인을 위한 자동문이 없어<br>누군가 문을 열고 들어갈 때에 함께 들어가는 장애학생의 마음<br>그것을 바라보고 견디는 부모님의 마음<br>이런 학생들과 부모님의 마음을 미리 헤아려 드리고<br>위로해 드리고, 격려해 드리는<br>그리고 앞으로 훨씬 더 노력하는 연세대학교이길 소망한다.<br>오늘 점심.. 그분들에게 위로와 격려가 되고 싶은데,<br>또 울컥할지 모르겠다...</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02o9qsMpxv8VobGRLtPAET134NxmBSJHoud8F4GK371do5wU6SAKNAyBX9Ezr3Zx3El?__cft__[0]=AZV5gzxsrYXR1-rDuxaRfU3et7UNwmqhIhFBnPhPqqc_1vyI6idVVTYkEv47sJ2XiP1OtvmmSJGiPEZxnCr_lJ8S_UCdp1phS8M2spGFjIaw9HdJrEF7J3HQi98QwTiMcXtHr85HXrqIc3044QGrnGTN&__tn__=%2CO%2CP-R"}, {"id": 69, "date": "2014년 7월 5일", "year": 2014, "title": "웰컴 홈! Welcome home! 오카리나사이 !", "themes": [3, 4, 6, 7], "content_html": "<p>웰컴 홈! Welcome home! 오카리나사이!<br>돌아갈 집이 있다는 것은<br>참으로 감사한 일입니다.<br>그냥 눈치 안보고, 있는 모습 그대로<br>가식의 껍데기를 벗어버리고<br>재충전을 할 수 있는 곳<br>바로 가정 (home) 입니다.<br>폭풍같은 시간들을 지내고<br>아내와 애들이 있는<br>Home 으로 갑니다.<br>잘 쉬고<br>충전되어 돌아오겠습니다.<br>이번에는 이 Home을<br>한국으로 데리고 오려고요!<br>전 혼자는 못 살겠더라고요.<br>고 3이 되는 아들에게<br>미안하다. I need my wife back!<br>이라고 했더니<br>제발 좀 데려가 달라고 하더라고요<br>Please Please take her back!<br>이라고 하더라고요^^<br>여하튼 잠시 다녀오겠습니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02ab5quRcq825PAEaxaWuX34shgL198WRuHkjP3CRezqNoVi6jhcirhY7vxBMrcjW8l?__cft__[0]=AZWz5Q85D2iXjav0jxuG3GFMt2VjsoMAEE8h2pDCqe06a8KTGM65S2OK3JNXc5KINFmG26Q-xv4Fk6oR8AYtS3Vx2MKu5M_o5lWUB5KO9Y-we8-VuH3nOKUcNzm5F9PPIDX4lCdjjGsVJKznTBtX8zMn&__tn__=%2CO%2CP-R"}, {"id": 70, "date": "2014년 7월 29일", "year": 2014, "title": "오늘은 아침 일찍 제가 머물고 있는 캘거리에서", "themes": [8, 5], "content_html": "<p>오늘은 아침 일찍 제가 머물고 있는 캘거리에서<br>알버타 주립대학과 자매결연 조인식을 위해 에드먼튼에 왔습니다.<br>This morning, I drove to Edmonton from calgary to<br>sign a MOU between UofA and Yosei.<br>오는 내내 차에서 CD 로 다음 세대를 위하여<br>어른 세대가 꿈을 꾸어야 한다는<br>제목 오캄포 목사님의 메시지를 들으며<br>가슴이 벅차 올랐습니다.<br>On my way to Edmonton,<br>I heard a message from Jerome Ocampo<br>to dream again for the next generation.<br>I was very much inspired.<br>그리고, 에드먼튼에 도착해<br>Tim Horton 에 들어오자마자<br>커피를 사려고 줄을 서 있는데,<br>벽에 그림이 하나 보이네요~~..<br>Then, I stopped at the Tim Horton, in Edmonton for coffee<br>This picuture was on the wall.<br>If you know Tim Hortonn, this kind of picture is a rare one to see.<br>어제는 캘거리에 있는 교회의 목사님의 설교 말씀에<br>\"당신의 최근 어떤 기도를 하고 있는 지 내게 말씀해주시면,<br>당신의 미래에 어떤 일이 일어날지를 말씀해 드리겠습니다\"<br>라고 하신 말씀이 기억에 남았습니다.<br>Yesterday, I heard a message from a pastor.<br>\"if you tell me what you are praying for nowadays,<br>I will tell you what will happen in your future\"<br>나는 요즘 어떤 것을 위해 기도하고 있나? 생각해보니<br>무언가를 꿈을 꾸며 기도하지 않고 있는<br>제 자신의 모습을 바라보고 당황했습니다.<br>So I thought about what I have been praying for,<br>then I realized that I have not been praying or dreaming much at all<br>I was embarassed,<br>저는 언제부터인가<br>꿈꾸기를 멈추고,<br>꿈이 없으니 기도하기를 멈추었고,<br>기도하지 않으니<br>믿음으로 행동하기보다<br>즉흥적으로<br>그리고 두려움으로 나에게 일어나는 일들에 대해<br>Response 가 아닌 reaction 하고 살아가고 있었음을 보았습니다.<br>I have stop dreaming<br>Since I step dream, I have not been praying<br>No prayer, no faith<br>Because of lack of faith,<br>I would react to the circumstance<br>rather than response to the circumstance by faith<br>어른으로 이제 책임감 (Responsibility) 을 가지고 살아야 하는데,<br>많은 일들이 이 사회가운데 일어나고 있는데,<br>나의 책임감 (Response ability) 를 잊고 살아가고 있는 자신을 바라봅니다.<br>As an adult, I should live with responsibility (response ability)<br>Responsibility (response ability) begins with dreaming, praying and believing.<br>지금도 내 앞에 보이는 저 그림은<br>제게 다시 꿈꾸고 (Life)<br>다시 소망하고 (Hope)<br>다시 주위를 둘러보라는 (Love)<br>I believe this picture is<br>a whisper of God<br>telling me to dream again<br>to believe again<br>to care again<br>하라는 하나님의 속삭임으로 보입니다.<br>반성하고,<br>제 마음을 바꾸고<br>제 행동을 바꿔야 겠습니다.<br>From Edmonton</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02ab5quRcq825PAEaxaWuX34shgL198WRuHkjP3CRezqNoVi6jhcirhY7vxBMrcjW8l?__cft__[0]=AZWz5Q85D2iXjav0jxuG3GFMt2VjsoMAEE8h2pDCqe06a8KTGM65S2OK3JNXc5KINFmG26Q-xv4Fk6oR8AYtS3Vx2MKu5M_o5lWUB5KO9Y-we8-VuH3nOKUcNzm5F9PPIDX4lCdjjGsVJKznTBtX8zMn&__tn__=%2CO%2CP-R", "images": ["pdf2_page58_img3.jpeg"]}, {"id": 71, "date": "2014년 8월 8일", "year": 2014, "title": "기러기 끝~~^^ Finally I got my family b...", "themes": [12], "content_html": "<p>기러기 끝~~^^ Finally I got my family back to Korea. SORRY David!</p>", "images": ["pdf2_page58_img2.jpeg"]}, {"id": 72, "date": "2014년 8월 29일", "year": 2014, "title": "오늘 졸업하는 학생들을 보며", "themes": [15, 3, 9, 5], "content_html": "<p>오늘 졸업하는 학생들을 보며<br>한 가지 생각 나는 이야기가 있어<br>몇 자 적어 봅니다.<br>\"당신이 진정 원하는 것은<br>두려움의 반대편에 있다\"<br>“Everything you want is<br>on the other side of fear.”<br>무슨 말이냐고요?<br>몇 주전에 이대 앞을 지나가다가<br>굴다리 밑에 누가 그려 놓았는데,<br>그 내용이 그냥 마음에 확 꽂히더라고요.<br>정말 맞는 말 같습니다.<br>저도 그랬던 것 같습니다.<br>오래전 유학을 생각할 때에<br>막연하게 토플에 대한 두려움이 있었지요.<br>제가 원하는 대학원은 제가 두려워하는<br>토플시험의 반대편에 있었지요.<br>그래서, 혹시 토플 안보고 갈 수 있는<br>대학원이 없나 살펴보았습니다.<br>막상 시도도 하기 전에 실패에 대한<br>두려움이 앞섰던 거지요.<br>저는 진정 결혼을 원하는<br>커플을 알고 있습니다.<br>그런데, 결혼을 못하고 아직도<br>연애만 하고 있지요.<br>저들이 진정 원하는 것은<br>함께 결혼해 사는 것인데<br>혹시 실패할 까봐 두려워<br>결혼 생활은 시작도 못하고 있는 거지요.<br>어쩌면 당신이 진정 원하는 것은<br>정말로 두려움 저 너머에 있는지도 모릅니다.<br>그런데, 재미있는 것은 아래 나오는<br>그림을 우연히 본 날<br>학생 한명이 제게 진로 상담을 받으러 왔었습니다.<br>그 학생의 아버지는 매우 성공한 변호사였습니다.<br>그리고, 그 아버지의 아들로서<br>항상 변호사가 되고 싶었습니다.<br>그런데, 도저히 아버지 만큼 훌륭한 변호사가될 자신은 없었나 봅니다.<br>어쩌면 법학전문대학원을 목표로<br>최선을 다했다가<br>자신이 변호사가 될 수 없다면...<br>자신의 아버지가<br>자기를 인정해 주지는 않을까 하는 두려움<br>그 두려움에 그 친구는 미리부터<br>변호사가 되기를 포기했었네요.<br>그런데, 다행이도 자신이 사실은<br>변호사가 되고 싶다는 것을 깨달았습니다.<br>그리고, 변호사의 길을 가기로 결정하고<br>자신 안에 있는 두려움을 직면하기로 했답니다.<br>참으로 감사한 일입니다.<br>저도 그랬던 것 같습니다.<br>만약 내가 최선을 다해서 노력했는데도 해내지 못하면 어쩌지?<br>어쩌면 그래서 어떤 일에<br>최선을 다하는 것을 꺼렸는지도 모릅니다.<br>그리고 스스로 '내가 최선을 다 했다면, 성공했을껄?' 이라고<br>스스로 위안을 했는지도 모르죠.<br>어쩌면 우리가 사랑하는 사람에게<br>고백을 하지 못하는 이유는<br>그리고, 짝사랑이 아름다운거야 라고<br>스스로 합리화 하는 이유는<br>혹시 거절에 대한 두려움 때문이 아닐까요?<br>어쩌면 당신이 진정 원하는 것은 두려움 너머에 있는 지도 모릅니다.<br>만약 우리가 그 것을 위해 최선을 다해 도전하지 않으면, 아마도 우리는<br>그 일을 평생 이루어내지 못할 것입니다.<br>실패할까봐 두려워 시도조차 못하는 것은 안타까운 일입니다.<br>두려움에 맞서면 좋겠네요.<br>우리 한번 그렇게 시도해 보면 좋겠습니다.<br>그런데, 시도하기 전에 먼저<br>그 일을 혹은 그 사람을<br>진정으로 사랑하는지 먼저 물으면 좋겠네요.<br>왜냐하면,<br>사랑은<br>두려움을<br>이기니까요!<br>오늘<br>졸업한<br>모든 학생들의<br>두려움을 뛰어<br>넘는<br>도전을<br>기대합니다</p>", "images": ["pdf2_page60_img0.jpeg"]}, {"id": 73, "date": "2014년 9월 4일", "year": 2014, "title": "마.지.막.수.업.", "themes": [9], "content_html": "<p>마.지.막.수.업.<br>1995년 1학기<br>캐나다에서의 교환학생을 마치고<br>한국으로 돌아와 마지막 학기 수업을 수강하였다.<br>아무 생각 없이 들은 성서와 기독교 수업.<br>그 수업에 들어오신 중년의 여 교수님<br>옷차림과 단정한 머리<br>수업에 대한 설명을 해 주시고<br>수업을 마치시며 수업을 위해 기도해 주시는데<br>갑자기 눈물이 핑 돌았다.<br>이후 100 명이 다 되는 학생들의 이름<br>더 나아가 가정형편을 다 아시고 기도해 주시던 분<br>자신의 주머니를 털어 어려운 학생들 도와 주시던 분..<br>아마 이후 이 수업을 들은 학생들은<br>거의 나와 동의할 거다.<br>그렇게 나는 내 인생의 새로운 멘토를 만났다.<br>그리고 내 인생의 모델을 만났다.<br>그 수업을 들으며,<br>인생에 대해<br>하나님에 대해<br>그리고 삶에 대해 배웠다.<br>그리고, 공교롭게도<br>그 과목의 시험은<br>나의 연세대학교 마지막 시험이 되었고<br>2주후 난 아내와 결혼하였다.<br>결혼후 유학을 앞두고 인사를 드리러 갔을 때에<br>나의 손을 꼭 잡아주시고,<br>나를 위해 간절히 기도해 주시던 교수님!!<br>그리고, 좋은 책을 한 권 선물해 주신 교수님!!<br>평생 여운이 남은 수업이었다.<br>20년 전의 일이다.<br>그 수업을 가르쳐 주신 김정주 교수님께서<br>이번 학기 정년을 앞두고<br>마지막 수업을 하신다.<br>성서와 기독교<br>그리고 신약 배경사 (UCG1116-01) 수 3, 금 3, 4.<br>나도 시간이 될때에<br>꼭 그 수업에 가서 단 몇 번이라도 청강할 예정이다.<br>나의 제자들에게 이번 학기 이 강의를 꼭 추천해 주고 싶다.<br>교수님 사랑합니다</p>", "images": ["pdf2_page62_img0.jpeg"]}, {"id": 74, "date": "2014년 9월 20일", "year": 2014, "title": "2학기 개학 첫날", "themes": [5, 9, 16, 1], "content_html": "<p>2학기 개학 첫날<br>새로 전학 온 상훈이는<br>아직 아는 사람이 많지 않다.<br>잘 적응할 수 있을까?<br>강북의 학교에서 강남으로 전학 온 상훈이는<br>새로운 환경에 둘러싸여 주눅이 들어있다.<br>이런 저런 생각에 몰두하여<br>아무도 메지시를 보내지 않은<br>카톡창을 띄워 보며<br>자신의 전화기 속으로<br>자신의 쑥스러움을 감추려는 순간<br>두꺼운 안경을 쓴 남학생과<br>정면으로 충돌을 하고 말았다.<br>그 친구는 자신이 들고 있던<br>책들을 떨어뜨리며 뒤로 자빠졌다.<br>당황한 상훈이는<br>얼른 그 친구가 떨어뜨린 책을 주워<br>그 친구에게 전해 주며 자신을 소개했다.<br>“난 새로 전학 온 상훈이야!”<br>“정말 미안하다. 그런데 뭔 책이 이렇게 많냐?”<br>자신의 안경을 고쳐 쓰며 넘어진 친구는 일어나며<br>기어들어가는 목소리로 이야기 했다.<br>'미.안.'<br>“뭔 책이 이렇게 많아? 이걸 다 들고 어디가냐?<br>내가 함께 들어줄께!\"<br>상훈는 떨어진 나머지 책을 들고<br>영민이가 가던 방향으로 걸어가며 영민이에게 이야기 했다.<br>“영민아 빨리 가자!”<br>영민이는 그런 상훈이를 바라보며,<br>자신의 소지품을 주섬주섬 챙기며 따라갔다.<br>마침 집으로 가는 방향이 같았던 두 사람은<br>함께 이야기를 나누며<br>마치 오랫동안 알았던 친구처럼 이야기를 나눴고<br>그렇게 남은 고등학교의 2년 반을<br>가장 친한 친구로 함께 미래를 꿈꾸고,<br>부모님 몰래 술도 처음 마셔보고,<br>함께 토요일 새벽 보충수업을 땡땡이 치고<br>속초로 가는 버스에 몸을 실고 여행을 가기도했다.<br>어느덧 고등학교 3년을 마치고 졸업이 다가왔다.<br>영민이는 자기가 원하던<br>연세대학교 경영학과에 입학했고,<br>원래 공부를 잘 못했던 상훈이는<br>대학 진학을 포기하고,<br>아버지가 운영하던 일식집을 가업으로 이어받기로 했다.<br>졸업식 전날 아직은 겨울의 뒷자락 추위가 남은 날<br>두 사람은 함께 만나 석촌호수 길을 걸으며<br>서로의 앞날을 축복해 주었다.<br>“영민아 너 앞으로 최고 경영자가 되면<br>내가 하는 일식집을 세계적 체인으로 함께 만들자!<br>\"그리고 나 미팅도 좀 시켜주고 그래야된다“<br>영민이는 대답 대신에<br>상훈아! 고마워!!” 라고 말하고,<br>갑자기 달리기 시작했다.<br>영민이는 자신의 눈물을 상훈이에게 보이기 싫었던 것이다.<br>졸업식 날이 되었고,<br>졸업식 송사를 맡고 단상으로 나가는 영민이를 바라보며<br>상훈이는 마치 자신이 그 위에 서 있는 것 같은 생각을 하며<br>자신의 친구인 영민이가 너무 자랑스러웠다.<br>영민이의 졸업송사가 시작되었다.<br>“저의 부모님은 제가 중학교 2학년 때 이혼을 하셨습니다”<br>“그리고, 저와 동생은 어머니와 함께 살게 되었는데,<br>이어 저의 어머니 역시 우울증으로 힘들어 하시다<br>저와 저의 동생을 뒤로 하시고 스스로 먼저 저 세상으로 가셨습니다.<br>이후 저는 다시 결혼을 하신 아버지와 새어머니와 살게 되었고,<br>저의 동생은 시골에 계신 외할머니와 살게 되었습니다“.<br>영훈이와 오랫동안 가장 친한 친구로 지낸 상훈이도 처음 듣는 이야기였다.<br>\"그리고, 제가 정말 좋아하는 선생님과<br>친구들이 있는 이 학교에 새로운 꿈을 가지고 입학하게 되었습니다.<br>하지만, 고등학교 1학년 1학기 생활은 제가 꿈꾸던 학교가 아니었습니다.<br>친구들은 저에게 냄새가 난다면 놀려대기 시작했고,<br>한 마디도 못하고 주눅이 들어있는 저를<br>더 괴롭혀 대기 시작했습니다.<br>그리고, 카톡방에 저를 초대하곤,<br>온갖 입에 담기 어려운 욕을 해대기 시작했습니다.<br>나가면 다시 초대하고, 나가면 다시 초대하고...\"<br>\"그래서 저는 결심했습니다.<br>우리 아버지와 새어머니도 내가 없으면 더 행복하시겠지.<br>그리고 우리 반 아이들도 내가 없으면 더 좋아할 거야~.<br>그리고, 저는 D 데이를 개학날로 잡았습니다.<br>내가 죽으면 내 락카에 있는 책을 치워줄 사람이 없다는 생각에<br>락카에 있는 책을 다 꺼내, 쓰레기통에 버리려고 했습니다.<br>그리고, 빈 락카에는 아버지와 동생, 그리고 새어머니 앞으로<br>유서를 남겨두었습니다.<br>그리고, 책을 한 가득 들고 가고 있는데,<br>갑자기 한 명의 학생과 부딛혀 책을 떨어뜨리며 넘어지게 되었습니다.\"<br>그리고, 그 친구는 내 책을 주어 들어 나에게 전해주며<br>환하게 웃는 얼굴로 “내 이름은 상훈이야!” 라며 자신을 소개했습니다.<br>그리고, 내 허락도 없이<br>나머지 책을 들고 앞장서 가며 나에게 따라오라 했습니다.<br>상훈이는 그렇게 나의 소중한 친구가 되었습니다.<br>내가 만난 날 상훈이는 우리 학교에 전학 온 첫날이었지만,<br>키도 크고 잘생기고, 싸움도 잘하는 상훈이와<br>내가 친하게 지내니, 아무도 나를 다시 무시하지 않았습니다.<br>상훈이와의 만남은 나의 인생에<br>다시 의미를 부여하기 시작했습니다.<br>상훈이와의 만남이 없었다면,<br>저는 이 자리에 서 있을 수 없을 것입니다.<br>이 졸업의 영광을 제 친구 상훈이와 함께 하고 싶습니다.<br>졸업 송사를 마치고 내려오는 영민이의 모습을 바라보며<br>선생님들과 졸업생들을 미안함과 충격과 놀라움<br>그리고 깊은 감동에<br>박수를 치는 것도 까먹고 있었다.<br>그리고, 상훈이는 충격과 놀라움과 고마움에<br>영민이에게 달려가 와락 껴안았다.<br>................................................................................................................................<br>위 글은 15년 전 쯤에 캐나다에서 이 메일로 떠돌던 글을 각색해서 쓴 내용입니다.<br>오늘 내가 베푸는 작은 친절 하나가<br>한 사람의 목숨과<br>한 가정의 미래와<br>한 사회의 앞날을 바꿀 수 있습니다.<br>오늘 내가 처음 보는 사람에게도<br>미소를 지어야 하는 이유 중 하나입니다.<br>히 10:24-25</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02uy5HjHMHuCZLcxCTPzyWKbTU9hPdi4YBd3e81jadqtKC5jnvoJSTx7LRZ48gPxE4l?__cft__[0]=AZVV9CkCBpAYr1ND6o1f3P_UwpzyAh9ROcxuRFZfxfLwM3A02SQ37k4W6SKZyBfSltNC4mnV0M3MLGhVOyw-QwfKHb455D4R4-AQVbVf0KeD_FbZHkz-eCYXf4eGg9kWCL3DCAoF1mR2n2DqZ2BSGTmY&__tn__=%2CO%2CP-R"}, {"id": 75, "date": "2014년 9월 30일", "year": 2014, "title": "Love is making oneself vulnerable", "themes": [3], "content_html": "<p>난 대학에서 지난 9년간 사랑에 대해 가르쳤다.<br>(물론 전공이 아닌 교양으로)<br>처음 이 수업을 시작할 때에는<br>막연하게 나의 경험을 학생들에게<br>이야기 해주면 되겠지 라는 생각을 했다.<br>수업의 제목은 ‘너희가 사랑을 아느냐’<br>한 7년 가르치고 수업 자료를 모아<br>‘너희가 사랑을 아느냐?’ 라는 제목으로<br>책을 냈고, 많은 분들이 그 책을 읽어주었다.<br>난 사랑이 무엇인지 알고 있다고 생각했다.<br>하지만, 나이가 먹을수록 생각이 깊어질수록<br>난 사랑에 대해 아직도 모른다는 것을 깨닫는다.<br>2013년 너희가 사랑을 아느냐 수업을 가르치다가<br>문득 ‘난 그럼 사랑을 알고 있나?’ 라는 생각이<br>내 머리 속을 스쳤다.<br>그리고, 기도 했다.<br>‘하나님, 사랑이 뭔지 알려주세요!’<br>‘그 사랑을 이해하고 싶습니다!’.<br>그때에 내 머릿속에 떠오른 문장은<br>‘love is making oneself vulnerable’ 이었다.<br>나는 사실 vulnerable 이라는 단어의 뜻조차<br>정확하게 이해하고 있지 못했었다.<br>vulnerable 의 뜻은<br>‘easy to be broken, easy to be hurt’ 였다.<br>‘vulnerable’ 하다는 것은<br>상처받기 쉬운<br>깨어지기 쉬운 것을 의미한다.<br>‘love is making oneself vulnerable’<br>이라는 사랑에 대한 정의대로라면,<br>사랑이란, 누군가를 위해 기꺼이<br>상처를 받을 수 있는 것이다.<br>연약해 질 수 있는 것이다.<br>이때에 떠오른 생각은<br>내가 아내와 연애 할 때에<br>전화하던 내용이다.<br>내가 먼저 전화를 끊기 전에<br>‘사랑해’ 라고 이야기 했을때에<br>내가 vulnerable 해 지는 것이다.<br>만약 상대방이 ‘잘자’ 하고 끊는다면.....<br>먼저 사랑한다고 고백하는 것은<br>vulnerable 해 지는 것이다.<br>그 고백이 거절당한다면,<br>그 고백이 비웃음거리가 된다면,<br>난 20여년을 연애하면서도<br>아직도 결혼하지 않은 오래된 커플을 알고 있다.<br>혹시, 이들은 서로를 사랑한다고 하면서<br>vulnerable 해지기를 거부하는 것은 아닐까?<br>누군가를 얼마나 사랑하는지의 척도는<br>얼마나 vulnerable 해질 수 있는가<br>얼마나 상처를 받을 수 있는가<br>상처를 받고도 용서할 수 있는가 일지도....<br>내 마음에는 오랜 상처가 있다.<br>유학생활을 하면서 많은 사람을 만났고,<br>형제로 그리고 자매로 삶의 일부를 나누었다.<br>그들 중 대부분은 1년이 지나면<br>내가 있던 도시를 떠났다....<br>사랑을 나누고,<br>삶을 나누고,<br>시간을 나누고,<br>음식을 나누고,<br>꿈을 나누고,<br>내가 형같이 따르던 한 형이 연수를 마치고<br>한국으로 돌아가게 되어 공항에 바려다 주었다.<br>그리고, 집으로 돌아오는 길에 차를 멈추고<br>약 20-30분을 거의 목놓아 울었다.<br>많은 사람들에게 정을 나누었고,<br>떠날 때에 내 마음엔 상처가 남았다.<br>그날 이후 누군가에게 정을 줄 때<br>상처받지 않을 만큼만 주게 되었다.<br>상처받기 싫었던 것이다.<br>몹쓸 자기 방어기재인 것이다.<br>Love is making oneself vulnerable<br>이라는 사실을 깨달을 때 즈음<br>내가 사랑하던 많은 사람이 나를 떠났다.<br>사랑하는 누나가 세상을 떠났고<br>사랑하는 아내와 애들은 캐나다로 떠났고<br>사랑하는 제자들이 유학을 떠났다.<br>그중 지난 10년간 신촌에서<br>하나님의 주신 소중한 꿈들을 키우며<br>함께 기도하던 제자들 또한 떠나보내며<br>스스로 정을 때는 작업에 들어갔다.<br>그때 내 마음 속에 한 음성이 들렸다.<br>‘용관아! 그건 사랑이 아니다’<br>난 그들을 사랑했다고 생각했는데,<br>상처받기는 싫었나 보다.<br>다행히 하나님께서 그 사실을 깨닫게 해 주셨다.<br>바로 그 즈음에 난 예수님의 사랑을<br>처음으로 진정으로 깨닫게 되었다.<br>성경을 볼수록 하나님이 우리를 위해서<br>얼마나 vulnerable 해 지셨는지를 알게 되었다.<br>자신을 배신할 것을 알면서도,<br>제자들을 사랑하시되 끝까지 사랑하시고,<br>자신을 비참하게 죽일 것을 알면서도,<br>기꺼이 우리를 위해서 세상에 오신 그 사랑<br>그냥 죽는 정도가 아니라,<br>그 얼굴에 침뱉음 당하고,<br>주먹으로 얼굴에 가격을 당하고,<br>온갖 수치와 모욕을 당하신 그분<br>vulnerable 에 극치를 몸소 보여주신 그분<br>그분은 우리를 위해 vulnerable 해진 정도가 아니라<br>“he made himself nothing”<br>우리를 위해 그냥 아무것도 아닌 것이 되신 분<br>‘예수님의 사랑으로 사랑합니다’ 라는 고백이<br>얼마나 어렵고 힘든 일인지...<br>다른 사람들을 위한 나의 사랑은<br>‘내가 상처받지 않을 정도까지’ 였는데...<br>남을 도와주되 나에게 해가 가질 않을 만큼,<br>학생들과 시간을 보내되, 내가 견딜 수 있을 만큼..<br>아내를 사랑한다고 했지만,<br>그건 날 사랑한 것이고,<br>자녀를 사랑한다고 했지만,<br>내 자존심을 지키기 원한 것인지도...<br>예수님은 창조주 하나님이셨다.<br>그 분은 모든 능력이 있었지만, 능력으로 우리를 바꾸지 않았다.<br>그 분은 많은 기적을 행했지만, 기적으로 우리를 구하지 않았다.<br>그 분은 모든 지식이 있었지만, 지식으로 우리를 사랑하지 않았다.<br>그분은<br>우릴 위해 기꺼이 연약해 지심으로<br>우릴 위해 기꺼이 상처 받으심으로<br>우릴 위해 기꺼이 찔리심으로<br>우릴 위해 기꺼이 죽으심으로<br>우리를 바꾸시고, 구하시고, 사랑하시었다.<br>난 졸업식이면 학교에 가기를 꺼렸다.<br>내가 사랑을 준 우리 학생 중<br>아무도 감사하다며 자신의 사랑을<br>표현해 주는 학생이 없으면 어쩌지 라는 두려움<br>연구실에 앉아 있는데, 아무도 안 오면 어쩌지 하는 두려움<br>차라리 자리에 없으면 그 상처를 피할 수 있기에<br>난 천성이 상처받기를 싫어하나보다.<br>‘사랑은 주고 또 주고도 그 사람에게 부족한 것이 없는지 돌아보는 것‘<br>이라고 가르치면서도, 난 상처받기는 죽기보다 싫었나보다.<br>하지만, 진정한 사랑은 마음을 열어 보여주는 것을 요구한다.<br>기꺼이 자신의 잘난 모습만이 아닌, 못난 모습<br>기꺼이 자신이 잘한 것만이 아닌, 잘 못한 것을<br>기꺼이 자신의 자신감만이 아닌, 두려움을<br>기꺼이 자신의 모든 것을 내어주는 그런 사랑<br>그래서 연약함 (vulnerability) 이 강함을 이기는 세상<br>그래서 부족한 것이 온전한 것보다 아름다운 세상<br>그래서 아름다운 것 보다 못난 것이 더 사랑스러운 세상<br>그래서 어두움이 빛을 이기지 못하는 세상<br>그런 세상에 살고 싶다.<br>그런 사랑을 하고 싶다.<br>그런 사랑을 배우고 싶다.<br>그런 사랑의 길을 따르고 싶다.<br>그런 사랑을 살아내고 싶다.<br>그분을 더 닮고 싶다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02vKw6Qks9P6RXABJBzG4Bup6QJpmYbwxfm7adxMkGqPyT5CEj61dQvvv9r657bwe6l?__cft__[0]=AZUZ3iUFS3BL6FPYK-q5b1gRHXR4KZMdjep8i2BY9LwpbicYT80N5iDJGCnAzYZUme2RzI7NhLZk8kIDPF83wpDpgrJlN2dHIe2avDwaA4D--OQwytRc3llpLHb-yr-Uw7RfbA8s2T7fkGTlJSkHZlkg&__tn__=%2CO%2CP-R", "featured": true}, {"id": 76, "date": "2014년 10월 17일", "year": 2014, "title": "이렇게 통합사회를 위한 스포츠 포럼이 잘 끝났습니다 .", "themes": [11, 12], "content_html": "<p>이렇게 통합사회를 위한 스포츠 포럼이 잘 끝났습니다.<br>The forum went excellent~~^^<br>Thanks to David Legg David Lega 김태원씨와 Maria Kallet.<br>이제 내일이면 장애인 아시안게임 개막이네요!</p>", "images": ["pdf2_page71_img2.jpeg"]}, {"id": 77, "date": "2014년 10월 19일", "year": 2014, "title": "요즘 들어 계속 생각이 드는 것은", "themes": [11], "content_html": "<p>요즘 들어 계속 생각이 드는 것은<br>약한 것이 강한 것 보다 아름답고<br>부족한 것이 완벽한 것보다 사랑스럽다는 생각이다.<br>비록 장애인 탁구 선수가 더 잘 치진 않아도<br>선수가 더 빨리 헤엄칠 수는 없어도,<br>선수가 더 높이 또 빨리 뛸 수는 없어도,<br>그 자체로 충분히 빠르고, 충분히 강하고, 충분히 감동적이다.<br>난 우리나라 언론이 장애인 경기를 충분히 다뤄주고<br>운동시합 뒤에 숨어 있는 멋진 이야기 들을 찾아주고,<br>저들의 감동을 일반인들이 나눠주는<br>충분히 성숙한 언론이 되면 좋겠다.<br>난 우리나라 국민들이 인기 있는<br>비장애인 종목에만 관심을 가져주는 것이 아니라<br>장애인 경기장을 찾아와 함께 국적을 넘어,<br>저들을 응원해주고 관심을 가져주는<br>충분히 성숙한 국민이 되면 좋겠다.<br>https://www.facebook.com/2014apg</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/10152903410511019?__cft__[0]=AZVB3adNWOWA7Fz8ft2vFsPBWGLHRlNUl13KNk7F7drJvDPb5Ojp4QpukpJ3pVsxm4BPebnL-Xz1HtjOAfz7HPexm7-KV47fxpbih5vV-tmOVUDNoHFILtUaDeuEXyvjJiHBq4_9zTJjjjtXadX8Xcxr&__tn__=%2CO%2CP-R"}, {"id": 78, "date": "2014년 10월 21일", "year": 2014, "title": "오랜 친구와 함께~~.", "themes": [11], "content_html": "<p>오랜 친구와 함께~~.<br>처음 출전한 북한팀이 벌써 메달을 땄어요.<br>오늘 정오에는 첫 장애인<br>남북 탁구 대결이 있네요.</p>", "images": ["pdf2_page72_img2.jpeg"]}, {"id": 79, "date": "2014년 11월 3일", "year": 2014, "title": "거의 40년 전...", "themes": [5, 13, 9, 11], "content_html": "<p>거의 40년 전...<br>한 명의 대학생의 뼈에 암이 발견되었습니다.<br>그리고, 6일 후 의사는<br>그 청년의 오른 쪽 허벅지 밑으로<br>절단을 해야 했습니다.<br>이후 15개월여의 항암치료를<br>다른 소아암환자와 받게 되었고,<br>치료가 끝나고 퇴원을 하면서<br>그곳에 함께 치료를 받던 어린이들을 생각하며<br>무언가를 해야 겠다고 결심을 했습니다.<br>사실 이 청년은 체육 전공자로서<br>다리를 절단했다는 것 자체가<br>충분히 스스로 절망할 수 있는<br>모든 여건과 자격을 갖추었지만,<br>그는 절망하기보다는<br>자신 보다 어려운 처지의 사람들을 위해<br>꿈을 꾸기 시작했습니다.<br>바로 암연구를 위해<br>캐나다 사람 1명당 1불의 돈을 모금하기로...<br>그리고, 1년 반 동안<br>자신의 꿈을 안고 달리기 시작했습니다.<br>오른쪽 발에 의족을 달고<br>충분히 준비가 되었을 때에<br>아무도 상상할 수 없는 결정을 하고<br>방송에 인터뷰를 하였습니다.<br>캐나다의 동쪽 끝,<br>Newfoundland에 대서양과 만나는 바다<br>그곳에 자신의 의족을 담그며,<br>매일 마라톤 42.195 km 를 뛰어<br>캐나다의 반대쪽 밴쿠버 아일랜드에서<br>태평양 속에 자신의 의족을 담글 것이라<br>이야기 했습니다.<br>처음에는 호기심에 관심을 가져 주었지만,<br>불어권인 퀘백을 지날 때에는<br>아무도 그를 기억해 주지 않았습니다.<br>하지만, 그는 매일 하루에<br>42.195 킬로를 달렸고<br>그가 온타리오 주에 도착했을 때에<br>사람들을 다시 그를 기억해 주었고,<br>토론토에 도착했을 때에는<br>10만명의 군중이 그를 맞이해 주었습니다.<br>그는 그렇게 뛰었습니다.<br>자신 보다 어려운 사람들을 돕는 꿈을 꾸며..<br>그렇게 뛰던 그가<br>Thurderbay, Ontario 에 도착했을 때,<br>그는 자신의 몸에 이상을 느끼기 시작했습니다.<br>아니, 사실 이상은 그 전부터도 느꼈었습니다.<br>발목은 염좌가 생겼고, 건염에 괴로웠지만,<br>의사를 만나면, 의사가 자신의 달리기<br>를 멈추게 할까봐 두려웠던 거지요.<br>하지만, 그의 몸 상태는 기침이 심해<br>더 이상 달릴 상태가 아니었습니다.<br>결국 1980년 9월 1일,<br>그는 143일간의 달리기를<br>총 5,373 킬로미터의 거리를<br>한 발로 달리던 그 희망의 마라톤을<br>어쩔 수 없이 멈추어여 했습니다.<br>암이 폐로 전이된 것이었습니다.<br>암이 전이된 것이 발견된지<br>채 1년도 되지 않아</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0XVDVtrUBXhEjStzZZ2VhYPeq2t2zHBDJ1tmzHszBdWotReX5Xf5o62zjCH4MPo9Tl?__cft__[0]=AZUnkh0kHzoLVKdqRtMfzzXW9gauLuejQ252u5T3UCRMxrS5MZej4GYTmtCcblp4Te8hy7AF8x-1xHYIorRp9OtY3UCaagmUiqrzGzqueNCUIMGvcwJwCXuF9Qv2m6GqeJ8DX2KdXYjMiD6XFXgP2v8p&__tn__=%2CO%2CP-R"}, {"id": 80, "date": "2014년 11월 25일", "year": 2014, "title": "주부생활 완전정복 ...???", "themes": [4, 5, 14, 2], "content_html": "<p>주부생활 완전정복...???<br>아내가 갑자기 캐나다로 날라간지 한 달 하고도 며칠..<br>기현이를 챙기며 싱글 대디로 살다보니 정말 주부가 얼마나 대단한지<br>거기에 ADHD 를 가진 아들들의 어머니는 얼마나 대단한지를 느낀다.<br>나의 일상:<br>새벽에 애가 일어나기 전에 조용히 일어나 밥을 준비한다.<br>밥을 미리 퍼서 애가 먹을 때 너무 뜨겁지 않게 한다.<br>애를 깨운다. 이게 보통 10분 정도 걸린다.<br>이거 잘못하다 아들의 발차기에 얼굴을 맞은 적도 있다.<br>그리고, 협박과 회유를 곁들여 밥을 입에 쑤셔넣고 나면,<br>아침에 수색가는길에 카 레이서가 된다.<br>애를 보내놓고 학교에 출근해서 일을 시작하거나,<br>때론 집에 돌아가 집안 뒷정리를 하고 나면 벌써 녹초가 된다.<br>이때 한 번 티비를 틀었더니 아침 방송... 넋놓고 보고 있는 나를 발견...<br>잠시 학교일에 집중하다보면<br>벌써 애를 학교에서 데리고 와야 한다.<br>왜 이렇게 학교가 일찌 끝나는지.<br>3시 10분에 픽업하기 위해선 2시 50분에 학교에서 나간다.<br>애를 픽업해 놓고, 학습지를 시킨다.<br>어제 같은 날은 눈높이 선생님이 두 명이 하루에~~><br>오기 전에 숙제를 다 끝내놓기 위해선 또 한번의 전쟁을 치른다.<br>학습지 공부하는 동안 찌개를 끓이고 밥을 하고... ㅠㅠ<br>밥을 먹인 후에는 다시 학교로 데리고 온다.<br>나 일하는 동안 옆에서 조용히 공부를 해 주면 좋지만,<br>이건 거의 이루어 질 수 없는 꿈이다..<br>수업을 하는 동안 옆에 가만히 앉아 있어주는 것만 해도 황송...<br>수업을 끝내고 집에 도착하기 전에는<br>다시 또 축구나 야구를 30분 정도는 함께 해 줘야 한다.<br>집에 돌아가 애를 씻기고 간식을 먹이고 재우면<br>나는 마음도 몸도 영혼도 만신창이가 된다.<br>왜 불쌍한 애에게 소리를 질렀을까?<br>왜 궁데이를 때렸을까?<br>내가 정신이 미쳐가는 것은 아닐까?<br>등등.<br>애를 재우고<br>티비를 보며 멍때리는 시간은 힐링타임이다.<br>왜 아줌마들이 막장 드라마를 보는지....<br>아마 막장 드라마를 보면서 스스로<br>'난 저들 보다는 도덕적으로 훌륭하다' 라고 위안을 하는지도<br>읽어야 할 논문도 많고<br>코멘트를 줘야할 논문도 많은데<br>그냥 다 귀찮다.<br>그리고 자고 있는 아이를 보면<br>왜 이렇게 이쁜지...<br>귀찮다는 애를 꼭 껴안고 잠에 든다.<br>그리고, 다음 날 또 한 번의 전쟁같은 하루가 시작된다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0gVgDoBUu1SNYWjeVcPRWHB68d8N2cvx42kDBVVAW1pc17VrX3wobJDsHavq7Qv1Ul?__cft__[0]=AZWYqUBQwDyvcejI8VBLCXExtr55fNx2yPJssy6ttNSl47uI69Bme7Di63PBQfwVpOdP9DmDM8rRlaKP-496Y5NhSpsNeq8JXkRJXUiLsjxzyyparZlmcCCBvvUdbHUMFPnXeMnE1S1gD8icGtLufzES&__tn__=%2CO%2CP-R"}, {"id": 81, "date": "2014년 12월 27일", "year": 2014, "title": "“젊은 친구들 ,", "themes": [9], "content_html": "<p>“젊은 친구들,<br>여러분 모두 사회 심리학 강의를 들으러<br>여기 모인 줄로 압니다.<br>나는 20년간 사회심리학을 가르쳤습니다.<br>그런데, 이번에 처음으로 이 강의를 들으려면<br>위험을 감수해야 한다는 말을 해야겠습니다.<br>왜냐면 나는 지금 죽을 병을 앓고 있기 때문입니다.<br>어쩌면 전 이번 학기 강의를 마무리짓지 못하고<br>죽을지도 모릅니다.<br>그게 걱정이 된다면, 교과목을 변경해도 좋습니다.“<br>모리와 함께 한 화요일 중에서..<br>10년 전 보스톤을 떠나<br>두려움과 설레임속에<br>한국으로 오는 비행기안에서<br>동관이가 선물해 준 책 ‘모리와 함께한 화요일’<br>을 읽으며 정말 진정한 스승이 되리라<br>눈물로 다짐했었다.<br>그리고 정말 10년이 흘렀다.<br>난 지난 10년간 어떤 스승이었을까?<br>좋은 스승이란 어떤 스승일까?<br>인기 있는 스승을 아닐텐데..<br>제자들을 사랑하는 스승?<br>과연 제자들을 사랑한다는 것은 무엇일까?<br>강의를 잘 하는 교수?<br>강의만 잘 하면 좋은 교수일까?<br>연구를 잘 하는 교수?<br>누구를 무엇을 위한 연구였을까?<br>지난 10년 많은 학생들을 가르쳤고<br>수없이 많은 강의를 했고,<br>많은 새로운 과목을 만들었고,<br>학생들과 엠티를 가지며 수없이 대화를 나누고<br>때로는 눈물을 쏙 빼놓을 정도로 혼을내고<br>때로는 학생들을 가르치다 내 감정에 못이겨 울기도하고<br>학생들의 학구열에 녹아들어 시간 가는 줄 모르고 강의도 해 보고<br>너희들을 믿는 다며 무감독 시험도 해보고<br>학생들과 16시간 연속 무박 2일 강의도 해보고..<br>학생들과 별의별 짓을 다 해보았고,<br>때로는 상처를 주기도 하고<br>때로는 상처를 받기도 하고<br>그렇게 10년이 지났다.<br>앞으로 또 한 번의 10년이 나에게 스승으로 주어진다면<br>지금 보다 더 잘할 수 있을까?<br>아니, 정말 좋은 스승이 아니라<br>진짜 스승이 될 수 있을까?<br>지난 10년간 5번은 읽은 이 책<br>오늘 다시 한 번 새로운 기대를 가지고 읽어본다.</p>", "images": ["pdf2_page80_img0.jpeg"]}, {"id": 82, "date": "2015년 1월 6일", "year": 2015, "title": "저의 대학교 1학년과 2학년 시절", "themes": [8], "content_html": "<p>저의 대학교 1학년과 2학년 시절<br>연세 수첩에 나이트 클럽을 갔던 날에 하트를 그렸던 기억이 납니다.<br>그리고, 일년 중 하트가 그려있던 날이 약 3분의 1 이었던 것도요.<br>공부도 참 못했었죠.<br>왜냐하면, 내가 왜 공부를 해야 했는지를 몰랐으니까요.<br>그러다 캐나다 어학 연수 시절 처음 교회에 나가게 되었고,<br>그러던 중에 좀 특별한 경험을 하게 되었죠.<br>꿈에 예수님께서 나오셔서<br>나에게 어떻게 살아야 할 지를 말씀해주시는 거예요.<br>아주 이상한 경험이었죠.<br>그리고부터 이성적으로 설명이 안되는 일이 생기기 시작했고요.<br>그리고, 해가 바뀌었을때에 누가 나에게<br>One Year Bible을 선물해 주었습니다.<br>날짜에 맞추어 성경을 읽으면 일 년에 한 번 읽는 성경이죠.<br>순서에 맞추어 그냥 읽었습니다.<br>이해를 못하는 부분도 많이 있었고요.<br>또 이게 영어로 된지라~~.<br>그리고, 누가 저에게 현대인의 성경이라고<br>쉬운 말로 쓰여진 성경을 또 선물해 주었습니다.<br>그래서 한글로 성경을 읽는데, 정말 재미있더라고요.<br>이전에 들었던 간증 중에 공부를 잘 못 하시던 분이<br>서울대 의대를 수석으로 졸업하고,<br>의사고시를 수석으로 합격하신 이야기를 들었습니다.<br>그분은 공부하기위해 자리에 앉으면 먼저<br>신약을 한 장 그리고 구약을 한 장 읽고 공부를 하셨다고 하더라고요.<br>그래서 저도 흉내를 내기 시작했습니다.<br>공부하러 앉으면 신약을 한 장 그리고 구약을 한 장...<br>그랬더니, 하루에도 수십장의 성경을 읽게되더라고요.<br>그런데, 그게 너무 재미있는 거예요.<br>공부를 많이 할수록 성경을 많이 읽게되고<br>성경을 많이 읽을수록 지혜가 생겼던 것 같아요.<br>사실 제 대학원생활은 그렇게 성경읽기와 함께 했다고 해도<br>과언이 아닌 것 같습니다.<br>물론, 공부를 잘하기 위해서 성경을 읽는 것은 아니지만,<br>성경을 읽다보니, 내가 무엇을 위해 공부를 해야 하며<br>무엇을 위해 살아야 할 지를 알게되었고요.<br>그런데, 최근들어 뭐가 그렇게 바쁜지<br>성경을 잘 읽지 못하고 사는 것 같아요.<br>그래서, 따로 시간을 내어 오늘부터<br>일주일 내로 신약을 먼저 일 독 하려고 합니다.<br>여러분들을 초대합니다.<br>함께 오셔서 성경의 신비를 깨닫고<br>더 나아가 삶의 방향을 잡아가는<br>기회가 되시길 기도합니다.<br>성경을 마련해야 하기 때문에<br>오시는 분은 미리 연락을 주세요.<br>장소: 신촌 아름다운 교회 소예배실 (신촌역 7번 출구, 롯데리아 지하)<br>시간: 1월 6일 과 1월 13일 (화요일 6-10시)<br>문의: 김광중 간사 (010-5598-0007)<br>회비: 1만원 (성경책과 간식제공)<br>대상: 누구나</p>", "images": ["pdf3_page2_img0.jpeg"]}, {"id": 83, "date": "2015년 1월 15일", "year": 2015, "title": "이번 연말에 다시 읽은 모리와 함께 한 화요일 ...", "themes": [3, 10, 9, 8], "content_html": "<p>이번 연말에 다시 읽은 모리와 함께 한 화요일...<br>10년전 연세대학교에 부임해 오면서 처음 접한 이 책을<br>다시 한 번 읽었다.<br>읽으면서 몇 번이나 눈물을 훔쳤는지 모른다.<br>'감동의 눈물'<br>'부끄러움의 눈물'<br>'후회의 눈물'<br>'새로운 다짐의 눈물'<br>이 책은 한 노교수의 죽음의 과정을 보여준다.<br>우리가 어떻게 죽어야 하는 지를 알려주어<br>어떻게 살아가야 할 지를 알려 준다.<br>이 책은 죽음을 이야기 하고 있지만,<br>실제로는 삶을 이야기 하고 있는 것이다.<br>모리는 이렇게 이야기 한다.<br>'죽게 되리란 사실은 누구나 알지만<br>자기가 죽는다고는 아무도 믿지 않아.<br>만약 그렇게 믿는다면,<br>우리는 다른 사람이 될텐데' p110<br>'미치, 어떻게 죽어야 할지 배운게 되면<br>어떻게 살아야 할지도 배울 수 있다네'<br>사랑이 가장 중요하네.<br>위대한 시인 오든이 이렇게 말했듯이<br>'서로 사랑하지 않으면 멸망하리'<br>사랑이 없으면 우린 날개 부러진 새와 같아.<br>p123<br>'인생은 밀고 당김의 연속이네<br>자넨 이것이 되고 싶지만, 다른 것을 해야만 하지.<br>이런 것이 자네 마음을 상하게 하지만,<br>상처받지 말아야 한다는 것을 자넨 너무나 잘알아.<br>또 어떤 것들은 당연하게 받아들이네.<br>그걸 당연시 하면 안 된다는 사실을 알면서도 말야.<br>상반됨의 긴장은 팽팽하게 당긴 고무줄과도 비슷해.<br>그리고 우리 대부분은 그 중간에서 살지.<br>\"무슨 레슬링경기 같네요'.<br>\"어느쪽이 이기나요?\"<br>\"사랑이 이기지. 언제나 사랑이 이긴다네' p61<br>\"사는 동안 어디를 가든 새 것을 움켜쥐고 싶어하는<br>사람들을 만나게 되네.<br>새 차를 사려고 아둥바둥하고, 부동산을 새로 구입하려고 애를 쓰고<br>최근에 나온 장난감을 움켜쥐고선...<br>자랑하고 싶어 입이 근질 근질 하지.<br>내가 그 말들을 어떻게 해석하는지 아나?<br>이 사람들은 사랑에 너무 굶주려서<br>그 대용품을 받아들이고 있구나.<br>저들을 물질을 껴 앉으면서<br>일종의 포옹 같은 것을 기대하고 있구나.<br>하지만 그런 식으로 해서 될 리가 있나.<br>물질이 사랑이나 용서, 다정함,<br>동료애 같은 것을 대신할 수는 없는데..<br>\"사실 그런 것만으로는 만족을 없을 수 없네.<br>자네에게 진정으로 만족을 주는게 뭔지 아나?\"<br>\"뭐죠?\"<br>\"자네가 줄 수 있는 것을 타인에게 주는 것\"<br>\"의미 있는 삶을 찾는 것에 대해 이야기 한 것을 기억하나?<br>적어 두기도 했지만, 암송할 수 있네.<br>사랑하는 사람들을 위해서 자신을 바쳐라.<br>자기를 둘러싼 지역 사회에 자신을 바쳐라.<br>그리고 자기에게 목적과 의미를 주는 일을 창조하는데<br>자신을 바쳐라.\" p165<br>\"하지만 여기 비밀이 있네.<br>아이 때와 죽어갈 때 외에도<br>즉 그 중간 시기에도 우린 누군가가 필요하네\"<br>(사랑을 주는 것 만 아니라, 받을 주도 알아야 하네)<br>\"자신을 용서하게.<br>그리고 타인을 용서하게.<br>시간을 끌지말게\"<br>\"우리가 서로 사랑하고,<br>우리가 가졌던 사랑의 감정을 기억할 수 있는 한,<br>우리는 진짜 우리를 기억하는 사람들의<br>마음속에 잊혀지지 않고 죽을 수 있네.<br>자네가 가꾼 모든 사랑이 거기 그 안에 그대로 있고,<br>모든 기억이 여전히 거기 고스란히 남아있네.<br>\"죽음은 생명이 끝나는 것이지, 관계가 끝나는 것은 아니네\"<br>\"선생님이 가만히 숨을 쉬자,<br>갈비뼈가 오르락 내리락 하는 것이 느껴 졌다.<br>그때 선생님은 나를 똑바로 바라봤다.<br>\"자네를... 사랑하네\"<br>선생님이 힘겹게 말했다.<br>\"저도 사랑해요. 코치\"<br>\"그건 --- 아네---- 그리고 또 알아-----\"<br>\"뭘 또 아시는 데요?\"<br>\"자네가--- 늘 ---- 그랬다는 걸---\"<br>선생님은 눈을 가늘게 뜨더니 어느새 울기 시작했다.<br>난 몇 분간 선생님을 꼭 끌어안고 있었다. p235<br>선생님의 재가 땅 속에 뿌려졌을 때,<br>나는 무덤 주위를 둘러 보았다.<br>선생님이 옳았다.<br>정말이지 아름다운 곳이었다.<br>나무와 풀과 가파른 언덕.<br>\"자네가 말하라구, 내가 들을 테니.\"<br>선생님은 그렇게 말했었다.<br>행복하게도 그런 상상 속의 대화가 자연스럽게 느껴졌다.<br>무심코 나는 손을 내려 보았다.<br>손목 시계를 본 그 이유를 깨달았다.<br>바로 화요일이었다. p239<br>우린 그냥 생활을 지속시키기 위해<br>수만 가지 사소한 일들에 휩싸여 살아.<br>그래서 한 발 뒤로 물러서서<br>우리의 삶을 관조하며, '이게 다인가?'<br>이게 내가 원하는 것인가?<br>뭔가 빠진 건 없나? 하고 돌아보는 습관을 갖지 못하지.<br>선생님은 잠시 말을 멈추었다.<br>\"누군가 그런 방향으로 이끌어줄 사람이 필요하네.<br>혼자서 그런 생각을 하며 살기는 힘든 법이거든.\"<br>나는 선생님이 무슨 말을 하는지 알았다.<br>우리 모두 평생의 스승이 필요하다는 것을.<br>그리고 내 스승은 바로 내 앞에 앉아 계셨다.p91<br>이 글을 읽는 당신에게도 진정으로 그리워할 스승이 있는지?<br>당신을 있는 그대로 귀한 존재로,<br>닦으면 자랑스럽게 빛날 보석으로 봐준 그런 스승이 있었는지?<br>혹시 운이 좋아서 그런 스승을 찾아 낸다면,<br>그에게 다시 가는 길도 찾을 수 있을 것이다.<br>머리속으로만 그럴 수도 있고,<br>나처럼 선생님의 침대 곁으로 직접 찾아갈 수도 있을 것이다.<br>내 노은사의 일생 마지막 강의는 1주일에 한 차례씩<br>선생님 댁의 서재 창가에서 이루어 졌다.<br>그가 작은 화분에 핀 분홍빛 히비스커스 꽃을 볼 수 있는 그 곳에서.<br>수업을 화요일에 있었다.<br>책은 필요없었다.<br>강의 주제는 인생의 의미.<br>선생님은 경험에서 얻은 바를 가르쳤다.<br>그 가르침은 아직도 계속되고 있다. p244<br>그리고, 모리 교수의 가르침은 이 책을 읽은 나에게도 전달되어진다.<br>결국은 사랑이다.<br>사랑이 답이다.<br>\"사랑하지 않는 사람은 하나님에 대해<br>아무것도 알지 못하는 자입니다.<br>하나님은 사랑이시기 때문입니다.<br>그러니 여러분도 사랑하지 않으면 그분을 알 수 없습니다.\"<br>\"나는 하나님을 사랑한다.\" 고 떠벌이고는,<br>곧바로 형제나 자매를 미워하고<br>아무렇지도 않게 생각하는 사람이 있다면<br>그는 거짓말쟁이입니다.<br>보이는 사람을 사랑하지 않으면서<br>어찌 보이지 않는 하나님을 사랑할 수 있겠습니까?\"<br>우리가 그리스도에게서 받은 계명은 단순 명료 합니다.<br>하나님에 대한 사랑은 사람에 대한 사랑을 포함한다는 것입니다.<br>여러분은 하나님과 사람 모두 사랑해야 합니다. 요한일서 4장 (메시지 성경)</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid09qJLCwNsSUBws5xEUkbzpsqApRz71wdTX1ajM5rTZ2GJMCyaRPxKH8qqiQWn398Cl?__cft__[0]=AZVGmCsOHE1fsvh3tz4uASVc8nVS82z7VDPK1lGcYikuRZH0uUdPWg0W4HGlYaO3-w6qWUl_s-0PJfQOh0x_oA1pXLcvgs6u64TThXazqLAndZf3Z9U8-7rYHhHz-Xwv0LhkcpvEsz2W8Y0-wjTswrTC&__tn__=%2CO%2CP-R"}, {"id": 84, "date": "2015년 2월 6일", "year": 2015, "title": "20년 전 사진이네요 ~~^^ 1994 년도 교환학생 시절이지요", "themes": [5, 9, 12], "content_html": "<p>20년 전 사진이네요~~^^ 1994 년도 교환학생 시절이지요. 분홍색 잠바... 정말 깨네요.<br>Pictures from 20 years ago in Edmonton while I was studying as an exchange<br>student at the U of A</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0paBt2dJ3iKEGo72NVvmBZngt7Sm6SfR81Pj7cRsig7UngoL7i75CHveHG43N5RBpl?__cft__[0]=AZU19-IMoCl6jbG3a9MpfKmQh5vTRlBdRFZyevWj0eBVBGoleYqRXDxE3R8txEGk2kci5NqZNg04D9WH72MxBRk5vwOPQK9i4WkywHEqH9p7zZJjRWcJTDApAKMI6RJDYZjU9OU-OurTZ2Bm8JuoU9Zv-hZvavQd3Z4Dfy2gzMSK0g&__tn__=%2CO%2CP-R", "images": ["pdf3_page7_img2.jpeg"]}, {"id": 85, "date": "2015년 2월 6일", "year": 2015, "title": "이게 뭘까요 ~~?? 캐나다에서 장모님께 사육당하고 있는", "themes": [15], "content_html": "<p>이게 뭘까요~~?? 캐나다에서 장모님께 사육당하고 있는.. ㅠㅠㅠ 무서운 사실은 이게 배에 힘을<br>준 것이 아니라 힘을 뺀 상태라는~<br>— 충격이 이만저만 아니에요</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0paBt2dJ3iKEGo72NVvmBZngt7Sm6SfR81Pj7cRsig7UngoL7i75CHveHG43N5RBpl?__cft__[0]=AZU19-IMoCl6jbG3a9MpfKmQh5vTRlBdRFZyevWj0eBVBGoleYqRXDxE3R8txEGk2kci5NqZNg04D9WH72MxBRk5vwOPQK9i4WkywHEqH9p7zZJjRWcJTDApAKMI6RJDYZjU9OU-OurTZ2Bm8JuoU9Zv-hZvavQd3Z4Dfy2gzMSK0g&__tn__=%2CO%2CP-R", "images": ["pdf3_page8_img1.jpeg"]}, {"id": 86, "date": "2015년 3월 26일", "year": 2015, "title": "학교 잘 다녀왔니 ?", "themes": [4, 1, 9], "content_html": "<p>학교 잘 다녀왔니?<br>오늘 공부 다 했니?<br>잘 놀았니?<br>학교는 재미있었어?<br>숙제는?<br>이런 질문이 내가 우리 애들에게 늘 던지던 질문이다.<br>혹시 학교에서 힘들어 하는 친구는 없니?<br>혼자 밥먹는 친구는 없니?<br>학교 생활 힘들어 하는 친구에게 다가가 따뜻한 말은 해 줬니?<br>나는 살면서 이런 질문을 던져본 적이 없는 것 같다.<br>오늘 새벽기도 시간에 '주랑이'의 간절한 기도를 들으며<br>우리 아이들을 잘못 키우고 있다는 것을 깨달았다.<br>공부는 잘 못해도 남을 배려할 줄 아는 아이<br>선생님의 강의 내용은 잘 이해 못해도<br>선생님을 존중하고 존경할 줄 아는 아이<br>남보다 앞질러 달려 다른 아아들을 눌러 이기려는 아이 보다<br>함께 앞을 보며 걸어갈 수 있는 아이<br>그런 아이를 키워야 하는데....<br>최근 문제가 된 우리 제자들의 잘못된 행동을 바라보며<br>그리고, 내가 키우고 있는 두 아들들의 문제와 어려움을 경험하며<br>정말 우리 제자들을 잘 가르치고 싶고<br>우리 아이들을 잘 키우고 싶은데<br>마치 해산하는 엄마가 힘이 없어 어쩔줄 모르는 심정<br>오늘 아침 나의 심정이다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02WmVnCDG7TZ8bnP7sNpeUYbfBbPmUpnBRXZcCy7eCTyBanEiZFEaRpcGRNDEYKqmYl?__cft__[0]=AZUFSOGJxB53Fn-65owjlUMEi6583uzdVevY4NWSRFREKPu8jB0s11QuLENnG9ZE2CIReNK_Dqv6NwSEV7qxrsCKOj1ZEmkdOruYOxHlzNlrPAoy7KKT3cQn4A636x7LF6uHGFBP0VgadlCNGLebaT_9&__tn__=%2CO%2CP-R"}, {"id": 87, "date": "2015년 3월 28일", "year": 2015, "title": "I am the man with six pack. 나 이런 사람이야 ~~", "themes": [10], "content_html": "<p>I am the man with six pack. 나 이런 사람이야~~</p>", "images": ["pdf3_page10_img2.jpeg"]}, {"id": 88, "date": "2015년 5월 25일", "year": 2015, "title": "할머니는 아버지께서 9살때 돌아가셨으니", "themes": [16, 14], "content_html": "<p>할머니는 아버지께서 9살때 돌아가셨으니<br>무려 81년 전에 돌아가셨다.<br>시신이라고 보고자<br>몰래 들어가 봐버린<br>한 맷힌 찡그린 할머니의 얼굴<br>할머니가 돌아가신 해의 운동회<br>어머니가 싸온 도시락을 먹는 친구들<br>함께 먹자고 앉으라고 하는 동네 아주머니<br>혼자 뒷산에 올라가 눈물을 훔치며 먹은 도시락..<br>'어머님도 야속하시지 80여년 한 번도 꿈에 안나타나시나!'<br>말씀하시는 80대 후반의 아버지...<br>팔순 노인이신 아버님에게도<br>어,머.니가 계셨습니다.<br>평생을 그리워 한...<br>어.머.니..</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02iSpNuvVFNQcpUqqgZwaBaix3fWXWVsUsSUquE3xBeimCzYRy79SZNGnmx6TGHUWul?__cft__[0]=AZVDepPrBWPO67f3Eu6CBZBpyVy54S59KuYeboYZsFpDFqfYiobEZ2TfdX7QOVMMq1RI-pF3NGm2Y0toLATPBt_U1hJaWCzlZak7BsrrW_A6KzUqOmHJZWFH09m-sskuDn8_oCft6x1wp_NwIjJQ1RnI&__tn__=%2CO%2CP-R"}, {"id": 89, "date": "2015년 5월 31일", "year": 2015, "title": "아내와 기현이가 캐나다에 간지", "themes": [10, 2, 4, 1], "content_html": "<p>아내와 기현이가 캐나다에 간지<br>거의 2주가 다 되어가는 오늘<br>나 혼자 학창시절때 다니던<br>딸기골 분식에서 김치 순두부를 먹고<br>팥빙수가 땡겨 옥루몽에 가서 팥빙수를 시켰다.<br>종업원은 나에게 '숫가락은 몇개를 드릴까요?'<br>라고 물었고, 난 '두 개요!' 라고 대답했다.<br>분명히 혼자 먹을 건데,<br>나는 혼자서 팥빙수를 먹는다는것이<br>순간 창피하게 느껴졌던 것 같다.<br>내가 잘 못하는 것이 여러가지 있지만<br>특히 힘들어 하는 것은 식당에 가서 혼자 밥을 먹는 것이다.<br>괜히 혼자 밥을 먹는게 왠지 내가 뭔가 잘 못 산 결과 같은..<br>괜히 루저가 (Loser) 된 것 같은 그런 느낌...<br>나에게 많은 열등감과 두려움이 있지만,<br>그중에 하나가 바로 '왕따 그리고 격리됨' 의 두려움인것 같다.<br>중 3때로 기억한다.<br>공부를 잘 못 했던 나는<br>그나마 좀 나쁘지 않은 싸움 실력으로<br>근근히 나의 자존감을 지키고 있었다.<br>하루는 나보다 싸움 못하는 친구를 괴롭히다<br>주먹에 잘못 맞아 턱뼈에 금이 갔다.<br>난 보름간 병원에 입원해 있었고,<br>다른 이들에게는 싸움을 말리다 그렇게 되었다고<br>거짓말로 둘러댔던 기억이난다.<br>퇴원을 얼마 남지 않았던 어느날<br>난 차라리 인생에 내일이 없으면 좋겠다 생각했다.<br>학교로 돌아가기 보다 인생이 끝나는 것이 낫다고 생각했다.<br>하지만, 그 다음날에도 여지없이 해는 떴고, 난 학교로 돌아갔다.<br>학교에 돌아가고 얼마 지나지 않아<br>방학 보충수업 반편성을 발표했다.<br>'우반과 열반' 난 열반에 배정되었다.<br>열받아 방학 보충수업을 무단 결석했다.<br>난 중학교때 B형 간염에 걸렸다.<br>잘 먹고 절대 안정을 취하라는 의사의 말에 순종했다.<br>갑자기 살이 찌기 시작했고,<br>특히 그 살은 가슴에 붙기 시작했다.<br>여성형 가슴이 되었다.<br>혹시 친구들에게 B 형간염이 전염되지는 않을까 두려워<br>혼자 도시락을 먹었던 기억이 어렴풋이 남아있다.<br>군대에서도 나에게는 나만이 사용하는 식판이 있었다.<br>그리고, 난 불과 수년 전 까지만 해도 나의 병력을 숨기고 싶었다.<br>이런 경험이 내나이 45세를 넘은 지금도<br>혼자 밥을 먹는 것을 수치스럽게 여기게 했는지 모르겠다.<br>나란 사람!!<br>이런 것 다 극복한줄 알았는데,<br>수 십년 전 상처!<br>그 흔적은 나의 삶에 아직도 고스란히 남아있다.<br>내 안에는 아직 온전히 치유되지 못한<br>'상처받은 아이'가 함께 살고 있는 것 같다</p>", "images": ["pdf3_page13_img0.jpeg"]}, {"id": 90, "date": "2015년 6월 5일", "year": 2015, "title": "보스톤에서의 새로운 일상입니다 .", "themes": [3, 13, 5, 8], "content_html": "<p>보스톤에서의 새로운 일상입니다.<br>이번 학기는 여러모로 지치는 학기였습니다.<br>왠지모르게 감사보다는 불평이 앞서고<br>열정보다는 의무감에 일들을 하고<br>그러다 보니 짜증만 늘어가고<br>하나님께 도움을 구했습니다<br>하나님께서 저를 불쌍히 여겨주시고<br>아내는 저를 배려해주었네요<br>당뇨병 연구를 지난 20년간 했지만<br>그동안 문이 기회가 닿지 않던 미국 당뇨병학회<br>이어서 Dana Farber Cancer Institute 과의 공동연구<br>8월 초에야 한국에 돌아가겠네요.<br>학문적으로 정서적으로 영적으로<br>새롭게 충전하고 돌아가겠습니다.<br>오늘 아침은 사랑하는 아내와 함께 즐겨먹던<br>던킨 도너츠 커피와 딸기크림치즈 베이글입니다.</p>", "images": ["pdf3_page14_img2.jpeg"]}, {"id": 91, "date": "2015년 6월 28일", "year": 2015, "title": "Dear David", "themes": [3], "content_html": "<p>Dear David<br>It is your 18th birthday today!<br>I cannot tell you how much I am proud of you.<br>You have been such an wonderful son.<br>I cannot thank God enough for who you have become.<br>There is nothing in this world<br>that can make me love you less.<br>In times of your trouble<br>I will be there to be with you.<br>In times of need<br>I will be there to guide you (does not mean that I will give you everything).<br>In times of despair,<br>I will be there to cheer you up.<br>In times of joy and hapiness,<br>I will be there to celebrate with you.<br>In times of sadness,<br>I will be there to cry with you.<br>I love you!<br>I will be vulnerable for you<br>because I love you!<br>You are and have been and<br>will be the my beloved son.<br>I love so much!<br>On your 18th birthday!</p>", "images": ["pdf3_page15_img2.jpeg"]}, {"id": 92, "date": "2015년 6월 29일", "year": 2015, "title": "아침부터 느낌은 좋지 않았다 .", "themes": [6, 4, 10, 8], "content_html": "<p>아침부터 느낌은 좋지 않았다.<br>새벽을 깨우는 알람소리를 무시하고<br>충분히 잠을 잤다기 보다<br>햇살이 너무 밝아 눈이 떠진 아침<br>기준이가 18세가 되면 가족 회원이 안 되기에<br>자전거를 끌고 YMCA 가족 멤버십을 가입하고<br>가벼운 운동을 끝내고, 사우나 까지 마치고<br>학교를 향해 자전거 패달을 열심히 밟았다.<br>자전거길 곳곳에 보스톤의 추억이 묻어나왔다.<br>자전거를 세워 놓고 독서를 하던 호숫가<br>백발 할머니에게 추월당했던 마의 언덕<br>개제불가 메일 받고 힘들어 하던 공원 벤치<br>힘찬 노래를 들으며 BC 언덕을 내려가<br>오른쪽으로 갈까 직진할까 잠시 머뭇거림<br>스피커에서 들려오는 힘찬 노랫소리에 들뜬 마음<br>코너를 돌아 막힌 차 옆으로 빠지는 순간..........<br>난 자전거를 던지고 몸을 날렸고<br>나의 왼 엉덩이는 기찻길을 때리고<br>나의 몸은 굴러 나의 얼굴로 기찻길에 착지<br>혀로 느껴진 깨진 앞니 뱉은 침과 섞인 핏물<br>헬멧에 보호된 나의 머리 살이 열린 나의 어깨<br>쑥 들어간 나의 앞니, 그리고 긁힌 나의 다리<br>엠블란스를 부르는 사람, 휴지를 가져다 주는 사람<br>차를 열고 바라보는 아이, 쓰러져 버린 나의 자전거<br>이렇게 끝나버린 나의 금요일 출근길...<br>만신창이가 되어버린 나의 얼굴<br>더욱 또렷해진 나의 정신 아니 나의 영혼<br>나의 부주의, 깨어진 교만, 겸손해진 나의 영혼<br>넘어짐은 순간이다.<br>넘어짐은 순간이다.<br>넘어짐은 순간이다.<br>넘어짐도 순간이다.<br>그게 나의 진짜 모습이다.<br>넘어질 수도 있는 나의 모습이 진짜다.<br>넘어진 사람을 판단할 수 없다.<br>넘어진 사람을 정죄할 수 없다.<br>위로하고 격려하고 일으켜 줄 수 밖에는...<br>너무 급하게 너무 서둘러 가지 마라.<br>주위를 돌아보며 위로와 격려를 줘라.<br>주위 사람들에게 위로와 격려를 받아라.<br>함께 주님을 소망하며 주위를 둘러봐라.<br>나의 삶의 저자이신 주님을 바라보라.<br>나의 내면 깊은 곳을 돌아보라.<br>나의 소중한 사람들을 둘러보라.<br>그들 안에 계신 주님을 바라보라.<br>내일 출근할 수 있는 회복에 감사하다.<br>다치지 않은 머리에 감사하다.<br>새롭게 만난 소중한 영혼에 감사하다.<br>주일 저녁 쉼에 감사하다.</p>", "images": ["pdf3_page17_img0.jpeg"]}, {"id": 93, "date": "2015년 7월 1일", "year": 2015, "title": "여러분들의 격려와 기도 덕분에 망가진 얼굴이 4일만에 거의 정상...", "themes": [6, 8, 12], "content_html": "<p>여러분들의 격려와 기도 덕분에 망가진 얼굴이 4일만에 거의 정상적인 얼굴로 돌아왔습니다. 걱<br>정하시는 분들이 많아 사진 올립니다. 여러분들의 격려와 기도에 진심으로 감사드립니다. 화장실<br>셀카는 처음이네~~^^<br>그런데 빠른 회복은 제 회복력 때문은 아니고 여러분들의 기도 덕분인 것 같습니다. 신기할 정도<br>로 빨리 나았습니다.<br>Because of your prayer and encouragement, I had a fast recovery within only last<br>four days. Now I look normal again. Thank you very much for your prayer and<br>encouragement.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0nrUnxpruxLDuwhsKyJ2Z3FnDMT7mbAgoWxAStikqvzjHocKSRFPQR24P93eHjiupl?__cft__[0]=AZWVQ2_mEkkqGCFTjzscZtnpl1je9Us8dPwVEAhXI5RfanwXOT_72rMmsBqazH1qwc63c6ncMHwiNA4J060XsI4h-WMrKGiaMJTV0yjLS9VBshvlY-M1grFKxXakpjSJTeGSmxCYCrpTnsRrj87UxZ09kMOoCqiacynhDQoc4VEoYA&__tn__=%2CO%2CP-R", "images": ["pdf3_page18_img2.jpeg"]}, {"id": 94, "date": "2015년 7월 26일", "year": 2015, "title": "중년의 위기...", "themes": [7, 15, 2, 5], "content_html": "<p>중년의 위기...<br>난 내가 꽤 괜찮은 사람인줄 알았다.<br>하늘을 우러러 한 점 부끄러움이 없는<br>어느 시인의 정도까지는 아니더라도<br>나름 자신에게 그리고 하나님 앞에<br>부끄러움이 없이 살고 있다고 자부했다.<br>살아온 날들보다 앞으로 살날이 적어질수록<br>세상에 쌓아 놓은 것들이 많아질수록<br>절대자 앞에 주위 사람들 앞에<br>그리고 나 자신 앞에 부끄러움은 커져만 간다.<br>더 이상 나 자신을 신뢰하기 어려워져간다<br>강한 것 보다 연약한 것이 아름답다고,<br>의로움 보다 용서와 자비를<br>거룩함보다 긍휼을 외치는 것은<br>혹 나의 연약한 죄많은 모습을 보아서일까?<br>절대자와 사람들의 용서와 긍휼이 필요하기 때문일까?<br>꿈꾸고 도전하기를 멈추고<br>정의를 외치기를 싫어하고<br>거룩하게 사는 것을 포기하고<br>연약함, 타협, 변명을 당연히 여기고<br>중년의 위기로 책임을 떠 넘기기엔 난 아직 너무 젊다.<br>언젠가는 타락한다는<br>열심히 해봐도 안된다는<br>모두가 배신 한다는<br>결국 여기까지라는 두려움을<br>그 차가운 두려움을 이기고 싶다.<br>나의 부르심을 찾아가고 싶다.<br>아버지로서, 남편으로서<br>스승으로서, 한 명의 인간으로서....<br>사랑은 모든 두려움을 이긴다는<br>결국 사랑이 답이라는 말을 믿고 싶다.<br>그래서 언젠가 절대자 앞에 나갈 때에<br>‘그리고 아무 말도 하지 않았다 (전혜린 저)’ 보다<br>‘나도 누군가에게 가서 그의 꽃이 되고 싶다 (김춘수 저)’<br>는 말로 사람들이 나를 기억해주길<br>연약함, 나약함, 깨어짐 속에 샤론의 꽃이 발견되길<br>보스톤 상공에서</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02a96HMxMNLA5jEd6nsfoHLHB1CMCL7yomwmQdWFHWXHc2kiSDAwRBGSPZejWKwaqxl?__cft__[0]=AZXfjI5FucyoE7Me5GUertu43p2eNHc2gA3_0aMC1EQI7FePz8eh0KaQwM2gVmfrA2RJaNbMQEAzGFhX_e008S8LJI3k7BxndSAVxk48Qhzdnx2hv9ivuNzGhzdRgs_6fFL8Njn52RiAIwUaV5bHwJu8&__tn__=%2CO%2CP-R"}, {"id": 95, "date": "2015년 7월 30일", "year": 2015, "title": "제가 사랑하는 한 남자가 있습니다 .", "themes": [3, 8, 4, 14], "content_html": "<p>제가 사랑하는 한 남자가 있습니다.<br>그 이름은<br>성.<br>기.<br>주.<br>처음 만난것은 1990년이지요.<br>그때 일은 잘 기억이 나지 않습니다.<br>그리 친한 사이는 아니었던 것 같습니다.<br>제가 학교를 잘 안가서리..<br>기주는 자꾸 나이트에서 봤다고 하는데~~^^<br>그런데, 기주를 다시 만난것은<br>2003년 보스톤 한국식품이었죠.<br>대장금 비디오를 대여하여<br>뿌듯한 마음으로 가게를 나서는데<br>누가 '용관이형!' 하더라고요<br>저는 '누구 세요?'<br>하는 데 기주가 매우 친한척<br>'형 나야~~! 기주'<br>'기주가 누구신지!!'<br>그제서야 기억이 났지요.<br>제가 군대가고<br>어학연수에 교환학생까지..<br>기주와 학교에 함께 학교에 다닌 적이 오래지 않았죠.<br>그런 기주를 10여년 만에<br>보스톤에서 만났습니다.<br>스캇보라스 같은 사람이 되겠다며<br>스포츠 마케팅을 하겠다고 떠난 기주는<br>보스톤에서 변호사가 되어있습니다.<br>먼 타국에서 만난 기주네 가정과<br>우리 가정은 함께 만나며 회포를 풀었지요.<br>제가 포닥을 하며 우리는 그렇게 새롭게 알아갔습니다.<br>그리고 전 연세대학으로 임용되어 한국으로 돌아갔지요.<br>그리고 또 7년이 지나 2011년<br>다시 연구년으로 보스톤에 돌아왔습니다.<br>기주에게 연락을 해 보아야지 했지만<br>정착하느라 정신이 없어 연락도 못했지요.<br>기준이 기현이를 학교에 보내고<br>이사를 도와주신 장모님을 공항에 배웅하고<br>아내와 찰스강에 있는 멕도날드에서 햄버거를 먹고있는데<br>'용관이 형!' 하고 누가 부르는 것이 아니겠습니까?<br>ㅋㅋ 바로 기주!<br>'형 왠일이야?\"<br>그렇게 우리는 또 만났지요.<br>7년여만에 만난 기주는 변호사로서<br>또 한 인간으로서<br>남편으로서 그리고 아버지로서<br>훨씬 성숙해 져 있었습니다.<br>기주와 기주의 아내<br>두 사람은 천사같이<br>우리 가정이 다시 보스톤에 적응하도록 도와주었습니다.<br>정말 하나님께서 우리 가정에 보내주신 천.사.<br>함께 시간을 나누고, 사랑을 나누고 삶을 나누었지요.<br>그리고 또 시간이 흘러 우리는 아쉬운 이별을 했습니다.<br>2015년 우리가 떠난지 3년만에<br>저는 이곳 보스톤에 다시 왔습니다.<br>어김없이 기주는 보스톤에서 저를 맞이해 주었습니다.<br>그리고 저에게 예수님의 사랑을 부어주었습니다.<br>너무나 멋지게 성숙한 모습으로 저를 이끌어 주었죠.<br>기주는 2년간 거의 한주도 빠짐없이<br>매주 목요일이면 Lynn 에 있는 캄보디아 교회에<br>푸드뱅크에서 나오는 음식을 배달해 줍니다.<br>그곳에 가보니 어린 아이들과 청소년들이<br>'엉클 조셉' 하며 기주에게 꼬옥 안깁니다.<br>기주를 맞이하는 저들의 얼굴에는<br>사랑과 감사가 깃들어 있었습니다.<br>기주의 모습에는 베푸는 사람으로서의 오만이 아닌<br>섬기는 자로서의 사랑과 겸손이 있었습니다.<br>기주를 따라다니며 저도 그분들을 알아가는 특권을 누렸네요.<br>기주.<br>쎈척 하지만 너무나 부드러운<br>강한척 하지만 너무나 여린<br>예수님의 사랑을 가진<br>소년의 순수함을 지닌<br>아름다운 영혼입니다.<br>이번에 자전거 사고가 크게 났을때<br>제일 먼저 떠오른 얼굴 '기주'<br>마치 자기가 다친 것 처럼 아내에게 전화해<br>'용관이형 고쳐줘여 한다며' 호들갑을 떤<br>그래서 토요일에 열지도 않는 병원을 열어<br>깨진 이빨을 치료해준 기주 아내<br>참 고마운 사람<br>아름다운 사람<br>천사같은 사람들 입니다.<br>꼭 다시 만나고 싶은<br>평생을 함께하고 알아가고 싶은 사람들 입니다.<br>함께 서로 늙어가는 것을 보고싶은<br>애들들이 결혼하고 또 서로의 손자손녀를 보고싶은<br>그런 가정입니다.<br>모든 것은 시작이 있듯이<br>끝이 있지요.<br>이제 보스톤에서의 꿈과같은 7주를 끝내고<br>사랑하는 가족이 있는 캐나다로 갑니다.<br>공항에 앉아 곰곰히 생각해 보니<br>하나님의 은혜와 기주네 가정의 친절이 생각이 나네요.<br>떠나는 아쉬움을 달래려 기주네 제 자전거를 맡기고 갑니다.<br>뭐라도 하나 남겨야 다시 돌아올 것 같아서요.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02dxgM5Ai5zbfHsNbfczLNvvkKDFwpWteLnjo19zsBa4dN8N2hYS8PjsfAbP6a13W5l?__cft__[0]=AZXnDEVLfXbREqpKWX3X_fFt_ueyS7eYXpoxXztMA4TtQVdd9S95qukgVVd0ZP_VBJmYqBDaFzgUGwdgN_IdjDSu2mbudtGlRbneeZvDQ4A1AzZYC3pJpvfnOjtyMCII4UNKpzHl3tftuGM4cf-6td1k&__tn__=%2CO%2CP-R"}, {"id": 96, "date": "2015년 8월 16일", "year": 2015, "title": "인생이 퇴보하고 있다고 느낄 때...", "themes": [13, 5, 9, 1], "content_html": "<p>인생이 퇴보하고 있다고 느낄 때...<br>모든 것이 헛수고로 느껴질 때...<br>이로 인해 자존감이 바닥을 칠 때...<br>그래서 심지어는 우울해 질 때...<br>바로 3년 전에 내가 겪은 모습이다.<br>원대한 꿈을 안고 교환교수로 미국에 도착했다.<br>나는 나름 잘 나간다고 생각하고 있는 명문대 교수였는데,<br>뭔가 새로운 발전과 성장을 위해 고생을 각오했지만,<br>전지전능한 대학원생들을 그동안 내가 얼마나 의지했는지<br>그 사실을 깨닫기까지 오래 걸리지 않았다.<br>사실 말이 교환교수지, 결국 포닥의 대접을 받으며.<br>병원 의사들을 쫓아다니고, 새로운 암환자 컨퍼런스<br>Tumor Board 에 그저 앉아 귀를 쫑끗 세우며 듣고<br>(이건 한국말로 뭔지 잘 모르겠네요)<br>새로운 통계분석 방법을 배우고,<br>새로운 연구 방법을 배우고 (Clinical Trial, Meta-analysis)<br>통계학자에게 별도의 강의료를 지불하고 일대일 튜터를 받고<br>유명한 학자들을 찾아다니며 스스로를 소개하고<br>새로운 연구 아이디어에 대해 토론을 했지만,<br>난 저들에겐 그저 동양에서 온 한 명의 체육 전공 학자에 불과했다.<br>그곳의 팰로우, 그리고 대학원생들과 함께 사무실을 쓰고<br>그곳의 암환자들을 위한 운동프로그램에 참여하며,<br>새로운 것들을 가르치고 시도해 보고 싶었지만,<br>나의 역할은 석사출신의 운동처방사의 도우미...<br>8개월간 난 그저 운동도우미로 숫자를 세는 역할을 했다.<br>그리고, 때때론 운동 자세를 교정해 주기도 하고.<br>내가 그들에게 나를 증명할 수 있는 유일한 방법은 유명 학술지 논문개제<br>열심히 논문을 썼다. 그리고 열심히 논문을 투고했다.<br>그런데, 돌아오는 것은 “Rejection Letter” (개제불가편지)<br>한국에 있을 때는 강의하느라 바쁘고,<br>봉사하느라 바쁘다는 핑계나 댈 수 있지만,<br>그곳에서 내가 하는 것이라고는 연구밖에 없는데,<br>12번 연속 개제불가라는 진기록을 세웠다.<br>나의 연구력이 인정을 받지 못하면서,<br>심한 정체성의 위기에 빠졌다.<br>“난 연구체질이 아닌가?”<br>거기에 경제적 어려움까지 겹치면서,<br>그저 한국으로 돌아가고 싶었다.<br>그래도, 한국에서는 나름 인정받는 교수인데....<br>우리 학생들은 그래도 나를 인정해 주는데...<br>한국에서는 두 배 더 큰 연구실을 혼자 사용하는데...<br>한국에서 석사출신 운동처방사들을 키우는데....<br>학생들을 곁에 두고 연구하면 훨씬 더 많은 것을 할 수 있을 텐데,<br>괜히 미국에 온 거 아닌가?<br>괜히 암 연구 한답시고 떠벌인 것은 아닐까?<br>자기 연민에 빠져 (Self pity), pity party를 하고 있을 때에<br>문든 활과 화살의 그림이 떠올랐다.<br>화살이 날아가 목표를 맞추려면 활시위에 잘 장착이 되어야 한다.<br>화살은 멀리 날아가려는 만큼 더 멀리 뒤로 당겨져야 한다.<br>아, 혹시 보스톤에서의 생활이 뒤로 당겨지는 과정이 아닐까?<br>일상 보다 더 불편하고, 더 낮아지고, 더 많이 실패하고,<br>더 많이 좌절 하고, 더 많이 깨어지고 그리고 상처받는 것......<br>스스로를 위안하기 위한 합리화라고 하더라도,<br>난 그렇게 생각하기로 했다.<br>“그렇다. 난 절대자의 손에 나의 삶을 맡긴 것이다.”<br>“그리고, 난 더 많이 더 많이 뒤로 당겨지고 있는 것이다.”<br>“그래서, 더 많이 깨어지고, 상대적으로 뒤처지고,<br>마치 퇴보하고 있다고 느끼고 있는 것이다.“<br>그리고, 이런 나의 생각은 결과론으로 보면 옳았다.<br>불편했지만, 많은 것을 깨달았고,<br>자존심은 상했지만, 많은 것을 배웠고,<br>겸손해 질 수 있었고, 많은 이들을 섬길 수 있었고,<br>사실 무엇보다 나 스스로 얼마나 부족한 자인지를 배웠다.<br>만약 화살이 활시위에서 뒤로 당겨지는 중에,<br>옆에 보이는 앞으로 튕겨져 나가는 다른 화살을 부러워한다면<br>그래서, 더 뒤로 가는 것이 두려워 반쯤 뒤로 당겨지다가,<br>스스로 튕겨져 앞으로 쏴 진다면....<br>그 화살은 절대로 과녁에 도달하지 못할 것이다.<br>화살이 제 역할을 다 하려면, 활에 맡겨져 뒤로 충분히 당겨져야만 한다.<br>결국 하나님의 은혜로 1년간의 안식년(고난년)을 잘 마쳤고,<br>일 년 중 8개월은 암환자 운동프로그램 보조로 있다가,<br>4개월은 주도적으로 암환자 운동을 가르치고<br>(무엇보다 암환자들과 너무 소중한 시간들을 함께 보냈다)<br>1년간 매주 2-3회 암 관련 세미나에 참석하며 많이 배우고,<br>개제 불가 받았던 논문들 1년 내 모두 개제하고,<br>그 결과 지난 3년간 SCI(E) 급에 개제된 논문의 수가,<br>지난 15년간 개제한 논문보다 무려 1.5배 이상 발표하게 되고,(물론, 이렇게 논문을 발표하는데<br>는 대학원생들의 역할이 지대했다)<br>무엇보다 질환별 근거기반 운동프로그램들을 개발하게 되었다.<br>만약, 우리가 새로운 기술을 얻고자 뒤쳐진것 같다면,<br>새로운 것을 배우느라, 업적을 내고 있지 못하다면,<br>학위를 하며, 열정페이를 받으며 고생하는 동안<br>재수를 하며 혹은 입시준비를 혹은 고시준비를<br>아니면 구직을 하면서<br>주위에 앞서 나아가고 있는 친구들이 눈에 들어온다면,<br>그래서, 자존감이 많이 낮아졌다면,<br>스스로의 등을 두드려 주며 한마디 하면 좋겠다.<br>“괜찮아! 난 지금 활시위에서 뒤로 당겨지고 있는 중이야!”<br>혹은, 더 이상 앞으로 나아갈 힘을 느끼지 못한다면,<br>자신의 활동의 원동력을 잃어버렸다면,<br>혹은 자신의 비전을 잃어버렸다면,<br>꿈을 상실했다면,<br>지금은 앞으로 나아갈 때가 아니라,<br>뒤로 물러설 때일 수도 있다.<br>절대자의 활시위에 자신의 삶을 맡기고,<br>뒤로 당겨져야 할 때일 수도 있다.<br>뒤로 당겨지는 것을 두려워 하지 말아야 한다.<br>실패하는 것을 두려워 하지 말아야 한다.<br>가장 큰 실패는 아무것도 하지 않는 것이다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02JqS1vfsCYUN1duH2QzUjrfHSVafShedWPiQHkhzkFHyZL82fdkoMRNHqkt41mo7tl?__cft__[0]=AZXf9EHZnxg2ahSgyp7sJ_YhDH-rBR7-MDsje7o6n3-7it45bxIu2WxaBEQp1i0lwXzDb6EJrGQTz_H8fAlxhCTrQ2d3VVHPdK55IXcoH_wMORJq_gIoVP3mcmrURnlR5pkKvvoubo50w4j8K8GFXTOu&__tn__=%2CO%2CP-R"}, {"id": 97, "date": "2015년 8월 21일", "year": 2015, "title": "최선을 다했는데 결과는 좋지않네요 .", "themes": [5, 6, 8, 12], "content_html": "<p>최선을 다했는데 결과는 좋지않네요.<br>후회는 없지만 아쉬움은 남습니다!<br>그래도 최선을 다해볼 기회가 있었음에 감사하네요~^^<br>함께 고생한 연구원들에게 감사하고 또 미안하네요!<br>또 다른 도전을 해 보아야겠습니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02hvg9FzBT922xwA5t9gfyPLWHuEGUJ4BebzgeRdyL5PD39p8sBAVB7UacbX5SyAMvl?__cft__[0]=AZXkm_DlMvmt7H6U_VGy_y8d1Uenr7NgrAjxYo2Qk__H4AxK4BWCzJi9ODUcfIdQT8XmvTtzOF48ASHrOvVeta318hNywXd1HBZ78i578ZTjxLdeEhwy_xJQnSyz3Sgp6zUTMpPcZc82EXZigHE0zvkq&__tn__=%2CO%2CP-R"}, {"id": 98, "date": "2015년 9월 6일", "year": 2015, "title": "캐나다 알버타 주립대학 모교의 체육과 설립 50주년 기념 그리고...", "themes": [9, 11, 12, 13], "content_html": "<p>캐나다 알버타 주립대학 모교의 체육과 설립 50주년 기념 그리고 교수 대학원 세미나와 Retreat<br>이 합쳐진 ReCON 에 영광스럽게 초대를 받아 우리 학생들과 함께 밴프 옆 캔모어에 와 있습니<br>다. 드디어 오늘 제 메인 발표가 끝나고 이제 한숨 돌렸습니다. 곧 한국에 돌아갑니다~~^^<br>그런데 역시 캐나다입니다. 오늘 함박눈이 내리네요~~^</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0EfeBsBnLZeupdjzJKYcA5FJpFPRZ8aqeoEpdxqwa2WZWYBwvPrKBWUReXcQkAJ2Bl?__cft__[0]=AZWw2w8G-jTKKO00qka66pNCgvjlcmo-dfDW1x5NWmrYUef4uUNkoWCXHQJG2UvU6QaP1M-M1fNk0RevA3GgTAdHX8MnsFiS4wzKIBSrHW5WyYozueki5h2IHsLLXG1gSfY0L_ffaZPiiQF35JjAlSSd2lCBqwQ_sNJKm1lr_4LmGA&__tn__=%2CO%2CP-R", "images": ["pdf3_page26_img2.jpeg"]}, {"id": 99, "date": "2015년 9월 20일", "year": 2015, "title": "주의력결핍과잉행동장애로인한 문제 행동", "themes": [5, 9, 11, 1], "content_html": "<p>주의력결핍과잉행동장애로인한 문제 행동<br>초 5학년 성적 '양미양양가우양양미양양'<br>중학교 2학년 70명중 53등,<br>학창시절 여름 보충수업 우열 반 중<br>열반에 배정된 것이 창피해<br>학교등교를 거부,<br>자신보다 싸움 못하는 애를 괴롭히다가<br>한 대 맞아 턱뼈가 부러져 2주간 병원에 입원,<br>대학교 1학년 때 전신 화상을 입어 병원에 한 달간 입원,<br>이후 자신의 화상 상처를 다른 사람들이 볼까봐<br>3년간 반바지를 못입고 다님,<br>대학교 1학년 성적 4.0 만점에 2.63,<br>발표에 자신이 없어 자기소개 시간만 되면 두근 두근 가슴이 떨림,<br>첫사랑 여인 자신의 선배와 열애중인 사실을 알고 자살생각,<br>외모에 대한 열등감과 낮은 자존감에 종종 괴로워 함<br>........<br>바로 나 자신의 이야기 이다.<br>나는 강화도 시골출신의 부모님 밑에 딸 다섯 가진 집의<br>막내아들로 태어났다.<br>어려서부터 누나들에게 못생겼다고 혹은<br>다리 밑에서 주워왔다고 놀림을 받고 자랐다.<br>난 학교에 다니면서 그 흔하디 흔한 반장 부반장<br>한번 못하고 자랐다.<br>학교 임원에 가장 가까웠던 것은 줄반장도 아니고<br>줄부반장이었던 것으로 기억한다.<br>참. 청소부장은 몇 번 했던 것으로 기억한다.<br>하지만, 난 어려서부터 운동은 참 좋아했다.<br>요즘 아이들 보면 유아체육이다 뭐다 해서<br>야구, 축구, 농구등의 스포츠교실에 참여하지만,<br>우리 어렸을 때에는 동네 야구, 축구, 딱지먹기와 구슬 치기가<br>우리가 참여하는 스포츠 활동이었다.<br>이런 스포츠 활동에서 난 두곽을 나타냈고,<br>한때는 야구 선수를 꿈꾸기도 했다.<br>초등학교 6학년때에는<br>88 꿈나무로 체육 중학교 진학을 권유받기도 했다.<br>그러나, 3대 독자인 아들이 운동선수가 되고 싶다는 사실에<br>부모님은 별로 좋아하지 않으셨고,<br>나 역시도 쉽게 포기했다.<br>서울 강북에 있는 학교에서 반 15등정도 하던 나의 성적은<br>강남에 있는 학교를 이사하자마자 반 53등으로 곤두박질 했다<br>(한 반에 70여명).<br>한번 떨어진 성적은 다시 오를 생각을 하질 않았고,<br>잠 안오는 약까지 먹으며 열심히 공부한 내가<br>중학교 때 받았던 최고의 석차는<br>30몇 등으로 기억한다.<br>한때는 우열반중 열반에 들어간 것이<br>스스로 챙피해 학교에 가지 않은 적도 있다.<br>그래도 나의 자존감을 지켜주던 한 가지는<br>탁월한 싸움 실력이었다.<br>난 싸워서 진적이 별로 없었다.<br>하지만, 나를 지켜주던 그 자존심 마저도<br>나보다 못 싸우는 애를 괴롭히다가,<br>그 친구가 휘두른 주먹에 맞아 턱뼈가 부러져<br>15일간 입원하게 되면서 박살나게 되었다.<br>도대체 잘 하는 것도 없었고<br>또 잘 되는 일도 없었던 나였다.<br>정말 지옥 같은 중학교시절을 끝내고<br>휘문고등학교에 입학하게 되고,<br>역도부에 들어가 주장이 되면서<br>나의 낮은 자존감은 조금 나아졌다.<br>그리고, 이어 내가 정말 좋아하는 체육을<br>운동선수가 되지 않아도<br>공부하고 전공할 수 있다는 사실을 깨달은 후<br>연세대학교 체육교육학과를 목표로 한 후부터<br>오히려 성적도 향상되게 되었다.<br>그리고, 꿈에 그리던 연세대학교에 입학하게 되었다.<br>난 입학하면서부터 정신없이 술과 향략에 빠졌고,<br>또한 수상스키에 빠져 학교 공부와는 담을 쌓고 살게 되었다.<br>1989년 8월 수상스키 훈련 중 보트가 터지는 사고가 나면서<br>내 몸의 30퍼센트에 화상을 입고<br>한 달간 병원에 입원하여 치료를 받게 되었다.<br>도대체, 나는 되는 일이 없는 것 같았다.<br>누군가 나에게 꿈이 무언지를 물어보는 것이 겁이 났다.<br>왜냐하면 나는 꿈이 없었기 때문이었다.<br>스포츠를 좋아했지만,<br>과연 앞으로 대학을 졸업하고<br>무엇을 해야 할지 도무지 떠오르지 않았다.<br>그러던 와중에 6개월간의 군생활을 하게 되었다 (3대독자병역특례).<br>물론 6개월간 기동타격대에 복무하면서<br>고생을 안 한 것은 아니지만,<br>다른 친구들에 비하면 턱없이 짧은 기간이었기 때문에,<br>군 생활을 마치고 캐나다에 이민 가서 사는 누님 댁에 머물며<br>1년간 영어 공부를 할 수 있는 기회를 가졌다.<br>캐나다에 가기 전만해도 난 하루 담배를 두 갑을 피고<br>거의 매일 술을 마시는 생활을 하고 있었다.<br>뭐랄까? 현실로 부터의 도피라고 할까?<br>난 그런 것이 필요했다.<br>1992년 도착한 캐나다의 겨울은 혹독했다.<br>그리고, 반편성 고사를 못 보고 배정된 영어학교에서는<br>“I am Tom. You are Jane\"을 배웠다.<br>대학까지 다니다온 내가 이런 것을 공부해야 하는 것에 한심했지만,<br>별 다른 할 일이 없는 나로서는 학교 공부에 매진했고,<br>교과서를 거의 다 외우다 시피 했다.<br>그렇게 공부를 하던 나를 많은 유학생들이 비웃었다.<br>중학교 1, 2학년 교과서 수준의 영어문장을 (요즘은 초등학교 3, 4 학년)<br>밤새워 공부하듯이 하는 나의 모습이 나름 우스웠을 것이다.<br>그렇게 일 년 정도 공부를 하니 어느 정도 회화와 독해에 자신이 붙었다.<br>그런데, 그 사이 나의 삶의 터닝 포인트가 되는 일이 일어났다.<br>누군가 중국사람 두 세 사람이 모이면 식당을 열고,<br>한국사람 두 세 사람이 모이면 교회를 짓는다고 했던 것 같다.<br>내가 있던 캐나다 역시 교포들의 대부분은 교회를 출석하고 있었고,<br>나의 누님들도 예외는 아니었다.<br>철저한 불교 집안에서 자란 나는<br>교회에 가는 것이 그동안 금기시 되어 있었지만,<br>캐나다에서는 예외였다.<br>나는 자연스럽게 교회에 출석 했고,<br>내가 생각해도 우스운 이중적인 생활을 했다.<br>술담배에 쩌든 금요일과 토요일을 지내고,<br>일요일이 되면 거룩한 척 교회에 앉아있는 모습이<br>스스로 우스웠지만,<br>누님댁에 살고 있던 나로서는<br>일요일 아침이면 조카들과 함께 교회에 가지 않을 수 없었다.<br>그렇게 교회에 나가던 중에<br>나 스스로의 모습을 발견하게 되었고,<br>예수님이 누구신지,<br>나의 인생의 목표가 무엇인지,<br>그리고 존재의 이유가 무엇인지를<br>어린 나이였지만 깨닫게 되었다.<br>그리고, 나의 인생의 목적이 나 자신만을 위한 것이 아니라는 것을 알게 되었고,<br>이후 장애인 체육을 나의 인생의 비전으로 찾게 되었다.<br>이때부터 나의 인생은 새로운 전환기를 맞이하게 되었다.<br>‘꿈꾸기’ 는 나의 삶의 중요한 부분이 되었고 ‘꿈을 이루기를 도전하기’ 는 나의 일상이 되었다.<br>그리고, 나 스스로 설득이 될 때까지는<br>꿈을 포기하는 것은 있을 수 없는 일이 되었다.<br>나는 나의 인생의 꿈을 꾸면서,<br>내 인생의 목표로 삶는 일은 재미가 있어야 한다고 생각했다.<br>그러나, 재미만 있고 의미가 없다면<br>자칫 인생을 헛되게 보낼 수 있을 것이다.<br>반대로, 의미만 있고 재미는 없다면,<br>인생이 매우 무미 건조할 것이었다.<br>그 와중에 내가 좋아하는 체육을 통해서 사람들을 도울 수 있는<br>장애인 체육을 공부하여 사회에 기여하는 것을<br>나의 인생의 목표로 삼았다.<br>하지만, 그 당시 한국에서는 장애인 체육을 가르치는 곳이 없었다.<br>나는 자연스럽게 유학을 생각했고,<br>또한 교환학생을 생각하게 되었다.<br>토플시험을 처음 봤고, 563점이라는 점수를 획득하게 되었다.<br>만족할 만한 점수는 아니었지만,<br>교환학생을 신청할 수 있을 정도의 점수였다.<br>그 점수를 들고 의기 양양하게 교환학생을 신청하러 간 나는<br>이미 교환 학생 신청기간이 두 달 전에 마감된 것을 알게 되었다.<br>하지만, 난 장애인 체육을 공부해<br>사회에 기여하기를 꿈꾸기 시작하였고,<br>또 교환학생이 그 당시에 할 수 있는<br>유일한 길이란 것을 생각할 때에 포기할 수가 없었다.<br>난 다시 교환학생 사무실을 방문했고,<br>이미 3학년 2학기를 다니고 있던 나는<br>교환학생을 신청할 자격조차 없다는 사실을 알게 되었다.<br>하지만 나는 포기할 수 없었다.<br>왜 4학년때는 안되느냐고 묻는 나에게<br>그 교직원 선생님은 4학년을 외국에서 교환학생을 할 경우<br>제때에 졸업하는데에 문제가 되는 경우가 많기 때문이라고<br>이야기 해 주었다.<br>나는 되물었다.<br>“제때 졸업 못하면 한 학기 더 다니면 되는 것 아닌가요?”<br>요즘은 초과 학기를 밥 먹듯이 하지만,<br>당시만 해도 4년에 대학을 못 졸업하는 것을<br>거의 낙제생들이나 하는 것으로 인식이 되던 때였다.<br>어쨌든, 나의 질문에 교직원 선생님은<br>‘그러네’ 라고 수긍을 하면서도,<br>이미 다른 교환학생들은 선발이 되어 서류 준비를 하고 있던 차에,<br>내가 교환학생을 가는 것을 형평성에 어긋난다는 이야기를 하며<br>책임을 연세대학교의 창립자인<br>언더우드 선교사님의 4세손인 원한광 박사님에게 돌렸다.<br>나는 그분과 약속을 잡고 약속 시간에 그분의 사무실에 갔다.<br>그분은 자리에 없었다.<br>30여분을 기다린 나는 메모를 남기고 왔고,<br>다시 약속시간을 잡게 되었다.<br>그리고, 또 그 분을 만나러 갔을 때에도<br>그분은 나와의 약속을 지키실 수가 없었고,<br>나는 다시 약속을 잡게 되었다.<br>이후 세 번의 약속 만에 원한광박사님을 만나게 되었고,<br>나에게 왜 교환학생을 가기를 원하느냐고 물으셨다.<br>나는 장애인 체육을 공부하고 싶으며,<br>장애인 체육을 통해 사회의 약자를 섬기고 싶은데<br>한국에서는 장애인 체육을 가르치는 곳이 없으니 교환학생을 가야 한다고 이야기했다.<br>정말 놀랍게도 그분은 나의 교환학생 신청을 받아주셨다.<br>그리고, 학교가 두 번 정도 바뀌는 경험을 하며,<br>내가 영어공부를 하던<br>캐나다 알버타 주립대학게 교환학생을 신청하게 되었다.<br>사실, 이 또한 있을 수 없는 일이었다.<br>왜냐하면 알버타 주립대학은<br>토플이 580점이 넘어야 신청할 수 있으며,<br>9월 학기에만 신청을 받는데,<br>나는 1월 학기에 교환학생을 간다고 신청한 것이기 때문이었다.<br>그런데, 이유는 모르지만,<br>난 꼭 알버타 주립대학에 가야 한다고 생각했고,<br>알버타 주립대학이 아니면<br>일본이나 호주 혹은 유럽으로 교환학생을 가야 했었다.<br>교환학생을 신청하고 알버타 주립대학에서<br>답이 오기까지 약 한달 간 매일 기도했었던 것 같다.<br>그리고, 나의 교환학생 신청을 알버타 주립대학에서도<br>이례적으로 허가해 주었다.<br>(사실 1년간 어학연수를 할 때에 내가 청강을 할 수 있도록<br>도와 주셨던 교수님이 그 학과 부학장님 되어계셨다.<br>그 사실을 모르고 나에게 친절을 배풀어주신 교수님께<br>앞으로 못 뵐 지도 모른다고 생각하고 한국에서 공수해온<br>보석함을 선물로 드렸었다.<br>그분은 내 원서를 보고, Justin 내가 잘알아! 얘 영어 잘해!<br>라며 교환학생으로 받아주신 것이다)<br>나는 1994년 12월 다시 캐나다 에드먼튼에<br>교환학생으로서 공부를 시작하게 되었다.<br>그런데, 그곳에서 교환학생으로 공부를 하다가,<br>내가 왜 그곳에 있어야 하는지를 알게 되었다.<br>하루는 장애인체육개론이라는 과목을 수강하던 중에,<br>교수님께서 세계장애인올림픽 위원회<br>(International Paralympic Committee, IPC)의 조직을 설명해 주셨다.<br>그리고 설명을 하시던 중에 자신이 IPC 의 회장임을 말씀하셨다.<br>나는 나의 귀를 믿을 수 없었다.<br>“아니, 세상에, 장애인올림픽위원회 회장님이 이 수업을 가르치는 교수님이라니!” 난 그 수업이<br>끝나자 마자 그 교수님을 찾아가
