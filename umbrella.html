function renderThemeButtons() {
    const container = document.getElementById('themeButtons');
    let html = '';

    html += `<button class="theme-btn view-all-btn active" data-theme="all" onclick="filterByTheme('all', this)">
        전체보기 <span class="count">${TOTAL_POSTS}</span>
    </button>`;

    for (let i = 1; i <= 16; i++) {
        const name = THEMES[String(i)];
        const count = THEME_COUNTS[String(i)];
        html += `<button class="theme-btn" data-theme="${i}" onclick="filterByTheme(${i}, this)">
            ${name} <span class="count">${count}</span>
        </button>`;
    }

    container.innerHTML = html;
}

function filterByTheme(themeId, btn) {
    currentFilter = themeId;

    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');

    const themeTitle = document.getElementById('currentTheme');
    if (themeId === 'all') {
        themeTitle.textContent = '전체보기';
    } else {
        themeTitle.textContent = THEMES[String(themeId)];
    }

    renderPosts(themeId);

    document.getElementById('currentTheme').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderPosts(themeId) {
    const container = document.getElementById('postsContainer');
    let filtered;

    if (themeId === 'all') {
        filtered = POSTS;
    } else {
        filtered = POSTS.filter(p => p.themes.includes(themeId));
    }

    document.getElementById('postCountDisplay').textContent = `${filtered.length}편의 글`;

    if (filtered.length === 0) {
        container.innerHTML = '<div class="no-posts">해당 주제의 글이 없습니다.</div>';
        return;
    }

    let html = '';
    filtered.forEach((post, idx) => {
        const themeTags = post.themes.map(tid =>
            `<span class="post-theme-tag">${THEMES[String(tid)]}</span>`
        ).join('');

        html += `<div class="post-card${post.featured ? ' featured-card' : ''} fade-in" style="animation-delay: ${Math.min(idx * 0.03, 0.5)}s" id="post-${post.id}">
            <div class="post-header" onclick="togglePost(${post.id})">
                <div class="post-header-left">
                    <div class="post-title">${post.title}${post.featured ? ' <span class=\"featured-badge\">★ 대표글</span>' : ''}</div>
                    <div class="post-date">${post.date}</div>
                    <div class="post-themes">${themeTags}</div>
                </div>
                <div class="post-toggle">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </div>
            </div>
            <div class="post-content">
                <div class="post-content-inner">
                    ${post.content_html}
                    ${post.images ? '<div class="post-images">' + post.images.map(img => '<img src="images/umbrella/' + img + '" loading="lazy" onclick="window.open(this.src)">').join('') + '</div>' : ''}
                    ${post.fb_link ? '<a href="' + post.fb_link + '" target="_blank" class="fb-link">📎 원문 보기 (Facebook)</a>' : ''}
                </div>
            </div>
        </div>`;
    });

    container.innerHTML = html;
}

    const card = document.getElementById('post-' + postId);
    if (card) {
        card.classList.toggle('expanded');
    }
}

    document.querySelectorAll('.post-card').forEach(card => card.classList.add('expanded'));

function collapseAll() {
    document.querySelectorAll('.post-card').forEach(card => card.classList.remove('expanded'));

        document.querySelectorAll('.sort-btn').forEach(function(b) { b.classList.remove('active'); });
        if (order === 'oldest') {
            document.getElementById('sortOldest').classList.add('active');
        } else if (order === 'newest') {
            document.getElementById('sortNewest').classList.add('active');
        }
        
        currentSort = order;
        
        // Get current visible cards
        var container = document.getElementById('postsContainer');
        var cards = Array.from(container.querySelectorAll('.post-card'));
        
        cards.sort(function(a, b) {
            var dateA = getDateFromCard(a);
            var dateB = getDateFromCard(b);
            
            if (order === 'oldest') {
                return dateA - dateB;
            } else {
                return dateB - dateA;
            }
        });
        
        // Re-append in sorted order
        cards.forEach(function(card) {
            container.appendChild(card);
        });
    }
    
    function getDateFromCard(card) {
        var dateText = card.querySelector('.post-date');
        if (!dateText) return 0;
        var text = dateText.textContent;
        var match = text.match(/(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/);
        if (match) {
            return new Date(parseInt(match[1]), parseInt(match[2]) - 1, parseInt(match[3])).getTime();
        }
        return 0;
    }
</script>

</body>
</html>
