나를 소개하였던 기억 난다.<br>이후 캐나다에서 장애인체육과 장애인 스포츠와 관련된<br>모든 수업을 다 듣게 되었다.<br>그리고, 캐나다에서 교환학생으로 공부하던 중에,<br>나의 평생의 반려자인 아내, 진아를 만나게 되었고,<br>1년간의 교환학생을 마치고 한국으로 돌아온지 넉 달만에<br>양가의 허락과 축복을 받으며 기말고사를 본지 2주만에<br>결혼식을 올리게 되었다.<br>그리고, 다시 알버타 주립대학에서 IPC 회장님을 모시고<br>석사과정을 공부하게 되었다.<br>석사과정을 공부하던 중에 장애인들이<br>당뇨병에 많이 걸린다는 사실을 깨닫고,<br>장애인을 위한 당뇨병치료운동효과검증을 하게 되었는데,<br>바로 그 때에 당뇨병전문의면서 나의 논문 지도교수님이셨던 분이<br>세계 최초로 1형당뇨병치료 수술법을 개발해<br>세계적으로 유명해 지셨다.<br>이후 박사과정을 공부하게 되었고,<br>그 과정에서 비만유전자로 알려진 렙틴이라는 호르몬의 기능을<br>척수장애인을 모델로 사람에서 규명하게 되었으면,<br>그 논문은 세계적인 의학 학술지에 실리게 되었다 (JCEM).<br>이 과정에서 상당히 많은 장학금과 연구비를 수혜하게 되었고,<br>이후 당뇨병에 대해서 더 공부해야 겠다는 생각에<br>하버드대학의과대학을 목표로<br>박사후 과정을 하는 것을 꿈꾸게 되었고,<br>(사실 이 날 아침에 성경을 읽는 중에<br>'구하라 그리하면 너희에게 주실 것이요<br>찾으라 그리하면 찾아낼 것이요<br>문을 두드리라 그리하면 너희에게 열릴 것이니<br>구하는 이마다 받을 것이요<br>찾는 이는 찾아낼 것이요<br>두드리는 이에게 열릴 것이니라. 마태복음 7:7-8<br>말씀을 읽고<br>내가 구할 수 있는 최고의 것을 무엇일까?<br>고민하던 중에, 비만관련 최고연구를 하고 있는<br>하버드대학에서 포닥을 하기를 구했었다)<br>1년 후 나의 꿈은 현실이 되어<br>2003년부터 2005년 연세대학교 교수로 임용이 되기까지<br>하버드대학교 의과대학에서 비만과 당뇨를 연구하게 되었다.<br>(하지만, 보스톤에서의 2년간의 생활을 통해,<br>나는 인생 밑바닥을 경험했고,<br>그곳에서 내가 얼마나 보잘 것이 없는 자인지를<br>하나님의 은혜가 아니고서는 난 하루도 살 수 없는 자임을<br>온전히 깨닫는 시간이었다)<br>미래는 꿈꾸는 자의 것이다.<br>이미 이루어진 꿈은 과거 혹은 현실이지 미래는 아니다.<br>나는 대한민국의 청년들에게 감히 꿈을 꾸라고 말하고 싶다.<br>자신의 필요와 이기적인 욕심만을 채우는 꿈이 아니라,<br>보다 나은 대한민국 그리고 세상을 위한 꿈!<br>생각해 보라.<br>자신의 성공이 스스로에게 뿐만 아니라,<br>다른 사람들 더 나아가 사회의 성공을 이루어 낼 수 있다면<br>이 얼마나 행복한 일인가?<br>그리고, 그 꿈을 포기하지 않으며,<br>끝까지 도전하는 청년들이 더욱 많이 나오기를 바란다.<br>만약에 내가 교환학생을 신청하는 것을 일찌감치 포기했었다면,<br>만약에 원한광 박사님을 세 번만 찾아가고 포기했더라면,<br>그리고 교환학생 신청과정에서 조교와 소통에 문제가 있었을 때에 포기했더라면,<br>나의 인생은 어떻게 바뀌었을까?<br>나는 장애인 올림픽위원회의 위원장님인<br>우리 교수님을 만날 수 없었을 것이고,<br>하버드 대학에서의 연구는 더더욱 할 수 없었을 것이고,<br>지금 내가 관여하고 있는 장애인 관련된 모든 일들,<br>또한 연세대학교 교수 역시 될 수 없었을 것이고,<br>최근 결과들이 나오고 있는 암, 당뇨, 비만연구들 또한<br>할 수 없었을 것이고,<br>내가 지금 만나는 나의 사랑스러운 학생들도<br>만날 수 없었을 것이고,<br>무엇보다도 내 사랑하는 아내 진아를 만나<br>결혼하는 것을 더더욱 없었을 것이다.<br>하지만,<br>무엇보다 나의 삶을 향한 하나님의 부르심을 찾을 수 없었을 것 같다.<br>내가 제일 좋아하는 성경의 구절 중 하나는 창세기 41:52 절 말씀이다.<br>자신의 형제들에게 팔려가 이집트의 노예였던 요셉이 이집트의 총리가 되어<br>자신의 아들들의 이름을 지어주는 구절이다.<br>“둘째는 에브라임이라고 하였으니, 이는 고난의 땅에서 하나님께서 나를 축복하셨음이니라.”<br>고난의 땅은 영어로 Land of my suffering 으로 표현한다.<br>나에게 고난의 땅은<br>나의 낮은 자존감,<br>낮은 성적,<br>부족한 자신감,<br>외모로 인한 열등감<br>(나의 vulnerability)<br>그런데, 바로 나의 고난의 땅에서<br>고난을 이기게 하신<br>그리고 그 땅에서 열매 맺게 하신 그분의 뜻은 무엇일까?<br>소그룹에서 자신을 소개하는 것 조차 두려워 했던 내가<br>수 백명, 수 천명 앞에서 강의를 하고,<br>더 나아가 평창 동계올림픽 유치 발표를<br>전세계 IOC 위원들 앞에서 발표를 하게 하신 이유는 무엇일까?<br>혹시<br>동일한 고난과 어려움에서 힘들어 하고 있는 사람들에게<br>조금이나마 힘이 되라고 하신 것을 아닐까?<br>혹시 취직이 되지 않아 힘들어하고 있는 청년들에게,<br>그리고 자신의 뜻대로 연애가 되지 않아 힘들어 하고 있는<br>젊은이들에게,<br>왕따를 당해 죽고 싶은 청소년들에게,<br>여러 가지 다른 이유로<br>죽고 싶을 만큼 힘들어하고 있는 젊은이들에게<br>꼭 이야기 해 주고 싶다.<br>당신이 지금 꿈꾸기 시작한다면,<br>그리고 그 꿈을 포기하지 않고 뼈를 깍듯이 노력한다면,<br>(물론, 나 자신도 이 부분이 많이 힘든 부분이지만...)<br>바로 당신의 힘들어하고 있는 그 부분 (고난의 땅에서) 에서<br>성공의 열매를 맺게 될 것이고 (하나님의 시간에)<br>당신의 성공이 또한 많은 이들의 꿈이 될 수도 있음을.....<br>결국 고난과 실패는 성공과 더 나은 미래를 위한 디딤돌이었음을....<br>(아무리 헬조선이라고 하더라도,<br>헬조선이라 등지고 떠나기를 결심하기보다<br>헬조선을 정말 살고싶은 나라로 만들기를<br>꿈꾸는 청년들이 더욱 많이 일어나기를,<br>이들을 세우기를 꿈꾸는 중년들이 더욱 많이 일어나기릴)<br>그러고 보니<br>What makes me vulnerable makes me beautiful 이라고<br>한 테드 강의의 말이 더욱 이해가 간다.<br>__________________________________<br>4년전 글인데, 문득 생각이 나서 다시 정리해 보았다.<br>힘들어하는 청년들에게 나의 챙피하고 부끄럽고<br>부족했던 삶의 이야기가 조금이나마 힘이되길 소망한다</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02LiyCsws9hRwisBh3p8NE4f59cJjqjDndXa8wTbFLLzkQCyoGknXeehgQVBJsRzMAl?__cft__[0]=AZU-bm96kwpdXnit03qfc9TNGkqEGfTK8-ejyN-TTQnCi4wLnZh_W3IgKzA-7O8PwJjV_Q2zWoInmjKzIK23NSvI6y-YBjAEQzgYcV682EeUtxN8X4lcJbbmw6x5CLR2IRXIf73pcaT-bnZtUjuVm3JU&__tn__=%2CO%2CP-R"}, {"id": 100, "date": "2015년 11월 22일", "year": 2015, "title": "박.성.제", "themes": [8, 3], "content_html": "<p>박.성.제<br>제 인생에 하나님께서 보내주신 매우 소중한 사람<br>나에게 뿐 아니라 많은 사람들에게 소중한 사람<br>그랬기에 떠남이 많은 이들에게 충격이었던 사람<br>6개월 전에 한 교회의 전도사님께 연락을 받았다.<br>와서 연애 강의를 해 줄 수 있냐고.<br>기도해 보고 연락을 드린다고 했다.<br>기도해 보았냐고 연락이 왔다.<br>이번 학기는 힘들고,<br>다음학기에 연락을 주면 상황을 보겠다고 했다.<br>연락이 왔다.<br>거절할 수 없었다. 그래서 하기로 했다.<br>그리고, 그 시간이 다가왔다.<br>바로 오늘.<br>정말 너무 바쁜 요즘 일정.<br>너무 부담되었다.<br>그리고 교회로 오는 길에<br>성제가 생각이났다.<br>바로 성제가 살던 동네였다.<br>점점 교회가 가까와 질수록<br>혹시 이 교회가 성제가 다니던 교회???<br>혹시나 하고 교회에 도착을 했고<br>전도사님께서 교회 카페로 안내해 주셨다.<br>커피 주문을 하려는데 한분이 인사를 하신다.<br>'제가 페북을 통해서 아는 분 같아요!'<br>혹시 성함이....<br>네 전용관인데요<br>저 성제 누나예요......<br>아!! 이럴 수가!!!<br>너무나도 놀라운일에 함께 울었다.<br>너무나도 사랑했던 성제!<br>캐나다에 있느라 마지막 가는길을<br>스카이프을 통해 인사해야 했는데..<br>이후 누님을 만나려 했었는데<br>몇 번 약속을 잡으려다 못 봤는데...<br>오늘 이렇게 만나게 된 것이다.<br>어떻게 이런일이!<br>하늘나라에 있는 성제가 무슨일을 한 것인가~?<br>성제는 암 투병중에도 만나면 자기 교회 청년회 이야기를 했었는데!<br>사실 나는 삼주 전 마음이 많이 힘든 가운데<br>뜬금없이 성제가 너무 보고싶어<br>성제 페북에 보고싶다는 글을 남겼었다.<br>그런데 오늘 내가 성제가 그토록 사랑하고 섬겼던<br>동일 교회 청년부원들에게 밀씀을 전하는 것이다.<br>놀라운 주님의 섭리에 온몸에 전율이 느껴졌다.<br>그리고, 교회 곳곳에 성제의 흔적을 발견하였다.<br>'박성제 장학금' 성제 유가족이 1억을 기부하여 장학금을 만들었단다.<br>참 감사하다.......<br>하나님께서 오늘 내게 주신 귀한 선물이었다.<br>놀라우신 하나님!!!!!<br>기쁜마음으로 주례를 위해 제주로 향한다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid029ZMUr8HcTuykXrupknBzRiKf2ANJcdCEAt7gDqxCRPjyca41PaSdDm2gMEzR2Q3el?__cft__[0]=AZUHj3KBC8gTi6HnXxNVB06re3kREZgwI6Kc9IhbdoyxEoyrvmZ3LZU--QsnWZBwAfv1x-4HJJ9H00DqeGx6bkZlUFIDGaLEy6atjpTHCy-L3dLHmcoA7U-OfLtkqPHcOcFWn1-4u9TWgQ4iy9k7Lenv&__tn__=%2CO%2CP-R", "images": ["pdf3_page40_img0.jpeg"]}, {"id": 101, "date": "2015년 11월 23일", "year": 2015, "title": "오늘 새롭게 탄생한", "themes": [3], "content_html": "<p>오늘 새롭게 탄생한<br>신랑 고이상군과 신부 이영순양을 소개합니다.<br>세계에서 가장 아름다운 섭지코지에서 결혼한 가장 아름다운 부부(올인촬영장소) 입니다.<br>남편은 중국인 신부는 한국인!!!<br>Let me introduce newest wed couple!!<br>Chinese groom and Korean bride getting married in Jeju island!!</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0YpkmgkLAfoJn5xkSnYYg17cbPDaFbdJwLztQMZFuXJg1ckaVdJMpPrm7ZHTY927Pl?__cft__[0]=AZVwP1N4X2bekQ7G23fZ4xqtvfJV8_LHIJzyFUs4e19HIoMUMKXs-j-MEUWfz8LZjWbDZxIelgqY4L9AKj64iQtpnaXFu_sBVmPGdQXFS6A8b470NMgiT-eNv6wsPFqtWZncptX5Fn2V_9S_UFDb1QMKQwlly6FA8gHyM5obxNLGFQ&__tn__=%2CO%2CP-R", "images": ["pdf3_page41_img2.jpeg"]}, {"id": 102, "date": "2015년 11월 24일", "year": 2015, "title": "은혜로 오늘 하루의 일정을 마쳤습니다 .", "themes": [11, 8], "content_html": "<p>은혜로 오늘 하루의 일정을 마쳤습니다.<br>대한 장애인체육회가 생긴지 벌써 10년이 되었네요!!<br>장애인<br>체육이<br>남북</p>\n<p>관계의 물꼬를 트는 도구로 사용되어지면 좋겠습니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02jRVr2LqP2o8dGdM6rz71U9t9okkwnDhtH62mZTjZQCLsF6zVd59NAUahufjg8szzl?__cft__[0]=AZWBzXxuMEFUD1b5lXm8RX9ZwXG0qhgY4YVIVEYIq_GAWyXgB9jcT7E5xvMMRzg3M1RQHLlA-f2VnTTwTEEFC_rrRF9TPuw55P_XYhXTaugI8wKyrWcN1mqHep2omruinTrt9HbxnjF9efQCFW4pAuD9uN85cJmDandZloi7HSPLHQ&__tn__=%2CO%2CP-R", "images": ["pdf3_page42_img2.jpeg"]}, {"id": 103, "date": "2016년 2월 23일", "year": 2016, "title": "하루는 학생중 한 명이 찾아왔습니다 .", "themes": [16, 4, 9, 10], "content_html": "<p>하루는 학생중 한 명이 찾아왔습니다.<br>진로상담을 하는 내내<br>얼굴이 편치 않아 보였습니다.<br>'무슨 문제가 있니?'<br>저는 물었습니다.<br>'집을 나왔어요' 라고 학생은 대답했습니다.<br>'왜?' 라는 나의 물음에<br>그 학생은 대답했습니다.<br>'아빠가 나가래요!'<br>전혀 뜻 밖의 대답에<br>나는 또 물었습니다.<br>'왜?'<br>'자취를 하겠다고 했더니,<br>그럴거면 아예 집을 나가라고 하시더라고요'<br>'그래서 알아다고 했더니,<br>이제 저는 자신의 딸이 아니래요'<br>이 이야기를 하면서,<br>이 학생은 눈물을 보였습니다.<br>그 이야기를 듣는 저는 저또한 아버지로서<br>상당히 가슴이 아팠습니다.<br>그 아버지의 말은<br>집을 나가라는 이야기가 아니죠.<br>그 아버지의 말은<br>자취를 하지 말라는 말이었죠.<br>물론, 평생을 정말<br>눈에 넣어도 아프지 않을 것 같던 딸이<br>위험하게 혼자 산다는 이야기가<br>받아들이기 어려우셨나 봅니다.<br>그 뒤로 아버지도,<br>딸도 힘들었을 것입니다.<br>그래서, 제가 물었습니다.<br>\"아버지의 말씀이,<br>집을 나가란 이야기일까?<br>아니면,<br>자취를 하지 말라는 이야기일까?\"<br>\"자취를 하지 말라는 이야기인것 같네요\"<br>그 학생이 대답합니다.<br>흔히 듣는 이야기 입니다.<br>\"그렇게 공부할꺼면 때려 쳐\"<br>공부를 때려치라는 이야기 일까요<br>아니면, 공부를 열심히 하라는 이야기 일까요?<br>'너 다시 한 번 남의 물건에 손을 대면,<br>내 손에 죽을 줄 알아!\"<br>내가 널 죽여버린다는 이야기 일까요,<br>절대 다른 사람의 물건에<br>손을 대지 말라는 이야기 일까요?<br>'나를 버리고 가시는 님은 십리도 못가서 발병난다'<br>발병이 나라고 저주를 하는 걸까요?<br>나를 버리지 말라는 간절한 애원일까요?<br>물론 말을 하는 사람도 과격하게<br>감정적으로 어떠한 결과를 놓고<br>협박하지 말아야 합니다.<br>협박은 상대방에가 두려움을 일으켜<br>그 사람의 마음을 조종하는<br>아주 좋지 않은 것입니다.<br>가능하면 이런 대화법은 하지 않아야 겠지요.<br>하지만, 듣는 사람도<br>말하는 사람의 속마음을 이해해야 합니다.<br>그 마음을 헤아려 주면 좋겠죠.<br>짜증이 섞인 아내의 말에,<br>남편의 위로가 필요하다는<br>그 속 마음을 이해해야 합니다.<br>짜증이 섞인 남편의 말에<br>직장에서 힘들었다는,<br>아내의 격려가 필요하다는<br>그 속마음을 이해해야 합니다.<br>공부 때려칠래 라는 아들의 말에<br>'아빠 나 미래가 두려워,<br>나 할 수 있을까?'<br>라는 애절한 호소를<br>아빠가 들어야 합니다.<br>'그렇게 공부할 거면,<br>다 때려 쳐!' 라는 아버지의 말에<br>아들의 미래를 향한 간절한 소망과<br>'나도 어떻게 해야 할 지 잘 모르겠어' 라는<br>두려움을 이해해야 합니다.<br>너무 어려운가요?<br>우리는 다 위로가 필요합니다.<br>우리는 다 사랑이 필요합니다.<br>우리는 다 격려가 필요합니다.<br>우리는 다 그 누군가가 필요합니다.<br>우리 모두가 서로에게 위로가 되면 좋겠습니다.<br>서로에게 말로 상처주지 않았으면 좋겠습니다.<br>우리의 말 한마디 표정 하나가<br>서로에게 힘과 위로가 되었으면 좋겠습니다.<br>모든 위로의 근원이 되시는 그분의 위로가<br>우리 모두에게 있으면 좋겠습니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02a2DFgRSfgVqusX3tCbhKxNXizsGJxJ888ubqxmukoXmh93FXNJBWRQjGsz2giTmNl?__cft__[0]=AZWh7Pik9yuXy9SqeDrYWtFZD_tGKM_ZCbAX3DDLgIoVXvGvXluBKSnB4GuxF-yp1_8457EcVTQbbAoq8e-s2LhKEBJIqM0EZrvWitt6ei1Vo5TuhXU9-NyQO8G26Oc9tqHHeQS9G__fWAzA7QJ6sQjca8i77AFM_LqOwDaArJNuQg&__tn__=%2CO%2CPH-R"}, {"id": 104, "date": "2016년 2월 28일", "year": 2016, "title": "끊임없는 점프와 착지로 인해 생긴", "themes": [1, 10, 11, 5], "content_html": "<p>끊임없는 점프와 착지로 인해 생긴<br>퇴행성관절염<br>유럽의 경쟁선수들에 비해<br>동양인으로서 상대적으로 작은키<br>상대적으로 더 짧은 다리<br>해가 지날 수록 떨어져 가는 유연성<br>고질적인 발목 부상 (쉬어야 난단다....ㅠㅠ)<br>사실 리듬체조 선수로서는 거의 환갑의 나이란다.<br>이 모든 것을 극복하기 위해서는<br>끊임 없는 노력과 훈련이 필요하다.<br>남들보다 조금 더하는 노력이 아니라<br>뼈를 깎는 더 큰 노력이 필요하다.<br>그런데, 어떻게 지금보다 더 노력할 수 있지...<br>한치의 실수도 용납되지 않는다.<br>신체적 불리함을 극복하기 위해서는 말이다.<br>이러한 신체적 불리함은 심리적 압박감으로 다가온다.<br>신체적 한계를 넘어서게 된다.<br>체력적 부담감에 실수를 하게된다.<br>하지만, 이 모든 것을 이기고 잘 하고 있다.<br>이번 프로그램이 나오기까지 얼마나 힘들었는지 알기에<br>신체적으로도 그리고 마음 속으로도.......<br>마음을 다해 응원한다.<br>까짓거. 한 번 끝까지 가보는 거지..<br>이번 월드컵에서 1, 2, 3등의 연기를 보면서<br>다른 선수들의 신체적 조건을 보면서<br>퇴장할때 끝까지 발끝으로 걷는 연재를 보면서<br>그리고 발목에 감겨있는 테이프들을 보면서<br>마음이 짠해짐을 느낀다.<br>연재야 너무 잘했다.<br>즐기며 하다보면 좋은 결과가 있겠지...<br>넌 이미 충분히 잘했고,<br>정말 리듬체조 불모지에서<br>우리 국민들에게 이미 충분히 너 할 도리를 다 했다.<br>이제 너를 위해 너의 꿈을 위해<br>다른 사람을 만족시키기 위해서가 아니라,<br>너 스스로를 위해 즐기면서 하루 하루 최선을 다하자.<br>파이팅이다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02zkFRrRECGBTWzT69S1nUhvGu1sASmtKfAfoknRdqchaNF9GcJifXvWTe41ZoExqnl?__cft__[0]=AZWtFgAX1m9Mvealtl0N_EYRI9chcx5fX40a-KK978KewkibCXmj9Dsgam_-mG6P4Ep4P6w4OK43obs63Ccug17dQCpIOPYHbj2ePSH84U-kvJG1NKYMSUwFelq6C6aMdiv3sCcN4YJCJFzgiOlUhuTGIB2MEy9DzFVqEC4pBz5pvg&__tn__=%2CO%2CP-R", "images": ["pdf3_page44_img0.jpeg"]}, {"id": 105, "date": "2016년 2월 29일", "year": 2016, "title": "죽는 날까지 하늘을 우러러", "themes": [3, 5, 13, 8], "content_html": "<p>죽는 날까지 하늘을 우러러<br>한점 부끄럼이 없기를.<br>잎새에 이는 바람에도<br>나는 괴로워했다.<br>별을 노래하는 마음으로<br>모든 죽어가는 것을 사랑해야지<br>그리고 나에게 주어진 길을<br>걸어가야겠다.<br>오늘 밤에도 별이 바람에 스치운다.<br>윤동주<br>.<br>.<br>2월의 마지막 날..<br>낮에 아내와 이야기 하는 가운데<br>내일 모레면 새학기가 시작한다는 사실<br>방학동안 한 번도 쉼 다운 쉼을<br>갖지 못했다는 사실을 알아버렸다.<br>동. 주.<br>.<br>.<br>영화가 나온다는 사실을 알았지만,<br>페북에 올린 지인의 후기가 생각이났다.<br>아내가 준 저녁 휴가<br>난 극장으로 향했다.<br>무려 60여 학번 선배님에 대한 내용이지만,<br>26세 대학을 졸업하고,<br>해방을 수개월 앞두고, 29세의 나이에 감옥에서 돌아가신<br>한명의 청년에 대한 이야기...<br>내 나이 이제 47세<br>한 청년의 이야기를 바라보며<br>그가 처했던 시대적 상황과<br>그 시대 한국인들의 겪을 수 밖에 없었던<br>내적 그리고 외적 갈등을 간접적으로나마 느끼며<br>그리고,<br>영화의 마지막<br>\"죽는 날까지 하늘을 우러러<br>한점 부끄럼이 없기를.... \"<br>하며 나오는 나레이션에<br>가슴 깊은 곳으로 부터 오열이 올라왔다.<br>한 점 부끄럼이 없기를...<br>한 점이 아니라<br>한 보따리..<br>아니 그 이상....<br>부끄러움 투성이인 나의 모습이 투영되어졌다.<br>\"잎새에 이는 바람에도 나는 괴로워했다.\"<br>나도 한 때에는<br>양심에 거리낌이 있을때<br>괴로워하며 밤잠을 못 자기도 했는데...<br>어느 순간 타협과 합리화가 일상이 되어버린<br>좋은 연구자란 무엇인가?<br>구글에 좋은 연구자를 검색하니<br>최근에 투서와 감사원의 조사에 지친<br>너무나 훌륭하신 한 교수님의 자살이야기가 나온다.<br>좋은 연구로 하나님께 영광을 돌리고<br>많은 이들을 이롭게 하기위해 연구를 시작했는데<br>어느새, 연구와 연구비 스트레스때문에<br>주변 사람은 사랑하지 못하고,<br>하나님을 실망시켜드리는 괴물이 되어가는 것은 아닌지...<br>좋은 교육자가 되길 다짐했는데,<br>출석부의 이름을 부르며 무릎으로 기도했었는데<br>어려운 학생을 붙들고 눈물로 기도한 적이 있었는데.<br>학생이 나의 섬김의 대상이 아니라<br>내가 섬김의 대상이 되어가고 있는 것은 아닌지.<br>그걸 당연히 여기고 있는 것은 아닌지...ㅠㅠㅠㅠ<br>\"별을 노래하는 마음으로<br>모든 죽어가는 것을 사랑해야지.<br>그리고 나에게 주어진 길을<br>걸어가야겠다\"<br>오늘 다시 한 번 마음을 새롭게 다짐하건만,<br>다음달, 다음 주 아니 내일 나는 또 잊고 살아가겠지..<br>그래도, 나에게 주어진 길을 걸어가야겠지<br>매일 새롭게 다짐하며<br>괴물이 되지 말자고,<br>괴물은 되지 말자고,<br>모든 죽어가는 것은 아닐지라도<br>내 주변의 사람들을 사랑하자고<br>감사하며 존중하며 격려하며<br>그리고, 나에게 주어진 길을<br>묵묵히 걸어가자고...<br>시대적 상황속에서<br>최소한 괴로워하기는 하자고<br>주변 사람의 어려움을 최소한 가슴으로 느끼자고<br>큰 도움을 안되더라도, 따뜻한 손을 내밀자고<br>아니 내미는 손을 뿌리치지는 말자고...<br>함께 울어주자고...<br>자신없게 다짐해 본다.<br>\"오늘 밤에도 별이 바람에 스치운다\"</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02hu38WwrqDL4m21gn45vigjfTp5hEC2N8Ukn5z2qDDczjuhiy4CK5YRAu7hzDB78ql?__cft__[0]=AZW36EraxULqhEQMIiIv-1NA-TbvrY-0sFsfbkda14mIU8xQaqBwzOfUmsl5rg_vGgGJZPqqxRDfT4mwzI2l-_T4vG0YiYBpuOLU2IHm-8ghWRYP3yoFoC-URtnJpF-PsEqFrGWgv2N2LZVM4C3ZDOYr&__tn__=%2CO%2CP-R"}, {"id": 106, "date": "2016년 3월 28일", "year": 2016, "title": "이런 거지같은 나의 처지....", "themes": [8, 7, 1], "content_html": "<p>이런 거지같은 나의 처지....<br>왜 나는 되는 일이 없지?<br>도대체 왜... 왜... 왜....<br>그런데,<br>때로는 시간이 지나서 보니<br>아~~> 그래서 그 때 나에게 그런일이 일어났구나....<br>이해하게 될 때가 있다.<br>똑같은 상황<br>변한 것은 없지만,<br>같은 상황을 바라보는 눈이 아니 관점이 바뀐다.<br>우리에게 일어난 어려운 상황속에 우리가 택할 선택은<br>첫째) 남을 탓한다<br>둘째) 환경을 탓한다<br>셋째) 자신을 탓한다.<br>넷째) 그냥 분노한다<br>다섯째) 모든 걸 포기해 버린다<br>나도내게 어려운 일이 생겼을 때에<br>위 다섯가지 중에 하나를 택해서 반응하고 있는 것 같다..<br>그런데, 위 다섯가지 말고 다른 방법이 있다.<br>첫째) 왜 나에게 이런 일이 생겼을까 분석한다<br>둘째) 이런 일이 생긴 이유가 무엇일까 고민한다<br>셋째) 어려운 일 뒤에 숨어있는 좋은 일이 뭔가 생각해 본다.<br>넷째) 자신에게 생긴 어려운일에 의미를 부여한다. 혹은 그 속에 있는 의미를 찾는다는 말이 더<br>맞는 말일수도<br>다섯째) 그 일이 생긴 것을 감사하기로 작정한다.<br>여섯째) 감사한다.<br>이 방법이 내가 생각한 방법이 아니라<br>사실 이집트 왕자의 주인공 모세에게 일어난 상황이다.<br>자신이 유대인으로서 이집트의 왕자로 살게된다.<br>이집트의 왕자로 살면서도<br>사실 자신의 민족이 노예로 고통받는 것을 보면서 마음아파한다.<br>그리고 자신의 힘으로 뭔가 해 보려고 한다.<br>그 결과 이집트 사람을 죽이는 살인을 하게된다.<br>(모세의 처음 40년, He thinks he was somebody)<br>그리고, 바로의 칼을 피해 광야로 도망간다.<br>광야에서 도망자로 살다가,<br>미디안 광야에서 만난 제사장의 데릴사위가 된다.<br>아내인 십보라와 결혼을 하여 아들을 낳고<br>그 아들의 이름을 게르솜이라 한다.<br>그 뜻은 \"이방의 땅, 광야에서 나그네가 되었다\" 이다.<br>뭔가 Self-Pity 자기 연민이 느껴지는 이름<br>어쩌면 동족과 더 나아가 하나님을 원망하는 느낌이다.<br>그리고, 시간이 지난다.<br>모세와 십보라는 둘째 아들은 낳는다.<br>그리고, 이번에는 그 이름을 \"엘리에셀\" 이라고 짓는다.<br>그런데, 그 이름의 뜻이, \"나의 아버지의 하나님께서 나를 도우사<br>바로의 칼에서 나를 구원하셨다\" 이다.<br>상황은 똑같은데,<br>아직 광야에서 살고 있는데,<br>자신의 고향인 이집트로 돌아가지 못하고<br>광야에서 이방인으로서 자신의 양도 아닌<br>장인의 양을 치고 있는 목동의 처지로 살고있는데..<br>자신에게 일어난 상황을 이제<br>하나님께서 바로의 칼에서 구원하셔서<br>미디안 광야로 오게하셨다는 사실을 깨닫게 된 것이다.<br>그리고, 아마도 광야에서 40년이 지나는 동안<br>자신이 이스라엘을 구원을 위해서 할 수 있는 것이 아무것도 없다는 사실을 깨달았을 것이다<br>(모세의 다음 40년, He realizes that he is nobody)<br>상황은 똑같은데,<br>그 상황 속에서 하나님의 계획을 보게 된 것이다.<br>그리고 나서 광야에서 장인의 양을 치다가<br>한 그루의 떨기나무가 타고 있는 광경을 보게 된다.<br>그리고, 그곳에서 하나님을 만나게 된다.<br>비로서 자신의 소명 (calling) 을 알게 된다.<br>모세의 80세부터 하나님이 부르실 때까지의 40년간<br>\"He realizes that nobody can be somebody\"<br>라는 사실을 깨닫고,<br>자신이 이 세상에 태어난 이유를<br>자신이 세상에 태어난 목적을 이루게 된다.<br>나의 과거...<br>어두운 과거..<br>아니 어쩜 정말 거지같은 현실..<br>지지리도 못난 나의 모습들...<br>부족함께 찌질함 투성이인 나의 모습들..<br>여기에 의미를 부여해보려한다.<br>게르솜이 아닌<br>엘리에셀이 나의 고백이 되면 좋겠다.<br>나의 실패와 고난 속에 피어난 잡초가<br>죽어가는 사람을 살리는 약초가 되면 좋겠다.<br>잡초가 약초가 되는 인생<br>오늘 다시 한 번 꿈꾸어 본다.<br>겸손, 깨어짐, 연약함, 순결함<br>Humility, brokenness, vulnerability and purity<br>첫번째 이야기<br>2년 전 캐나다에서 있었던 Latter Day Rain 부흥에<br>직접 참여하셨던 102살 드신 메드리드 여자 목사님을<br>직접 그 집에서 찾아뵙는 기회가 있었습니다.<br>102 살이라는 사실이 믿기지 않을 정도로 정정하시며<br>70여년 전의 일을 생생하게 기억하고 계셨습니다.<br>그분과 함께 대화를 나누다가<br>애들을 픽업하러 운전하러 가는 길에<br>하나의 그림이 떠올랐습니다.<br>문 (door) 이었습니다.<br>이 문을 보자마자 바로 한 생각이 떠올랐습니다.<br>'미래를 여는 문'<br>개인의 미래<br>교회의 미래<br>민족의 미래를 여는 문<br>문은 똑같은데,<br>그 문을 여는데 사용하는 열쇠에 따라<br>전혀 다른 곳으로 인도되어지는 문<br>(마치 A 라는 열쇠를 사용해 문을 열면 베이징이 나오고,<br>B 라는 열쇠를 사용해 문을 열면 파리고 나오고<br>C 라는 열쇠를 사용해 문을 열문 평양이 나오는)<br>바로 이어<br>네 개의 열쇠가 떠올랐습니다.<br>그 문을 여는 열쇠는<br>겸손 Humility<br>깨어짐 Brokenness<br>연약함 Vulnerability<br>순결함 Purity<br>라는 생각이 들었습니다.<br>이 열쇠를 사용할 때에<br>하나님께서 기뻐하시는 일들이<br>개인의 삶에, 교회에 그리고<br>민족과 열방에 열릴 것이라는 생각이 들었습니다.<br>하지만 우리는 자칫 엉뚱한 열쇠를 사용할 수 있습니다.<br>능력 power (겸손과 반대되는 개념으로서의 능력)<br>영향력 influence (깨어짐과 반대로서)<br>통제력 control (연약함의 반대로서)<br>인기 Popularity (하나님께서 어떻게 생각하는 가가 아니라 사람들의 생각과 의견을 중시)<br>두려움 fear (실패와 영향력 상실등의 두려움으로 상황과 상대방을 통제하려는 것)<br>이런 열쇠는 우리의 삶과 운명을<br>점점 힘든 길로 이끌어 갈 수 있을 것입니다.<br>저 개인의 삶을 돌아볼 때에<br>너무나 많은 경우 잘못된 열쇠를 사용했던 것 같습니다.<br>아니 지금도 사용하고 있는 것 같습니다.<br>저의 아들 들을 보면서,<br>아들들의 미래를 위해 기도하기 보다,<br>혹시 저들이 잘못 자라나지는 않을까 걱정하고<br>더 나아가 저들의 삶을 더욱 통제하려고 하고,<br>저들의 주변 상황을 더욱 제한하려고 합니다.<br>그래서, 사랑한다고 말하는 횟수는 줄어들고<br>때로는 나의 힘을 이용해 아이들을 통제하려 합니다.<br>‘너! 이거 안하면 이렇게 될 거야~~’<br>라고 협박하는 저를 발견합니다.<br>잘못된 열쇠를 사용하고 있는 거지요.<br>물론, 아이들을 훈육하는 것을 부정하는 것은 아닙니다.<br>하지만, 그 동기가 혹시<br>두려움과 다른 사람들의 시선은 아닌가 반성해 봅니다.<br>만약 내가 지금이라도 잘못된 열쇠를 사용해서<br>문을 연 것이 있다면 회개하고 문을 빨리 닫아야 합니다.<br>직장을 선택하고<br>혹은 직장과 교회에서<br>윗사람과 동료 혹은 아랫사람들에게<br>잘못된 열쇠를 사용하고 있다면, 빨리 되돌려야 할 것입니다.<br>(우리가 잘못된 열쇠를 사용하면, 문 반대편에 있던 안좋은 영향력이 우리 삶 가운데에 오는 것<br>을 봅니다)<br>겸손의 열쇠를 사용하여 우리의 미래의 문을 열면,<br>참된 자유와 구원이 있을 것입니다.<br>만약 우리에게 있는 깨어짐의 열쇠를 사용하여 문을 열면,<br>우리 주변에 깨어져 넘어져 있는 많은 사람들이<br>용기를 얻고 자신의 상처를 극복하는 것을 보게될 것입니다.<br>또 만약 우리에게 있는 연약함의 열쇠를 사용하여 문을 열면,<br>우리가 드러낸 그 연약함이<br>다른 사람의 연약함을 치유하는 것을 보게될 것입니다.<br>그리고 만약 우리가 순결함의 열쇠 (동기의 순수함, 숨겨진 동기가 없는 것)를 사용하면, 우리를<br>통해 주님이 들어날 것입니다.<br>저는 오랫동안, 더욱 열심히 하고, 더욱 성실하게 살면<br>참된 자유와 구원을 얻을 줄 알았습니다.<br>그리고, 더욱 더 열심히 하면 주변 사람들에게 힘을 주고,<br>또 나아가 더더욱 열심히 살면 진정한 사랑을 얻을 줄 알았습니다.<br>그런데, 그게 아니라는 것을 최근에야 깨닫습니다.<br>진정한 사랑이신 하나님이 우리를 구원하시기 위하여<br>자신의 완전함, 완벽함<br>그리고 전지전능함을 사용하지 않으셨습니다.<br>그분은 우리를 구원하시기 위해<br>기꺼이 겸손해 지셨고 (Humility)<br>찢어지고 깨어지셨습니다 (Brokenness).<br>그리고 더 나아가 한 없이 연약해지셔서 (Vulnerability)<br>자신이 만드신 인간의 손에 스스로 죽으심을 당하시기로<br>결정하셨고 그리고 실천하셨습니다 (Obedience).<br>전지전능하신 하나님께서 우리를 원래 만드신<br>목적대로 회복하시기 위해 사용하신 열쇠는<br>완전함도 아니고<br>노력과 열심도 아니었고,<br>사람들의 인정은 더더욱 아니었습니다.<br>바로 겸손과 깨어짐, 그리고 연약함과 순결이셨습니다.<br>감히 그분을 본받기를 소원합니다.<br>이제 더 이상 완벽을 추구하지 않겠습니다.<br>그럴수록 더욱 좌절에 빠지겠지요.<br>이제 더 이상 노력으로 무언가를 이루려 하지 않겠습니다.<br>그럴수록 더욱 실패에 자괴감에 빠지겠지요.<br>하지만 이제 저의 연약함 가운데 그분의 은혜를 구하겠습니다.<br>더욱 더 겸손하려고 노력하는 것이 아니라<br>수많은 부족함으로 겸손할 수 밖에 없는<br>포장되지 않은 나의 모습을 그냥 바라보겠습니다.<br>이런 결심마저도 또 실패하겠지요,<br>그땐 또 주님의 은혜를 구하겠습니다.<br>왜냐하면 저는 그분의 은혜 없이는<br>단 하루도 살아갈 수 없는 사람이니까요.<br>최근 들어 하나님께서 주신 또 하나의<br>키워드는 치유 받은 상처입니다.<br>우리의 과거의 실패, 좌절, 연약함을<br>하나님께서 사용하신다는 것입니다.<br>하지만, 이런 실패 좌절, 그리고 연약함이 사용되어 지려면<br>반드시 먼저 치유가 되어져야 합니다.<br>Healed wound! 다른 말로 Scar 라고 하지요.<br>우리의 치유 받은 상처가<br>다른 사람들을 치유하는 약이 될 것입니다.<br>우리의 더 큰 성공이 주위 사람들을 치유하는 것이 아니라,<br>우리의 실패와 좌절에서 일어나 우리의 연약함을 공유할 때에<br>그것이 서로를 치유하며 미래를 열어갈 것입니다.<br>최근 제 주위의 사람들 중에<br>자신이 좌절했던 그리고 실패한 그곳으로<br>다시 하나님께서 이끌어 가시는 것을 보았습니다.<br>다시는 가기 싫었던 그 자리!<br>하나님께서 사람들을 다시 그 자리로 가서<br>치유를 받게 하십니다.<br>그리고 치유 받은 사람들은<br>겸손한 마음으로 다시 하나님 앞에 섭니다.<br>오래전 하나님의 뜻이라는 이름으로<br>더 큰 능력, 영향력, 통제, 인기를 누리려 했지만<br>다른 사람과 스스로에게 상처를 받고<br>좌절해 넘어졌던 그 곳<br>처음에는 순수한 마음으로 시작했지만,<br>두려움과 상처와 좌절로 채워졌던 그 곳<br>하나님께서 우리에게 치유를 명령하십니다.<br>하나님께서 우리에게 희망을 말씀하십니다.<br>하나님께서 우리에게 사랑을 말씀하십니다.<br>하나님께서 우리에게 ‘다시 할 수 있다’ 고 말씀하십니다.<br>하나님께서 우리에게 ‘힘을 내라고’ 말씀하십니다.<br>그리고 하나님께서 우리에게<br>‘너의 마음을 내가 안다!.<br>나와 함께 참 안식을 누리자’ 라고 말씀하십니다.<br>하나님께서 우리에게 ‘잘했다 나의 충성된 종아!’<br>라고 말씀하십니다.<br>오래전 하나님께서 어떤 영국 목사님을 통해서<br>캐나다에게 하신 말씀을 기억합니다.<br>하나님의 천사가 칼을 들고 서 있다.<br>그리고, 그 뒤에 주님께서 사랑스러운 눈으로<br>모인자들을 바라보고 계신다.<br>그 모습을 바라보며<br>많은 이들이 엎드려 머리를 땅에 파묻고<br>차마 주님의 얼굴을 보지 못하고 엎드려 있다.<br>하지만, 일부 교만한 이들은<br>고개를 바짝 들고 앞을 그리고<br>고개 숙이고 엎드린 자들을 바라보고 있다.<br>어쩌면 자신의 높은 위치를 즐기고 있는 지도 모른다.<br>그 순간 천사의 칼이 그들 위로 휘둘러 졌다.<br>고개를 들고 있던 모든 이들은<br>목이 잘렸다 (권위의 상실)<br>그리고 그 칼은 휘둘러지며 겸손의 기름부으심의<br>기름을 줄줄 흘렸다.<br>결국 엎드려진 교회 위에는 마지막 때의 기름부으심이<br>부어졌으며 고개를 들고 있던 이들은 목이 잘려 나갔다.<br>아~~.<br>하나님 앞에 엎드리고 싶습니다.<br>그분의 새로운 기름부으심을 받기위해서가 아니라,<br>그냥 그분 앞에 엎드리고 싶습니다.<br>그리고, 한 없이 저의 연약함을 고백하고 싶습니다.<br>저의 모든 실패와 좌절,<br>수치와 부끄러운 기억들을 고백하고 싶습니다.<br>그분의 용서와 은혜를 구하고 싶습니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0Qqp9ye1XJyS2nueVh5a2xQS1zJHiMAdXiUxaitvbAAhz6GN1NvA9SrW3HhBV6n3Yl?__cft__[0]=AZXpog8M8bwlwlxy_k__qpCNJRjiiWmUSbYLjmn6nXdO7YGgKIlgJKWtSzWEzWoWBnlcTphYz4xgB2aBiq7gQffUhlMVIgJdjrC2MZpPDAS-GRsUOnv0AKphZ0d_XIdSsZguy3oP05My8zU05slnAVtt&__tn__=%2CO%2CP-R"}, {"id": 107, "date": "2016년 3월 30일", "year": 2016, "title": "모세는 120년을 살았다 .", "themes": [8, 10, 5], "content_html": "<p>모세는 120년을 살았다.<br>참 신기하게 모세의 120년은 세 번의 40년으로 나뉜다.<br>처음 40년은 이집트의 왕자로서<br>두 번째 40년은 미디안 광야에서 나그네로<br>세 번째 40년은 이스라엘의 지도자로<br>처음 40년 동안 그는 자신이 무언가 되는 사람으로 생각하며<br>그 다음 40년 동안 그는 자신이 아무것도 아닌 것을 깨달으며<br>그리고 마지막 40년은 아무것도 아닌 자신이 하나님의 손에 붙잡힐 때에 무언가 될 수 있다는<br>것을 체험하면서...<br>처음 40년은 젊은 혈기로 자신의 힘으로<br>노예된 자신의 백성을 살리려고 했다.<br>그리고, 그 혈기의 마지막은 살인으로<br>더 나아가 광야의 방랑자로 인도했다.<br>두 번 째 40년 동안 광야에서 목동으로 살아간다.<br>어쩌면 가만히 있었다면 이집트 왕궁의 주류로 살수 있었는 지도<br>이집트의 왕자로 남아 떵떵거리고 살수 있었는 지도<br>그런데, 그의 눈에 노예로 살고 있는 자신의 민족이 보였다.<br>힘들게 고생하는 자신의 가족들이 보였다.<br>그는 자신의 능력과 경험을 이용해 이들을 구원해보려 하였다.<br>그에게는 어쩌면 충분히 그런 능력과 재능이 있었을 것이다.<br>그는 자신의 민족을 위해 뭔가 해 보기로 했다.<br>그는 그렇게 높은 위치에 있는 자신이<br>한 번 힘 써보면 이스라엘 백성들이 따라줄 줄 알았나보다.<br>그런데, 그의 노력은 결국 이집트 사람을 죽이는 것으로<br>그리고, 자신의 백성은 그를 조롱하고 비웃는 것으로 막을 내린다.<br>모세는 자신의 목숨을 구하기 위해 자신의 삶의 터전을 떠난다.<br>그가 도착한 곳은 미디안 광야...<br>이방인의 땅에서<br>그 자신이 또 이방인이되었다.<br>그래서 그는 자기의 첫 아들의 이름을 게르솜이라고 지었다.<br>그 이름의 뜻은, “내가 이방인의 땅에서 나그네가 되었다“ 이다.<br>이 이름 안에는 하나님을 향한 원망이 느껴진다.<br>하나님의 향한 분노가 느껴진다.<br>자신을 향한 연민이 느껴진다.<br>세상을 향한 포기와 체념이 느껴진다.<br>그렇게 40년이 흘렀다.<br>그런데, 그에게 변화가 감지되기 시작했다.<br>둘째 아들을 낳았고,<br>그의 이름을 엘리에셀이라고 지었다.<br>그 이름의 뜻은<br>“나의 아버지의 하나님이 나를 바로의 칼에서 구원하셨다.” 이다.<br>아니, 첫째 아들을 낳을 때만 해도 자신의 처지를 비관하고<br>하나님을 원망하는 듯한 냄새가 물씬 나는 고백을 했었는데<br>전혀 모세가 맞닿은 상황은 바뀌지 않았는데<br>그는 여전이 이방인의 땅에서 나그네로 살고 있는데<br>자신의 아들을 이스라엘의 법례대로 할례도 못했는데<br>어쩌면 아내 십보라에게 휘둘리고<br>가장으로 인정받지도 못하는 삶을 살았는데<br>그의 광야의 생활속에 하나님의 섭리를 발견하기 시작한다.<br>하나님이 나를 바로의 칼에서 구원하셨다면,<br>어쩌면 나의 인생의 끝이 여기가 아니라<br>나를 다시 사용하려고 하신 것은 아닐까?<br>“하나님! 당신의 계획은 무엇입니까?”<br>라고 묻고 싶었던 것은 아닐까?<br>혹시 어쩌면, 그랬기 때문에<br>하나님의 산이라고 하는 호렙산으로 양을 치고 간 것은 아닐까?<br>그곳에서 하나님을 만나기를 기대했던 것은 아닐까?<br>그곳에서 모세는 나무가 불이 붙었는데 타지 않는 광경을 본다.<br>모세는 신기한 현상에 나무에 더 가까이 다가 간다.<br>하나님은 모세가 그 나무에 가까이 가는 것을 지켜보시더니<br>그 불가운데에 들어가셔서 모세를 부르신다.<br>“모세야 모세야”<br>마치 주님은 오랫동안 모세를 기다리셨던 것 같다.<br>어쩌면 모세가 떨기나무로 오리라 확신 못하신 것처럼<br>모세가 떨기나무로 가까이 나아가시는 것을 확인하신 후에<br>떨기나무 불 가운데에 나아가시어<br>모세의 이름을 부르시며 그를 부른다.<br>어쩌면 하나님께서 오랫동안<br>모세가 그 자리로 나오기를 기다리셨는지도<br>모세가 처음 태어나 갈대상자에 담겨져 목숨을 구하는 그때<br>옆에 계셨던 주님<br>이집트의 공주가 모세가 담긴 갈대상자를 보고 구하는 그때도<br>옆에 계셨던 주님<br>모세가 이집트의 왕자로 성장할 때에도<br>그 옆에 계셨던 주님<br>어쩌면 모세가 자신의 혈기로 이스라엘을 구원하려 하셨을 때에도<br>안타까워하며 옆에 계셨던 주님<br>모세가 광야로 도망갈때에도 옆에 계셨던 주님<br>모세를 지키시고 그를 부르시고 계셨던 주님<br>모세가 어깨에 들어간 힘을 빼고<br>그의 고개를 들어 하나님을 바라보기를 기다리셨던 주님<br>떨기나무 옆에서 모세가 그에게 나아오기를 기다리셨던 주님<br>그 주님이 모세에게 나타나셔서 그의 이름을 부르신다.<br>“모세야! 모세야!”<br>모세를 부르신 주님의 음성은 화가난 음성이 아니다.<br>모세를 책망하는 음성이 아니다.<br>용서와 화해의 음성<br>사랑과 격려의 음성<br>모세야 그동안 힘들었지?<br>광야에서 고생이 많았지?<br>인생이 의미 없이 끝나는 것은 아닌지 걱정했지?<br>많이 외로웠지?<br>모세야! 모세야!<br>너의 인생은 여기에서 끝이 아니다.<br>너를 인생은 이제 시작이다.<br>네가 어렸을 때 품었던 꿈 사실 내가 준 것이다.<br>너의 그 꿈은 나의 꿈이기도 하다.<br>그런데, 너의 자아가 너무 강해 그 꿈을 이룰 수 없었다.<br>이제 나와 함께 그 꿈을 이루자.<br>나와 함께 나아가자.<br>이 부르심에 모세가 대답한다.<br>주님, 제가 여기 있습니다.<br>가진 것은 없지만<br>젊음도 없지만<br>명예도 없지만<br>가난하고 마음 상하고 아무것도 할 수 없는<br>모세가 여기에 있습니다.<br>이집트의 왕자로 살 때와는 사뭇 다른 모습으로<br>어쩌면 바로 하나님께서 기다리셨던 모습으로<br>하나님 앞에 나아간다.<br>나의 백성을 구하라는 하나님의 말씀에<br>난 할 수 없습니다.<br>난 말주변도 없습니다.<br>난 능력도 없습니다.<br>이런 모세의 고백이 나올 것을 하나님은 알고 계셨다.<br>그리고 하나님은 미리 그의 형 아론에게 말씀하셨고<br>모든 것을 예비해 놓으셨다.<br>모세가 드디어 자신의 삶이 이유를 발견했다.<br>모세의 꿈과 하나님의 꿈이 일치했고<br>모세의 마음과 하나님의 마음이 하나가 되었다.<br>그리고, 모세는 자신의 인생의 마지막 40년을 불태운다.<br>200만명이나 되는 이스라엘 백성을 노예에서 해방시킨다.<br>어쩌면 모세가 자신의 소명을 진정 발견하기 위해서는<br>자신의 과거를 하나님의 관점에서<br>재 해석을 했어야만 했는지 모른다.<br>불평과 원망 그리고 신세 한탄이 아니라<br>자신의 과거에 담겨진 하나님의 발견을 먼저 했어야 했는지도<br>나의 과거에 어두움이 있는 이유가<br>나의 열등감의 이유가<br>부모님이 가난한 이유가<br>나의 작은 키의 이유가<br>공부를 못했던 이유가<br>못 생겼던 이유가<br>뚱뚱했던 이유가<br>어려서 학대 받았던 이유가<br>왕따를 당했던 이유가....<br>자녀가 장애를 가진 이유가<br>자녀가 먼저 세상을 떠난 이유가<br>이혼을 경험한 이유가<br>그 이유를 발견해야 한다.<br>그 이유를 발견하기 위해 처절히 몸부림을 쳐야 한다.<br>원망이 감사가 되어야 한다<br>자기 연민이 자기 사랑이 되어야 한다.<br>미움이 사랑이 되어야 한다.<br>그래야 우리의 소명을 발견할 수 있다.<br>그래야 우리의 소명을 이루어낼 수 있다.<br>그래야 우리의 소명을 살아낼 수 있다.<br>그래야 뽑혀야 하는 잡초같은 우리의 인생이<br>많은 사람을 살리는 약초 같은 인생이 될 수 있다.<br>주여.<br>나를<br>이 세대를<br>우리 청년들을<br>대한민국을 살려주옵소서</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02zUXLAUBkREv4QuJEJkuPCGXtHZdk7Aa1JsGcL3S5Hbq9f6PDUBX3EZVQcJUfQC2ul?__cft__[0]=AZUA2Rp3e1UV3JumB9TeoW5NpinGpxBjlSVBYuKjaYYsihGsDdqkjzRyg5WF3u38SdOQOQi556QLsu4xY3IuW7gzGtm8gQOe-k34TZld7j13K8QnxZrBLypEREKG6Uw1wlWeRubDDSrks3QXbRj8YaL6&__tn__=%2CO%2CP-R"}, {"id": 108, "date": "2016년 4월 10일", "year": 2016, "title": "주일 저녁입니다 .", "themes": [4, 3], "content_html": "<p>주일 저녁입니다.<br>여러 가지로 심경이 복잡합니다.<br>오늘 따라 말을 안듣는 기현이에게 소리를 질렀습니다.<br>왜 소리 지르냐고 기현이가 따집니다.<br>\"너 그래봐....\"<br>\"너 앞으로 .... 도 없을 거야!\"<br>협박하고 방으로 들어와 '난 잔다'<br>유치하게 삐져서 방으로 들어와 버립니다.<br>기현이가 '아빠 미안해!' 하며 옆에 눕습니다.<br>'난 저리가 하고 뿌리치며<br>'앞으로 또 그럴꺼야?'<br>라고 다시 한 번 협박합니다.<br>기현이가 다시는 안그런다고 합니다.<br>그리고 기현이가 저를 안아줍니다.<br>기현이가 나보다 속이 깊습니다.<br>기현이가 나가고 아내가 들어옵니다.<br>뭐가 문제야? 라며 다가옵니다.<br>아내의 무릎을 비고<br>흰 머리를 뽑아주라고 하니<br>아내가 아무말 없이 힌 머리를 뽑아줍니다.<br>뭐라 말은 안하지만, 서로의 마음이 전해집니다.<br>난 한없이 작아집니다.<br>우리 집에서 난 제일 속이 좁은 사람입니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0Mt2Upqp2z9YUigepLao8jVyLe5ijGRoiA3KjjDEBRgCs1121XqBaD4tfYQT6pLYDl?__cft__[0]=AZXkRylHbD4_i39_y6ROnepnjgG3Vfc1tPs0Zy-h4rEHrgeUdt-Pmpq8j3JFNd5BNpWtXZ0dybcGQJHWWfna50tdrs2XCbetdDbUa-jc5VARHhluluUA2gwAdC7a4HkMLbOeXQfriD16b1cSuSnBmWkZ&__tn__=%2CO%2CP-R"}, {"id": 109, "date": "2016년 4월 15일", "year": 2016, "title": "내일 있을 원희와 현선이의 주례를 준비하며", "themes": [3, 10, 8], "content_html": "<p>내일 있을 원희와 현선이의 주례를 준비하며<br>함께 있는 아내에게 물었다.<br>“사람들이 왜 결혼하지?”<br>“함께 있고 싶어 결혼하는거 아냐?<br>당신은 나랑 왜 결혼했는데?“<br>아내는 오히려 내게 되물었다.<br>“사랑하니까 결혼했지”<br>“만나면 헤어지기 싫고더 많은 시간을<br>아니 모든 것을 함께 하고 싶다는 생각에 결혼했지“<br>라고 대답하며 생각했다.<br>그렇다.<br>난 정말 모든 것을 아내와 함께 하고 싶었다.<br>뭐 다른 이유가 없었다.<br>물론, 살다보니 때론 혼자 하고 싶은 일도 생기고<br>혼자만의 시간을 찾아 떨어져 있기도 했지만,<br>자녀들을 양육하는 것을 포함해서<br>거의 모든 것을 함께 한다.<br>아내는 나의 배우자이자 베스트 프랜드<br>아들들의 엄마, 그리고 내 삶의 동반자다.<br>우리의 결혼의 목적이 무엇일까 생각해보니,<br>우리 결혼생활에 어떤 목적이 있다기 보다<br>그저 함께 같은 방향을 바라보고<br>같은 혹은 비슷한 의견을 가지고<br>무언가를 강요하기 보다는<br>믿어주고 이해해 주고 격려해주고<br>그 무엇보다 서로 사랑하는 것이 아닐까?<br>그러고 보니,<br>성경은 우리 인생의 목적을<br>하나님을 사랑하고 서로 사랑하는 것이라고 한다.<br>그렇다면<br>부부가 서로 사랑하며<br>인생을 살아내는 것,<br>자녀를 키워내는 것,<br>힘든 난관을 극복하기도하고,<br>때론 미워하고 싸우고 용서하고,<br>그러면서도 사랑이라는 이유로<br>혹은, '정' 때문이라는 이유로 사랑하는 것<br>그 자체가 인생의 목적을 이루어 가는<br>과정일 수도 있다는 생각을 해 본다.<br>부부생활을 통해서 무언가를 이루어 내야 하는 것이 아니라<br>그저 함께 부부로서 살아가는것<br>부부로서 견디어내는것<br>그 자체가 인생의 목적이 될 수도 있는 것이다.<br>그런데, 부부가 함께 살아가는 것..<br>정말 쉽지 않다.<br>누군가를 만난다는 것은 빅뱅이다.<br>수십만 시간을 전혀 다른 삶을 살아온 한 사람과<br>또 다른 전혀 다른 사람을 살아온 한 사람이충돌하는 것!<br>수많은 사람을 만나<br>마음을 주고 받으며<br>사랑을 주고 받으며<br>상처를 주고 받으며<br>말로 상처를 주기도 하고<br>말로 상처를 받고도 하고<br>표정으로 상처를 주기도 하고<br>표정으로 상처를 받기도 하고<br>때로는 잊을 수 있을 정도의 상처<br>때로는 평생 잊을 수 없는 상처<br>극복하여 성장의 디딤돌이 되게 하는 상처<br>넘어져 힘들게 만드는 걸림돌이 되게 하는 상처<br>상처를 겪으며성격을 만들고<br>인성을 만들고 세상과 반응하며 살아간다.<br>전혀 다른 인생이함께 사랑하며 살아간다는 것<br>서로 싸우되 죽이지 않고 (영적, 정서적)살아간다는 것<br>그건 기적이다.<br>누군가를 사랑한다는 것은 자신의 마음을 열어준다는 것<br>상대방으로 하여금 내 마음 깊은 곳에 들어와<br>나의 감정을 건들여도 좋다는 것<br>하지만, 그로 말미암아 썩은 냄새가 나올 때엔<br>스스로도 당황하고상대방도 당황하고<br>서로의 악취에 당황하고 서로를 멀리한다.<br>하지만,‘<br>사랑은 자신을 취약하게 내어주는 것<br>’'Love is making oneself vulnerable'이란 사실을 이해한다면,<br>악취가 나온 후에는<br>향기가 나올 수도 있다는 것을 안다면<br>서로의 악취를 참아주고<br>그 냄새가 지나가도록 기다려 준다면<br>물론 또 다른 악취가 있겠지만<br>함께 그 시간을 견뎌낸다면<br>그 두 사람의 화학 작용은<br>세상에서 가장 향기로운 향기를 낼 것이다.<br>사랑의 묘약은 악취를 향기로 바꾼다<br>사랑은 상대방을 억지로 바꾸려 하지 않는 것<br>그냥 바라봐 주고, 참아주고, 기다려 주는 것<br>그래도 변하지 않을 땐,<br>그땐, 그 사람의 허물을 있는 그대로 받아주는 것,<br>그 허물을 받아주고 보면,<br>허물은 아름다움으로 변해있는 것을 깨닫는 것,<br>주고 주고 또 주고도<br>혹시 상대방에게 부족한 것이 없는 지 돌아보는 것<br>그렇게 우주와 우주가 만나<br>서로를 자신의 우주로 바꾸려 하지 않는다면,<br>우리를 만드신 분의 우주 안으로 함께 들어간다면<br>새로운 우주가 또 하나 탄생한다.<br>바로.<br>가정이라는 우주<br>그 곳은 사람들이 찾아와 쉼을 얻는기쁨과<br>삶의 가치를 찾는아름다움과<br>견딤과 소망이 함께 교차하는새로운 곳!<br>그래서 사랑은 할 만한 가치가 있나 보다<br>그래서 행복한 결혼은 아름다운가 보다.<br>정말이지 성경은 사랑을 정의하며 이렇게 이야기 한다.<br>사랑은 오래참고<br>사랑은 온유하며<br>시기하지 아니하며<br>사랑은 자랑하지 하니하며<br>교만하지 아니하며<br>무례히 행하지 아니하며<br>자기의 유익을 구하지 아니하며<br>성내지 아니하며<br>악한 것을 생각하지 아니하며<br>불의를 기뻐하지 아니하며<br>악한 것을 생각하지 아니하며<br>불의를 기뻐하지 아니하며<br>진리와 함께 기뻐하고<br>모든 것을 참으며<br>모든 것을 믿으며<br>모든 것을 바라며<br>모든 것을 견디느니라.....<br>고린도전서 13장<br>이 말씀을 보면,<br>사랑은 오래참음으로 (Patient) 시작해서<br>견디느니라 (Persevere) 로 끝난다.<br>정말 사랑이 힘들기는 힘든가보다.<br>아니, 가정을 꾸리고 유지해 가는 것은 정말 힘든 일이다.<br>우리가 가정을 유지하는 것 자체가 기적같은 일인지도 모른다.<br>그렇기 때문에 목숨을 걸고 지켜야 하는 것이 가정인지도 모른다.<br>내일 새로운 가정을 꾸리는 원희와 현선이..<br>세상에서 가장 아름다운 가정을 꾸리길,<br>이 가정을 통해 많은 이들이 위로와 안식을 누리길,<br>그래서 이 세상이 더욱 살만한 세상이 되길...</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02drTJFcgw5CaX1hnDG7YiigmZvwudTy4r4rJdXnBcTvsH3TF8scyibznJ6xHi4Mm9l?__cft__[0]=AZWI2wP_kuvFOUf5hfYibT3yjRV5VxTl7-jq365zr0udbqEVewEWatjytDCVe8OqdHJ8l9ZviXKEiD6evpUDNrB6Ca3JrfmXTMBF0jIIwwmheU2sbieVueqAqesTGCcCNAMUW7PuX7fmuYvUnlVXjmk7&__tn__=%2CO%2CP-R"}, {"id": 110, "date": "2016년 6월 6일", "year": 2016, "title": "와우 WOW Having so much fun!!", "themes": [10], "content_html": "<p>와우 WOW Having so much fun!!</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02oQFxTLx4qY5naedwHcXt1FQSu8LCwUuVgEVYTxPvgR1gqRrZy1nARwaaL7CKmnFJl?__cft__[0]=AZVto6HYc430p3anzqyLsMgCuXy9U4XpIPJA-2k1NEKzSrWE4NpILPGW5gByqjhSboHZ-aFYVASvhIXfKLZChTT6O8BfCfqK9ND5PHg3jUMf0kVlPZ4XTnPUFZITnp77DN7-h_bHawuxSRShJf7ePNgcpWJYG7sk-ET2jA6WWYxhYw&__tn__=%2CO%2CP-R", "images": ["pdf3_page64_img2.jpeg"]}, {"id": 111, "date": "2016년 7월 12일", "year": 2016, "title": "21년전 오늘이네요", "themes": [8, 3], "content_html": "<p>21년전 오늘이네요!!! 하나님의 은혜와 주변분들의 기도 그리고 아내의 인내의 결과입니다. By<br>the grace of God, prayer of our family and friend and patience of my wife, we<br>have been married for 21 years!!!</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0nXuytNZE8SYk17zkpphiyW8UPRbZwDf1e6BwbFaH8jVxwM8oVxGugMyYm2c4gXKLl?__cft__[0]=AZWhjV1r8qxodCD57Wq7doj2IXt6aE0nV9SI-BNc39ZmtOtntUl3Vi5ADbdVVNfr_FpWRYl43YFD4Jsk8sUsvXo-zIVlYCnYIKDUYKzC6_HiCdXLvfq8PNSthQTGhlphjpsqj-_a747UHGfyZkzbD_3mcI0_METyzvrIl9_CFTIG5D9RsSunNvtc2qNIVR-_UTE&__tn__=%2CO%2CP-R", "images": ["pdf3_page65_img2.jpeg"]}, {"id": 112, "date": "2016년 8월 10일", "year": 2016, "title": "사람 살리는 스포츠", "themes": [11], "content_html": "<p>사람 살리는 스포츠<br>가정 살리는 스포츠<br>경제 살리는 스포츠<br>나라 살리는 스포츠<br>자살율 1위,<br>이혼율 1위,<br>의료비 증가율 1위등<br>부정부패 1위등<br>그런데, 우리 연구만 봐도<br>운동만 열심히 해도 우울등 정신건강 좋아지고<br>부부가 함께 운동하면 부부관계 좋아지고<br>부자 (모자,녀) 가 함께 운동하며 부모자식간의 관계가 좋아지고,<br>체육 수업만 제대로 참여해도 연간 4조 5천억의<br>의료비를 줄일 수 있고,<br>일주일에 90분만 꾸준히 걸어도 암, 당뇨, 고혈압이 예방되고<br>제대로된 스포츠를 참여하며 삶의 가치를 배우는데<br>좋아서, 재미있어서 운동 하다가<br>잘하면 시합도 나가고<br>그러다 더 잘하면 올림픽에도 나가고<br>운동 그만두면 다시 하던 일 (공부, 직장) 하고<br>혹은 지역, 학교 클럽에서 지도자로 봉사하고<br>돈이 없어 스포츠에 참여하는 사람이 단 한명도 없고<br>파벌때문에 혹은 부모의 경제력 때문에<br>더 잘하는 사람에게 기회가 주어지지 않는 경우가 없고<br>좋아서, 즐거워서 열심히 하다보니 세계 1위가 되는<br>대한민국 스포츠<br>온 국민이 즐기는 스포츠<br>온 국민이 참여하는 스포츠<br>온 국민이 응원하는 스포츠<br>온 국민을 살리는 스포츠<br>이러다 보니,<br>대한민국이 스포츠 강국을 넘어 선진국이되고<br>스포츠 산업의 주변국에서 주류국으로 발전하고<br>세계가 따르고 싶은 스포츠 시스템을 제공하는<br>대.한.민.국. 스포츠<br>후대에게 물려주고 싶다.<br>그럴 수 있을까?</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid08foodgx9i3KqK7RVpULWkbfs4z2o8nzNJ1nYrdYCdh19ffG7sUvWd9iAYq8sthvxl?__cft__[0]=AZW77k0hVngNojU4hspultcFahYLkIDaB1jlLf1CAPr9tXBRBEYJlQ9GvOXram0T8dezmMapVp5f4riCf4-vyKKz1uLW_oq6yG0WgyqxSTVn5Zhvtlp_R8Su7EPPQExHvyjnsrayiihlePr29JF6b3wG&__tn__=%2CO%2CP-R"}, {"id": 113, "date": "2016년 8월 21일", "year": 2016, "title": "캐나다 유학생활중에", "themes": [8, 5], "content_html": "<p>캐나다 유학생활중에<br>새벽기도를 시작한지 얼마 되지 않을 때이다.<br>내가 사는 곳에서 교회까지 버스를 타고 1시간<br>교회에서 바로 학교로 출근을 해야 하는 상황<br>아침 첫 버스를 확인해보니 새벽 5시20분<br>첫 버스를 타고 가도 6시에 교회에 도착할 수는 없다.<br>그래도 난 5시에 집에서 나와 버스 정류장으로 향했다.<br>그리고 정류장에 서서 막연히 지나가는 차들을 바라보며 생각했다..<br>하나님께서 내가 새벽기도를 가기를 원하신다면<br>저 승용차들의 운전자로 하여금 나를 태워주게 하실거야<br>난 지나가는 차량들을 하염없이 바라보았다.<br>아무도 나를 위해 차를 세워주지 않았다.<br>그러나, 내 손을 들어 히치하이킹을 하기에는 챙피했다.<br>저 사람들이 나를 어떻게 생각하겠어?<br>하나님께서 내가 새벽기도를 가기를 원치 않으시나?<br>그냥 다시 집에 들어가서 잘까? 별 생각이 들었다.<br>그렇게 한 10분을 서 있는 나에게<br>세미한 음성이 내 마음에 울려왔다.<br>\"용관아! 네가 진정 새벽에 나와 기도하고 싶다면,<br>왜 너의 손을 들어 지나가는 차에게 도움을 청하지 않니?\"<br>그렇다.<br>난 하나님께서 내가 히치하이킹을 하지 않아도<br>지나가는 차량이 서서 '하나님께서 세번째 골목을 지나서<br>서있는 동양인 한 명을 교회에 바려다 주래요\"<br>이런 식으로 말할 줄 알았다.<br>이게 하나님의 예비하심이고,<br>하나님께서 내게 주시는 기적인줄 알았다.<br>그러나, 하나님은 \"내가 진정 원한다면,<br>기꺼이 챙피함을 무릅쓰길 원하셨다.\"<br>최소한 나는 그렇게 생각했다.<br>난 지나가는 차에게 손을 들었다.<br>두 세대의 차량이 그냥 지나갔다.<br>챙피했다. 들고 있는 손이 민망했다.<br>그리고, 차 한대가 내 앞에 섰다.<br>나는 버스 환승소까지 가려고 했는데,<br>그 운전자는 나를 교회에 바려다 주었다.<br>고마웠다.<br>늦지 않게 도착한 그날의 새벽기도는<br>평생 잊지 못할 새벽기도였다.<br>나는 지금도 어리석게 기적을 바란다.<br>내가 00게 하는 것이 하늘의 뜻이라면,<br>00런 일이 일어날꺼야.<br>그리고, 아무일이 일어나지 않으면,<br>난 그 책임을 모두 하나님과 주변에 돌린다.<br>아무도 나에게 손을 뻗어주지 않음에 섭섭해 한다.<br>내 앞에 아무일도 일어나지 않는 다면,<br>그건 내가 아무것도 하지 않기 때문이다.<br>실패란 두려움에 사로잡혀 도전하지 않는다면<br>우리는 제자리에 머물러 도태되어질 것이다.<br>오늘 자랑스러운 연재의 올림픽 도전을 보면서,<br>그리고 최선을 다했다는 사실에,<br>포기하지 않았다는 사실에<br>너무나도 행복해 하는 연재를 보면서<br>나 스스로를 돌아보며 다시 한 번 반성하게 된다.<br>더 좋은 세상을 꿈꾸자<br>더 밝은 미래를 도전하자<br>더 힘을 내어 최선을 다하자.<br>그것이 바로 기적이고,<br>그것이 바로 응답이다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02onRoAVAKJ8PFALiE4TBk7A5YX6zzBsg9ypaGm9rfEXrvhGkyDCqBxSXFoAjJ2L3el?__cft__[0]=AZXQNaea3-jgq6dJhNGAcwTuBZwaIv777E65-EwTyffosCxENyr-lziYUDYKYvUfx7oy9CZkN3jvuKk43W4VyCKEfwcyNmrvGYYnEd-HwrCPYEnqJzwQ6IOONSc5jPfSDKuuHsyCUgDG5E29FvHV7s-S&__tn__=%2CO%2CP-R"}, {"id": 114, "date": "2016년 10월 26일", "year": 2016, "title": "1992년 4월 어느날의 일입니다 .", "themes": [8, 5, 3, 10], "content_html": "<p>1992년 4월 어느날의 일입니다.<br>저는 캐나다 에드먼튼의 한 한인교의<br>뒷자리에 앉아 있었지요.<br>그 당시 저는 22살 청년이었고<br>남들은 3년 간다는 군대를<br>3대독자라는 이유로 6개월만에 끝낸 후에<br>캐나다 에드먼튼에서 1년간 영어공부를 하던 중이었습니다.<br>교회라는 곳과는 별로 인연이 없었고<br>오히려 교회와는 거리가 먼 것들과 훨씬 친했죠<br>친한 정도가 아니라, 술.담배.노는 것 등에 거의 중독이었던 저였죠<br>캐나다에 갔더니 그곳의 교포친구들이<br>한국에서 전용관이 왔다며<br>그 당시 잘나가던 에드먼튼의 클럽에 저를 데리고 갔지요.<br>그래서 캐나다에서 배운 외운 첫 영어 문장은<br>“Would you like to dance?”<br>저와 함께 춤 추시겠어요? 였지요.<br>여하튼 캐나다에서 이렇게 열심히 놀던 제게<br>이상한 일들이 일어나기 시작했습니다.<br>자고 있는데, 꿈에서 갑자기 예수님께서 나타나시더니<br>내가 앞으로 해야 할 일들을 보여주시고<br>새 삶 (New Life)를 살기위해 내가 해야 하는 일을 알려주셨습니다.<br>정말이지 뭐 상상할 수도 없는 일이 제게 일어났지요.<br>그리고 얼마 후에 또 이상한 일이 일어났습니다.<br>누나의 손에 이끌려 나가던 교회의 뒷 자리에 앉아 있는데<br>성가대가 내 귀에 익은 노래를 부르는 것이었습니다.<br>“사랑은 언제나 오래참고, 사랑은 언제나 온유하며...”<br>오래전 연세대학교 채플시간에 윤형주 (가수이자 목사님) 씨가<br>우리 채플에 와서 부르던 노래였죠.<br>고린도전서 13장에 나오는 사랑의 내용을 곡조를 붙여 부르던 노래<br>그 노래를 들으면서<br>“그래! 내가 다른 것은 몰라도, 사랑과 연애는 좀 알지!”<br>라며 교회의 맨 뒷자리에서 자조적인 웃음을 띄우던 나에게<br>갑자기 이상한 일이 일어났지요.<br>눈에서 눈물이 흐르는 것이었습니다.<br>뭐 이런~~~<br>그런 일이 한 번도 없었기에,<br>그리고 남자는 평생 세 번 우는 것이 허락된다고 믿었기에<br>스스로 당황했지요.<br>그리고, 울음을 참으려 하는 나를 비웃듯이<br>갑자가 가슴이 뜨거워 졌지요.<br>이제는 눈물이 아니라 통곡이 쏟아져 나오는 것을<br>간신히 참으며 입을 다물고 있던 나에게 드는 생각...<br>수.치.심.<br>그때 마치 누군가가 찾아와<br>나의 마음 깊은 곳에 두었던 모든 비밀들을<br>나의 가장 친한 친구도 모르는 나만의 비밀들<br>정말이지 기억조차 떠올리고 싶지 않았던 기억들<br>‘중학교 시절 우열반 중 열반에 배정되어<br>열받아 학교에 가지 않았던 기억‘<br>‘싸우다가 턱을 맞아서 턱에 금이가서<br>병원에 입원했던 기억‘<br>'퇴원해서 다니던 학교로 돌아가는 것이<br>정말 죽기보다 싫었던 일'<br>‘고등학교시절 남몰래 화장실에서<br>누군가 피다가 버린 담배를 몰래 피던 기억‘<br>‘어려서 나보다 싸움 못하던 아이를<br>괴롭히던 기억‘<br>‘과외중 공부못한다고 매형에게 혼나고<br>혼자 죽어버리려고 했던 어린 시절의 기억‘<br>그리고 이보다 훨씬 더욱 수치스러운 기억들<br>정말 평생 누구에게도 털어놓을 수 없는 기억들<br>더 나아가 누구에게도 들키고 싶지 않았던<br>나만의 어두운 그리고 수치스러운 기억들<br>아무도 모르는 비밀스러운 나만의 마음의 공간에<br>담아두었던 나의 이야기들....<br>“비밀 보따리 Secret place\"<br>그날 누군가 그 보따리를 갑자기 열어버린 것 같은 느낌이었죠.<br>그리고 갑자기 깨닫게 된 나의 죄(罪, Sin).<br>내가 하나님앞에서 얼마나 큰 죄인인지를...<br>남들 앞에서는 쿨한 척 할 수 있고,<br>남들 앞에서는 강한 척 할 수 있지만,<br>나의 모든 것을 알고 있는 하나님 앞에서<br>마치 벌거벗겨진 나의 모습..<br>그게 그날 교회의 뒷자리에<br>정장을 하고 올백을 한 머리로<br>혼자 쿨한 척 앉아있었던 나의 내면의 모습이었죠.<br>그리고, 난 주체할 수 없이 울었지요.<br>아니 울 수 밖에 없었지요.<br>그리고, 그날 예수님께서 찾아오셨지요.<br>나의 마음의 수치심을 치유해 주기 시작하셨지요.<br>상처난 내 마음을 만져주시기 시작했지요.<br>벌써 24년 전의 일이네요.<br>나의 수치스러운 과거와의 만남은<br>나의 아직 부족하지만<br>온전한 나와의 만남의 시작이었습니다.<br>그런데, 지난 2008년부터 하나님은<br>나의 수치스러운 과거의 일들을<br>다시 끄집어내시기 시작하십니다.<br>2012년 안식년 중에는 치유받은 줄만 알았던<br>나의 과거의 상처들이<br>어떻게 아직도 나의 삶에 영향을 주는지<br>그리고, 나의 아들에게 영향을 주는지 알게하셨네요.<br>그리고, 이런 수치스러운 과거를<br>주위의 가까운 사람들에게 나누게 하시네요.<br>그리고, 급기야 나의 수치스러운 과거들을<br>나를 사랑하시는 주님께서 아직도 치유하고 계신 과거들을<br>더 많은 사람들과 나누게 하시네요.<br>이전에는 간증집회라고 하면,<br>하나님께서 어떻게 나같이 부족한 자를 만나주셨고,<br>그리고 어떻게 내안에 역사하시며,<br>또 나를 통해서 하신 놀라운 일들을 증언했는데,<br>이제는 그저 저의 연약함을<br>나의 수치스러웠던 모습들을 솔직히 고백하게 하시네요.<br>바로, 나의 비밀 보따리를 풀어 공개하라고 하시는 것 같네요.<br>이전에 앉아서 신문을 읽고<br>모자른 잠을 메꾸던 채플시간<br>오늘 또 저의 부족한 모습을<br>채플시간 우리 제자들과 나누려 합니다.<br>저의 상처와 부족함이<br>우리 학생들에게 꿈과 소망을 줄 수 있으면 좋겠네요.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02niBLQCbsxsbChm2PegGJ6y8bavANArQfFSGmeQazib94yzE3489kGAgvbYfVrmyVl?__cft__[0]=AZV1pdJvgriZDX37z9WIOV5nHAJSqb8yw_IT3-TtrZRh75b-xPbQ370DEJKJUDHgWLzhkt_MJS2SHGI1u9kfSmwyMkZXrrRSPUhs5rUWG3FnE7ha-Z_VDfwSkFKxpbDzg9GPfj-IYwDNoO3PmUOKsmyy&__tn__=%2CO%2CP-R"}, {"id": 115, "date": "2016년 11월 6일", "year": 2016, "title": "난 중학교때에 공부를 잘 못했다 .", "themes": [2, 3, 8, 4], "content_html": "<p>난 중학교때에 공부를 잘 못했다.<br>특히 친구를 괴롭히다 잘못해서<br>턱뼈가 부러져 병원에 보름간 입원하며<br>공부를 더 못하게 되었다.<br>병원에서 퇴원할때는 매일<br>내일이 없기를 기도했다.<br>학교에 돌아가기가<br>죽기보다 싫었기 때문이었다.<br>그래서, 나를 모르는 독서실에 가서는<br>공부를 잘 하는 척 했다.<br>\"용관아 너 몇등정도 하니? \"<br>누가 물으면,<br>\"한 10등정도 하는데요\" 라고 대답했다.<br>하지만, 실상은 약 40-50등 (한 반에 70명)!!!<br>\"와우 공부 잘하네\" 라며<br>독서실에 있는 친구들이 추켜 세워줬다.<br>그 독서실은 내가 다니던 학교와는<br>약 1시간 정도 떨어져 있었다.<br>완전 자존감이 바닥이 나서,<br>거의 갈기갈기 찢어져 있는 나에게<br>그 도서관은 힐링과 안식이 있는 곳이었다.<br>나보다 세살 많은 고 3 누님은<br>종종 나에게 편지를 써주며,<br>나를 아껴줬고,<br>그곳에서 공부하던 고 3 형님들도<br>나를 사랑해 줬다.<br>그리고, 그동네에서 좀 놀던 친구들은<br>나의 소중한 친구가 되었다.<br>나는 공부를 잘하는 척을 했어야 했기야,<br>정말 열심히 책상에 앉아 있었고,<br>모르는 것을 가져오는 친구들에게는 심지어<br>공부를 가르쳐 줘야했다.<br>여름 방학때는 우열반중 열반에 배정되어<br>학교에 가기를 거부하고<br>매일 하루 10시간 이상을 책상에 앉아<br>Man to Man 영문법 책을<br>(3권인지 5권인지) 를<br>거의 다 외워 버리기도 했었다.<br>그래서인지, 중 3때 고입 시험을<br>100점만점 기준으로 90점을 받게 되었고,<br>학교 석차는 30등대로 올라섰다.<br>참고로 내가 다니던 중학교는<br>전국에서 공부 제일 잘함<br>하필이면 이런 학교로 전학을... ㅠㅠㅠ.<br>그런데, 이 일이 다시 생각난 이유는<br>오늘 문득 내가 그나마<br>중 3때 조금 나아진 이유는<br>누군가 나를 믿어주었고 (공부 잘한다는)<br>나를 공부 잘하는 아이 취급을 해주었던<br>그 따뜻한 누님과 형님들<br>그리고 친구들 덕분이 아니었을까?<br>라는 생각이 들었다 (가을 타나?)<br>중 3때의 모습과,<br>지금 나의 모습을 교차시켜 보면,<br>내가 그렇게 공부를 못했기에,<br>지금 주위 공부 못하는 사람을 이해하고<br>내가 자존감이 완전 바닥이었기에<br>지금 자존감 낮은 사람들을<br>좀 더 이해할 수 있는 것이 아닐까?<br>어쩌면, 이제 내가 다른 사람에게 속아주고<br>더 믿어주고, 더 격려하고,<br>더 사랑하고, 더 품어줘야 하는게 아닐까?<br>30년전 독서실에서 만난 형님, 누님들, 친구들..<br>나에게는 너무 힘들어 이상한 짓 할까봐<br>하나님께서 나에게 보내주셨던<br>천사들이 아닌가 생각한다.<br>꼭 다시 한 번 만나보고 싶은 분들이다.<br>공부 잘한다고 속여서 미안했다고,<br>그리고, 속아줘서 고마웠다고,<br>그래서 나중에 진짜 공부 잘하게 되었다고,<br>다 형님, 누님, 그리고 친구들 덕분이라고.<br>사랑하고, 그립다고...<br>나도, 누군가에게<br>당신들같이 천사가 되도록 노력하겠다고.<br>이렇게 이야기 해주고 싶다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid023ioW9rcGX94tAC22VsTwAYb1WxRGahg6mKtodCrALnK6PD5PtatSEjz7sGaQbSBAl?__cft__[0]=AZXqJPVFzaaQxI_8DNXJD3GdYw9GoPifDraZNhljFL8Sf2f2ldqOv5W904RfRU96uJThmlt0GJFqP_EVvqU9LnM6N1Qq-jaavgnwCYhKOl9xOf1KTJbXPB0mFckbsKZHHckq0L9-Abjjjkq-F2adhV2I&__tn__=%2CO%2CP-R"}, {"id": 116, "date": "2017년 1월 22일", "year": 2017, "title": "그동안 내가 너무 교만했습니다 .", "themes": [7, 2, 8, 10], "content_html": "<p>그동안 내가 너무 교만했습니다.<br>나 자신을 너무 신뢰했습니다.<br>내가 할 수 있다고 생각했습니다.<br>내가 한 번 해 보겠다고 했습니다.<br>더 열심히 일하고,<br>더 열심히 노력하면 될 줄 알았습니다.<br>다른 사람의 잘못을 보면서<br>\"왜 저러냐?\" 라고 말하며 손가락질 했습니다.<br>우리의 문제를 바라보면,<br>최소한 나의 문제는 아니라고 하며<br>스스로 합리화 했습니다.<br>나는 괜찮은 사람인 줄 알았습니다.<br>그래서, 하나님께서 한 번은 손을 봐 주셔야 하셨나 봅니다.<br>지난 3일간 꼼짝 못하고 집에 갇혀있습니다.<br>아마 병원에 입원했을 때를 제외하고는<br>가장 오랜 시간 집 밖을 못나간 시간인 것 같습니다.<br>하나님께서 자신을 돌아보게 하십니다.<br>돌아보니 마음이 아픕니다. 마음이 쓰라립니다.<br>나의 잘못을 드러내시니, 어찌할 바를 모르겠습니다.<br>숨고 싶지만 숨을 곳이 없습니다.<br>오직 하나, 주 앞에 나가 용서를 구하는 길 밖에 없습니다.<br>그 분의 십자가 아래 엎드릴 수 밖에는...<br>저는 하나님의 도움이 없으면 아무 것도 할 수 없는 사람입니다.<br>저는 주변 사람들의 도움과 용납, 용서가 절대로 필요한 사람입니다.<br>아무 것도 혼자서는 잘 할 수 있는 사람이 아닙니다.<br>저를 도와 주세요. 저를 용서해 주세요.<br>물론, 이렇게 다짐하고, 또 잘못하겠지요<br>또 교만해 지겠지요, 또 다른 사람들에게 상처를 주겠지요<br>또, 내가 혼자 할 수 있다고 생각하겠지요.<br>그때는 또 용서를 구할께요.<br>면목이 없지만, 그 방법 밖에는 없네요.<br>그저, 최선을 다 해 보겠다고 고백하는 수 밖에는요...<br>원근법을 이용한 것 처럼 발이 부었네요. 이세용 교수가 빌려준 도구를 이용해 아직도 Icing 잘<br>하고 있습니다</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02oNQJP8kzttPAbhcMsA7vyx3UG3sPVtfgUHfTi5g9bkT5mUvZSKfeQRthPLbPjsyNl?__cft__[0]=AZUrS5wnlGZWJUeO2c60E2Rwhchckcc7TZUGmSX2Hbo5o_-nRZfBTE7EVAlFaeLOOsJ3p9F4KeF-WrLNLrT-1oSsWY0GvJnV3J1GlSfcWKPNfGGZvs_0LKno3WiEboFEjVg_yoohNBKJYjS66doZlEOgiJaFJWn1oTo9z2BfQC7e_A&__tn__=%2CO%2CP-R", "images": ["pdf4_page1_img0.jpeg"]}, {"id": 117, "date": "2017년 2월 19일", "year": 2017, "title": "그 아버지에 그 아들~~", "themes": [4, 12, 16], "content_html": "<p>Like father like son!!<br>Same haircut at the same barber shop but different look.<br>그 아버지에 그 아들~~<br>같은 곳에서 잘라도 다른 룩...<br>머릿숱은 어쩔 수 없네요~^^</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid026ejXEScguEAYweqt79VaZ6dELr3RYWHQSaWEbEzYuy3vm5twrfbUJv5nYTD7a9Uul?__cft__[0]=AZXADS1vFg0ESp9uLGbzPHAXuUg1NB4uMKPf_hm_WVxCZdOMsfhl6D4V0A8Q41eyp6yPOOK5ygXsPhJjh5gVAxVzaTg8MKOGm3N9Ro3CwhY5jEC_zKrQeF3GTaL0Oi7adCJGWG3WmRFmMlJSl-GzBfRdV_D5XqNud0COzCiw57KgRA&__tn__=%2CO%2CP-R"}, {"id": 118, "date": "2017년 3월 2일", "year": 2017, "title": "며칠 전 꿈을 꾸었습니다 .", "themes": [9, 5], "content_html": "<p>며칠 전 꿈을 꾸었습니다.<br>제가 정말 열심히 강의를 하는데,<br>모든 학생이 자는 것이었습니다.<br>조는 것이 아니라,<br>아예 대놓고 전원이 자는 것이었죠.<br>시간을 봤더니, 새벽 1시.<br>그냥 다 같이 좀 자고 수업을 하자고 하고<br>아예 30분간 자고 깨워 수업을 했습니다.<br>아마, 신학기가 얼마 남지 않은 것이 부담이 되었나 봅니다.<br>이전에는 강의에 들어갔는데,<br>강의 준비가 전혀 안된 상태로 강의실에 들어가<br>매우 곤욕을 치르는 꿈을 꾼 적도 있습니다.<br>연세대학교에 교수로 온지 벌써 13년째<br>강의는 언제나 저에게 부담이자 도전입니다.<br>강의를 하면서, 새로운 것을 배우고<br>내 머리속에 있는 생각들을 정리하지만,<br>동시에, 한 강의 한 강의는 출산의 고통을 동반합니다.<br>2017년 1학기<br>잠자는 학생이 아예 없기를 기대하면 너무 큰 욕심이지만<br>자는 학생이 몇 명 안되기를 기대하며</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid029EgMphsFZ4ZaUWorYQBSqosdvyuNfxXEymYBdSPSxbx7LBLW9qhZFKz83kPFdNgtl?__cft__[0]=AZVNJugxwtYK3D50MLL4oKRAOdyd8qh_JL68indO_-I3ayAh4kZZGDy3O_Mv0b_-ZZOlGxh0VOXPYRQx_gJB67n6Qv_QiFsr7UXfXPf6TgqEF1aZRSh_KiJzw9KmEV5zrHZK0z8Wukg0M_xX-zRSKauH&__tn__=%2CO%2CP-R"}, {"id": 119, "date": "2017년 3월 30일", "year": 2017, "title": "1993 년 8월이었죠 .", "themes": [9, 5, 8, 10], "content_html": "<p>1993 년 8월이었죠.<br>그해 여름 처음 국내와 홍콩과 마카오로 단기선교를 다녀온 저에게<br>선교기간 중에 짬을 내어 치른 토플 시험 점수<br>결과가 배달되어 왔었죠.<br>그 점수를 앞에 놓고 기도했었습니다.<br>하나님 어떻게 할까요?<br>저는 바로 그해 봄,<br>장애인 체육을 제 삶의 비전으로 결정했었고,<br>어떻게 그 길을 가야할 지를 놓고 고민하고 있었지요.<br>그때, 제게 든 생각은 '교환학생' 이었습니다.<br>그래서, 바로 그날로 국제처를 찾아갔습니다.<br>\"저 교환학생 신청하려고 하는데요\"<br>\"몇 학년인가요?\"<br>\"3학년 1학기 인데요\"<br>\"그럼, 안되네요\"<br>\"왜요?\"<br>\"4학년때는 교환학생 못가요\"<br>\"왜요?\"<br>\"4학년때 교환학생 가면 제때 졸업 못해요\"<br>이런 이야기를 듣는데, 쉽게 포기가 되지 않았습니다.<br>\"그럼, 교환학생 다녀와서 한 학기 더 다니면 되지 않나요?\"<br>라고 물었습니다.<br>그때만 해도 4년만에 대학을<br>졸업하지 않는 것이 드문일이었죠.<br>그래서, 한 학기 더 다니고 졸업하는 것을 코스모스 졸업이라고 했죠.<br>그랬더니, 그 분이 황당하다는 듯이<br>이렇게 이야기 했죠.<br>\"그래도 안돼요\"<br>\"왜요?\"<br>'교환학생 신청은 2개월전에 끝났습니다'<br>그런데 저는 직원분의 말씀에 동의가 되지 않았습니다.<br>그래서 건방지게 이렇게 이야기 했습니다.<br>\"이 결정의 최종 결정권자가 누구인가요?\"<br>그랬더니, 연세대학교를 설립한<br>언더우드 선교사님의 손자이신<br>원한광 박사님 (당시 국제처장) 이라고 하셨습니다.<br>\"제가 그분을 만나서 직접 여쭙겠습니다\"<br>\"약속을 잡아주십시오\"<br>아마 상당히 황당하셨을 겁니다.<br>\"약속을 잡아 줄 수는 없고,<br>00 요일 00시에 오실테니, 그때 와 보세요.<br>저는 그 시간에 원한광박사님 사무실 앞에서<br>한 시간 가량을 기다렸습니다.<br>그리고, 결국 그분은 오지 않았고,<br>메시지만 남긴 후에<br>이번에는 그분의 조교와 약속을 잡았습니다.<br>그리고, 그날 다시 원한광 박사님의 사무실로 갔습니다.<br>또, 한 시간 여를 기다리고<br>다시 약속을 잡은 후에 또 한번 찾아갔습니다.<br>무려 세번째 기다린 끝에 원한광 박사님을 만났습니다.<br>\"너 왜 교환학생 가려고해?\"<br>저는 준비한 레파토리를 쫙 읊었습니다.<br>\"장애인 체육 하려는데, 한국에는 가르치는 곳이 없고.. 등등\"<br>\"삶의 목적을 찾았는데... 등등.\"<br>그분은 쭉 듣더니, 조교를 불러 이렇게 이야기 했습니다.<br>\"얘 교환학생 보내줘\"<br>그 한 마디 였습니다.<br>4학년이라 안되는데,<br>교환학생 신청 기간 2개월 지났는데,<br>저의 간절함이 그분의 마음을 움직였었나 봅니다.<br>그러고도 여러 우여곡절이 있었지만,<br>교환학생을 가서 국제 장애인올림픽 위원회<br>위원장이신 Dr. Robert Steadward 교수님을 만나고<br>그리고, 교환학생중에 사랑하는 아내를 만나고<br>다시, 그 학교로 석사-박사 공부를 하러 가게 되고,<br>너무나 소중한 분들을 에드먼튼에서 만나고<br>캐나다 원주민 가족들을 만나고<br>등등<br>정말 그 때 교환학생을 가게되었기에<br>제 인생이 바뀌게 되었지요.<br>그래서, 늘 마음에 품고 있는 고마운 분<br>원한광 박사님!!!!<br>그 분은 얼마전에 우연히 다시 만나뵈었습니다.<br>그리고, 그분께 제 교환학생 스토리를 들려드렸지요.<br>그때 그분이 이렇게 이야기 했습니다.<br>\"우리가 오늘 다른 사람에게 베푸는 작은 친절이<br>그 사람에게 어떤 큰 의미가 있는지 모르는 경우가 많아요\"<br>\"전교수가 나에게 이 이야기를 하지 않았다면,<br>저도 모르고 지났겠지요\"<br>\"교수로 있으면서, 오늘 누군가에게<br>작은 친절을 베푸세요\"<br>가슴에 깊게 다가왔습니다.<br>오늘 우리가 만나서 전하는 따뜻한 말이<br>혹은 작은 친절이, 밥 한끼가, 기도가<br>그 사람의 인생에 소중한 빛이 될 수도 있다는 생각이죠.<br>원한광 박사님을 만나뵈었을 때에,<br>다시 그렇게 살아야겠다고 다짐 했는데,<br>그 사이 또 잊고 살고 있는 저를 봅니다.<br>어떻게 하겠어요.<br>또 다시 결심해야지요!!</p>", "images": ["pdf4_page7_img0.jpeg"]}, {"id": 120, "date": "2017년 4월 24일", "year": 2017, "title": "'배보다는 가슴이 더 나오게 ' 라는", "themes": [10], "content_html": "<p>'배보다는 가슴이 더 나오게' 라는<br>20대에 세운 원칙에 의해<br>최근 나온 배를 보며<br>열심히 가슴을 키웠다.<br>그 결 과<br>그냥 배나온<br>가슴 큰 아저씨가 되었다. ㅠㅠ</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0XTgpY1uLXmKRKyMz3mgpon5Vyob1CoZkJRgkkxqsHWNaSRgocUHLzeNcymSPNJaFl?__cft__[0]=AZUqexLYDD-6BGl1fOireQv-dMUtzAorQKHY7RkKeFPG97gDkEGD6yfFlC9ufrRQPmcFt3fpnxEZQ7JappifGlibcqY9d3I-_W6VuqrCm3cLjyAdpzoNGcauVKXPlS1fPkmEOR9svMetpCUuGII7wtdA&__tn__=%2CO%2CP-R"}, {"id": 121, "date": "2017년 5월 7일", "year": 2017, "title": "누구는 프레임이라고 한다.", "themes": [8, 10, 5], "content_html": "<p>누구는 프레임이라고 한다.<br>누구는 관점이라고 한다.<br>우리 인생의 변화는<br>자신의 삶을 어떻게 해석하는가에서 시작한다.<br>여기 이 이야기는 성경의 이야기 이지만,<br>성경에 국한된 내용은 아니다.<br>모세는 120년을 살았다.<br>참 신기하게 모세의 120년은 세 번의 40년으로 나뉜다.<br>처음 40년은 이집트의 왕자로서<br>두 번째 40년은 미디안 광야에서 나그네로<br>세 번째 40년은 이스라엘의 지도자로<br>처음 40년 동안 그는 자신이 무언가 되는 사람으로 생각하며<br>(He thinks he is somebody)<br>그 다음 40년 동안 그는 자신이 아무것도 아닌 것을 깨달으며<br>(He realizes that he is nobody)<br>그리고 마지막 40년은<br>아무것도 아닌 자신이 하나님의 손에 붙잡힐 때에 무언가 될 수 있다는 것을 체험하면서...<br>(He realizes that nobody can be somebody in the hand of God)<br>처음 40년은 젊은 혈기로 자신의 힘으로<br>노예 된 자신의 백성을 살리려고 했다.<br>그리고, 그 혈기의 마지막은 살인으로<br>더 나아가 광야의 방랑자로 인도했다.<br>두번 째 40년 동안 광야에서 목동으로 살아간다.<br>가만히 있었다면 이집트 왕궁의 주류로 살 수 있었는지도<br>이집트의 왕자로 남아서 떵떵거리고 살 수 있었는지도<br>그런데, 그의 눈에 노예로 살고 있는 자신의 민족이 보였다.<br>힘들게 고생하는 자신의 가족들이 보였다.<br>그는 자신의 능력과 경험을 이용해 이들을 구원해보려 하였다.<br>그에게는 어쩌면 충분히 그런 능력과 재능이 있었을 것이다.<br>그는 자신의 민족을 위해 뭔가 해 보기로 했다.<br>그는 그렇게 높은 위치에 있는 자신이<br>한 번 힘 써보면 이스라엘 백성들이 따라줄 줄 알았나보다.<br>그런데, 그의 노력은 결국 살인으로 끝나고,<br>자신이 구하려했던 그 백성의 조롱으로 막을 내린다.<br>모세는 자신의 목숨을 구하기 위해 자신의 삶의 터전을 떠난다.<br>그가 도착한 곳은 미디안 광야...<br>이방인의 땅에서<br>그 자신이 또 이방인이 되었다.<br>그래서 그는 자기의 첫 아들의 이름을 게르솜이라고 지었다.<br>그 이름의 뜻은, “내가 이방인의 땅에서 나그네가 되었다“ 이다.<br>이 이름 안에는 하나님을 향한 원망이 느껴진다.<br>하나님의 향한 분노가 느껴진다.<br>자신을 향한 연민이 느껴진다.<br>세상을 향한 포기와 체념이 느껴진다.<br>그렇게 40년이 흘렀다.<br>모두에게서 잊혀져가는 모세...<br>나이 80이 되어도 자신의 양이 아닌<br>장인의 양을 치고 있는 실패자<br>아무것도 할 수 없는 광야의 한 노인<br>그런데, 그에게 변화가 감지되기 시작했다.<br>둘째 아들을 낳았고,<br>그의 이름을 엘리에셀이라고 지었다.<br>그 이름의 뜻은<br>“나의 아버지의 하나님이 나를 바로의 칼에서 구원하셨다.” 이다.<br>첫째 아들을 낳을 때만 해도 자신의 처지를 비관하고<br>하나님을 원망하는 듯 한 냄새가 물씬 나는 고백을 했었는데<br>(내가 이방인의 땅에서 나그네가 되었다)<br>모세가 맞닿은 상황은 전혀 바뀌지 않았는데<br>그는 여전이 이방인의 땅에서 나그네로 살고 있는데<br>자신의 아들을 이스라엘의 법례대로 할례도 못했는데<br>어쩌면 아내 십보라에게 휘둘리고<br>가장으로 인정받지도 못하는 삶을 살았는데<br>자신의 과거의 사건 속에서<br>하나님의 개입하심을 발견하게 된다.<br>하나님이 나를 바로의 칼에서 구원하셨다면,<br>어쩌면 나의 인생의 끝이 여기가 아니라<br>나를 다시 사용하려고 하신 것은 아닐까?<br>“하나님! 당신의 계획은 무엇입니까?”<br>라고 묻고 싶었던 것은 아닐까?<br>혹시 어쩌면, 그랬기 때문에<br>하나님의 산이라고 하는<br>호렙산으로 양을 치고 간 것은 아닐까?<br>그곳에서 하나님을 만나기를 기대했던 것은 아닐까?<br>그곳에서 모세는 나무가 불이 붙었는데 타지 않는 광경을 본다.<br>모세는 신기한 현상에 나무에 더 가까이 다가간다.<br>하나님은 모세가 그 나무에 가까이 가는 것을 지켜보시더니<br>그 불 가운데에 들어가셔서 모세를 부르신다.<br>모세야!<br>모세야!<br>마치 주님은 오랫동안 모세를 기다리셨던 것 같다.<br>어쩌면 모세가 떨기나무로 오리라 확신 못하신 것처럼<br>모세가 떨기나무로 가까이 나아가시는 것을 확인하신 후에야<br>떨기나무 불 가운데에 나아가시어<br>모세의 이름을 부르신다<br>어쩌면 하나님께서 오랫동안<br>모세가 그 자리로 나오기를 기다리셨는지도<br>모세가 처음 태어나<br>갈대상자에 담겨져 목숨을 구하는<br>그때에도 옆에 계셨던 주님<br>이집트의 공주가 모세가 담긴 갈대상자를 보고 구하는<br>그때도 옆에 계셨던 주님<br>모세가 이집트의 왕자로 성장할 때에도<br>그 옆에 계셨던 주님<br>어쩌면 모세가 자신의 혈기로<br>이스라엘을 구원하려 하셨을 때에도<br>옆에 계셨던 주님<br>모세가 광야로 도망갈 때에도<br>옆에 계셨던 주님<br>모세가 어깨에 들어간 힘을 빼고<br>그의 고개를 들어 하나님을 바라보기를 기다리셨던 주님<br>떨기나무 옆에서 모세가 그에게 나아오기를 기다리셨던 주님<br>그 주님이 모세에게 나타나셔서 그의 이름을 부르신다.<br>모세야!<br>모세야!<br>주님의 음성은 화가 난 음성이 아니다.<br>책망하는 음성이 아니다.<br>용서와 화해의 음성<br>사랑과 격려의 음성<br>모세야 그동안 힘들었지?<br>광야에서 고생이 많았지?<br>인생이 의미 없이 끝나는 것은 아닌지 걱정했지?<br>많이 외로웠지?<br>모세야!<br>모세야!<br>너의 인생은 여기에서 끝이 아니다.<br>너의 인생은 이제 시작이다.<br>네가 어렸을 때 품었던 꿈<br>너의 민족을 구원하는 꿈<br>사실 그 꿈은 내가 준 것이다.<br>너의 그 꿈은 나의 꿈이기도 하다.<br>이제 나와 함께 그 꿈을 이루자.<br>나와 함께 나아가자.<br>이 부르심에 모세가 대답한다.<br>주님, 제가 여기 있습니다.<br>가진 것은 없지만<br>젊음도 없지만<br>명예도 없지만<br>가난하고 마음 상하고 아무것도 할 수 없는<br>모세가 여기에 있습니다.<br>이집트의 왕자로 살 때와는<br>사뭇 다른 모습으로<br>어쩌면 바로 하나님께서 기다리셨던 모습으로<br>하나님 앞에 나아간다.<br>나의 백성을 구하라는 하나님의 말씀에<br>난 할 수 없습니다.<br>난 말주변도 없습니다.<br>난 능력도 없습니다.<br>이런 모세의 고백이 나올 것을 하나님은 알고 계셨고<br>모든 것을 예비해 놓으셨다.<br>모세가 드디어 자신의 삶이 이유를 발견했다.<br>모세의 꿈과 하나님의 꿈이 일치했고<br>모세의 마음과 하나님의 마음이 하나가 되었다.<br>그리고, 모세는 자신의 인생의 마지막 40년을 불태운다.<br>200만명이나 되는 이스라엘 백성을 노예에서 해방시킨다.<br>어쩌면 모세가 자신의 소명을 진정 발견하기 위해서는<br>자신의 과거를 하나님의 관점에서<br>재 해석을 했어야만 했는지 모른다.<br>불평과 원망 그리고 신세 한탄이 아니라<br>자신의 과거에 담겨진 하나님의 발견을 먼저 했어야 했는지도<br>나의 과거에 어두움이 있는 이유가<br>나의 열등감의 이유가<br>부모님이 가난한 이유가<br>나의 작은 키의 이유가<br>공부를 못했던 이유가<br>못 생겼던 이유가<br>뚱뚱했던 이유가<br>어려서 학대 받았던 이유가<br>왕따를 당했던 이유가....<br>자녀가 장애를 가진 이유가<br>자녀가 먼저 세상을 떠난 이유가<br>이혼을 경험한 이유가<br>그 이유를 발견해야 한다.<br>그 이유를 발견하기 위해 처절히 몸부림을 쳐야 한다.<br>원망이 감사가 되어야 한다<br>자기 연민이 자기 사랑이 되어야 한다.<br>미움이 사랑이 되어야 한다.<br>그래야 우리의 소명을 발견할 수 있다.<br>그래야 우리의 소명을 이루어낼 수 있다.<br>그래야 우리의 소명을 살아낼 수 있다.<br>그래야 뽑혀야 하는 잡초같은 우리의 인생이<br>많은 사람을 살리는 약초 같은 인생이 될 수 있다.<br>그래서 게르솜이 아니라<br>엘리에셀로서 이 삶을 살아내야만 한다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0rLQhmZNCWMqoLabZm17BqFF8Y2DGNwaeL3xsyY6gbyhQJqD6wreP7GXC87RDtxa5l?__cft__[0]=AZXKA-e2nuZiYvrfBrSAA48A9RtWwLEn9h4wvEbID6DCcl4yJxhwgJO0UVL4nnAK5SgtAdjj_1aB-A390ukVdb7_lWp8MNyBxIAmnzeli6UUJzaGNOgGWuDK_jsxzyPDcg0C6QTlPc5bVCRJ86c4hxsD&__tn__=%2CO%2CP-R"}, {"id": 122, "date": "2017년 5월 29일", "year": 2017, "title": "성경을 아는 사람이", "themes": [8, 16, 4], "content_html": "<p>성경을 아는 사람이<br>'라합'이라는 이름을 들으면<br>아마 첫 번째로 떠오르는 단어는<br>바로 창녀 혹은 기생일 것이다.<br>맞는 말이다.<br>라합은 창녀다 (Inn keeper 로 보기도 함).<br>그런데 이런 창녀 라합은<br>우리가 잘 아는 히브리서 11장에 등장한다.<br>‘창녀 라합은 믿음으로 정탐꾼을<br>자기 편처럼 도와주어<br>하나님을 거역하는 자들이<br>당하는 멸망을<br>같이 당하지 않았습니다.‘<br>히브리서 11장이라면,<br>에녹, 노아, 아브라함 등<br>대단한 믿음을 가진 사람들이 등장한다.<br>라합에 대한 이야기는 두 줄로 서술이 되어 있다.<br>심지어는 다윗도 ‘삼손, 입다,<br>다윗 사무엘 등으로 나오는데’<br>라합의 믿음이 대단했나 보다.<br>히브리서 11장이 믿음 장이라면<br>야고보서 2장은<br>행위의 중요성을 이야기하는 장이다.<br>그곳에는 우리가 잘 아는<br>‘영혼없는 몸이 죽은 몸이듯이,<br>행함이 없는 믿음은 죽은 믿음이다’<br>라고 이야기 하며,<br>아브라함의 이야기와 라합의 이야기를<br>실례로 제시한다.<br>“또 이와 같이 기생 라합이 사자들을 접대하여<br>다른 길로 나가게 할 때에 행함으로<br>의롭다 하심을 받은 것이 아니냐“<br>믿음장인 히브리서 11장과<br>행함을 이야기하는 야고보서 2장에<br>모두 등장하는 인물은<br>아브라함과 라합뿐이다.<br>이쯤 되면,<br>도저히 라합의 삶을<br>자세히 살펴보지 않을 수 없다.<br>라합은 여호수아서 2장에 등장한다.<br>여호수아 1장이 하나님과 백성들이<br>여호수아의 리더십을 인정하고 격려하는 장면이다.<br>그리고, 이어서 바로 나오는 것이<br>여리고성 이야기다.<br>그리고,<br>여호수아 2장의 주인공은<br>다름이 아니라 라합이다.<br>라합의 직업은 창녀다.<br>그런데, 여호수아가 보낸 정탐꾼이<br>성매매를 위해 라합의 집에 들어간 것 같아<br>보이지는 않는다.<br>아마도,<br>라합은 여리고에서 숙박시설을 운영한 사람 같다.<br>성경을 보면, 이미 라합은 어떻게 하나님께서<br>홍해를 가르시고, 이스라엘을 구원하셨는지,<br>요단강 건너 시혼과 옥에게 행한 일을 알고 있었다.<br>아마도, 많은 사람들이 여리고 성을 지나다니면서<br>라합의 숙박시설을 이용했고,<br>라합은 그런 정보를 듣고 있었나보다.<br>라합은 여호수아가 보낸 정탐꾼 앞에서<br>하늘과 땅의 하나님이라며<br>자신의 신앙을 고백한다.<br>그리고, 하나님께서 여리고 성을<br>이미 이스라엘 백성에게<br>넘기셨다는 것을 알고 있었다.<br>이런 하나님의 계획에<br>적극적으로 참여하기로 한다.<br>이 사실이 이스라엘 사람들이 보기에는<br>좋은 일이지만,<br>여리고 사람들의 관점에서<br>라합은 어떤 사람인가?<br>바로 나라를 팔아먹은 ‘매국노’ 인 것이다.<br>만약에 하나님께서 나를, 우리를<br>라합과 같이 사용하신다면 어떻게 할 것인가?<br>참으로 어려운 일이다.<br>라합의 이야기를 읽으면서<br>또 한가지 눈에 들어오는 대화의 내용이 있다.<br>라합은 여호수아가 보낸 정탐꾼을 숨겨 주면서<br>자신의 가족을 구원해 줄 것을 부탁한다.<br>그리고, 정탐꾼들을 자신의 목숨을 걸고<br>라합의 가족을 지켜줄 것을 약속한다.<br>그런데, 약속을 하면서 그 가족이 모두<br>라합의 집에 있어야 할 것을 요구한다.<br>그 징표로 빨간 색 줄을 창밖에 매달라고 한다.<br>여리고를 쳐 들어온 이스라엘 사람들은<br>다른 모든 집에 있는 사람들을 다 쳐 죽이면서<br>빨간 줄이 달려있는 라합의 집에 있는 사람은<br>살려둘 것을 지시한다.<br>마치 구약의 유월절을 연상하게 한다.<br>죽음의 사자가 이집트의 첫 아들을 죽일 때에<br>어린양의 피가 발라져 있는 이스라엘의 백성의<br>집은 뛰어 넘었다는 유월절을...<br>또한, 온 인류가 자신의 죄악으로<br>물 심판을 받을 때에<br>노아의 방주에 들어가<br>멸망을 면했던 노아의 가족 또한<br>오버랩되어 들어온다.<br>유월절 때의 어린양의 보혈<br>대홍수때의 노아의 방주<br>이 모두 죽음으로 우리를 구원하신<br>예수님을 예표 (sign)하고 있는 것을<br>생각해 볼 때에<br>라합의 이야기가<br>우리에게 시사 하는 바는 작은 것은<br>아닌 것 같다.<br>히브리서에서 이야기 하듯이<br>라합이 정탐꾼을 받아들인 것은<br>믿음의 행동이었다.<br>그런데, 이 믿음이 자신의 목숨을 걸고<br>정탐꾼들을 여리고 군사들로부터 보호해 준 행동으로 이어지지 않았다면,<br>절대로 라합 스스로와 그 가족을<br>구원하지 못했을 것이다.<br>이러한 라합은 우리가 이미 잘 알고 있듯이<br>예수님의 족보에 등장한다.<br>‘살몬은 라합에게서 보아스를 낳고<br>보아스는 룻에게서 오벳을 낳고<br>오벳은 이새를 낳고<br>이새는 다윗 왕을 낳으니라‘<br>마태복음 1장의 예수님의 족보에는<br>네 명의 여인이 등장한다.<br>첫째는, 창녀로 가장하고<br>시아버지와 관계를 가진 다말이 나오고<br>두 번째로 나오는 여인이 창녀 라합이고<br>세 번째로 나오는 여인이 이방인인 과부 룻이고<br>네 번째로 나오는 여인은<br>다윗이 죽여 버린 우리아의 아내인 밧세바다.<br>예수님의 족보에 나오는<br>네 명의 여자들을 알고 보면,<br>이게 예수님의 족보가 맞나 할 정도로<br>숨기고 싶은 이야기 일 수 있다.<br>이중 라합을 좀 더 자세하게 살펴보면,<br>라합은 살몬과의 사이에서 보아스를 낳는다.<br>여기에 나오는 살몬이 과연<br>두 명의 정탐꾼 중에 한 명인지는<br>성경은 이야기 하고 있지 않지만,<br>이야기 정황상 두 명의 정탐꾼 중에<br>한 명일 가능성이 매우 높다.<br>어쨌든,<br>보아스는 매우 어려운 성장기를 보냈을 것 같다.<br>‘너의 엄마는 누구니?’<br>‘라합이야’<br>‘아~~. 그 유명한 이방 창녀?’<br>ㅠㅠㅠ<br>어쩌면, 보아스는<br>창녀 엄마를 둔 자신의 혈통을<br>저주했을 지도 모른다.<br>자신을 나아준 엄마를<br>부정하고 싶은 아들로서 말이다.<br>그런데, 보아스는<br>매우 훌륭하게 잘 성장해 준다.<br>우리가 알고 있는 룻기에 나오는<br>보아스의 모습을 보면 말이다.<br>어쩌면,<br>이방 과부인 룻에게 호의를 베푼<br>보아스의 선한 마음은<br>어머니인 이방 창녀인 라합을<br>진정으로 엄마로 인정하며<br>생긴 마음인지도 모른다.<br>아니면 혹시<br>그렇게 하지 못해서 생긴<br>어머니에 대한 미안한 마음<br>보아스는 이방 과부인 룻과의 사이에서<br>다윗의 할아버지인 오벳을 낳았다.<br>그리고, 다윗의 혈통에서 예수님이 태어났다.<br>라합이 이야기에서 보였던<br>유월절의 흔적<br>노아의 방주에 대한 복선은<br>어쩌면, 우연이 아닐 필연일 수도 있다.<br>여호수아를 통해서 새로운 시대를 열어 가신<br>하나님이 우리에게 주는 첫 번째 메시지는 바로<br>라합의 메시지인 것이다.<br>라합은 여리고 사람들이 보기에는 매국노였다.<br>그런데, 라합은 어쩌면 믿음의 눈으로<br>자신이 혈통에서 태어날<br>보아스를<br>다윗을<br>예수님을<br>보았는지도 모른다.<br>오늘 아내와 함께<br>조선말기와 일제 강점기를 선교사로서 살아낸<br>서서평의 이야기를 영화로 만든 것을 보았다.<br>아버지가 누구인지 모르는<br>혼외자의 자녀로서<br>어머니에게 버림받고<br>할머니의 손에서 자라다가<br>열 두 살의 나이에<br>혼자 엄마를 찾아 미국으로 간 그녀<br>신앙을 이유로 어머니에게<br>다시 쫓겨나게 되고<br>십수년이 지나<br>안식년을 맞이해 찾아간 어머니에게<br>‘거지’란 욕을 들으면<br>세 번째 버림을 받는다.<br>이런 서서평이었기에<br>수 많은 버려진 아이들을<br>입양한 어머니로서<br>수 많은 여성들을<br>교육시킨 교육자로서<br>수 많은 조선인을 살린<br>의료인의로서<br>죽기까지 자신의 삶을<br>조선인을 위해 살아낸다.<br>새로운 시대를 열어가는 우리에게 라합의 이야기는<br>하나님께서 우리에게 주시는 메시지로 들린다.<br>비록 창녀였지만,<br>믿음과 행동의 본을 보여준 여인<br>이방 창녀의 아들로 태어나<br>많은 상처를 받았지만,<br>이방 과부를 받아들일 수 있는<br>훌륭한 아버지로 성장한 보아스<br>그의 아들 이새의 아들로 태어나<br>자식 취급도 받지 못한<br>많은 상처를 승화시킨 다윗...<br>어쩌면, 창녀로 태어난 것을<br>원망할 수 밖에 없을지도 모르는 라합<br>그 창녀를 아내로 맞이한 살몬의 포용성<br>창녀를 어머니로 둔 보아스의 삶<br>창녀를 자녀로 둔 라합의 부모<br>그러나 라합 때문에 살아난 그들의 삶<br>수치가 바뀌어 구원의 근거가 되는...<br>이들의 삶이 이 시대를 살고 있는<br>우리에게 주는 메시지는 어쩌면,<br>믿음으로 승화된 상처의 아름다움<br>상처가 하늘로 가서 별이 된다는 소망<br>믿음의 눈으로 현실을 이겨낸 인내<br>연약함이 승리의 요건이 될 수도 있다는<br>불우한 환경이 성장의 밑거름이 될 수도 있다는<br>‘성공이 아닌 섬긴’ 의 자세로 살아간<br>서서평의 삶과 라합의 삶이 묘하게<br>연결되어 나에게 다가온다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0rYe7D2FreT5fzxdfZLNFWGTUVEQMLTfNnHjAvQY5hDmfHB6WcRwEstQvmxayagRhl?__cft__[0]=AZX4YprA-nbIs28nezmOpy5lFeWn_kAOtMvsGvqJ_WROVXox2fK3Rhzym7NhX3E-pl6274bpPFsfcYQurpe8W14juBcAO-5KCSkNpmbQOwkpJcYZQCgLKRL5stOfgQltRtBMNoVHEfyiQtLGmazXivAx&__tn__=%2CO%2CP-R"}, {"id": 123, "date": "2017년 6월 7일", "year": 2017, "title": "평소에 제가 아끼고 좋아하는 교수님들과 제 모교인 알버타 대학을...", "themes": [9, 5, 6, 13], "content_html": "<p>평소에 제가 아끼고 좋아하는 교수님들과 제 모교인 알버타 대학을 함께 방문하여 학술 토론과<br>함께 공동학위제 논의를 마무리 했습니다. 이번에는 저 혼자가 아닌 다른 교수님들과 함께 와서<br>더욱 좋네요. 우리를 이틀에 걸쳐 Host 해 주신 알버타 대학 관계자 분들에게 진심으로 감사를<br>드립니다.<br>2017년 2학기에 공식적으로 연세대학교 박사과정 학생 한 명이 공동학위제를 시작하기로 결정되<br>었습니다.<br>We thank U of A, especially Assistant Dean, Christine Ma, Associate Dean, Normand<br>Boule, Elaane Yip, Kerry Courneya, Gordon Walker and many others for hosting us<br>and giving us tour over two days.<br>It was wonderful to see my colleagues from U of A and my fellow professors from<br>Yonsei, SNU and Soonchunhyang U, finally meet with each others and have very<br>constructive discussion over many issues.<br>Finally, we are now sending our first Ph.D student to UofA for dual degree program<br>starting in year 2017-2018.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02Pkgup3EXSmYondiQxj5ntSZKp3iwwWKiiswAcrvqFxYcrKFAZNNtUjBFgL2uy7Syl?__cft__[0]=AZXk6PzsUT0YnXhwp5x7GIBq4IzPsVKWEL_gPzZDv8ida2mEIqkrFnWBLU0HRTqB9I7y6hdR02nHR-VyB4Zaai6sMhuCL_H9JV0vA3cdg-xCtb2yEYrX95XaY8XvXPvaZC7JXaorPsSOhPYMOnOIQYzthsfabnng-dfBx_CBRXFSRA&__tn__=%2CO%2CP-R", "images": ["pdf4_page21_img2.jpeg"]}, {"id": 124, "date": "2017년 6월 22일", "year": 2017, "title": "1997년 처음 BC 주에 있는 Nazko 로 부터 시작된 원주...", "themes": [8, 16, 3, 4], "content_html": "<p>Since 1997 until few years ago, I spent good amount of time with my brothers and<br>sisters in the reserves (Wabasca, Paul Band, Montana, Saddle Lake). I thought we<br>help these young people, but now I think we just grew together as men and<br>women. This year, it marks 20 years since I first went to BC. Nazko Reserve.</p>\n<p>1997년 처음 BC 주에 있는 Nazko 로 부터 시작된 원주민과의 인연은 이제 20년이 되었네요.<br>코 질질 흘리며 등에 매달리던 애들은 이제 아이가 여러명인 엄마와 아빠들이 되어 있고요.<br>저는 오랫동안 우리 한국의 청년들이 저들을 도와준 줄 생각했었는데, 이제 와 생각해 보면, 우<br>리 모두 서로가 서로에게 의미있는 존재가 되었단 생각이 드네요.<br>그리고, 그렇게 함께 자란거지요.<br>Together we help grow each other, Korean-Native Canadian.<br>Love these people!!!<br>올해도 원주민 선교에 헌신하시는 분들에게<br>주님의 사랑와 은혜가 함께 하시길 기도합니다.<br>These are pictures from Wabasca between 2003 and 2010.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02WcKgbxDwdyqP7SnGuraJheukKEPxQtqumqY9oo4TPDqZvzrWHg2oHYaHHHJEDoXPl?__cft__[0]=AZXbu-IW8eGggLb44SSMNeRPabPGLIccv0ajMXLcrUxRHr3HtMLmLt50I3TbgL_Buj3kxA9optEVpfN5J34rV9aTu_B4xutEKBCurtyfQbxo_ZS1OiL9ufLazIQIOG3NPKjsncVPgnHRxzzQ9n_JVNcQaoFrEfL0kreQGQSy1W_DKw&__tn__=%2CO%2CP-R", "images": ["pdf4_page22_img2.jpeg"]}, {"id": 125, "date": "2017년 6월 26일", "year": 2017, "title": "노.무.현.입.니.다.", "themes": [11, 2, 4, 13], "content_html": "<p>노.무.현.입.니.다.<br>영화를 보고왔다.<br>보는 내내 가슴 밑에서 부터 끓어오르는 감정이 있었다.<br>감.동.<br>부.끄.러.움.<br>미.안.함.<br>결.단.<br>노무현 대통령이 당선되던 2002년<br>나는 캐나다에서 한창 박사학위 논문을<br>마무리 하던 중이었다.<br>그리고, 많은 이들이 그랬지만,<br>인터넷을 통해서 한국 뉴스를 접했고,<br>온라인 신문 컨텐츠는 조선닷컴이 최고였다.<br>나는 조선일보의 눈으로<br>대한민국을 바라봤고<br>국내 상황을 접했다.<br>조선일보의 눈으로 본 노무현은<br>빨갱이 앞잡이<br>무능력하고, 상스러운<br>한 나라의 대통령으로<br>심히 걱정이 되는 그런 사람이었다.<br>그를 향한 탄핵안이 기각된 것을<br>아쉬워 하던 일인이었다.<br>2005년도에 국내에 들어왔다<br>한국에 들어와 다른 언론 매체를 접했지만<br>노무현이란 사람에 대한 나의 첫 인상은<br>그리 달라지지 않았다.<br>평창 동계올림픽/패럴림픽 유치를 위해<br>노무현 대통령과 함께 과테말라에서 발표를 하면서도<br>그와 함께 했다는 감동도 없었다.<br>아무래도 안보관이 너무 불확실 했다.<br>언론에서 흘려주는 정보를 여과없이 받아들였다.<br>그냥 호감이 가지 않았다.<br>검찰 조사를 받는 모습을 생중계로 보았다.<br>'노무현 자살' 이라는 기사를 보면서도<br>난 그를 원망했다.<br>가뜩이나 자살하는 사람 많은데,<br>대통령까지도 힘들다고 자살하다니....<br>그리고, 나이를 조금 더 먹고<br>언론이라는 것이 참 묘 하다는 것도 알게되고<br>때로는 언론이 국민을 가지고 놀 수 있다는 것을 알았다.<br>난. 여기서 정치적 성향을 고백하려는 것이 아니다.<br>노무현 전 대통령의 정치적 노선을 지지하려고<br>여기 글을 쓰는 것도 아니다.<br>나랑 정치는 전혀 어울리지 않는다.<br>다큐멘타리라고 하더라도 물론 영화니까<br>제작자가 어떤 의도를 가지고 만들었겠지만,<br>노.무.현.입니다.<br>영화를 보고 드는 생각은<br>이 사람을 내가 잘 몰랐구나.<br>내가 이 사람을 오해했구나.<br>진심이었구나.<br>그리고 또 생각했다.<br>더. 잘.살.아.야.겠다.<br>우리 아들들과 제자들에게<br>자랑스러운 존재는 아니더라도<br>부끄러운 존재가 되서는 안되겠다.<br>(이미 부끄러운 일은 너무 많이 저질렀지만)<br>라는 결심을 해 본다.<br>이런 정치인 관련된 글을 올린적이 한 번도 없지만,<br>내가 故 노무현 대통령을 오해한 부분이 있었기에<br>다른 이들이 나의 글의 의도를<br>오해의 소지가 있음에도 불구하고<br>그분에 대한 나의 최소한의 예의가 아닌가 싶어 올린다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid033R7L735iXoHKRoYrz6gng9naWY4JguETmcwxAFrTMBxyD6PTi1BfbA83VXtUNB4Tl?__cft__[0]=AZW1hP5QwH3qHJZ-wfQ8JcOMqlTygsbkO0YWE9dqzAP5vUDhc8FbRMiuF6DCwWAdcQ1nvF77loU7jLM7CmrjmSge137t8XRxHmswto-n4OX8dIx9P6Yda6Gpks5EgrzEU1TRJMB8oqA0T0c1AbsdU1iY&__tn__=%2CO%2CP-R"}, {"id": 126, "date": "2017년 7월 25일", "year": 2017, "title": "난 오랫동안", "themes": [8, 4], "content_html": "<p>난 오랫동안<br>내가 가정을 지켰다고 생각했다<br>그러나,<br>실은 가정이 나를 지키고 있었다.<br>For a long time,<br>I thought I kept the family together<br>However,<br>It was my family who kept me together.<br>난 오랫동안<br>내가 우정을 지켜왔다고 생각했다<br>그러나,<br>실은 우정이 나를 나 되게 하고 있었다.<br>For a long time,<br>I thought I kept my friendship with my friend<br>However,<br>It was that friendship which made me who I am<br>난 오랫동안<br>내가 믿음을 지켜왔다고 생각했다<br>그러나,<br>나를 지켜온 것은 바로 그 믿음이었다.<br>For a long time,<br>I thought I kept my faith,<br>However,<br>It was that faith, which guarded me.<br>가족, 친구, 믿음<br>그 어느것도 내가 지켜온 것은 없었다<br>Family, friend, and faith<br>None of these I protected or kept.<br>These made me who I am.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0MxwX3xmtmDApSZBtz2F7tYqoXbgGV8K4rMXnnqcyvTxX2ec24BvahKvScsRdsV9Jl?__cft__[0]=AZV8F-QigB-nNUPKmQ2_1W_i-EdlPutP-5pI6s4Su3rKevQAlSersWwF1wf5wxhhuKryEJ5z3B4W0QveBp0fRzuVuG7qucUPDrheN4GRkh80qo9neXjT6fxyawC2r-d4Ou7P4Q_en1qE0oHHzOypddTqm73nPZqBxbP0PHQc4bLqUw&__tn__=%2CO%2CP-R", "images": ["pdf4_page28_img2.jpeg"]}, {"id": 127, "date": "2017년 7월 27일", "year": 2017, "title": "충동 구매는 해 봤지만", "themes": [4], "content_html": "<p>충동 구매는 해 봤지만<br>충동 이발은 20여년 만에 처음이네요<br>기현이 머리 짤라주다<br>저도 질렀습니다.<br>같은 머리 스타일<br>다른 느낌이네요...<br>뭐 머리 숱이 없다보니 ㅠㅠㅠ<br>I Have done impulsive shopping<br>but seldom have done impulsive hair cut<br>But today I did it<br>As I watch Daniel got his hair cut<br>Same hair cut<br>Different look<br>Blame to my thinng hair</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0pLKTr85meirjmVxQuwPse1eTWVawnDALnBBicu2EUzxtFGNmrUnEMZgbRPGgmz7kl?__cft__[0]=AZWDKOduFuKjcLD7kbdAckXNgBL8Dj6-bdqYSYp-gPjh6al3ipaLp0RJSvW3QqYsJ7d2g33k0wpkomO5kajm5fOz74zXpXj7LWElFxb4MMHB70wb7jDeO1HHqj0D9D3wWy80mjkYVSxbbjXngrnIG07gyBdYB8kbFIb8t70Jt2Q2VA&__tn__=%2CO%2CP-R", "images": ["pdf4_page26_img2.jpeg"]}, {"id": 128, "date": "2017년 9월 17일", "year": 2017, "title": "우리의 인생은 만남의 연속입니다 .", "themes": [3, 10, 16, 14], "content_html": "<p>우리의 인생은 만남의 연속입니다.<br>따라서, “우리가 인생을 살면서 어떤 사람을 만나왔는가?”<br>혹은 “요즘 자주 만나는 사람은 누구인가?”<br>“요즘은 누구와 가장 많은 시간을 지내고 있는 가?”<br>라는 질문에 대한 답이 바로,<br>우리가 어떠한 삶을 살고 있는지를 알려줍니다.<br>이러한 만남 중에 특히<br>우리의 인생을 결정하는 중요한 만남이 있습니다.<br>아마도 우리네 인생에 가장 큰 영향을 주는 만남은<br>바로 부모와 자식 간의 만남일 것입니다.<br>자녀는 어떤 부모에게서 태어날 지를 결정할 수 없습니다.<br>또한, 부모 역시 자신이 낳은 자식이 남자일지 여자일지,<br>더 나아가 엄마를 닮을지 아빠를 닮을지,<br>혹은 어떠한 성격을 가지고 태어나고 자라날지 알 수 없습니다.<br>오늘 주례를 맡은 저도, 어렸을 때에는<br>부모님에 대한 원망을 많이 했습니다.<br>부모님의 좋은 점 보다는,<br>안 좋은 점이 많이 보였지요.<br>그런데, 이제 대학교 3학년과 초등학교 6학년이 된<br>아들 둘의 아버지로 살면서 보니,<br>세상에서 가장 힘든 일은 좋은 부모,<br>존경받는 부모가 되는 일입니다.<br>그러한, 면에서 보면,<br>여기에 있는 신랑 이동훈군과<br>신부 김록리 양의 부모님은 정말 훌륭하신 부모님들입니다.<br>세계에서 가장 좋은 학교에서<br>박사학위를 받은 아들과 딸을 두어서가 아니라,<br>이 세상의 누구보다 더 부모를 사랑하고<br>존경하고 있는 자녀를 둔 사실 때문입니다.<br>부모와 자식간의 만남을 제외하고<br>우리 인생에 가장 중요한 만남은 바로<br>한 배우자와의 만남입니다.<br>어떤 부모를 만날 것인가는 자신이 결정할 수 없는 일이었지만,<br>어떤 배우자를 만날 것인가는<br>자신이 결정하는 일이기 때문입니다.<br>그리고, 이 결정은 결정의 순간 이후의 삶을<br>완전히 바꾸어 놓을 것이기 때문입니다.<br>그런데, 배우자와의 만남이<br>어떤 만남이 될 것인가는,<br>이제부터가 중요합니다.<br>두 사람이 결혼하라고,<br>주변에서 강요한 사람은 한 명도 없습니다.<br>여기에 서 있는 두 사람의 결정입니다.<br>이렇게 아름다운 만남이<br>오늘 결혼으로 결실을 맺는데,<br>지금부터는 어떻게 하면<br>두 사람의 결혼이 더욱 아름다운 열매를 맺을 수 있는지,<br>그 비밀을 한 번 생각해 보겠습니다.<br>그 비밀의 답은 바로 “사랑” “온유”<br>이 두 가지 단어에 들어 있습니다.<br>우리 모두가 알고 있는<br>그러나 실천하기 어려운<br>공공연한 비밀이지요.<br>서로 사랑하십니다.<br>너무나도 당연한 이야기입니다.<br>그런데, 사랑이란 무엇인가요?<br>사랑은 주고 또 주고도<br>혹시 상대방에게 아직 부족한 것이 없는 지<br>돌아보는 마음!<br>그것이 바로 사랑입니다.<br>사랑은 상대방이 전혀 사랑스럽지 않을 때에도,<br>아니 심지어는 미운 짓만 골라 할 때에도,<br>“주고 또 주고도 혹시 상대방에게<br>아직 부족한 것이 없는 지를 돌아보는 마음”을<br>잃지 않기로 결단하는 의지와 행동입니다.<br>사랑이 마음뿐이라면,<br>우리는 어제는 사랑했는데,<br>오늘은 사랑하지 않을 수도 있는 것입니다.<br>하루는 제가 아내와 함께 비행기를 탔습니다.<br>제 어깨에 머리를 기대고 자고 있는<br>아내를 바라보면서 너무 사랑스러웠습니다.<br>그러면서, 속으로 생각했습니다.<br>만약에 이 비행기가 떨어지면서,<br>내가 죽어 아내를 살릴 수 있는 상황이 된다면,<br>내가 기꺼이 아내를 대신하여 죽을 수 있겠다...<br>얼마나 멋진 사랑의 마음입니까?<br>그런데, 곧 아내가 깨어나서 부시시한 얼굴로<br>정말 말도 안 되는 이유로 나에게 짜증을 내며<br>삐지는 것이었습니다.<br>아 정말 그 솟구치는 짜증...ㅠㅠ<br>내가 어쩌다 이런 속좁은 여자랑 결혼을 했지....<br>하며 잠시지만 후회하는 마음이 들었던 기억이 있습니다.<br>사랑이 만약에 감정만이라면,<br>우리는 하루에도 수십 번씩 사랑했다가<br>또 사랑하지 않았다가를 반복할 것입니다.<br>사랑은 감정만이 아니라<br>‘이럼에도 불구하고<br>혹은 저럼에도 불구하고<br>상대방을 사랑하겠다는 의지와 결단인 것입니다.<br>여기 있는 두 사람은 인생에 닥칠<br>어떠한 어려움에도 불구하고,<br>자신 앞에 서 있는 상대방을 사랑하기로 결단하였습니다.<br>두 번째로 결실을 맺는 결혼생활을 위한<br>공공연한 비밀은 온유라하는 것입니다.<br>온유의 한문을 보면<br>따뜻할 온 (溫) 과 부<br>부드러울 유 (柔) 자가 합쳐져 만든 단어입니다.<br>참 맞는 말입니다. 부부는 함께 살면서<br>서로가 서로에게 따뜻하게,<br>그리고 부드럽게 대해야 합니다.<br>그리고, 성경에도 온유라는 말이<br>여러 곳에서 나옵니다.<br>우리는 누가 온유하다고 하면,<br>그 사람이 조용하고 친절하고<br>화를 내지 않는 그런 사람으로 생각을 합니다.<br>그리고, 한문과 마찬가지로<br>성경에 나오는 온유라는 단어도<br>두 개가 단어가 (헬라어 프라우스+파스코)<br>합쳐져 있는 단어입니다.<br>하나는 ‘고통을 당하다’, ‘견디다’,<br>‘죽음을 견디다’ 라는 뜻이고,<br>또 하나는 ‘사랑하는 마음이 많다’,<br>‘얌전하다’, ‘친절하다’ 라는 뜻입니다.<br>그래서, 이 말의 진정한 뜻을 살펴보면 바로 이런 뜻입니다.<br>“온유는<br>고통을 당하고,<br>죽음 연상케하는<br>혹은 진정 목숨을 잃을지도 모르는 상황에서도<br>상대방을 향한 사랑을 지키다!<br>상대방을 향한 친절을 잃지 않고,<br>침착함을 유지하다!<br>앞으로 부부가 살다보면,<br>극한의 상황을 맞이하게 될 것입니다.<br>앞으로 진로간의 문제일 수도,<br>자녀 문제일 수도,<br>건강의 문제일 수도 있을 것입니다.<br>그때에도 온유함을 유지하십시오.<br>온유함으로 서로 사랑하십시오.<br>사실 사랑과 온유는 서로 동전의 앞-뒷면과 같습니다.<br>우리가 잘 알고 있는 고린도전서 13장에서<br>사랑은 오래참고,<br>사랑은 온유하며,<br>시기하지 아니하며,<br>자랑하지 아니하며,<br>교만하지 아니하며,<br>무례히 행하지 아니하며,<br>악한 것을 생각하지 아니하며,<br>불의를 기뻐하지 아니하며,<br>진리와 함께 기뻐하고,<br>모든 것을 참으며,<br>모든 것을 믿으며,<br>모든 것을 바라며,<br>모든 것을 견디느니라..<br>여기 말씀에 보면, ‘사랑은 오래 참음’으로 시작해서,<br>‘견디느니라’로 마칩니다.<br>그리고 기뻐함도 나오고,<br>온유도 있고, 참는 것도 나오고 믿고 바라는 것도 나오네요.<br>앞으로 결혼 생활을 하면서,<br>서로 많이 참으십시오.<br>그리고, 함께 많이 기뻐하십시오.<br>그 무엇보다도<br>온유함으로 서로 많이 사랑하십시오.<br>그리고, 서로의 가족을 많이 사랑하십시오.<br>장인 장모님을 시아버지 시어머니를<br>자신의 가족과 같이 사랑하십시오.<br>그리고, 하나된 가정으로서<br>주위 사람들을 사랑하십시오.<br>부부가 서로만 바라보고<br>서로만 사랑하면<br>오히려 서로를 사랑하기 어렵고<br>참기 어려울 것입니다.<br>함께 주위 사람들을 바라보고,<br>그 사람들을 온유함으로 사랑하십시오.<br>그리고, 주위에 있는 사람들을 섬기십시오.<br>그러면,<br>오늘 시작하는 부부로서의 만남이,<br>아름다운 생명력있는<br>많은 결실을 맺는 그런 만남으로 발전할 것입니다.<br>두 사람을 진심으로 축복합니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0EjMYt5Sg8NxyRwyXjwDs4cNcb38iMzEXmezyrB7C5G6jUnBYvJnAhkzDAunPXji9l?__cft__[0]=AZVh2lAKmLwflsiFx50i4u892glwGdIE-9Bs4nu-U7T0ui3Gt7gPclKR_nODKgOeC0FVgTWyBP_i47UovOiQrNnzvo79uih3osJn0-jcPT-VfYr_Ifh2YMzxKGi0XonOu4W3eCEAn3abwBzY_8gDPCMdecX8kVvWmK6fn7bkT66hpw&__tn__=%2CO%2CP-R", "images": ["pdf4_page34_img0.jpeg"]}, {"id": 129, "date": "2017년 10월 6일", "year": 2017, "title": "괜찮아 다 잘될 거야!", "themes": [3, 10], "content_html": "<p>괜찮아 다 잘될 거야!<br>뭐 어떻게든 되겠지!<br>좋은 위로의 말 같지만,<br>어쩌면 우리를 살리는 말이 아니라<br>우리를 죽이는 저주의 말일 수도 있다.<br>어쩌면,<br>임진왜란과 정유재란때에도<br>병자호란 때에도<br>경술국치 때에도<br>6.25를 앞둔 때에도<br>괜찮아. 어떻게든 되겠지 라고 말하며<br>국가를 혹은 개인과 가정을 살릴 수 있는<br>골든타임을 놓쳤던 것은 아닐까?<br>뭐 어떻게든 되겠지.<br>괜찮아 다 잘될꺼야<br>라고 말하며 스스로 위안을 삼는 것이 아니라,<br>현실을 면밀히 분석하고<br>지금이라도<br>지금 이 시점에<br>우리가 할 수 있는 최선이 무엇인지 알아내고<br>그리고 반드시 최선을 다해<br>문제 해결을 위해 노력해야 하지 않을까?<br>그냥 안타까운 마음에<br>몇 자 적어 본다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02agKtH9r1gVa3bWMqH8w1oRpTQ1EDwZuTuAHyFu6YzstPDittWMgTGfT2tqGrGTtWl?__cft__[0]=AZWJnUStfLOYbndNOdG6_wR_cGt6Q-DDK6NUt0fEbidaMnprjMze7v-sVhmfseKvQRJWv5ErPOu56sQx25Br3oY97Jc1_Kb_RRRvhgOucAwfNGUtUybqYuXA6eTWGTLjWeKCprSzv4UbwzvJY6ICneyh&__tn__=%2CO%2CP-R"}, {"id": 130, "date": "2017년 12월 23일", "year": 2017, "title": "2017학년도 2학기 성적입력을 마무리 중입니다 .", "themes": [9], "content_html": "<p>2017학년도 2학기 성적입력을 마무리 중입니다.<br>이렇게 한 학기가 지나가네요.<br>그런데, 제가 변명을 하려는 것은 아닌데, 몇 가지 사실을 말씀드리고 오해를 풀고자 합니다.<br>오늘 성적을 입력하면서, 느낀 것은 참 많은 과목의 성적을 입력해야 한다는 것입니다.<br>제가 가르치는 수업<br>학부 실기 세 과목 (하계스포츠 포함), 졸업 실기 팀티칭,<br>학부이론 1과목, 대학원 이론 1과목, 교육대학원 1과목<br>세미나 과목 1과목<br>사회 봉사과목 1과목<br>학과장 당연 수업 (실제수업은 없는) 5과목<br>총 15과목..<br>좀 미친 것 같습니다.<br>물론 세미나 수업은 안 해도 되고<br>봉사과목 개설 안해도 되는데..<br>제 강의 욕심과<br>제가 하지 않으면 과목 개설을 할 수 있는 사람이 없어서<br>그래서 어쩔 수 없이 과목을 개설 했습니다.<br>그런데, 이번 학기는 K-MOOC 강의 까지 개설 하느라,<br>여러모로 부하가 조금 더 늘어났네요.<br>특히 방학과 학기 초에 강의를 찍고, 강의안과 퀴즈 만들고 등등. (동혁이, 성현이가 고생 했지<br>요)<br>여기까지가 수업인데,<br>스포츠 응용산업학과장<br>장애학생 지원센터 소장<br>연세 피트니스 센터장...<br>이거 까지 하려니,<br>여기에 이번에 장애학생지원센터는 인권센터와 합치면서..<br>여러가지 일 (회의들) 들과 함께 교육부 평가까지 받았네요.<br>이주희 쌤이 고생했고, 우리 장애학생들은 여러가지 현안 이슈들을 해결함에 있어서, 저를 기다<br>려주고 배려해 주었습니다. 참 고맙습니다.<br>그리고, 현재 진행하고 있는 프로젝트들<br>굳이 언급은 하지 않겠지만,<br>참 많은 프로젝트들이 있습니다.<br>이러다, 보니 우리 대학원 생들은<br>많은 문제를 스스로 해결해야 했고,<br>제가 학생들에게 나름 시간을 내려고 노력했지만,<br>충분한 시간을 학생들과 보내지 못했을 수도 있었을 것 같습니다.<br>당연히 학생들에게 제공해야 하는 피드백은 늦어지고<br>여러모로 미안합니다.<br>이런 것을 여기에 다 적는 이유는<br>혹시라도, 제가 개인적으로 여러분의 이메일 혹은 전화를 답변하는데 소홀 한 부분이 있었다면,<br>전혀 개인 적인 감정과 혹시 어려분이 저의 우선순위에서 밀린 것이 아니라,<br>이런 여러가지 상황이 복합적인 상황이었기 때문이라고<br>변명 드립니다.<br>방학이 되면 조금 나아지지 않을 까 생각합니다.<br>밀린 대학원생들과의 논문 작업과<br>연구비 작성 및 지원<br>그리고 연구 기획에 조금 더 신경을 쓰고 싶습니다.<br>그런데,<br>평창이 얼마 남지 않았네요. ㅠㅠ</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0EbGqzKETGVRadv4njaHJPFFnrd2Ex4ayi9UZLDB96GDECVGkQBoTx1pVv8RH16Uql?__cft__[0]=AZV1lLgVYo6VEvE_PcTHwNkly3KUQuJl6ssoi3eJ1lgXvmPxIAixpc_0dTk-sBXdjLZ-iuXnbdCphrA-Y1QG0V9BO26JJjUFB0MykgKZkxMdsulW48W4AF4r5L7-nPsUCNRWL0y4QzjJfJ7v8lKQERb96OL14obxsVAslYrq0ce66Q&__tn__=%2CO%2CP-R"}, {"id": 131, "date": "2017년 12월 30일", "year": 2017, "title": "하나님께서 제게 주신 선물들입니다", "themes": [6, 8, 12], "content_html": "<p>하나님께서 제게 주신 선물들입니다. 가끔 아니 종종 제 속을 뒤집어 놓기는 하지만요~^^<br>My loving family, precious gift from God.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid08AYF3NgYuSY8x2XDLxRqVCd7nK7BQQWarn9Ke6R8fub776Nr6JWDYpMYoCTaGizSl?__cft__[0]=AZUQ4Htp2XpAvP-dJ2wJTU_m-Pu8tZ2yfYgXpDdxxJc7iTNfUi1I1cKF69i99FuvDQn-z-9T8M-vYK4RIdxc4UhZ7PPcUcXBO9-7dWTLqClD49qKRmjYB5NDD9G-VPHa-Tj3FkE59V6a2-lhz3SblSBrG3aiQwjp_mIh1jDDsrqdxA&__tn__=%2CO%2CP-R", "images": ["pdf4_page40_img2.jpeg"]}, {"id": 132, "date": "2017년 12월 31일", "year": 2017, "title": "이제 내일 이면 2018년", "themes": [8, 5, 1, 6], "content_html": "<p>이제 내일 이면 2018년<br>바로 개의 해이다.<br>개띠인 나로서는<br>올해가 지나고<br>다시 개의 해가 돌아오면<br>난 환갑 즉 60세가 되어 있을 것이다.<br>지난 번 개의 해는 (2006)<br>연세대학교에 교수로 온지 1년여 지났을 때 였고<br>그리고 그 전의 개의 해는 (1994) 캐나다 교환학생 때 였는데,<br>이번 개의 해는 두 번째 안식년을 앞두고 있다 (2018년 9월)<br>이렇게 나는 나이를 먹고 있다.<br>나이를 먹으면서 깨닫는 사실은<br>나란 사람 참으로 못난 사람이라는 것이다.<br>2017년도에도 이 사실을 어김없이 깨달았다.<br>결심을 하고<br>다짐을 하고<br>맹세를 하고<br>결단을 해도<br>또 다시 실패하는 나 자신을 바라보면<br>참 한심하기도 하고<br>자괴감에 빠지기도 하고<br>때론 절망에 빠지기도 한다.<br>그래도 조금 더 젊었을 때에는<br>근거없는 자신감 (근자감) 이라도 있었는데,<br>나이가 들면서, 자신감 보다는 두려움이 앞선다.<br>세상을 변화시키고 싶었지만,<br>가정도 변화시키지 못하고<br>사람들을 변화시키고 싶었지만,<br>나 자신도 변화시키지 못하고 있는<br>못난 나의 모습...<br>지식의 깊이가 깊어지고<br>지식의 넓이는 깊어가는데,<br>나의 삶이 나의 지식을 쫓아가지 못한다.<br>몰랐을 때는 몰라서 그랬다고 할 수 있을 텐데,<br>이젠 변명도 할 수 없다.<br>그래도, 이렇게 물러 설 수는 없다.<br>실패하더라도, 넘어지더라도<br>2018년 한해<br>또 다시 결심을 하고<br>또 다시 결단을 하고<br>또 다시 다짐을 하고<br>또 다시 일어나야 겠지...<br>\"은혜 아니면 살수가 없네<br>나의 모든 것 다 주께 맡기니<br>참된 평안과 위로 내게 주신주<br>예수 오직 예수 뿐이네\"<br>라는 가사가 귓가를 넘어<br>가슴에 울린다..<br>성공을 감사하기 보단<br>실패를 감사할 수 있기를<br>성취을 감사하기 보단<br>사람을 감사할 수 있기를<br>이해해 줘서 기쁘기 보다<br>이해할 수 있음에 기뻐할 수 있기를<br>사랑받아 기쁘기도 하겠지만<br>더 많이 사랑을 베풀 수 있기를<br>그래서,<br>2018년을 마무리 할 때는<br>더 많이 함께 기뻐할 수 있기를..</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02Mpy4dwnBZRVQaHBgnTBogDSg3JzmNw1Xu2jE5o7YnQBvdw1kXok1DoqzUraUntvxl?__cft__[0]=AZWSzWeTJzZLEP04YjH2UxjCAvDpXNrmXjayhfR8WnPoQxR27dqKLnq5n5cf7MdXQeJGdrCO23zN5RjI_vMEeOTg8ls9Pz5oHWkPJlR_93nKB6daYWAnT9-jft3JBsffnzuttx6RWt9Rm41lbpmoJoXR&__tn__=%2CO%2CP-R"}, {"id": 133, "date": "2018년 1월 1일", "year": 2018, "title": "통일을 염원하며 임진각에서 !!", "themes": [4, 5, 12], "content_html": "<p>통일을 염원하며 임진각에서!!<br>그런데 종소리보다 기현이 소리가 더 크네~~^^<br>Wishing peace and unification of Korea.<br>#DMZ #임진각 #꿈에도소원은통일</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02NdVRiHJB3bHvUh1cP2mkae4JUiDGmJGXck4dCE3pnhEhGCveFNRSzUfPG84obfB9l?__cft__[0]=AZU1wjG_cVBEF7QWs3Y7DA0YmwoSQ7OpRHMd-97zEC_EeiXSMKoCWxmk3QtzGcmfcdSl1tfWDjhubKpjKlK9T8N3ePmJDlPl_3nPiBBys0RKCrInDORln1OG_ZDPo0mLTt7lnzGrIe2HUNAuUXZBpXRfCRFGW5cLqryYkuxq1X1MBQ&__tn__=%2CO%2CP-R", "images": ["pdf4_page41_img2.jpeg"]}, {"id": 134, "date": "2018년 2월 9일", "year": 2018, "title": "11년 전 일이 되었네요 .", "themes": [11], "content_html": "<p>11년 전 일이 되었네요.<br>우리 다 같이 열심히 준비했었습니다.<br>물론, 2010 부터 준비하신 분들도 있었지만요.<br>우리의 발표가 끝나고<br>기자회견을 할 때 까지만 해도<br>평창이 2014 올림픽/패럴림픽의<br>개최국이 될 줄 알았습니다.<br>우리는 아깝게 또 2010년에 이어 또 낙방을 했고<br>4년을 기다려 과테말라에서야 드디어<br>올림픽과 패럴림픽을 따냈습니다.<br>2007년 IOC 총회에는 갑자기 최종 발표자로 선정되어<br>발표 전에는 얼마나 떨었는지..ㅠㅠ<br>너무 긴장해서 앞이 안 보일까봐<br>해야할 Script를 외운 것은 물론이고<br>TV 에 몰입해서 보면서도<br>나의 Script 를 외우며 연습했던 기억이 있습니다.<br>2011년 올림픽/패럴림픽을 유치하고<br>안식년을 가면서, 큰 안도를 하고 갔는데<br>IOC-IPC Agreement 부터 삐긋되더니<br>그동안 많은 어려운 일들이 있었네요.<br>ㅋㅋ 우리가 이러려고 유치했나..<br>우리는 일하면서 국민들을 위한다고 생각했는데<br>혹시 이 나라에 해를 끼치는 것은 아닌가...<br>뭐 이런 생각도 하게 되더라고요.. ㅠㅠ<br>6년여를 유치위에서 일하면서 가장 기억에<br>남는 순간 중에 하나는...<br>IOC 실사 중에 컬링장에 갔는데<br>2018명의 강원도민으로 구성된 합창단이<br>I have a dream 이란 노래와<br>아리랑을 합창 하는 것을 볼 때 였습니다<br>그리고 실사단이 평창을 떠나 서울로 오는<br>버스를 배웅하는 수십만명의 강원도 도민들...<br>그분들을 보면서<br>아 저 분들을 위해서라도 꼭 우리가 유치해야겠다<br>눈물을 흘리며 다짐을 했었지요.<br>그런데, 오늘 올림픽 개막식을 하네요.<br>여기에 추가한 영상 중 하나는<br>2014의 비디오이긴 하지만,<br>통일을 간절히 소망하는 마음으로<br>우리가 IOC 에 전했던 메시지가 있습니다.<br>다시 보는데 또 울컥하네요...<br>여러가지 부정적 언론 보도와<br>미숙한 경기 운영<br>부족한 예산<br>국민적 관심 부족에도 불구하고<br>제발 이번 평창올림픽과 패럴림픽이<br>대한민국과 한반도<br>그리고 올림픽과 패럴림픽<br>더 나아게 전 세계가 보다 좋은 세상이 되는데<br>기여하는 대회가 되길 간절히 기원해 봅니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02shNG4s96HeRjxHNMSfRRzgioRMPGwxC3HgXS9rmCn5PjVPYYXse4tGuyEaqKsKNVl?__cft__[0]=AZVFeglFDB9s-eLx4lkBc7kW1xmEJZLc9W0CN76w2hFKjipTP_pEdGlEvBeWIbYKfOmQtBTeBsSmO6-ox16PCXAR2PJXzQ4brv3L-fcmTvjjZM20tFTsTvRkeJ8MfClDeVX4KN23iKAJ7pR7mIvjXR6qIkIgNYCVqHG0bpCeLM-i5A&__tn__=%2CO%2CP-R"}, {"id": 135, "date": "2018년 2월 23일", "year": 2018, "title": "다 때려 치우고 싶다.... 라는 말의 뜻은 무얼꺼요 ~?", "themes": [10], "content_html": "<p>다 때려 치우고 싶다.... 라는 말의 뜻은 무얼꺼요~?</p>\n<p>7년 전<br>내 추억 보기<br>활동 중</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02nuyRk67YECMVL82Jbb5MSz9dLvG2RWnUgDRyeV6ttz4M1BHGNQTGGnTRz1f9kmyal?__cft__[0]=AZWh7Pik9yuXy9SqeDrYWtFZD_tGKM_ZCbAX3DDLgIoVXvGvXluBKSnB4GuxF-yp1_8457EcVTQbbAoq8e-s2LhKEBJIqM0EZrvWitt6ei1Vo5TuhXU9-NyQO8G26Oc9tqHHeQS9G__fWAzA7QJ6sQjca8i77AFM_LqOwDaArJNuQg&__tn__=%2CO%2CP-R", "images": ["pdf4_page44_img4.jpeg"]}, {"id": 136, "date": "2018년 3월 4일", "year": 2018, "title": "88년 패럴림픽을 서울에서 개최하고", "themes": [11, 9], "content_html": "<p>88년 패럴림픽을 서울에서 개최하고<br>패럴림픽 운동이 달라졌고,<br>또한 대한민국의 많은 것이 달라졌습니다.<br>사실 88년 패럴림픽이 개최될 때만 해도<br>IPC 란 단체는 없었습니다.<br>88의 성공을 발판으로 89년도에 IPC 가 생겨난 거지요.<br>대한 민국 내에서는<br>사회가 장애를 바라보는 관점이 바뀌었고요<br>장애인 스스로 자신을 바라보는 관점이 바뀌었지요.<br>자신보다 훨씬 중증 장애인이<br>패럴림픽에서 메달을 따는 것을 보면서<br>나도 할 수 있다는 관점이 더 더욱 생긴 것지이요.<br>이런 변화는<br>베이징 패럴림픽에서도<br>런던 패렬림픽에서도<br>패럴림픽이 계속 될 수록<br>더 많은 국가가, 도시가<br>그리고 국민들이 바뀌어 갑니다.<br>패럴림픽은 사람을 바꾸고<br>또 사람은 세상을 바꾸어 가는<br>아주 놀라운 선 순환을 이끌어 갑니다.<br>이 패럴림픽이 30년만에 대한민국 평창으로 돌아왔습니다.<br>이번에는 88때 없었던 포럼을 합니다.<br>어떻게 패럴림픽 운동이 사람을 바꾸고<br>사람은 어떻게 사회를 보다 나은 세상으로 바꾸는지<br>특히 IPC 가 UN 과 어떻게 협력적으로<br>Sustainable Development Goals 을 통해서<br>세상을 바꿀 수 있는지<br>UN 과 IPC 와 학계가 머리를 맛대보려고 합니다.<br>3월 7일 오후 2시에 시작합니다.<br>관심이 있는 누구든지 초대합니다.<br>참석이 가능하신 분은<br>yesuel.lee89@gmal.com 으로 자신의 정보를<br>메일로 보내주시면 됩니다.<br>연세대학교에서 가고자 하는 분들이 많으면<br>셔틀 제공도 가능합니다.<br>연세대학교에서 출발하길 원하는 사람은 여기 댓글을 남겨 주세요.<br>강릉에 가서 패럴림픽 기운도 느끼고,<br>회도 드시고 오세요.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0fovbteQ2vUeRaAnoYmZGisUykLnGJoqgycb2Hd34wdEGRWEh1XuAeACzM4zELbDxl?__cft__[0]=AZXhf4RG_T19_XBCOQ50EhI38ilEce5PXyW2iXggspc-XhIUpyE0-jBv-fh6jFJ49XHDLV71ZCNuGol7vQrYxbXxxTHqufLJbdqT0qFXk0Ax3AZWj4HtMG2MRSyDW3rkhoCG6Lr1GE1eZymUjqS2dZiftCyG46BVYfZf9osRuXV2Ww&__tn__=%2CO%2CP-R", "images": ["pdf4_page48_img0.jpeg"]}, {"id": 137, "date": "2018년 3월 19일", "year": 2018, "title": "1996년 지도교수셨던 Dr. Robert Steadward 의 학생이자", "themes": [11, 6], "content_html": "<p>1996년 지도교수셨던 Dr. Robert Steadward 의 학생이자<br>연구 프로젝트 운영자로서 처음 패럴림픽에 참여했었습니다.<br>한참 바쁘게 일하고 있는 중에<br>한국의 황연대라는 분이 나를 만나고 싶다고 해서<br>어떤 카페에서 만났던 것으로 기억합니다.<br>잘은 기억이 나지 않지만,<br>황연대 라는 상이 있다.<br>이번 폐막식에 잘 운영이 될 수 있도록 도와달라<br>뭐 이런 내용이었습니다.<br>그리고, 자리에서 일어나시며 제게 바인더를 하나 주셨습니다.<br>아무 생각없이 받아와<br>밤에 잠자리에 들기전에 바인더를 열어보았습니다.<br>신문 스크렙이었습니다.<br>저는 스크렙이 된 기사들을 보면서<br>펑펑 울었습니다.<br>1970년대 장애인들이<br>장애가 있다고 학교에서 입학을 거부당했다는 기사<br>1980년대 의대에 합격했는데,<br>장애가 있다고 입학을 거부당했다는 기사<br>사시를 패스했는데,<br>장애가 있다고 발령이 나지 않았다는 기사.<br>저는 이 기사들을 읽으면서<br>이런 일이 내가 사는 대한민국에서 일어난 일인가?<br>너무 챙피해서 울었고,<br>또 너무 분해서 울었습니다.<br>그런데, 이 때마다 머리를 띠를 띄고<br>장애인들의 앞에서 서서 정부에 항의를 하고<br>대통령에게 편지를 쓰고<br>사람들을 설득하여<br>이 모든 문제를 차근 차근 해결하신 분이 있었고<br>바로 그 분이 황연대 여사라는 것을 알고는<br>감동의 눈문을 흘렸습니다.<br>그리고 이 분의 이름을 따서 만든 황연대 극복상 (현재는 성취상)<br>이 있다는 것을 알게 되었습니다.<br>그런데, 더 읽다보니 이분이 만든 시설이<br>정립회관이라는 것을 알게 되고는 소름이 끼쳤었습니다.<br>바로 황연대 여사님이 '정립회관 아줌마' 였습니다.<br>황연대 여사님의 아드님인 성훈이와 저는 유치원 동창이었고<br>유치원때 실내 수영장이 있었던 정립회관으로 우리는 수영을 배우러 다녔기 때문입니다.<br>그때, 내가 다른 것은 몰라도<br>이렇게 헌신적인 일을 하신 분을 위해서라면<br>내가 힘 닿는 데까지 도와드려야 겠다는 생각을 했습니다.<br>그렇게 시작한 일이<br>98년 나가노, 2000년 시드니 대회를 지나<br>이제 열 두 번째 패럴림픽이 되었네요.<br>햇수로는 22년이 지났습니다.<br>수많은 사람들을 만났고<br>수많은 선수들을 인터뷰하고<br>그들의 스토리에 감동하며 눈물을 흘렸습니다.<br>황연대 여사님께서 좋은 자리에 계실 때도 있었고<br>어려운 자리에 계실 때도 있었고,<br>힘든 상황속에서 계실 때도 있었습니다.<br>그때마다 생각이 든 것은<br>힘있는 권력자가 아니라<br>힘없는 개척자 원로가 대접받는 사회를 만드는데<br>힘없는 나라도 도와야 겠다는 생각을 했었네요.<br>그렇게 하다보니,<br>우리 수상자들 가운데 구텐베르크 부시장도 나오고<br>상의 수상으로 인해 더 더욱<br>사회에 기여하기 시작하는 사람들이 나오고,<br>이번 패럴림픽에서는<br>암재발과 싸우며 항암과 수술치료를 받으며 출전하여<br>금메달을 2개나 딴 선수들이 나오는 것을 보게 되네요.<br>특히 이번에 전 수상자 6분을 모셔<br>함께 오랜 시간을 있다보니 생각지 못했던 여러가지<br>좋은 계획들이 모여졌습니다.<br>이제 치매와 싸운지 3년이 된 지금<br>또 두 명의 선수를 선발하여 황연대 성취상을 수여했습니다.<br>특히 이번 부터는 대한 장애인 체육회에서<br>적극적으로 도와 주셔서<br>금전적으로는 아무런 어려움이 없이 진행할 수 있게 되었네요.<br>황연대 여사님께서 건강을 잘 유치하셔서<br>2020년 동경, 2022년 베이징까지만이라도<br>직접 상을 수여하실 수 있으면 좋겠다는 생각을 해 봅니다.<br>이번 패럴림픽은 처음 유치부터<br>마스터 플랜 계획까지 직접 참여했기에<br>더더욱 뜻이 깊었는데,<br>이렇게 황연대 성취상 수상과<br>전 수상자 초청을 통해 황연대 여사님께<br>메달과 감사패를 전달하는 것으로 마무리 되어<br>진심으로 감사드립니다.<br>열심히 도와준 사무엘 군과<br>18년째 나를 도와 상을 운영하는 Tony Flores<br>2010년 수상자로서 이번 상의 운영을 도운 Colette Bourgonje<br>IPC, 조직위 그리고 대한 장애인 체육회 여러분들에게<br>진심으로 감사의 말씀을 전합니다.<br>감사합니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0wZ94uMVTwvrTw5xggzK4pW1P3vJGDHSYmJLAvwRNiswZU6Ypr9TeyPP3m7Rx2B83l?__cft__[0]=AZWF8MXMS3DShOrMGF1egtaFBgq0XwLW3POLNIekNCXJcMxkn1kgg_0HJJSD90U8QYCBmbJDvlssZSRJSlVALof10TcjildE7ZBQ5nExZvbj2e7AdzRbG2myMGJ3_nFyi6iqk8BSyGb0Hrx8mpw-0IZCCJnc_9xvfwLWYmejVmleUg&__tn__=%2CO%2CP-R", "images": ["pdf4_page52_img0.jpeg"]}, {"id": 138, "date": "2018년 4월 6일", "year": 2018, "title": "지난 12월부터 풀 스케줄로 달려오던 일정이 어제 Global...", "themes": [13], "content_html": "<p>지난 12월부터 풀 스케줄로 달려오던 일정이 어제 Global Breast Cancer Conference 발표로<br>일단락 되었습니다. 이번 주말 좀 쉬고 이제 학교에 좀 더 집중하겠습니다.<br>Full speed race since last December has come to an end with Global Breast Cancer<br>Conference. I am taking a break this weekend. It is time to focus more on my<br>School now.<br>운동이 약이다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02xDgyZg1kETtpq62dvfYb5QXMQ7NhBELxCgKhqDuf3qf5VfLt2aH6G8RggKR1dsh8l?__cft__[0]=AZUYR6FOOxv3KysvSDsrwLrSW1TlB1UCAMLqUvJyOGUOz26ncfZAow4FtmTBoPtps-Q5jLcVrKVE82N5PFPIDQJzNnLmuuKniKtmqyMG5-q4fMOaV6pKliEM1CCFlwy8zbCD300QdwYEKm2OzA4Ww74P7vIP2-nbr8SgJyWJMp4Iow&__tn__=%2CO%2CP-R", "images": ["pdf4_page53_img2.jpeg"]}, {"id": 139, "date": "2018년 4월 26일", "year": 2018, "title": "제가 캐나다에서 대학원 공부를 할 때에", "themes": [9, 13, 5], "content_html": "<p>제가 캐나다에서 대학원 공부를 할 때에<br>저희 대학에 심리학 전공 교수님 한 분이 오셨습니다.<br>Kerry Courneya 라고 했지요.<br>이분은 어떻게 하면 암 환자에게 운동을 시킬 수 있을까<br>연구하시던 분이였습니다.<br>저는 당뇨병쪽으로 공부를 했기에,<br>전혀 이 분과는 함께 공부할 기회가 없었지요.<br>다만, 저와 함께 연구실을 쓰던 Dr. Lee Jones 의<br>지도교수가 Kerry 였기 때문에,<br>종종 이야기만 들었지요.<br>세월이 흘러 제가 미국에서 포닥을 마치고<br>연세대학교 교수가 된지 6년여 지났을 때에<br>운동이 암에 미치는 연구를 시작했습니다.<br>그리고, 논문을 찾아 보는데,<br>운동과 암 연구의 대부분에 Kerry Courneya 라는<br>이름을 발견했습니다.<br>구글 스칼라 (Scholar) 에 논문 인용 인덱스를 보면<br>열번 이상 피인용된 논문 수가 390개,<br>h-index 가 109!!!<br>즉 109개의 논문이 109번 이상 인용되었다는..<br>보통 h-index 가 30이 넘으면<br>그 분야 국제 전문가라고 하는데,<br>100이 넘는다는...<br>어쨋든 암 연구를 하면서 이분 논문을 수없이 읽고<br>학생들과 함께 이 분 논문을 공부하고<br>그러면서, 자연스럽게 학생들을 이분과 공부할 것을<br>그리고 함께 일할 것을 꿈꿔왔지요.<br>그 결과 동우는 국가 장학금을 받고<br>Kerry 교수와 박사과정을 하고 있고,<br>기용이 역시 국가 지원을 받아<br>Kerry 교수와 포닥을 하고 있습니다.<br>그리고, 제가 꿈꿔왔던<br>언젠가는 연세대학교에 이분을 모셔 강연을 듣고 싶다는<br>그 꿈이 이번에 이루어 졌습니다.<br>이 심포지엄에 여러분을 초대합니다.<br>학부생, 대학원생, 교수님, 연구자<br>운동과 암 뿐 아니라<br>이번에 하버드에서 박사학위를 마치고<br>연구원으로 재직하고 있는 이동훈 박사도 함께 옵니다.<br>물론, 근골격분야 세계적인 전문가 분들도 오셔서<br>강연을 해 주십니다.<br>이런 대가의 강의는 꼭 들어야 합니다.<br>여러분을 초대합니다. 아래 링크를 확인하시고<br>등록하시고 오셔서 좋은 시간 가지세요!!<br>더 이상 운동이 좋다.. 운동하라가 아닌.<br>환자의 상태와 필요에 맞는 운동을<br>근거 (Evidence) 를 기반으로 어떻게 만들고<br>그리고 어떻게 적용을 하는지에 대한 내용을<br>배우시게 될 것입니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid01CF7LLHyvCbSwakiiaTgv945JLzeXqRDq9RftuhZWdPGJo45quaRft2WNZLoFohMl?__cft__[0]=AZXzuSb1pJCEtUnA9fH8Ef6FRGvAyg5ffyvbPTEZ5VjoKT5DRG2Pbmyf9a23TiWjBUlqasbb3vDkMoguotMmf-pZpnrejA65mtYE6IMSB5__XuwBLQo-0me88XDqkrwFkGbFqY8qe1y9E1PfnxJm4LMt1K9ijxE5uOLuFDn_6DF-ug&__tn__=%2CO%2CP-R", "images": ["pdf4_page56_img0.jpeg"]}, {"id": 140, "date": "2018년 4월 26일", "year": 2018, "title": "너무 감사한 일이 많아", "themes": [9, 6, 13], "content_html": "<p>너무 감사한 일이 많아<br>몇자 적습니다.<br>교수로서 가장 보람이 있을 때는<br>제자가 잘 될 때일 것입니다.<br>졸업생이 어렵게 한 취직<br>운동선수가 국가대표가 되었을때<br>대표팀으로 메달을 땄을 때<br>그리고, 또 감사한 일을<br>어쩌면 가장 감사한 일일 수도..<br>오랫동안 함께 공부한<br>학위를 마친 대학원생이<br>혹은 함께 연구하던 포닥연구원이<br>어려운 경쟁을 뚫고 교수가 되었을때가 아닐까 합니다.<br>감사하게도 올해 4명의 제자가<br>한국과 캐나다에서 교수가 되었네요.<br>2005년 처음 한국에 교수로 왔을 때에<br>여러 연구 아이디어로 나를 괴롭히던<br>경준이는 알버타에서 박사학위를 마치고<br>3년전 Canada Newfoundland 에서 교수를 하다가<br>어제 University of Manitoba 교수직을 제안 받았다고<br>기뻐 연락이 왔고요<br>역시 2005년 연대 교수로 올때<br>학과 사무실에서 업무로 찌그러져 힘들어 하던<br>은영이가 역시 알버타에서 박사학위를 잘 마치고<br>지난 달에 Queens University 대학의<br>교수가 되었다고 연락이 왔고요<br>지난 4년 여간 우리 연구실에서 연구원으로<br>대학원생들과 함께 호흡하고 생활하던<br>이정아 박사는 경희대학교 교수가 되었고요<br>우리 연구실에서 박사를 마치고<br>하버드에 포닥을 다녀온 김동일 박사는<br>가천대학교 교수가 되었습니다.<br>너무 감사하고,<br>또 축하할 일입니다.<br>이전에는 교수와 학생이었다면,<br>이제는 같은 교수로서 함께 학문의 지평을 넓혀가는<br>꿈을 꾸어 봅니다.<br>이 네 사람 모두 얼마나 그 과정이 힘들었는지<br>그래서 중간에 포기하고 싶은 위기도 있었는지<br>너무나도 잘 알기에 가슴 깊은 곳에서 부터<br>축하의 메시지를 전합니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid01CF7LLHyvCbSwakiiaTgv945JLzeXqRDq9RftuhZWdPGJo45quaRft2WNZLoFohMl?__cft__[0]=AZXzuSb1pJCEtUnA9fH8Ef6FRGvAyg5ffyvbPTEZ5VjoKT5DRG2Pbmyf9a23TiWjBUlqasbb3vDkMoguotMmf-pZpnrejA65mtYE6IMSB5__XuwBLQo-0me88XDqkrwFkGbFqY8qe1y9E1PfnxJm4LMt1K9ijxE5uOLuFDn_6DF-ug&__tn__=%2CO%2CP-R"}, {"id": 141, "date": "2018년 5월 26일", "year": 2018, "title": "알버타 대학과의 공동학위제의 연장 선상에서", "themes": [9, 10, 15], "content_html": "<p>알버타 대학과의 공동학위제의 연장 선상에서<br>존 스펜스 교수와 케리 코니아 교수님을 모시고<br>3주간 주말을 바쳐 공부를 하고 있습니다.<br>주말을 반납한 우리 학생들의 삶의 질이 걱정이 되네요~</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0nWAdm8UqGyYhZbK1Pqe3xDNBBU6RDzCKaB1X7qsxosGbzrTtBGuSRUg3ae1mkqeYl?__cft__[0]=AZUX3ES3ny5XBdoiY0F1rvxuf3iG-t-cqteMuQOe6PK38aJ9CoClk0diavhlcvlX36uAgvkbyxUfU1wFcbuqPIxKUQDkdZ6bV5D033LIwlvUkoz7o6B9TbniHxLfgW5C3P3tZbjGBLYfW_Qo29IxG6osmrktaCQ1MPvn1xRopjjZEg&__tn__=%2CO%2CP-R", "images": ["pdf4_page58_img2.jpeg", "pdf4_page59_img2.jpeg"]}, {"id": 142, "date": "2018년 7월 19일", "year": 2018, "title": "자료를 찾다가 앗. 누가 우리 아이디어를 가지고 벌써 연구했지 ~?", "themes": [13, 4, 8], "content_html": "<p>자료를 찾다가 앗. 누가 우리 아이디어를 가지고 벌써 연구했지~?<br>했더니<br>우리 연구였네요. Thanks to Dr. Giovannucci for a comment.<br>안정시 심박수가 일단 80이 넘으면 당뇨 고혈압 조심하시고요 90 넘으면 반드시 검사 받으시고<br>요<br>그런데 복무 비만과 지방간까지 있다면 적극적 치료와 운동 필요합니다.<br>만약 암 환자시라면<br>높은 안정시 심박수는 유방암 대장암 재발과 관련성이 높으니 운동 또 운동 하셔야 합니다.<br>물론 자신에게 맞는 운동 하셔야지요!!<br>물론 안정시 심박수는 스트레스와 같은 심리적 상태를 반영하기도 하지요~!<br>휴식과 운동!!</p>", "fb_link": "https://www.f
