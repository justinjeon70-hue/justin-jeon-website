acebook.com/ursospecial2/posts/pfbid02gHt4z555KCWeHCwxr1x4XytaXh3ZZjEcMyADLcSu5GcSBSejfJKdTULLJX1KZ163l?__cft__[0]=AZURa1lrnvaAfCOrV8PlRbEXjzD_QUVPxLmZdajrvD0Q8tQBy1zpTD7gO800YB6UhEMVcqwqz9BPtlug5SXBePC60jBeAbKHnds2J8oGlLThQvdbB9KpsJMWib8reyn0sMr7gENBxLLvQBk3MV0gwXTGZLGgOmH_hsPIhs6jQRD9Vw&__tn__=%2CO%2CP-R", "images": ["pdf4_page63_img4.jpeg"]}, {"id": 143, "date": "2018년 7월 28일", "year": 2018, "title": "나에게 중학생 시절은 악몽이었다 .", "themes": [8, 10, 6, 9], "content_html": "<p>나에게 중학생 시절은 악몽이었다.<br>공부, 학교생활, 친구들<br>뭐 하나 잘하는 것이 없었다.<br>그리고, 진학한 휘문 고등학교<br>물론, 고등학교에 갔다고<br>모든 것이 해결된 건 아니지만,<br>나의 ADHD 증상들은 좀 나아지고<br>특히 체육을 전공하기로 하고<br>공부의 의미와 인생의 목표를 찾은 후<br>나의 성적은 급상승해서<br>연세대학교 체육교육과에 입학하였다.<br>그런데, 나의 고등학교의 학창 시절을<br>의미있게 만든 것은 공부만이 아니라<br>친구들이다.<br>무려 31년 전이다.<br>이 친구들을 만난 것은<br>우리는 그렇게 함께 어려운 힘든 시절을 보냈다<br>선생님에게 두들겨 맞기도 하고<br>부모님, 심지어는 친구 부모들의 눈치도 보며<br>친구 엄마 차를 몰래 끌고 나가 보기도 하고<br>밤새 술을 마시고 인생을 탓하기도 하고<br>대학에 합격한 후 클럽에서 밤을 새워 보기도 하고<br>자동차 사고를 내고 경찰서에 갇혀 보기도 하고<br>술먹고 조폭들과 싸워 보기도 하고<br>수업이 끝난 후 친구 집에 모여 포카를 치기도 하고<br>크리스 마스면 함께 모여 밤새 놀기도 하고<br>서로의 결혼식에 함을 지고 가기도 하고<br>여자 친구와 헤어져 죽고싶다고 할땐<br>서로 위로하며 함께 힘들어 해 주기도 하고<br>진로로 고민할 땐 '넌 잘할 수 있을꺼야' 격려하기도 하고<br>서로가 변해가는 아니 성숙해 가는 모습을 보며<br>때로는 경쟁하고 때로는 서로의 롤 모델이 되며<br>끌어주고, 밀어주고, 곁에서 묵묵히 지켜주며<br>10대, 20대, 30대, 40대를 함께 하고<br>이제 곧 50대를 앞두고 있다.<br>안식년 간다고 번개를 하면 만난 친구 (왕코)<br>가서 음악들어 하며 블루투스 스피커를 건냈다.<br>'나 이거 있는데' 속으로 이야기 하며 선물을 받았다.<br>블루투스 스피커 안에 메모리가 들어있다.<br>노래가 1400곡이 들어있다.<br>완전 내 취향이다.<br>왕코와 나는 고등학교 시절부터 같은 음악 취향을 가졌다.<br>테이프로 녹음해서 서로 나눠주던 시절이 있었는데<br>이젠 메모리에 노래를 담아주는 시대가 되었다.<br>한 달째 차에서 집에서 노래를 듣고 있다.<br>1400곡이 한바퀴 돌았다.<br>노래를 나누는 방법은 달라졌지만<br>노래를 통해서 전해지는 친구의 사랑은 그대로다.<br>이제 50대를 함께하고 서로 늙어가는 것을 볼 것이다.<br>나이 60-70이 되서도<br>술먹고 지하철에서 토하던 이야기<br>자동차 사고를 내고 경찰서에 갇힌 이야기<br>밤을 새우며 인생의 고민을 서로 상담해 주던 이야기<br>그런 시시콜콜한 이야기를 테이프를 되감은듯 하겠지<br>그렇게 우리의 인생은 익어가겠지<br>그런 친구들이 있어서 행복하다<br>자주 만나진 못해도 1년에 한번을 만나도<br>마음을 터놓고 이야기 할 수 있는 친구가 있음에 감사하다.<br>고맙다 친구아~!!<br>거기에 그대로 있어줘서!</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0iYAqaK1U8Q3JG5VeKV7J7nYWuKXWvXfq3c5FaYPZJZRS9vLHgN2UM2vNjVfjdb4hl?__cft__[0]=AZXWuPui2n_InzzYMWLT2ZzW9WLZbb323Qa3dCDRJszIHCSlnwJIqJrSx6lekJOss93vgTc4hBPQVEqpTB5ZiWE46RAE4S72NIaDTFvqJBwqrKYMtMWgbtOURzSnil8E4UCrUNhjps1PKwviZiPiDJstWHZaY4q6CJxMoMjZ4klBOQ&__tn__=%2CO%2CP-R", "images": ["pdf4_page66_img0.jpeg"]}, {"id": 144, "date": "2018년 8월 2일", "year": 2018, "title": "교환학생을 마치고 한국으로 돌아와", "themes": [3], "content_html": "<p>교환학생을 마치고 한국으로 돌아와<br>10분 국제 전화 통화를 위해<br>3시간동안 학교 식당에서 설거지 하던 시절<br>After exchange student at the U of A<br>Working 3 hours, washing dishes<br>just to talk to Jina for 10 min<br>따스한 봄 햇살을 맞으며 아내를 향한 그리움에<br>힘들어하며 진아 앓이를 하던 시절<br>During suffering from Love sickness<br>While spring sunshine<br>기적적인 상황 전개와<br>양가의 결혼 승락에 기뻐 들떠있던 시절<br>Miraculously happened to get married<br>Only after 4 months of separation<br>하루에 수십번씩 꺼내 보던<br>아내의 사진.....<br>이번 캐나다 처가집에서 발견..<br>Taking out this picture<br>Thinking about Jina numerous times<br>Found in my in-law's album<br>그 때 우리는 젊었었다.<br>Our old but youthful time</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0DC2DBXi8ZTt3pL3xuVeY3mbTkzquLEtvmt7RLGGTY5NW9geWCR7pBxQVUmxVwasJl?__cft__[0]=AZUulco6-YfCr7snAVyD7_1P_nqcuo7yoOdICgWogT13OQ02ghrBN3cinhk-lrrGPEtii_onNEvDU3eQFlTEacQABQRVXiuRHubjsWD1XGntOSsCZVEeHh_aPvbH-jMbty-Hjt5vM21Wca-PrU8_ozzzCKGV9RCpHd8zGEzYpx2sqA&__tn__=%2CO%2CP-R", "images": ["pdf5_page1_img0.jpeg"]}, {"id": 145, "date": "2018년 8월 13일", "year": 2018, "title": "제가 오늘부터 1년간", "themes": [2, 14], "content_html": "<p>제가 오늘부터 1년간<br>영국에 있을 예정입니다.<br>일일히 다 인사드리지 못하고<br>떠나 죄송합니다.<br>전화는 오늘 부터 안됩니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02vmAHqaD5qK1MDuhoCKrxPtFhARiMTbhvVKrVvGLNMmt23GJwdDurKKTWwv7KAjA5l?__cft__[0]=AZWIMinc7htvHwhDuPbQUQap10R32_5enL-lfjJzvsZEvcLDVc-6HWmsBkKFKj77_DxTJBCZmkcSu5YrnCoSSxTMTnh9evUw5N2RvmK1rUeH1W5sNpsbDApZDjX2i7FXr0WgYTRUYtF1YfPf-fyXS78V&__tn__=%2CO%2CP-R"}, {"id": 146, "date": "2018년 8월 15일", "year": 2018, "title": "아름다운 낭비", "themes": [16, 14], "content_html": "<p>아름다운 낭비<br>엄마가 준비한 식탁<br>전복 네 마리<br>꽃게 세 마리<br>새우 작은 거 20개<br>기타 해물 다수<br>엄마 아빠 나<br>셋이 먹는 게 찌게에<br>들어가는 재료로는 너무 많다.<br>보리 굴비 한 마리<br>갈치 세 조각<br>내가 만든 메뉴<br>돼지고기 1근 반<br>양파<br>애호박<br>당근<br>마늘<br>매실원액<br>등으로 만든 제육볶음<br>이 모든걸 80대 노인 두 분과<br>살을 빼야하는 내가 맞이했다.<br>영국에 오기 전 마지막 저녁<br>그렇게 우리는 낭비했다.<br>그 무더위에 음식준비는 비효율적이었다.<br>내일 가는 날 위해<br>하루에 다 먹지 못할 양의 과일을 싸 주신다.<br>평소 같으면 싸우고 안 받았겠지만<br>그냥 받아 왔다.<br>그 더운데 그냥 엘리베이터에서<br>작별 인사를 해도 될 텐데<br>굳이 함께 차에까지 오신다.<br>작별의 손을 흔드신다.<br>힘의 낭비다.<br>1년후 우리 다시 만날 수 있을까~?<br>아마 부모님이나 나나 같은 생각일 것이다.<br>눈물이 흐른다.<br>행복한 낭비다<br>사랑은 비효율적인 것이다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02L19EhZSZyDGRhyR3z1Bjy3nBtNYZomyEVejn5UQWuuLVMcckZ5nDF5bVka5HCtS5l?__cft__[0]=AZXjqo3GjaKNdGqiEfZ-Letvy0KyLgabwULgqxnoVtERAf8GbHiJMYVb_KTPTRhTwNY2nXtqkHg0s6jQAGf3YvlVsiRSPUDmA_YovktHEy_2mZsbMw5H44ijEIly-VEn86s_YIKF8C8QTDUhCnlvrgWJ&__tn__=%2CO%2CP-R"}, {"id": 147, "date": "2018년 8월 29일", "year": 2018, "title": "영국생활 2주차", "themes": [4, 14, 3, 8], "content_html": "<p>영국생활 2주차<br>완전 초짜다<br>다시 포닥을 시작한 것 같은 느낌<br>어딜 가나 촌놈 같이 뭘 모른다<br>나름 영어를 잘 한다고 생각했는데<br>전화로 뭘 신청할 때면<br>Excuse me.... 를 연발한다.<br>아직 차가 없어<br>아내와 기현이를 데리고<br>배낭을 메고 장을 보러 다닌다<br>혹자는.. 멋지네. 라고 생각할 지 모르지만<br>앞으로는 말 안듣는 기현이에게 소리지르며<br>뒤에는 자전거를 잘 못타는 아내를 신경쓰며<br>배낭에 잔뜩 며칠 먹거리를 실고 자전거를 타는 게<br>여간 스트레스다.<br>어제는 여기 영국의 교차로,<br>Roundabout 이라고 하는데, 거의 죽음이다.<br>길을 건너다 기현이가 차에 치일 뻔 했다.<br>순간 차문을 열더니 운전자가 막 쌍욕을 한다.<br>난 쫄아서, 어쩌지.. 뭐라 하지...<br>막 이러고 있는데<br>자전거를 탄 두 사람이 나타나더니<br>그 운전자에게 막 욕을 해 댄다.<br>\"He is just a kid, you f***** idiot\"<br>날 대신해서 막 싸워 준다.<br>난 옆에서 멍하니 바라본다.<br>나 대신 욕을 해 준 사람에게 고마워야하나?<br>어쨋든 고맙다.<br>그 사람, 그렇게 하고 운전자를 보내더니<br>나에게 묻는다.<br>Do you remember me?<br>지난 주에 영국에 온 내가<br>널 어떻게 알아? 하고 멍때리는 나에게<br>안경을 벗고 웃으며 이야기 한다.<br>며칠 전 차를 빌린 렌트가 회사 직원이다.<br>내가 영국에서 만난 정말 몇 안되는 영국사람인데.<br>그 순간 나타나<br>나를 위해 기현이를 위해 싸워줬다.<br>하나님께서 보내주신 분인가?<br>내가 욕을 할 줄 모르니, 대신 욕을 해줄 사람을 보내주신 건가?<br>이렇게 우리 가정은 어리버리 하게<br>영국생활에 적응하고 있다.<br>만만치 않다.<br>오늘은 아침 부터 비가 내린다.<br>이런 날씨에 적응하기도 쉽지 않다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02WBeA69espsmQxetbBVEpGqSunh9tTCfd2KXzurNXvugcR2yeMF5z5MVW7Ltxy8Cwl?__cft__[0]=AZXz4pHLmtqG6rRZhkOIJ-Rir3m_TReS0dfIRNCf4Sng7Wgu7xhwweFaX1RVDfihbIJEjyDoofPdaC1yqrSUtpJFcUEiXs-FEgEgg3PuuxG1W69-DUQPhNkN6jcNfbrQ33cPK1aUTRnWyVf8qwyatm__JdKo8i9WZVTjt_dHQLS8Xw&__tn__=%2CO%2CP-R", "images": ["pdf5_page5_img0.jpeg"]}, {"id": 148, "date": "2018년 9월 9일", "year": 2018, "title": "참 이상하고 재미 있네요 .", "themes": [10], "content_html": "<p>참 이상하고 재미 있네요.<br>여기 영국에도 한국 북방식 고인돌과 흡사한 고인돌이 있습니다. 얼마전 캔터베리 여행을 다녀<br>오는 길에 들려서 신기하게 보고 왔네요.<br>오래전 선사시대 사람들 간에 교류가 있었는지, 아니면 사람들이 이동을 했나 봐요.<br>It is quite interesting to find Dolmen in England. I heard that there are a good<br>number of Dolmens around Europe, although it is not as many as Korean<br>peninsula. There must be some kind of sharing of cultures thousands of years ago.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid025EcDN34AmSFTzDPVKWxbnZmygcvDbhS9WuWdD5F2P73QzaHyZ2p8vVY9uV6vG3PQl?__cft__[0]=AZWWrmVUPu9_2w34drYqL_ygDJ_H1ggiGDYWd1Uu9dwECSGm4y6KT6m7Q-Zcu2IndxkLGGvyjp8vJIhimBZ_ae5koj1JYD_UOGOK1tpZGLoj3h_5XyqrT6znW6LnKgkvR_7lBpY9LFkJIhdYVR8ljEB6V4REYIElxG3Lmno6YjULRA&__tn__=%2CO%2CP-R", "images": ["pdf5_page6_img4.jpeg"]}, {"id": 149, "date": "2018년 9월 17일", "year": 2018, "title": "이 논문은 정말 여러가지 스토리를 담고 있다.", "themes": [13], "content_html": "<p>이 논문은 정말 여러가지 스토리를 담고 있다.<br>첫째, 연구가 끝나고 11년 만에 논문으로 나왔다.<br>둘째, 그동안 3명의 대학원생이 투고를 해왔다.<br>셋째, 총 20번 리젝 (Reject) 당하고 논문이 드디어 개제 되었다.<br>넷째, 결과가 매우 인상적이다.<br>논문의 결과를 한마디로 요약하면, 비만 아동을 대상으로 운동과 식습관을 조절을 통한 체중 감<br>량은 인슐린 저항성과 중성지방을 무려 70-80% 감소시킨다. 이 논문 관련해 처음 결과를 투고<br>했을 때에 심사자가 결과를 믿을 수 없다고 리젝을 했던 기억이 있다. 학자들이 믿기 어려울 정<br>도로 우리 몸은 운동과 식습관을 병행해 체중을 감량했을 때에 우리의 건강에 유익을 준다.<br>그런데, 이렇게 생활습관 개선을 통해 체중을 감량하면 지방간이 좋아질 줄 알았고, 그런 가설하<br>에 실험을 진행했는데..<br>오히려 갑작스런 체중감량은 간의 지방 축적량을 오히려 증가시켰다. 다행인 것은 이렇게 증가한<br>간의 지방량은 일시적인 것인고 (확인은 못 했지만), 인슐린 저항성과 중성지방 심지어는 염증지<br>표등과도 상관관계를 보이지 않았다. 체중 감량 전의 간의 지방량은 인슐린 저항성 등 심혈관질<br>환 위험인자와도 관계가 높았다.<br>이런 뜻밖의 결과를 받아들고, 고민하면서 선행연구 결과를 찾아봤더니, 인간을 대상으로 한 연<br>구는 거의 없었고, 밍크 (밍크코트에 사용되는 동물 ㅠㅠ) 를 대상으로 금식을 시켰더니 간의 지<br>방량이 증가했고, 다시 음식을 줬더니 간의 지방량이 다시 감소했다는 연구는 있었다.<br>어쨋든, 이 연구 논문은 정말 지난 11년간 많은 저널에서 거절을 당했고, 결국 자신의 자리를 찾<br>은 정말 우리 연구실로서는 뜻깊은 논문이다.<br>논문의 1저자인 강동우 연구원과 박지혜 박사가 고생했고, 이미경 연구원 그리고 이 논문 운동<br>중재때 학부 연구보조원으로 참여했던 민지희 류정수가 이제 30 대 현숙한 학자가 되었으니....<br>이 연구에 참여했던 토토 키즈런 친구들 (당시 초등학생) 중에는 이미 대학을 졸업해서 취업을<br>한 친구도 있을 정도다.. ㅠㅠ<br>논문 리젝당해도 포기하지 말자.<br>언젠가는 자신의 자리를 찾아가리라.. ^^<br>관련 링크<br>https://www.ncbi.nlm.nih.gov/pubmed/29262266<br>https://www.ncbi.nlm.nih.gov/pubmed/22687644<br>https://www.ncbi.nlm.nih.gov/pubmed/20018186</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0TW8Mt1T56fzEAGy8LSob9LtGJWUVfN2bHtZJmBpwp3tTmmCAYUdpRWXefTkM3uRCl?__cft__[0]=AZVq17Oqihmbdnb8QY6I0TZTu7vxOn9dmgOVd9OmMBztJT-0UWaRMKJwwrUqFcDrHDVKWr8fppxXlTPI7z4TTEHCpQuzjUPf5zidvWfn51QPn0e8Q2YYR6rlfVsfa-3oehsEoJl4aUNCGkv0qFW9kBILnWfPf0PwjCK3Cs7Cv6FKcw&__tn__=%2CO%2CP-R"}, {"id": 150, "date": "2018년 9월 19일", "year": 2018, "title": "무지는 사람을 힘들게 합니다 .", "themes": [10, 5, 9, 8], "content_html": "<p>무지는 사람을 힘들게 합니다.<br>영국이라는 나라를 오게 되면서<br>비자를 신청하는 과정<br>이곳에 정착하는 과정<br>학교 시스템을 이해하는 과정등등<br>너무 모르는 것이 많았습니다.<br>사실 그리 복잡한 것도 아닌데<br>잘 모르니 힘이 들었습니다.<br>최소한 한국에서는<br>의식주 문제로 고민을 하진 않는데<br>여기에서는 기본 의식주 문제로 어려워 하게 됩니다.<br>이곳 주소가 없다보니 아이 학교 신청도 못하고<br>여기 집을 계약하려는데, 제 신용확인이 안된다고<br>6개월치 집세를 다 내라고 하고,<br>현금은 안 받는다고 하고<br>은행 계좌를 열려고 하니<br>집 주소 확인이 있어야 한다고 하고<br>직장에서 주소 확인 주소를 써 줘야 한다고 하고<br>사실 이 모든일이 그리 어려운 것은 아닌데,<br>그 과정을 잘 모르니 마음이 어려웠습니다.<br>이런 일련의 과정을 겪으면서<br>나도 모르게 내가 가지고 있는 지식 때문에<br>내가 얼마나 오만해 졌는지를 깨닫게 되었습니다.<br>학생들이 질문할 때에,<br>그것도 모르냐?<br>속으로 생각했던 마음<br>대학원 생활에 대해 물어볼 때에,<br>'시작하면 알게되' 라고<br>대답했던 나의 모습<br>여기에 와서 내가 그 모습이 되고 보니<br>내가 소홀히 했던 이들의 얼굴이 떠오릅니다.<br>그리고, 아무것도 모르는 나에게<br>친절히 설명해 주는 사람과<br>미팅을 하고나니<br>내 마음 속 나의 근심이<br>녹아내리는 것을 경험하며<br>'나도 앞으로 더욱 친절해야 겠다'고<br>다짐을 해 봅니다.<br>이곳에 와서 힘들었던 이유 중 하나는<br>이곳 사람들의 불친절, 거친 언사,<br>심지어는 인종차별적 행동과 발언<br>이런 취급을 당할 때,<br>내가 이러려고 여기에 왔나. 하고 후회도 했지만,<br>그런 상황들을 통해서<br>우리나라에 오셨던 선교사님들의 마음을<br>조금이나마 이해하게 되었고<br>혼자 쓰던 연구실에 익숙하다<br>40-50 명이 쓰는 방에 책상 하나를 쓰다보니<br>옆에 사람 신경쓰여 눈치보는 나를 발견하며<br>대학원생활을 처음 시작하는 학생들의 마음을<br>조금이나마 더욱 이해하게 됩니다.<br>내가 이곳에서 새로운 학문을 배우고<br>더 큰 업적을 이루려는 마음으로 있을 때는<br>상처가 될만한 일들과 사건들이<br>이곳 영국인과 영국에 있는 분들을 섬기라고<br>하나님께서 이곳에<br>나를 보내셨다는 것을 깨닫고 나니<br>힘든 일들과 상황들을 조금이나마<br>더욱 잘 견디게 됩니다.<br>7년전 보스톤에서 연구년을 보내며<br>정말 나의 인간성의 바닥을 보게 하신 하나님께서<br>이번에 나를 더욱 겸손케 만드시기 전에<br>내가 더욱 스스로 겸손해 질 수 있기를 기도합니다.<br>이제 이곳 생활이 한달이 되니<br>드디어 학교를 배정 못 받던 아들이<br>오늘 첫 등교를 했고,<br>그동안 병원에서만 일을 했는데,<br>이제 내가 소속된 College<br>(Wolfson College) 에 와서<br>자세히 이곳에서의 생활에 대한 설명을 들었습니다.<br>이곳에 도착해 한달이 벌써 지났는데<br>이거 열 한번 하면 한국으로 돌아가네요<br>오늘은 유난히 바람이 많이 부네요~^^.<br>자전거를 탈 때 조심해야 겠습니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0AAjsDUzxNC3qLq638xCF8FQ5fVvg9HAjbJtTxaYtwHUxEL2k7sbYgfH9phVQUvAsl?__cft__[0]=AZWde-LMWIqwA26hsj1VYx-4cKAlXX0RyuCObZwFmW8v69fay0cmFaAQw5DTETuNBc7yaB0myKJTF-JPdHbsux1k8w4yfofYeL3hga8EfauxO8iSfZdaNxnPSgMerYUEtwtdg1LYGTxcg6p5skFz87Ee-czCKIg5KWmp0-S24QibqQ&__tn__=%2CO%2CP-R", "images": ["pdf5_page10_img0.jpeg"]}, {"id": 151, "date": "2018년 9월 30일", "year": 2018, "title": "세상 편해 보이는 사람도", "themes": [6, 1, 10], "content_html": "<p>세상 편해 보이는 사람도<br>다 자기가 감당해야할 어려움이 있지<br>No matter how peaceful you look<br>You have your own burden<br>세상 모든 짐을 진 듯 한 사람도<br>한바탕 웃을 만한 일이 있지<br>No matter how heavy the burden is<br>Isn't there a reason to laugh<br>그대의 짐을 짊어지고<br>그대의 눈물을 닭아 줄때<br>May your sorrow become joy<br>May your burden be lifted<br>나의 짐이 가벼워 지고<br>나의 슬픔이 기쁨으로 변할까<br>Will you let me take your burden<br>Will you let me cry with you<br>혹시 그렇지 않아도<br>그렇게 살면 안될까?<br>Even if the joy and comfort may not come<br>Can I still do it for and with you?<br>그대의 기쁨이 그대의 성공이<br>나의 기쁨 그리고 나의 성공이길<br>May your joy be my joy<br>May your success be my success<br>그대의 고통을 나눠 주오<br>그대의 웃음을 나눠 주오<br>Let me suffer with you<br>Let me laugh with you<br>그대 삶의 조그만 자리 내어 주지 않겠오?<br>Would you let me</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02ohqnXD6t9JbwSiP3fhwJrfWkTBVgj63Jr6ZWewssj6qsnmH5wGCnpMpkFvsTou2Ml?__cft__[0]=AZX9VrjiKlHwbSqj5cyF71JC4ytPkBLVJtsAGBPog84uaGV_G5-gpC5pFxklitHYcxfKepWG0lGADvuaQVgxJQ-vG6gkkBlrTo7yRcwKm5fHEEmftm3sCrK00c-NBeehQfSlaRXcDf26t9DGLhumAe1n&__tn__=%2CO%2CP-R"}, {"id": 152, "date": "2018년 10월 9일", "year": 2018, "title": "존 로스가 여러 한국 분들과", "themes": [8], "content_html": "<p>존 로스가 여러 한국 분들과<br>한글로 번역하여 금속활자로 인쇄한<br>최초의 신약 성서, ‘예슈성교젼서’ (로스본)<br>보고 만지게 된 것이었다.<br>뭔가 하나님의 섭리가 있는 것 같아<br>온몸에 소름이 돋았다.<br>그리고, 지난 1 월 다시 도서관에 가서<br>담당자와 만나 이야기를 하면서<br>1800년도 korea 혹은 corea 로 된<br>캠브리지 도서관 소장 도서를 찾다보니<br>‘요안 늬 복음젼서’가 있었다.<br>겉 표지를 보는데, ‘광세 팔년’ 이라고 나와 있다.<br>이게 뭐지 하고 구글검색을 해보니.<br>세상에…<br>1882년 존 로스가 (멕킨타이어와 다른 조선인들과)<br>번역하여 목판활자로 인쇄한 한국에는 없고<br>여기 캠브리지 도서관에만 있는 1882년 출간된<br>(한국에는 1883년 인쇄된요한복음만 있다)<br>‘요한복음’ 인 것이다.<br>그래서 더 찾다 보니,<br>1882년 최초의 한글 성경 누가 복음<br>1883년 누가복음과 함께 번역되어 편집된<br>누가복음-사도행전 합본<br>등등이 있었다.<br>아니, 사실 그동안 번역된 모든 한국어 성경이<br>여기 캠브리지 도서관에 모두 소장되어 있다.<br>그런 이유는, 모든 선교사들이 번역한 성경은<br>영국성서공회 (모든 국가의 성서공회는 영국에서 시작)로<br>보내졌고 한글 성경도 예외는 아닌 것이다.<br>이 과정에서 ‘존 로스 John Ross’ 라는 선교사<br>우리가 잘 아는 대동강에서 최초로 순교한<br>‘토마스Jermain Thomas’ 선교사<br>이 두분에게 직접적인 영향을 주신<br>‘윌리엄슨 Alexander Williamson’ 선교사<br>‘Arthington’ 이란 재력가의 35파운드의 헌금<br>‘스코틀랜드 엘긴 free 교회의 고아 소녀들을 위한<br>콘서트 수입 1파운드 15실링’<br>백홍준 (존로스와 메킨타이어 성경번역에 도움을 줌) 을 후원하기 위해 스코틀랜드의 글라스코<br>교회의 한 여성 신도가 작정한 5년간 매달 수입의 반<br>던디의 어떤 남자 성도님의 7파운드의 헌금<br>렌스다운의 토마스 목사님의 10실링의 헌금<br>초창기 한글 성경은 영국 선교사님들의 헌신과<br>많은 분들의 삶이 담긴 정성스런 헌금이 아니었으면<br>불가능한 일이란 것을 알게 되었다.<br>그런데, 조사하다 보니<br>존 로스는 성경만 번역을 한 것이 아니라<br>‘Corean Primer’ 라는<br>최초의 한국어 회화책과 문법책 (1877)<br>그리고 최초로 영어로 저술된 ‘History of Corea (1879)’ 라는 엄청난 책까지 발간을 하였다.<br>더욱 놀라운 사실은 이런 책들의 원본과 초본들이<br>다 여기 캠브리지 도서관에 소장되어 있다는 것이다.<br>그런데, 더 더욱 놀라운 사실은<br>이 책들을 이번 5월 한달동안<br>캠브리지 도서관에서<br>전시를 하게 되었고,<br>나와 내 아내, 그리고 캠브리지 한인교회<br>홍순조 목사님이 Guest curator 로 초대를 받아 전시 전반을 주관하게 되었다.<br>비록 도서관 입구 유리상자에<br>10권정도 전시를 하는 것이지만<br>한국이란 주제로 캠브리지 도서관에서<br>전시를 하는 것은 처음이라고 한다.<br>이런 말도 안되는 하나님의 섭리와 계획하심에<br>우리는 그저 놀라워할 뿐이다.<br>이 글을 쓰는 지금도, 가슴이 떨린다.<br>또한, 이번 전시와 함께 캠브리지 도서관에서 주관하는 리셉션을 계획하고 있고,<br>이 리셉션에는 존로스, 토마스 선교사, 윌리암슨 선교사님의 가족과 그외에 이와 관련된 소중한<br>분들을 모실 계획을 가지고 있다.<br>아직 이분들 연락처도 모르지만...<br>5월 영국에 올 계획을 가지고 계신 분은<br>캠브리지 도서관에 들려,<br>전시된 정말 소중한 책들과 감동적인 스토리를<br>만나는 기회를 가지면 좋을 것 같다.</p>", "images": ["pdf5_page39_img0.jpeg"]}, {"id": 153, "date": "2018년 10월 10일", "year": 2018, "title": "영국에 와서 처음에 살이 많이 빠졌었는데", "themes": [8], "content_html": "<p>영국에 와서 처음에 살이 많이 빠졌었는데<br>이제 다시 배가 나오는 것을 보니<br>어느 정도 적응이 되었나 봅니다.<br>I lost quite a bit of weight during the first month of my life in UK<br>Now that I see my belly returned back to my usual<br>I must have been used to my life in UK<br>어제는 놀라운 만남을 통해<br>처음 영어로 번역되어 인쇄된 성경 (틴데일)<br>1500 년대 처음 인쇄된 성경<br>순교하면서 땅속에 묻은 마다가스카르 성경<br>1800 년대 한국어 성경을 보고 만져도 보는<br>엄청난 경험을 했습니다.<br>God set up amazing unexpected meeting<br>I got to see and touch so many meaningful bibles<br>First English Bible<br>First Printed Bible<br>First Korean Bible (probably)<br>여기에 있는 동안 재미있는 프로젝트를<br>하나님께서 시작하게 하시는 것 같습니다.<br>I think God doing something interesting in my and</p>\n<p>my wife's life during our say in Cambridge</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0HNgkLd6FZKNPRSXR6pAX4EsAt15mLzj3MxHjyFKT6hR6Nj9RvU45s6PPU7MwGSYul?__cft__[0]=AZXYNax7DUqqE3UGueqpH7Fd2nseSy8LZgbfrPGYc6-aKTIXDH8UwlqofkzUJOzNPv7FKTQs4ZrA1qejpysJFBJyhXTN1mu6oYz8uDSvlYctbfXPmnp49QbSXdJ14qEP0H9cubN7C-mvfBW393j1uFTD4DTWWo02_7s80rdRD4_1Hg&__tn__=%2CO%2CPH-R", "images": ["pdf5_page12_img2.jpeg"]}, {"id": 154, "date": "2018년 10월 26일", "year": 2018, "title": "우리들 중에 어느 누구도", "themes": [1, 10, 8], "content_html": "<p>우리들 중에 어느 누구도<br>성공 보다 실패를<br>부유함 보다 가난함을<br>배부름 보다 배고픔을<br>편안함 보다 불편함을<br>타인의 인정 보다 무시당함을<br>자식의 성공 보다 실패를<br>좋아하는 사람은 단 한 명도 없을 거다.<br>그런데, 우리는<br>가난할 때, 배고플 때, 불편할 때,<br>무시당하고 실패 할 때에 비로소<br>우리 자신을 돌아보고<br>타인을 돌아보고<br>더 나아가 진정한 삶의 의미를 돌아보게 된다.<br>부유하고 성공한 사람과 함께 있는 것 보다<br>실패하고 배고픈 사람과 함께 있는 것의 즐거움을 알게 된다.<br>위로 받을 수 있는 사람이 진정 타인을 위로할 수 있다는<br>실패를 극복한 사람만이 진정 실패한 사람을 격려할 수 있다는<br>단순하지만 고귀한 진리를 깨닫게 된다.<br>하지만,<br>실패를, 배고픔을, 가난함을 포용하긴 정말 어려운 것 같다.<br>그래서, 함께 할 수 있는 인생의 동반자 (친구, 배우자, 가족)가 있다는 것은<br>정말로 큰 하나님의 축복인 것 같다.<br>“그런데 하나님께서는,<br>지혜 있는 자들을 부끄럽게 하시려고<br>세상의 어리석은 것들을 택하셨으며,<br>강한 것들을 부끄럽게 하시려고<br>세상의 약한 것들을 택하셨습니다.<br>하나님께서는 세상에서 비천한 것들과<br>멸시받는 것들을 택하셨으니<br>곧 잘났다고 하는 것들을 없애시려고<br>아무것도 아닌 것들을 택하셨습니다.<br>이리하여 아무도<br>하나님 앞에서는 자랑하지 못하게 하시려는 것입니다.<br>고린도전서 1:27-29<br>이 말씀이 참 위로가 된다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0X981TZbei8Lik5RRrfwsYFzqQn4er9W3MfHcqQPssiSNm1FFkqcdY5bMhXEGAgJil?__cft__[0]=AZXfSaZwU3fBtXnImFQRK3gBarcZJxBde3ZK_V4g3OsuIjkaytStb78jG2M9DTjJ5j3k8xMiDFtvG_f66YYcIphgq37XBrAby5chHfTsg73uowjQ8eaZHLW0zSjZ5R8uGAMGLUvJ23pKqPo1cwjSVb-5&__tn__=%2CO%2CP-R"}, {"id": 155, "date": "2018년 11월 3일", "year": 2018, "title": "영국에 도착해서", "themes": [5, 8, 10, 13], "content_html": "<p>영국에 도착해서<br>하루 하루가 긴장의 연속이었는데<br>이제 일을 시작한지도 2달이 넘어가니<br>일상 속에서의 긴장은 이제 사라져 갑니다.<br>이곳 교회를 통해 많은 좋은 분들을 만났고<br>여기 대학 연구소 (MRC Epidemiology Unit, U of Cambridge) 는 정말 World class 연구소<br>임을 확인하고 있습니다.<br>많은 것들을 이미 배웠고,<br>한국에 돌아갈 때 즈음에는<br>학자로서 더욱 성장한 나의 모습을 기대해 봅니다.<br>이곳에서 Michael Schluter 라는 훌륭한 분을 만나<br>한반도를 위한 기도의 끈을 놓지 않게 되고<br>더 나아가 한국 역사에 대한<br>새로운 관점과 시각을 갖게 된 점은<br>여기 생활의 또 하나의 하나님의 예비하심 같습니다.<br>지난 주에는 기현이 방학을 맞이해서<br>처음으로 프랑스 여행을 다녀왔습니다.<br>비행기 값이 우리 세명 합쳐서 20만원도 안되는<br>말도 안되는 가격이라 만만하게 생각하고 갔다가<br>좋은 구경도 했지만, 여러 어려운 일도 있었습니다.<br>여행에서 있었던 일은 다음 기회에 한 번 올리겠습니다.<br>물론 이제 여기 생활이 어느 정도 적응이 되지만,<br>긴장을 풀지 않으려고 합니다.<br>평안하다 이제 살만하다 하면,<br>그때 때론 어려운 일들이 생기더라고요<br>사실 우린 내일 무슨 일이 있을지도<br>알지 못하는 존재니까요!<br>어제 일에 감사하고,<br>오늘 나의 삶에 최선을 다하고<br>내일을 기대하는 마음으로<br>여기 영국에서의 삶을 살아야 겠지요.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0o9QbJEqyrHhDkg2iv7t9NMoHQbgs2cnKUg8SjukJRDGGeDe8PMDKqVjQxJ8hfbsbl?__cft__[0]=AZVtvBx4OkgGluxgl3HqExvM-Xzox_y_ov5bKJA0WF8mEOtqG_L4jpj9pS3XXSl-eWB5ROUaxDllwN-DsOVJ8C_UF0u3ABdbKksEu_XbJgE0n86ELA7kwsZszfY8jquJgoEbo4tKVaNHKjaJvFfiCocvJ9T2hZvRumjjP2-93_NJzA&__tn__=%2CO%2CP-R", "images": ["pdf5_page22_img0.jpeg"]}, {"id": 156, "date": "2018년 11월 9일", "year": 2018, "title": "전날 쓸데없이 새벽 늦게 잠을 잔 것이 문제였을까 ?", "themes": [3, 8, 2, 4], "content_html": "<p>전날 쓸데없이 새벽 늦게 잠을 잔 것이 문제였을까?<br>일어나 원래 차를 렌트하려 했던 곳에 차가 없다고 한다.<br>생각보다 먼 곳에서 차를 빌렸다.<br>영국에서 간신히 오른쪽 운전석에 적응했는데<br>다시 왼쪽에서 운전을 해야 한다.<br>그런데, 차가 수동이다.<br>뭐 까짓것 남잔데.. 수동정도야..<br>보험을 살꺼냐고 묻는다.<br>난 평생 랜트카 회사에서 보험을 샀다.<br>그날 처음 expedia 보험을 그냥 사용했다.<br>아내와 기현이를 데리고<br>고속도로로 들어 섰다.<br>뒤에 경찰차가 따라온다.<br>차선 변경에 잔뜩 긴장을 한다.<br>라운드 어바웃이 나온다.<br>뒤에 경찰차를 보면서 차선을 지키려 노력한다.<br>라운드 어바웃을 지났다.<br>그런데, 왼쪽에 차가 오는지를 보지도 않았다.<br>아.. 자칫하면 큰 사고가 날 뻔 했다.<br>뒤에 경찰차는<br>택시였다..ㅠㅠ<br>뭔 택시가 경찰차 같냐!<br>앞에 고속도로 요금소가 나왔다.<br>동전을 넣어야 한다.<br>동전이 없다.<br>20불짜리를 막 넣어 본다.<br>기계가 계속 돈을 토해 낸다.<br>기계가 프랑스 말로 막 떠든다.<br>뒤에 차들이 줄지어 서기 시작했다.<br>도저히 안 되겠는지<br>뒷차에서 사람이 내려 내게 다가온다.<br>나 대신 자신의 동전을 넣어 준다.<br>고맙기도 하고 미안하기도 하고<br>우여곡절 끝에 모나코에 도착했다.<br>구글이 가르쳐준길로 갔더니 길이 막혔다.<br>구글은 5분 남았다고 하는데,<br>30분째 주변을 맴돌고 있다.<br>기현이가 짜증을 낸다.<br>난 더 큰 소리로 짜증을 낸다.<br>아내도 짜증을 낸다.<br>맨붕이다.<br>차를 길가에 세우고, 앞을 봤더니<br>그 앞에 바로 우리가 가고자 하는 해양 박물관이 보인다.<br>그런데, 바다 건너에 있다 ㅠㅠ<br>애라이 사진이나 찍자.<br>그런데, 동네 차들이 다 장난이 아니다.<br>우리는 왠지 빈민 같은 느낌이다.<br>주눅이 든다.<br>포기 할 때 쯤 해양 박물관을 찾았다.<br>구경을 잘 하고 숙소로 향한다.<br>고속도로로 다시 1시간이다.<br>요금소는 왜이리 많은지,<br>동전을 던지며 아내와 외친다<br>\"옛다 이거나 먹어라'<br>동전으로만 20유로 있지롱...<br>숙소에 다 왔는데,<br>구글과 차의 네비가 다른 곳을 안내한다<br>어디로 가야 하지<br>헤메는데 기현이가 말을 시킨다<br>대답하다 왼쪽 공사하던 곳을 들이 받았다.<br>차 왼쪽이 찌그려 졌다.<br>차 바퀴에 바람이 빠진다.<br>아뿔사.<br>집도 지나쳤다.<br>차를 돌릴 곳이 없다.<br>기현이라 뭐라 말한다.<br>'닥쳐' 소리치는 나를 발견한다.<br>이제 차는 바람이 다 빠져 움직일 수 없다.<br>우리에게 프랑스에서 사용할 수 있는 전화는 없다.<br>애라 모르겠다.<br>빵구난 타이어를 그냥 끌고<br>숙소로 향한다.<br>차에서 덜덜 소리가 난다.<br>마음도 덜덜 거린다.<br>결국 숙소에 도착.<br>주차장을 못 들어간다.<br>주인이 없다.<br>차들이 들어와 비키라 한다.<br>나 빵꾸 났는데..<br>집주인이 도착해 도움을 준다.<br>렌트카를 새로 받기로 한다.<br>40분 떨어진 공항으로 오란다.<br>택시를 타고.<br>다행이 택시비는 준단다.<br>새차를 운전해 집에 오니<br>가게들이 문이 다 닫았다.<br>배가 고프다.<br>잠을 청한다.<br>계속 적인 실수를 하면서<br>이래서 잘못된 결정을 하는구나<br>깨닫는다.<br>당황하니, 화를 내니, 긴장을 하니<br>계속 잘못된 결정을 한다.<br>한숨을 돌렸어야 했다.<br>서두르지 말았어야 했다.<br>아내의 말을 들었어야 했다.<br>함께 마음을 가라 앉히고<br>하나님을 바라 봤어야 했다.<br>당황할수록 서로를 보니 짜증이 났다.<br>하루를 마무리 하며,<br>하나님 앞에 저절로 엎드리게 되었다.<br>가장의 무게가 무겁게 느껴졌다.<br>왜 사람들이 바보같은 결정을 하는지<br>비로소 더 잘 이해가 되었다.<br>잘못된 결정을<br>스스로 해결하려 하니<br>더 잘못된 결정을 내린다.<br>시간이 걸려도<br>조금 늦어도<br>서로의 이야기를 듣고<br>하나님께 여쭈어야 한다.<br>드디어 집에 간다.<br>여행의 말미가 전혀 아쉽지 않다.<br>싼 비행기를 구매했더니<br>집에 오니 새벽 2시다.ㅠㅠ<br>집에 오자 마자<br>아내와 합창을 한다.<br>'집이 최고다'<br>좁은 집이라도<br>곰팡이 버섯이 피는 집이라도<br>침대가 푹꺼진 집이라도<br>그래도 내 집이 좋다.<br>익숙한 것이 좋다.<br>새로운 것이 두렵다,<br>여행이 두렵다.<br>나이가 들어가나 보다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0D1koCUmKJ8wSr8gvspxZNatw1pbaV4LogHFk1KvkELCtZ2hjQ7dVjYzWJwdNk53El?__cft__[0]=AZWytn8N3QNCET8_xBG5jCQtlXSPER0Examso1-w8DSn1AeCHezo2gFWnqrsXYYIZCXZDQxlS1pxuaApqmWr9FnC8dbOZUgwuXS9dhgno6t8D_cPuYBuapTugMrIFVAHqmk9yAofR4ICS72EX3D5u1zQnyoQmuUvU8aBbMbgFtiUUQ&__tn__=%2CO%2CP-R", "images": ["pdf5_page27_img0.jpeg"]}, {"id": 157, "date": "2018년 11월 29일", "year": 2018, "title": "어느덧 이곳 영국에서의 생활을 시작한지", "themes": [10, 5, 9, 13], "content_html": "<p>어느덧 이곳 영국에서의 생활을 시작한지<br>3개월을 훌쩍 넘었습니다.<br>여기의 생활을 4분기로 나누면,<br>이제 1분기를 끝내고,<br>2분기에 들어가는 샘 입니다.<br>처음 이곳에서의 삶을 시작하며<br>많은 험한 일들을 겪으면서<br>아, 많이 힘들겠다. 생각했는데<br>그런 험한 일들은 사실 일상은 아니었습니다.<br>아마, 하나님께서 전용관이를 겸손케 하시려<br>일부러 1년에 한 두번 겪을 일들을<br>처음 한 두달 사이에 수 차례 겪게 하신 것 같습니다.<br>9평짜리 연구실을 혼자 쓰다가<br>여기 수십명이 한 방에 모여 있는 상황<br>처음 연구실에 와서<br>옆에 사람들 눈치 보느라,<br>전화통화는 물론,<br>화장실 왔다 갔다 하는 것도 신경쓰던ㅠㅠ<br>이제 3개월 정도 지나고 나니<br>어느 정도 숨을 돌릴 만 합니다.<br>여기 좋은 교회를 찾아 적응했고<br>주변에 좋은 분들을 많이 만났고<br>연구도 좋은 성과들을 내고 있는 것 같고,<br>그런데 하나 아직 풀리지 않은게 있습니다.<br>처음 와서 피트니스를 끊고 다니는데<br>직원 한 명이 우리의 심기를 건드렸습니다.<br>'아니 이제 피트니스 직원까지 우리를...'<br>이런 마음에 그 직원에게 화를 냈지요<br>이후 그 직원을 만날 때 마다<br>마음이 불편했습니다.<br>아마 그 직원도 우리가 불편했겠지요<br>그리고 나니, 피트니스 갈 때마다<br>열쇠를 잃어 버리고,<br>자물쇠를 읽어 버리고,<br>비밀 번호가 생각 안나고. ㅠㅠ<br>마치 피트니스 센터만 가면<br>바보가 된 것 같은 느낌입니다.<br>사실 지나고 보니,<br>그 직원이 틀린게 아니었는데,<br>이곳 영국에서 무시 당한다고 생각했던<br>자격 지심이 나로 하여금<br>순간 화를 참지 못하게 했나 봅니다.<br>물론, 욕을 하거나 한 것 아니고요.<br>어쩌면 그 직원은 이미 잊었는지 모르지만,<br>제가 사과를 할 때가 아닌가 합니다.<br>묶인 관계를 풀어야 내가 살 것 같습니다.<br>나의 그 비 이성적인 행동은<br>자격지심, 열등감, 낮은 자존감에서 시작되어<br>화를 참지 못하는 행동으로 표현이 되었고,<br>그 이후 관계의 깨어짐으로 말미암아<br>그 관계를 통해 얻어질 축복을 누릴 수 없게 된 것 같네요.<br>이번 일을 통해<br>나와 주변 사람들과의 관계를 돌아 봅니다.<br>혹시나 내가 참지 못해서 깨어진 관계가 없는지<br>많이 있네요ㅠㅠ<br>아직 할 수 있을 때에<br>그 관계를 풀어야 할 것 같습니다.<br>용기를 내어야 할 것 같네요.<br>\"온유한 자는 복이 있나니<br>저희가 땅을 기업으로 받을 것 임이라'<br>아마 여기에서 이야기 한 땅은<br>마음인 것 같습니다.<br>그 사람의 마음을 얻으면,<br>그 사람의 사랑을 얻으면,<br>우리가 온유함을 잃어버릴 때에<br>일의 성과는 보일 지 몰라도<br>마음을 잃을 수 있습니다.<br>마음을 잃으면 모든 걸 잃게 되는데...<br>지난 1주일간 한국에 잘 다녀 왔습니다.<br>대부분의 시간을 학생들 면담과<br>연구과제 회의로 보내고 돌아왔습니다.<br>더 많은 분들을 찾아뵙고<br>마음을 나누지 못하고 돌아와서 아쉽습니다.<br>영국에서의 2분기 삶을 시작하며<br>몇자 끄적여 봅니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02sCRhdA8pGbYZJFuEH4668Xs5HfY3ojUYppfga6crwoZXjdrk4kWyCRWQvZfY8a17l?__cft__[0]=AZXGE8JbD-y2cZX8SFn37mj1l6M0CzGDqYvXUo5Zu3zHgxGgkQ97uhw0AVZ25aOGHao6QylxM_-O6fCBl-X4XqZ3OKp0z07DFJmV-nzTqh2B8S7ZA0k6VVccI_zpW6313InujlkugDqRffzykSKSrmx9Q_eRjxIH03wnEHc5Eg3F2A&__tn__=%2CO%2CP-R", "images": ["pdf5_page30_img0.jpeg"]}, {"id": 158, "date": "2018년 12월 29일", "year": 2018, "title": "처음 미지의 세계와 같았던 영국에 도착해", "themes": [4, 14, 3, 5], "content_html": "<p>처음 미지의 세계와 같았던 영국에 도착해<br>모든 일이 어렵고 힘든 시절이 지나고<br>영국에서의 하루 하루가 또 다른 일상이 되어가고 있네요.<br>보고싶은 분들과<br>나를 필요로 하는 분들과<br>함께 있어야 할 분들을 떠나 있는게 안타깝지만,<br>여기 영국에서 나름 성탄절과<br>연말을 조촐하나마 가족과<br>이곳 교회와 직장에서 만난 새로운 가족과<br>차분히 잘 보내고 있네요.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0hVLfvByuBxMjmB8mezTBhV4CUezjdmFjRQMzREPQHMhh43KnGq2w2eSkh9usy2Wcl?__cft__[0]=AZU7IuDaKIVPYjA2Qz1brwlvFEfTlT1JEVnmW4Uii1aeftEGYXQ1P0pDWmVj-I19EXwRbx6Av47c1693zv8SGgIVhAwWl4chABRidh52CQJrTDIiAAFm5jDpiAluD7CckN7Zh-O1GaSz7iWLURp0SOxvqQx3qAAroc25gT1r9zvJyA&__tn__=%2CO%2CP-R", "images": ["pdf5_page31_img2.jpeg"]}, {"id": 159, "date": "2019년 1월 24일", "year": 2019, "title": "아내와 아들과 골목길 차를 비켜가다", "themes": [8, 9, 4, 2], "content_html": "<p>아내와 아들과 골목길 차를 비켜가다<br>길을 가로막고 세운 차를<br>아내의 핸드백이 스쳤나보다.<br>갑자기 '빵' 하고 경적을 울리고<br>우리를 향해서 욕을 한다.<br>다행이 차 안에서 욕을 해<br>밖에 들리지는 않았다.<br>나는 그 운전자에게 다가가 물었다.<br>Is everything alright?<br>그는 나에게 너의 식구들 가방이 차를 스쳤잖아?<br>화내던 표정이 조금 수그러든 상태로 이야기 한다.<br>앗. 'I am sorry!\" 내가 사과를 했다.<br>이번에 그 사람이 민망할 정도로<br>미안한 표정을 짓더니<br>\"That is quite alright\" 라고 이야기 한다.<br>난 그 사람을 지나 계속 가던 길을 간다.<br>지난 주일에 있었던 이야기다.<br>사실 길을 막고 주차를 한 그 차를<br>피해가는데 일어난 일이라<br>우린 잘못이 없었다.<br>생각해 보니 갑자기 여러 동양인들이<br>지나가면서 가방이 차에 스치니<br>두려워서 경적을 울렸을 수도 있었겠다.<br>그런데, 참 이상했던 것은<br>그 상황에서 난 전혀 화가 나지 않았다는 것이다.<br>오히려 그 상황에서 '미안해' 하고 사과를 했다.<br>몇 달 전 여기 처음 왔을 때의 나였다면<br>이놈이 날 무시해? 하면서<br>잘 잘못을 따지며<br>그 사람과 한 바탕 말 싸움을 벌였을 지도.<br>그리고, 집에 돌아와 생각했다.<br>왜 화가 나지 않았을까?<br>생각해보니, 처음 영국에 왔을 때는<br>참 마음의 여유가 없었던 것 같다.<br>새로운 환경에, 영국인들을 대하며<br>어쩌면 참 자존감이 낮았었을 수도 있었겠다.<br>물론 처음 있은 일은 아니다.<br>새로운 환경에 적응 할 때마다 겪었던 일이다.<br>처음 캐나다 교환학생을 가서 교양 수업을 듣는데<br>체육 전공인 나보다<br>비전공 애들이 수영을 훨씬 잘했다.<br>수업을 가서 강의를 듣는데,<br>수업 내용이 이해가 되질 않아<br>중간고사를 C 학점 정도 되는 점수를 받았다.<br>자존감이 너무 낮아 졌다.<br>난 대신 ‘옷은 내가 제일 잘 입고 다녀야지’<br>라는 마음으로<br>실크 와이셔츠를 입고<br>멋을 부리고 다녔던 기억이 난다.<br>지금 생각하면 참 우습다.<br>그때, 결국 수영을 열심히 연습해<br>그 수업을 듣던 학생 중 1등으로 기말 기록을 냈고,<br>C 학점을 받을 것 같은 수업에서는<br>그래도 B- 에 상응하는 점수를 냈다.<br>낮은 자존감을 옷을 잘 입는 것으로<br>극복하려했던 나의 유치한 생각은<br>21살 짜리 내가 할 수 있었던 최상의 생각이었나보다.<br>내 나이 이제 50이 되었는데,<br>내 안에 ‘상처받은 아이’ 는 새로운 환경을<br>맞이할 때 마다 고개를 들고 깨어난다.<br>이 상처받은 아이가 위협을 느끼면,<br>때로는 밖으로 분노조절을 못하는 아이<br>안으로는 자괴감이 가득한 우울한 아이가 되어 온다<br>나이를 헛먹은 것 같다.<br>그래도, 지난 주 화를 낼 수 있을 만할 때<br>화를 내지 않고,<br>차분히 오히려 사과를 할 수 있었던 것은<br>이제 영국생활이 어느 정도 적응이 되고<br>나의 상처받은 아이가 수그러들었기 때문일까?<br>여기 영국에서의 첫 몇 달을 생각해 보면,<br>인종차별을 느끼고,<br>실제로 당하기도 했지만,<br>대부분의 문제는 실제보다 커 보였고,<br>그리고 나는 스스로를<br>실제보다 작게 보았던 것 같다.<br>그래서 내가 작지 않음을 증명하려<br>화를 내기도 하고,<br>쓸데없는 행동을 하기도 한 것 같다.<br>박사 학위를 할 때 생각이 난다.<br>지도교수와 의견의 차이가 있어<br>논쟁을 벌이다 결론을 못 내고 헤어져<br>카페에 앉아 문제를 묵상하기 시작했다.<br>내가 이 문제를 해결 못하면,<br>나는 학위를 못 끝내게 될 것이고,<br>그럼 한국에 돌아가 뭐하지?<br>그럼, 아내와 아들은.....<br>문제를 묵상하다 보니<br>최악의 상황을 생각하게 되었고<br>내 인생이 비참해 보였다.<br>그때 내 마음을 울린 하나의 음성이 있었다.<br>“용관아 왜 넌 나를 묵상하지 않고 문제를 묵상하니?”<br>난 정신을 차리고,<br>하나님을 묵상하기 시작했다.<br>하나님은 나를 가장 잘 아시고,<br>그분은 내가 학위가 필요하다면 끝나게 하실 것이고,<br>만약에 그렇지 않다면, 더 좋은 계획이 있으실 것이다.<br>무엇 보다 하나님은 무엇이든 할 수 있는 분이시다.<br>하나님을 묵상하고 나니,<br>문제를 객관적으로 볼 수 있었다.<br>지도교수와 의견 일치를 보지 못하는 부분에서도<br>내가 자존심을 부린 부분이 있었고,<br>그 부분을 수용하고 나니,<br>문제의 해결점이 보였다.<br>내가 박사학위를 취득하는 것이<br>하나님의 뜻이었는지<br>학위를 잘 마칠 수 있었다.<br>그때 깨달은 것이 있다.<br>손바닥만 바라보니<br>점점 손바닥이 가까워진다.<br>이젠 난 앞에 손바닥 밖에 안 보인다.<br>하지만, 하늘을 바라보고<br>다시 손바닥을 바라보면<br>손바닥은 그저 손바닥일 뿐이다.<br>손바닥 만한 문제라도<br>그 문제를 묵상하며<br>최악의 상황을 생각하면<br>문제밖에 보이지 않게 되고,<br>훨씬 더 비현실적인<br>최악의 결정을 하게 될 것이다.<br>아마 내가 여기 영국에 처음 와서<br>또 다시 손바닥을 너무 가까이서 바라봤나 보다.<br>그렇다고, 내가 이제 하나님을<br>더 잘 바라본다고 할 순 없지만,<br>그리고 이젠 손바닥을<br>손바닥으로 보게 되긴 한 것 같다.<br>이제 영국에 온지 5개월을 넘어 6개월째 접어든다.<br>그래도 아직 지난 시간 보다 남은 시간이 길다.<br>좀더 여유롭게 하나님을 묵상하고,<br>주위 사람들을 돌아보고 섬길 수 있는<br>넉넉한 마음이 주어지길 기도해 본다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02mJvhbR5ZFvfa1EJkSG25TqfhWbhdGFBhBzJ76Wmb5YwzxcN2L7RQ8dkxjQvtJGDsl?__cft__[0]=AZUOlIoy7DZaemOKD_s75z-PBwYyyhMdkNQR8yxsxymV_GODBstjDXo1yoMH4LG94BZfgEP85Y2x4Mbifa4yGjvmcyZD3VngDMbGJ23zrfvNWuIkviprWS_LqlGNAy_doqgXkXuYcZd-BXmpLnuW_aSb&__tn__=%2CO%2CP-R"}, {"id": 160, "date": "2019년 2월 23일", "year": 2019, "title": "난 어려서 부터", "themes": [8], "content_html": "<p>난 어려서 부터<br>역사에 관심이 많았다.<br>중학교때는 교과서에서 가르치는 역사관과<br>내가 다른 책들에서 배운 역사관이 달라<br>선생님과 논쟁을 벌이기도 했고,<br>선생님에게 혼이 나기도 했다.<br>한때는 대학에서 역사를 전공하고<br>역사 학자가 되는것을 꿈 꾸기도 했다.<br>그 중에서도 한국사에 관심이 많았고,<br>요즘에는 동아시아 역사에 깊은 관심을 가지고 있다.<br>영국에 오면서도 셀틱인들과 북방 유목민<br>그리고 노르웨이와 스웨덴 원주민 (Sami) 과<br>시베리아 유목민 (툰드라), 알라스카 원주민, 캐나다 원주민의<br>유사성에 대해 공부하고 싶은 마음도 가지고 왔다 (물론, 모두 아마추어 연구)<br>그런데, 전혀 뜻밖에 이곳에<br>내가 소속된 컬리지 디너에서<br>캠브리지 대학 도서관<br>일본과 한국 담당 사서와 대화를 나눴고<br>내가 잘 알지도 못하면서<br>초창기 한국 선교에 영향을 끼친<br>영국선교사 이야기를 좀 했더니<br>나보고 한국 관련 도서 전시를 하고 싶은데 도와달라도 했다.<br>‘난 바쁘니 어렵더라도<br>내 아내가 자원봉사로 도울께’ 라며<br>아내와 함께 지난 10월 9일 (한글날) 도서관에<br>첫 미팅을 하러 가게 되었다.<br>도서관에 갔더니,<br>우리를 여러 성경책이 있는 곳을 데리고 갔다.<br>그리고, 그곳에 가보니,<br>1611년에 출간된 킹제임스 성경 원본<br>1526년 목숨을 걸고 영어로 번역하여 출간한<br>윌리엄 틴데일의 영어 성경<br>에라스무스의 라틴어 성경 등등<br>사실 엄청난 보물급 성경들을 만져보고<br>이 성경들을 들고 사진도 찍어보게 되는<br>말도 안되는 경험을 하게 되었다.<br>그리고, 밑에 층에 내려가<br>한글로 된 성경을 보게 되었는데,<br>‘참 오래된 성경들이네’ 하고 사진을 찍고<br>집에와서 ‘혹시나’ 하고 찾아 보는데,<br>우리가 만지고 사진을 찍은 성경이<br>최초 한글 성경 신약 합본인<br>‘로스본’ 의 성경이었다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0P11KbRswN9toW7jSurue7aPbETmteLgz2cCRJ3fBXM7dAhBZWP7UpKSuiwkcAYqVl?__cft__[0]=AZVvNOdhbZ98ym3Iec29z7Ffw8zWvObGpzzkQSMwwtPUkH2sHzC0mLfG3ldVmEfQ91edKADCZYeyk7brToaY0Eb9tVHaF5e5vA8GJMT9mHDbJh0BrtioEUEk-aM0biL0my0I4kz7cTeMSKY37nebRIuEHyZ-gZrA1ek4UKYyg7cSKg&__tn__=%2CO%2CP-R"}, {"id": 161, "date": "2019년 2월 24일", "year": 2019, "title": "설득하기와 설득 당하기", "themes": [8, 3, 4, 16], "content_html": "<p>설득하기와 설득 당하기<br>우리네 인생을 살다보면<br>담판을 지어야 할 때가 있다.<br>때로는<br>저녁에 무엇을 먹을까 부터 시작해서<br>집에 어떤 가구를 들여 놓을지<br>자녀의 진로를 놓고 혹은 결혼을 놓고<br>부모와 자녀가 논쟁을 벌이기도 하고<br>교수와 제자가<br>같은 조 모임에서 학생들끼리<br>갈등을 겪기도 한다.<br>때로는<br>사소한 저녁거리 혹은 가구 같은 문제라도<br>서로 굽히지 않고, 자신의 주장만 하다가<br>전혀 사소하지 않은 상처를 주고받기도 하고,<br>기분 좋게 저녁을 먹으려고 하다가<br>불편한 마음 상태로 체하기도 한다.<br>줄다리기를 하면서<br>양쪽의 힘이 비슷하면<br>줄이 팽팽해 지고,<br>줄의 중심에 걸어 놓은 빨간 수건은<br>어느 쪽으로도 움직이지 않는다.<br>좋은 말로는 균형<br>나쁜 말로는 ‘being stuck’<br>어디로도 움직이지 못하는 상태가 되는 것이다.<br>우리는 인생에 매우 중요한 시기에<br>주변에 소중한 사람과의 관계에 있어<br>‘being stuck’ 되는 경험을 한다.<br>회사 차원에서는 ‘노-사’ 간의 갈등<br>가정에서는 부부간 갈등 부모와 자녀간 갈등<br>학교에서는 교수와 학생, 교수와 교수, 학생과 학생<br>때로는<br>갈등을 키우기 싫어 그냥 덮어두고 있지만,<br>덮어 둔다고 문제가 해결하진 않는다.<br>나 개인 적으로 가장 기억에 남는 사건은<br>‘아내와의 결혼’ 문제 였다.<br>캐나다에 교환학생을 갔다가 아내와 연애를 시작했고<br>한국에 오기 전에 기쁜 마음으로 엄마에게 전화를 했다.<br>‘엄마, 나 배우자 될 사람을 만난 것 같아요’<br>그날 어머니는 충격을 받아 응급실에 실려 가셨다.<br>어머니는 나름 아들을 위해<br>친구들 딸들을 소개할 생각에<br>아들이 한국에 오길 기다렸는데<br>아들이 자신은 한 번도 보지도 못한<br>캐나다 처자와 결혼을 한다고 하니<br>충격이 만만치 않으셨던 것 같다.<br>무엇보다 난 그 때 만으로 23살 밖에 되지 않았으니<br>한국으로 돌아 왔지만,<br>분위기기 만만치 않았다.<br>평소의 나 같으면,<br>왜 이 사람이 좋은지,<br>왜 이 사람과 결혼을 해야 하는지<br>설득하고, 설득하다 안되면 조르고, 땡깡 부리고 했을 텐데<br>내가 믿기론 조용한 하나님의 음성이 들리는 듯 했다.<br>“네가 하려 하지 마라, 내가 하겠다”<br>난 교환학생을 마치고 한국으로 돌아가<br>결혼 이야기는 한 마디도 꺼내지 않고 나의 일에 충실했다.<br>다만, 매일 새벽에 하나님 앞에 엎드려 기도했다.<br>하나님의 뜻이면, 어머니의 마음을 바꾸어 주십시오.<br>한 보름 쯤 지나고 나니, 아버지가 날 부르셨다.<br>“용관아! 진아는 어떤 아이니?”<br>기회는 지금이다<br>난 열심히 아버지에게 진아를 자랑했다.<br>“난 진아는 잘 모르겠지만, 너를 신뢰한다”<br>“어머니를 설득하려 하지 마라. 내가 하겠다”<br>난 그때처럼 아버지가 멋있어 보인 적이 없었다.<br>중간에 여러 가지 과정이 있었지만,<br>부모님 모두 결혼을 허락해 주셨다.<br>다만, 결혼은 1년 후 여름에...<br>감사한 마음은 잠시<br>진아는 캐나다에 있고,<br>난 한국에 있는데<br>그리고 한국에 이미 1년간 일한 곳도 정해져 있는데,<br>어려운 결혼 까지 허락해 주셨는데,<br>하나님 앞에서, 부모님 앞에서<br>1년을 기다려 결혼을 하는 것이 맞는데....<br>진아를 보지 못하는 게 너무 힘이 들었다.<br>1995년 어느 봄날 새벽<br>하나님과 담판을 짓게 되었다.<br>“하나님, 진아를 만나게 해 주셔서 감사합니다.<br>부모님도 결혼을 허락하게 해 주셔서 감사합니다.<br>그런데, 도저히 내년까지 기다릴 자신이 없습니다.<br>하나님, 올해 결혼하면 안될까요?<br>하나님의 뜻이 우리가 내년에 결혼하는 것이라고 하더라도<br>인간적으로 너무 힘들어 내년까지 못 기다리겠습니다.<br>제발..... 괜찮으시다면, 올해 결혼할 수 있도록 해 주세요..<br>한 일주일을 매일 새벽 하나님 앞에 때를 쓰러 나갔는데,<br>그때 일주일간 다른 사람들을 위해 기도를 하게 되었던 것 같다.<br>그렇게 일주일이 지났고, 하나님의 응답은 뜻밖의 곳에서 왔다.<br>난 갑자기 유학을 꼭 그해 가야만 하는 상황이 되었다.<br>그리고, 캐나다 대학에 지도교수에게 문의했고,<br>최종 결과가 나오는 날 새벽, 잠안 오는 밤<br>하나님 앞에 무릎을 꿇었다.<br>내가 믿기론, 기도로 하나님과 대화를 하였다.<br>“용관아 유학을 내려 놓으렴”<br>“네? 그럼, 결혼은요?”<br>“.......”<br>“저 유학 가서 공부도 하고, 학위도 따고<br>그래서, 선교사로 하나님을 위해서 일도 하고...<br>저 유학 가야 해요“<br>“........”<br>“저 유학 못 가면 진아랑 올해 결혼 못해요.<br>올해 결혼 못 하면 진아랑 결혼 못할 것 같아요.<br>진아랑 결혼 못하면, 전 평생 결혼 못 할 지도 몰라요“<br>“.......”<br>“저 유학 못 가면, 하나님을 위해 더 많을 일을 못 해드려요”<br>“유학 가야 해요!!!! 결혼도 하고!!!!”<br>“아니 결혼 못하게 하시려면, 왜 여기까지 오게 하셨어요?”<br>“......”<br>“ㅠㅠㅠ”<br>새벽 1시에 무릎을 꿇어 기도를 시작해<br>캐나다와 전화통화가 약속된 새벽 5시까지<br>무려 네 시간을 하나님과 기도로 씨름했다.<br>난 하나님을 설득하려 무던히도 노력했지만<br>도저히 하나님을 설득할 수 없었다.<br>“네 하나님”<br>“하나님이 원하지 않으시면 유학 포기 할께요”<br>“하나님이 원하지 않으시면 결혼도 포기 할께요”<br>“전 진아가 제 짝이라 생각하지만, 그리고<br>진아가 아니면 결혼을 평생 못 할 것 같지만<br>나를 진아를 가장 잘 아시는 주님을 신뢰할께요“<br>그날 처음으로 성경에 나오는<br>야곱과 하나님의 씨름이 어떤 것인지 경험했다.<br>난 완전히 모든 것을 내려 놓았고,<br>곧 캐나다와의 통화를 통해서<br>내가 캐나다 대학에 9월에 입학하기로<br>결정이 났다는 이야기를 들었다.<br>담대하게 받아 들였다.<br>아... 난 모든 결과를 내려 놓았지만,<br>결국 하나님의 결정은 내가 유학을 가는 것이구나<br>부모님께 그해 유학을 가야 한다고 말씀을 드렸고<br>부모님은 유학을 가려면 결혼을 하고 나가라고 하셨고<br>난 2개월 후에, 마지막 학기말 시험을 보고 (김정주 교수님 수업)<br>곧 결혼을 하게 되었다.<br>그때 처음 깨달았다.<br>‘설득하기와 설득 당하기’<br>난 하나님께 설득을 당했고,<br>그리고 하나님께 결정을 맡겨 드렸고<br>하나님은 모든 것을 선하게 인도하셨다.<br>난 나를 사랑하시는 아버님과 어머님을 존중했고<br>부모님은 나의 결정을 존중해 주셨고,<br>우리는 서로에게 ‘사랑의 설득’을 당했다.<br>난 자칫 부모님과 갈등을 빚을 수 있었고,<br>하나님과의 갈등으로 인생을 막 살아버릴 수도 있었다.<br>돌아서 생각해 보면, 하나님은 나의 모든 것을 알고 계셨고,<br>날 위해 가장 좋은 길이 무엇인지 이미 알고 계셨지만,<br>나의 마음 상태를 준비시키기 위해<br>그분께 모든 것을 의탁하도록 나를 설득하셨다.<br>우리가 주위 사람과 갈등하는 가장 큰 이유는<br>내가 모든 것을 알고 있다고 생각하기 때문이다.<br>내가 틀릴 수도 있는데...<br>그 사람이 옳을 수도 있는데...<br>때론 눈이 가리워 져서,<br>때론 못된 고집과 아집으로<br>‘난 맞고 당신이 틀리다’는 생각으로<br>절대 굽히려 하지 않는다.<br>이런 논쟁은 절대로 승자가 없다.<br>우리는 win-win 윈윈 이란 말을 자주 한다.<br>좋은 말이다.<br>그런데, 윈윈이 근시안적으로는 윈윈이지만<br>혹은, 주변 사람에게 짧게는 이익이 되지만,<br>장기적으로는 서로를 죽이고, 사회를 죽이는 일이라면<br>때로는 서로가 짧게는 피해를 보고 힘이 드는 일이라도<br>장기적으로 서로를 살리고 모두를 살리는 일이라면<br>기꺼이 대화를 통해 설득하고 설득당하는 과정을 겪어야 하지 않을까<br>어제는 새벽까지 아내와<br>큰 아들 걱정, 작은 아들 걱정으로 밤을 지새다 잠이 들었다.<br>아침에 하나님 앞에 엎드려 팔복으로 기도를 하는데<br>“심령이 가난한 자는 복이 있나니, 천국이 저희 것임이요”<br>가슴에 속삭임이 들려온다...<br>“용관아 그럼 우리 심령을 가난하게 하는 것은 복이네”<br>“요즘 우리의 심령을 가장 가난하게 하는 것은 기현이네요”<br>“기현이는 복덩이다, 이걸 받아들여야 한다”<br>“아.. 하나님 너무 힘들어요.ㅠㅠㅠ”<br>“애통하는 자는 복이 있나니, 저가 위로를 받을 것임이요”<br>여기에서 위로는 헬라어로 “파라칼레오” 이다.<br>파라칼레오는 여러 가지로 해석할 수 있지만,<br>오늘 다가온 마음은 ‘같은 부르심’ 이었다.<br>진짜 애통은 우리의 생각과 하나님의 생각이 다를 때<br>심령이 가난하여 짐으로 해서,<br>하나님 앞에 엎드려 지는 것이고<br>그 결과는 파라 칼레오인 것이다.<br>다른 말로, 하나님의 의견과 우리의 의견이 하나 되는 것이다.<br>“내가 기준이 기현이를 사랑한다”<br>“내가 저들을 위해 최고의 계획을 가지고 있다”<br>“나를 신뢰하고 나에게 맡겨라”<br>“저들은 내가 너희 부부에게 보내준 복덩이다”<br>난 요즘 우리 아들들을 생각하면서<br>특히 여러 가지로 문제가 있는 기현이를 생각하면서<br>걱정과 근심 그리고 우려로 기현이를 복으로 보지 못했다.<br>믿음이 없으니, 걱정으로 잔소리를 하게 되고<br>원망하게 되고, 스스로를 자책하게 되고,<br>심지어는 기현이를 생각하면<br>가슴이 갑갑해지고, 심박수가 빨라지는 것을 경험하였다.<br>하나님께서 주신 복과 선물을 감사하지 않으니.....<br>다시 한 번 내가 얼마나 믿음이 없는 자인지<br>다시 한 번 내가 얼마나 한심한 존재인지를 깨닫는다.<br>“온유한 자는 복이 있나니, 저가 땅을 기업으로 받을 것임이요”<br>내가 근심과 우려 그리고 걱정이 가득하니<br>기현이를 향해 온유함을 잃고 더욱 윽박지르고 있는 것을 알았다.<br>내가 온유하지 못하니까, 기현이가 함께 온유함을 잃는다.<br>사소한 일에 내가 짜증을 내니, 아내도 힘들어 하고 아이도 힘들어 한다.<br>내가 문제다...<br>설득하기와 설득 당하기...<br>내가 틀리고 그(녀)가 맞을 수도 있다.<br>난 하나님께서 지금이라도 능력을 발휘하셔서<br>기현이가 모든 면에서 지금 당장 성장하고 성숙하면 좋겠는데<br>하나님을 기현이를 위한 최고의 타이밍을 알고 계신가 보다.<br>우리가 생각하기에 기현이가<br>이렇게 성공했으면 하는<br>우리의 성공의 잣대를 내려놓아야 한다.<br>그런데, 그게 잘 안 된다.<br>그래도 내려놓아야 한다.<br>기현이를 위한 하나님의 계획을 붙들어야 한다.<br>아니, 어쩌면, 하나님께서 기현이를 통해서<br>우리 안에 더 중요한 일을 하시는 지도 모른다.<br>기현이는 그저 우리를 위해서 하나님께 쓰임을 받고 계신지도..<br>우리가 더 변해야 한다.<br>더 엎으려야 한다.<br>더 설득 당해야 한다.<br>어쩌면 그 분은 지금도 우리에게 말씀하고 계신지도<br>\"용관아 조바심에 뭔가 하려 하지 마라, 내가 하겠다\"<br>오늘 페북에 올리는 나의 하소연이다.<br>설득하기 설득 당하기...<br>쉽지 않은 과정이다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0c8Jw8E8s2pRxErG6Ys1VtgxFHcyA4Z1oZeJkZDrNcetLC6Bp16jvY78vx9TPhQDel?__cft__[0]=AZUlSONSfR1N0UUhGe84Nd2jSBeOnozX2pWqPkS5tp8WgrIyhqfq5e9-9xrvtcujY6C-rSg6gZbT3bx5JXFKTEYhRiGfSUiPA6wTNbOB2BkE2k8KxZE8N8OWKcXYqf42t4xF4d8aJIvC_NCzqbpmo-XX&__tn__=%2CO%2CP-R"}, {"id": 162, "date": "2019년 3월 8일", "year": 2019, "title": "서양의 근대화는 동양에서 시작되었다 \"", "themes": [2, 9, 5, 13], "content_html": "<p>\"Eastern origin of western civilization<br>서양의 근대화는 동양에서 시작되었다\"<br>이 책의 저자인 셰필드대학 홉슨교수와<br>두 시간 가량 대화를 나눴다.<br>여러 가지 이야기를 했지만<br>가장 기억에 남는 말은<br>'많은 동양의 사람들에게<br>자신의 연구 결과를 이야기하면<br>아주 좋아하는 사람과<br>아주 화내는 사람으로 나뉜다는 것이다.<br>서양의 것이 좋다는<br>문화적 사대주의..<br>그런데 사실 그 문화를 전해준 것은<br>동양의 사람들 혹은 서양의 사람들이<br>동양 사람들에게 배워갔다는 사실...<br>우리가 최고라는<br>스스로를 있는 그대로 보지 못하고<br>환상속에 부풀려진 자신을 믿는<br>스스로 도취된 생각도 위험하지만<br>우리가 그렇게 잘했을리 없어 라는<br>잘못된 열등감과 회의주의 역시<br>그래서 오히려 서양학자가<br>우리의 우월한 점을 이야기 해주면<br>오히려 화를 내는 모습은 너무 바보같다.<br>홉슨 교수와<br>한국의 역사 이야기를 한참 나누며<br>함께 공감했던 또 하나의 사실은<br>한국사에 대한 다양한 관점들 중<br>영어로 번역된 혹은<br>영어로 쓰여진 한국 역사가 너무 없다는 것이다.<br>제발 한국 역사의 다양한 관점들을<br>영어로 소개하는 분들이 많이 나오면 좋겠다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid06oh1XX3UJLpxioyALWPhw8RDkyVdTVJZHjuW8AdzkS8eb2UiM3TB9qPyVBbjEtVgl?__cft__[0]=AZXZ_wxjcGKo7nJdcl1-nr5RR95HOPfOY8GH53AMixMl_KMOWfGP8FB7pZOX1uw_0V-nGIBnlx7hNz-j0qJTxPXetbJKOCA8rr1S6WO8FtfUeZWkAbRC-3t5aQJUv06pzWZzdp-d_sGmqcMgWvGNQP8qyuXTbz1lcSznygK_ZcgZTA&__tn__=%2CO%2CP-R", "images": ["pdf5_page48_img0.jpeg"]}, {"id": 163, "date": "2019년 3월 8일", "year": 2019, "title": "반구대 암각화에서 시작된", "themes": [9, 14, 3, 5], "content_html": "<p>반구대 암각화에서 시작된<br>고래에 대한 호기심은<br>나로 하여금 Aberdeen 대학 교수이자<br>알라스카 고고학의 최고의 권위자인<br>Richard Knecht 교수를 알게했고<br>쉐필드 미팅에 이어<br>왕복 17시간의 기차 여행에 몸을 던지게 했다.<br>여기 스코틀랜드에서도 발견되는<br>고인돌과 선사시대 유적들<br>알라스카에서 발견된 온돌<br>과테말라 정글에서 발견된<br>6만여개의 주거지와 고가도로까지 있었던<br>당시 유럽과 중국을 앞섰던 문명의 흔적<br>https://www.google.com/.../maya-laser-lidar-guatemala...<br>유전자분석기술이 열어갈<br>고고유전학과<br>과학기술의 만남<br>아주 조그만 돌로된 칼은<br>10000 여년간 구석기 유물로 발견되다<br>갑자기 일제히 약속이나 한듯이 사라진 점<br>알라스카 북미 남미의 샤먼들<br>심지어는 북유럽과 시베리아의 샤먼의 유사성은<br>마치 고대 전세계에 걸친 공동체가 있은 듯 하다.<br>2시간여의 깊은 토론과<br>리차드교수와의 끈끈한 만남<br>알류시안 열도로의 초대<br>고고학 전문가로부터 듣는<br>알아갈수록 모르는 것이 많다는 것을<br>알게된다는 고백<br>분야는 다르지만 학자로서 공감하고 발을 돌린다.<br>어쩌면 다음에는 16시간 기차여행이 아닌<br>16시간 비행기 여행이 될 수도 있을 것 같다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid06oh1XX3UJLpxioyALWPhw8RDkyVdTVJZHjuW8AdzkS8eb2UiM3TB9qPyVBbjEtVgl?__cft__[0]=AZXZ_wxjcGKo7nJdcl1-nr5RR95HOPfOY8GH53AMixMl_KMOWfGP8FB7pZOX1uw_0V-nGIBnlx7hNz-j0qJTxPXetbJKOCA8rr1S6WO8FtfUeZWkAbRC-3t5aQJUv06pzWZzdp-d_sGmqcMgWvGNQP8qyuXTbz1lcSznygK_ZcgZTA&__tn__=%2CO%2CP-R", "images": ["pdf5_page50_img0.jpeg"]}, {"id": 164, "date": "2019년 3월 13일", "year": 2019, "title": "요즘 영국에 있는 한인교회의", "themes": [16, 8, 4], "content_html": "<p>요즘 영국에 있는 한인교회의<br>청소년들에게<br>요한 1서를 가지고<br>사랑에 대해 설교한다.<br>특히 대속, Atonement 의 의미에 대해 이야기 하면서,<br>자녀를 위해 기꺼이 대신 아프길 원하는 부모의 이야기<br>자녀의 암 치료비 3억을 지불하기 위해<br>집을 팔은 부모의 이야기를 한다.<br>그리고, 부모라면 당연히 그러리라 생각한다.<br>그게 우리를 향한 하나님의 사랑이라 생각한다.<br>그런데, 문든 이런 생각이 들었다.<br>만약 내가 집을 팔아<br>아픈 아버지와 어머니를 위해<br>병원비를 내야 한다면<br>나는 그렇게 할 수 있을까?<br>자녀를 위해서라면<br>무엇이듯 줄 수 있는데<br>우리를 위해 모든 것을 희생하신<br>부모님을 위해서는<br>조금도 희생하고 싶지 않은<br>우리의 모습이 아닌가 ㅠㅠㅠ<br>기회가 있을 때<br>부모님께 더 잘해야 하는데,<br>시간은 우리를<br>기다려 주지 않겠지<br>부모를 공경하는 것이<br>얼마나 어려운 일인지<br>어쩌면 성경이<br>네 부모를 공경하라고 이야기 하며<br>이땅에서 네가 잘되고 장수할 것이라고..<br>약속이 딸린 첫 계명라고<br>이야기 하는 지 모르겠다.<br>용돈 다 필요 없다.<br>애들 맛있는 거 사줘라..<br>난 괜찮다.<br>바쁜데 뭐하러 오냐..<br>그냥 집에서 쉬어라.<br>라는 부모님의 말씀을<br>때론 거역해야 하지 않을까<br>생각해 본다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02cefn5M43gmM9zs6UvCcyUt2TM98t7Kn9oANFA4Zc1QER57A9NfeRKeAbNVvm1VEal?__cft__[0]=AZUy_Gg5PhIGubNa4-lJY01NF8H-CBIpnuuZnvvh3yDHt6Q6_jZBLXx-7ZfGS8gZOetaz0_z3_gB-0LuJt-lGb3cV_fDHr7H4tbh_xOIqL4-uKmz_eGbTkotqnJ0WX25aDwHEutFQeqwRZd_wS1AtcGf&__tn__=%2CO%2CP-R"}, {"id": 165, "date": "2019년 4월 21일", "year": 2019, "title": "벌써 5월이 다가 왔네요 .", "themes": [5, 8], "content_html": "<p>벌써 5월이 다가 왔네요.<br>작년 10월9일부터<br>본격적으로는 올 1월부터 준비한<br>캠브리지 대학의 한글 성경 전시가<br>5월 한 달간 있습니다.<br>정리한 그림 하나 올립니다.<br>이번에 전시회를 준비하면서<br>많은 분들을 만났고,<br>많은 것들을 배웠습니다.<br>앞으로 전시회가 시작하기 전까지<br>종종 글을 올리겠습니다.<br>5월 중에 영국에 오시는 분들은<br>캠브리지에 꼭 들려 전시회를 감상하시고<br>(입구에 8권만 전시하는 매우 보기엔 볼품 없는 전시지만)<br>혹시 5월 16일에 오실 수 있는 분은<br>제게 미리 연락 주세요.<br>그날은 심포지엄과 리셉션이 있습니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0scLvVXgXBC4RA2imxiF5UvPNjPGhjGyPjtEwS3LqWmFKKyUw7YtkkeExE8jhYmZHl?__cft__[0]=AZWlbwUh6WPl_K5MCjJM_aU-La6AqFhVUHxVJ8EANL-jgMwQvrUje_D6JxMJC6zOwR9el16GtAtocGLWfkgMyW937YmFQz8Y1T7jkZRxS8KLYcmlAy-gl5qyLm-R0VuvTinln5YnOW5VZQteEXajGO3nnxPWVaFvsn1CrnEnNjHD6A&__tn__=%2CO%2CP-R", "images": ["pdf5_page53_img0.jpeg"]}, {"id": 166, "date": "2019년 5월 5일", "year": 2019, "title": "아내와 연애도 하기 전", "themes": [4, 3, 8, 16], "content_html": "<p>아내와 연애도 하기 전<br>아내의 할머니는 나를 아껴주셨다.<br>얼마 안되는 본인의 용돈을 아껴<br>나에게 용돈을 주시기도 하셨던 할머니<br>나에겐 천사같은 할머니<br>그런데 할머니의 별명은<br>호랑이 할머니 셨다.<br>아이 셋을 낳고<br>불연듯 남편을 저 세상에 보내시고<br>혼자 아이 셋을 행상을 해 가면서 키우신<br>할머니의 또 다른 별명! 욕쟁이 할머니!<br>난 한 때 믿으시는<br>아니 아들을 목사로 키우신 할머니가<br>왜 욕을 하셨을까...<br>속으로 할머니를 판단한 적도 있다.<br>아내를 이스라엘에 잠시 보내고<br>잠시 방문한 큰 아들과<br>원래 함께 있는 둘째를 데리고 있는 있은지<br>3일차!!<br>말을 콧구멍으로 듣는 둘째와<br>먹는 것 양말...<br>정말 사소한 일로 싸우는 큰 아들들을 보다<br>나도 모르게...<br>이런 ㅇ 노무시씨들......<br>이런 ㅇ 노무시끼들......<br>아. 아들에게 이런 욕을 하니<br>이런 욕은 부모가 하면<br>자기에게 하는 욕이다 ㅋㅋ<br>순간 웃기기도 하고<br>슬프기도ㅜ하고<br>그리고 드는 생각<br>'I need my wife!'<br>'Thank God that I have a wife!!!'<br>순간 혼자 자녀를 키우는 분들에 대한 리스펙트<br>아이들을 엄하게 키울 수 밖에!!<br>혹! 엄마/아빠 없는 아이라 비난을 받을까!!<br>궁둥짝을 때리며 신세에 대한 한탄!!<br>아! 나란 사람..<br>인격이 아직 이정도 밖에..ㅠㅠ<br>그래서 은혜가 필요할 수 밖에!!<br>부족한 나를 아버지로 인정에 주는 아들들의 은혜<br>부족한 남편을 존중해 주고 사랑해 주는 아내의 은혜<br>끝까지 용서해 주시고 사랑해 주시는 그분의 은혜<br>어린이날<br>부족한 어른임을 느끼는 일인의 고백과 푸념이다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02dQgRuna7yhA5hAv8pTYYjhcAmqpvpoVFJpgAVGiw6d3wH7whsWYmcntwgBPjbAZSl?__cft__[0]=AZW_fi10PkcWSaFAdvVnShPBQTh1eVUZrloZYO5BNSDXReLaDRHmLB-R8OxGeZ8sFTXs-1-0nD_AsdynmOLrflBCXQC9Kxx8rbmbhkq_rkpeID79chQi_wVO2i9nb1bc5w4UXKOYipfH_BK_wZ6zZf0v&__tn__=%2CO%2CP-R"}, {"id": 167, "date": "2019년 5월 18일", "year": 2019, "title": "캠브리지 도서관 주관 한글 성경 전시회", "themes": [6, 8], "content_html": "<p>캠브리지 도서관 주관 한글 성경 전시회<br>심포지엄과 리셉션이 어제 마무리 되었다.<br>도서관 관계자<br>대영 성서공회 관계자<br>참석은 못하셨지만<br>만나주시고 지원해 주신 박은하 대사님<br>오셔서 축사를 해 주신 선남국 공사님<br>일을 가능하게 해 주신 민성호 문화 원장님 (이은정 사무관님)<br>캠브리지 한글학교<br>캠브리지 한인교회<br>한국에서 오신 세분목사님<br>캠브리지 대학 참가자<br>예수전도단 캠브리지 DTS 팀<br>런던에서 올라온 민영이와 친구<br>세필드 대학의 James H. Grayson 교수님<br>그밖의 여러 분들이 참석해 주신<br>너무나 뜻깊은 행사<br>전시회는 5월 마지막 금요일까지 진행이 되지만<br>참 여러모로 감사한 지난 7개월간의 여정이었다.<br>아내를 자원봉사시키려 도서관에 갔다가<br>하나님의 섭리로 준비하게된 전시회<br>정말 수많은 자료를 읽었고,<br>많은 감동을 받았고,<br>많은 분들을 만났고,<br>혼자 짙은 감동의 눈물을 훔치기도 했다.<br>처음 부터 끝까지 함께 해준 아내에게 감사하고<br>일은 자꾸 만드는 날 끝까지 믿어주고 지원해 주신<br>캠브리지 한인 교회 홍순조 목사님께 감사하고<br>대사관 홈페이지 메일로 보낸 글을 마음에 담아<br>실질적 도움을 준 런던 대사관에 감사하고<br>처음으로 한국관련 전시를 해 준<br>캠브리지 대학 도서관에 감사하고<br>무엇 보다 하나님께 감사하다.<br>방금 이번 성경전시회 준비와 함께 시작한<br>무려 97페이지 짜리 논문수정본을 제출하고 나니..<br>TGIF<br>Thank God it's Friday 가 저절로 나온다.<br>감사합니다. 감사합니다. 감사합니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0reeVGAmTi2UxzstdAVqH6CoX4WBnRQxgoW8oPmGY6hnXbbsQEJxnmi3m4QnG6mPYl?__cft__[0]=AZWq9-tRXRqNHyhgqGx3Q4zmAwIL_8b1N_9wuwfnlt24QPP4LYAfXVD2pwkMfX0JWGBIAu06eaS3WdUwEE9E8R_khKRyaP1MXWdyxMr037lStUzPn6OwWB7DxYVS0060XFMkMBXduyjeRoOHdgenrZeGwucfNO9k7t3mw9rmUHFBXA&__tn__=%2CO%2CP-R", "images": ["pdf5_page56_img0.jpeg"]}, {"id": 168, "date": "2019년 5월 30일", "year": 2019, "title": "처음 가정의학과 이지원 교수님과", "themes": [13], "content_html": "<p>처음 가정의학과 이지원 교수님과<br>대장암 수술의 국내 최고의 권위자 중에 한 분인<br>김남규 교수님에게 공동연구 제안차 찾아뵈었습니다.<br>만나서 인사와 함께 명함을 드리자<br>'체육 전공이시네요,<br>제발 우리 대장암 환자를 위한<br>운동프로그램을 좀 만들어 주세요'<br>'어떤 운동을 해야 하냐고 묻는데,<br>뭐라고 답을 할지 몰라 그냥 걸으라고만 합니다'.<br>이게 2010년 봄 즈음으로 기억합니다.<br>'과학적 근거기반 운동프로그램'<br>'Evidence-based exercise program'<br>이런 키워드를 가지고<br>과학적 근거기반 운동프로그램을<br>개발하는 방법을 수 없이 찾아 헤매었습니다.<br>그런데, 아무리 좋은 논문이라도<br>그냥 어떤 운동을 시켰다.<br>그랬더니 암이 이렇게 좋아졌다<br>당뇨병이 이렇게 좋아졌다.<br>이런 이야기만 나오지<br>왜 그 운동을 그렇게 시켰는지에 대한<br>내용을 근거로 해서 운동프로그램을<br>개발한 연구는 찾을 수 없었습니다.<br>'암환자를 위한 과학적 근거기반 운동프로그램'<br>이거 만들어야 하는데...<br>고민에 고민을 거듭하다가<br>간호대 추상희 교수님을 찾아갔습니다.<br>함께 머리를 맞대고 논의하던 중에<br>모든 알고 있던 내용이 정리가 되며<br>'과학적 근거기반 운동프로그램 개발'<br>10단계 청사진이 만들어 졌습니다.<br>그리고 지난 9년동안 이 10단계 과정에 의해<br>대장암 수술후 운동, 대장암 치료 종료후 운동<br>조혈모 세포 이식 환자, 소아암 환자를 위한<br>운동프로그램을 개발하고 효과 검증을 한 상태이고<br>수술 후 유방암 환자, 전립선암환자 프로그램을<br>개발하고 있는 과정입니다.<br>사실 과학적근거기반 운동프로그램 개발 10단계는<br>암환자 뿐 아니라, 파킨슨병, 척추손상장애인, 당뇨,<br>고혈압, 심혈관질환, 그리고 요통등 다양한 질환을 가진<br>환자에게 적용을 하고 있기도 합니다.<br>이런 과정을 통해서 개발한 운동프로그램이<br>대장암 수술을 받은 환자의 재원기간을 평균 이틀<br>중간값 하루 줄인다는 논문을<br>2013년도에 파이럿 RCT 결과를 논문에 발표 했었고,<br>확대하여 2년에 걸쳐 진행한 최종 RCT 결과를 투고중에 있습니다 (퇴원일을 줄일 뿐 아니라 입<br>원으로 인한 근육량의 손실을 막습니다).<br>이번에 이런 과정을 '안기용 박사', '양혁인 연구원'이<br>주도적으로 논문을 작성하여 'Supportive Care in Cancer' 에<br>개제를 하게 되었습니다.<br>그런데, 재미있는 사실은 원래 이 논문은 중국에서 발행하는<br>국제학술지에 리뷰 초청을 받아 작성했었는데,<br>초청한 학술지에서 Reject 을 주는<br>사상 초유의 상황 (리뷰어가 이런 유의 논문을 이해 못함)이<br>벌어졌었습니다.<br>그래서, 논문을 보완해서 Supportive Care in Cancer 에 투고 했었죠. 그런데, 재미있는 사실<br>은 평생 이런 리뷰는 처음 받아 봤습니다. 리뷰어가 이렇게 적었습니다.<br>\" Rarely in the life of a reviewer I have read a manuscript which bared the<br>potential of becoming a benchmark study for its specific field. This manuscript<br>might be one of them. This manuscript does not just present a systematically<br>developed exercise protocol for colorectal cancer patients, the systematic approach<br>in the development process of a targeted exercise intervention can be applied for<br>any (cancer) entity and will assist researchers worldwide when planning exercise<br>interventions for their respective patient population. The inclusion of both<br>hermeneutic (systematic literature review), qualitative (focus group discussions &<br>interviews), and quantitative (pilot study & RCT) research methods in a logical<br>sequence is THE major strength of this paper.\"<br>한 마디로 요약 하면, 논문을 리뷰하면서 필드에 영향을 주는 벤치 마크 논문을 가끔 보게 되는<br>데, 이 논문이 그런 논문이다' 뭐 이런 내용입니다.<br>중국 국제 학술지를 폄하하는 것은 아니지만, 그쪽에서 리젝을 받은 논문 치고는 평가가 매우 상<br>반되는 경우이네요.<br>이런 평가를 받고<br>'병원 앞에 쭈그리고 앉아<br>별로 반가워 하지 않는 환자에게서 설문지 받고<br>새벽이고 밤이고 환자 운동 시키러 다니던<br>안기용 박사와 우리 연구원들 얼굴이 떠올랐습니다.<br>이전에 뇌성마비 장애인 아들을 휠체어에 태우고<br>튜브에 태우고, 자전거에 태우고 철인 삼종 경기를 하던<br>아버지아 아들의 인터뷰 내용이 떠오르네요<br>'아버지가 아니었으면 할 수 없었을 거예요'<br>'아들이 아니면 하지 않았을 거예요'<br>대학원생들과<br>지도교수의 고백이기도 할 것 같네요.<br>여기 논문을 다운 받을 수 있는 링크 보내드립니다.<br>운동 프로그램 개발 하실 분들은 참고하세요.<br>https://rdcu.be/bE5Ox</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02zicTyrBn24eERRZfk3x88xnf6capcy5x9R317w3ef18Ec4L45T5U7YDQq1axHTscl?__cft__[0]=AZW4VOpW9XUnHjKZkshmPQlhHIkZr-tquBQQulR044wImhLhYVWeZOnu7g1f6Pb0mG8GPbCSo62YOxseysKvWMUkOtJuMi7OosMQypI6jA0qMuXuQ-XB02aaf2HaaZjTsBC-M_SKqVp7FxyVBSbMPogn21UZ34gq90j4jeNspeDhcQ&__tn__=%2CO%2CP-R"}, {"id": 169, "date": "2019년 6월 6일", "year": 2019, "title": "처음 이곳 영국에 와서", "themes": [10, 8, 1, 9], "content_html": "<p>처음 이곳 영국에 와서<br>어리버리 지내던 시절!<br>Arrived in a new country<br>Everything was unsettled and uneasy<br>이곳에서의 생활이 기대되면서도<br>한국의 편리한 생활이 그리웠던 시절!<br>With much expectation for new life in UK<br>Missing my comfort in Korea at the same time<br>이제 아침 커피를 시키러 커피샵에 가면<br>내가 뭘 시킬 지 알아서 미리 만들어 준다.<br>Now, time passed by<br>Barista knows what I want before I order<br>여러 사람이 함께 사용하는 사무실<br>화장실 자주가기도 기침하기도 미안한 환경<br>Not being used to shared office<br>Feeling sorry for going to the toilet and coughing<br>처음 입학한 대학원 생들을 이런 마음이겠구나ㅏ<br>우리 학생들은 이런 점이 힘들었겠구나<br>Made me understand new graduate student of mine<br>Things I have not realized before<br>힘들고 어려운 삶을 살아보니<br>주위 사람들에게 눈이 간다 마음이 간다.<br>Through hardship and experienced inconvenience<br>My heart became softer<br>이제 두 달여 남았다.<br>선물 같았던 이곳에서의 삶을 슬슬 정리해야 한다.<br>It's only about 2 months before return to my ordinary<br>I need to prepare my leaving<br>앞으로 남은 기간 무엇을 해야 할지<br>혹은 무엇을 하지 말아야 할지 결정해야 한다.<br>What to do for the time remained<br>But also need to decide what not to do<br>우리네 인생도 언젠간 돌아갈 날을 준비해야겠지<br>Someday, I guess we need to prepare for our departure<br>\"하루를 살아도 영원을 살 것처럼<br>영원을 산다 할지라도 오늘이 마지막인 것 처럼\"<br>\"Live today day like eternity even though it is the last day of your life and live<br>today like the last day of our lives even if you will live forever\"<br>장인 어른이 1999년 해주신 말씀이 생각이 난다.<br>What my father in law told me in 1999 suddenly became louder</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0QXggRziwChx694XyriWoB8YMfMCQfWYZgrMBKCseGzswueCEYjPUZL3QP7e6DUQkl?__cft__[0]=AZVzqn95-E1SFpxwCF1P6fZrmLLJHbeZ1RtA4J9tBG9rKaO9-hPm4Yu13nvBKemBKkx9tbroAfxngVnnUHI9E8XRPFxLZnIdkzJUiK7SoaPoRDrmnqKk_788Q-LShOWr-F8aF2K1YJRxA61xzZjHjh8q&__tn__=%2CO%2CP-R"}, {"id": 170, "date": "2019년 8월 6일", "year": 2019, "title": "10여년 전 보건복지부 회의에 참석해", "themes": [13, 9, 11], "content_html": "<p>10여년 전 보건복지부 회의에 참석해<br>우리나라 국가대표 설문인<br>국민건강영양조사 신체활동 설문지가<br>타당도가 조사되지 않은 설문지라는 사실과<br>사실 그 외에도 대부분의 신체활동 설문지가<br>아직 신뢰도와 타당도가<br>확보되지 않았다는 사실에<br>제 세부 전공 분야는 아니지만,<br>체육전문가로서 안타까워 했었지요<br>그러던 중, 우연히 질병관리본부의 과제로<br>WHO 에서 새로 만든<br>Global Physical Activity Questionnaire<br>(GPAQ), 번역, 신뢰도 및 타당도 조사 연구를 수주했습니다.<br>2012년, 연구년에서 돌아와<br>연구비 없이 전전긍긍 하던 시절,<br>뭐든 받아 보려고, 대학원생들과<br>2주 꼬박 밤새 노력해서 연구계획서 작성하고,<br>세 시간 남겨 놓고 온라인 제출 하려고 했더니,<br>아뿔사,<br>세종시 직접 제출이라는 사실 때문에<br>맨붕..<br>연구 과제 신청시 보험을 들어야 한다는 사실에<br>또 맨붕...<br>연구처장 서명을 받아야 한다는 사실에<br>또 또 맨붕<br>복사 10부 해서 기차역으로 택시타고 가다 보니<br>다섯 부 두고 떠났다고 대학원생 연락와<br>맨붕...<br>택시타고 서울역으로 쫒아오는 대학원생에게<br>나머지 다섯 부를 전달받으려 기차문에 매달려<br>끝까지 제시간에 도착하지 못한<br>대학원생을 기다리며<br>서울역사가 점점 멀어지는 광경을 보면서<br>맨붕...<br>맨붕*100 한 후 간신히 제출하고 서울에 돌아와<br>송구영신예배를 드리며,<br>함께 고생한 대학원 생들의 얼굴을 떠 올리며<br>감사의 눈물...<br>그렇게 말도 안되는 과정을 거쳐<br>정말 잘 알지도 못하는 Physical activity measurement 분야에<br>발을 들여 놓고,<br>과제를 수행하는 기간동안<br>맨붕*1000<br>결국 우리 대학원 생 몇 몇 트라우마로 수년간 고생<br>과제를 마치고, 다시는 질병관리 본부 과제 안하기로 작정...<br>어쨋든...<br>이 모든 과정과 이후<br>거의 열번의 투고와 리젝을 반복하다<br>2012년 안식년 지난 후 대대적으로 했던 과제가<br>2019년 안식년이 끝나는 즈음에 논문으로 나왔네요..<br>이제 우리도 국민건강영양조사 신체활동 설문지<br>당당히 Reliable 하다 Valid 하다... 라고 할 수 있는<br>논문이 나왔습니다.<br>상심되는 과정에 굴하지 않고,<br>끝까지 노력해준 이정아 교수<br>연구 데이타 수집을 위해<br>방방곡곡 누비고 다니던 초애 (이번에 결혼 한다는..^^)<br>데이타를 수십번 다시 분석했던 지희와 동우<br>아무것도 모르던 우리를 열심히 가르쳐 주시던<br>국민대 이미영 교수님<br>여러 공동연구자 교수님<br>자문위원교수님<br>그외 우리 연구실 연구원 여러분들.<br>수고 많으셨습니다.<br>감사합니다.<br>어쨋든,<br>그때 가속도계, 신체활동 설문지 등등 공부하면서<br>Physical Activity measurement 와 epidemiology 에 입문해서<br>결국 여기 캠브리지에 Physical Activity Epidemiology Unit 에 연구년을 와 있네요.<br>여러모로 의미있었던 연구였습니다.<br>Impact factor 가 높은 곳에 개제되진 않았지만,<br>Impact 가 클 것이라 믿는 논문입니다.<br>https://www.ncbi.nlm.nih.gov/pubmed/31375056<br>https://journals.sagepub.com/.../6VAHCAGFHMRPEKJRBRKT/full<br>https://doi.org/10.1177/1757975919854301</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0cTK5jVTeZrWYLL4942cixpVhkfX9fwq6646yyQVdRKdEfYSyVchUMu43oanKhehnl?__cft__[0]=AZUM-ZLdwlhX_RzO8RSW297WAkD89eBJL-Go4O6cz5XRnX34krwdIdG9yF9YL65xdDqZGpAkmdke1_l9vCzrj1FnYSyTEHXWicBJaAmSG93VZKD1IvAWwcLcOQNwFDLPG6M0_bsvqxvWn2F-No8fac7bcH7wd1xZPpY9Mr_uHUvsbw&__tn__=%2CO%2CP-R"}, {"id": 171, "date": "2019년 8월 14일", "year": 2019, "title": "똥줄탄다 .", "themes": [10], "content_html": "<p>똥줄탄다.<br>Pain in the a**<br>우리가 흔히 사용하는 표현이지만<br>실제로 경험해 보니 그 표현의 의미가<br>확 다가 온다.<br>뭐가 힘들었는지<br>아님 20대 아들과 함께한 운동이 무리였는지<br>올 초 평생 처음으로 고통이 동반한 치질을 경험했다.<br>정말 말로 표현하기 어려운 고통<br>대부분의 시간을 앉아서 일해야 해 배가된 고통<br>진통제를 먹으며, 고통을 견디며<br>혹시 이게 치질이 아니라 훨씬 심한 거면... ?<br>분야 전문가 교수님께 메일로 증상을 설명했더니<br>바로 답장이 왔다. '치질이야' '걱정마'<br>안도감이 들었지만, 고통이 사라지진 않았다.<br>기침을 해도 아프고,<br>변기에 앉으면 더 아프고,<br>운동을 하려고 힘주면 아프고....<br>놀리는 아내와 아들을 바라보니 마음이 아프고.<br>이런 고통을 경험하고 나니,<br>배변의 기전 (mechanism) 이 이해가 되고<br>그동안 수수께끼 처럼 고민했던<br>우리가 개발한 운동이 왜 대장암 환자의 배변문제에<br>큰 효과를 가져다 주는지가 해부학적으로<br>생리학 적으로 이해 되었다.<br>운동은 치질에 도움이 될까?<br>치질에 도움이 되는 운동은 뭘까?<br>치질이 있는데 운동해도 될까?<br>연구 주제가 막 떠 오른다.. ^^<br>영국에서 경험한 치질<br>말못할 고통,<br>하지만, 고통이 가져다 준 깨달음<br>깨달음이 가져다준 기쁨과 성숙<br>동일한 아픔을 경험한 사람들에 대한 이해<br>이제 한국에 돌아갈 즈음<br>지난 1년간의 나의 삶의 요약.. 이라는 생각이 든다.<br>그땐 매우 아프고 힘들었는데<br>지금은 그때 얼마나 아팠는지는 기억도 나지 않는다.<br>불편하지만, 그 고통을 embrace 하고 살아간다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0m6NL3LBdvnj8Ap9CcZEebNPM7BZY5KM2gK3Rvo4NiaFZjGc3SYMA8uSTraxMX7H6l?__cft__[0]=AZXhKXDdu3PbklcZjhdvCZzLKVdNPsX9kbinQFyv7N5SmQL6ud5id1dDS42hcZhSQtMoz02pg03Q6JmDDY82VdAsNyuXq6T4fD3Ayis8jIYq8-x2oyg53jlLOEvXORfH1NoJ8GK0GFzLSPDAtc2V3uaC&__tn__=%2CO%2CP-R"}, {"id": 172, "date": "2019년 9월 2일", "year": 2019, "title": "모든 시작이 있는 것은 끝이 있다.", "themes": [8, 2, 5, 6], "content_html": "<p>모든 시작이 있는 것은 끝이 있다.<br>Everything that has a beginning has an end.<br>하나님의 은혜와 여러분들의 도움과 배려로<br>연구년을 잘 마치고 한국에 복귀했습니다.<br>By the grace of God and kindness of others<br>Now I am back to Korea after one year of Sabbatical at U.K<br>1년간 또 어김없이 제가 알마나 부족한 사람인지<br>해보려고 해도 잘 할 수 없는 사람인지ㅠㅠ<br>그래서 많은 하나님과 주변의 도움과 배려가 필요한 사람인지를 깨닫고 돌아왔습니다.<br>Again it was period that I realized that<br>how much I need grace and forgiveness<br>from God and others.<br>기도와 배려에 감사드립니다.<br>Thank you for your prayer and consideration.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid033W8gH8AFQ34LTAiDK6NcTV8Rv5rwNmuK72Hxsp4RWFzmeUQJ4Sbuun1tJuaN8fCLl?__cft__[0]=AZXgmzXUlRUxjXHcA8doQEkt0f99S5dTUDMoxZMgZwSJeJ803yqvvvH6Sg79Na4uPcuwsrPVOw4yCyY0AxHyms-G4i6qtcDIHpgB7eaIeMeQ6IinbbcrKX5MftjciTG_Zexg7BIJL-W3Crst1mMB2KAu9wkV582Ds1OljNNcf_DxpQ&__tn__=%2CO%2CP-R", "images": ["pdf5_page65_img0.jpeg"]}, {"id": 173, "date": "2019년 9월 28일", "year": 2019, "title": "그때는 맞고 지금은 틀리다", "themes": [2, 8, 12, 14], "content_html": "<p>그때는 맞고 지금은 틀리다<br>피트니스 센터장을 하면서<br>가지고 있던 열쇠다.<br>주말에 운동할 때에 종종 사용했었는데,<br>얼마전에 사용하려고 했더니<br>열쇠도 열쇠구멍에 껴지고 돌아가는데<br>그래도 문은 열리지 않는다.<br>앗.. 문에 카드키가 새롭게 장착되어<br>문 위에 자석이 쩍 달라붙어 문이 열리지 않는다.<br>내 열쇠가 틀린것은 아닌데<br>열쇠는 맞는 열쇠인데<br>그래도 문을 열수는 없다.<br>갑자기 여러 생각이 든다<br>혹시 아직도 이전의 열쇠를 가지고<br>왜 안 열리지 하고 당황하며 문을 열려고 하는 모습..<br>세상이 빠르게 변하고 있다.<br>사람들의 가치관이 변해간다.<br>한반도의 관계가 변하고<br>동아시아 관계가 바뀌고<br>전 세계의 흐름이 급속도로 변하고 있다.<br>기술이 변하고<br>교육환경이 변하고<br>교회가 바뀌고<br>언론이 바뀌고<br>다음 세대가 바뀌고 있다.<br>이전에 먹히던 방법이 이제는 안 먹힐 수 있다.<br>방법이 틀린것은 아닌데<br>그동안 잘 써오던 방법인데<br>이제는 통하지 않는다.<br>만약에 자신이 무언가를 여는 열쇠라고 생각한다면<br>혹은 자신이 무언가를 여는 열쇠를 가지고 있는<br>사람이라고 생각한다면,<br>아직도 쓰임받고 싶다면, 빨리 바뀌어야 한다.<br>그런데,<br>내가 가지고 있는 열쇠를 가지고<br>카드키로 바뀐 문을 열수는 없지만<br>그 문을 카드키 만으로는 열수 없도록 잠글 수는 있다.<br>불시착 한 비행기에서<br>짐을 빼겠다고 길을 막아서 사망자를 늘린 사람처럼<br>너를 성공시킬 수는 없지만,<br>성공을 못하게 막을 수는 있다고 협박하는 꼰대처럼<br>정신 못 차리면,<br>어느새, 우리는 문을 막아서는 사람이 될 수 있다.<br>정신차려야 한다<br>깨어나야 한다.<br>아직 정신 못차리고, 깨어있지 못한 내가 할 말은 아니지만,ㅠㅠ</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02hmcQVAYA5hupnAGyempcfPH59FSm3L4qgd3ZbVcwaeu6AX94tSSDVX3nbMDD86Tvl?__cft__[0]=AZW0kzL6gVOLy4_8OdfVeWxMtcruQfhDqj1zzl69qVKebAH97XAPW6DWaSfLebVOIsbibFnkURoKG6_6_29kgdzvceAElANtY1wUqKrlZ_QLL_PfHaD9x-jZ3pk7tBdW0EVq2Hle-Lm1_sKghwQebJOtmKBCIqiLDTDw-epj_2fBWA&__tn__=%2CO%2CP-R", "images": ["pdf5_page67_img0.jpeg"]}, {"id": 174, "date": "2019년 10월 17일", "year": 2019, "title": "행복을 추구하는 삶...", "themes": [6, 10], "content_html": "<p>행복을 추구하는 삶...<br>\"난 행복하지 않지만<br>행복한 사람을 만나면<br>나도 행복해 질 것이다.\"<br>이건 일어나기 어려운 일이다.<br>만약 이런 관점에서 바라보면<br>내가 행복하지 않은 이유는<br>행복한 사람을<br>혹은 나를 행복하게 해 줄 사람을<br>아직 만나지 않았기 때문이다.<br>혹은 주변에 행복한 사람을 보면서<br>나의 불행이 더욱 커 보이기도 한다.<br>이런 관점은<br>자신이 행복하지 않은 원인을<br>다른 사람과 환경 탓으로 돌리게 한다.<br>그리곤 결국 다른 사람을 질투 혹은 시기하거나<br>자기 연민, 자기 비하에 빠지게 한다.<br>과연 행복한 삶은 어떤 삶일까?<br>순간 순간 행복을 느끼는 삶일까?<br>행복한 삶을 추구한다는 삶은 어떤 것일까?<br>일단 '행복' 영어로 Happiness 의 어원은<br>Luck, by chance 이다.<br>다른 말로 행복은 해프닝이다.<br>순간 행복하다고 느낄 수 있지만<br>순간 불행하다고 느낄 수도 있다.<br>나를 행복하게 느끼게 하는 그 무엇이<br>다음 순간 나를 불행하게 만들 수도 있다.<br>반면에,<br>축복받은 사람이<br>다른 축복받은 사람을 만나면<br>주위 사람까지 축복받게 만든다.<br>여기 '축복' 이란 말은<br>좀 기복 (복을 추구하는) 적 표현처럼 보이지만<br>사실 축복의 영어 단어 Bless 의 어원은<br>Bleed (피흘림) 이다.<br>진정한 축복은 Bleeding (희생) 에서 온다.<br>내가 bleed 해서 다른 사람이 blessing 을 받는 것이다.<br>나의 bleeding 이 다른 이들의 blessing 이 될 때에<br>이는 나에게 또한 blessing 이 된다.<br>나의 happiness 가 아닌<br>나의 bleeding 을 통해서<br>상대방의 Blessing 을 추구하는 삶<br>이런 삶이 가득한 공동체는<br>그곳이 바로 천국이 되는 것이다.<br>다른 사람의 bleeding 을 통해<br>나의 happiness 를 추구하는 삶<br>이람 사람이 모인 공동체는<br>바로 지옥이 되는 것이다.<br>먼저 피흘릴 줄 알아야 한다.<br>스스로가 먼저 희생할 줄 알아야 한다.<br>바로 이게 십자가의 길이다.<br>때론, 오해를 받더라도<br>상대방의 값싼 happiness 보다<br>상대방의 blessing 을 추구해야 할 때도 있다.<br>아들 기현이를 happy 하게 하는 것은<br>게임을 하루 종일 하게 하는 것이다.<br>그러나, 이건 기현이에게도 나에게도 blessing 이 아니다.<br>앞날의 blessing 을 위해<br>지금의 happiness 를 미뤄야 할 수도 있다.<br>쉽지 않은 길<br>하지만 복된길...<br>나도 잘 못가는 길이지만<br>주저리 주저리 적어 본다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0iuTynbYRKkGJYr2q4F2htPpkt8X32dqtsVBAZwLg3q93bYcBA8QQEsCHMHGa3wf1l?__cft__[0]=AZVa4a_0eFzDg5hhkTdV68cK0v3agS-R7N_LRGVChXs18KN8yPFE3LdaT6SHqyS35PQB6U6HSVTSap7Sl3krv-wJMLAz9cdTjvZdCuwsS2u0TjSJ9-XtbC8sMH8q_ws8CtfoMqqtGNgJm9B1MEOc1yBn&__tn__=%2CO%2CP-R"}, {"id": 175, "date": "2019년 11월 10일", "year": 2019, "title": "자신의 모든 것을 바쳐", "themes": [8, 9], "content_html": "<p>자신의 모든 것을 바쳐<br>제자들을 키웠는데..<br>그 제자가 자신의 아내를 살해했다.<br>아~. 평생 함께 해온 아내를<br>제자들에게 잃은<br>그 마음이 어땠을까?<br>자신을 낳아 키워준 엄마를 죽인 사람들을<br>진심으로 용서할 수 있었을까?<br>연세대학교를 설립한<br>Horace Underwood 박사님의 아들<br>원한경 박사님과<br>그 아들 원일한 박사님의 이야기다.<br>1949년 3월 17일,<br>좌익 청년들의 총부리에 원한경 선교사님의 아내<br>에델 와그너 언더우드 선교사님은 세상을 뜨셨다.<br>\"20여명의 교수 부인들이<br>집에서 이야기를 나누고 있을 때<br>누군가 초인종을 눌렀다.<br>어머니가 현관문을 열고 보니 한 청년이 있었다. 청년은 무조건 방 안으로 들어가겠다고 우겼고,<br>옥신 각신 했다. 소란한 틈을 타 또 한 명이 어느새 뒷문으로 들어와 어머니를 향해 뒤에서 총을<br>쏘았다. 어머니는 백낙준 총장 부인의 차로 세브란스로 옮기는 도중 운명하고 말았다<br>(1982년 원일한 신문연재 회고 중)<br>에델 선교사를 살해한 젊은이들은<br>연희대학 (연희전문후신) 민주학력위 위원장등<br>좌익 간부 3명의 짓이었다.<br>1949년 당시는 암살의 해라고 할 만큼<br>김구 선생님을 포함해서 많은 분들이 암살로 돌아가셨다.<br>그리고, 그 때부터 한 반도,<br>특히 우리 남한 속에서의 좌우-대립은<br>극에 달하였고,<br>급기야 6.25가 일어나게 되었다.<br>그런데,<br>그 와중에 원한경 박사님은<br>사형 선고를 받은 자신의 아내를<br>살해한 자들을 용서하고<br>과도한 수사와 강압 수사를 하지말라고 하면서<br>자신의 아내를 죽인 자들의 구명운동을 한다.<br>이후<br>원한경 박사는 홀몸으로<br>6.25 당시 부산으로 피난을 가<br>연희전문의 전시 캠퍼스를 부산에서 준비하고<br>제주도로 고아원을 옮기는 일에 힘쓰다가..<br>무리하셨던 것일까..<br>심장마비로 돌아가신다.<br>많은 언더우드 가문의 분들이<br>한국에 와서 선교활동을 하셨지만,<br>순교의 첫 제물은 '에델' 선교사님이었다.<br>그리고, 얼마후 남편 원한경 박사님 역시 어쩌면<br>조선인 보다 더 조선을 사랑하신다는 말씀을 실천하시다 하나님의 부르심을 받는다.<br>최근 우리 나라 국민들이 좌-우로 나뉘어<br>서로 총질은 아니지만,<br>미워하고 증오하는 것을 보면서.<br>심지어는 교회에서도<br>서로를 이해하고 품기 보다는<br>정죄하고 단죄하고 욕하는 것을 보면서...<br>혹시, 우리가 하나님 보다 더 두려워하는<br>그 무엇이 있는 것은 아닌가?<br>되돌아 보게 된다.<br>에델 선교사님의 아드님이신<br>원일한 선교사님은<br>그 집과 주변 1만평의 땅을<br>연세대학교에 기증한다.<br>그 땅위에<br>생과대학과<br>이과대학이 세워졌다.<br>2004년 원일한 박사님은 하늘의 부르심을 받는다.<br>그리고 언더우드 가문은 모든 소유권을<br>연세대학교에 이전시키고,<br>미국으로 돌아가신다.<br>현재는 원한석 이사님만 한국에 계신다.<br>어느덧,<br>올해는 에델 선교사님께서 순교하신지<br>70주년이 되었다.<br>누군가는 선교사님의 순교의 피를 기억하며<br>예수님께서 피흘리신 십자가를 기억하며<br>대한 민국과 한반도를 위한<br>하나님의 온전하신 뜻이<br>무엇인지를 구하며<br>기도하는 사람이 있어야 하지 않을까?<br>좌로나 우로나 치우치지 아니하고<br>그저 하나님의 얼굴을 구하고,<br>우리의 죄를 자복하며,<br>주의 은혜를 구하는 모임이 있으면 좋겠다.<br>에델 선교사님께서 순교하신<br>연세대학교 생활과학대학 옆에 위치한<br>언더우드 생가의 다락방에서<br>소수지만 모여 기도하려고 한다.<br>오셔서 정치이야기 할 분들이 아닌<br>이 나라를 향한 주님의 뜻을 함께 구하며<br>겸손히 예배하고 기도할 분들.<br>그런 뜻이 있으신 분들은 함께 하면 좋겠다.<br>장소가 비좁아 약 50분 정도만<br>함께 하실 수 있을 것 같다.<br>연세대학교 학생들, 교수님들,<br>지역에서 교회를 섬기시는 분들<br>그리고, 그냥 함께 기도하고 싶으신 분들은<br>오시면 될 것 같다.<br>장소: 언더우드 생가<br>시간: 11월 11일 오후 6시-8시30분<br>찬양 예배섬김: 부흥한국, 더 하트 하우스</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0A3rnfUp43M9xLMTuW4TmEu7XzUd1M67GwrTnQqgQKrhs5EdkJZzBRPFc3UQK1yezl?__cft__[0]=AZWwnJBFcUZuibfTKDqVRYJeqyyZDUTQ3K_M_RVdtW5Y1fBuNYPzYf9SnocTHDNNMh-Kn-N0_WJ0PxSCOHskDuk4miFQEiTvEVyVEPO-IPFElTp8RzXNLdH0VB-KonY7NIOTFJb_wVxfEOCj3CrpdhCP&__tn__=%2CO%2CP-R"}, {"id": 176, "date": "2019년 11월 29일", "year": 2019, "title": "난 50 이다. 그리고 난 지금 제일 쌩쌩하다 .", "themes": [14, 3, 4, 5], "content_html": "<p>\"I am 50 and I am peaking\"<br>That is what I would like to say.<br>난 50 이다. 그리고 난 지금 제일 쌩쌩하다.<br>이렇게 이야기 하고 싶지만,<br>However, the reality is<br>\"I am 50 and I am degrading\"<br>현실은 나이 오십에 몸은 낡아가고 있다는 것이다.<br>마흔 아홉번째 맞이하는 생일날...<br>썩지도 않은 이빨을, 잇몸속에 염증이 심해 발치를 했다.<br>그런데, 그 이빨이 어금니다...<br>임플랜트를 두 개나 해야 한다고 한다.<br>이전 같으면 틀니를 해 넣어야 하는 거다.<br>난 임플랜트, 틀니..<br>이건 노인만 하는 건줄 알았는데..<br>아니. 나도 노인이 되어가는 중이다.<br>요새는 급격히 노안이 와서<br>컴퓨터 스크린을 볼때는 안경을 써야 하고<br>눈 앞에 책을 볼 때에는 안경을 벗어야 한다.<br>노안이 훅 와버렸다.<br>곧 돋보기도 필요하겠지..<br>어깨가 아프다.<br>이전 같으면, 운동하고 스트레칭 하면 나았는데<br>벌써 1년 이상 고질이다.<br>어깨도 맛이가기 시작했다.<br>눈가의 주름은 점점 깊어가고<br>눈밑에 쳐진 살은 점점 두꺼워져 가고<br>내 허리를 둘러싼 뱃살은 점점 중력을 이기지 못한다.<br>이렇게 늙어가나 보다.<br>이빨을 빼야하나 말아야 하나<br>나보다 한살 많은 치과의사 처남과 상의를 하니<br>이제 이빨 부터 시작해서 하나 하나 보내는 연습을 하란다.<br>인생 50줄에 들어서서<br>지금까지 모으는 연습을 했다면<br>이제는 보내는 연습을 해야 하나 보다.<br>사랑하는 아들이 3천원짜리<br>아이스크림 케익을 만들어 줬다.<br>ㅋㅋ 맨날 혼자 뭘 만드는걸 좋아한다.<br>없는 것을 바라보고 부러워하고<br>채워지지 못할 것을 채우려 노력하기 보다<br>가지고 있는 것에 감사하고<br>소중한 사람들과 나를 사랑해 주는 사람들과<br>더 많은 시간을 보내야 겠다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid021vQ3dLipqdo5hD7FXphhGWmDGjGtKAxfHL99HEoUQURiKJiCF5VBXm1syHCV24ZSl?__cft__[0]=AZXXJPcGJJL6nTVprNngLCzacZnJ1psK7uarh8xHbybfPr2bOJRrjZvPb-fHb_sTflrO7MdS8xzklr6GBGEDFkE6XBGNX61AIF1O6lEV55MHewQ92YX1ZjohKRvuS03_EFjVuFOsuXXf7WmlCXt2RlO6zpiP41rflxrvA4IQyAFHNg&__tn__=%2CO%2CP-R", "images": ["pdf5_page20_img0.jpeg"]}, {"id": 177, "date": "2020년 3월 4일", "year": 2020, "title": "코로나 때문에 여러분들이 고생하고 계시지만 ,", "themes": [9, 10, 1, 6], "content_html": "<p>코로나 때문에 여러분들이 고생하고 계시지만,<br>상대적으로 언급이 많이 안되는 분들은<br>자영업 하시는 분들입니다.<br>물론, 소 상점에서 일하시다가<br>최근 일자리를 잃으신 분들 역시<br>매우 힘드실 것으로 생각이 듭니다.<br>저 역시 대학원 생활을 하던 2001년 부터<br>캐나다 알버타에서 카페를 직접 운영을 했었습니다.<br>혼자는 아니었고, 제 인생의 선물 같은 몇 분과 함께 했지요.<br>주인이 직접 가게에서 인건비를 줄이며<br>여러모로 신경을 쓰면서 운영을 해도 될까 말까인데<br>저는 대학원생, 동업자들은 신학생, 회계사,<br>또 한 동업자는 피치 못할 사정으로 한국으로 돌아간 상태<br>결국 제가 아침에 빵 픽업하고, 커피 준비하고 학교에 갔지요.<br>그러다, 알바생들이 재료 떨어졌다고 하면 사다 주며..<br>이렇게 운영을 하니 운영이 어려웠지요.<br>특히 겨울에 영하 20도 미만으로 내려갈 때면..ㅠㅠ ㅠ<br>알바생 인건비와 밀린 월세를 내기 위해<br>밤에 결산을 하면서 제 신용카드를 긁어 간간히 운영을 했지요.<br>언젠가는 좋아지겠지 하는 마음으로... (나의 카드 빚은 그렇게 늘었지요)<br>코로나로 주변 식당들에 사람이 없고,<br>식당을 운영하는 친구의 하소연을 보면서<br>옛날 제 생각이 나더라고요.<br>그러다 생각했습니다.<br>식당에서 소비를 권유하는 것은,<br>식당을 생각하면 좋겠지만,<br>실제로 식당에 많은 사람들이 모이면,<br>코로나 바이러스의 확산을 막는데는 좋은 생각이 아니고.<br>(사실 식당에 가도 저 밖에 없는 경우가 있어서 오히려 안전하다고 생각을 하기도 했지만요)<br>고민하다,<br>앗. '선 결제를 해주자'<br>내가 지금 못 가지만,<br>나중에 그곳에서 식사를 할 생각으로<br>지금 결제를 하고, 실제 식당 이용은<br>나중에 코로나가 잠잠해지면 하면 되겠다.<br>이런 생각으로 식당을 운영하는 친구와 이야기 했더니<br>큰 도움이 되겠다고 하네요.<br>정말 적은 도움 이지만,<br>자영업을 하는 분들에게 조금이라도 도움이 되면 좋겠습니다.<br>주변에 식당을 운영하시는 분들이 매우 힘들어 하고 있습니다.<br>자칫하면, 코로나가 끝나고 우리가 좋아 하는 식당에 식사를 하러 갔을 때에, 그 식당이 경영난<br>으로 문이 닫혔을 수도 있습니다.<br>혹시라도 여유가 있으신 분들은<br>식당에 가서 '선결제'해 주세요.<br>가뭄에 단비 같은 도움이 될 것 같습니다.<br>물론 개인적으로 하실 수도 있고요.<br>혹시, 시도 관계자 분들에게 영향력을 줄 수 있는 분들은<br>이것을 '시'와 '도' 차원에서 진행해 주세요.<br>시도 정부차원에서<br>이런 시스템을 원하는 식당은 신청을 받고<br>선결제를 원하는 분들에게 업체를 안내해 주고<br>이렇게 선 결제를 하는 분들에게는 시도 차원에서 10% 혹은 20% 쿠폰을 제공해 주고. 혹시라<br>도, 문닫는 식당 때문에 선결제 한 분들이 피해를 보지 않도록 시도에서 보증해 주고.<br>코로나 바이러스 고통 분담 쿠폰 시스템을 하면 어떨까요?<br>그냥, 뭐라도 도움이 되고 싶어서 생각한<br>'푸념' 같은 이야기지만,<br>고통 받는 우리의 이웃에게<br>여러분의 작은 움직임은<br>큰 위로와 도움이 될 수도 있습니다.<br>#연대서문레몬꽃분식</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid07ZbKykomfdH77B7QGgs2MBhUvatEd9C774vtRxvANVJboU6hKdnzCSMUj51uBy19l?__cft__[0]=AZUUPRJu9PhHsnc8LUf4vRy9OuGXAfIqccQaXN8xyjv6E-V9sitUeTZ0WlimA74ZC1_VHTv23CR5cHw4tPBuUqVYbkPS27_KssFW8ID7LkUtGUSOqi5oxcGHyDY6S8P7bI-zlmF4nL8mv1KxXHFAmeJr&__tn__=%2CO%2CP-R"}, {"id": 178, "date": "2020년 5월 4일", "year": 2020, "title": "문득 이전에 힘들었던 일이 생각이 난다.", "themes": [1, 13, 6, 8], "content_html": "<p>문득 이전에 힘들었던 일이 생각이 난다.<br>미국에서 연구년 하고 있을 때<br>은행에서 잔고 50불 미만이라고<br>경고성 이메일 계속 날라오고<br>아들 학원비날은 다가오고<br>하는 건 논문 쓰는게 일인데,<br>13번 연속 논문 Rejection<br>거의 우울증 수준으로 힘들 때<br>멍하니<br>내가 일하는 건물을 바라보며<br>슬슬 주위 사람을<br>그리고<br>하나님을 원망하기 시작할 때,<br>문득 머리를 띵 하고 때리는 소리<br>\"그게 그렇게 불만이면<br>내가 다시 가져갈까?\"<br>앗.<br>내 불만의 근원인<br>\"자녀\"<br>\"직장\"<br>\"거주지\"<br>\"연구 기회\"<br>\"학생\"<br>ㅋㅋ<br>이거 없으면 인생이 무슨 의미가 있지?<br>사실<br>불평하고<br>원망하고<br>짜증나게 한<br>그것들은<br>다<br>감사의 제목이었다.<br>위 사건이 있고<br>9년이 흘렀다<br>나는 또<br>원망하고 있고,<br>불만에 가득 차 있고<br>기쁨은 없다.<br>그럼에도 불구하고<br>감사할 수 있는<br>그럼에도 불구하고<br>마음에 여유를 가지고 웃을 수 있는<br>그런 믿음이 생겨나길<br>기도한다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0X6PetVjHVqjRmKJqYf1ikZeziiQmMpZH5HD5cE9aFJtMYcLntrZAnc2JJoiSoZNnl?__cft__[0]=AZVocxCspYTpH8UFdKbTlEOV8KvheQu7UN516uk9jPRTRs1tXygtlMzPHal2_LDrKdMdA3_X2AjPpUALtfEqnWU9lyS_iq7oWul5sxtT43mpQH3eXiqN1awMjXlfi1VPIVMmVHSSipz1NiSRtZHRp97h&__tn__=%2CO%2CP-R"}, {"id": 179, "date": "2020년 5월 16일", "year": 2020, "title": "하나님께서 우리에게 허락하신 최고의 선물은", "themes": [8, 6, 16, 4], "content_html": "<p>하나님께서 우리에게 허락하신 최고의 선물은<br>두 번 생각 할 것도 없이 '가족' 이라는 생각이 듭니다.<br>The most precious gift of God,<br>without second thought, is Family.<br>작년부터 4기 암 투병중이신 장인어른과<br>장인어른을 병간호하시는 어머님을<br>어떻게 하면 더 자주 뵙고, 격려해 드릴까 고민하다<br>Our family members (my wife side) were thinking<br>how we can encourage<br>my father in law, Rev. Yon Jae Kim<br>and my mother in law, Kyoung Sook Kim<br>3월 20일 부터 매주 주일 예배를 가족들이 함께 줌으로 드리네요. 이번 주면 벌써 9번째가 되고<br>요<br>So we decided to worhip together via. ZOOM.<br>This week is our 9th service.<br>캘거리에서, 아보스포드에서, 토론토에서, 대전에서, 서울에서.. 2개국 5개 도시에서 3대가 함께<br>예배를 드리는 것이,<br>처음에는 어색했는데, 이제는 그 시간이 기다려 집니다.<br>From Calgary, Abbotsford, Toronto, Daejeon, Seoul, five cities from two different<br>countries. It was a biq awkward at the beginning, but now we are looking forward<br>to this time.<br>아버님께서 마치 마지막 메시지 같이 자녀 손에게 말씀을 전해주시기도 하시고, 때론 어린 손녀<br>와 손자가 말씀 묵상과 기도를 나누기도 하고.<br>Sometime, father in law delivered message like it is his last words for his children,<br>sometime, little girls and boys share their devotion and also prayer...<br>아버님께서 언제까지 이 세상에 계실지 아무도 모르지만,<br>이렇게 삼대가 함께 말씀과 찬양을 기도를 나누다 보니,<br>놀라운 하나님의 축복이라는 생각이 듭니다.<br>하나님께서 코로나를 통해서 우리에게 주신 새로운 선물<br>(물론 코로나 자체는 선물이 아니지만요)<br>We never know how long my father in law will live,<br>as we worship together with all family members from different cities, very young,<br>young and old.<br>We realize that this time too is gift of God.<br>코로나 때문에 밖에도 못 나가시는<br>병마 (담도암 4기)와 싸우시는 아버님 (김연재 목사님)과<br>아버님을 병간호 하시며 많이 힘이 드실 어머님께<br>혹시 격려의 메시지와 안부의 메시지를 보내주실 분들은<br>Yonjaekim0725@gmail.com 보내주시면 좋을 것 같습니다.<br>If any of you know Pastor Yon Jae and Kyoung Sook Kim, and would like to<br>encourage<br>them,<br>or<br>just<br>say<br>few<br>words,<br>please<br>e-mail<br>them<br>at<br>Yonjaekim0725@gmail.com<br>코로나로 인해 여러가지로 어렵지만<br>더 많은 시간을 가족과 보내는 요즘<br>더 많이 사랑한다고 이야기 하면 좋겠네요.<br>Due to Cov-19, we all are going through hard time,<br>we get to spend more time with family members<br>let's make them more quality time,</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0ajiJcf9BtmqjCxsQhsx9HV2gXZonD4S5Fo9o1Sn7A5BLXkE9gPW3p5xsEoUutqqPl?__cft__[0]=AZUsufbzf5QoMwRV94PTUgwW_GCv-5nQBOaZCd97Ks1fO3bymxxwFrlECHSg-eoiiipXJKkwUMXIL_yZhFtZ-fE3Sdcl02KyxYravBKaAwz7mssVV0xC6dASuVkLCgriAyBEVlfOi0NWODcRcIjhXWY5udB-Gw2Al-3pWYMmux0sZg&__tn__=%2CO%2CP-R", "images": ["pdf6_page5_img0.jpeg"]}, {"id": 180, "date": "2020년 8월 29일", "year": 2020, "title": "미국의 어떤 사업가가", "themes": [4, 6, 8, 14], "content_html": "<p>미국의 어떤 사업가가<br>멕시코 해안가 작은 마을의 부두를 찾아갔다.<br>거기서 그는 혼자서 부두에 배를 댄 어부를 만났다.<br>작은 배 안에는 커다란 황다랑어 (참치)<br>몇 마리가 있었다.<br>미국인은 어부에게<br>좋은 물고기를 잡았다고 칭찬하면서<br>물고기를 잡는데 시간이 얼마나 걸렸냐고 물었다.<br>어부는 별로 오래 걸리지 않았다고 대답했다.<br>그러자 미국인은 멕시코 어부에게<br>그럼 나머지 시간은 어떻게 보내느냐고 물었다.<br>“늦게까지 자다가 물고기 좀 잡고<br>아이들이랑 놀기도 하고<br>아내와 이런 저런 얘기도 합니다.<br>저녁마다 동네에 산책을 나갔다가<br>친구들과 와인도 마시고 기타도 치고요<br>하루 종일 바쁘게 살죠\"<br>어부의 말을 들은 미국인은 이렇게 말했다.<br>“전 MBA 를 나왔습니다.<br>제가 당신을 도울 수 있습니다.<br>지금 보다 더 시간을 들여<br>물고기를 잡아야 합니다.<br>그리고 물고기를 판 돈으로 큰 배를 사세요.<br>더 많은 물고기를 잡아,<br>그렇게 번 돈으로 배를 몇 척 더 살 수 있습니다.<br>결국 선단을 갖게 되겠지요.<br>또한 잡은 물고기를 중간 상인에게 팔지 말고<br>가공업자에게 직접 팔면<br>통조림 공장까지 열 수 있습니다.<br>당신은 생산, 가공, 판매를<br>모두 감독하게 되는 셈입니다.”<br>미국인은 쉬지 않고 말을 이어갔다.<br>“당신은 곧 이 작은 마을을 떠나야 할 겁니다.<br>멕시코 시티로 이사를 가고,<br>어쩌면 로스엔젤레스로 가게 될지도 모릅니다.<br>대도시에서 번창하는 당신의 기업을 운영하는 거죠.<br>그러자 멕시코 어부는 물었다.<br>“그 모든 일을 하는데 얼마나 걸릴까요?”<br>“15년에서 20년즘 걸리겠죠.”<br>“그런데 그 다음엔 뭐가 있죠?”<br>“그 다음이 진짜입니다.<br>때가 되면 회사를 상장할 수 있습니다.<br>그럼 당신은 아주 부자가 될 겁니다.<br>수백만 달러는 족히 벌겠죠!”<br>“수백만 달러라고요? 그럼 그 다음은요?”<br>멕시코 어부의 물음에 미국인은 흥분된 목소리로 이렇게 말했다.<br>“그 땐 은퇴해야겠죠.<br>조그만 어촌마을로 옮겨가서 늦게까지 자다가<br>물고리도 좀 잡고 아이들과 놀기도 하고<br>아내와 시간을 보내는 겁니다.<br>밤에는 마을까지 산책을 나갈 수도 있습니다.<br>거기서 친구들과 와인도 마시며 기타도 칠 수 있습니다.”<br>“이 이야기는 How Adam Smith can change your life 한글 내 안에서 나를 만드는 것들<br>p.130-131” 에 나오는 이야기다.<br>내가 처한 지금 상황 속에서<br>만족과 행복을 찾지 못하면<br>우리는 아무리 형편이 좋아진 들<br>만족하고 행복하기 어려울 것이다.<br>오늘 하루 감사의 이유,<br>만족의 이유, 행복의 이유를 찾아보자.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02X8FFVV2C1aqAPPkMkt9dkmLwFVUihUCFua9tsRP4j5r4Wjf2YU4KPRfHJhXU1Tkfl?__cft__[0]=AZW1kl1BPXLpXtw03BMv0z9K0dRbpopo00xVvsyB65asea5IwNal61PQ8cfCD8RVWlKzLb83IG8_66JkCSp6sxMniYOAw_8M_Bp6uXDXC8DnSgTahBm7SJBWRhvDYYRZXU8gqRpSPFb7K-XT0E3503XN&__tn__=%2CO%2CP-R"}, {"id": 181, "date": "2020년 9월 22일", "year": 2020, "title": "미선정", "themes": [13, 6], "content_html": "<p>미선정<br>미선정<br>미선정<br>미선정<br>미선정<br>연구년 다녀와서 열심히 연구하고,<br>강의하며 연구비를 신청해 보지만<br>결과는<br>5연속 '미선정'<br>아니다. 개별과제 2개 더~.<br>개별과제 7연속 미선정<br>언젠가는 '선정' 이 되겠지?<br>그래도,<br>연구원들 학비는 줄 수 있는 연구비와 장학금이 있는게<br>얼마나 감사하고 다행인지 모르겠다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02CPVndyHyeRxdVCFE2H4k244V49Aj1NFcS5Leuthv8GFRSsVpMyhZCEuj2Fk1dGM6l?__cft__[0]=AZXnmEz_oxkUcom4QrwOvjptAJ_3KkAsSjTI-l5ezNyIoDavTBLzNvbeTP-m_PdaUpR6dMhnDGFu0T04meF5wwnqqbWq49wErc_9fOyAvdLLi2SCFEGCHRmNc38FCY3yRTcgce1QMERQH3vQ_zv2hUkpZ7BfQwgdCFG1yx2fP8T3xQ&__tn__=%2CO%2CP-R", "images": ["pdf6_page8_img2.jpeg"]}, {"id": 182, "date": "2020년 11월 14일", "year": 2020, "title": "토요일 오전", "themes": [13, 9, 5], "content_html": "<p>토요일 오전<br>학교에 나와서<br>전화기 산 댓가로 받은 사은품으로<br>몸에 안 좋다는 라면을 끓여 먹으며<br>대학원생 논문을 봐 주다가<br>문득 도대체 난 언제<br>내 이름으로 된 첫 논문을 낸 걸까<br>생각해서 찾아 봤다.<br>내 이름이 중간저자로라도 들어간 논문은<br>석사를 시작한 95년으로부터<br>무려 4년이 지난 99년<br>그리고, 1저자로 논문을 개제한 것은<br>석사 시작 7년, 그리고 박사 시작 4년이 지난 2002년이다.<br>다들 2년이면 끝난다는 석사를 난 3년을 했고,<br>다들 4년이면 끝난다는 박사를 난 5년을 했다.<br>요즘 1저자 (한글 영어 포함) 논문을 3개를 발표 못하면<br>박사 프로포졸도 못한다는 그런 기준이<br>나에게 적용되었다면,<br>난 아직도 졸업을 못 했을 것 같다.<br>우리 학생들에게 논문 쓰기를 은근이 압박하고<br>또, 왜 이렇게 늦냐고 뭐라 하다 보니,<br>난 뭐.. ㅠㅠ<br>좀 늦어도 괜찮아~~ 라고 이야기를 해 주다가도<br>혹시 우리 학생들이 밖에 나아가 경쟁에 밀리면 어떻게 하나<br>걱정이 되기도 한다.<br>결국, 내가 더 꼼꼼히 그리고 빨리 빨리 지도해 줘야 하는데...</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid09YhZTNJEAbqzRRRDMspW9HMy95bfKN7yakiCfP4nRmWcC6qu9Wbmkr2Z6Ccx2rV4l?__cft__[0]=AZUURFhIkTLo3_ZE5tXxMoJX7GZwyUoJ2Lsbv9QGlk_GKOiWgk48LAwnlgqKOLPLvxu2-Ve-Lj9FWkUVNIpfsGwzyk3BkeCrS4gXdIayGwxNRwfuv2JzAT-MvpwBjgzK5I_4Ry8yVMWw-XwkJjXyG45Kvy1fogBoPWQaZJmxOvlkBA&__tn__=%2CO%2CP-R", "images": ["pdf6_page10_img0.jpeg"]}, {"id": 183, "date": "2021년 1월 22일", "year": 2021, "title": "2015년 MOU 채결,", "themes": [9, 5, 6, 12], "content_html": "<p>2015년 MOU 채결,<br>그리고 이어<br>2016 년 알버타 대학과 박사학위 공동학위제 시작<br>수많은 미팅과 회의들,<br>그리고 그보다 100배 더 많은<br>이메일들의 산물로<br>그리고 무엇보다 전성범 박사 (이철원교수님 지도) 의 노력으로<br>제 1호 연세대학교-알버타 대학교 박사가 탄생했습니다.<br>많은 대학이 공동학위제를 시행한다고는 하지만<br>실제 공동 학위 박사 (양교에서 모두 박사 취득)를<br>획득한 사람은 많지 않은 것 같아요.<br>그리고, 그 이유를 알겠어요~^^<br>앞으로 양교가 더욱 노력하여 2호 3호 공동학위제<br>박사가 나오길 바래 봅니다.<br>한번도 어려운 박사학위 디펜스를<br>2번이나 해낸 자랑스런 전성범 박사..<br>양교를 합치면 5시간동안 디펜스..<br>전성범박사 축하해요~</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid066qzvV8fFRKLGpZQYLyAjPbqozzNCf6srn5eU1bJSgkF5Nd91UYDWSUNxEsMsYeVl?__cft__[0]=AZVsVW1Vmmz2isaei9j0PLbWziOdxJDCHKtrH2MtCK_N7_BvwwW6AW9NK-9kOazqH4BN6fR1ZLcKBHVCmM0A3w13h33CQ7wIxFnhMvDMZqKjA2XBcHSRlWO-8kAa8VL3HhNladj2zbc_ZZwIvWJeGePmIWQbHFsQnX8QF2Y67w0voQ&__tn__=%2CO%2CP-R", "images": ["pdf6_page11_img0.jpeg"]}, {"id": 184, "date": "2021년 2월 14일", "year": 2021, "title": "11 월에 시작한 연구비 작성이", "themes": [13], "content_html": "<p>11 월에 시작한 연구비 작성이<br>아직도 끝이 나지 않는다.<br>지지난주 발표 평가 1개<br>지난 주 발표 평가 1개<br>12월 제출 1개<br>지난 달 제출 2개<br>다음 주 제출 1개<br>다음 달 제출 2개<br>아직도 좋은 소식은 없다.<br>언젠간 되겠지~~^^<br>연구비를 쓰는 지난 2달동안<br>체중은 2.5킬로<br>안정시 심박수는 10정도는 올라간 듯.<br>지금까지<br>낙방한 연구비신청껀수는<br>조만간 100껀을 넘을 것 같다.<br>논문 낙방은 아마 곧 1000껀을 넘을듯<br>어쩌면 이미 넘었을 수도.......</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02G3an3YzJY5uon8Yptyxf7zRCmC4s9zFg6xrF1osDi8eXBZpLniCjrkhDNsJmYdWrl?__cft__[0]=AZVvikTh916Q1FrpoVWyzGNLacxqp3NBEjCtVnUfMOzJG6-6BnFTLa5eLi5GTbJ2ETLoAWYz5pYX1-H6C4oO-p53TuIdZEEXudCnmEfdIZrqL3OVna42Cbmp8RdH6k_wsFnwoOcoDuDaEiXFRY1iOWvk&__tn__=%2CO%2CP-R"}, {"id": 185, "date": "2021년 2월 21일", "year": 2021, "title": "\"난 주님앞에 한송이 꽃이 되고 싶다.", "themes": [8, 16], "content_html": "<p>\"난 주님앞에 한송이 꽃이 되고 싶다.<br>그것으로 만족이다.<br>(최인호의 마지막 산문집 “최인호의 인생” 을 인용)<br>말씀하시고,<br>캐나다 캘거리 시간 2월 20일 오후 3시 45분에<br>김경숙 사모님의 남편,<br>김진혁 (배상민), 김진석 (윤은지), 김진아 (전용관), 김요셉 (질리안) 의 아버지이자<br>조이, 제인, 주빌리, 한나, 기준, 기현, 에비, 미키 의 할아버지 이신<br>김연재 목사님께서 하늘나라로 가셨습니다.<br>2019년 8월 암을 진단받으시고<br>지난 약 19개월간 암과 투병하시면서도<br>믿음의 본을 보여주시며,<br>수 많은 날을 금식과 기도로<br>가족과 국가를 위해 기도하시던 아버님..<br>아버님의 은혜로<br>수많은 사람들이 하나님의 사랑을<br>그리고, 서로간의 사랑이 무엇인지를 알게되었습니다.<br>일제 강점기에 태어나시고<br>홀어머님을 모시고<br>경제적으로 어려워<br>가정교사를 하며 광주고를 졸업하시고<br>한신대를 졸업하신후<br>문익환 목사님의 교회에서 사역을 시작하시고<br>이후 잠시 미국 유학을 하신후<br>목포 남부 교회<br>광주 무돌교회<br>캐나다 한인장로교회<br>광주 아름다운교회<br>그리고 캐나다 안디옥 교회를 섬기시고<br>2006년 은퇴후<br>지난 15년간 평안히 주님을 섬기며<br>가족을 사랑하시며,<br>하나님 앞에 마지막 불꽃을 태우셨네요.<br>아버님의 마지막을 준비하며<br>지난 1년간 줌으로 예배하시며<br>마지막 말씀을 매주 설교를 통해 가족들에게 나누어 주시고<br>지난 12월 부터 여러 교인들과 줌으로 만나시어<br>작별인사를 하셨고,<br>지난 주일까지 함께 줌으로 예배를 드리시고<br>오늘 주일 오전 (한국시간) 하나님의 품에 안기셨습니다.<br>아버님 사랑합니다.<br>아버님 존경합니다.<br>아버님 그립습니다.<br>꼭 한달 전이네요.<br>아버님과 관련된 꿈을 적어 놓은 것으로<br>작별 인사를 대신합니다.<br>아버님<br>어제 꿈에 박찬호와 한 명의 일본 야구 선수가,<br>가진 힘을 모두 쏟으며 (정말 피를 철철흘릴정도로)<br>마지막 경기를 치르고,<br>멋지게 퇴장하는 모습을 보았습니다.<br>관중은 전혀 없었고,<br>그들의 유명세와는 전혀 상관없이<br>아무도 관심을 갖지 않는 상황,<br>심지어는 사진을 찍어주는 사람 조차 없어,<br>지나가는 사람중에 한 명을 붙잡아<br>사진들을 찍어달라고 하는 중이었어요.<br>하지만, 저들을 표정은<br>정말 마지막까지 최선을 다했고,<br>이제는 더이상 미련이 없는,<br>그래서 너무나 행복해하는 표정이었고,<br>난 저들과 함께 사진을 찍어야겠다는 생각에<br>성의 없이 사진을 찍으려는 사람의 손에서<br>핸드폰사진기를 전해 받아<br>저들의 모습을 찍어주다가<br>꿈에서 깨었습니다.<br>일어나서 출근을 하는데,<br>꿈에서 본 박찬호의 모습과<br>\"아버님\" 의 모습이 겹쳐 보였어요.<br>그리고, 아버님께서 29년 전쯤<br>제가 23살경에 해주셨던<br>설교 말씀이 떠올랐습니다.<br>[\"세상에 한 무명의 사람이 있었다.<br>아무도 알아주지는 않았지만,<br>한 작은 마을에 가서,<br>그곳에서 복음을 전하고,<br>사람들에게 하나님의 말씀을 가르치고,<br>그로 인해 그 작은 마을이 변했다면,<br>그 인생이 얼마나 값진 일인가?\".<br>우리 인생의 성공은<br>마지막 우리 인생의 싸움을 마치고<br>하나님 앞에 나아갔을 때에<br>하나님께로부터<br>\"잘했다 나의 충성된 종아\" 라는<br>이야기를 듣는 것이 아닌가? ]<br>아버님께서 들려주신 이 설교는<br>이후 저의 인생의 비전을 \"하나님께 기쁨이 되는 삶\"<br>그리고, 인생을 마무리 할 때에<br>\"잘했다 나의 충성된 종아\" 라는<br>말을 듣는 삶으로 바뀌게 하였습니다.<br>저는 감히 아버님께서 저라는<br>작은 마을에 찾아와 주시었고,<br>저에게 말씀을 가르쳐 주셨고,<br>어머님과 함께 제가 변할 수 있도록<br>기도해 주셨고,<br>삶으로 모범을 보여주셨습니다.<br>아버님과 함께 안디옥을 개척하고,<br>섬기고, 그리고 능력에 과분한 직분을 맡아<br>다른 이들을 가르치고 할 때에 실수도 많았지만,<br>항상 격려해 주시고 무엇보다 사랑해 주셔서<br>그 일들을 감당했던 것 같습니다.<br>2-3명 남짓한 교인들이<br>새벽기도를 참석할 때도,<br>어머님과 꾸준히 100명 이상의 교인들에게<br>설교하듯이 말씀을 준비해 주셨고,<br>그 말씀을 들으며 저는 자라났습니다.<br>그리고, 주일이면 교회 청소를 마치고<br>부엌을 확인하시고 불을 끄시고 나가시는<br>아버지와 어머님의 모습을 보며,<br>많은 청년들이 예수님의 모습을 보았지요.<br>그런데, 아버님 그리고 어머님,<br>아버님께서 설교하셨던<br>그 작은 마을 같은 사람들,<br>아버님과 어머님의 헌신과 기도로<br>변화된 사람들이,<br>이제 또 아버님과 어머님께 받은 사랑을<br>지금 다른 사람들이 있는 곳에서,<br>지금 있는 그 곳에서 나누고 있다는 것입니다.<br>아버님을 처음 만난 것이 1992년 1월이니,<br>이제 햇수로 30년이 되었네요.<br>지난 30년간 아주 가까운 곳에서<br>아버님을 지켜 봐온 아버님의 교인으로써,<br>그리고 사위로서,<br>제가 자신 있게 할 수 있는 말은,<br>제가 물론 이런 말을 할 수 있는 자격은 없지만,<br>\"잘했다. 나의 충성된 종아\" 라는 말을<br>하나님께서 하실 것이라는 확신이 있습니다.<br>아버님 감사합니다</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02muse6GbSLPMVya5ofMeDD3KAVgHLg8176yACb9L4LG4d5pMiFb191RmtJij3G8jnl?__cft__[0]=AZXgEDPyWvPtKiYKKjrujG5np8lQ7VDyOpuxIxsWlAa9L9wbO4OKCqp04_g_C4jHibH_ZGKQiYCMX22z--lT66qe7NDk7dlC0cUBrAFLtpc-b4a7PPzNztccqMEWaViT9uGPqsQEPwHY4CgyeY3ATwAZ3ny59e6Os6AHlWkttnlezQ&__tn__=%2CO%2CP-R", "images": ["pdf6_page17_img0.jpeg"]}, {"id": 186, "date": "2021년 3월 2일", "year": 2021, "title": "2021년 새 학기가 시작되었습니다 .", "themes": [9, 3, 4, 5], "content_html": "<p>2021년 새 학기가 시작되었습니다.<br>연세대학교에 교수로 와서 17번째 맞이하는 봄학기.<br>이번 학기의 콘셉은 '바보' 로 하려고 합니다.<br>As I start the new semester, 17th year at Yonsei,<br>the concept for this semester is \"dumb\"<br>연구비 마감을 맞추려 컴퓨터를 보며 식사를 하다<br>앞니가 봉변을 당했습니다.<br>I lost my front tooth, not watching what I was eating due to close deadline of my<br>grant proposal.<br>일반적으로 임플랜트는 발치를 하고,<br>다음 날 임시 치아를 넣어 주는데,<br>Normally, the dentist does something after taking it out,<br>but I am now without my front tooth for five days<br>여러 상황으로<br>거의 5일째 앞니 없이.<br>그리고 오늘 개강 첫 수업을 하게 되었습니다.<br>앞니가 없으니<br>보기만 우스운 것이 아니라<br>발음도 우스워 지네요ㅠㅠ<br>Front tooth isn't important just for look and biting<br>but it is for speech.<br>I cannot properly say \"F\" now.<br>특히 F 발음이...<br>앞니이 중요성을 여러모로 깨닫습니다.<br>한가지 좋은 점은<br>기분이 안 좋을 때마다<br>거울을 보면 우스워 진다는..<br>단점은, 사람들이 나를 우습게 본다는~^^.<br>특히 아들과 아내가..<br>One good thing about losing my front tooth<br>Making me giggle, when look at myself on a mirror<br>But, one downside is that my wife and my son scoff at me.<br>Have a good semester!<br>Have a good week!</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0ChWzGdixFo48zv3pzHDkYyoTAkm8AJV5g8HdrN2mYCMrAcQR7mAQLn1ovkayeAxul?__cft__[0]=AZX4fWoLczmu0chPCQg0rEubTUDsLHd9O9UScl8xBMWoyBTXPq35HQI3gX6SGyZmLZUkUNjUPSiU0sHQzHx2sslMbli2mjL9f66NltszZaC6P9c_krBMenKaboqZTCvWvatdv3qCg0ydTed2f1X2kBfl6ZxmzVjUVyMXb_pGju5Kag&__tn__=%2CO%2CP-R", "images": ["pdf6_page19_img0.jpeg"]}, {"id": 187, "date": "2021년 8월 18일", "year": 2021, "title": "학생들의 논문을 읽고 피드백을 주려고", "themes": [9, 13], "content_html": "<p>학생들의 논문을 읽고 피드백을 주려고<br>인쇄해서 카페이 나와 보니,<br>노안으로 작은 글씨가 안 보인다ㅠㅠ<br>슬슬 돋보기가 필요한 시기가 오나보다.<br>Trying to catch up providing feedback<br>for graduate students' manuscripts.<br>I ambitiously printed out all manuscripts<br>and set down at the cafe.<br>OH Nooooooooooooo<br>Unable to read them clearly,<br>old age is hitting me.<br>Soon, I will need magnifying glasses.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02psDyiFmpwtT8FLmunkuaRFHhZ4qrF2Q9xriYsvGK4hg7PYcsQmqTCjhVefnoe1h3l?__cft__[0]=AZWKMFliCD_01C0Zug6SIkiQI9DWQ0eTPmr26ekfCFU3wHe36OHQ4a5lUeUCSOvwINTZEPp3lKE00oLOgXHRlIX6Dif-apwYsG8G-A_dDzPyUGyGI4Q0c5a99NJAzthIk0tgT-PwKPdzQL_VoNLmf7Tj&__tn__=%2CO%2CP-R"}, {"id": 188, "date": "2021년 10월 19일", "year": 2021, "title": "경고) 비위가 약한 분들은 사진을 보지 마시오 ..", "themes": [12, 3, 4, 5], "content_html": "<p>경고) 비위가 약한 분들은 사진을 보지 마시오..<br>세상에 이런일이~<br>귀가 아픈것도 아니었다<br>그저 면봉으로 귀를 팔때 느낌이 이상할 뿐<br>이 모든 것은 시작은 아들과의 비비건 총싸움<br>다니엘의 친구가 되어 주고자 총싸움을 한 것 뿐인데<br>다니엘이 쏜 비비탄에 귀볼에 맞아 장열히 전사한 것 뿐인데<br>그래서, 귀가 윙 하고 울린 것 뿐인데...<br>그것도 6개월이 전 일인데,<br>은행에 간김에 옆에 이비인후과가 있어서<br>면봉으로 귀를 팔때 느낌이 이상해요 라고 하며...<br>사진을 보는데...<br>아<br>뿔<br>싸...<br>비비탄이 귓속에 있다니..ㅠㅠ<br>그걸 6개월이나 몰랐다니....<br>황당해 하는 의사<br>겸연쩍은 나<br>어떤 리액션을 할 줄 몰라 당황한 간호사<br>,<br>결국 다 함께 웃었다~<br>'헐'<br>썩션..<br>치과가 아닌<br>이비인후과에서<br>의사 왈..<br>이런 경우는 처음 보네요ㅠ<br>차트에, '제기랄' 이라고 쓴 것같아.<br>다시 보니, '제거함' 으로 보인다.<br>세상에 이런일이에나 나올법한 일~<br>아내는 그걸 몰랐냐고......ㅠ<br>이렇게 늙어가며<br>점점 바보가 되어가는 중인가 보다<br>오늘 보다 나은 내일을 기대하며~<br>세상의 모은 아빠에게 위로를 전하며~</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02PRuRyBRHmNa2i2CdQP9isMb1PfkHApg1ocAwnied7HtCdXWoo7ErngPpH4FQkx2Jl?__cft__[0]=AZXOpDiiBkJzk1IMD7J4CqS79VmsnqbNBuZE9kTtX2EFQg78ury-ZQNwu5SDYz4wrer8MAoWsMgGdK5Ayj_A5Sw49tHvcTIh2ZwX4m1FsIkywhxb-EhnHCFXtThudZ0ffeJsP-c1l_3DFoluZsTMtIcKQxST0UYA9C2SGxKJBNFZYA&__tn__=%2CO%2CP-R"}, {"id": 189, "date": "2021년 12월 13일", "year": 2021, "title": "10대의 나에게", "themes": [10, 1, 2], "content_html": "<p>10대의 나에게<br>20대의 나에게<br>30-40대의 나에게<br>인생의 훈수를 두려고<br>예전에 썼던 일기, 에세이 등을 뒤적인다<br>10-20대의 내가<br>30대-40대의 내가<br>지금 50대의 나보다<br>훨씬 더 순수하다<br>훨씬 더 열정적이고<br>생각이 바르다.<br>부끄러움에 눈물을 훔친다..<br>10대의 내가<br>20대, 30-40대의 내가<br>50대의 나에게 훈수를 던진다.<br>마음이 아리다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02rXmQ7QxbdEkNJgSgHDM6JQPZF2yvBpHmqvE1YAKkB9c3FwiCfFRhuAhuuEf7519jl?__cft__[0]=AZULIOnE0YKeFo1Or4VGcEhDD_BJnl-qy1X_ZYBuNZIhtaI-qJa6FubJUoyH9fn0oPoq20bRhfqxA3GnSG4F4wM-mywu4cFU1vcSwNaKV8JdhnZ7DvZyO2B7CX2VXOU_nl1TtR-oJGHzAt0Fol8DRtJI&__tn__=%2CO%2CP-R", "images": ["pdf6_page22_img0.jpeg"]}, {"id": 190, "date": "2022년 3월 28일", "year": 2022, "title": "TV 를 보는데 ,", "themes": [1, 4], "content_html": "<p>TV 를 보는데,<br>고등학생인 주인공에게<br>어떤 사람이 이렇게 이야기 한다.<br>One of the TV characters said to 'high school student'<br>\"It must have been so hard for you\"<br>\"Are you alright?\"<br>\"It is alright\"<br>\"아이고 많이 힘들었겠다!<br>맘고생이 심했지?<br>고생했어!\"<br>이렇게 이야기 하는데<br>내가 눈물이 왈칵 난다.<br>Listening to what this guy said<br>Suddenly I found myself crying<br>내 안에<br>위로 받고 싶은 내가 있나 보다....<br>I must have wanted some<br>encouragement<br>or<br>ust kind words or comforting words<br>굳이 '내 안에 상처받은 아이' 이야기를<br>하지 않는다고 하더라도.<br>Yes, we all are going through 'tough time'<br>Yes, we all need some kind of 'comfort'<br>우리는 힘이 들지만<br>다 힘든 티를 내고 살 수는 없다.<br>내가 힘들다고 다른 사람을 힘들게 할 필요는 없다.<br>However, we cannot express our vulnerability always<br>\"my vulnerability\" cannot always be an excuse for making others inconvenient.<br>하지만, 너무 힘들 때는 괜찮은 ‘척’ 할 필요 역시 없다.<br>위로가 필요하다는 게, 잘못 된 것은 아니다.<br>Yet, it is still o.k to say it is not o.k..<br>It is o.k to say that it is hard or difficult....<br>내가 누군가에게 힘이 되어준다는 사실이<br>나에게 새로운 힘이되 듯<br>Just like, we feel better when we became help to others<br>It is alright if others feel better when they became help to us.<br>우리는 종종 타인의 도움을 받아도 된다<br>그게 사람 사는 것이니까<br>That is just how we live.<br>That is life.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02Suj4GBT14vDkkvxtDQWYkjyM3E4cJa1oUE61hYjV7Nge68aVGkouqmSfPtwzno9Ql?__cft__[0]=AZWBdpIszTxcvZ2no_1bFMNwSUNGfyNQMFiG1pVJVcQuY9hjE1zKCx_aBh7y475tQxaTWMXF-Vl9dPwtcqAty4lSNlOkwoyuSvpDZ3OvwXrniQ-KEmflnZ1NigFwX460iAIsFtEXgsuBHpI7ohORdzuj&__tn__=%2CO%2CP-R"}, {"id": 191, "date": "2022년 4월 11일", "year": 2022, "title": "지난 토요일 부산에서 진행된", "themes": [13], "content_html": "<p>지난 토요일 부산에서 진행된<br>대장항문학회에서 발표 책자를 보면서,<br>나의 소속이 좀 쌩뚱 맞다고 생각해 보긴 오래간만이었다.<br>그만큼 새로운 분야에서<br>새로운 연구를 한다고 생각해 본다.<br>이번에는 거의 처음으로 학회에 아내를 동반했다.<br>앞으로 학회에 가면서,<br>아내를 좀 더 데리고 다닐 수 있으면 좋으련만..<br>사실 운동과 대장암 연구는 벌써 13년째다.<br>운동이 정말 대장암 환자에게 참 좋다.<br>예방, 치료, 재활, 생존... 모두에게 좋지만..<br>이번 발표는<br>수술후 재활에 좋다는 발표를 했다.<br>퇴원이 1-2일 줄어들고,<br>오히려 하지 근력은 입원때보다 좋아지고<br>근육량은 재원기간동안 줄어들지 않고<br>환자들이 스스로 느끼는 회복도 달라진다.<br>그런데, 2021년-2022년 해외 유명 학술지에<br>발표된 내용은, 수술후 입원기간동안<br>걷기와 침대에서 나와 있는 것 오래해 봤자<br>환자 회복에 도움이 안된다고 나온다.<br>우리 연구 결과도<br>걷기를 많이 한 환자가 퇴원이 빠른 것이 아니라<br>우리가 제시한 운동,<br>하지 근력운동, 코어운동 등을 해야<br>회복이 빨라지고, 퇴원이 빨라진다.<br>좋은 학술지에 발표해야<br>사람들이 우리 연구결과를 믿을 것 같다.<br>운동이 약이다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0mLtkX3vZZWvxsHA4Lbz6Ujr47VZ5t583nYhHo6a3wWXNwH6GWfBTmdiFha57QzNzl?__cft__[0]=AZWmLQgLbC6VLepk4xa4WdN7vbm27VGJ9qA1ephZhRb7cYPZo25u8fghwgEjF6_vBRl1Ti3W92aM6Udc97mTCjAzQN6GX1l3zvX9o-5i6dbWyS7vjyMBcRRusrAHxsEqFt7U09QEyG0gGQ
