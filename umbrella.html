<script>
const POSTS = [{"id": 0, "date": "2018년 7월 6일", "year": 2018, "title": "빗속의 우산 하나", "themes": [16], "content_html": "<p>내가 기억하는 나의 어린 시절,<br>할아버지와 함께 자던 그 시절<br>한글을 배우기 전에<br>할아버지에게 천자문을 배웠다.<br>저녁에 자기 전, 할아버지는<br>과일 칼로 연필을 깎아 주셨다.<br>나도 연필 깎는 기계로<br>깍은 연필이 갖고 싶었다<br>할아버지가 있는데,<br>뭐 필요하냐던 아버지<br>난 할아버지가 빨리<br>돌아가셨으면 하고 생각했고,<br>그렇게 생각한 나 자신이 챙피했다<br>잠을 잘 땐 늘 할아버지를 꼭 안고<br>나의 한쪽 다리를<br>할아버지 허리에 올리고 잤다.<br>할아버지는 날 늘 이뻐 해 주셨고,<br>한 번도 목소리를 높여 나를 혼내신 적이 없었다.<br>하지만,<br>난 할아버지의 친절과 사랑을<br>고마워 한 적이 없었다.<br>할아버지는 당연히 나를 사랑해주고<br>우리를 위해 희생해야 하는 줄 알았다.<br>등교 후 비가 억수로 내려<br>우산을 미처 챙기지 못한 날<br>다른 친구들은<br>엄마가 우산을 가지고 학교에 오던 날<br>창문 넘어 유난히 키가 크셨던<br>할아버지가 보였다<br>한 손에는 비닐 우산,<br>그리고 다른 손에는 살이 꺾인 우산.<br>무려 30분 이상을<br>빗속을 뚫고 걸어오신 할아버지<br>챙피해서 할아버지 얼굴을 쳐다보지 않았다<br>왜 엄마는 오지 않고, 할아버지가 온 걸까?<br>(나의 엄마는 늘 아프셨다)<br>왜 우리 우산은 자동우산이 아니라<br>살이 부러진 우산일까<br>난 그날 그냥 할아버지가 챙피했다.<br>할아버지의 사랑과 헌신을 헌신짝같이 여겼다.<br>할아버지는 1년여 후<br>갑자기 돌아가셨다.<br>열한살 난 돌아가셔서<br>누워계신 할아버지를 보며 무서웠다.<br>할아버지가 돌아가시고 30여년이 지난 날<br>그날 우산을 들고오신<br>할아버지의 얼굴이 떠 올랐다.<br>할아버지를 챙피해 했던,<br>나의 모습이 눈에 보였다.<br>그날 얼마나 서운하셨을까?<br>얼마나 섭섭하셨을까?<br>고개를 들지 못하고,<br>꺼이꺼이 울었다.<br>할아버지 죄송합니다.<br>할아버지 사랑합니다.<br>아버지는 늘 말씀하신다.<br>나이 서른 다섯,<br>서울로 올라가야하나 고민하는 아버지에게<br>‘난 논두렁을 비고 죽어도 좋으니,<br>넌 서울로 가라’<br>할아버지는 말씀하셨단다.<br>무려 50 여 년 전 이야기지만,<br>아버지는 나를 볼 때 마다 이야기 하신다.<br>할아버지의 희생과 사랑을 기억해라.<br>할아버지의 희생과 사랑의 빚을 갚아라.<br>이제 아버지는<br>10명의 손자손녀들의 할아버지다<br>돌아가신 할아버지 보다,<br>더 오래 사셨다.<br>감정을 말로 표현하는 것을<br>부끄럽게 여기던 시대를 사신 분<br>자신의 아버지 이야기를 하는 것은,<br>할아버지를 그리워함 때문이라<br>나이 일곱에 어머니를 여윈 아버지<br>아들을 초등학교 밖에 보내실 수 없었던 할아버지<br>미안함과 당혹감에<br>더욱 엄하게 아버지를 키우신 할아버지<br>그 할아버지를 그리워하는 나의 아버지<br>‘그렇게 기도했는데,<br>엄만 꿈에도 한번 얼굴을 안보여 주시네’<br>할머니 기일에 말씀 하시던<br>아버지의 푸념이 귓가에 들린다.<br>오늘은 문득,<br>할아버지와 아버지가 더욱 그리워지는 날이다.<br>죄송합니다. 사랑합니다.<br>사랑합니다.<br>그 사랑의 빚을 기억하겠습니다.<br>더 많이 사랑하고,<br>더 많이 용서하겠습니다.<br>아버지의 85세 생신을 축하드립니다.<br>못난 아들</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0RDyzgnDmmeAMP5kT3yenQXxzNfAchEVDYPBTu2kHucaywhBhxPRudqGYf416ZamPl?__cft__[0]=AZUoXE0N7m4gfoIRZ17kbdtsI1HwOo7gq637x_QMH95RiFdW0taUTZtE_zwv9SIfJPBSuRqZZIYrelTWRx7nySi9lDz2JF7t6ngRwcpKEVtFkSTQF2S1fvitWb9CDW65TWvBFoklbuhVv84NNsKr0zAI8T43MQ-mNUDee7Q9FUEbzw&__tn__=%2CO%2CP-R", "images": ["pdf4_page62_img0.jpeg"], "featured": true}, {"id": 1, "date": "2022년 5월 26일", "year": 2022, "title": "“어떻게 그 산을 넘으셨을까 ?", "themes": [16], "content_html": "<p>“어떻게 그 산을 넘으셨을까?<br>혼자도 아니고, 돼지 새끼 한 마리를 가슴에 안고”<br>치매 초기 아버지,<br>다리에 힘이 없는 아버지를 가까스로 모시고<br>성묘를 마치고 내려오는데,<br>밑에 차에서 기다리던 어머니의 혼자말이 귓가를 울린다.<br>뭐라고? 묻는 말에 어머님의 어머님의 이야기를 하신다.<br>없는 집에 시집을 왔는데,<br>‘쪽장’ 을 안 해왔다고<br>시어머니 (의붓) 가 구박을 하신다는 이야기를 듣고,<br>환갑이 다된, 어머니의 어머니는<br>돼지 새끼 한 마리를 구해<br>딸의 집에 가지고 오신다.<br>강화도 불은면에서 양도면까지 약 8키로의 거리를<br>산을 가로질러 오시려,<br>돼지 새끼를 앉고 산을 넘어 오셨다.<br>산을 넘는 어머니의 어머니의 마음이 어떠셨을까?<br>화가 나셨을까? 슬프셨을까?<br>아니면, 안타까우셨을까? 미우셨을까?<br>귀한 딸이 구박을 받을까<br>걱정되셨을까?<br>“돼지 잘 키워 쪽장 마련하렴”<br>한 마디 남기시고, 사둔댁눈치에<br>곧 다시 돌아가신<br>어머니의 어머니..<br>돼지는 잘 크다,<br>쥐약을 먹고 죽었다.<br>돼지는 쪽장이 되지 못했지만,<br>어머니의 어머니의 사랑은<br>어머니의 마음에 남아있다.<br>그리고, 우리에게 전해진다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02ShiGienh7EMpWGLoSQyQZipNoo5PTyRSY4SipKHgSkow7Qwx1m5ayMZc5HQ5BZL8l?__cft__[0]=AZV2NcB0Lo-D3NUAadxiaYtTSwc9CjW3tFdtb7WMLxd6bHVGRgBzfKmmWuK7jul_hXJs8WJAzSYEBfoWNxgw10U9oA8UE-oopHFVk2R9tgVHCt-yXOoWT9DMa_A9Am_F5T1DYd8Evmy8fLtYYRIHvnPE&__tn__=%2CO%2CP-R", "featured": false}, {"id": 2, "date": "2011년 3월 26일", "year": 2011, "title": "일년 이상 작업한 책이 드디어 나왔다 ^^ 사람들이 읽고 더 아...", "themes": [3, 12], "content_html": "<p>일년 이상 작업한 책이 드디어 나왔다^^ 사람들이 읽고 더 아름다운사랑을 하면 좋갰다</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02zh5jkYLjLquMoCVasbgP1Ty1sDUdYBkXFcqkxDVbmvdr7ZMBKkRBGbnKdEKdtxqLl?__cft__[0]=AZVvVuriTRds-2xjeyJfGkYmeLQrqS0uEm4w70cG2oqZQYgSKT47NBMCFwhKT_HCLrqcc6fqiweUP0OK0FiasVq-7mEbeQ7gRc71O6skPtnwHKIxwpJcTHVvGC-Lural9nNKHPHw1uRmNnPhrjwUdZd-&__tn__=%2CO%2CP-R", "images": ["pdf1_page0_img2.jpeg"]}, {"id": 3, "date": "2011년 5월 14일", "year": 2011, "title": "내 기사가 네이트 탑 기사가 되다니 ^^ 오늘 인터뷰도 짧게 했...", "themes": [12], "content_html": "<p>내 기사가 네이트 탑 기사가 되다니^^ 오늘 인터뷰도 짧게 했는데 이미나 기자님이 글을 잘 쓰<br>셨나보다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02zh5jkYLjLquMoCVasbgP1Ty1sDUdYBkXFcqkxDVbmvdr7ZMBKkRBGbnKdEKdtxqLl?__cft__[0]=AZVvVuriTRds-2xjeyJfGkYmeLQrqS0uEm4w70cG2oqZQYgSKT47NBMCFwhKT_HCLrqcc6fqiweUP0OK0FiasVq-7mEbeQ7gRc71O6skPtnwHKIxwpJcTHVvGC-Lural9nNKHPHw1uRmNnPhrjwUdZd-&__tn__=%2CO%2CP-R", "images": ["pdf1_page0_img5.jpeg"]}, {"id": 4, "date": "2011년 7월 3일", "year": 2011, "title": "스포츠가 대단 하긴 대단하다", "themes": [11, 13], "content_html": "<p>스포츠가 대단 하긴 대단하다. 대통령도 오고, 기업인도 오고, 그밖에 정치인과 수 많은 사람들이<br>여기 와서 평창 동계 올림픽과 패라림픽 유치를 위해 힘쓰고 있다. 오늘 1차 리허설을 했다. 너<br>무 깊은 진심이 전해저 PT 를 하는 사람과 듣는 사람이 눈물을 흘렸다. 하나님의 한 표는 어디<br>로 갈까?<br>평창 그리고 나<br>2003년 7월 박사학위를 마치고 잠시 한국에 다녀오는 길이었다. 체코 프라하에서 있었던 IOC<br>총회, 내가 비행기를 탄 곳은 서울이었고, 비행기의 목적지는 캐나다 밴쿠버였다. 비행기가 거의<br>밴쿠버에 도착했을 때, 2010 동계올림픽 개최지로 평창을 재치고 캐나다 밴쿠버가 올림픽 개최<br>지로 선정되었음을 발표하였다. 난 담담했다. 그래도 평창이 선방했다고 생각했다. 그리고, 난 캐<br>나다에서의 9년간의 대학원생활을 마치고 미국 보스톤으로 이사를 했다. 이때 까지만 해도 내가<br>평창 동계올림픽과 인연을 맺을지는 꿈에도 생각하지 못했다.<br>그리고, 2005년 3월 나는 연세대학교 교수로 임용이 되어 한국으로 돌아왔다. 한국으로 돌아와<br>자연스럽게 장애인올림픽위원회와 함께 여러 가지 일들에 관여하게 되었다. 그러던 중, 2006년<br>4월, 오랬동안 알고 지내던 연세대학교 원주캠퍼스 재활의학과 이영희 교수님으로부터 평창동계<br>올림픽 비드북 작성을 도와달라는 연락을 받았다. 올림픽을 개최하기를 원하는 나라는 일단 개최<br>의향서를 제출하게 된다. 그리고, 개최 의향서에 따라 3개도시를 선정하여 후보도시를 발표한다.<br>후보도시가 발표되면 그때부터 약 8개월 동안 전체 17개 주제를 포함한 비드북을 작성하여 제출<br>하게 된다. 그리고, IOC 에 제출된 비드북을 근거로 대략 10여명으로 구성된 IOC 실사단이 후<br>보도시를 차례로 방문하여, 현장을 보고 또 후보도시는 IOC 실사단에게 17개 주제의 비드북의<br>내용을 대략 각 주제별로 20분 동안 발표를 하게 된다. 난 처음에는 장애인 올림픽을 주관하여<br>작성하는 이영희 교수님을 도와 비드북을 작성하였지만, 나중에는 이영희 교수님께서 의무를 맡<br>고, 난 장애인올림픽을 맡아서 발표를 하였다. 약 두 달간에 걸친 발표 준비는 나에게 좋은 경험<br>이었고, 더 나아가 나 스스로를 한 단계 업그레이드 시키는 계기였다. 이렇게 실사가 끝나고 나<br>의 역할은 거의 다 마치고 과테말라에서 평창의 이름이 울려퍼지기를 기다렸다.<br>2007년 4월 경, 나를 위해서 기도하시던 목사님께서 하나님이 나를 세상의 왕들앞에 세우신다고<br>말씀하셨다는 것이었다. 난 솔직히, 말도 안되는 기도라고 생각했다. 그런데, 갑자가 6월 초에 유<br>치위원회로부터 연락을 받았다. 잠시 나오라는 것이었다. 그래서, 나와 두 분의 전문 위원이 함께<br>참석한 곳은 최종 발표 준비 리허설 장이었다. 그곳에서, 우리에게 최종 발표의 스크립트를 읽어<br>보게 하더니, 나보고 최종 발표위원이 되어 줄 수 있냐고 물었다. 난 어리둥절한 상태로, 쾌히<br>승낙했다. 나는 그때 한 참 새터민 학생들을 준비시켜 캐나다 원주민 선교를 보내기 위해서 준비<br>중이었다. 그때부터 PT 준비를 위한 강행군이 시작되었다. 최종 발표는 나 이외에도 강원도 도지<br>사, KOC 위원장, 대통령, 이건희 회장, 전이경 올림픽 금메달리스트, 그리고 안정현 아리랑 TV<br>아나운서로 구성되어졌다. 정말 우리는 지겹도록 연습을 했다. 스크립트는 수백 번 읽었고 전체<br>영상과 함께 한 리허설도 30번 이상은 했을 것이다. 그렇게 과테말라의 IOC 총회는 다가왔다.<br>전세기를 타고 IOC 총회 개최지인 과테말라에 도착했을 때, 마치 전쟁터에 나아가는 느낌을 받<br>았다. 1차 그리고 2차 리허설을 마칠 때까지는 별 떨림이 없이 덤덤한 생각이 들었다. 러시아에<br>서 푸틴이 날아왔다는 소식, 그리고 군용기를 동원해 수송한 장비로 무더위가 한참 심한 과테말<br>라에 야외 아이스링크를 만드는 것을 보면서 불안한 마음이 들었지만, 그래도 우리의 승리를 확<br>신했다. 우리의 발표는 우리가 보기에도 감동적이었다.<br>그런데, 막상 최종 드레스 리허설 시간이 되어 내 발표 차례가 되었는데, 나는 너무 떨려 온몸이<br>마비가 되는 것 같았다. 그동안 나는 수백명 그리고 수천명 앞에서 영어로 설교도 하고 간증도<br>한 경험이 많아, 대중앞에서 연설하는 것은 긴장은 될 지라도 별 떨림은 없었는데, 최종 리허설<br>을 하는 동안에는 너무나 긴장되어 척수가 마비되는 것 같았다. 나는 그때부터, TV를 보면서도<br>그리고 운동을 하면서도 나의 원고를 연습하였다. 외운 것은 물론이고, 심지어는 TV 에 몰입하<br>여 다른 생각을 하면서도 나의 입은 원고를 외울 정도까지 되었다. 최종 PT를 하는 날, 우리는<br>우리의 가진 것을 최선을 다하여 보여주었다. 정말 후회 없는 발표였다.<br>그리고, 우리는 잠시 쉬었다가, 개최지 발표 장소로 이동을 하였다. 각국의 영상이 방송이 되고,<br>편지 한통이 자크 로게 IOC 위원장에게 배달이 되었다. 그리고, 이어서 2018 Olympic and<br>Paralympic goes to \"SOCHI\" 하고 외치는 순간 난 멍해졌다. 눈물도 나지 않았다. 나는 속으<br>로 “이럴 순 없어. 어떻게 이럴 수가 있어!” 정말 소치는 아직 아무 준비도 되어 있지 않았다. 반<br>면에 우리 평창은 차근 차근 준비가 되어있었다. 로이터 통신의 기자는 나에게 지금 소감이 어떠<br>냐고 물었다. 나는 “I felt like somebody stab me at the back” 라고 대답하였고, 나의 인터<br>뷰 내용은 국내와 국외 외신에 비수가 등에 꽂힌 것 같았다는 내용으로 보도되었다. 너무 어이가<br>없었다. 내 주위에 엉엉 우는 사람들 속에서 나는 마치 꿈이었으면 얼마나 좋을까 생각했다. 올<br>림픽과 장애인 올림픽을 너무 개최하고 싶었다. 그리고, 나는 캐나다로 가는 비행기에 올랐고, 새<br>터민 학생들과 함께 원주민 선교를 잘 마치고 한국으로 돌아왔다. 세상은 아무일 없는 것 같이<br>흘러갔다.<br>그렇게 2년이란 시간이 흘렀고, 우리 드림팀 (17개 주제 준비 위원)은 다시 모였다. 이전의 비디<br>오를 보고, 2016 리오의 발표를 보면서, 우리도 다시 준비할 때가 되었다는 생각을 하였다. 이번<br>에는 지난 번과 다르게 장애인 올림픽이라는 주제를 처음부터 맡아 준비하게 되었다. 그렇게 비<br>드북을 새롭게 작성하면서, 올림픽 유치에 대한 소망은 더욱 깊어져만 갔다. 특히 동계 장애인올<br>림픽 발전을 위해 세워놓은 1750만불, 이 프로젝트만 잘 하면, 정말 아시아와 저개발 국가의 청<br>소년들과 장애인 선수들을 약 2000 명 가량 한국에 초청하여 동계스포츠 발전에 큰 발전에 영향<br>을 미칠 수 있을 것 같았다. 저들에게 꿈을 심어주고, 스포츠를 통한 자신의 장애 극복에 엄청난<br>도움을 줄 수 있을 것이다. 꼭 동계올림픽을 유치하고 싶었다. 2010년 7월 한글과 영문으로 비<br>드북을 제출하고, 이어 2010년 12월 최종본을 제출 할 때까지 수없는 수정본을 작성해 가며, 비<br>드북을 결국 IOC 에 제출했다. 그리고, 우리는 새롭게 구성된 팀으로 발표 준비에 들어갔다. 발<br>표 준비를 하며, 정말 말못할 몇가지 일들까지 겪으며, 우리는 발표준비를 정말 열심히 했다. 그<br>리고, 새롭게 지어지니 알펜시아 리조트에서 17개 주제와 현장에서의 발표를 멋지게 마쳤다. 정<br>말 이 보다 더 잘할 순 없다는 생각이 들 정도로 열심히 준비하였고, 우리는 잘 하였다.<br>그리고, 발표가 끝나자 마자 우리는 로잔 발표 준비에 들어갔으며, 비로 우리 드림팀 멤버들은<br>발표에 참여하지는 않았지만, 최종 발표단과 수없이 질의 응답을 준비하며 최종발표단을 준비시<br>키는데 참여하였다.<br>그리고, 7월 1일 우리는 더반으로 향하였다. 더반은 생각보다 아름다운 도시였다. 바다를 끼고<br>있는 아름다운 휴양도시였다. 이전과 같이 리허설에 함께 참여하면서, 새롭게 준비된 발표를 들<br>으면서, 이번에는 평창이 반드시 되겠다는 확신을 갖게 되었다. 발표를 하던 나승연 대변인은 “It<br>was an honor to represent my country\" 라는 대목을 발표하며 목이 메었다. 나 역시도 그<br>마음을 잘 안다. 지난 20104 발표를 하며 느꼈던 그 압박감은 정말 그 자리에 서보지 않은 사람<br>을 알 수 없을 것이다. 정말 대한민국의 국운이 내 어깨에 있다고 생각을 하니 잠도 잘 수 없었<br>다. 그런데, 나승연 대변인 뿐 아니라 다른 사람의 발표역시 매우 흥분되고 또 감정이 복받쳐 오<br>를 수 밖에 없었다. 발표를 한 사람이나 듣는 사람 모두 연습하면서 눈물을 흘렸다. 이 눈물은<br>슬픔과 다른 이유가 아니라 우리의 진정성을 호소하며 저절로 북받쳐 오르는 눈물이었다.<br>그렇게 준비를 하며, IOC 위원이기도 한 IPC 위원장을 만나 평창의 지지를 다시 한 번 호소했<br>다. 나는 맨 마지막에 KPC 위원장과 IPC 집행위원의 양해를 구하고, IPC 위원장의 눈을 바라보<br>며, 진심으로 평창에게 기회를 주라고, 평창의 올림픽은 한국의 장애인 스포츠 발전 뿐 아니라<br>아시아와 세계 장애인들에게 꿈을 줄 것이라는 이야기를 하면서 북받쳐 오르는 감정을 조절하지<br>못해 말을 잇지 못하였다. 그렇게, 나는 진심으로 평창이 동계올림픽과 장애인 올림픽을 유치하<br>기를 바랬다.<br>그리고, 드디어 어제 우리는 최종 발표 날이 밝았다. 뭰헨이 처음으로 발표하고, 그 다음으로 안<br>시가 발표하는 것을 보면서 다시 한 번 우리의 승리를 확신하였다. 저들의 발표에는 정보의 전달<br>은 있었지만, 감동은 없었다. 그리고 우리의 발표에 들어갔다. 한 명 한 명의 최종발표 위원들은<br>멋지게 자신의 역할을 해 내었다. 그리고, 투표가 예상외로 1차로 끝이 났다. 그리고 20시간 같<br>은 2시간이 지나고, 2018 Olympic Games goes to ----- PYEONGCHANG 의 소리가 울리<br>는 순간 우리는 모두 울었다. 2002년부터 준비해온 지난 10년간의 두 번의 실패가 주마등같이<br>지나가는 순간, 지난 시간의 수치와 마음의 근심이 다 날라가는 순간이었다. 우리는 모두 부둥켜<br>안고 울 수 밖에 없었다. 그리고, 우리는 엎드려 하나님께 감사의 기도를 드렸다. 정말 믿기지<br>않았다. 우리가 해 내었다. 그것도, 올림픽 역사상 1차 투표에서 최다득표의 기록을 세우면서 우<br>리가 승리했다. 넉넉히 이겼다.<br>나는 평창 동계올림픽을 준비하면서, 결국 최종 결정을 하나님께서 하신다는 생각을 가지고 있었<br>다. 그리고, 하나님의 한표는 바로 평창이었다.<br>이제 시작이다. 이제부터 2018 동계올림픽까지 약 7년의 시간이 남았다. 이제부터 잘 준비하여<br>정말 많은 이들에게 꿈과 희망을 주는 그런 올림픽과 장애인 올림픽이 될 수 있기를 기도드린다.</p>\n<p>평창 올림픽/패러림픽 유치 후 미국 보스톤으로 연구년</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02zh5jkYLjLquMoCVasbgP1Ty1sDUdYBkXFcqkxDVbmvdr7ZMBKkRBGbnKdEKdtxqLl?__cft__[0]=AZVvVuriTRds-2xjeyJfGkYmeLQrqS0uEm4w70cG2oqZQYgSKT47NBMCFwhKT_HCLrqcc6fqiweUP0OK0FiasVq-7mEbeQ7gRc71O6skPtnwHKIxwpJcTHVvGC-Lural9nNKHPHw1uRmNnPhrjwUdZd-&__tn__=%2CO%2CP-R"}, {"id": 5, "date": "2011년 7월 27일", "year": 2011, "title": "기차시간 이분전에 도착했는데 기차는 무심하게 떠나버렸다", "themes": [10, 12, 14], "content_html": "<p>기차시간 이분전에 도착했는데 기차는 무심하게 떠나버렸다. 다음기차는 이십오분후에 오는데.<br>기차역에 혼자 앉아 혼자만 기차를 못탔다는 생각에 기분꿀꿀해지다가 다음 시간기차에 내가<br>일등으로 와서 기다린다고 생각하니 기분이 나진다^^<br>인생은 자전거로 출퇴근 하는 것이다?</p>", "images": ["pdf1_page3_img0.jpeg"]}, {"id": 6, "date": "2011년 8월 30일", "year": 2011, "title": "최근 자전거를 중고로 구입하여 요사이 자전거 출퇴근을 하면서 보니", "themes": [10, 1, 2, 8], "content_html": "<p>최근 자전거를 중고로 구입하여 요사이 자전거 출퇴근을 하면서 보니, 인생은 자전거로 출퇴근<br>하는 것 이라는 생각이 든다. 우리 집에서 학교까지 10 km를 자전거로 가다 보면 큰 언덕이 몇<br>개나온다. 언덕을 올라가면서 힘이 들지만, 오르막이 있으면 또 내리막이 있다. 내리막이라고 마<br>냥 좋아할 것은 아니다. 왜냐하면 출근길의 내리막은 퇴근길의 오르막이기 때문이다. 동시에, 출<br>근길의 오르막은 퇴근길의 내리막이다.</p>\n<p>인생의 오르막에 있는 일은 힘이 드는 일이다. 열심히 노력하는데 그에 비해 앞으로 나아가는 거<br>리는 별로 되지 않는다. 때로는 포기하고 싶은 생각이 들기도 한다. 그러나, 기억하자, 조금만 더<br>가면 다시 내리막이 나온다. 반대로 내리막은 쉽다. 별로 노력한 것이 없는데, 자전거는 앞으로<br>잘 나아간다. 하지만, 오르막에 오르는 수고가 있었기에 내리막이 즐거운 것이다.</p>\n<p>결국, 오르막에 있다고 낙심하지 말고, 내리막에 있다고 자만하지 말자. 오늘 나에게 주어진 만큼<br>최선을 다하면 되는 것이다. 다만, 내가 가는 길이 옳은 길이지는 꾸준히 돌아보아야 할 것이다.<br>만약 내리막이라고 좋아라 내려간 길이 잘못된 길이라면, 다시 오르막을 올라오는 수고를 해야<br>하기 때문이다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0318RF8KoLt6d5f8koaXFKy7ox2ghqGoaJ2UGrDGp53o1mUGfHPqfG8dn8PEYRps64l?__cft__[0]=AZWEYm-Fa1Irsg8Gbq_WW_4Avkrw2IgqqCCEGRKDpyq5S2q5LTm4Js0jizXKn0gJSPX2cQZ4divU7Fcqd-wy5U5Bp-M4ZWH49udt3Ef9jK4bN45TQJPLSTdtfRrvJ0W5mZJXceCXPJoqWHZ0XDPRq5ts&__tn__=%2CO%2CP-R"}, {"id": 7, "date": "2011년 9월 30일", "year": 2011, "title": "인생은 자전거 타기다 (2탄)", "themes": [10, 8, 5, 1], "content_html": "<p>인생은 자전거 타기다 (2탄)<br>요즘 하루의 시작을 자전거로 시작한다. 아침의 상쾌한 바람을 맞으며 출근해, 샤워를 하고 하루<br>를 시작하면 정말 하루 하루가 매우 신선해 진다. 그리고 나서의 모닝커피… 아.. 그리고 일이<br>끝나면, 요즘은 조금 일찍 나와 보스톤 주변을 일부러 돌아 집에간다. 하버드와 보스턴대학을끼<br>고 찰스강의 바라보며 자전거를 타고 퇴근을 하면 사랑스런 식구들이 반겨준다. 그래서 요즘은<br>일 간다는 생각보다 자전거 타러 나간다는 생각으로 하루를 시작하고, 또 퇴근을 하니 삶의 질이<br>많이 좋아지는 것 같다. 거기에 하루 교통비로 들어가는 만원 정도를 아낄 수 있으니 일석이조가<br>아닐 수 없다.<br>하루는 자전거를 타고 약속장소에 가는데 그 길에 죽음의 언덕이 있었다. 나는 끙끙거리며 언덕<br>을 올라가고 있는데, 백발의 할머니가 나를 쓩하고 지나서 앞으로 가는 것이 아닌가? 순간 당황<br>스럽기도하고 창피하기도해서 그분을 쫓아 열심히 달렸다. 그런데, 그분과 나의 간격은 좁혀지지<br>않았다. 언덕을 내려가고 또 다시 다른 언덕을 올라가고, 나와 가는 방향이 같았는지, 그분을 쫓<br>아 20여분을 타고 가다가 거의 그분을 잡았다 싶었는데, 옆으로 빠져 나와는 다른 방향으로 가<br>셨다. 아… 내가 이래도 체육 전공인데, 앞에 바구니를 달고 있는 할머니자전거에 추월을 당하다<br>니.. 자존심 Dog 박살났다. 그리고, 약속장소에 도착해 보니 예정 시간 보다 약 5분정도 빨리<br>도착했다. 그분을 좇아 열심히 달리다 보니, 나도 모르는 사이에 생각보다 빨리 목적지에 도착한<br>것이 아닌가? 순간 나는 우리 인생에도 이런 일이 있을 수도 있다는 생각을 했다. 하나님은 우리<br>의 인생에 내가 지난 번에 만난 할머니 같은 분을 보내주셔서 때로는 자존심도 상하고, 때로는<br>고생을 하기도 하지만, 지나보면 내가 꼭 있어야 할 자리에 그 시간에 있게 하기 위한 하나님의<br>천사인 경우가 있는 것 같다. 돌아보니 나에게도 그런 사람이 여러 명 있었던 것 같다. 정말 그<br>당시에는 그 사람이 그리고 그 상황이 싫었는데, 나중에 돌아보니 그 사람이 없었다면, 나의 인<br>생을 달라졌을 것이라 생각하게 된다.<br>최근에 자전거를 타다가 두 번 정도 넘어지는 일이 생겼다 (오늘을 포함). 한 번은 새벽기도를<br>가기 위해 새벽 5시15분정도에 나와 보니 완전 앞이 안 보일 정도로 깜깜했는데, 자전거 헤드라<br>이트가 없어 거의 암흑 속을 달리게 되었다. 그런데, 강변 도로로 들어서려 하는 순간 바퀴에 무<br>언가 닿는 느낌과 함께 자전거는 순식간에 넘어졌다. 하나님의 은혜와 나의 뛰어난 운동신경으로<br>자전거는 넘어졌지만 나는 넘어지지 않고 서 있을 수 있었다 (불가능한 일이 었는데, 어찌하다보<br>니 가능해 졌다). 정말 자칫 하면 큰일 날 뻔했다. 그리고, 내가 왜 넘어졌나를 생각하다가 새로<br>운 인생의 교훈을 깨달았다. 때로는 우리가 살다 보면 앞이 보이지 않을 때가 있다. 졸업 후 취<br>직이 안된 다거나 혹은 두 가지 진로를 놓고 고민을 한다거나 등등. 이럴 때는 서두른 결정을 내<br>리면 안된다. 성급한 마음에 서둘러 결정을 한다면, 이는 마치 앞이 보이지 않는 자전거를 전속<br>력으로 달리는 것과 같다. 이럴 때에는 천천히 앞을 조심스럽게 보며 나아가 한다. 때로는 자전<br>거에서 내려 자전거를 끌고 가는 것이 더 현명할 수도 있듯이, 자신의 일을 멈춰서서 앞을 뒤를<br>옆을 돌아보는 것이 현명한 일일 수도 있다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0318RF8KoLt6d5f8koaXFKy7ox2ghqGoaJ2UGrDGp53o1mUGfHPqfG8dn8PEYRps64l?__cft__[0]=AZWEYm-Fa1Irsg8Gbq_WW_4Avkrw2IgqqCCEGRKDpyq5S2q5LTm4Js0jizXKn0gJSPX2cQZ4divU7Fcqd-wy5U5Bp-M4ZWH49udt3Ef9jK4bN45TQJPLSTdtfRrvJ0W5mZJXceCXPJoqWHZ0XDPRq5ts&__tn__=%2CO%2CP-R"}, {"id": 8, "date": "2011년 10월 14일", "year": 2011, "title": "난 여태까지 비행기 안에서 방귀를 끼는 것은 완전범죄인줄 알았다", "themes": [8, 3, 7, 12], "content_html": "<p>난 여태까지 비행기 안에서 방귀를 끼는 것은 완전범죄인줄 알았다. 소리는 엔진 소리에 묻히고,<br>냄새는 기내 환기시설이 빵빵하니... 그러나, 이번에 한국에 오면서 일단 냄새는 바로 뒷사람에게<br>전달되어 환기가 된다는 사실을 알았다. 내 이웃을 사랑하라 예수님을 말씀하셨지만, 정말 앞에<br>앉은 사람을 사랑하기 어려웠다. 정말 거짓말 안하고 30번은 끼신것 같은... 화장실 갔다 오시라<br>고 말씀드리고 싶었다. 덕분에 감기가 더욱 심해 진듯....</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0Re7prLNs6mCJuMNzyUWkW45jMxhQYkuMLLQvLXKnxxc3rRZ4915Rq4H7GYWjihAjl?__cft__[0]=AZXxlvYi0ox_wR7d2zdYGYunpPzSMfVqQ4Ds9_7AKRu4xgck04F-gmFgIpCkQG8EpkBiJmtUxBIEtd5i6a-Qc_OSzf_cy5i2eudpNjyNzP5s4ujBfK55fIWVCGAuYOozYafC1Yp_ogeu8MAp5oMCzrgW&__tn__=%2CO%2CP-R"}, {"id": 9, "date": "2011년 10월 24일", "year": 2011, "title": "인생은 자전거 타기다 ? 뛰기와 걷기도 ?", "themes": [8, 10, 1, 12], "content_html": "<p>인생은 자전거 타기다? 뛰기와 걷기도?<br>오늘 조금 전에 스타벅스에서 여러가지 일들을 정리하고 나와 하나님간의 시간을 갖고 자전거를<br>다시 타 출근을 하려고 하는데, 그만 앞 타이어가 빵구.... 와우. 남은 3키로를 뛰다가 걷다가 하<br>면서 출근을 하나 9시를 넘겼다. 때로는 인생에 예측할 수 없는 일도 있다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0Q1m67EHazMkW6mDrrjyTYsu9bxUDbNNTJRzSrcTnu78ExZ1rzWUk8bifPcUHAN32l?__cft__[0]=AZVduNo-4MIxU7RENZ7eQYlfCk0KnYrUIzUzk4e4q1-RprYRXLs96n8HbA2diiyBVmqcwxCjsKIkGPuAjGdQ1xuT_0ULDVsEhYbZKZ7J-C89f2igbgT2vmUsXhHz96H3I2sLlMhMk8nSV-3Bd415DZYO&__tn__=%2CO%2CP-R"}, {"id": 10, "date": "2011년 11월 10일", "year": 2011, "title": "죽음으로 이 상황을 피하고 싶다는 생각을 해 본적이 있나요 ?", "themes": [13, 5], "content_html": "<p>죽음으로 이 상황을 피하고 싶다는 생각을 해 본적이 있나요?<br>2004 년 봄으로 기억한다.<br>난 하버드 대학 의과대학에 근무하는 한국출신 연구원들이 모여<br>격주로 함께 점심을 먹으며 연구 논문 발표를 하는 모임에 참여하는 중이었다.<br>얼떨결에 내 발표 차례가 되었고,<br>나는 내가 한 번 멋지게 발표를 한 번 준비해 보리라 다짐했다.<br>그러나, 막상 발표 날짜는 다가오는데<br>내가 발표할 주제의 논문은 읽어도 읽어도 이해가 안되었고<br>발표 날짜가 되었다.<br>난 속으로, 천지가 개벽이 되었으면 하는 생각을 했다.<br>아니 그 정도가 아니라,<br>그냥 이 순간 ‘내가 딱 죽어버렸으면 좋겠다’ 라고 생각을 했을 정도다.<br>그러나 안 갈수는 없고,<br>가서 그냥 아는 만큼 까지만 발표를 했다.<br>그날 발표는 나에게 완전 스트레스였고,<br>난 그날의 그 순간을 평생 잊지 못할 것이다.<br>그리고,<br>내가 일하는 Joslin Diabetes Center 에서<br>일주일에 한 번 혹은 두 번 있는 외부 강사초청 특강을 들으면서,<br>나도 언젠가는 저 자리에 설 수 있을까? 하고<br>소망했던 기억이 있다.<br>그리고,<br>올해 7 월 한창 꿈꾸는 다락방을 읽으면서 필에 꽂혀<br>우리 학생들에게 꿈을 꾸고,<br>이루기를 도전하자고 이메일을 통해서 주장한지<br>며칠 지나지 않아, 길거리에서 우연히 이전에 ,<br>Joslin Diabetes Center 에서 일하는 교수 한 명을 만났고,<br>이 얘기 저 얘기 하다가,<br>나보고 와서 특강을 한 번 하라는 것이 아닌가?<br>나는 얼떨결에 ‘그러지 뭐’ 하고 말하고 헤어졌다.<br>그리고,<br>약 한달 후에 나보고 Joslin Diabetes Center 에 와서 세미나를 하라는 것이었다.<br>그것도 그냥 조그만 세미나가 아니라 한 한기 여덟 번 있는 세미나 중에 하나란다. 와우, 나는<br>나의 꿈이 이루어 졌다고,<br>우리 학생들에게 메일을 보내며 ‘거 봐라!<br>꿈꾸고 도전하면 실제 현실이 되는거야!’ 라며 잔뜩 허풍을 떨었다.<br>그런데,<br>시간이 왜 이렇게 빨리 지나가는 건지.<br>어느 센가 벌써 발표 일주일 전이 되었다.<br>나름대로 발표 준비를 한다고 했는데, 도저히 자신이 없었다.<br>‘아니 세계 최고 당뇨 전문가들 앞에서 뭘 이야기 하라는 거지?”<br>“뭘 이야기 하면 되지?” 별별 생각이 나면서,<br>발표를 3 일 남기고, 내가 아는 몇 몇의 외국 동료 의사와<br>운동 생리학자들을 앉혀놓고 연습 발표를 해 보았다.<br>발표가 끝나자 저들도 별로 할 말이 없고,<br>나 역시도 별로 할 말이 없었다.<br>정말 테러블했다.<br>나는 정말 다시 한번,<br>“세상에 뭔가 천지개벽이 일어나지 않나?<br>하늘에서 소행성이 이곳 보스톤에 떨어지면 좋겠다 (사람은 안 다치고)” 등<br>별별 생각을 다 하며, 내가 발표를 피해갈 방법이 없나 생각했다.<br>그리고, 꿈을 꾼다고 꿈이 이루어지는 것이 아니라,<br>꿈을 꾸고, 그 꿈이 이루어질 때까지<br>피나는 노력을 해야 한다는 사실을 다시 한번 깨닫게 되었다.<br>주말을 반납하고 학교에 나와<br>다시 나의 발표를 새롭게 구성할 때에<br>하나님께서 새로운 아이디어를 주셨다.<br>“저들 앞에서 저들이 잘 아는 분자생물학과<br>당뇨병학을 강의해 봤자<br>나는 딸릴 수 밖에 없다.<br>그러나, 운동 분야에서는 나 역시 나름대로<br>세계적인 전문가가 아닌가?<br>내가 아는 부분을 내가 모은 연구 결과에 기반해<br>발표하면 되겠다” 는<br>생각을 하며 다시 발표 준비를 했다.<br>발표를 하는 날은 새벽 6 시 30 분에 학교에<br>도착해<br>문득 발표가 있는 병원을 한 바퀴 돌면서,<br>‘하나님 제 발표 때문에 하나님께 영광 가리지<br>말게 해주시고,<br>또 저 때문에 이곳의 한국 분들이 망신 당하지<br>않도록 도와주세요’ 라고<br>기도했다. 그러다, 문득 내가 발표하는 장소에<br>한 번 가서 기도할까?<br>라는 생각을 하며 그 장소에 가보니, 강당의<br>문은 열려있었다.<br>난 간단히 기도를 하고 나서<br>내가 해야 할 발표를 그곳에서 다시 해보며<br>한 시간 반 가량 다시 한 번 연습하는 시간을<br>가졌다.<br>그리고, 드디어 이틀 전 발표를 마쳤다.<br>스스로 발표를 평가한다는 것은 우습지만,<br>나 스스로 만족할 만큼의 발표는 되었다.<br>이번 과정을 통해서<br>다시 한번 우리의 꿈을 이루기 위해서<br>절대로 그냥 꿈만 꾼다고 되는 것이 아니라는<br>것을 깨달았다.<br>때로는 죽음으로 그 상황을 피하고 싶은 상황을<br>느낄 정도로,<br>힘이 들고, 또 포기하고 싶지만,<br>그래도 앞을 바라보며 그 상황을 피하지 않고<br>직면할 때에<br>그리고 최선을 다 할 때에 또 한 단계 앞으로<br>나아가게 되는 것이다.<br>꿈꾸기, 꿈을 이루기 위해 도전하기, 그리고 포기하지 않기…</p>", "images": ["pdf1_page7_img2.jpeg"]}, {"id": 11, "date": "2011년 11월 13일", "year": 2011, "title": "어느 순간 평상시 별로 짜증나는 일이 아닌데", "themes": [10, 1, 2, 8], "content_html": "<p>어느 순간 평상시 별로 짜증나는 일이 아닌데, 짜증이 난다던지, 혹은 가까운 사람들에게 화를<br>내는 일이 잦아진다든지하면, 바로 모든 일을 내려 놓고 스스로 하나님앞에서 자신을 돌아 봐야<br>한다.<br>심령이 가난한 자는 복이 있나니, 천국이 저희 것임이요, 애통한 자는 복이 있나니 저희가<br>위로를 받을 것임이요, 온유한 자는 복이 있나니 저희가 땅을 기업으로 받을 것임이요----<br>땅을 기업으로 받기 위해서는 (세상적 성공?) 온유해야 한다.  온유하기 위해서는 애통하는<br>마음이 있어야 한다.  애통하는 마음이 있기위해서는 심령이 가난해야 한다.<br>하나님 앞에서 자신을 바라보면 (코람데오), 자신의 부족함이 보이기 때문에 심령이 가난해 질 수<br>밖에 없다.  그런 가난해진 심령으로 하나님 앞에 애통해 지는 것이다.  그리고, 자신의 부족한<br>모습을 돌아보고 애통해 하는 사람이 다른 사람의 잘못을 지적하고, 열받고 할 수 없다.  자신의<br>진정한 모습을 보면 자신은 다른 사람을 지적할 수 없는 위치에 있음을 알게 된다.  그리고<br>오히려 그 사람을 향한 긍휼한 마음이 생기게 된다.<br>만약 최근 주위 사람들을 심하게 비판적으로 대했다면, 그리고 주변 사람이 매우 짜증이 나고<br>자신을 화나게 한다면 먼저 스스로 자신을 돌아보아야 한다.  는 오늘 우리 아이를 데리고<br>YMCA 에 갔다가 말을 안 듣는 아이의 손목을 잡어 확 채며 '말좀 들어' 라고 외치는 순간 나의<br>어금니가 꽉 깨물어져 있는 것을 발견했다.  뭐 애가 그렇게 잘못했다고 어금니까지 꽉 깨물며<br>6 살짜리 애를 혼내야 하나.  요즘 작은 일에 짜증나는 나를 돌아보며 하나님 앞에 나를<br>직면하는 시간이 적었음을 깨닫는다.</p>"}, {"id": 12, "date": "2011년 12월 29일", "year": 2011, "title": "이번 캐나다 여행의 주제는 덤엔 머더였다", "themes": [4, 12], "content_html": "<p>이번 캐나다 여행의 주제는 덤엔 머더였다. 조카들과 기준이 데리고 식당에 가면서 주유소에<br>들려서 약을 사가지고 베트남식당에 가서 점심을 맛나게 먹고, 계산하려다 보니 평상시 사용하던<br>카드가 없었다. 카드가 어디에 있나 하며 다른 카드로 계산하고 나와 차키를 찾는데, 키가<br>없었다. 그런데 보니 차는 시동이 켜 있는데로 한시간동안 이나 주차되어 있었다는 사실. 더욱<br>놀라운 사실은 주유소에서 계산하고 카드를 받지 않고 왔다는 사실. 나 뭐지?<br>The main theme of our trip to Toronto was \"Dumb and Dumber\". I took my nieces<br>and David to Vietnamese restaurant. On the way to the restaurant, I stopped over<br>at the gas station. I had an wonderful lunch and I tried to pay with my credit card.<br>Then, I could not find the card. I came out after payment with other card, then I<br>realized that I do not have a car key. Where could it be? AHHHHHHH My car was<br>running without me for almost an hour. Then, I went to the gas station and the<br>casher handed the card over to me with big smile thinking 'dumb boy'. What's<br>wrong with me??</p>\n<p>덤엔더머 2 탄<br>그렇게 토론토에서 보스톤으로 돌아오는 길에 호텔에 들려서 잘 잤습니다. 그리고 다음 날 아침<br>식사를 하는 곳에 와플을 직접 만들수 있는 기계가 있었다는 사실. 흥분한 나는 와플가루 믹스가<br>든 주전자를 잘 달구어진 와플후라이팬에 부었는데. 아...<br>그건은 화플가루믹스가 아니라 와플 시럽이었다는 사실. 그것도 메이플시럽.<br>순간 호텔로비는 와플 시럽타는 냄새로 가득했다는 사실. 난 너무 민망해 I am sorry 를<br>연발했고, 일하는 여자가 와서 짜증듯한 표정으로 걸레를 가지러간 사이에 우리 둘째 기현이가<br>와플가루믹스를 잡으려다 그만 엎질렀다는 사실. 정말 쥐구멍을 찾고 싶었다.<br>그 아버지에 그 아들...</p>"}, {"id": 13, "date": "2012년 3월 9일", "year": 2012, "title": "이번에 한국에 가는 하버드 학생들의 이야기를 책으로", "themes": [8, 1, 3, 9], "content_html": "<p>이번에 한국에 가는 하버드 학생들의 이야기를 책으로<br>담았습니다. 연세대학교와 이화여자 대학교에서도 공연<br>을 한다고 합니다^^</p>\n<p>BOOK.NAVER.COM<br>네이버 책 :: 네이버는 책을 사랑합니다.<br>하나님을 노래하는 하버드의 천재들, 아카펠라 그룹 ‘언더 컨스트럭션’ 16명이 만난 나의 하나<br>님. 우리는 완성품이 아니다. 모두 공사 중인 존재다. 하버드의 아카펠라 그룹 ‘언더 컨스트럭션’<br>의 고백이다. 세계 최고의 인재들이지만 하버드 천재라는 이름을 지키기 위해 자기 자신을 채찍<br>질하며 달려간다. 인정받고 싶은 욕망과 미래에 대한 두려움으로 넘어지기도 한다. 그러나 이들<br>은 거기서 포기하지 않는다. 다시 일어나 하나님을 찬양하는 아름다운 노래를 부른다. 하나님을<br>붙잡고 나아가는 하버드의 공부벌레들, 이들이 만난 하나님을 자랑한다. 하...</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/198892496884101?__cft__[0]=AZVx9koZu2FHD35mbvdhi8IW9-A5r3R6uiYo6oUKkvQY7qMrmUl2ySx5ouTMatQ0ajt1AtkhmgZ_QeyRIv1ATu_PaKpuBaV5ujTuWyDXc-UrlXtuORLVL0pS1j0kryoWg0Ez_lzmpDmuTHfFNWqHQvwu-kps6npNLFTjhv6IdEoC1g&__tn__=%2CO%2CP-R", "images": ["pdf1_page10_img5.jpeg", "pdf1_page10_img2.jpeg"]}, {"id": 14, "date": "2012년 3월 13일", "year": 2012, "title": "어제는 직장 동료들과 함께 저희 집에서 맛있는 저녁식사를 했습니다", "themes": [10], "content_html": "<p>어제는 직장 동료들과 함께 저희 집에서 맛있는 저녁식사를 했습니다. Picture taken<br>yesterday at dinner party at my house with my co-workers. It was delicious dinner.<br>Thanks to my lovely wife, Jina Kim</p>", "images": ["pdf1_page8_img5.jpeg"]}, {"id": 15, "date": "2012년 3월 15일", "year": 2012, "title": "저를 아는 모든 분들을 이번 주 토요일 5시 연세대학교로 초대합니다", "themes": [9, 4, 8, 16], "content_html": "<p>저를 아는 모든 분들을 이번 주 토요일 5시 연세대학교로 초대합니다. 제가 여기 보스톤에서 안<br>식년을 지내며 함께 기도하며 한국 콘서트를 준비했던 Under Construction 이 연세대학교에서<br>이번주에 공연합니다. 17명의 하버드 학부생과 연세대학교와 이화여자대학교 학생들이 함께 공연<br>을 꾸립니다. 정말 의미있는 공연이 될 것으로 확신합니다. 꼭 오세요. 입장권 필요없습니다. 여<br>자친구 남자친구 학교친구 교회친구 동네친구 엄마 아빠 동생친구 누나친구 다 함께 오세요^^..<br>그리고 이 글을 share 많은 분들이 뜻깊은 공연을 함께 하면 좋겠습니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/198892496884101?__cft__[0]=AZVx9koZu2FHD35mbvdhi8IW9-A5r3R6uiYo6oUKkvQY7qMrmUl2ySx5ouTMatQ0ajt1AtkhmgZ_QeyRIv1ATu_PaKpuBaV5ujTuWyDXc-UrlXtuORLVL0pS1j0kryoWg0Ez_lzmpDmuTHfFNWqHQvwu-kps6npNLFTjhv6IdEoC1g&__tn__=%2CO%2CP-R"}, {"id": 16, "date": "2012년 3월 26일", "year": 2012, "title": "이게 들어갔으면 이겼을 수도 있었을 텐데", "themes": [12, 2], "content_html": "<p>이게 들어갔으면 이겼을 수도 있었을 텐데. 골문앞 골 결정력 부족^^. If this goal went it, we<br>might have won the championship^^. However, my lack of ability to put it in, we<br>lost;; However, we still were the second place. It was fun last 12 weeks of Boston<br>over 30' indoor soccer league. Thank God.</p>", "images": ["pdf1_page8_img2.jpeg"]}, {"id": 17, "date": "2012년 3월 26일", "year": 2012, "title": "결승전에서 한골차 패배^^", "themes": [1, 5, 12], "content_html": "<p>결승전에서 한골차 패배^^. 그래도 결승까지 갔다는데 만족한다. 지난 10여주 매주 금요일마다<br>나에게 새로운 즐거움을 선사해준 실내 축구리그는 이렇게 막을 내렸다.</p>", "images": ["pdf1_page9_img0.jpeg"]}, {"id": 18, "date": "2012년 3월 30일", "year": 2012, "title": "오늘은 이곳 하버드보건대학원에 있는 북한인권모임에 초청을 받아가...", "themes": [8, 9, 4], "content_html": "<p>오늘은 이곳 하버드보건대학원에 있는 북한인권모임에 초청을 받아가서 함께 영화 '크로싱' 을<br>보고 저들의 질문에 답변하는 시간을 가졌다. 2년 전쯤에 이미 본 영화였는데, 오래간만에 다시<br>보며 흐르는 눈물을 주체할 수 없었다. 그 영화에 나오는 아이의 모습이 마치 우리 둘째 기현이<br>의 모습과 너무 흡사했다.<br>요새 뭔가 보스톤에서 북한을 위한 하나님의 일이 태동하고 있는 것을 느낀다.<br>2주전에는 북한과 남한을 향한 하나님의 뜻이 이루어지기를 위한 기도회를 가졌다.<br>그 기도를 하던 주에 하버드 학생 17명은 남북의 국경에서 북한을 바라보며 기도하는 시간을 가<br>졌다. 그리고, 한국에 있는 새터민 교회에 방문하여 그곳에서 공연도 하고 또 함께 예배하는 시<br>간을 가졌다.<br>금요일 갑자기 버지니아에 있는 새터민 제자에게서 보스톤을 방문하고 싶다는 연락을 받았다.<br>지난 주 토요일에는 하버드 케네디스쿨에서 케네디스쿨 학생들과 Tufts 학교 학생 하버드 학생<br>들과 함께 기도모임을 가졌다.<br>오늘은 하버드 보건대학원에서 영화 크로싱을 봤다.<br>그곳에서 영화를 보고, 나의 이야기를 들은 하버드 대학교 1학년생이 자신의 북한인권모임에서<br>4월 10일에서 11일까지 북송된 31명을 위해 31시간동안 금식하며 기금을 마련하고, 또 영화 크<br>로싱을 본다고 한다.<br>이곳에 버지니아에 있는 새터민 학생이 와서 간증을 하면 좋을 것 같다. 그리고, 그렇게 될 것<br>같다.<br>하나님께서 뭔가 급하게 일하시는 것 같다.<br>오늘 크로싱 영화를 보면서, 중국인들에게 쫓기는 북한탈북자는 바로 우리와 피를 나눈 우리 겨<br>레, 우리 백성이다. 중국에서 쫓겨다니고 팔려다니는 우리 탈북자 동포들을 위해 기도 해야만 한<br>다. 그리고, 저들을 위해서 어떤 일이든 행동으로 옮겨야 한다.<br>지난 번 차인표씨가 방송에서 말한 것처럼. 어렸을때 자신의 머리가 창틀 같은 구멍에 끼어 빠져<br>나오지 못하고, 소리도 지를 수 없을때에 자신과 함께 있던 한 살 많은 형이 울어줘서 그 소리를<br>듣고 어머니가 와서 구해 주었다고 한다. 지금 혼자서 울지도 못하는 중국에 있는 우리 탈북자동<br>포들을 위해 그리고 북한의 우리 동포들을 위해 우리가 울어야 한다. 아니 우리와 전혀 상관 없<br>는 미국 사람들도 함께 울고 있는데, 우리 민족을 위해 우리가 울지 않으면 어떻게 할 것인가?<br>2차 세계대전중 유대인 수용소에 갇혀있던 한 청년이 이렇게 물었다고 한다. 도대체 우리가 무엇<br>을 했기에 이런 고통을 당해야 하나? 한 사람이 대답했다고 한다. 당신이 무엇을 해서가 아니라,<br>아무것도 하지 않아서 이렇게 된 걸세..<br>\"하나님, 제가 해야할 일을 알려주세요!\"</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0mCp2C45Es2CPW3UUG2MUBu32mr6wCYkXXGc7GYAdimTr1PM4ykfqSZcUvJFk9UbLl?__cft__[0]=AZUaFOFZTADofxgbwxQHtOP3RHshOyAZfM4BcfwmNmqWd8r2cho2cbR7-9FL2BIH6FpBvM0WANYFdVcEULhhwupvdLEgaUnTT1YUHl6cYUKNVqdf7ID65nT5W4k_-hOr1fQvi1rLA-AfG7VnCn7eAekH&__tn__=%2CO%2CP-R"}, {"id": 19, "date": "2012년 5월 5일", "year": 2012, "title": "나 하나 꽃 피어", "themes": [8], "content_html": "<p>나 하나 꽃 피어<br>풀밭이 달라지겠냐고<br>말하지 말아라<br>네가 꽃 피고, 나도 꽃 피면<br>결국 풀밭이 온통<br>꽃밭이 되는 것 아니겠느냐<br>나 하나 물들어<br>산이 달라지겠느냐고도<br>말하지 말아라<br>내가 물들고 너도 물들면<br>결국 온 산이 활활<br>타오르는 것 아니겠느냐?<br>-조동화 <나하나 꽃 피어>-<br>그런 생각 많이 하지요, 나 하나 잘 살아 본다고, 정직하다고, 기도한다고 사회가 달라지겠어?<br>이런 생각을 아마도 조동화 시인도 생각해 보았나봅니다.<br>힘내십시오. 당신이 변하고, 나도 변하면 우리 사회가 좋아지지 않겠어요?</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0GPZy8dN82GWTkoLJrFrKeAJQfpybBQSaxGriqjfJk9UtZDPJhrZ725bWLbU7c3mWl?__cft__[0]=AZUBDUuVZNuLGeUBHW9OKVhnIy0gZ-bHKPAkTW0lhoyEYp0kJsdO1ORzPA9u4Gwl25zYtABq7dZyMZHyUvQk-30YGoxrzlomtMnLl6sinbvkzTatF_c6Q9LqqtIMGuDtJvSndaePHRwbU55dtECElKuH&__tn__=%2CO%2CP-R"}, {"id": 20, "date": "2012년 5월 10일", "year": 2012, "title": "걱정과 고민의 원인을 잘 생각해 보면", "themes": [6, 3, 4, 9], "content_html": "<p>걱정과 고민의 원인을 잘 생각해 보면<br>오히려 그 것은 감사의 제목임을 알 수 있다.<br>취업문제로 고민을 하고 있다면,<br>그건 앞으로 무한 가능성이 있다는 이야기다<br>앞으로 있는 시험으로 고민하고 있다면,<br>그건 세상 모든 사람이 부러워 하는 학생이라는 이야기다<br>이성친구 때문에 고민을 하고 있다면,<br>그건 이성친구가 없는 70퍼센트의 사람에게는 행복한 소리다<br>이성친구와 헤어져서 고민을 하고 있다면,<br>당신의 고민 거리가 업어진거다 (앗싸)<br>잔소리하고 매사에 간섭하는 부모님이 있어서 고민한다면,<br>이건 정말 행복한 고민이다<br>자녀 문제로 고민한다면,<br>당신은 자녀를 그렇게 갖고 싶어하는 사람들에게는 부러움의 대상이다<br>직장 상사때문에 고민한다면,<br>당신은 지금 취업 상태이다<br>직장에서 짤릴까 고민이라면,<br>당신은 오늘은 취업상태이다<br>백수라서 고민한다면,<br>오늘을 쉴 수있음에 감사하자<br>물건을 팔지 못해서 고민한다면,<br>당신을 팔 물건을 가지고 있다는 이야기다.<br>뭐 끝이 없는데^^</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02V1bxbtTHTBJc69dKeq8kPDdm76Vx8zoUaH2vNiVrYftkke5VptYYDaiiYozJTzWVl?__cft__[0]=AZVfoTtrosMRcVm9TQCNerI9Twe46CKlGNvmFfNJGEkdp4NIo-8X6-nKgsSHi9M004r4tKxxzQWB_KINDpFP6jSVg082qxxrt8IVywR4RPbQcw2zdkePRxjV5OhiGOcbi15_T279GesrS1rax252xcyt&__tn__=%2CO%2CP-R"}, {"id": 21, "date": "2012년 5월 21일", "year": 2012, "title": "오늘 그 동안 기다려 왔던 영화 코리아를 보았습니다 .", "themes": [1, 6, 11, 5], "content_html": "<p>오늘 그 동안 기다려 왔던 영화 코리아를 보았습니다.<br>영화를 보는 내내 눈물이 났습니다.<br>눈물을 흘리며 생각했습니다.<br>왜 남한과 북한은 왜 둘로 나뉘어져 있어야 하는지,<br>왜 하나가 될수 없는 것인지,<br>그리고, 리분희 선수와 현정화 선수가<br>얼마 전 중국에서 만나는 것을<br>왜 정부는 허락할 수 없었는지<br>다시 생각이 나며 그냥 속상하고 마음이 아팠습니다.<br>눈물을 흘리며 감사했습니다.<br>남과 북의 상황이 최악으로 치닫고 있는<br>이런 때를 예비해<br>하나님은 1991년 지바의 기적을 예비해 놓으셨다는 사실에.<br>그리고, 이런 영화를 우리 민족에 선물하시며<br>‘봐라! 할 수 있다.’ ‘가능한 일이다’<br>라고 격려해 주시는 것 같았습니다.<br>영화에서 처럼, 남과 북이 함께 힘을 합친다면<br>서로의 단점을 보완할 수 있을 것이며,<br>더 나아가 한민족의 사명을 이루어 나갈 수 있을 것입니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid034YJnmZNy66Hc7NqocJTLPJpMsDucFdWhtjPWCgdFvfFyx5ZiF3xhwcDsMRQ6XA9nl?__cft__[0]=AZXGbAMdCj-wa8bbhxm4MDZH24FrHT38donn8DQ-jYSZp2c8MegS0i4BFM3jhTWKmEcTPziioglFuw9qFprSTNaY5BlL18YRmw-QJhcNyOZDPPIEWGv2fRtTeHSescb8ykyLhql6BWv2h1nEj3Uwmfx-&__tn__=%2CO%2CP-R"}, {"id": 22, "date": "2012년 6월 2일", "year": 2012, "title": "청소부 밥 아저씨가 우리에게 주는 인생의 조언:", "themes": [10, 4, 8], "content_html": "<p>청소부 밥 아저씨가 우리에게 주는 인생의 조언:<br>1. 차에 기름이 떨어지면 움직이지 못하는 것처럼 우리 몸도 에너지가 떨어지면 멈춰버리고 맙니<br>다. 지친 머리로는 일 할 수 없듯이 지쳤을 때는 재충전이 필요합니다.<br>첫번째 지침: 지쳤을 때는 재충전 하라.<br>심장이 혈액을 뿜으려면 수축과 이완을 반복합니다. 수축만 가지고는 혈액을 우리 몸에 공급할<br>수 없지요. 쉼이 있어여 우리가 일하는 것이 비로소 가치를 발휘합니다.<br>2.많은 가장이 스스로 자신을 가족을 위해서 희생한다고 생각하며 때로는 가족을 짐으로 생각하<br>기도 합니다.<br>두번째 지침: 가족은 짐이 아니라 축복이다.<br>가족을 짐이 아닌 축복으로 생각하게 되면 가족과 함께 있는 시간도 일을 하는 시간도 모두 즐<br>거워 지기 시작합니다. 오늘 주변의 가족에게 (아버지, 어머니, 형제, 자매, 자녀) 당신의 하나님<br>께서 나에게 보내주신 최고의 설물이라고 고백하세요.<br>3. 어려운 일이 생기면 우리는 투덜대거나, 그 어려운 일의 원인이 되는 것 같은 대상에게 불평<br>하는데 에너지를 소모합니다.<br>세번째 지침: 투덜대지 말고 기도하라.<br>얼마전 이런 이야기를 제가 페북에 썼었지요: \"걱정할 수 있는데 왜 기도하세요?\"^^ 오타가 아닙<br>니다. 얼마나 많은 경우 우리는 기도 대신 걱정을 하는지 돌아보게 됩니다.<br>4. 남에게 자신의 경험을 이야기 하다 보면, 배웠던 것이 자신의 것이 되고, 더 나아가 새로운<br>것들을 배우고 깨닫게 됩니다.<br>네번째 지침: 배운 것을 전달하라.<br>주변을 돌아보세요! 당신의 우리의 도움을 필요로 하고 있는 사람이 반드시 보입니다. 당신이 서<br>있는 그 자리는 당신이 그렇게 원했던 혹은 누군가 그렇게 원했던 자리일 수 있습니다.<br>5. 일생동안 하는 일을 두 가지로 나눌 수 있다. 투자가 될 수 있는 활동과 단순한 소비활동. 별<br>로 중요한 일에 시간과 에너지를 소비하고 있을 때에 스스로 이야기 하자 \"소비하지 말고 투자하<br>라'.<br>다섯번째 지침: 소비하지 말고 투자하라.<br>6. 얼마나 오래 사는가는 중요하지 않다. 어떻게 사는가가 중요하다. 내가 깨달은 삶을 후대에<br>물려주는 삶, 그것만이 진정가치있는 삶이다.<br>여섯번째 지침: 삶의 지혜를 후대 (후배) 에게 물려주라.<br>간단한 여섯가지 지침이지만, 우리의 삶에 실천하기만 한다면, 우리의 삶을 놀랍게 변화시켜줄<br>수 있는 지침입니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid025edi9PTVAsRXwToWKPBTUJ9FFZgnKzmexmeFFR9YnbbjXGni7nThiqQgyRzajeAxl?__cft__[0]=AZW8GeEZiKGNWLuPm33XjC-mMNbfSS2H5ql0PaVJNboQP-gjuoTi1y5OFJzhH3z7ckviRNcgJKaduNIplpDsm0BKgDUduAbIcJTHpC38qGb9u16cQiKNFyzeB8odop1qy-3rLYKDVVgyiYLhAFfLMQWv&__tn__=%2CO%2CP-R"}, {"id": 23, "date": "2012년 6월 2일", "year": 2012, "title": "그대는 배에 대해 알고 있다", "themes": [6, 10, 1, 12], "content_html": "<p>그대는 배에 대해 알고 있다<br>강에 돌을 던지면,<br>돌은 강바닥에 가라앉을 것이다.<br>어떤 돌도<br>꽃처럼 물위에 뜰 수 없다.<br>하지만 만일 그대가 배를 갖고 있다면,<br>그 배는 수십 킬로그램의 돌을 실어도<br>물 위에 뜰 것이다.<br>마찬가지로 그 정도의 고통이 그대 안에 있어도<br>배만 갖고 있다면<br>그대는 여전희 뜰 수 있다.<br>그대는 즐거운 마음으로 배를 저으며 강이나 호수를<br>가로지을 수 있다.<br>깨어 있는 마음이란,<br>감싸 안고, 실어 나르고, 변화시킬 수 있는 배다.<br>우리 안에 있는 고통과 슬픔, 어려움에 대해<br>너무 걱정하지 말라.<br>우리가 배를 가지고 있다면 고통이 우리 안에 있어도<br>우리는 여전히 행복하게 살아갈 수 있다.<br>무명인, 쿠션 208 페이지 중<br>고통중에 있으세요? 희망의 배를 띄우세요^^</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid025edi9PTVAsRXwToWKPBTUJ9FFZgnKzmexmeFFR9YnbbjXGni7nThiqQgyRzajeAxl?__cft__[0]=AZW8GeEZiKGNWLuPm33XjC-mMNbfSS2H5ql0PaVJNboQP-gjuoTi1y5OFJzhH3z7ckviRNcgJKaduNIplpDsm0BKgDUduAbIcJTHpC38qGb9u16cQiKNFyzeB8odop1qy-3rLYKDVVgyiYLhAFfLMQWv&__tn__=%2CO%2CP-R"}, {"id": 24, "date": "2012년 6월 2일", "year": 2012, "title": "제가 있는 보스톤은 지금 토요일 아침입니다", "themes": [15, 8, 3, 5], "content_html": "<p>제가 있는 보스톤은 지금 토요일 아침입니다. 동네 커피샵 창가에 앉아 있는데, 밖에는 비가 주<br>룩 주룩 내리고 있습니다. 제가 안식년으로 거의 1년전 보스톤에 왔을 때 시차 적응을 못해 새벽<br>에 잠에서 깨어나 왔어던 거피샵이지요^^.<br>처음 이곳에 와서 1년을 계획하며, 하고 싶은 일들, 성취하고 싶은 일들을 막 계획했던 기억이<br>납니다.<br>오늘 이곳에 와서는 이제 한 달여 남은 보스톤의 생활중 꼭 해야 할 일들을 정리하게 되네요.<br>오늘은 오래 전에 읽었던 '쿠션' 을<br>다시 한 번 읽어보면서 다시 한 번<br>여러모로 그 내용과 공감하게 됩니<br>다. 우리 삶에는 여러가지 일들이<br>끊이 없이 일어나지요. 친구와의 관<br>계, 해야하는 과제, 동료와의 말다<br>툼, 배우자와의 의견대립, 재정적인<br>어려움, 오래동안 꿈꿔왔던일의 실<br>현, 작업 성취.. 등등.<br>이러한 일이 일어날 때에 우리는<br>reaction 하거나 response 할 수<br>있습니다. reaction 은 작용에 대한<br>반작용이라고 할 수 있지요. 쉽게<br>이야기하면 '짜증 나는 일에' '짜증'<br>을 내고, '화나는 일' 에 '화를 내는'<br>것이지요.<br>반면에 response 는 reaction 과<br>달리 자신의 내면의 생각과 자신의<br>반응이 자신과 다른 사람에게 어떠한 결과를 가져올 지, 그리고 왜 이러한 일이 생긴 것인지를<br>충분히 고려하고 반응하는 것을 의미하지요.<br>그래서 우리가 알고 있는 책임감이란 단어 responsibility 를 response 와 ability 란 단어가<br>합쳐져 이루어져 있는 것이지요.<br>어제는 살짝 걱정할 일이 있어서 제가 걱정으로 reaction 을 하는 바람에 저의 아내와 애들도<br>살짝 걱정을 하게 만들었었습니다. 그런데, 사실 우리를 사랑하시고, 우리의 모든 것을 알고 또<br>주관하시는 하나님을 묵상하고 나니, 저의 걱정을 기우였음을 다시 한 번 깨닫게 되네요.<br>보다 responsibility 있는 사람이 될 수 있기를 스스로 기도합니다.<br>그리고, 앞으로 남은 한달이라는 보스톤의 생활과 일어나는 일들에 적절하게 반응 할 수 있는 제<br>가 될수 있기를 기도 부탁드립니다</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid025edi9PTVAsRXwToWKPBTUJ9FFZgnKzmexmeFFR9YnbbjXGni7nThiqQgyRzajeAxl?__cft__[0]=AZW8GeEZiKGNWLuPm33XjC-mMNbfSS2H5ql0PaVJNboQP-gjuoTi1y5OFJzhH3z7ckviRNcgJKaduNIplpDsm0BKgDUduAbIcJTHpC38qGb9u16cQiKNFyzeB8odop1qy-3rLYKDVVgyiYLhAFfLMQWv&__tn__=%2CO%2CP-R", "images": ["pdf1_page15_img2.jpeg"]}, {"id": 25, "date": "2012년 6월 8일", "year": 2012, "title": "약 1년전 미국에와서 가진돈 털어 차사고 ,", "themes": [1, 6, 4, 7], "content_html": "<p>약 1년전 미국에와서 가진돈 털어 차사고,<br>When I first came to Boston about a year ago<br>집 수리하고, 애들 학원비 내고 남은 잔고 60불<br>I used up most of my money buying car, fixing the house and for my son's tutor<br>Only had about 60 dollar in the bank<br>아직 월급날은 일주일이 남고,<br>I still had another week for my pay day,<br>자전거를 타는 것은 레저가 아니라 차비를 아끼기 위한 생계형,<br>One hour bike ride to work wasn't for leisure nor for health, I could not afford the<br>train ride (4.25$ each way)<br>도시락을 싸는 것과, 점심시간에 빵주는 세미나를 가며 점심값을 아끼던 무렵,<br>Packing lunch and finding lunch hour seminar with free food was a necessity<br>배고파 주머니에 있는 동전을 탈탈 털어<br>I was hungry one afternoon,<br>All I could find was few coins in my pocket<br>던킨 도너츠에서 보스톤 크림이라는 도너츠를 사서 손에 들고<br>I bought a Dunkin donut, boston Kream, my favorite<br>너무 흡족해 했던 시간..<br>I was happy and all worries disappeared<br>도너츠를 먹으려고 하던 순간 그만 그 도너츠를 땅에 떨어뜨리고 말았다.<br>The moment I tried to eat the donut<br>아뿔싸.....<br>oops----<br>I dropped the donut<br>난 누가 볼까 잽싸게 떨어진 도너츠를<br>주워 먹고<br>Without the second thought,<br>I picked up the donut before<br>anybody notice<br>든 두 가지 생각<br>I put the donut in my mouth,<br>after blowing the dust away<br>맛. 있. 다.<br>거. 지. 같. 다.<br>I felt like that I am a street<br>person,<br>Humble moment<br>물론 나의 가정의 경제공황은 잠시였지<br>만,<br>Thank God that my financial crisis did not last,<br>난 지금도 기분이 우울할 때면,<br>Still, When I get depressed, I still go to the same place,<br>던킨 도너츠에 가서 보스톤 크림을 사들고<br>with donut in my hand<br>내가 일하는 병원을 바라보며<br>Overlooking the hospital I work<br>도너츠를 먹는다.<br>Put Boston Kream donut in my mouth<br>세상이 달라보인다.<br>The world is happier place.<br>일상을 탈피하기 위해 꼭 미친 짓을 해야 하는 것은 아니다<br>We do not have to do strange things to get out of ordinary<br>도너츠를 살 돈이 있음에 감사하고,<br>Thank God for changes for donut<br>학원비를 내야할 자녀가 있음에 감사하고,<br>Thank God that I have kids that I need to worry for their education<br>안식년을 나올 수 있었음에 감사하고,<br>Thank God for my year in Boston<br>돌아갈 일상이 있음에 감사한다<br>Thank God for I have a place and job to go back after Boston</p>", "images": ["pdf1_page16_img0.jpeg"]}, {"id": 26, "date": "2012년 6월 27일", "year": 2012, "title": "이번 주일 설교시간에 목사님께서 요한 복음의 예수님의 기도에 대...", "themes": [8, 7, 13, 10], "content_html": "<p>This Sunday, our pastor preached about the work of Jesus, which truly made an<br>everlasting impact in the lives of everyone. Then, he gave us an example of<br>unknown Canadian missionary to Korea who gave his life for the work of God. I<br>was deeply moved by the sermon and said a prayer that I would also be nameless<br>and faceless for Jesus.<br>이번 주일 설교시간에 목사님께서 요한 복음의 예수님의 기도에 대해 설교하시다가 1889년부터<br>46년간 한국에서 사역을 하시다가 주님의 품으로 돌아가신 평신도 선교사님의 이야기를 하시는<br>것을 듣게 되었다. 그분의 삶의 이야기를 들으면서, 깊은 감동을 받았고, 이분의 사역이 유명하신<br>언더우드 선교사님의 사역 보다 작지 않다는 생각을 하게 되었다. 그리고, 이어서 기도했다. “하<br>나님 저도 펙윅 선교사님 처럼 이름도 없이 (nameless) 그리고 얼굴도 없이 (faceless) 사역을<br>하게 해 주세요”.<br>Since this Sunday was my last Sunday service, our pastor introduced us to the<br>whole congregation after the sermon. Then, he started the benediction including<br>the prayer of blessing for our family. Then, we could tell that he forgot my name.<br>It is impossible for him to forget my name since he knows us well and just<br>introduced us to the whole congregation. It was a sign that God listened to my<br>prayer about the “nameless”.<br>설교를 마치시고 목사님께서 우리 가정이 이제 보스톤 생활을 마치고 한국으로 돌아가게 되었다<br>며 우리 가정을 인사시키셨다. 그리고 이어 광고를 마치며 우리 가정을 위해 기도하시다가, 내<br>이름을 잊으시는 일이 생겼다. 이런 일은 불가능한 것이, 목사님은 우리 가정을 잘 알고계시며,<br>더 나아가 방금 우리 가정을 소개하셨기 때문이다. 하나님께서 내가 기도했던 “Nameless” 의 기<br>도를 들으신 것이었다. 목사님께서는 인사 시간에 매우 미안해 하셨다.<br>Then, today, I have received the most amazing gift from Maria, who I have been<br>helping with exercise for last one year. She drew this picture and then she<br>contemplated with her son whether to draw my face or not then decided not to<br>draw face. God answered my another prayer about “faceless”. It was a confirmation<br>that God answered my prayer.<br>그리고, 오늘 내가 지난 1년간 가르치던 암환자 운동 교실에 참여하던 사람이 나를 위해 마련한<br>송별회 장소에서 그림 하나를 선물 받았다. 그 그림은 그 친구가 직접 그린 그림으로서 사람들의<br>얼굴을 그릴까 말까 아들과 밤 늦게 까지 고민하다가 얼굴이 없는 작품을 새벽 두시 까지 작업<br>을 해서 나에게 오늘 선물 했다 (바로 밑에 있는 그림). 하나님께서 “faceless” 의 기도를 들으셨<br>다는 사인이었다.<br>“Nameless and Faceless”. Lot of people want their face to be known like a TV star,<br>and also their name to be recognized by other people. Sometimes, the reason why<br>we do good acts is because we want our name and face to be known. We all want<br>some kind of “spectacular things” to happen in our lives. I think that is cool.<br>However, what really matters in our life is not the spectacular thing, but it is<br>significant thing.<br>‘이름도 없이 얼굴도 없이’ 많은 사람들 (나를 포함해서)이 연애인처럼 유명해지고 싶고, 또 우리<br>의 이름이 알려지기를 원하는 마음이 있다. 때로는 우리가 좋은 일에 참여하고 봉사하는 이유가<br>좀 더 우리의 이름과 얼굴이 알려지기를 원하는 마음이 강하기 때문에 그 일을 하는 경우도 있<br>다. 그래서, 누군가 우리를 알아주지 않으면 섭섭해진다. 그런데, 우리가 알아야 할 것은 우리의<br>삶에서 멋진 것을 추구하는 것을 조심해야 한다는 것 이다. 멋진 것 (spectacular) 보다는 중요<br>한 것 (significant) 에 집중해야 한다.<br>The work of Jesus was not spectacular at all (especially how He died on the cross)<br>but it was the most significant thing ever done by anybody in the history of the<br>world. 예수님의 사역은 절대 멋지지 않았다. 그러나, 세상에서 가장 영향력있고 중요한 일이었<br>다.<br>내가 이곳 보스톤에서 안식년을 1년간 지내면서 하나님께서 깨닫게 하신 것은 나의 부족함이다.<br>정말 내가 얼마나 보잘 것 없고, 하나님의 도움이 없이는 단 하루도 살아갈 수 없다는 사람인 것<br>을 깨닫게 하셨다. 더반에서 평창 동계올림픽을 성공적으로 유치하고, 이곳 하버드 대학교의 세<br>계 최고의 암센타에서 세계 최고의 암전문의들과 어깨를 맞대고 연구하며, 나도 뭔가 중요한 사<br>람인양 착각했던 나의 생각을 하나님께서 완전히 깨뜨리셨다.<br>그리고 오늘! 내가 지난 일년간 사실 보잘 것 없다고 생각했던 암환자들의 운동교실을 마지막 가<br>르치면서 깨달았다. 교수로서 그룹 운동을 가르쳐 본지가 정말 언제 였는지…. 학부생 혹은 대학<br>원 생들이 하는 일들을 여기에서 하면서, 처음 8개월 간은 석사급 연구원의 운동 지도사를 도와<br>자원 봉사를 하다가, 마지막 4개월 내가 직접 운동을 가르치는 일을 하면서… 내가 뭐하는 건가<br>하는 생각도 많이 들었다. 이런 일 보다는 세계 최고의 학술지에 멋지게 논문 하나 발표하고 한<br>국 신문에 한 번 날 만한 일을 해야 하는 것 아닌가 하고 생각했었다. 그리고, 이곳에 있으면서<br>그런 곳에 논문도 많이 투고했었다. 그런데, 하나님께서 진정 기뻐하신 일은 이곳에서 암으로 고<br>통 받고, 운동을 통해 극복하려고 노력하는 저분들에게 웃음을 드리고, 미소 지어 드리고, 간단하<br>나마 운동 가르쳐 드리고, 무엇 보다 예수님의 사랑을 저분들 한 분 한 분을 섬기는 일이었나 보<br>다. 그리고, 그것을 1년간의 보스톤의 삶이 끝나는 날 깨닫게 되었다.<br>Today, I realize that what makes God happy is not the publication at the Journal<br>of Clinical Oncology (very significant) and making my name known. But, what<br>makes God happy is making myself available to cancer survivors I work with and<br>willingness to take a job which I would normally assign my undergraduate<br>practicum students or graduate students to do.<br>하나님께서는 이 사실을 오늘 그림을 통해서 다시 깨닫게 하셨다. 이 마음 잊지 않고, 또 잃지<br>않고 한국으로 돌아가야겠다.<br>God made me realize this through the faceless picture I received today.<br>Thank you Maria for the beautiful picture and thank you ladies for being my<br>friends here in Boston. I will never forget you</p>", "images": ["pdf1_page17_img2.jpeg"]}, {"id": 27, "date": "2012년 7월 1일", "year": 2012, "title": "you God", "themes": [3, 6], "content_html": "<p>This is how we left Boston/Newton. Thank you Boston. Thank you everyone. Thank<br>you God. 이렇게 우리는 보스톤을 떠났습니다. 그동안 저희에게 많은 사랑을 베풀어주신 모든<br>분들께 감사를 드립니다. 저희는 앞으로 한달간 캐나다에 있습니다. We will be in Canada<br>for next one month (Calgary/Edmonton).</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02vKVkswr3fgy1mw3nSvSuLcaCWjNi1vkMvGbcz21SyvJJagkBMS1jejEAxpxnfh1Ql?__cft__[0]=AZVq60MF36iW_IHRGxU5JoWIkpeiNfIxFW82C6M1Eeg6Bv9woVVLJ67gTzjB6NnbmYCiq8d2vitLMkJ0AgkLAQAI14jy0epAvpIxVCboIGhgqgY_iAybjymXmKr_zjstIuKGSJSoSwK_4HDV_lMCThFA&__tn__=%2CO%2CP-R", "images": ["pdf1_page19_img0.jpeg"]}, {"id": 28, "date": "2012년 7월 27일", "year": 2012, "title": "사람이 교만하면 낮아지게 되겠고 , 마음이 겸손하면 영예를 얻으리라", "themes": [7, 1, 10, 8], "content_html": "<p>A man's pride bring him low, but a man of lowly spirit gains honor. Proverb 29:23<br>사람이 교만하면 낮아지게 되겠고, 마음이 겸손하면 영예를 얻으리라. 잠언 29:23<br>If suffering brings lowly spirit, can we say anything bad about the suffering. The<br>suffering is actually blessing.<br>On the other hand, if the success brings pride, can we say anything good about the<br>success? The success is actually cursing.<br>만약에 고난이 우리를 겸손하게 하면, 과연 우리는 그 고난을 나쁜 것이라고 할 수 있겠는가? 고<br>난은 사실 축복인 것이다.<br>반면에, 우리의 성공이 우리를 교만하게 하면 그 성공을 좋은 것이라고 할 수 있겠는가? 성공은<br>사실 저주인 것이다.<br>The true success is to remain humble while things are all well. 진정한 성공은 모든 일<br>이 다 잘 되어질 때에 겸손하게 남아있는 것이다.<br>However, sufferings do not necessarily bring humility. Many times, sufferings bring<br>anger, resentment, and bitterness toward people and GOD. 그러나 고난은 반드시 우리<br>에게 겸손을 안겨주는 것은 아니다. 고난은 많은 경우, 분노를, 증오를 그리고 다른 사람과 하나<br>님을 원망하게 만든다.<br>Therefore, the author of proverb also mentioned \"Above all else, guard your heart,<br>for it is the wellspring of life\". 그렇기에 잠언의 저자는 또한 기록하기를 \"무릇 지킬 만한<br>것보다 더욱 네 마음을 지키라 생명의 근원이 이에서 남이니라\".<br>It is upto us to respond to the suffering with thankfulless and humility or<br>resentment and anger. Therefore, we need to guard our heart and mind with the<br>love of God and his Son. 그리고, 우리가 처한 고난에 감사와 겸손으로 반응할 것인지, 아니<br>면 분노와 원망으로 반응할 것인지는 우리에게 달려있다. 그래서, 우리는 우리의 마음과 생각을<br>하나님과 예수님의 사랑으로 담아야 한다.<br>We need to see things with the eyes of the author of life. 우리는 우리의 삶의 일어나<br>는 일들을 우리의 삶의 저자 (author) 이신 하나님의 관점에서 바라봐야 한다.<br>Wanting to be humble in spirit,<br>겸손을 사모하며,</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02vKVkswr3fgy1mw3nSvSuLcaCWjNi1vkMvGbcz21SyvJJagkBMS1jejEAxpxnfh1Ql?__cft__[0]=AZVq60MF36iW_IHRGxU5JoWIkpeiNfIxFW82C6M1Eeg6Bv9woVVLJ67gTzjB6NnbmYCiq8d2vitLMkJ0AgkLAQAI14jy0epAvpIxVCboIGhgqgY_iAybjymXmKr_zjstIuKGSJSoSwK_4HDV_lMCThFA&__tn__=%2CO%2CP-R"}, {"id": 29, "date": "2012년 8월 31일", "year": 2012, "title": "그리고 , 이제는 고난이 없으려나 했더니", "themes": [7, 8, 1, 3], "content_html": "<p>그리고 , 이제는 고난이 없으려나 했더니<br>다른 모양의 고난이 제 삶에 계속 다가오네요<br>하지만 , 이제 모든 것을 내려놓고 나니<br>이런 고난이 저를 겸손케는 하지만 ,<br>저를 심하게 힘들게 하지는 않습니다 .<br>하나님의 은혜입니다 .<br>정말 저는 연약한 사람입니다 .<br>저는 주님의 도움이 필요한 사람입니다 .<br>저는 주님의 도움이 없으면<br>아무 것도 할 수 없는 사람입니다 .<br>제 주변의 사람을 사랑할 수 있는<br>어떠한 선한 것도 제 안에는 없습니다 .<br>주님의 은혜가 아니라면 ,<br>저는 밥 먹듯이 죄를 짓고 또 짓고<br>학생들 앞에서는 거룩 한 척하는 가식덩어리 교육자이고 ,<br>가식덩어리 신앙인 일 수 밖에 없습니다 .<br>하지만 , 이러한 부족함에도 불구하고<br>저를 사랑해 주시고<br>저를 인정해 주시고<br>저를 품어주시는<br>그분 앞에<br>다시 한 번 저의 삶을 온전히 내려놓을 수 밖에 없습니다 .<br>그분께 제 삶을 다시 한 번 드립니다 .<br>앞으로 또 넘어질 저의 연약함과<br>나름 제 안에 있는 모든 쓸만한 것들을 함께 드립니다 .<br>주님 사랑합니다 .</p>"}, {"id": 30, "date": "2013년 1월 23일", "year": 2013, "title": "정말 제게 안식이 필요하였을 때에,", "themes": [8, 10, 13, 1], "content_html": "<p>정말 제게 안식이 필요하였을 때에,<br>하나님의 은혜와 선배 교수님들의 배려로 안식년을 가게 되었습니다.<br>2011년 7월부터 2012년 8월까지....<br>정말 미국으로 향하는 비행기가 일본을 경유해 가면서<br>몸은 피곤했지만, 마음만은 정말 가벼웠습니다.<br>‘이제 진짜 안식이다’<br>내가 하고 싶었던 연구 한 번 원 없이 하고<br>가족과함께 좋은 시간도 보내고<br>주님 안에서 안식도 누리고<br>보스톤의 오랜 친구들도 만나고<br>하지만 이런 나의 생각은 오래지 않아 깨져 버렸습니다.<br>누군가 그러더라고요 전지전능한 조교가 없는<br>교수의 삶은 고난의 연속이라고<br>원래 제가 대학원생들의 의존도가 높았던 것은 아니었지만<br>하나부터 열까지 미국에서의 모든 일들을 혼자 해 내는 것이<br>불편하기는 해도 힘들지는 않았습니다.<br>제가 안식년을 가기 전에 읽었던 마지막 책 중에 하나는<br>꿈꾸는 다락방이었습니다.<br>그리고 우리 대학원생들에게<br>구체적으로 꿈을 꾸면 그대로 이루어진다고<br>열변을 토하고 한국을 떠났죠.<br>정말 그랬습니다.<br>제가 하는 연구분야의 최고의 연구자들과 함께<br>공동연구를 하리라고는 상상하지 못했었죠.<br>그런데 하나님은 제게 꿈꾸게 하셨고<br>그 꿈은 실제 현실이 되어,<br>하버드 의대의 대장암과 유방암의<br>최고 전문가와 연구를 하게 되었으니까요<br>그리고, 미국에 도착한지 한 두 달이 지났을 때에<br>우연이 제가 미국 Joslin Diabetes Center에서<br>포닥을 할때에 알고 지내던 교수를 만났고,<br>그 교수는 저에게 Joslin Diabetes Center 의<br>화요 세미나에 와서 특강을 해달라고<br>했습니다. 이 특강 시리즈는<br>제가 Joslin Diabetes Center에서 포닥을 하면서<br>나도 언젠가는 저곳에 서서 후배 포닥과<br>하버드 의대 교수들을 대상으로<br>특강을 하는 날이 올까?<br>라고 꿈을 꾸게 했던 특강이었습니다.<br>그 꿈이 현실이 된 것이죠.<br>그곳에 서서 특강을 하면서,<br>그때까지만 해도<br>꿈을 꾸면 다 이루어지는 줄 알았습니다.<br>그런데, 그때부터 일들은 꼬이기 시작했습니다.<br>큰아들 데이빗의 학교에 문제가 생기고,<br>나는 밤새 한국과 전화를 하고<br>데이빗의 학교 담임에게,<br>영어선생님과 교장선생님에게 밤을 세워<br>이메일을 보내야 했고,<br>작은 아들 데니얼은 팔이 부러져<br>병원에 입원해 수술을 받고<br>(보험이 없었다면 수천만원의 치료비가 나올 뻔 했죠)<br>한국에서 가져온 돈은<br>미국에 정착을 하는데 다 써버리고<br>월급날이 아직 열흘 이상 남았는데,<br>은행 잔고는 60불을 가리키고<br>미국에서 돈을 빌릴 줄 있을 줄 알았는데,<br>은행 대출은 불가라고 나오고,<br>한국의 은행에 돈을 빌릴려고 했더니,<br>직접 와서 도장을 찍지 않으면<br>대출이 불가능하다고 하고<br>미국에서 논문을 새롭게 써서<br>제출하는 논문마다 개제 불가를 받고<br>(아마 내 인생 최다연속 논문게제<br>실패기록을 세웠을 것입니다),<br>나의 공동연구자들에게 뭔가 보여줘야 한다는 압박감은 나를 누르고,<br>내가 살고 있는 집은 여러 가지고 문제가 생기고,<br>변기를 내가 직접 사다 갈아야 하고,<br>아랫집에 사는 이웃과의 관계도 쉽지않고,<br>그 가운데에 이전에는 시험 같지도 않은 것들이<br>나를 흔들고<br>나는 내가 원하는 것을 하지 않고,<br>내가 원하지 않는 것들을 하고 있는 나를 발견하였습니다.<br>내가 그동안 믿고, 확신했던 나의 모든 믿음과<br>그 믿음 가운데 순종하면서 했다고 생각했던<br>나의 모든 행위가<br>가식처럼 느껴졌습니다.<br>그 가운데 제가 확신할 수 있었던 단 한 가지는<br>정말 내가 얼마나 큰 죄인인가라는 것이었죠.<br>아니, 절대로 입바른 소리로<br>제가 죄인이라고 고백하는 것이 아니라,<br>저는 정말 죄를 많이 지었고,<br>그렇기 때문에 죄인이라고<br>고백할 수 밖에 없게 저를 만드셨습니다.<br>그리고, 이런 죄인인 내가 구원을 받을 수 있다면,<br>그것은 오직 내 죄를 위해서 대신 죽으신<br>예수님의 은혜 때문이라는 것이라는 것을<br>온 몸으로 깨달았습니다.<br>이런 나의 안식년은<br>내가 생각했던 안식년이 아니었습니다.<br>나는 나름대로 내가 잘나가는 교수라고 생각했는데,<br>나는 그저 후진국 (미국에 비해)에서 온<br>가난한 학자 중에 한 사람일 뿐이었고<br>세계적인 연구를 하는 주변의 사람들 앞에서<br>노력하지만 잘 안 풀리는 그런 사람이었습니다.<br>하지만, 그 가운데에 하나님께서<br>제게 시키신 일이 있었습니다.<br>그곳에서 암환자들에게 운동을 가르치는<br>석사 출신의 운동처방사를 도와<br>다양한 암과 싸우고 있는 환자들에게<br>운동을 가르치는 일이었습니다.<br>사실 뭐 운동을 가르친다고 할 수도 없었죠<br>그곳에서 가르치는 석사출신의 처방사를 도와<br>그 친구가 운동을 가르치는 동안<br>편하게 운동을 가르치게 할 수 있도록<br>옆에서 큰 소리로 (제가 목소리는 좀 크죠) 숫자를 세어주었습니다.<br>사실 제가 교수로서<br>보통은 이런 운동을 직접 가르치기 보다는<br>대학원생들이 이렇게 운동을 가르칠 수 있도록<br>지도해 주는 일을 했죠.<br>그런데, 미국에서 운동을 가르치는 사람을<br>보조하는 일을 한 거죠.<br>그곳에서 그런 일을 하면서,<br>이런 생각을 했죠.<br>“우리 학생들은 내가 하버드에 가서<br>뭔가 대단한 일을 하고 있으리라 생각했을텐데,<br>난 여기서 이렇게 운동 처방사<br>시다를 하고 있다!”..<br>그런데, 저는 (한 두 번을 제외하고)<br>이 수업을 빼먹을 수 없었습니다.<br>그저 그곳에서 숫자를 세어주는 일이지만,<br>매번 만나는 암환자들을 격려해 주고,<br>하이파이브 해주고, 함께 웃어주고,<br>이야기를 들어주는 일은<br>그래도 내가 미국에서 하는 일 중에<br>가장 보람 있는 일이었기 때문이죠.<br>그렇게 9개월 정도 운동처방사 시다를 했더니,<br>그 친구가 미안했는지<br>저보고 직접 운동을 가르쳐달라고 하더군요,<br>나는 내가 뭔가를 시작한 후에<br>곧 떠나야 하는 미안함에<br>사양했지만,<br>그런 마음이라면 상관하지 말고<br>운동을 가르쳐 달라고 하기에<br>새로운 운동을 개발하여 저들에게<br>나름 필요하다고 생각되는 운동을<br>재미있고, 활기 넘치게 재롱을 피우면서 운동을 가르쳤습니다.<br>어느덧 나의 안식년이 다 끝나고<br>미국을 떠나야 할 시간이 다 되었습니다.<br>그리고, 내가 섬기던 캠브리지 한인 교회에서의<br>마지막 예배를 드릴 시간이 되었죠.<br>정말 힘든 나의 보스톤에서의 삶에서<br>나에게 생수를 공급했던 예배<br>그곳에서 믿음의 형제 자매들을 만났고,<br>특히 사랑하는 후배 성기주 집사와 신경섭집사가정과의 교제는<br>우리 가정에 큰 기쁨과 소망을 주었습니다.<br>그 교회에서의 마지막 예배에서<br>김태환 목사님은 한 선교사 분의 이야기를 나누었습니다.<br>처음 들어보는 이름의 선교사였습니다.<br>하지만, 언더우드 선교사님과<br>거의 같은 시기에 한국에 와서<br>수십년간 시골의 교회를 섬기시다가 본국으로 돌아가신 선교사님의 이야기였죠<br>아무도 그분의 얼굴과 이름은 기억하지 못합니다.<br>하지만 하나님에게 그분이 하신 일들은 절대로 적은 일이 아닐 것입니다.<br>저는 그 설교를 들으면서<br>가슴이 뜨거워지는 것을 느꼈습니다.<br>나.도. 저.렇.게. 살.고. 싶.다.<br>아무도 기억해 주지 않아도,<br>아무도 내가 한 일을 알아주지 않아도,<br>하나님만 알아주신다면 그것으로 만족할 수 있는 삶<br>그리고, 눈물로 기도했습니다.<br>Nameless, Faceless 얼굴도 없이, 이름도 없이<br>그런 삶을 살겠습니다. 주님!<br>주님만 알아주시면 됩니다.<br>그런 삶을 살도록 도와주십시오.<br>눈물로 흐느끼면 기도를 하고보니 교회의 광고시간이었습니다.<br>목사님께서 여러 가지 광고를 하기고,<br>늘 그렇듯이 교회에서<br>누군가 한국에 돌아가는 사람이 있으면,<br>아쉬운 마음으로 목사님께서 광고를 하시듯이<br>우리 가정을 일으켜 세우시고,<br>목사님은 교인들에게 인사하게 하셨습니다.<br>그 인사를 마치고 목사님은 축도를 하기 시작하셨습니다.<br>하나님 그동안 보스톤에서 일년간 안식년을 마치고<br>한국으로 돌아가는 .....................................................<br>목사님께서 감정에 복받쳐 말씀을<br>이어가지 못한 것이 아니라<br>제 이름을 까먹으셨습니다.<br>그래도 1년간 여러 가지로 우리를 챙겨주시고<br>불과 일 이분 전만해도 제 이름을 똑똑히 부르시며 광고를 하셨는데,<br>그리고 제 이름이 아니라 제 아내의 이름 안식년을 마치고 돌아가는 ‘김진아’ 집사님 가정과<br>....... 그리고 생각이 나셔서 ‘전용관 집사 가정에도 하나님의 놀라운 축복이 함께 하시길... 성부<br>와 성자와.... 이렇게 힘들게 축도를 마치셨습니다.<br>축도를 마치고 기도를 하는데,<br>저는 다시 한 번 감격해서 울 수 밖에 없었습니다.<br>하나님께서 바로 수분 전에 기도했던<br>Nameless 의 기도를<br>하나님은 들어주신 것입니다.<br>하지만 목사님은 이름을 까먹을 것이 미안하셨는지<br>저를 보지자마자 어쩔 줄 몰라 하셨습니다.<br>저는 그런 목사님을 괜찮다고 위로해 드릴 수 밖에 없었죠.<br>그리고, 제가 가르치던 암환자 운동 수업도 마지막 시간이 되었습니다.<br>그곳에서 저를 따르던 몇 몇 할머니와 아주머니들은<br>제가 떠나기 몇 주 전부터 슬퍼하셨습니다.<br>그런테, 그중에서도 저를 가장 좋아하던<br>마리아라는 아주머니는<br>그날 결석을 하셨습니다.<br>작별 인사를 못하는 것이 못내 아쉬웠지만<br>어쩔 수 없었죠.<br>그렇게 마지막 수업을 하고,<br>그 분들이 요리를 하나씩 해 와서<br>파티를 준비한 장소에 가보니<br>수업에 결석을 했던 분이 미리 와서<br>그곳을 다 세팅해 놓고 있었습니다.<br>음식을 먹기 전에 갑자기<br>그 분이 그림 같은 것을 하나 가지고 오셨습니다.<br>그리고, 그림을 열어 제게 보여주는 순간 저는 순간 북받쳐 오르는 감정을 주체할 수 없었습니<br>다.<br>그림은 제가 앞에서 운동을 가르치는 모습이고,<br>저를 따라 운동을 하는 암 환자가 신발이 없던 환자에게 신발이 신겨지고 점점 건강해 진다는<br>것을 상징하는 그림이었습니다.<br>그런데, 더욱 놀라운 것은,<br>그 그림에 모든 등장인물에<br>얼굴이 없는 것이었습니다.<br>말 그대로 faceless 였죠.<br>그리고, 제가 묻기도 전에 이런 이야기를 했습니다.<br>어제 밤에 그림을 그리다가, 얼굴을 그릴까 말까 아들과 고민하다가<br>그리기 않기로 결정했다고,<br>그 자리는 바로 간증의 시간이 되었고,<br>저는 그곳에서 주님께서 저로 기도하게 하셨던 nameless 와 faceless 를 간증했습니다.<br>그리고, 저와 함께 운동을 가르치던 Nancy 라는 운동 처방사는 제 어깨에 얼굴을 파뭇고 약 오<br>분간 흐느끼며 거의 통곡 수준의 오열을 했습니다.<br>그리고, 그분들과 함께 기념 촬영을 마쳤습니다.<br>그중에 몇 분은 이미 하늘 나라에 올라가셨죠.....<br>그리고 생각했습니다.<br>제가 처음 하버드에 교환 교수를<br>갈 때만 해도 저는 이런 생각이었습니다.<br>세계 최고의 학자들과 함께 공동연구를 하고<br>그 연구의 결과를 세계적인 학술지에 발표하여<br>이름을 알리고 (nameless 와는 정반대로)<br>방송 인터뷰를 통해서 얼굴을 알리고<br>(faceless 와는 반대로)<br>‘이 모든 영광을 하나님께 돌립니다’ 라고<br>입술로는 고백을 할 지 모르지만<br>마음 속으로는 제 이름과 얼굴을 알려보려는 생각이 가득했지요.<br>그리고 이런 생각이 들었습니다.<br>어쩌면 내가 보스톤에서 일년간 있으면서 했던<br>그 어떤 일들보다<br>정말 세계적인 학자들 앞에서<br>내 연구 결과를 발표하고,<br>세계적인 학자들과 학문을 논의하며<br>새로운 연구 결과를 논의하고<br>아무도 해 보지 않은 새로운 연구를 논의했던 것 보다<br>정말 내가 경시여기고<br>직접 운동을 가르친 것도 아니고,<br>운동보조원으로 암환자들과 함께했던 그 시간<br>그 시간을 하나님께서는 더욱 인정해 주신 것이 아닐까...........<br>그러면서 하나님께서 제 삶의 모토로 주신 말씀이 생각이 났습니다.<br>Not spectacular, but significant 멋진 일이 아니라 중요한 일을 추구하라.<br>우리가 멋진 일을 해 내는 것을<br>우리 삶의 목표로 삶으면<br>우리는 실패할 수 밖에 없습니다.<br>아니, 우리는 반드시 실패자가 될 것입니다.<br>그러나, 비록 멋진 일은 아닐 지라도<br>중요한 일을 위해 우리 삶을 드리면,<br>우리는 반드시 성공하는 삶을 살 것입니다.<br>이 땅에서의 예수님의 삶은<br>절대로 멋진 삶은 아니었습니다.<br>자신이 3년간 심혈을 기울인 제자들에게서<br>배신을 당하고,<br>자신이 그토록 사랑했던 사람들에게<br>침뱉음을 당하고<br>채찍으로 맞고,<br>공중 앞에서 발가벗겨지고<br>조롱을 당하시다가 죽었습니다.<br>정말 멋지지 않은 삶 정도가 아니라<br>치욕적인 삶이었지만,<br>그날 예수님께서 십자가에서 하신 일은<br>온 인류의 역사에서<br>가장 중요한 (significant) 일 이었습니다.<br>우리를 위해서 대신 죽으시고,<br>우리가 지은 죄로 인해<br>영원히 죽을 수 밖에 없었던 우리를<br>완전히 구원하신 일이지요.<br>뭐 거기까지 이야기 하지 않아도,<br>온 인류의 역사가 AD (anno는 년, Domini 는 주님, 즉 주님의 해, 기원후) 와 BC (before<br>Christ, 기원전) 으로 나뉜 것만 봐도<br>예수님께서 이 땅에서 하신 일이 얼마나<br>중요한 일인가를 알 수 있지요.<br>예수님께서 하신일은<br>온 인류 역사상 가장 중요한 일이었지만,<br>우리가 보기에 가장 멋진 일은 아니었죠.<br>하나님께서 저의 안식년 (실은 고난년) 을<br>통해서 제게 주신 깨달음입니다.<br>얼굴을 드러내지 말고 이름을 알리려 하지 말고<br>멋진 것을 추구하지 말고,<br>대신 앞으로 살아가면서 하나님이 중요하게 보는 일들을 추구하고<br>겸손히 하나님만 바라보고,<br>주변에 적은 사람들을 돌아보고<br>나아가야 한다는 하나님의 메시지를<br>일 년간 고난의 통해서 깨달았습니다.<br>정말 꼬이고 꼬이던 모든 일은<br>제가 안식년을 공식적으로 마치는<br>2012년 8월 31일까지 계속되었습니다.<br>그리고, 이제는 고난이 없으려나 했더니<br>다른 모양의 고난이 제 삶에 계속 다가오네요<br>하지만, 이제 모든 것을 내려놓고 나니<br>이런 고난이 저를 겸손케는 하지만,<br>저를 심하게 힘들게 하지는 않습니다.<br>하나님의 은혜입니다.<br>정말 저는 연약한 사람입니다.<br>저는 주님의 도움이 필요한 사람입니다.<br>저는 주님의 도움이 없으면<br>아무 것도 할 수 없는 사람입니다.<br>제 주변의 사람을 사랑할 수 있는<br>어떠한 선한 것도 제 안에는 없습니다.<br>주님의 은혜가 아니라면,<br>저는 밥 먹듯이 죄를 짓고 또 짓고<br>학생들 앞에서는 거룩 한 척하는 가식덩어리 교육자이고,<br>가식덩어리 신앙인 일 수 밖에 없습니다.<br>하지만, 이러한 부족함에도 불구하고<br>저를 사랑해 주시고<br>저를 인정해 주시고<br>저를 품어주시는<br>그분 앞에<br>다시 한 번 저의 삶을 온전히 내려놓을 수 밖에 없습니다.<br>그분께 제 삶을 다시 한 번 드립니다.<br>앞으로 또 넘어질 저의 연약함과<br>나름 제 안에 있는 모든 쓸만한 것들을 함께 드립니다.<br>주님 사랑합니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02w8nTdheTeofWbZ2MCXQrH64ebirwa3cRSuVLkYo6DcsHhE3kWGAeyEG8G3PyXcoTl?__cft__[0]=AZWOPlPB-NULZX_eP0jrNUV5BEc5AjVtN8Wno2yXFYeKaDQziFTgSgjJayK_luMHe5Dg8uU84syfzKm9PwQxkBup-ASlIzSGTWItHrtVVVBsFacbC8OCqUQRZkgAkhV8tLp7n1avnwCLkmCnZhf5YbHR&__tn__=%2CO%2CP-R"}, {"id": 31, "date": "2013년 2월 13일", "year": 2013, "title": "저는 과자 한 봉지를 사서 공항 대기 의자에 앉았습니다 .", "themes": [2, 5, 7, 10], "content_html": "<p>저는 과자 한 봉지를 사서 공항 대기 의자에 앉았습니다.<br>그리고, 과자를 뜯어서 먹기 시작했지요<br>그런데, 옆에 사람이 제 과자를 먹기 시작하는 거예요<br>'참 세상에 별 사람이 다있다' 라고 생각하며<br>과자를 계속 먹었습니다.<br>그 사람과 저는 서로 빨리 먹기 경쟁이라도 하듯이<br>과자를 먹어 나아갔고,<br>급기야 마지한 한 조각의 과자가 남았습니다.<br>그 마지막 남은 과자를 그 사람은 반을 쪼개더니<br>반만 먹고, 남은 반은 저에게 주었습니다.<br>저는 정말 황당했습니다.<br>'<br>저 남자 뭐야? 정말 뻔뻔해 가지고서는'<br>저는 한 참을 분을 참지 못해서 씩씩 거렸습니다.<br>그러다, 제 비행기 시간이 되어서 비행기를 탔습니다.<br>그리고, 가방에 있는 지갑을 꺼내려다 보니<br>제가 산 과자는 바로 제 가방안에 있었던 것이었습니다.<br>순간 제 얼굴을 붉게 달아올랐고,<br>그 사람의 얼굴이 눈에 비추어 졌습니다.<br>이 이야기는 제가 20년 전에 '낮은 울타리' 라는 책에서 읽은 내용입니다.<br>많은 경우 우리는 자신이 옳다고 생각합니다.<br>그리고, 너무나도 당연히 다른 사람의 생각을 틀리다고 합니다.<br>과연 그럴까요?<br>저는 제가 너무나도 당연하게 스스로 옳았다고 생각했던 일이 제가 올지 않았다는 것을 깨달았습<br>니다.<br>그리고, 너무나도 당연히 다른 사람을 손가락질 하며 정죄했던 제 스스로의 모습이 너무나도 부<br>끄러워 졌습니다.<br>죄송합니다.<br>제 생각이 부족했고,<br>제가 틀렸고,<br>모든 것은 저의 잘못이었습니다.<br>용서해 주세요....</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0doWLPNDBSbGDcic1pPWRoKZJFoPEZGf7r5mCs7qQiHgApSzsqUPp87FRxG7LgGuvl?__cft__[0]=AZXTGLWgoAsHnvh0hA2Mlpg5lc9HhbtzI50vE78nGjgNBjuF-UUv3sABrlwj5T9F3T8-8s8U19X0z6-2oU5s7AyVocJu6wm-8NxHN-JeKF-5dvfCINUVKo_8PQcHnEqPT8yQixhFr1LptsoUMO724gnk&__tn__=%2CO%2CP-R"}, {"id": 32, "date": "2013년 2월 15일", "year": 2013, "title": "저에게 에드먼튼이라는 곳은 매우 특별한 의미를 가집니다 .", "themes": [8, 3, 5, 10], "content_html": "<p>저에게 에드먼튼이라는 곳은 매우 특별한 의미를 가집니다.<br>92년 (20년 전이네요) 처음 영어를 공부하러 왔다가 주님을 만난 곳이지요.<br>자고 있던 저에게 주님이 찾아오셨지요.<br>정말로요.<br>꿈에 제 이름을 부르시더라고요.<br>저는 그때가지도 예수님이 누구신지 전혀 몰랐지요.<br>제 이름을 부르시더니.<br>트레스디아스에 가라고 하시더라고요. 그럼. 새 삶을 주시겠다며.<br>저는 꿈에서 그분께 '네' 라고 대답했고,<br>그 다음 부터 저의 삶은 완전히 다른 삶이 되었지요.<br>삶의 주인이 저 스스로에게서<br>저를 만드신 하나님이 주인이 되시는<br>제게는 혁명같은 일이 일어났지요.<br>저에게 새로운 삶이 시작되게 한 곳이 바로 에드먼튼이지요.<br>그 뒤로 교환학생<br>교환학생으로 공부중 만난 진아와의 결혼<br>이어지는 석사과정과 박사과정<br>안디옥 교회의 개척<br>원주민 선교로의 부르심<br>그리고 2003년 보스톤으로 떠나기까지<br>10년간 많은 기쁨이, 눈물이 그리고 고민의 흔적이 남아 있는 곳이지요<br>지금 저는 캘거리에 도착했고요<br>내일이면 에드먼튼에 들어가게 되네요.<br>늘 해마다 원주민 선교를 위해서 들르기는 하지만<br>이렇게 에드먼튼에 다시 간다고 하니 가슴이 설레이네요<br>내일 저녁 7시 부터 안디옥 교회에서 집회와 강의를 합니다.<br>첫째 시간은 금요일 저녁 7시고요 첫째날은 사랑에 대해서 이야기 하려고 합니다.<br>사랑의 관점에서 성경을 보니까 성경이 새롭게 보이더라고요.<br>성경은 정말 하나님과 우리의 러브스토리입니다.<br>둘째 시간은 토요일 2시부터 시작되고요<br>이 시간에는 정말 사랑의 모든 것을 파헤쳐 보는 시간입니다.<br>사랑이 무엇인지<br>연애란 무엇인지<br>남자와 여자의 차이점은 무엇인지<br>남자와 여자가 사고하는 방법은 어떻게 다른지<br>어떻게 좋은 연애를 하는지 (부부로서의 관계도요)<br>건강한 대화법<br>건강한 관계를 막는 요소는 무엇이며, 또 어떻게 그것을 극복할 수 있는지<br>어떻게 헤어짐의 아픔을 극복하는지 등등<br>시간의 제약이 없는 만큼 충분히 함께 교감하며 이야기 하려고 합니다.<br>그리고 토요일 저녁에는 하나님께서 제게 지난 20여년간의 신앙생활을 통해 깨닫게 하신것을 함<br>께 나누려고 합니다. 개인을 향한, 가정을 향한, 교회를 향한 그리고 나라를 향한 하나님의 마음<br>을 함께 깨닫는 시간이 되기를 기도합니다.<br>혹시 에드먼튼에 있는 분들은 함께 해 주시고요.<br>함께 못하시는 분들은 저를 위해서 그리고 모임에 함께 하시는 분들을 위해서 기도해 주세요.<br>그리고 내일 캘거리에서 에드몬톤에 운전을 해서 갈텐데 안전을 위해서 기도해 주세요.<br>이 모임이 적은 모임이 아니라는 마음을 주시네요.<br>샬롬!</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0Sd8J7MzKYsDKeD7392vqX1vwJNmhdf53K3aMKrK6ncuJAiBmd5HXveHM6vAa5p1Yl?__cft__[0]=AZUIiAXD0xZmAv1SxVpTsIZvUVD_mbBLwFkeooxhUoVkJvdCMnT9Qh7zg7RJEzm-DQLeJLnBoXzXoqSLYfDN4_ruYXGUJAfIyldej0bVg3weEN34imhgHi5cNf1NUNgNd1LyzAY-2Xf8c4EVq0jbznCO&__tn__=%2CO%2CP-R"}, {"id": 33, "date": "2013년 6월 12일", "year": 2013, "title": "너희가 사랑을 아느냐도 종강^^", "themes": [3, 12], "content_html": "<p>너희가 사랑을 아느냐도 종강^^. 내년 부터는 모든 1학년이 송도로 가기에, 지난 9년간 해온 수<br>업이 오늘이 마지막이 될 수도 있네! 아쉽네요:)</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0Wu2seBbd7GX4GXuoh6em8JV5beyAJZ4Jv7KwsLWGaE19RBycsbdFD8DTYWJ4rmkNl?__cft__[0]=AZVJuLb5xym-WnfrBzGC4LEW58cNWQsONV3RycV4y6_565ojc0Pi0Um6ppOEagFw1EqGBhZqTSaLQEaqX6IdV-u32Jvso3LWUHfYkufV0HDGOmZ7sFYjkWcAHDTvApOL3u-xoJQa--3Sz7oZhD4tvLcj&__tn__=%2CO%2CP-R"}, {"id": 34, "date": "2013년 6월 17일", "year": 2013, "title": "혼자서도 잘 하기 연습중입니다 .", "themes": [3, 8, 6, 14], "content_html": "<p>혼자서도 잘 하기 연습중입니다.<br>혼자 밥하기<br>혼자 빨래하기<br>혼자 청소하기<br>혼자 밥먹기<br>혼자 팥빙수 먹기<br>혼자 사색하기<br>혼자 카페에 앉아있기<br>혼자 노래하기<br>혼자 등산하기<br>늘 아내와 함께 하던 일을<br>이제 당분간 (꽤) 혼자하게 되었네요.<br>익숙해져야 겠지만,<br>별로 익숙해 지고 싶지 않습니다.<br>\"이러므로 남자가 부모를 떠나 그의 아내와 합하여 둘이 한 몸을 이룰지로다\"<br>창세기 2장에 나오는 말씀이지요.<br>문득 이 말씀을 보는데 이런 생각이 듭니다.<br>함께 있어도 한 몸이 아닐 수 있지만<br>멀리 떨어져 있어도 한 몸일 수 있다.<br>함께 한다는 것은<br>꼭 함께 옆에 있어야 한다는 것은 아닌 것 같습니다<br>처음 아내와 결혼 전에 4개월간 떨어져 있으면서<br>한달 백만원 넘는 전화비를 지불하기 위해<br>세곳에서 일을 했었는데,<br>그래도 스카이프와 070 화상통화가 있어서 훨씬 다행이지요<br>혼자 있기에 익숙하지는 않아도<br>혼자 있기를 embrace 는 해야 할 것 같습니다~</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0zX9PPKZQHn27WzTnExCmMcsvbtVDuHcksirKryQ4fBbP8vvg3b3nr5Pow4C7uMS3l?__cft__[0]=AZWDbmhmcYgjoBi_hDI5Jpcb1CokRoU-m9ES1ARojYBH1Q5teYY7izXv9sdiuOAeg47JEzgzuKKm7ZHmojwz0Ffp-Nh9hVaPMcVRbgyTR-AU7otWTgiNoV_X2HE283klL92NX7Bf6Tw48P_CcVVaAf3d&__tn__=%2CO%2CP-R"}, {"id": 35, "date": "2013년 6월 29일", "year": 2013, "title": "성적을 주기 위해 학생들이 장애인 시설에 다녀오면서 쓴 봉사 후...", "themes": [9, 3, 4], "content_html": "<p>성적을 주기 위해 학생들이 장애인 시설에 다녀오면서 쓴 봉사 후기를 읽는데,<br>학생들이 자원봉사를 하면서 깨달은 내용 보며,<br>마음이 뜨거워 지고, 눈시울이 붉어진다.<br>사실 내가 수업에서 가르친 어떤 내용보다<br>그저 지적장애인 친구, 동생, 언니, 누나들을 통해서 배운내용이<br>훨씬 더 많은 것 같다.<br>문득, 이전에 어떤 책에서 읽은 내용이 생각이 난다.<br>물리학 분야에 매우 뛰어난 학자가 되어<br>그 분야의 교과서 까지 쓴 분이<br>자신이 초등학교 시절이 생각이 나서<br>문득 자신이 나온 학교에 가 본다.<br>그리고 그 학교 옆에서 살고 계셨던<br>초등학교 선생님께서 아직도 그 학교 옆에 살고 있는 것을 발견한다.<br>그리고 조심이 들어가 그 선생님에게 자신을 소개한다.<br>선생님은 그 학생, 아니 그 학자를 아직도 생생하게 기억하고 있다.<br>그 선생님이 차를 준비하는 동안<br>그 학자는 선생님의 방을 둘러본다<br>그 방안의 벽은 제자들의 사진과 신문 스크렙기사들로 도배되어 있다.<br>그런데, 그 선생님의 책꽂이에 자신이 쓴 물리학교과서가 있는 것을 발견하고<br>너무 반가워, '선생님 제 책도 읽어보셨어요?' 라고 묻는 순간<br>자신은 선생님에게 그 책을 보내준 기억이 없다는 것을 꺠닫는다......<br>'도대체 그 책에 뭐라고 쓰였는지, 하나도 모르겠더라' 선생님은 기쁜듯 이야기 한다.<br>그 학자는 흐르는 눈물에 말을 잊지 못한다.<br>선생님은 수십년동안 자신을 잊지 않고 있었다.<br>'선생님! 저희 반 아이들이 가끔 찾아오나요? 라고 묻는다.<br>'아니! 사실 네가 처음이란다.' 겸연쩍은 듯이 선생님은 이야기 한다.<br>마치, 학생들이 찾아오지 않은 것이 자신의 잘못인 듯.....<br>그리고 선생님은 묻는다.<br>'네가 쓴 책을 쓰는데, 혹시 내가 너에게 가르쳤던 수업이 조금이라도 도움이 되었니?\"<br>'그럼요! 선생님......!<br>나도 우리 학생들에게..<br>혹시 네가 대학다닐 때에 들었던 나의 수업이<br>너에게 조금이나마 도움이 되었니?<br>라고 묻는 날이 올까?<br>부모가 자식을 늘 짝사랑하듯이<br>스승도 제자를 이렇게 짝사랑하게 되는 걸까?<br>오늘은 스승님께 전화를 드려야 겠다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0UvudBAG38EZwxkscp3FDShV75FKsKMpQsfmY1V6xixkzkXGCAkPQu6qa53WPBqFql?__cft__[0]=AZVdnUc922laPUygoDOyPe7qqUtUEM2J2m6V_fxkF7K5-OyibaN4BJu3MPfps6OBtPuUli6RFqcJO1sCpni_RMs2ekFJ6ZRkz4zKLo-gYRiwDHvnuXey8H25gqVKDMfFZA-JKOd7PP9yyEighNm0_GQi&__tn__=%2CO%2CP-R"}, {"id": 36, "date": "2013년 6월 29일", "year": 2013, "title": "이제 한 숨 돌리고 , 한 학기 성적을 입력하려 합니다 ^^.", "themes": [9], "content_html": "<p>이제 한 숨 돌리고, 한 학기 성적을 입력하려 합니다^^.<br>정말 폭풍같은 한 학기였던 것 같습니다.<br>제 이름으로 개설된 15개의 과목...<br>최선을 다한 모든 학생에게 정말 진심으로 A+++++++ 를 주고 싶습니다.<br>하지만,<br>과연 나는 우리 학생들에게 최고의 수업을 제공하기 위해,<br>최선을 다했나 스스로에게 묻고 싶습니다.<br>때로는 바쁜척,<br>때로는 힘든척,<br>때로는 아픈척,<br>우리 학생들에게 미안한 마음도 있습니다.<br>학생들은 강의 평가로 저의 수업에 점수를 주겠지요.<br>때로는 사람이 다른 사람을 평가한다는 것이 우습기는 하지만,<br>그 사람을 평가하는 것이 아니라,<br>그 사람이 한 수업에 참여한 만큼,<br>노력한 만큼,<br>그 만큼은 평가할 수 있겠지요!<br>하지만, 수업을 진행하면서 늘 깨닫는 것은<br>학생들과 함께 학문을 탐구해 간다는 것입니다.<br>제가 학생들 보다 알아봤자 얼마나 더 알겠습니까?<br>하지만, 학생들에게 가르치기 위해서 나도 공부하고<br>또 학생들에게 가르치면서,<br>내가 가르치려 공부한 것들을 구체화시키고,<br>학생들이 어려운 질문을 하면,<br>대충 얼버무리고,<br>나중에 혼자 그 답을 찾아보면서 새로운 것을 깨닫고.<br>교수 9년차,<br>시간이 참 빠르게 흐르네요,<br>해를 먹을 수록 더욱 좋은 교수가 되기를 소망합니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0UvudBAG38EZwxkscp3FDShV75FKsKMpQsfmY1V6xixkzkXGCAkPQu6qa53WPBqFql?__cft__[0]=AZVdnUc922laPUygoDOyPe7qqUtUEM2J2m6V_fxkF7K5-OyibaN4BJu3MPfps6OBtPuUli6RFqcJO1sCpni_RMs2ekFJ6ZRkz4zKLo-gYRiwDHvnuXey8H25gqVKDMfFZA-JKOd7PP9yyEighNm0_GQi&__tn__=%2CO%2CP-R"}, {"id": 37, "date": "2013년 7월 1일", "year": 2013, "title": "이번학기에 수업을 하며,", "themes": [8, 3, 9], "content_html": "<p>이번학기에 수업을 하며,<br>그리고 성경공부를 인도하면서<br>하나님께서 사랑이 무엇인가에 대해 깨닫게 해 주신 것은<br>\"Love is making oneself vulnerable\" 이라는 것이다.<br>Vulnerable 의 사전적 의미는 깨어지기 쉬운, 상처받기 쉬운이라는 뜻이다.<br>그러므로, 사랑의 척도는<br>내가 그 사람을 위해서 얼마나 상처받을 수 있는가?<br>혹은 그 사람을 위해서 얼마나 깨어질 마음이 있는가? 이다.<br>그래서, vulnerable 하게 자신을 만든다는 것은<br>먼저 사랑한다 고백하고,<br>전화 끊기 전에 먼저 사랑한다고 이야기 해주고,<br>먼저 그 사람에게 자신의 약점을 고백하고,<br>먼저 그 사람에게 페북 친구 신청하고,<br>먼저 그 사람에게 자신이 정리한 노트를 보여주고,<br>먼저 허그 해 주고,<br>먼저 선물 주고,<br>....<br>하는 것이다.<br>그런데, 오늘 TED.com 에 power of vulnerability (제자 사랑이가 추천해준^^), 라는 영상을<br>보는데 갑자기 숨이 막히는 것 같았다.<br>Wholehearted person (온전한, 완전한이 아니다) 은<br>자신의 vulnerable 하게 만드는 것이 자신을 beautiful 하게 만든다는 것을 알고,<br>자신의 vulnerabiility 를 받아들 일 수 있는 사람이다.<br>나의 경험을 포함해서 좀 더 각색하면,<br>온전한 사람은<br>자신의 약점과 부족함을 받아들이고,<br>그것을 기꺼이 열어 보임으로 말미함아,<br>다른 사람을 세워 줄 수 있는 사람이다.<br>그런데, 오늘 아침에 우리 연구실 학생들과 함께<br>성경을 읽는데, 마태 복음 17장 20절에 보면<br>\"If you have faith as small as a mustard seed,<br>you can say to this mountain,<br>'move from here to there' and it will move.<br>Nothing will be impossible for you.<br>만약 너희안에 작은 겨자씨 만한 믿음이 있다면,<br>이 산에게 '여기서 저기로 옮겨가라' 라고 말할때에,<br>그 산이 옮겨질 것이다.<br>너에게 불가능한 일을 없다.<br>라고 쓰여 있다.<br>겨자씨만한 믿음이 뭘까?<br>우리 학생들과 오랫동안 고민했다.<br>역시, 우리 방에 동일이가<br>씨의 특성을 이야기 하였다.<br>씨앗은 현재는 작지만,<br>심겨지만 많은 열매를 맺는 미래지향적인 의미가 있다고.<br>그런데, 예수님께서 바로 이 말씀을 하신 후에<br>또 이런 말씀을 하시었다.<br>\"The Son of Man is going to be betrayed into the hands of men. They will kill him<br>and on the third day he will be raised to life.\".<br>\"인자는 배신을 당해 사람들의 손에 넘겨질 것이고,<br>그들은 인자를 죽일 것이고,<br>인자는 삼일 만에 다시 살아날 것이다\".<br>그렇하면, 겨자씨만한 믿음이 있다는 것은<br>예수님의 죽음과 부활에대한 믿음이 아닐까?<br>예수님께서는 씨앗과 관련하여 이런 말씀도 하셨다.<br>Unless the seed falls to the ground and dies, it remain as single seed, but it it dies<br>it produce many seeds.<br>그렇다면, 겨자씨만한 믿음이 있다는 것은<br>그 사람을 사랑함으로,<br>그 사람을 위해 So vulnerable 해 짐으로 땅에 떨어질 의향이 있는가?<br>아니 그 차원을 넘어서서, 그 사람을 사랑함으로<br>땅에 떨어져 죽을 수 있는가?<br>결국 겨자씨 만한 믿음을 갖는 다는 것은<br>그 사람을 위해 예수님과 같이 Vulnerable 해 진다는 것이다.<br>그러고 보니, 마태복음 17장에 예수님의 제자들이<br>간질병환자를 고치지 못한 이유를 알 것 같다.<br>그것은 어쩌면 제자들이 그 소년을 위해 Vulnerable 해 질 의향이 없었었던은 아닐까?<br>멋지게 예수님의 이름으로 저들의 병을 고쳐주고  환타스틱한 분위기를 만들 의향은 있었지만,<br>그 소년을 위해서 Vulnerable 해 질만큼 사랑하지는 않았던 것은 아닐까?<br>우리는 완전해지기를 원한다.   그러나 하나님은 온전한 사람을 사용하신다.<br>온전한 사람은 상처 (Wound)가 없는 사람이 아니다.<br>온전한 사람은 자신의 상처를 하나님 앞에 치유 (Healing) 를 받은 사람이다.<br>자신의 상처를 인정하고,<br>하나님 앞에 자신의 상처 를 내어 보인 사람이다.<br>온전한 사람은 기꺼이 자신의 흉터 (Scar) 를 내어 보인다.<br>흉터는 원래 피부보다 더 단단하다고 말하면서,<br>그리고 그 흉터를 보면서 사람들은<br>자신의 상처를 치유받게 되는 것이다.<br>이제 우리 세대는 완전한 것에 질려가는 것이 아닐까?<br>내가 이렇게 이렇게 했더니,<br>부족했던 내가 완전해 졌다.<br>라는 식의 강의와 간증에 능력이 없어지는 것이 아닐까?<br>나는 이렇게 부족하다.<br>나는 이런 실패를 했다.<br>나에게는 이런 아픔이 있다.<br>나에게는 이런 어려움이 있다.<br>나에게는 이런 wounds 가 있다고 말하며,<br>하나님앞에<br>서로 앞에 내어보일때에<br>진정한 힐링이 되는 것은 아닐까?<br>그럼으로 인해<br>what makes me vulnerable<br>what makes me beautiful<br>이라고 고백할 수 있는 것이 아닐까?<br>나는 앞으로 사람들이 나를 perfect 하려고 노력한 사람이 아닌,<br>Vulnerable 한 사람이기를 소망한다.<br>그러고 보니 사도바울의 편지가 이해가 된다.<br>내게 이르시기를 내 은혜가 네게 족하도다<br>이는 내 능력이 약한데서 온전하여짐이라 하신지라<br>이러므로 도리어 크게 기뻐함으로<br>나의 여러 약한 것들에 대하여 자랑하리니<br>이는 그리스도의 능력으로 내게 머물게 하려함이라<br>고린도후서 12장 9절</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02SSe8TSzh9uAqcJX3exFiCsyvYm2AtpYs8QRc2m47uWRenh6USoof91i53AodpD4sl?__cft__[0]=AZUd9O7apfk1by3On6t32gNKIB1YG7YjwyiC1M0Q-YOkvN88kK5x7yNa2aDtFuwucIj4qw-Yf1bnJnZ7oDsHSMl2zBcXRVeukyLGKEOCv0nyfgDMr_1M6JAwFWp_lKFLloeDRHniuog6-XnHYlD8xZMD&__tn__=%2CO%2CP-R"}, {"id": 38, "date": "2013년 7월 4일", "year": 2013, "title": "오늘은 매우 감사한 날입니다 .", "themes": [8, 3, 4, 6], "content_html": "<p>오늘은 매우 감사한 날입니다.<br>제 사랑하는 아들이<br>처음으로 원주민 선교를<br>참여하게 되었습니다.<br>5살때 부터 잠간씩 제가 선교하는 곳을<br>방문하기는 했지만,<br>맴버로서 참여하기는 이번이 처음이지요.<br>건강하게 캐나다 원주민 선교를<br>잘 할 수 있도록 기도 부탁드립니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid05zBb8tTJn9WYDNSLVnx88hLWEa6TKLFgZKpW53HmitormGT4MLh5V4GNdoCj4iWql?__cft__[0]=AZU1kmgnZnqgff89PMALnB2VWCl5OIm4uzWlZNjL8UAGsZd5PE8TWJqFtieO8BfrLKLfrTnlWUl2oE4t8m-a-apwtX89VMiGMy5S44xeoFOjZAEndnchkn1egc9AE27xKBKcVMTFEEr_oIVWfKrvuvN2xMc47ocpYLmPcD0xXYriig&__tn__=%2CO%2CP-R", "images": ["pdf2_page9_img2.jpeg", "pdf2_page9_img3.jpeg"]}, {"id": 39, "date": "2013년 8월 13일", "year": 2013, "title": "평생 동생을 위해 양보해주고", "themes": [4, 8, 3, 6], "content_html": "<p>평생 동생을 위해 양보해주고, 기도해주고, 격려해준 사랑하는 막내 누나의 회복을 기도합니다.<br>진.심.으.로...</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid05zBb8tTJn9WYDNSLVnx88hLWEa6TKLFgZKpW53HmitormGT4MLh5V4GNdoCj4iWql?__cft__[0]=AZU1kmgnZnqgff89PMALnB2VWCl5OIm4uzWlZNjL8UAGsZd5PE8TWJqFtieO8BfrLKLfrTnlWUl2oE4t8m-a-apwtX89VMiGMy5S44xeoFOjZAEndnchkn1egc9AE27xKBKcVMTFEEr_oIVWfKrvuvN2xMc47ocpYLmPcD0xXYriig&__tn__=%2CO%2CP-R"}, {"id": 40, "date": "2013년 8월 18일", "year": 2013, "title": "사랑하는 사람과 영원이 이별하는 것 만큼", "themes": [4, 3, 8, 14], "content_html": "<p>사랑하는 사람과 영원이 이별하는 것 만큼<br>마음 아픈일이 또 있을까요?<br>물론, 우리는 천국에서 다시 만날 것을 알고 있습니다.<br>하지만, 그래도 그 사랑하는 사람을 다시 만날 수 없다는 사실은<br>가슴이 찢어지게 아픕니다.<br>오늘!<br>지난 43년간을 함께 했던<br>나의 사랑하는 누님이 천국에 갔습니다.<br>마지막 숨을 몰아쉬면서도<br>'우리 용관이' 라 부르며<br>바쁜데 집에 가라며<br>부족한 동생을 무한 신뢰<br>무한 사랑해 주었던<br>나의 사랑하는 막내누나는<br>오늘 그토록 누나가 사랑하던<br>예수님의 품에 안기어 천국으로 갔습니다.<br>사랑은 주고 주고 또 주고도<br>혹시 상대방에게 아직도 부족한 것은 없는지<br>살피는 것이라는 사랑의 진리를 깨닫게 해 주고<br>누나를 그토록 사랑하신 예수님께로 돌아갔습니다.<br>이제 누가 누나같이 무대책으로 동생을 응원해주고<br>이제 누가 누가와 같이 무조건 적으로 동생을 사랑해 줄까요<br>병원에 입원한 사실은 동생에게 숨기고<br>캐나다로 가는 사랑하는 조카를 위해 남긴 폴라로이드 카메라는<br>이제 조카들에게는 고모가 남기고간 유품이 되었네요.<br>어려운 사람을 보면 자신의 옷을 나누고<br>새터민학생들, 해외 이주민과 유학생들을 위해<br>자신의 삶을 나눈 얼굴보다 마음이 더 아름다운 천사<br>살아서도 주위 사람들에게 그렇게 사랑을 베풀더니<br>가면서 까지 자신의 몸을 기증하여<br>사람들에게 자신의 생명을 나누어 주고 가네요.<br>주님께 사랑하는 누나를 데려가지 말라고 기도하다가도<br>숨을 쉬기 힘들어하면서도 웃음을 잃지 안으려는 누나를 보며<br>주님께 누나를 맡겨 드렸네요.<br>이제 주님의 품안에서 편히 쉬시기<br>를<br>이제 주님의 사랑안에서 안식하시<br>기를<br>우리 다시 만날 날까지 더욱 행.복.<br>하.시.기.를.<br>마지막날<br>주님과 함께 다시 만날날을 기대하<br>며..<br>누나가 너무나도 아낀<br>누나를 너무나도 사랑하는<br>동생이...</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0FwMjpkb7NZH7s1WXMP4UbF1o2LeAu5p79PJ5GjRU8GGFNa9i34y1igoPNCHDFdpRl?__cft__[0]=AZU12ihhplTA8Ky4PM_s0wsFBRWCyDLQGFy3BLUkkG1_jRnT9dzuEJL2r6eMHwrTI06YRPV1fnjko7rU8Idz7pKNgiHLcGBXmbheYtMvKvD63zNgbGn1T4PQkHyMbapE7LMUjutASD6oveTeF29aS_uI4qOyQa3BdIyUa9z38AbI8Q&__tn__=%2CO%2CP-R", "images": ["pdf2_page12_img2.jpeg"]}, {"id": 41, "date": "2013년 10월 3일", "year": 2013, "title": "오래간만에 적적해 하시는 부모님댁에서 자고 학교로 왔습니다 .", "themes": [16, 4, 3, 14], "content_html": "<p>오래간만에 적적해 하시는 부모님댁에서 자고 학교로 왔습니다.<br>내 나이 이제 곧 40대 중반인데,<br>팔순 부모님께서 보시기에는<br>아직도 어린 아이와 같은가 봅니다.<br>얼굴에 기미가 늘었다며,<br>보습 팩을 해 주시는 어머님이나,<br>아들 밥을 챙겨 보내주신다고<br>새벽 등산에서 일찍 내려오셔<br>아들 밥을 해주시려는 아버님이나,<br>새벽에 일어나 잠결에<br>밥을 먹은 것이 아니라<br>사랑을 먹은 것 같습니다.<br>주고 주고 또 주고도 혹시<br>상대방에게 부족한 것이 없는지를<br>돌아보는 그런 '사랑' 말입니다.<br>앞으로도 계속 건강하셔야 할텐데요~~~<br>이런 부모님을 생각해서라도<br>오늘 하루를 힘차게 보내야 겠네요^^</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02UAgF76LFYUPG2JLy3nKcGhGGNjx4UhbXs9czZCdXWGNTHbezB2JiU1cGiZPUkNW6l?__cft__[0]=AZUaUP_jfgaJ07Vs9wRzx81bOKKthLXyPFscjqWS0FBpV44N2nUo4Iv70IjOL85hO_CgC1ViQCXdPSGAzctaAtbxSa0XfBUVddx3W1yY-gU6OUNgxmQSuYr7o8J_BqLVtTg1RiGMXIvB90evRtC4Xk7X&__tn__=%2CO%2CP-R"}, {"id": 42, "date": "2013년 10월 6일", "year": 2013, "title": "지난 삼일간의 수상스포츠 수업을 잘 마치고 서울로 올라가는 길입니다", "themes": [8, 3, 10, 5], "content_html": "<p>지난 삼일간의 수상스포츠 수업을 잘 마치고 서울로 올라가는 길입니다. 아무도 크게 안다치고<br>무사히 서울로 올라감에 그리고 많은 발전을 이룬 우리 학생들을 보며 감사한 마음이 깊어집니<br>다^^Thank you Lord!</p>\n<p>013년 10월 24일  ·<br>공유 대상: 내 친구</p>\n<p>1992년 4월 어느날의 일입니다.<br>저는 캐나다 에드먼튼의 한 한인교의<br>뒷자리에 앉아 있었지요.<br>그 당시 저는 22살 청년이었고<br>남들은 3년 간다는 군대를<br>3대독자라는 이유로 6개월만에 끝낸 후에<br>캐나다 에드먼튼에서 1년간 영어공부를 하던 중이었습니다.<br>교회라는 곳과는 별로 인연이 없었고<br>오히려 교회와는 거리가 먼 것들과 훨씬 친했죠<br>친한 정도가 아니라, 술.담배.노는 것 등에 거의 중독이었던 저였죠<br>캐나다에 갔더니 그곳의 교포친구들이<br>한국에서 전용관이 왔다며<br>그 당시 잘나가던 에드먼튼의 클럽에 저를 데리고 갔지요.<br>그래서 캐나다에서 배운 외운 첫 영어 문장은<br>“Would you like to dance?”<br>저와 함께 춤 추시겠어요? 였지요.<br>여하튼 캐나다에서 이렇게 열심히 놀던 제게<br>이상한 일들이 일어나기 시작했습니다.<br>자고 있는데, 꿈에서 갑자기 예수님께서 나타나시더니<br>내가 앞으로 해야 할 일들을 보여주시고<br>새 삶 (New Life)를 살기위해 내가 해야 하는 일을 알려주셨습니다.<br>정말이지 뭐 상상할 수도 없는 일이 제게 일어났지요.<br>그리고 얼마 후에 또 이상한 일이 일어났습니다.<br>누나의 손에 이끌려 나가던 교회의 뒷 자리에 앉아 있는데<br>성가대가 내 귀에 익은 노래를 부르는 것이었습니다.<br>“사랑은 언제나 오래참고, 사랑은 언제나 온유하며...”<br>오래전 연세대학교 채플시간에 윤형주 (가수이자 목사님) 씨가<br>우리 채플에 와서 부르던 노래였죠.<br>고린도전서 13장에 나오는 사랑의 내용을 곡조를 붙여 부르던 노래<br>그 노래를 들으면서 “그래! 내가 다른 것은 몰라도, 사랑과 연애는 좀 알지!”<br>라며 교회의 맨 뒷자리에서 자조적인 웃음을 띄우던 나에게<br>갑자기 이상한 일이 일어났지요.<br>눈에서 눈물이 흐르는 것이었죠!<br>뭐 이런~~~<br>그런 일이 한 번도 없었기에,<br>그리고 남자는 평생 세 번 우는 것이 허락된다고 믿었기에<br>스스로 당황했지요.<br>그리고, 울음을 참으려 하는 나를 비웃듯이<br>갑자가 가슴이 뜨거워 졌지요.<br>이제는 눈물이 아니라 통곡이 쏟아져 나오는 것을<br>간신히 참으며 입을 다물고 있던 나에게 드는 생각...<br>수.치.심.<br>그때 마치 누군가가 찾아와<br>나의 마음 깊은 곳에 두었던 모든 비밀들을<br>나의 가장 친한 친구도 모르는 나만의 비밀들<br>정말이지 기억조차 떠올리고 싶지 않았던 기억들<br>‘중학교 시절 우열반 중 열반에 배정되어<br>열받아 학교에 가지 않았던 기억‘<br>‘싸우다가 턱을 맞아서 턱에 금이가서<br>병원에 입원했던 기억‘<br>'퇴원해서 다니던 학교로 돌아가는 것이<br>정말 죽기보다 싫었던 일'<br>‘고등학교시절 남몰래 화장실에서<br>누군가 피다가 버린 담배를 몰래 피던 기억‘<br>‘어려서 나보다 싸움 못하던 아이를<br>괴롭히던 기억‘<br>‘과외중 공부못한다고 매형에게 혼나고<br>혼자 죽어버리려고 했던 어린 시절의 기억‘<br>그리고 이보다 훨씬 더욱 수치스러운 기억들<br>정말 평생 누구에게도 털어놓을 수 없는 기억들<br>더 나아가 누구에게도 들키고 싶지 않았던<br>나만의 어두운 그리고 수치스러운 기억들<br>아무도 모르는 비밀스러운 나만의 마음의 공간에<br>담아두었던 나의 이야기들....<br>“비밀 보따리 Secret place\"<br>그날 누군가 그 보따리를 갑자기 열어버린 것 같은 느낌이었죠.<br>그리고 갑자기 깨닫게 된 나의 죄(罪, Sin).<br>내가 하나님앞에서 얼마나 큰 죄인인지를...<br>남들 앞에서는 쿨한 척 할 수 있고,<br>남들 앞에서는 강한 척 할 수 있지만,<br>나의 모든 것을 알고 있는 하나님 앞에서<br>마치 벌거벗겨진 나의 모습..<br>그게 그날 교회의 뒷자리에<br>정장을 하고 올백을 한 머리로<br>혼자 쿨한 척 앉아있었던 나의 내면의 모습이었죠.<br>그리고, 난 주체할 수 없이 울었지요.<br>아니 울 수 밖에 없었지요.<br>그리고, 그날 예수님께서 찾아오셨지요.<br>나의 마음의 수치심을 치유해 주기 시작하셨지요.<br>상처난 내 마음을 만져주시기 시작했지요.<br>벌써 20년 전의 일이네요.<br>나의 수치스러운 과거와의 만남은<br>나의 아직 부족하지만<br>온전한 나와의 만남의 시작이었지요.<br>그런데, 지난 2008년부터 하나님은<br>나의 수치스러운 과거의 일들을<br>다시 끄집어내시기 시작하십니다.<br>2012년 안식년 중에는 치유받은 줄만 알았던<br>나의 과거의 상처들이<br>어떻게 아직도 나의 삶에 영향을 주는지<br>그리고, 나의 아들에게 영향을 주는지 알게하셨네요.<br>그리고, 이런 수치스러운 과거를<br>주위의 가까운 사람들에게 나누게 하시네요.<br>그리고, 급기야 나의 수치스러운 과거들을<br>나를 사랑하시는 주님께서 아직도 치유하고 계신 과거들을<br>더 많은 사람들과 나누게 하시네요.<br>이전에는 간증집회라고 하면,<br>하나님께서 어떻게 나같이 부족한 자를 만나주셨고,<br>그리고 어떻게 내안에 역사하시며,<br>또 나를 통해서 하신 놀라운 일들을 증언했는데,<br>이제는 그저 나의 연약함을<br>나의 수치스러웠던 모습들을 솔직히 고백하게 하시네요.<br>바로, 나의 비밀 보따리를 풀어 공개하라고 하시는 것 같네요.<br>그래서, 앞으로 한동안 나의 부족한 모습들을<br>글을 통해서 공개하려 합니다.<br>하지만 페북이 너무 공개적이기에<br>제가 오랫동안 사용하던 싸이월드 (www.cyworld.com/forjina)<br>에 글을 개제 하려 합니다.<br>그리고 글중 몇개를 선별해서 페북에 올리려고요.<br>글의 제목은 “나는 ADHD 다”입니다.<br>맞습니다.<br>저는 ADHD (주의력결핍 과잉행동장애)입니다.<br>어렸을 때에는 주의 산만한 아이로 통했죠.<br>하도 산만하다 보니 주의를 기울이지 않아 스스로 다치기도 하고<br>(제 얼굴에는 꿰멘 바늘 수만 100바늘이 넘고요, 30% 이상 화상자국이 있지요)<br>또 다른 사람을 다치게고 했지요.<br>맨날 컵과 유리 그릇들을 깨고,<br>우산과 보온도시락은 가지고 나가면 집에 가지고 온 날이 별로 없었지요<br>그래서 초등학교 성적표의 생활기록부엔<br>“성적은 양호하나 주의가 산만함” 이란 꼬리표를 달고 다녔지요<br>그리고 중학교에 들어가 강남의 학교로 전학한 후로는<br>‘성적도 좋지 않고 주의도 산만함’이 되었지만요.<br>이 글들이 모아지면, 더 많은 사람들이 읽을 수 있도록<br>책으로도 써보려고 합니다.<br>물론, 하나님께서 허락하실 경우에 말이죠...<br>올해 상반기에 주님께서 알려주신<br>사실 중에 하나는 바로<br>“Love is making oneself vulnerable\"<br>\"사랑은 자신의 연약함을 인정하고 드러내는 것“<br>이라는 것이죠.<br>이것을 한 번 실천해 보려고요.<br>그리고, 이후 테드 강의를 통해서 듣게된<br>‘온전한 사람은 자신을 수치스럽게 하는 것들이<br>자신을 아름답게 한다는 사실을 깨달은 사람이다‘<br>“Whole hearted persons understand what makes them<br>vulnerable makes them beautiful\"<br>이란 사실은 제 삶을 통해서 한 번 살아보려고요.<br>물론, 이런 자신의 연약한 모습을 고백하기 위해서<br>우리에게 필요한 것은 courage 용기지요.<br>용기를 한 번 내어 보려고요.<br>세상의 웃음거리가 되고<br>주위 사람들의 비웃음 거리가 되는 것을<br>한번 감수해 보려고요.<br>생각나면 기도해 주세요.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02UAgF76LFYUPG2JLy3nKcGhGGNjx4UhbXs9czZCdXWGNTHbezB2JiU1cGiZPUkNW6l?__cft__[0]=AZU5o5p0m2ATPRikm9YO2M2xYBXE3sslEAkzdrFv37bD0Q2_q8OkUQcNKQKbxy3wjUgDBIGp7Z8VURKWo219naAADedXK6hCii-CNrP-RLk78MQE4zTop6t4M9rszsFd9FwIWPOdXo5jdOi9mJL80jGS&__tn__=%2CO%2CP-R", "images": ["pdf2_page17_img0.jpeg"]}, {"id": 43, "date": "2013년 11월 17일", "year": 2013, "title": "사랑은 시간을 함께 나누는 것이다", "themes": [3, 4, 10], "content_html": "<p>사랑은 시간을 함께 나누는 것이다<br>난 3년 전 스마트 폰을 구입했다.<br>가능하면 디지털 보다는 아날로그를 선호하는 나에게는 큰 변화중 하나이다.<br>스마트 폰을 써보니, 정말 편리하다.<br>컴퓨터 앞에 앉아야만 하는 이메일 확인을 언제 어디에서든지 할 수 있게 되었고,<br>영화 예약, 그리고 심지어는 전화기에 AP 기능을 켜 놓으면,<br>내가 가지고 다니는 컴퓨터가 인터넷에 연결이 될 정도니,<br>이제는 차를 타고 다니면서도<br>이메일과 학과 업무등을 자유 자재로 할 수 있게 되었다.<br>따라서, 스마트폰을 사용하게 되면서,<br>나는 시간을 절약할 수 있게 되었다.<br>심지어 어떤 이는 세상을 스마트폰을 사용하기 전과<br>스마트폰을 사용하기 시작한 후로 나누어 보기도 한다.<br>물론 억지다.<br>그럼, 스마트 폰을 사용하기 시작한 후에 나의 삶은 더욱 시간이 풍족해졌는가?<br>다른 말로 나의 삶이 덜 바빠지고,<br>그로 말미암아 나의 삶의 질이 향상되고<br>또 더 나아가<br>내가 사랑하는 사람들과 더 의미 있는 시간을 지내고 있는가 말이다.<br>정말 두렵게도 나의 대답은 부정적이다.<br>나는 내가 절약한 시간을 전혀 의미있는 일에 사용하고 있지 않다.<br>오히려 스마트폰의 여러 기능을 사용하는데<br>의미 있는데 사용하던 시간마저 낭비하는 경우가 많다.<br>이전에는 학교에서나 확인하던 이메일을<br>집에서 혹은 차에서 간단히 확인하게 되고,<br>그 결과 지금 당장 내가 하지 않아도 될 일을 꼭 해야 할 것 같은 생각이 들어,<br>가족 혹은 같이 있는 사람과 의미 있는 시간을 갖는데,<br>혹은 진정한 휴식을 하는데 방해가 되기도 한다.<br>그렇다면 심지어 유치원에 다니는 아이들도 학원에 다니느라 스케쥴이 꽉차있는 요즘, 무언가 새<br>로운 일을 하려면 늘 ‘바빠서 못해’ 라는 말을 입에 담고 사는 요즘, 우리가 그렇게 아끼고 효율<br>적으로 사용하려고 기를 쓰고 있는 시간이란 도대체 무엇인가? 시간은 우리에게 어떤 의미를 갖<br>고 있으며, 시간을 아끼는 목적과 이유는 무엇인가? 아니 우리는 꼭 시간을 아껴야만 하는가?<br>난 시간은 생명이라고 생각한다.<br>“1분은 60초, 60 곱하기 60은 3,600초. 즉 한 시간은 3,600초다.<br>하루는 24시간이니 3,600 곱하기 24 하면 하루는 86,400 초가 되는 것이다.<br>일 년은 365일이 되니, 즉 삼천백오십삼만육천초가 되고,<br>10년이면 삼억이라는 시간이 된다.<br>우리가 약 70년을 산다고 보면 22억 752만 초가 되는 것이다.<br>다른 말로 하면,<br>이 글을 읽고 있는 지금 당신의 시간은<br>거꾸로 0를 향해 매우 빠른 속도로 달리고 있다는 것이다.<br>시간이 흐른다는 것은 결국 죽음을 향해 달려가고 있다는 것이다.<br>그런데, 어떤 사람에게는 좀 더 많은 시간이<br>그리고 다른 사람에게는 좀 더 많은 시간이 주어져 있다.<br>우리는 우리에게 주어진 시간을 어떻게 사용하느냐에<br>따라 의미있는 삶이 되기도 하고 의미가 없는 삶을 살다가 가게 되기도 한다.<br>그렇다면, 어떤 삶이 의미 있는 삶이라고 할 수 있을까?<br>나는 감히 사랑하는 삶을 의미 있는 삶이라고 할 수 있다고 생각한다.<br>우리는 누군가를 사랑할 때에 비로서 의미있는 삶이 된다.<br>세상에 있는 모든 부를 다 자기 손에 쥐었다고 하더라도,<br>그 사람을 아무도 사랑하지 않는다면,<br>그리고 그 사람역시 아무도 사랑하지 않는다면,<br>그 삶의 정말 거의 無에 가까운 아무 의미 없는 삶이 될 것이다.<br>우리는 영화나 드라마를 통해서<br>자신의 목숨보다 더 소중히 여기는 한 사람을 사랑하고,<br>또 자신의 목숨을 다해서 누군가를 사랑하는 이야기를 보며 깊은 감동을 받는다.<br>왜냐하면, 우리 마음 깊은 곳에 누군가를 그렇게 사랑하고,<br>또 그렇게 사랑을 받고 싶은 간절한 소망이 있기 때문이다.<br>우리가 그렇게도 그리는 ‘엄마’ 라는 단어만 들어도 괜히 가슴이 뭉클해지고,<br>해외로 입양되었던 아이들이<br>성인이 되어서 한 번 불러보고 싶은 단어가 ‘엄마’ 인 이유역시<br>그 단어를 생각하며 조건 없는 무한한 사랑을 느껴보고<br>체험해 보기 원하기 때문이다.<br>왜냐하면, 우리는 누군가를 진정으로 사랑할 때에<br>그리고 그런 사랑을 받을 때에<br>의미 있는 존재가 되기 때문이다.<br>그런 의미에서 남녀 모두<br>소중한 사람을 만나 그 사람을 진정으로 사랑하고,<br>또 자녀를 낳아 자신들의 사랑 (생명)을 나누어 주고 희생함으로서<br>자신의 의미를 찾게 되는 것이다.<br>이런 맥락에서 우리는 누군가를 사랑하고<br>사랑받을 운명을 갖고 있고,<br>그런 운명을 살아가기를 간절히 원하고 있다.<br>바로, 온 세상의 노래와 영화의 줄거리가 ‘사랑’인 이유다.<br>이런 의미에서 누군가 소중한 사람을 만나서 함께 시간을 지낸다는 것,<br>혹은 사랑하는 사람을 위해서 시간을 쓰는 것은 의미 있는 일이다.<br>따라서, 직장일에 찌든 남편이자 아버지인 자가 집에 들어와<br>사랑하는 아내와의 포옹하는 순간,<br>그리고 눈에 넣어도 아프지 않을 것 같은 아이가 달려와 안기는 순간<br>하루의 피로는 다 날라 가고<br>다시 한 번 생기가 가득한 순간으로 바뀌게 되는 이유이다.<br>혹은, 사랑하는 남편과 자녀를 위해<br>맛있는 음식을 준비하는 엄마의 입가에 미소가 잔잔히 흐르는 이유 역시 동일하다.<br>하지만, 피곤한 몸을 이끌고 집에 돌아왔을 때의<br>아내의 부재와 불평 혹은 사춘기 자녀의 냉냉한 표정은<br>가장들의 스스로의 존재이유에 큰 물음표를 남기게 되는 것이다.<br>이러한 남자들이 중년의 위기를 맞으며,<br>가정이 아닌 다른 곳에서 자신의 사랑을 갈구하기 시작 할 때에<br>(꼭 여자가 아닐 수도 있다)<br>그 가정을 심각한 위험에 몰아넣을 수도 있다.<br>반대로, 사랑하는 남편을 기다리며 맛있는 음식을 준비한 아내가<br>술에 잔뜩 취해 집에 들어와 자신을 쳐다보지도 않고<br>옷을 입은 채로 침대에 들어가는 순간,<br>그리고, 사춘기의 자녀가 밖을 겉돌며<br>‘엄마는 아무것도 몰라!’라고 소리치며 문을 꽝 닫는 순간<br>‘스스로의 의미를 상실하며 방황하게 되는 것이다.<br>그런데, 그 사춘기 자녀 역시<br>자신의 친구들의 인정과 사랑을 쫓으며 심히 괴로워하고 있다.<br>청소년 시기는 부모와 가정 보다는<br>친구와 또래와의 관계를 통해서 자신의 존재의미를 찾기 때문이다.<br>따라서 왕따를 당하고 있는 자녀에게<br>‘너도 그 애들을 무시해 버려’ 라며<br>자녀의 왕따를 가볍게 생각하다가<br>극단적인 결정을 해 버리는 자녀 (심지어는 죽음) 를 잃는<br>심각한 상황에 처하기도 한다.<br>우리는 누군가를 진심으로 사랑하고<br>또 사랑을 받을 때에 비로소 의미 있는 존재가 된다는 것이다.<br>그렇다면 의미 있는 시간이란 무엇일까?<br>바로 사랑하는 사람과 함께 지내는 시간,<br>혹은 사랑하는 사람을 위해서 사용하는 시간인 것이다.<br>그 사랑하는 사람이 반드시 가족에 국한 될 필요는 없다.<br>학생들을 가르치는 교수에게는 사랑하는 제자들을 위한 시간,<br>혹은 그 사랑하는 제자들의 밝은 미래를 위해 강의를 준비하는 시간,<br>직장 동료들의 위해 희생하는 시간,<br>혹은 비행기 조종사가 승객들의 안전한 여행을 위해<br>졸린 눈을 비비며 비행기를 조종 하는 시간이 될 수도 있다.<br>그런데, 동일 한 행동과 일을 하면서,<br>자신이 왜 그 일을 하는지 모르고 한다면,<br>그 일은 시간을 낭비하는 시간이 될 수도 있다.<br>글의 포인트가 잠시 빗나갔지만,<br>결국 우리는 사랑하고 사랑받기 위해 존재한다.<br>사랑이란 바로 그 사람과 그리고 그 사람을 위해서 시간을 사용하는 것이다.<br>그래서 누군가를 진정으로 사랑하게 되면<br>그 사람을 위해서 사용하는 시간이 절대로 아깝지 않은 것이다.<br>그 사람을 위해서 왕복 2시간이나 걸리는 길을<br>혹은 그보다 더 오래 걸린다 하더라고 기꺼이 바려다 주기도 하는 것이다.<br>그리고 바쁜 시간을 쪼개서 그 사람과 함께 있고 싶은 것이다.<br>바로 우리가 스마트폰을 사용하여 절약하는 시간은<br>사랑하는 사람을 위해서 사용되어져야<br>비로소 의미 있는 시간이 되는 것이다.<br>그렇지 않다면, 오히려 우리가 스마트 폰을 이용하여 절약하는 시간이<br>바로 우리의 존재의미를 잃어버리게도 하고,<br>더 나아가 우리의 죽음을 앞당기는 시간이 되기도 한다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02d5ZwvKVZWtXT9srWGAyhhAtr9ScijzRVUFU3Hodngcx6gtHvfvgPxpsy25jDpaYnl?__cft__[0]=AZVujIjEO5kXsScLmlIE4KFTpmp0uQdTT601ycHYPpbRB5RAYZsGwIyLq_1P9XT6epOEP8BVkcHh_Ijpkpv4vU63SlH8jlRmwICj0BM3ObQH0VMrIhg-nDsXE7eezu04_QsACceaCB1riRJ2lJyFXSYi&__tn__=%2CO%2CP-R"}, {"id": 44, "date": "2013년 11월 19일", "year": 2013, "title": "세상에서 가장 힘든 일은", "themes": [9, 2, 5, 8], "content_html": "<p>세상에서 가장 힘든 일은<br>가르치는대로 사는 것 인것 같습니다.<br>좋은 말은 누가 못하겠습니까?<br>그대로 사는 것이 어렵지요.<br>제가 그대로 살진 못하지만,<br>그래도 가르치는 것을 소홀이 하면 안되겠지요?<br>최고의 공부는 가르치는 것이라는 것을<br>교수가 된 후에 알았습니다.<br>강의를 준비하다가<br>성경공부를 준비하다가<br>늘 새로운 것을 깨닫고 배우죠.<br>그래서 좀 이기적인 동기이지만<br>제가 공부하기 위해서<br>가르치려 합니다.<br>가르친다가 보다는<br>함께 공부하는 거지요.<br>이번에는 베드로 전서를 공부하려고 합니다.<br>영어로 함께 보는데요,<br>함께 성경을 알아가는 재미가 쏠쏠합니다.<br>시간은 매주 목요일이고요,<br>이번 주에 시작해서 일단 한 5주 해보려 합니다.<br>시간: 목요일 오전 8시 (1시간)<br>장소: 연세대학교 스포츠과학관 3층 회의실 (318호)<br>대상: 누구나.....<br>함께 하길 원하시는 분은 미리 쪽지 주세요.<br>아침식사 제공합니다 (빵과 우유~~ 커피)</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid037hZaYsTtjNgqPRPxciS8hiBZ5JRDXMJNH1rgiAHAiLndYfn6udUMYGeaZzwctjXHl?__cft__[0]=AZWvtcYw_5dDIX-ddmbPPCouP3vvIaNaA_W17hrNSbqJjrRXqR9VYxQ-vGRNvSHO9nZpBxsnU8miWhImvkCGN5ULvRSHvfHHuD2n1YXP1pzIqDsB82YqMUevWI3nqTF0qIrtxhRP20PDY6ZdENXfMymO&__tn__=%2CO%2CP-R"}, {"id": 45, "date": "2013년 11월 23일", "year": 2013, "title": "우리의 형제 나라 북한이 오늘 역사적으로 국제 장애인올림픽위원회...", "themes": [11, 4, 12], "content_html": "<p>우리의 형제 나라 북한이 오늘 역사적으로 국제 장애인올림픽위원회 IPC 의 정회원국이 되었습<br>니다. 환영합니다~~^^<br>Truly welcome to IPC</p>", "images": ["pdf2_page22_img2.jpeg"]}, {"id": 46, "date": "2013년 11월 27일", "year": 2013, "title": "미양가가양수양미가", "themes": [1, 4, 9, 16], "content_html": "<p>미양가가양수양미가<br>암호가 아닙니다.<br>노래 가사도 아닙니다.<br>바로 제 초등학교 5학년때의 성적표네요.<br>'수'를 받은 과목은 뭔지 아시겠지요?<br>더 대박인 것은....<br>1학년: 명랑하고 활발하며 주의가 산만함<br>2학년: 활발하고 고집이 세며 장난이 매우 심함<br>3학년: 주의가 산만하며 장난이 심하다<br>4학년: 남의 어려움을 잘 도우나 장난이 심함<br>5학년: 명랑쾌활하고 활동력이 강하고 부지런함<br>6학년: 침착하고 명랑하고 장난을 잘 함<br>떠오르는 단어?<br>100% ADHD 주의력 결핍 과잉행동장애<br>정말 우리 부모님뿐만 아니라<br>선생님도 괴롭혀 드렸던 것 같네요....<br>이랬던 내가 공부잘 못한다고<br>아들을 혼내는 것은.... 뭐죠?</p>", "images": ["pdf2_page23_img2.jpeg"]}, {"id": 47, "date": "2013년 12월 7일", "year": 2013, "title": "암환자를 위한 새로운 치료법을 발견할 기세~~^^", "themes": [9, 12, 5, 13], "content_html": "<p>암환자를 위한 새로운 치료법을 발견할 기세~~^^. 학생들과 1박2일 집중 수업중! 학생들의 학문<br>을 위한 열기가 뜨겁다... 치료레크리에이션 학부생들^^.<br>My undergraduate students who are taking Therapeutic recreation. We are in the<br>middle of two day (overnight) intensive seminar. Their zeal for study is quite hot. It<br>is over midnight now and they want to stay awake and work the project overnight.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid026S4jPhRjNX8vh1iUJquhRwSdHYxarCEf6uJfZ9kgvLkDRDkXRn97LA1thgtQ3bBRl?__cft__[0]=AZVd4bwE8SK19_IVK_O5I6BnGMjbttMCQBcU728f7t1ry80JO74EnjJwqVqjebXxW_v1drrJc5rLuQLh2PsmNTE9bV3l33OkJW3P7mfXKbCSF-ONdYb520KTX3dYPKDOUc94CVNInaKAdMfYaY05L2nUC0fv6-Q_Hw6QY0d6EsjgeQ&__tn__=%2CO%2CP-R", "images": ["pdf2_page24_img2.jpeg"]}, {"id": 48, "date": "2013년 12월 31일", "year": 2013, "title": "퇴근 후", "themes": [4, 11, 14, 10], "content_html": "<p>퇴근 후<br>아이들을 송구영신예배 특송 연습에 맡기고<br>잠시 차 한잔의 여유를 갖습니다.<br>만남..<br>우리 인생의 의미는<br>누군가를 사랑하는 데에 있다면,<br>결국 우리 인생의 의미는<br>누군가를 만남에서 시작합니다.<br>태어나면서 부모님을 만나고,<br>자라나면서 형, 누나, 동생, 친구들을 만나고,<br>학교에서는 선생님을 만나고,<br>선생님은 학생을 만나고,<br>사춘기를 겪으며 자신과 만나고,<br>이성을 만나 사랑의 아픔을 겪으며 성숙하고,<br>배우자를 만나고,<br>태어난 자녀를 만나고,<br>직장에서는 상사를, 동료를 그리고 후배를 만납니다.<br>결국 우리 인생은 누구를 만나는 가에 달려 있네요.<br>그런데, 그 만남 만큼 중요한 것은<br>그 만남에 어떤 의미를 부여하는가에 또한 달려 있습니다.<br>소중한 만남을 스쳐 보낼 수도 있고,<br>스쳐가는 만남을 소중한 인연으로 키워 나아갈 수도 있습니다.<br>저는 오늘 제 인생에서 매우 소중한 만남을 가졌습니다.<br>사실은 오늘이 아니라 지난 27일 이었네요.<br>사랑하는 정말 동생같은 커플 성찬이와 산드라가<br>한국에서 처음으로 칠면조디너에 우리를 초대했습니다.<br>초대받은 집에 갔더니 너무 귀한 분들이 또한 초대되어 오셨네요.<br>Molly Holt와 조병국 원장님, 그리고 그분의 조카와 홀트에서 자라고 있는<br>한 아이와 지적 장애를 가지고 있는 한 청년<br>6.25 이후 많은 버려진 고아들을 해외로 입양 할 수 있도록 도와<br>더 좋은 환경에서 우리 아이들이 자랄 수 있도록 도와주신 분들이지요...<br>이 분들을 만나기 까지 전 홀트 아동 복지는<br>우리 아이들을 해외로 입양을 하는 기관인줄만 알았습니다.<br>하지만 그곳은<br>해외로 입양되지 않는,<br>아니 아무도 입양을 원하지 않는<br>중중 장애인 아이들과 청소년<br>그리고 갈 곳이 없는 장애인 고아 성인들이 함께 생활하는 공동체였습니다.<br>설립자의 따님이신 몰리 할머니는 암을 투병중이시네요,<br>한 평생을 한국의 고아와 장애인을 위해 사신 분,<br>연세대학교 의과대학 출신으로 61년 부터<br>홀트의 고와와 장애인을 위해 평생을 헌신하신<br>조.병.국. 원장님은 이제 팔순을 넘기셨네요,<br>자신의 부모에게 버림받은 고아...<br>그리고, 어떤 양부모도 원하지 않는 장애인 고아.<br>이 사회에 가장 약한 자 중에 하나가 아닌가 싶습니다.<br>오늘은 이 만남이 너무 소중
