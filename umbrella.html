3RaioY3dWruYdgo8TxyhoXZjPA854kzA&__tn__=%2CO%2CP-R", "images": ["pdf6_page26_img0.jpeg"]}, {"id": 192, "date": "2022년 6월 15일", "year": 2022, "title": "고 2 겨울 방학이었죠", "themes": [5, 10, 11], "content_html": "<p>고 2 겨울 방학이었죠<br>친구와 함께 석촌 호수를 거닐며<br>앞으로 무엇을 하고 살 것인지<br>대학은 어딜 갈 것있지<br>고민하며 함께 걸었네요<br>그날 친구는 국악을 할꺼라고<br>자긴 서울대 국악과를 갈꺼라고..<br>난 체육을 할꺼라고<br>연세대학교 체육교육학과를 갈꺼라고<br>마음 속에는 있지만<br>누구에게도 한 번도 꺼내 보지는 못했던 이야기<br>그렇게 그 친구에게 고백을 하고 나니<br>머리 속에 '연대체대' 라는 목표가 구체화 되었죠.<br>그 친구와의 석촌호수 나들이<br>내 인생에 매우 중요한 순간이었죠..<br>그리고 우리는 모두 우리의 꿈을 이루었고<br>그렇게 대학 생활을 시작했습니다.<br>소중한 친구인데<br>대학을 시간차로 입학하고<br>어학 연수가고<br>군대하고<br>유학가고<br>그렇게 연락이 끊어지고<br>하지만, 종종 생각나는 친구..<br>오늘 우연히 인터넷 검색을 하다<br>그 친구를 발견했습니다.<br>너무 훌륭하고 멋진 친구가 되어 있습니다.<br>오늘 만나게 되면 거의 30년 만에 만나게 되네요<br>알고 보니, 이 친구 직장이 제 직장에서 불과 3키로<br>오늘 만나러 갑니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02CTD9erxKCz8tSMRccrJngyY4Q5Br8y7oCfMwKmAC4RjqZKpq1iWYYnyjS5BN8cfml?__cft__[0]=AZXdx2womPyPycBP17idrmBKtxk2eD6RDmW0RWM7Iv5J0e0kk-bUqx9xs84ALipxWqfx60f7itJ-bN1IXT1KXZ9p2WxoQNACEebWbkwiSde_macKHxx-nV7vfF2BCru6sRr4FbuVzn9YoX9e9oLNJpPn&__tn__=%2CO%2CP-R"}, {"id": 193, "date": "2022년 6월 25일", "year": 2022, "title": "우리의 기쁨과 즐거움의 원천이자", "themes": [5, 10, 4, 6], "content_html": "<p>우리의 기쁨과 즐거움의 원천이자<br>걱정과 근심의 원천인<br>The source of our joy and pleasure<br>yet the source of our worry and concern<br>기현이...<br>Daniel<br>New chapter of his life in Canada has begun.<br>이제 한국에서의 삶을 마치고<br>캐나다에서 새로운 삶을 시작하네요..<br>Less worry and anger<br>But significantly less joy and happiness.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02eDyA6n1doaogW9GBtErqjxP6LCCT4DsXR47xin2Jgb2wxbJ7eK8yyUxaw5JmogvTl?__cft__[0]=AZWLquPQmA00gjUod-EtUAJkPQxGScmBj3JEX_Nj7ulPrddMfFxg8llrVQjBqo80VPT1ebPHEK4vGYJI4Fne9xPIEE_mHK-fjlSdpKeNMarKcQUcJvXgelejG1ArZO-fOuxlea-f26LpJ0mQD6XeAAGK1KxKcxf2O9M2bdn_e5XpjQ&__tn__=%2CO%2CP-R", "images": ["pdf6_page29_img2.jpeg"]}, {"id": 194, "date": "2022년 7월 9일", "year": 2022, "title": "며칠 전 퇴근하는데 ,", "themes": [9, 6, 13, 5], "content_html": "<p>며칠 전 퇴근하는데,<br>내이름이 적혀 있는 소포가 하나 보인다.<br>무심코 픽업을 해서 며칠 뒤 뜯어보았다.<br>이지선 자매다 (지금은 교수님)<br>지선자매 (괜히 친한척)의 페북글을 통해 보았던 익숙한 표지다<br>한 장을 넘겨 보니,<br>지선자매가 정성스럽게 쓴 글과 싸인이 보인다<br>참 한결같은 자매다.<br>스치는 인연을 아름답게 간직해 준<br>고마움에 가슴이 따뜻해 진다.<br>나의 생각은 문득 2001년으로 돌아간다.<br>박사학위 마무리를 하며<br>논문, 사역, 사업, 선교로 몸과 마음이 지쳤을 때<br>지선 자매의 이야기를 처음 언론을 통해 보았고<br>자매의 글을 읽으며 오열했다.<br>감사에 빈약한 나 자신이 부끄러웠고,<br>지선자매의 글이 주는 힐링 파워에 무릎을 꿇었고<br>지선자매의 모습 뒤에 계신, 그분의 임재함에 위로를 받았다.<br>연구실에 출근하면,<br>지선자매가 새로 쓴 글이 있나 찾아 읽었고<br>BGM 무한 반복 음악을 들으며 논문을 썼다.<br>학위 논문을 마무리 하고,<br>보스톤 행을 준비할 때 즈음<br>지선자매가 밴쿠버 코스타에 온다는<br>반가운 이야기를 들었다.<br>WHY NOT EDMONTON<br>이라는 생각으로 잠시 푸념하다<br>WHY NOT 이라는 생각으로<br>주최 측에 연락을 해서,<br>지선자매를 에드먼튼으로 초청했다.<br>감사하게도 지선 자매는 초청에 응해 줬다.<br>너무 감사했다. 고마웠다.<br>내가 수년간지선 자매의 글을 통해 받은 위로를<br>많은 다른 분들에 함께 했으면 했고,<br>나의 바램은 현실이 되었다.<br>지선자매는 한국으로 돌아갔고<br>우리 가족은 보스톤으로 떠났다.<br>보스톤과 연세대에 양다리를 거치고<br>한국으로의 영구 귀국을 준비 중 일 때<br>세브란스 심장내과에 발표를 하러 갔다가<br>(이날 윗 분이 주시는 술을 거절해 분위기 뻘줌)<br>이종호 교수님과 박사과정 공부 중이신 김경철 교수님이<br>그날의 뻘쭘함으로 부터 나를 구원해 주셨다.<br>사모님이 보스톤으로<br>박사 학위 유학을 가신다고 했다.<br>방을 구하고 있는데, 어려움이 있다고 했다.<br>그때, 보스톤으로 간다는 지선자매가 떠올랐다.<br>와우. 이 두 분이 함께 우리집에서 살면 얼마나 좋을까???<br>나의 바램은 또 현실이 되어,<br>두 분이 우리 집에 살게 되는 영광을 누렸고<br>김경철 교수님과는 함께 연구하는 관계가 되었고.<br>(김경철 교수님의 나의 유전학 선생님)<br>김경철 교수님의 소개로 만난 임지애 선생님,<br>임지애 선생님의 소개로 만난 세브란스 이지원 교수님,<br>그리고 그때 또 함께 만난 간호대학 추상희 교수님...<br>그리고... 계속된 축복의 만남 들.<br>나의 인생에 너무나 소중한 분들을 그렇게 만났다.<br>어찌 보면, 이지선 교수님 (여기부턴 공식 명칭) 이<br>다리가 되어 만나게 된..<br>이지선 교수님과 김상희 교수님 유학 가기 전<br>중국집에서 우리 세 가정이 만나<br>함께 식사도 하고 기도도 하고 했던 기억이 난다.<br>그리고, Cabot 214, Newton MA, USA 라는<br>아랫집 이웃인 Tricia 와 함께 했던<br>새로운 커뮤티니가 형성되었다.<br>은혜로다...<br>이지선 교수님의 \"꽤 괜찮은 해피엔딩\" 을 읽으며<br>역시 이지선 교수.. 새로운 감동에 젖어 든다.<br>강추..<br>#꽤괜찮은해피앤딩, #보스턴라이프</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02789QKK47vYDZCu9LSmYbJK3BgcV5MqAaEvwB4SaNNUWL1ybZL3dUJuGwrs695Le2l?__cft__[0]=AZVfqtevAz8o-KQTFybiVqax0rPRoJiboWmK5VpUtva2b4JQKp7C3twXp1laYPZe1rPnh_MK1tiDVeVTxDOoOiFhI0DCyx6mgeMJ_pw2gR59XngR21JdXkkB8e9gmeFV6WgnDdH0O0BQocYvCdYPGTygH46X9_FFDWRlwGhyrdg8RA&__tn__=%2CO%2CP-R", "images": ["pdf6_page32_img2.jpeg"]}, {"id": 195, "date": "2022년 7월 17일", "year": 2022, "title": "세상에는 참 훌륭한 분들 (고수)이 많다", "themes": [6, 5], "content_html": "<p>세상에는 참 훌륭한 분들 (고수)이 많다<br>때론, 남이 알아주지 않아도<br>자신의 능력을 인정해 주지 않아도<br>아니, 때론 무시당하고, 부당한 대우를 당해도<br>묵묵히 자신의 소명을 찾아 이루어 간다<br>이런 분들의 특징들은 아래와 같다<br>1. 자신이 다 안다고 생각하지 않는다.<br>그래서 항상 배우려고 한다.<br>그래서 겸손하다.<br>2. 조직이 아니라 사람을 본다.<br>그래서, 때론 치사하다고 느끼는 상황속에서도,<br>사람을 보고 묵묵히 자신의 일을 한다.<br>3. 뭐가 감사한지, 계속 감사하다고 한다.<br>그래서 그런지, 이런 분들은 자꾸 만나고 싶다.<br>4. 자신이 발견한 사실, 혹은 지식을<br>자꾸 다른 사람과 공유하려고 한다.<br>뭐 좀 도와 달라고 하면,<br>그냥 서슴치 않고 바로 도와준다.<br>이런 분들이 좀 더 대우 받으면 좋겠다.<br>이런 분들을 모시고, 함께 일하고 싶다.<br>어떤 성취를 이루지 못할 지라도 그냥...<br>이글을 읽으며,<br>이거 혹시 내 이야기를 쓴건가? 라고 느낀다면<br>맞다..<br>바로 당신 이야기 입니다.<br>감사합니다.<br>고맙습니다.<br>응원합니다.<br>포기하지마세요.<br>그냥 버티세요.<br>곧 더 좋은 날이 올 거예요.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02KPDHkt8iY8FeEz9aT1crsnyWgeCPq6imHyXVGro4QzUuGsiBWVkMn8WTXDvxcBUxl?__cft__[0]=AZXT3yYmuwdLW_A01w3Xxe3K3jlWmDgv0ip4HGWF3XWEEai3vB5Mxwt180u4CuVo_mbe9cvByOV4ZnAjsoj1mSj8azfaSToICisz7lcQ_8ZlikLTOxAMXKjuwY0ASWRXeW6NqmlRZpKKWvqoJGMcxw_o&__tn__=%2CO%2CP-R"}, {"id": 196, "date": "2022년 8월 8일", "year": 2022, "title": "지난 3일간 12 시간 강의 강행군을 잘 마쳤습니다 .", "themes": [9, 6], "content_html": "<p>지난 3일간 12 시간 강의 강행군을 잘 마쳤습니다.<br>이번 강의를 통해서 미국 LA에<br>숨은 고수분들을 많이 만났습니다.<br>역시 최고의 공부는 강의라는 것을<br>다시 확인하는 시간이었습니다.<br>600장이 넘는 강의 슬라이드 준비와<br>거의 100개에 육박한 강의 시간과<br>사석에서 받은 질문들을 답변하며,<br>머리속에 많은 것들이 정리가 되었습니다.<br>이런 기회를 주신 여러 분들에게 감사합니다.</p>\n<p>Finally completed 12 hours of lectures, lunch meetings and evening meetings.<br>Meeting lots of wonderful, intelligent, humble leaders in LA regions was such a<br>blessing.<br>The best way to learn is to teach<br>Now back to Calgary, and soon back to Korea.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02nbWvcbvXVik2JPzdyVFisyBSjwXaeBRbZRJKJABc7GzGPYsqtWbeQYzoCyKK5231l?__cft__[0]=AZXsRn99hpSujxQIqe7lGFX2p89tbsSQ-RiRCc3aOpCIPvCUisMuT6HtT8Ei6xb5-LdD0ug3lUyg2xQtAR_eXFORLorUclD_CDYO7Bv8FLkUtJ28TLTwEyGPyyTgy21YpcUIfQh_uIfB3M36AvvzOCiW-DARdNpHsin84DcpmHv1Jw&__tn__=%2CO%2CP-R", "images": ["pdf6_page34_img2.jpeg"]}, {"id": 197, "date": "2022년 9월 5일", "year": 2022, "title": "33년 만에 처음으로", "themes": [2, 12, 1, 6], "content_html": "<p>33년 만에 처음으로<br>동네 수영장 새벽반을 등록했다.<br>수영이야 그럭저럭 하겠지만<br>저질 체력이 걱정되어 초중급으로 들어갔다.<br>와우. 중급반에 들어간게 얼마나 다행인지<br>지난 주 금요일 첫 클라스 50분 수영하고,<br>하루 종일 심박수가 장난아니게 올라갔다.<br>오늘 새벽, 두번째 클라스<br>그래도, 지난 주 한 번 했으니까 오늘은 좀 덜 힘들겠지...<br>분위기가 이상했다.<br>다들 오리발을 들고 왔다.<br>ㅋㅋ 저 사람들은 상급반일 꺼라 생각했다.<br>아뿔싸..<br>나만 오늘 오리발 없이,<br>아줌마들 뒤를 따라가며,<br>헉헉 50분 수영을 마쳤다.<br>오리발의 위력을 느꼈다... ㅠㅠ<br>나의 저질 체력을 다시 한 번 느꼈다 ㅠㅠ</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0krAtGz4wEwUgBbM7h5gtLMJjVTjdGcekzpw6cR5uxuLoXMGnqm6m2QjuuBXjP8z7l?__cft__[0]=AZXempNu5yp-sv04NcylJmilVlRosSXuxdTwOwnpAoNI80X96Pdb7D2ZLPFFyRCb1l4JTPOGHSm2N9YbPl9RMw1_AkzaXeadsaMH1ri920DIqj5MdEJ5PjrhWi9kDkmbintHAlGewaa21ip6RKADilcO&__tn__=%2CO%2CP-R"}, {"id": 198, "date": "2022년 9월 12일", "year": 2022, "title": "드디어 이번 학회 발표가 끝났습니다 .", "themes": [13], "content_html": "<p>드디어 이번 학회 발표가 끝났습니다.<br>이번 학회에는 총 3만명의 학자가<br>참여 했다고 하네요.<br>예전에 같이 미국병원에 근무하던 친구들과<br>함께 만나 파뤼도 하고<br>학회 좌장도 하니 감회가...<br>이제 내일 귀국전에 관광 좀 다녀야 겠습니다.<br>이번 발표의 최고의 칭찬은<br>경비를 보는 여자 알바생에게 들었습니다.<br>한 경비 여자 알바생이 나에게 뭐라고 하길래<br>들어보니 '내 강의를 잘 들었다'<br>'난 화학과 공학 전공인데 영어를 잘 모르는 나도 이해했다' '고맙다'<br>내가 어려운 영어 단어를 몰라서...<br>학회 다니면서 들은 최고의 칭찬인것 같습니다.<br>#ESMO #운동이약이다</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0XNfUMvpofbNavfiXpABmUW5qq7AQXE2c4DpAtG6LLcZue3zuqx75CvLHvNQQpypGl?__cft__[0]=AZU6z7qBN6i4LPVZjA_jxu1__JSHccq_GwJLQu-vP-zcg9o722iMOd5OO4ZImPvPVbvuIpJbzxBnEIrPQRVgzLJZUZQJKUImtXe_hygBjqoCvIu4dFIoeh6hrYJABPxPDnAipCzYfGBjSq53Odwrc-9a1_vOrWGpXVjO6aw2jtveuQ&__tn__=%2CO%2CP-R", "images": ["pdf6_page36_img0.jpeg"]}, {"id": 199, "date": "2022년 11월 3일", "year": 2022, "title": "지난 3년간 수많은 회의, 자체 심포지엄 ,", "themes": [11], "content_html": "<p>지난 3년간 수많은 회의, 자체 심포지엄,<br>평가회의, 논문 작성 그리고 최종 발표 까지<br>한국 어린이 청소년 신체활동 지표,<br>Global Matrix 4.0 이 드디어 세상의 빛을 보았다.<br>우리의 미래인 어린이 청소년<br>10대 사망원인 1위 자살<br>1년에 한 학교 (한 학급 25명, 30개 학급)<br>의 구성원이 될 만한 숫자의 학생들이<br>스스로 목숨을 끊는다.<br>1주일 한 시간 체육활동만 해도<br>전혀 체육활동을 하지 않는 학생들보다<br>50% 더 행복해 하는 아이들<br>의료진을 포함해서 모두가 다 아는<br>최고의 우울증 치료제, 신체활동과 운동...<br>과연 우리 나라 소아 청소년들을 얼마나 신체활동을 할까?<br>전 세계 각국과 비교해서는 어느 정도의 수준일까?<br>결과가 나왔다.<br>신체활동 D- (우리나라 보다 낮은 나라 11개국)<br>관련 정부정책은 A (이번 평가에 참여한 57개국 중 1등)<br>결국 우리나라 신체활동 증진 정책은 A 인데,<br>실제 신체활동량은 D-<br>완전 신체활동 후진국 형의 모습이다.<br>정책이 높은 점수를 받고, 실제 신체활동량은 낮은 나라들..<br>칠레, 대만, 헝가리, 인도네시아, 아랍에미레트<br>정책과 신체활동이 둘 다 높은 나라<br>핀란드, 일본, 슬로바키아 등.<br>어떻게 하면, 우리나라 소아 청소년들이<br>좀 더 많이 뛰어 놀고,<br>더 많이 스포츠에 참여하고<br>그래서 더욱 건강하고 행복하게 해 줄까?<br>고등학생이 눈치 안 보고 운동하고<br>부모와 자녀가 학원 대신, 함께 야외에서 뛰어놀고<br>참여가 즐거운 학교 체육 (시수가 확보된)<br>모두가 수준에 맞추어 재미있게 참여하는 스포츠 클럽<br>운동하는 일반 학생, 공부하는 운동부<br>운동하다, 다치면 공부해서 자신의 꿈을 펼치는 선수들<br>이런 스포츠 선진국, 체육 선진국을 만들 수 있도록<br>힘을 모으고, 생각을 모아, 실천에 옮길 수 있으면 좋겠다.<br>우리 어른들이 답을 주어야 한다.<br>위 내용에 공감하신다면, 아래 기사를 SNS 로 공유 부탁드립니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0N8svtQTPF5nWmn5hxyMnjCs5zT39z1MF5LKtLLsnqavaiS64jmgxwFwKFjYA6Nghl?__cft__[0]=AZUPL5h9DA8gMA4AwxeD3EYz1SCe8SVz7gIUzy-VnhvGcz23hJ-poZ9py5-m6oI_8YihsGNXLnQ4kIMTtvC1BVPsyXc0J8tDRVgyTM61YxBTP79rBltBkxPVNbc-xhUaAg8-qYcC6c5h0txbTYcLkhCS7F5RCiDjKimx0D9bQ9HpYw&__tn__=%2CO%2CP-R"}, {"id": 200, "date": "2022년 11월 21일", "year": 2022, "title": "#목욕탕", "themes": [16], "content_html": "<p>#목욕탕<br>어린 나는 아버지의 손을 잡고<br>목욕탕에 다녔다.<br>뜨거운 사우나에 들어가<br>오래 버티는 아버지는 초인이었다.<br>나를 앉혀 놓고 등을 밀어 주시고<br>목욕이 끝나면 짜장면을 사 주셨다.<br>목욕탕에 가는 날은 짜장면 먹는날 ^^<br>아버지의 손을 잡고<br>목욕탕에 다닌다.<br>도움이 없이는 탕에서 나올 수 없는<br>아버지는 5급 장애 노인이다.<br>아버지를 앉혀 놓고, 발에 각질을 제거해 드린다<br>목욕이 끝나면, 짜장면과 탕수육을 사드린다.<br>치매이신 아버지가 오해를 하신다.<br>어쩜 마음 깊은 속을 들여다 보시는지도<br>목욕탕 가는 날은 기쁜데 슬픈날이다</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0AcWggqqZnWSkcS8wee24AudbFPk2WoAbcdUkLYwnaWDStqgK22AiQiP6HLZ45etwl?__cft__[0]=AZWxGmpmjgH0E5z0j6jP8FBr4hOrvR0VMWGF2rbVdvRweX3bEUxvvkEkl0s-qD8mzvoDz_hIZM-YZPDlx5U2T_7uTz9qumFbNp2JsPrRCnhVcHeZ4Z9750O-5-FNbEoPnVgsf6iUNbRsprSmpbcaRtDV&__tn__=%2CO%2CP-R", "images": ["pdf6_page42_img0.jpeg", "pdf6_page44_img0.jpeg"]}, {"id": 201, "date": "2023년 3월 27일", "year": 2023, "title": "노력을 많이 했다.", "themes": [13, 2, 6], "content_html": "<p>노력을 많이 했다.<br>최선을 정말 100% 다 했다고는 할 수 없겠지만.<br>약 7주 정도를 주말에 쉬지도 못하고 최선을 다했다.<br>결국 발표까지 는 갔지만,<br>과제를 수주 하지는 못했다.<br>그래도, 우리 암생존자들을 위한<br>나의 연구는 계속 되겠지.<br>아니, 계속 해야지.<br>그래서, 그분들을 위해<br>조금이나마 도움이 되어야 겠지.<br>그래도, 감사한 건<br>기름이 떨어지지 않고<br>연구를 계속 할 수 있다는<br>그래도, 다행인 건<br>내가 뽐 나게 다 주지는 못하지만,<br>연구원들은 부족함이 없다는 것이<br>그리고, 바라는 건<br>\"운동과 신체활동을 통한 건강한 대한민국 만들기\"<br>아래 영상을 보며<br>가슴 뭉클...<br>모든 암 환우들의 싸움에 응원합니다.</p>"}, {"id": 202, "date": "2023년 3월 28일", "year": 2023, "title": "요즘 연구를 진행하며 드는 생각", "themes": [13, 2], "content_html": "<p>요즘 연구를 진행하며 드는 생각<br>당연한 것을 당연한 것으로 받아 들이지 마라.<br>당연하다는 생각: 유방암 환자의 수술한 쪽 팔의 관절 가동범위와 근력이 준다. 그리고, 줄어든<br>상지의 관절가동범위와 근력은 상당기간 지속될 것이다.<br>연구 결과: 적절한 맞춤형 운동을 하면, 한달 이내 수술한 팔의 관절가동범위와 근력은 95% 수<br>술 전 수준으로 돌아온다. 놀랍다.<br>당연하다는 생각: 수술한 반대쪽 팔의 기능은 정상일 것이다. 실제 많은 연구들이 수술 받은 쪽<br>어깨 기능의 감소폭을 결정할 때, 수술 받지 않은 팔의 근력과 비교하기도 한다. 사실, 수술하지<br>않았으니 근력이 줄 이유가 없다.<br>연구 결과: 수술 받지 않은 팔의 근력이, 수술전과 비교해 유의하게 감소하며, 심지어 6개월간<br>지속적으로 감소한다.<br>왜? 운동을 안 하니까... 실제 줄어들 이유가 없는데 줄어들게 된다.<br>운동이 약이다.<br>운동이 답이다~^^<br>3년전에 종료된 연구인데, 오늘 논문으로 나와 올립니다.<br>https://authors.elsevier.com/a/1gpjr5RAAom4P-</p>"}, {"id": 203, "date": "2023년 4월 23일", "year": 2023, "title": "지난 주 늦은 오후", "themes": [4, 12], "content_html": "<p>지난 주 늦은 오후<br>도서관 카페에 가서 주문하는 나<br>보통은 뜨거운 아메리카노<br>그날은 아이스아메리카노가 땡김<br>\"아이스아메리카노 따뜻하게 주세요\"<br>아뿔싸!!<br>당황한 카페 녀..<br>민망한 나...<br>아이스아메리카노요 (아무일 없는 척).<br>ㅋㅋㅋ<br>아이스아메리카노 따뜻하게.ㅠㅠ<br>나같은 사람이 또 있을까?<br>정신줄 꽉 잡아야되는데. ㅠ</p>"}, {"id": 204, "date": "2023년 5월 1일", "year": 2023, "title": "\"용관아 까불면 다친다 \"", "themes": [2], "content_html": "<p>\"용관아 까불면 다친다\"<br>학생들에게 늘 이야기 했죠.<br>\"다른 사람에게 보여주려고 운동하다 다친다.\"<br>\"너나 잘 하세요\"<br>ㅠㅠ<br>요즘, 운동량을 조금씩 늘리면서 힘이 좀 올라왔다고<br>그새 까불고, 운동 하다가, 무릎 인대가 찢어졌네요.<br>나름 전문가라고,<br>운동은 약이라고,<br>까불다 다쳤네요.<br>쩔뚝거리며, 어떻게 된거예요 물으면<br>\"괜찮아요. 2주 봅니다\"<br>뭐 아는척 또 까불었고<br>이제 거의 4주가 다된 지금<br>이제야 다리를 절지 않고, 걷네요.<br>까불면 다칩니다.<br>다시 한 번 깨닫습니다.<br>까불지 말아야 겠습니다.<br>요즘, 팔복 공부를 하는데,<br>\"심령이 가난한 자는 복이 있나니\"<br>\"애통 하는 자는 복이 있나니\"<br>하나님은 저에게<br>무릎 통증을 통해 복을 주신 것 같습니다.</p>"}, {"id": 205, "date": "2023년 5월 22일", "year": 2023, "title": "오늘 연구원들과 야유회 ^^", "themes": [8, 12, 13], "content_html": "<p>오늘 연구원들과 야유회^^<br>살인배구 한번도 안 해 봤다고 하더니 내가 술래가 되니 갑자기 모두 잘함!!</p>"}, {"id": 206, "date": "2023년 7월 10일", "year": 2023, "title": "28년 전 오늘!", "themes": [3, 2, 5, 6], "content_html": "<p>28년 전 오늘!<br>유난히 비가 많이 오고, 무더웠던 날.<br>그렇게 함께 결혼이란 여정을 시작했네요.<br>지난 28년, 부족한 나와 함께 해 줘서.<br>유별난 나와 함께 해 줘서,<br>참 고맙습니다.<br>28 years of marriage in 4 different countries..<br>Thank you for sharing life with me.<br>Thank you for enduring me and enjoying the beauty of life with me.</p>"}, {"id": 207, "date": "2023년 8월 20일", "year": 2023, "title": "학교와 선후배 교수님들의 배려로", "themes": [3, 4, 9, 13], "content_html": "<p>학교와 선후배 교수님들의 배려로<br>어제부터 캐나다 캘거리에 와 있습니다.<br>한국에 돌아가는 10월 말까지<br>이곳에서 밀린 논문 작성과<br>캐나다와 미국 교수님들과<br>공동연구 작업을 하게 됩니다.<br>사랑하는 아들들과<br>함께 시간을 보내는 것은 보너스<br>이곳에 있는 동안<br>여러 가지 생각들을 주저리 주저리 공유하겠습니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0uwRGmyiKKUN58rbmpvP1umvewWYqiaKF8RA36TmzWNTHovQWWfc4szFCVJA5ZDWPl", "featured": false}, {"id": 208, "date": "2023년 9월 3일", "year": 2023, "title": "캐나다에 온지 이제 2주가 지났습니다.", "themes": [3, 4, 6, 8, 9, 10], "content_html": "<p>캐나다에 온지 이제 2주가 지났습니다.<br>매일 하루 두끼에서 세끼 밥을 하려니,<br>주부 습진이 생기는 것 같습니다.<br>아예 요리를 안 하려고 하는 큰 아들과<br>모든 요리를 하려고 하는 둘째 아들 사이에서<br>(맛은 괜찮은데, 요리를 하고 나면, 부엌에 폭탄이 터진듯)<br>생존하고 있습니다.<br>지난 주에는 에드먼튼에 가서,<br>Kerry Courneya 교수님과 회의하고<br>아예 랩미팅도 함께 하고 왔습니다.<br>캘거리에 있는 동안<br>2주에 한 번 2-3일씩 에드먼튼에 가서<br>미팅과 공동 프로젝트를 진행할 예정입니다.<br>에드먼튼은 저에게는 제 2의 고향입니다.<br>두분의 누님과 네명의 조카가 살고 있고<br>그곳에서 신앙을 가졌고<br>아내를 만났고<br>지도교수님을 만나 학위를 취득했고<br>교회와 커뮤니티를 섬기는 너무나 귀한 분들을<br>만나 함께 생활했던 곳이죠.<br>에드먼튼에 가면 그냥 마음이 편합니다.<br>커피숍, 서점, 식당, 캠퍼스 내에 기숙사<br>기숙사 내에 위치한 많은 숍들<br>내 인생을 새롭게 설계한 도서관<br>기도실..<br>이제 캘거리와 에드먼튼에<br>저의 사무실이 어느정도 셋업이 되어<br>밀린 일을 이제 시작할 수 있을 것 같습니다.<br>참! 이번에 새로 책을 한권 쓰고 있습니다.<br>'옥시토신 이야기' 인데요,<br>옥시토신이 너무 신기하고<br>우리 몸과 마음에 너무 중요한 호르몬이라<br>이번에 제대로 소개하는 책을 쓰고 있는데<br>이제 거의 마무리 단계에 들어갔습니다.<br>함께 하는 출판사에서<br>나에 대해 좀 더 알고 싶다고 해서<br>열심히 페북 글을 복붙을 하다 보니<br>미처 예전에 놓친 댓글들에 답글을 달았습니다.<br>그랬더니, 많은 분들의 피드에<br>본의 아니게 노출이 된 것 같습니다.<br>다른 글은 괜찮은데,<br>7-8년전에 다친 사진이 자꾸 떠서<br>한글을 못 읽으시는 분들에게 걱정을 끼친 것 같습니다.<br>죄송합니다~^^.<br>이제 9월이네요,<br>올해 캘거리에 9월에 눈이 올지 궁금하네요.<br>새로운 한 주, 한학기의 시작을 축하 (혹은 자축) 드립니</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0WatMrHjckX5MUJV8GzkGE43jPTr5TttJZPP53zw8tJdiGwpkEpTm7QRicNrKmfGLl", "images": ["pdf7_page1_img0.jpeg"], "featured": false}, {"id": 209, "date": "2023년 9월 19일", "year": 2023, "title": "캐나다 주부생활 완전 정복..", "themes": [3, 4, 5, 13], "content_html": "<p>캐나다 주부생활 완전 정복..</p>\n<p>아니..<br>완전 개고생<br>새벽 6시면 일어나<br>학교 등교하는 둘째<br>직장 나가는 첫째<br>아침 해주고<br>도시락 싸주고<br>학교 바려다 주고<br>운동하고 집에 오면<br>멍뭉이 산책<br>잠간 일하다 보면<br>아들 귀가<br>오늘 저녁 뭐 해먹지?<br>도시락은 어쩌지?<br>저녁먹고 치우고<br>둘째 숙제 봐주고<br>빨래하고 등등<br>그럼 밀린 메일 답장<br>줌 회의 등등..<br>아 그럼 자정<br>새벽에 일어났더니<br>아들이 오이를 꺼내 놨다.<br>오이소박이까지 만들라고ㅠㅠ<br>밥 나가서 먹자고 하면<br>그냥 집에서 먹자는 아들이 무섭다.<br>캐나다 물가가 장난이 아니라<br>외식도 부담되긴 하지만<br>오늘은 꿈자리가 뒤숭숭 하더니<br>가운데 손가락 자르고<br>가운데 손가락 아들 보여주며 놀리다<br>검지까지.ㅠㅠ<br>다친 손가락 보여주니<br>저절로 V 자가 된다.<br>빅토리<br>내 손가락 수난 시대..<br>아내가 그립다ㅠㅠ<br>모든 주부님들 리스펙트</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid035YibCCsBCTS9V7eUgYDMa8UCx8u6PPkeMwq397Wh3ugdnJRSm4nookfDCWBqeyE5l", "featured": false}, {"id": 210, "date": "2023년 10월 5일", "year": 2023, "title": "캐나다에서", "themes": [4, 5, 6, 9, 13], "content_html": "<p>캐나다에서<br>주부생활<br>교수생활<br>연구자생활<br>3중생활을 하다 보니<br>스트레스가 많이 쌓인다.<br>속으로 신경질을 내며 설거지를 하다<br>또 칼에 손을 비었다.<br>아~<br>오늘은 일상을 벗어나기 위해<br>Get out of ordinary<br>미친 짓을 할 필요는 없다는<br>나만의 신조 아닌 신조를 생각하며<br>Extra ordinary behavior<br>둘째 등교 시키고<br>바로 밴프로 갔다.</p>\n<p>사실 누군 평생의 꿈이<br>밴프 한 번 오는 거라는데,<br>난 한 시간 15분 운전하면<br>갈 수 있다는 사실이...<br>그저 감사할 따름.<br>밴프에 가면 꼭 하는 건<br>온천 목욕<br>차를 세우고,<br>목욕가방이 든 가방<br>그 가방안에는 컴퓨터와 벽돌책 두권..<br>문득 온천 앞에<br>산길이 나를 보고<br>올라오라는 손짓을 하는듯한 착각<br>게시판을 읽어보니 정상까지 6키로 란다.<br>속으로 \"이거 할만한데\"<br>남들은 돈내고 케이블카 타고 올라가는데<br>\"난 체육과 교순데, 걸어 가볼까\"<br>라고 생각하고 올라가기 시작했다.</p>\n<p>5분 정도 가다,<br>가방을 괜히 가져 왔나라고 생각하고<br>차로 돌아가 가방을 두고 올려다<br>\"산에서 내려와 온천갈때 편하겠지\" 라고<br>생각하고, 그냥 가방을 메고 올라갔다.<br>귀에 이어폰을 끼고<br>듣고 싶었던<br>팝케스트를 들으며<br>룰루 랄라 올라갔다.<br>뒤에서 여자 둘이 쫓아 온다.<br>질수 없다는 생각에<br>더 빨리 올라갔다.<br>그런데, 한참 갔는데,<br>아직 정상이 멀다<br>내려다 보니,<br>3분의 1 밖에 안 올라갔다.<br>힘내서 또 올라갔다.<br>뒤에 쫓아 오던 여자들이 안보인다.<br>\"역시 난 아직 살아있다\"고 자만.<br>3분의 2쯤 갔을까?<br>심박수가 165다.<br>내 나이를 고려 했을 때,<br>거의 최대 심박수다.</p>\n<p>뒤에서 쫓아오던<br>여자들과의 간격이 좁아진다.<br>등산을 시작한지<br>1시간 20분이 지났다.<br>그냥 계속 오르막이다.<br>어질 어질 하다.<br>뒤에서 오던 여자들이<br>날 추월한다.<br>내가 가방만 없었으면...<br>속으로 말하고 보니<br>그들도 가방을 메고 간다 ㅠㅠ<br>내 가방이 더 무거울껄... ㅠㅠ<br>(망할 자존심)</p>\n<p>또 남자 한 명 도 추월한다.<br>그래도, 내 앞에 아시아인 커플이<br>나보다 더 헤메고 있다.<br>그들을 추월하며, 스스로 위안한다.<br>작은 목소리로..ㅠㅠ 체육과!!!</p>\n<p>위로, 케이블카가 보인다.<br>아 저걸 탔어야 했나?<br>그래도, 체육과 교순데...<br>다리가 후덜덜... ㅠㅠ<br>등산을 시작한지<br>한시간 40분여만에<br>정상이 보인다.<br>정상에 올라가니<br>앞에 펼쳐지는 광경이 황홀했지만<br>당이 떨어져 바로 카페로..<br>평소 안 먹던 핫 초콜릿에 휘핑 크림까지<br>거기에 맛 없는 샌드위치 까지 순삭.<br>앞에 광경을 쳐다보니<br>다시 내려갈 걱정이 앞선다.<br>그래도, 케이블카로 내려 갈 순 없다.<br>체육과 교순데.ㅠㅠ</p>\n<p>내려오는데<br>무릎이 아파온다.<br>내가 미쳤지.ㅠㅠ<br>그냥 케이블카 탈껄<br>내려가는 길이 지그재그라<br>위험해도 중간으로 내려가면<br>지름길이다<br>내려가다 엉덩 방아 두번 찧었다.<br>그리로, 내려가는 날 보더니<br>한 사람이 뭐라 한다.<br>'자연을 보호해야지'<br>난 힘들어 죽겠는데 뭐래니?<br>라고 하려다가.<br>고분히 '네' 하고 내려간다.</p>\n<p>올라오는 사람들이 많이 보인다.<br>속으로 이야기 해 주고 싶다.<br>'케이블카 타 그냥'<br>내가 미쳤지.<br>가방을 두고 갔어야지!!<br>드디어 다 내려와<br>온천에 몸을 담그니<br>잠이 스르르..</p>\n<p>집에 오늘 길에<br>큰 아들에게 전화가 온다.<br>둘째 과외 선생이 온다고 빨리 오란다.<br>집에 다 와서 한국 식품에 들려<br>무려 150불 어치 장을 본다.<br>애들 맛난 밥을 해 줄 생각에<br>입가에 미소가 진다.<br>난 체육과 교수 주부다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02T56jW896pdJjgksJP7vYe8a3td8Xe45gee7HVDEcSCRptb49auiibSsMBg6G5m2Dl", "images": ["pdf7_page4_img0.jpeg", "pdf7_page8_img0.jpeg"], "featured": false}, {"id": 211, "date": "2023년 10월 7일", "year": 2023, "title": "나는 주부다ㅋ", "themes": [1, 4, 12], "content_html": "<p>나는 주부다ㅋ<br>새벽에 일어나<br>아들 밥을 챙긴다<br>자는 애를 깨워 밥을 먹인다.<br>잘 안 먹는다.<br>협박한다.<br>밥을 먹다 남기고 간다.<br>학교에 애를 내려 주고 집에와<br>먹다 남긴 밥을 내가 먹는다. ㅠ</p>\n<p>나는 주부다 ㅋㅋ<br>생활비가 만만치 않다<br>커피 한잔에 거의 5불이다.<br>집에서 커피를 만들어 먹는다.<br>드립에 필요한 필터가 필요해<br>파머스 마켓에서 사려 했더니<br>10불이란다.<br>\"왜 이렇게 비싸요?\"<br>라고 말하고 안사고 돌아섰다.<br>그 직원이 황당해 한다.</p>\n<p>나는 주부다ㅋㅋㅋ<br>요리를 한다.<br>내가 생각해도 맛있다.<br>애가 밥을 완전 잘 먹는다.<br>행복하다.<br>요리를 한다.<br>실패다.<br>애가 밥을 잘 안 먹는다.<br>화를 내고 협박을 한다.<br>\"남기기만 해봐!!\"<br>무서운 표정을 한다.<br>그래도 남기고 간다.<br>내가 먹는다.</p>\n<p>나는 주부다 ㅋ<br>새벽부터 밥을 해주고<br>남긴 밥 내가 그냥 먹고<br>설거지 까지 다 하고 나니<br>짜증과 자괴감이 올라온다<br>평소 보다 많은 양의 커피를 분쇄한다.<br>낭비인거 아는데, 그래도 사치를 부린다.<br>주부들이 과소비 지름신이<br>이렇게 오는 구나 깨닫는다.<br>커피를 잔뜩 갈아 넣고<br>동네 슈퍼에서 산 값싼 필터로<br>커피를 내린다.<br>흐믓하다.<br>아뿔싸, 필터가 찢어졌다.<br>커피를 버린다.<br>내 마음도 찢어진다.</p>\n<p>큰 맘 먹고<br>10불들여 커피 필터를 샀다.<br>커피를 내리고, 중국 가게에서 산<br>한국에서도 안 먹던<br>초코파이를 먹는다.<br>넷플릭스 드라마<br>화양연화를 보며 훌쩍인다.<br>드라마 재밌다.<br>주부를 넘어<br>아줌마가 되어가나 보다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0LChf4n8KihNWRNXJGtoK6ZvNhdXQxjsTcX9Ezys3YAraovrrGqjWnZAsDK4dG9Xkl", "featured": false}, {"id": 212, "date": "2023년 10월 11일", "year": 2023, "title": "주부 생활 완성 1.", "themes": [4, 9, 12, 13, 14], "content_html": "<p>주부 생활 완성 1.<br>아들 도시락 싸기<br>평생 처음 유부 초밥을 싸본다.<br>맛있다. 터진건 또 내가 먹는다.<br>주부생활 완성 2.<br>2박 3일 에드먼턴 연구 미팅 가기 전<br>아들을 먹을 국 끓이기<br>갈비탕 쉽네 ㅋㅋ<br>고기를 자른다.<br>냄비에 고기를 넣고 피를 뺀다<br>무와 대파를 넣고 끓이다<br>국간장과 참치액젓으로 간을 맛춘다.<br>주부생활 완성 3.<br>고기 손질하기<br>고기를 덩어리로 사면 싸다<br>왕갈비 16대가 나오는데 5만원<br>갈비탕 두 솥과<br>네 명이 먹을 갈비 구이<br>연구 생활 1.<br>에드먼튼에 간호대 학장과 미팅.<br>세계 최고 심장생리학자인데,<br>학부는 간호학, 대학원은 체육학을 했다.<br>나와 함께 대학원을 다녔는데<br>지금은 넘사벽 최고의 연구자다.<br>함께 연구하기로 했다.<br>연구 생활 2.<br>에드먼튼 Kerry 교수의 랩미팅도<br>다음 주면 마지막이다.<br>열심히 함께 작업하는 논문<br>새롭게 분석하는 논문 작업 중이다.<br>하지만 대부분의 중요한 논의는<br>오전 10시 팀홀튼 커피를 마시며 이루어 진다.<br>주부생활 완성 4.<br>원래는 오늘 까지 일하고<br>밤에 캘거리로 와야 했는데,<br>애들이 마음에 안 놓인다.<br>어제 기현이가 밥을 안 먹고 학교에 갔다.<br>도시락은 그 전날 먹다 남은 걸 싸갔단다.<br>마음에 걸린다.<br>어제 밤에 친구와 저녁을 먹고<br>하루 앞당겨 밤 11시 캘거리 도착.<br>아침에 아들들 밥을 먹이니<br>내 마음이 든든하다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid034fiVzKmKos9tRQVypx1qhYvNE7ZikpL3asAmjuhc4ebwNCTtAc5Dta8cc1T6HWN3l", "images": ["pdf7_page11_img0.jpeg"], "featured": false}, {"id": 213, "date": "2023년 10월 15일", "year": 2023, "title": "1993 년 여름", "themes": [3, 4, 5, 6, 8, 9, 10, 11, 12, 14], "content_html": "<p>1993 년 여름<br>인생의 비전을 장애인 체육으로 결정하고<br>한국에 장애인 체육을 가르치는 곳도<br>배울 수 있는 곳도 없기에<br>교환학생을 신청했다.<br>Summer of 1993<br>I found the vision of my life<br>helping people with disabilities with sports<br>but no place to learn in Korea<br>so I applied for exchange student<br>원래는 안되는 일인데,<br>정말 말도 안되게<br>하나님의 인도하심과<br>언더우드 3세 원한광박사님과<br>조교의 실수가 함께 어우러져<br>알버타 대학으로 교환학생을 갔고<br>Actually, it was not possible for me<br>to go abroad as exchange student<br>for various reasons<br>including application deadline passed etc.<br>with Gods' intervention,<br>and help and mistake of many people<br>including Dr. Underwood (원한광)<br>I went to the University of Alberta<br>알버타 대학 장애인 관련 수업을<br>다 수강해 듣는 중<br>특수체육개론 수업에서<br>Dr. Steadward 를 만났다.<br>난 사실 Dr. Steadard 가 누군지 몰랐고,<br>수업을 시작하고 몇 주가 지나<br>International Paralympic Committee<br>회장이라는 말을 듣고,<br>수업이 끝난 후<br>Dr. S 를 쫓아가 나를 소개했던 기억이 난다.<br>During my Adapted PE class,<br>I met Dr. Steadward,<br>I did not know who he really was<br>After few weeks,<br>I realized that he is the founder, 2nd<br>and 3rd President of IPC.<br>I chased the hallway after him<br>and introduced myself<br>29년 전 일이다.<br>어찌 보면, 내 인생에서 가장 흥미로운<br>내 인생의 전환점에서 일어난 일인 샘이다.<br>그 이후, 한학기 교환학생 계획이<br>1년 으로 바뀌어 (이것도 흔한일이 아닌데)<br>8월 귀국 계획이 다음해<br>2월 귀국으로 바뀌었고<br>10월 아내와의 연애를 시작했고<br>다음해 7월에 결혼하고<br>9월에 Dr.S 와 석사학위 공부를 시작했다.<br>This was 29 years ago<br>That year was the most critical year for me<br>My plan to be an exchange student<br>for 1 semester<br>became 2 semester (very exceptional)<br>Then, I met my wife<br>and married following year<br>2 months after my wedding,<br>I started my master's program with Dr. S<br>Dr. S 의 마지막 제자로 학위를 마치고<br>2003년 미국으로 포닥을 가고<br>2005년 한국으로 돌아온지도 벌써 거의 20년<br>It has been 20 years since my convocation,<br>completed my Ph.D<br>as his last Ph.D student<br>이번 마지막 에드먼턴 행을 맞이해<br>Dr.S 를 찾아 뵈었다.<br>건강에 문제가 있으셔<br>50년 사시던 집을 청산하고<br>아파트로 이사 하셨다.<br>I visited D. S yesterday<br>since this is my last visit to Edmonton<br>He has health issues,<br>and had to move to the apartment<br>after 50 some years lived in one house<br>주차장에서 헤메는 나를 위에서 보시고<br>J.U.S.T.I.N 하고 5층에서 내려다 보시며 소리치신다.<br>2시간여 살아가는 이야기를 나누고<br>교수님 부부 앞에서 50이 훌쩍 넘은 나는<br>다시 학부생의 마음으로 돌아가<br>예전 이야기 들을 해 드린다.<br>I was lost in the parking lot,<br>then I heard a familiar voice<br>J.U.S.T.I.N<br>from the balcony of his apartment<br>We spent 2 hours talking and catching up<br>seems like 20 mins<br>Before him and Laura<br>I am still in my 20's,<br>like I am still his maters' student<br>나를 믿어 주셔서 감사하다고<br>나를 밀어 주셔서 감사하다고<br>나를 응원해 주셔서 감사하다고.<br>Thank you for believing in me<br>Thank you for supporting me<br>Thank you for encouraging me<br>그때도<br>지금도.<br>Back 30 years ago,<br>until now.<br>2시간 만에 아쉬운 만남을 뒤로하고<br>아들이 참여하는 알버타 대학교<br>Open House 에 갔다.<br>Steadward Center 부스를<br>아들이 발견하고<br>신나서 간다.<br>사진을 찍어 준다.<br>After meeting Dr. S<br>I came to University of Alberta<br>for Daniel's Open House<br>He found the booth<br>of the Steadward Center<br>We took a picture,<br>Then Introduced my self to<br>newly hired staff<br>\"I was once a student volunteer<br>at the Steadward Center\"<br>Dr. Steadward<br>부디 건강을 회복하시길<br>부디 더 행복하시길<br>예전에 말에서 떨어져 죽을 뻔 하셨던 위기를<br>멋지게 극복하신 것 처럼.<br>이번에도 불사조 처럼,<br>극복하시길...<br>Dr. S<br>Please recover your health<br>Just like you recovered hour hip fracture<br>Just like invincible Dr. S<br>Please overcome these problems!!<br>My prayer is with you<br>두손 모아 기도합니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02wQpYfF1usWE813mfwvEUSR86BK72HWWjWqNCYMCeGmbqBjjU1rYdEvw9LEArMhsfl", "images": ["pdf7_page13_img0.jpeg", "pdf7_page17_img0.jpeg"], "featured": false}, {"id": 214, "date": "2023년 10월 21일", "year": 2023, "title": "만약에 묘약이 존재해서,", "themes": [3, 4, 6, 8, 10, 12, 13, 14, 16], "content_html": "<p>만약에 묘약이 존재해서,<br>이 약만 먹으면 갑자기 사람이 착해지고,<br>상대방의 부정적인 부분 보다,<br>긍정적인 부분을 바라보고,<br>혹시 상대방이 실수하면<br>그 사람의 입장에서 이해하고,<br>용서하며,<br>더욱 관대해진다면 어떨까요?<br>그런데, 심지어<br>이 약을 먹으면 비만, 당뇨,<br>심혈관질환, 그리고 암을 예방하며,<br>만성통증, 수면장애, 불안장애 우울증과 염증성장질환까지 치료한다면 어떨까요?<br>뿐만 아니라,<br>다른 사람의 표정을 읽기 어려워 하는, 자폐스펙트럼 장애를 가진 청소년에게<br>이 약을 코로 흡입하게 하였더니,<br>다른 사람의 표정을<br>읽기 시장한다면 어떨까요?<br>과연 이런 기적이 약이 있을까요?<br>있.습.니.다.<br>바로 우리 몸에서,<br>더욱 구체적으로는<br>시상하부-뇌하수체 후엽에서<br>만들어 분비되는<br>옥시토신입니다.<br>맞습니다.<br>옥시토신은 산모가 출산할때에<br>급격히 증가하여<br>자궁을 수축하게 하고,<br>산모의 젖이 나오게 하는 호르몬인데,<br>산모가 그나마 겪는 진통을 줄여 주는<br>자연 진통제이며,<br>더 나아가 아이를 향한 무한 사랑을<br>느끼게 하는 호르몬입니다.<br>옥시토신이<br>제대로 작용하지 않는 동물들은<br>출산 후 자신의 새끼들을 돌보지 않습니다.<br>심지어 시끄럽게 소리낸다고 죽이기도 하죠.<br>반면에 새끼를<br>한 번도 낳은 적이 없는 쥐에게<br>옥시토신의 작용을 활성화 시키면,<br>자기 앞에 어린 쥐를<br>자신이 낳은 것도 아닌데,<br>새끼처럼 돌보아 줍니다.<br>연애 하면 옥시토신이 올라갑니다.<br>연애 초기 옥시토신이 많이 올라간 커플은<br>6개월 후에도 사귀고 있을 가능성이 높지만, 옥시토신이 많이 올라가지 않은 커플은<br>헤어질 가능성이 높습니다.<br>옥시토신이 높은 커플은<br>서로 더 많이 배려하고,<br>심지어 잘 싸우지도 않습니다.<br>심지어, 옥시토신을 코로 흡입하면,<br>배우자 혹은 여친이 있는 남자는,<br>미혼 여성이 가까이 오면, 불편해 합니다.<br>일부 일처 호르몬이라고<br>불리우는 이유이기도 하죠.<br>옥시토신을 올리면,<br>상대방의 눈을 더 잘 바라보고,<br>상대방을 더욱 긍정적으로 평가하고,<br>상대방의 입장에서<br>그 사람을 더욱 잘 이해햐려고<br>노력합니다.<br>바로, 옥시토신이<br>황금률 호르몬이라<br>불리우는 이유 이기도 하죠.<br>사이 좋은 쥐 커플 중,<br>암컷을 실험자가 때로 때어<br>전기충격을 주고, 큰 소리로 놀라게 한 후<br>다시 함께 있을 수 있도록 집에 넣어 주면, 옥시토신이 높은 수컷 쥐는,<br>암컷쥐에게 다가가 위로해 줍니다.<br>그런데, 이 쥐에서 옥시토신이<br>제대로 기능을 하지 못하게 하면,<br>이 쥐는 암컷의 고통에<br>전혀 공감하지 못하고, 쌩까 버립니다.<br>옥시토신을 empathy 호르몬<br>이라고 하는 이유죠.<br>그런데, 옥시토신이 낮으면<br>어떤 다른 위험이 있을까요?<br>신경이 날카로워 집니다.<br>다른사람의 아픔을 공감하지 못합니다.<br>우울과 조현병의 위험이 증가합니다.<br>염증성 장질환의 위험과<br>만성통증의 위험이 증가합니다.<br>비만과 당뇨, 심혈관 질환<br>그리고 암의 위험까지도 증가합니다.<br>최근 연구에서는<br>치매의 위험까지<br>증가한다고 알려지고 있습니다.<br>그럼, 옥시토신을 올리려면<br>어떻게 해야 하나요?<br>물론, 코로 흡입하는 옥시토신을<br>미국에서 직구할 수도 있습니다.<br>하지만, 이렇게 코로 옥시토신을<br>흡입하는 방법은<br>비용도 많이 들고,<br>장기적 투약은<br>효과적이지 않을 수도 있습니다.<br>그 보다는 우리 몸이<br>옥시토신을 많이 만들게 하는<br>여러 가지 좋은 방법이 있습니다.<br>그 중 하나가 스킨십입니다.<br>예전에 엄마 손은 약손이라고,<br>엄마가 아픈 배를 만져주면<br>깜쪽 같이 배가 아픈게<br>나은 기억이 있을 겁니다.<br>바로 옥시토신의 효과일 수 있습니다.<br>물론, 이 외에도<br>옥시토신을 올리는<br>수많은 방법들이 있습니다.<br>저는 옥시토신을 올리는 생활습관들을<br>옥시토신 라이프 스타일이라고 명했습니다.<br>그런데, 옥시토신을 올리는<br>매우 좋은 방법 중에 하나는<br>다른 사람에게 감사를 표현하거나,<br>혹은 다른사람에게<br>진심으로 감사하다는<br>표현을 들는 것입니다.<br>대박 아닌가요?<br>서로 감사하면 옥시토신이 올라간다니.<br>오늘 아버지, 어머니,<br>혹은 자녀를 꼭 안아주고<br>사랑한다고 감사한다고 표현하면<br>옥시토신 올라갑니다.<br>아니 꼭 가족이 아니더라도,<br>스승님, 친구 그리고 주변에<br>소중한 사람에게 감사의 표현을 해 보세요.<br>옥시토신을 올리는<br>여러 가지 방법이 있지만,<br>그 중에 하나는 이야기를 듣는 겁니다.<br>감동적인 이야기 혹은<br>감동적이면서 재미 있는 이야기는<br>옥시토신을 올립니다.<br>그런데, 이 세상에서 가장 의미있고,<br>재미있는 이야기는 뭘까요?<br>바로 자신의 이야기입니다.<br>자신의 이야기가 항상 재미있지 않고<br>의미있지 않을 수도 있다고<br>할지 모르겠지만,<br>그건 사실 우리에게 달려 있죠.<br>바로, 우리의 나레티브를<br>다시 쓸 수 있는 능력,<br>그 능력은 우리 누구에게나 있습니다.<br>나레티브를 바꾸면 옥시토신이 올라가고, 옥시토신이 올라가면 인생이 달라집니다.<br>그럼 옥시토시이 올라가면<br>회복탄력성도 증가하냐고요?<br>네 올라갑니다.<br>Oxytocin 과 resilience 를 함께<br>의학 사이트 혹은 Google scholar<br>에서 검색해 보세요!!<br>나의 나레티브가<br>다른 사람의 나레티브와 만나<br>우리의 나레티브가 됩니다.<br>너와 나<br>우리의 나레티브가 바뀌면<br>공동체의 나레티브가 바뀌지 않을까요?<br>당신과 나<br>우리의 옥시토신이 올라가면<br>이 사회의 옥시토신이 올라가지 않을까요?<br>이런 작은 소망을 가지고<br>‘옥시토신’에 관한 책을 집필했습니다.<br>이번 책을 집필하면서,<br>참 많은 논문을 읽었고,<br>또 책을 읽었습니다.<br>옥시토신에 관한 책은<br>거의 없기에,<br>대부분 논문과<br>뇌과학 심리학 서적을 많이 읽었습니다.<br>책을 준비하고 집필하는<br>지난 2년간,<br>옥시토신에 대한 이해가 깊어지면서,<br>제 주변 사람들을 더 많이<br>이해하고 사랑하게 된 것 같습니다.<br>책은 아마 연말에나<br>나올 것 같은데,<br>책 제목은 곧 나와야<br>책 표지 작업에 들어간다고<br>대표님께서 귀뜸을 주시네요.<br>혹시 여기 가제목과 목차를 보시고,<br>직접 댓글과 메시지로<br>좋은 제목을 추천해 주시면<br>정말 감사하겠습니다.<br>이번에 책을 집필하면서,<br>정말 세상에는 훌륭한 책이 너무 많고,<br>너무나도 훌륭한 저자분들이<br>많음을 보고, 주눅이 들고,<br>중간에 포기할까 생각도 했지만,<br>그래도 혹시라도,<br>나의 책이 필요한 분이<br>한 분이라도 있다면,<br>책을 쓰는 보람이 있지 않을까<br>하는 마음으로 책의 집필을 완성했습니다. 여러분이 도움이 필요합니다.<br>도와 주세요.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02FnPG9ts7QV2SBVKQRJEdvgEjXFWdXGDqsC8J4SBwJGmGBRXN5oXiNnJk8RsFHTPQl", "featured": false}, {"id": 215, "date": "2023년 10월 29일", "year": 2023, "title": "시작이 있으면 끝이 있다.", "themes": [3, 4, 6, 10], "content_html": "<p>시작이 있으면 끝이 있다.<br>Everything that has a beginning,<br>has an end.<br>길다면 긴시간<br>또 짧다면 짧은 시간<br>약 70여일 간의 주부생활을 마치고<br>이제 남편으로, 아들로 돌아갑니다.<br>Bitter, but sweeter last 70 some days!<br>Now, I am heading back to Korea<br>Now, more as an husband, son<br>and more so as a professor<br>그동안, 저희 푸념과 넋두리를 읽어주시고<br>공감해 주시고, 응원해 주신 모든 분들께<br>진심으로 고개 숙여 감사드립니다.<br>Special thanks to those who<br>read my posting,<br>having compassion on me<br>encouraging me and supporting me<br>오늘 내가 떠난다고 하니<br>어제는 큰 아들이 설겆이를 하고<br>오늘은 새벽에 둘째 아들이 일어나<br>아침을 해 주네요.<br>Now that I am leaving today,<br>David did his dishes yesterday<br>Daniel is making breakfast this morning<br>사랑하는 자녀가 있다는 것<br>희생, 헌신 고스프레 할 수 있는<br>아들들이 있다는 건<br>정말 하늘이 주신 축복인걸<br>다시 한 번 깨닫습니다.<br>Thanking God that<br>I have sons who I brag about<br>my sacrifice as a father<br>It is truly blessing,<br>and sometimes an honor<br>주부생활하면서 깨달은 것 추가.<br>1. 세탁기에는 양말 한쪽을 먹는<br>귀신이 살고 있다.<br>2. 모든 볶음과 국 과 찌게 양념에는<br>소금과 간장만 아니라<br>생선소스 (참치 액젓, 피시 소스) 가<br>들어가야<br>감칠 맛이 난다는 것.<br>1. There is a monster living in the washer that eats only one sock out of a pair<br>2. Fish sauce makes fried rice and soup perfect.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0QEQpGVG2S2UnBcdXdYTgKQ9xScYNzaSPh3PZEowwoAYfbcjaovPrrGMJaQeCNgRsl", "images": ["pdf7_page24_img0.jpeg"], "featured": false}, {"id": 216, "date": "2023년 10월 30일", "year": 2023, "title": "세상의 경계에 사는 사람들에게 바치는 글", "themes": [1, 4, 6, 9, 11, 12, 13, 14], "content_html": "<p>세상의 경계에 사는 사람들에게 바치는 글<br>지난 주 유럽 암학회 (European Society of Medical Oncology, ESMO)<br>참석을 며칠 안 남기고, 에드먼튼에 갔는데<br>학생들에게서 연락이 왔다.<br>”교수님 학회 멤버십 신청이 거절 당했어요“ 라고.<br>학생들이 학회 멤버가 안되면,<br>학생 한 명당 학회 등록비가 200만원이 넘는다.<br>8명이 신청을 했는데, 3명은 맴버 승인이 나고,<br>5명은 맴버 거절을 당했다.<br>학회를 가자니,<br>등록비만 천만원이 추가로 드는 상황<br>잠을 잘 수가 없었다.<br>아니 잠이 안 왔다.<br>학생들의 항의 메일을 나에게 전달해 왔다.<br>왜, 멤버 거절을 당했냐고<br>학생이 메일을 보냈는데,<br>체육 전공자라 안된단다.<br>멤버십자격을 봤는데,<br>사이언스를, 암 관련 연구를 하거나<br>혹은 ‘암’ 이란 주제에 관심이 있는 사람은<br>멤버의 자격이 주어진다고 하는데...<br>난 속이 너무 상했다.<br>이 사람들이 체육, 운동은<br>과학으로 보지도 않나?<br>예전 같으면, 나의 전투력이 상승해서,<br>에너지 레벨이 상승했을 텐데,<br>이번에는 힘이 쪽 빠졌다.<br>늙었나 보다.<br>”그냥 치사한데, 학회 가지 말까?“<br>지난 5개월간 초록을 제출 하고,<br>승인이 되었다고, 학회에 가게 되었다고<br>즐거워 하던 학생들의 얼굴이 떠올랐다.<br>일단 항의를 하기 위해서는<br>최소한 나는 멤버이어야 겠다는 생각이 들어,<br>학회에 멤버 신청을 했다.<br>긴 나의 이력서를 포함해서 말이다.<br>속으로, ‘이 정도면 멤버로 받아 주겠지’<br>라고 생각을 하며..<br>왜냐하면 난 바로 2022년 학회 초청 발표자였고,<br>좌장이었으며, Scientific Committee member 였기에.<br>신청하고 몇 시간만에 답장이 왔다.<br>멤버십 신청이 거절되었습니다. REJECT!<br>요즘 가뜩이나,<br>논문들이 REJECT 풍년이 들었는데,<br>학회 멤버십 신청까지 거절을 당하니,<br>마음이 더 위축된 반면<br>‘아 요것봐라’ 하고 전투력이 약간 올라갔다.<br>거의 3페이지에 달하는 편지를<br>학회 회장, 멤버십 디렉터에게 보냈다.<br>편지의 ‘요’는 체육 하는 우리도 과학자다.<br>운동이 암 예방하고, 치료 한다.<br>왜 학회 멤버로 안 받아 주냐?<br>말도 안된다 등등.<br>그리고, 편지를 쓰면서,<br>내 논문 어디에 발표 했는지<br>얼마나 발표 했는지를<br>쓰는 내가 너무 구차했고,<br>내가 이렇게 까지<br>구차하게 편지를 쓰는 이유는..<br>뭐 이러면서 어필 했다.<br>감사하게도, 디렉터가 바로 답장이 왔고<br>문제를 인식했고, 곧 해결하겠다고 했다.<br>다행이도 몇 시간 만에<br>나와 우리 모든 대학원생들의 멤버십 승인이 났고,<br>학생들은 학회를 참석할 수 있게 되었다.<br>그리고, 디렉터는 정중하게 사과의 말을 했고,<br>관련해서, 다른 사람을 통해,<br>이런 일이 발생한 것이 너무 수치스럽다며<br>자신들의 실수를 인정했다.<br>그리고, 우리 학생들과 학회 참석을 했고<br>많은 것을 배웠고, 많은 것을 얻었다.<br>그런데, 멤버십 신청이 거절당하고,<br>다시 승인이 되는 몇 시간 동안<br>여러 가지 생각이 들었다.<br>그냥 체육분야에 있으면<br>이런 수치를 당하지 않을텐데<br>그냥 내 분야에만 머물러 있으면 되는데,<br>특수학교에 다니면, 비장애인 학생,<br>학부모 눈치 안 봐도 되는데<br>한국인들 끼리만 만나면,<br>괜히 영어 못한다고 눈치 안 봐도 되는데,<br>뭐 끝이 없이 여러 생각이 들었다.<br>멤버 vs. 비맴버, 내부자 vs. 외부자<br>왜 이렇게 맴버가 안된게 속이 상하나 했더니,<br>나의 옛 과거가 떠올랐다.<br>간염 보균자라고 혼자 밥먹던 생각<br>군대에서는 나만의 식판을 사용했던 기억<br>어렸을 때, 주류에 끼지 못해,<br>비주류 친구들과 놀던 기억<br>(지금도 비주류가 편하다)<br>공부 못한다고 무시 당하던 기억,<br>열등감과 자괴감에 괴로워 하던 중학교 시절<br>그동안 잊고 있던 감정이었다.<br>그룹에 포함되지 못하는 사람의 힘든 마음... ㅠㅠ<br>혹시, 내가 주변에<br>그런 행동을 하고 있는 건 아닌가?<br>내 사람을 챙기며,<br>누군가에게 소외감을 느끼게 한 적은 없었나?<br>아! 내가 더 잘해야 겠다.<br>학회에 모여,<br>학회 신청을 거절 당하는 경험을 이야기 하며<br>학생들과 생각했다.<br>앞으로는 이 학회에서 체육 전공이라고<br>학회 멤버십 신청이 거절당하는 일은 없겠구나.<br>우리의 수치와, 우리가 당한 상황이,<br>앞으로 없던 길을 하나 만들겠구나. 하고.<br>”새로운 생명은 경계에서 태어난다“<br>라는 말을 들었다.<br>하나의 영역과 다른 영역이 만나는 부분.<br>Marcov Blanket<br>이곳에서 새로운 것이 태어난다.<br>운동과 의학이 만나 운동의학이 되고.<br>스포츠와 마케팅이 만나 스포츠 마케팅이 되고.<br>Exercise 와 Oncology 가 만나, Exercise Oncology 가 되는 거다.<br>이번 경험을 캐나다 Exercise Oncology 개척자인 Kerry 교수와 이야기를 나눴다.<br>자신도 처음 암 연구를 하려고 할 때에<br>‘PhyED 가이 (체육전공자) 라고<br>곱게 보지 않던 의사들의 시선을<br>많이 느끼며 연구 했다고.<br>아~ 경계에 서 있는 건 힘든 거구나.<br>어느쪽에서도 환영 받지 못할 수 있구나.<br>그런데, 경계에서 새로운 생명이 태어난다.<br>\"체육과 교수가 이 연구 할 수 있겠어요?\"<br>2008여년 경 보건복지부<br>어느 부서 과장이 한 말이다.<br>속으론 어이가 없었지만, 난 꾹 참으며,<br>인쇄해서 가지고 간<br>나의 이력서를 한 부 전해 주면<br>내가 누구이며 어디에서<br>공부를 얼마 동안 했고,<br>어느 의과 대학에서 포닥을 했고,<br>어떤 논문을 써서<br>어느 학술지에 발표를 했고... “ 하며,<br>구차하게 설명을 했다.<br>결국 그 과장은 직원을 불러<br>‘공문 써 드리세요!” 라고 말했고<br>난 계획했던, 하지만,<br>복지부 승인을 못 받아서<br>4개월진 표류하던 연구의 시작을<br>나의 상처받은 자존심과 바꿔야 했다.<br>그런데, 이 연구가 잘 안되는 바람에<br>(결국은 했지만)<br>더 좋은 연구를 할 수 있었다<br>(안정시 심박수, 명지병원)<br>난 늘 그랬다.<br>체육과 의학의 경계<br>체육 중에서는 장애인체육<br>장애인 체육인데 운동생리<br>운동생리인데 의학<br>경계에 산다는 걸<br>영어로 뭐라고 하나 생각해 보니<br>Living on the edge 다.<br>칼날위에 서서 살아가는 거다.<br>그래서, 힘이 드는 거다.<br>그런데, 칼날위에 여러명이 설 순 없다.<br>그래서, 외로운 거다.<br>내 주위에 몇 몇 얼굴이 떠 오른다.<br>외로운 사람이 외로운 사람을<br>힘든 사람이 힘들어 하는 사람을 알아본다.<br>대놓고 힘냅시다 라고는 못 하지만,<br>위로의.. 그리고 격려의.. 눈빛을 보낸다.<br>“충분히 잘 하고 계세요!!!!”<br>“하지만, 너무 힘들면 내려 놔요”<br>“그래도, 버틸만 하면 함께 버텨요”<br>“우리의 길은 edge (칼날) 인데”<br>“우리 다음 세대가 쫓아<br>오는 길은 골목길이 되고”<br>“그 다음 세대가 쫓아 오는 길은<br>대.로. 가 될꺼예요”<br>라고 속삭이며 외쳐 본다.<br>#집이좋다, #학교가좋다,#exerciseoncology</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02dbuqXeNbC9uRWrMHaKxgTR1R3VKrXeb2M8z1wgRJb9TXvcu4XVBWJAcChAPbdbcGl", "featured": false}, {"id": 217, "date": "2023년 11월 5일", "year": 2023, "title": "나도 좀 껴줘!!", "themes": [3, 12, 14], "content_html": "<p>나도 좀 껴줘!!<br>어렸을 때, 편을 나눌 때,<br>두 명이 가위 바위보를 했다.<br>그리고, 이긴 사람이 한명 씩 선택을 한다.<br>자신이 선택이 된 사람은 안도의 한숨을 쉰다.<br>그렇게 편이 나눠 지며, 마지막에<br>더 이상 남은 사람이 없어서, 선택된 사람도 있고,<br>그냥 끝나지 선택이 되지 않은 한 사람을<br>우리는 ‘깍두기’ 라고 했다.<br>그렇게 깍두기라도 되어<br>친구와 어울리고 싶었다.<br>공동체에 속하지 못하면 죽음이다.<br>외부의 수많은 적으로부터,<br>스스로를 지키려면,<br>어딘가에 속해야 한다.<br>유인원들은 그룹 안에서도<br>그루밍을 통해 자기편을 확인한다.<br>유사시 서로 도울 가까운 유인원들을 확보해야 한다.<br>왕따는 죽음이다.<br>우리가 사랑하는 사람과 헤어져 아플 때<br>뇌에 자극이 되는 부위는<br>진짜 팔 다리가 절단되어 아플 때<br>자극이 되는 뇌의 부위와 같다.<br>실연한 사람이 타이레놀을 먹으면<br>헤어짐의 고통이 덜 느껴 진다.<br>이선균이 주연한 ‘아저씨’ 라는 드라마<br>사람들이 열광했던 이유는<br>이선균이 속했던 ‘조기축구’<br>‘같이 일하는 부서’ 에 대한<br>사람들의 로망이었다.<br>퇴근 후 모두 선술집에 모여<br>하루를 이야기 하며,<br>한 명이 맞았다고,<br>모든 친구들이 다 덤벼들 수 있는<br>그런 동네 친구들..<br>‘미생’ 이라는 드라마도 그렇다.<br>자신이 어려울 때<br>자신의 목숨까지도 걸고<br>혹은 자신의 직장을 걸고<br>함께 편들어 줄 수 있는 동료.<br>우리는 그런 관계를 로망한다.<br>왕따는 죽음이다.<br>공동체에서 자신의 맘에 들지 않는다고<br>혹은 자신 보다 잘한다고<br>혹은 그냥 싫다고<br>왕따를 시키는 행위는 살인이다.<br>왕따는 살인이다.<br>혹, 우리 주위에<br>힘들어 하고 있는 이는 없는지<br>그룹에 속하지 못하고<br>겉도는 이는 없는지 돌아봐야 한다.<br>다가가 손을 뻗어야 한다.<br>함께 밥 먹어야 한다.<br>그 사람의 이야기를 들어줘야 한다.<br>그래야 사람이다.<br>그래야 사람 같은 사람이다.<br>그런 사람들이 모이면<br>행복한 공동체다.<br>껴주는 공동체<br>서로 돌아보는 공동체<br>옥시 토신이 높은<br>공동체를 만들어야 한다.<br>#옥시토신<br>#옥시토신공동체</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02WvynpMhz93LQpwfLqNszsSr6aTCv79maLzJ1uWWzyM2s1kgyfGd8Esf7CspCh3iCl", "featured": false}, {"id": 218, "date": "2023년 12월 30일", "year": 2023, "title": "나의 2023년은 실패의 연속이다.", "themes": [1, 3, 4, 5, 6, 8, 9, 12, 13], "content_html": "<p>나의 2023년은 실패의 연속이다.<br>어렵게 작성한 연구비 5회 도전, 5회 실패<br>최상급 논문 투고, 4회 도전, 4회 실패<br>중상급 논문 투고, 실패율 90%<br>야심차게 캐나다 공동연구 추진<br>목표는 논문 개제, 현실은 데이타 분석 중<br>특히 2학기는 강의도 안하고<br>연구에만 집중, 성과는 물음표..<br>그래도<br>우리 연구원들 행복하고<br>최소한의 인건비 지급할 수 있고<br>졸업생들 취업하고<br>무엇보다<br>사랑하는 가족들과<br>많은 시간을 보낼 수 있어서<br>평생 애들 밥해준 것 보다<br>올해 더 많은 밥을 해 줄 수 있었어서<br>감사한 한 해 였다.<br>2023년을 마치며<br>Ithaka 의 의미가 가슴에 다가온다.<br>나의 2023년의 목표가<br>계획한 바를 이루는 것이라면<br>'실패한 한 해'<br>완전 실패한 한 해다.<br>그러나,<br>나의 2023년 목표가<br>꿈을 꾸고 도전하고,<br>그 과정을 통해서 배움을 얻고<br>주변 사람과 지지고 볶고<br>지지하고 지지받고<br>사랑하고 사랑받고<br>위로하고 위로받고<br>격려하고 격려받고<br>함께 웃고, 함께 우는 것이라면<br>그래도 어느 정도 성공한 한해라고<br>스스로 위로해 볼 수 있을 것 같다.<br>한해 동안<br>고생 했다고,<br>수고 많았다고<br>실수도 많았지만<br>그래서, 은혜도 많았던 한 해라고<br>스스로 위안해 본다.<br>BY C. P. CAVAFY<br>TRANSLATED BY EDMUND KEELEY<br>As you set out for Ithaka<br>hope your road is a long one,<br>full of adventure, full of discovery.<br>Laistrygonians, Cyclops,<br>angry Poseidon—don’t be afraid of them:<br>you’ll never find things like that on your way<br>as long as you keep your thoughts raised high,<br>as long as a rare excitement<br>stirs your spirit and your body.<br>Laistrygonians, Cyclops,<br>wild Poseidon—you won’t encounter them<br>unless you bring them along inside your soul,<br>unless your soul sets them up in front of you.<br>Hope your road is a long one.<br>May there be many summer mornings when,<br>with what pleasure, what joy,<br>you enter harbors you’re seeing for the first time;<br>may you stop at Phoenician trading stations<br>to buy fine things,<br>mother of pearl and coral, amber and ebony,<br>sensual perfume of every kind—<br>as many sensual perfumes as you can;<br>and may you visit many Egyptian cities<br>to learn and go on learning from their scholars.<br>Keep Ithaka always in your mind.<br>Arriving there is what you’re destined for.<br>But don’t hurry the journey at all.<br>Better if it lasts for years,<br>so you’re old by the time you reach the island,<br>wealthy with all you’ve gained on the way,<br>not expecting Ithaka to make you rich.<br>Ithaka gave you the marvelous journey.<br>Without her you wouldn't have set out.<br>She has nothing left to give you now.<br>And if you find her poor, Ithaka won’t have fooled you.<br>Wise as you will have become, so full of experience,<br>you’ll have understood by then what these Ithakas mean.<br>C. P. Cavafy, \"The City\" from C.P. Cavafy: Collected Poems. Translated by Edmund<br>Keeley and Philip Sherrard. Translation Copyright © 1975, 1992 by Edmund Keeley<br>and Philip Sherrard. Reproduced with permission of Princeton University Press.<br>Source: C.P. Cavafy: Collected Poems (Princeton University Press, 1975)</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0idq9oN3EKF7XbbkWWn2r1bTtUCHdxACghwfhRouTEkmbfjXmWPPnwQ2rVcjGVXN1l", "featured": false}, {"id": 219, "date": "2024년 1월 11일", "year": 2024, "title": "입시철이 되면,", "themes": [1, 4, 8, 9, 11, 12, 16], "content_html": "<p>입시철이 되면,<br>학과 건물 주변에,<br>자녀를 내려 놓은 부모들의<br>서성거림이 보인다.<br>세상에서 가장 아름다운 '서성거림'<br>자식이 잘 되었으면 하는 마음<br>자식 대신 내가 아팠으면 하는 부모의 마음이<br>입시철이 되면, 학교 주변에 보인다.<br>그 부모들의 간절한 모습을 보면,<br>나도 모르게 왈칵 눈물이 터진다.<br>1988년 올림픽이 있던 해에<br>난 대학 입학시험을 봤고,<br>연세대학교에 와서 학력고사 (지금의 수능)를 봤다.<br>행여나 당일 아침 늦을까,<br>시험 전야, 연대앞 여관에서<br>두 남자는 잠을 청했다. 아버지와 나.<br>일찍 일어나 콩나물 해장국을 먹고<br>해장국을 먹으며 무슨 이야기를 했을까?<br>나를 연대앞 굴다리 건널목에 바려다준 아버지<br>'잘 보고 와라'<br>'네 아버지'<br>신촌에서 연대를 잇는 건널목을 건넌후<br>나도 모르게 난 뒤를 돌아 보았다.<br>그때 나는 보았다.<br>'내가 건넌 것을 확인 후<br>뒤 돌아선 아버지의 뒷모습'<br>용관아 잘 하고 와라<br>그때 종교는 없으셨지만,<br>기도를 하셨을 수도.<br>'아버지의 뒷모습'은<br>나에게 그런 의미다.<br>용관아 할 수 있다.<br>다 잘 될거다.<br>노력했잖아.<br>노력은 배신 안한다.<br>실수할수도 있지.<br>실패할 수도 있지.<br>그래도 괜찮다.<br>그래도 힘내라.<br>연세대학교<br>스포츠응용산업학과 입시 2일차<br>밖에 있는 학생들과 학부형들을 보니,<br>나의 생각은 30여년 전으로 돌아간다.<br>1988년 10대였던 나는 이제 50대가 되었고<br>50 대였던 아버지는 이제 90대가 되었다.<br>캐나다에 다녀오느라<br>3주간 아버지 목욕을 못 시켜드렸는데,<br>이번 주말 아버지와 목욕을 간다.<br>아버지 등을 밀어드리며<br>나의 생각은 또 36년 전으로 돌아가겠지.</p>\n<p>이지선</p>", "fb_link": "https://www.facebook.com/ezsun/posts/pfbid0CHumLc8DUsRNtEUTQ82k7knqByzmEWbFCHPEaaT2TBSGZryhqLds2L3EBSceCvZpl", "featured": false}, {"id": 220, "date": "2024년 2월 11일", "year": 2024, "title": "<옥시토신 디너> #긴글주의", "themes": [4, 8, 9, 10, 14], "content_html": "<p><옥시토신 디너> #긴글주의<br>설명절 연휴 이브 저녁, 연세대 전용관교수님께서 집으로 초대해주셔서<br>에피타이저부터 디저트까지 무려 6 코스 디너로 대접해주셨습니다. 심지어 준비부터 요리,<br>서빙까지 모두 혼자서 뚝딱뚝딱<br>책에 짧은 추천사를 써드리곤 너무나 황송한 저녁식사와 만남, 그 속에서 오고간 대화를 선<br>물로 받았습니다.<br>#옥시토신 #풀충전 #옥시토신디너<br>Justin Yong Kwan Jeon전용관교수님의 ’집으로의 초대‘는 제겐 긴 역사가 있습니다. 2003<br>년에 제가 캐나다 벤쿠버에 있다는 소식을 듣고 에드몬튼에도 와서 간증을 해줬으면 하는<br>마음으로 저와 엄마를 집으로 초대해주셨고, 2005년 보스톤 유학을 준비하던 제게 아예 보<br>스턴 근교 뉴튼의 집을 통째로 내어주신 분이시고요.<br>그덕에 김상희언니와 룸메가 되는 은혜를 누렸고요.<br>(꽤 괜찮은 해피엔딩 중 99-102페<br>이지 참조)<br>그덕에 상희언니의 남편되시는 김 경철원장님까지 만나서 웰케어클리닉 병원에서 저와 가족<br>들의 건강이 회복되고 있지요.<br>김주환교수님과는 처음 뵈었지만, 워낙 저명하신 분이어서 이렇게 가까이서 뵙는게 신기하<br>고나~하면서 눈을 반짝반짝, 귀쫑끗하며 있었습니다<br>사진 속 다섯명은<br>한때 보스톤 근교 Newton (뉴타운을 의미)에서 살고 공부하고 일했던 사람들이면서<br>현재 한국의 신촌(新村, new town)에서 일하고 가르치고 배우는 사람들입니다.<br>#연세대_스포츠응용산업학과_전용관교수님 #연세대_의과대학_겸임교수_김경철원장님_웰케<br>어클리닉 #연세대_언론홍보영상학부_김주환교수님 #연세대_간호학과_김상희교수님그리고<br>전용관교수님네 #구름이</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0MQvZeL4WWA1YLqzCLdkz1YPPxqkJyrX7v5udyYDuXSXNuEMijRZZBUBc8Bh2yMnPl", "images": ["pdf7_page36_img8.jpeg", "pdf7_page37_img0.jpeg"], "featured": false}, {"id": 221, "date": "2024년 3월 24일", "year": 2024, "title": "아버지집에 가는 중에 아들과 통화를 한다", "themes": [3, 4, 6, 7, 8, 9, 10, 13, 16], "content_html": "<p>아버지집에 가는 중에 아들과 통화를 한다<br>치매에 걸리신 아버지는 아들이 필요하고<br>인생의 고민에 빠진 아들도 아버지가 필요하다.<br>아버지의 치매가 점점 심해지신다<br>이제 기력도 점점 쇠약해 지셔서 워커가 필요하다.<br>엄마와 두분이 사시는 게 점점 힘들어진다.<br>수많은 생각이 매 순간 순간 머리속을 휘어젓는다.<br>신앙을 갖고, 하나님을 아버지로<br>인식하는게 어렵지 않았던 이유는<br>인자하고, 사랑많은 아버지 덕분이리라.</p>\n<p>접영을 처음 배우던날<br>수영장 위에서 나를 내려다 보시던 아버지<br>대학 학력고사 (수능) 에 바려다 주시고<br>연대 앞 길을 건너는 아들을 바라보시던 아버지<br>신앙도 없는데, 아들 교환학생 간다고,<br>함께 새벽기도에 가서 고개 숙이시던 아버지<br>아버지의 인정을 늘 간구하던 나 (건강한 쪽으로)<br>새로운 성취를 이룰 때 아버지에게 하던 자랑질<br>그때마다 늘 기뻐하시던 아버지<br>새벽운동을 하시며 근육자랑을 하던 아버지<br>늘 거기에 계셔서 날 믿어주시고,<br>밀어주실 것 만 같았던 아버지<br>\"아빠 나 가요!\" 라고 말하는 나를 바라보며<br>기력이 빠진 눈빛으로 나를 바라보는 아버지<br>식사할 때 손떨림이 무척이나 힘들어보이고<br>혼자 걷는 건 더 힘들어 하신다.<br>자꾸 넘어져, 뵐 때마다 팔에 새로운 멍이 보인다.<br>아버지가 손자의 이름을 까먹으셨다.<br>'용관이 아들'이란다.<br>논어를 다 외우시던 분인데..<br>누군가 그런다<br>우리도 아빠와 엄마이지만,<br>우리도 엄마와 아빠가 필요한 존재라고<br>그런데, 그 아빠와 엄마는 점점 약해지고, 힘들어지고,<br>자녀들에게 좋은 아빠와 엄마가 되긴 더 힘들어지고.<br>참 우리는 연약한 존재다.<br>그렇게 인생은 만만치 않은 거다.<br>그렇게 오늘도 살아가는거다<br>나름의 의미와 기쁨 그리고 감사의 의미를 찾으며</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02txJTXzj8C2DYYJy2wGgrv8DKwwrw9mGjNScGdz35je7frza61uVdhCrbyXpvfRk2l", "featured": false}, {"id": 222, "date": "2024년 4월 28일", "year": 2024, "title": "우리의 인생이 '이야기덩어리'라면,", "themes": [1, 3, 4, 6, 10, 16], "content_html": "<p>우리의 인생이 '이야기덩어리'라면,<br>치매 투병중이신 아버지가 기억하는<br>아버지의 인생은 점점 사라져 가고 있다.<br>'모리와 함께한 화요일' 에 자신이 죽은 후<br>사람들이 읽는 조사가 무슨 의미가 있냐며<br>살아서 감동적 장례식을 하며, 이야기를 나눈다.<br>평생 아버지가 함께 삶의 이야기를 만들어간<br>코로나 전까지만해도 매달 모여 식사하시던<br>아버지에게 너무나 소중한 분들을 모셨다.<br>아버지에 대한 감사와 회고<br>누구도 작별인사를 하진 않았지만,<br>누구나 알 수 있는 작별인사<br>너무 의미있는 모임이요<br>너무 감사한 모임이였으나<br>너무나 슬픈 모임<br>이 소중한 모임이후,<br>아버지의 상태는 급격히 안 좋아 지신다.<br>아버지의 기억이 점점 없어진다.<br>나를 옆에 두고도 나를 찾고<br>집에 있는데도, 집에 가자고 하신다.<br>내 인생에 가장 힘든 한 주.....<br>어머니, 아내, 그리고 누님들에게도<br>그 누구보다 아버지에게도 ㅠ<br>이제는 정신만 아니라, 몸도 약해지신다</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid021XSpzXejdVZYZBiFRgYoALGUiGS9LfM4R7sU8X86WQtFpdV7XaWrF6XQSP3H6jvYl", "images": ["pdf7_page39_img0.jpeg", "pdf7_page40_img0.jpeg"], "featured": false}, {"id": 223, "date": "2024년 5월 16일", "year": 2024, "title": "학생중에 한 명이 물었습니다.", "themes": [2, 3, 9], "content_html": "<p>학생중에 한 명이 물었습니다.<br>\"교수님은 왜 옥시토신에 관심을 갖고 책을 쓰게 되셨어요?\"<br>잠간 고민하고 답했습니다.<br>\"이 사회가 점점 혼자 살아가는 것에 익숙해 질수록 옥시토신이 낮아 질 거예요. 그럼, 정신<br>건강, 사회적 건강, 그리고 몸 건강은 더 나빠지겠지요!\". \"그래서 옥시토신의 중요성을 알<br>리고, 더 풍요로운 삶!, 행복한 삶! 건강한 삶! 을 살 수 있기를 바라는 마음에 책을 썼어요<br>\"<br>옥시토신 관련 강의를<br>여러 곳에서 여러 번 했지만,<br>40분동안 질문을 받아 보긴 처음이었습니다.<br>1-2학년 전원이 와서<br>무조건 들어야 하는 강의다 보니,<br>일부 학생들은 딴짓도 하고,<br>잠도 자고 했지만 대부분의<br>학생들은 짧지 않은 2시간의 강의 (40분 질문)를<br>열심이 듣는 것을 보면서,<br>큰 보람을 느꼈습니다.<br>적어도 여기에서 강의를 들은 학생들은<br>옥시토신의 중요성을 알겠구나.<br>혼자보다 함께하는 게 왜 좋은지,<br>어떻게 하면 함께하는 삶을 살아갈 수 있는지<br>옥시토신을 높이려면 어떻게 해야 하는지..<br>왜 사랑이 약인지</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02W4k4j8Xf6DADpz66LRN2L3k9RSkNHqGWVLqfcC1BadFjAodA2rzD56Ev27AbKqRal", "images": ["pdf7_page41_img0.jpeg"], "featured": false}, {"id": 224, "date": "2024년 6월 6일", "year": 2024, "title": "낙방-거절-도전", "themes": [1, 4, 5, 6, 7, 8, 9, 10, 13], "content_html": "<p>낙방-거절-도전<br>연세대학교 교수가 된 지 거의 20년<br>수 많은 논문을 투고 했고,<br>그중 상당수의 논문이 개제되었지만<br>개제된 논문의 수보다 5배는 거절을 경험했다.<br>우리가 가진 연구의 질 혹은 가치보다<br>살짝 더 높은 곳에 투고하는 습관<br>저널로 부터 수많은 rejection 편지를 받으며<br>그 와중에 학생과 함께<br>연구의 디자인부터, 수행까지<br>공동 연구자를 설득하고,<br>연구비도 없이 연구를 수행하고,<br>심지어 이 과정이 3-5년이 걸리기도 한다.<br>논문 개제까지는 더 걸리기도...ㅠ<br>이번 유방암 연구가 그런 케이스다<br>이 연구가 처음 시작되게 된 것은<br>유방암 수술을 집도의와 함께 참관하고<br>수술의 방법 및 결과를 살펴보는 중!<br>유방암 수술의 다양한 방법이 있지만,<br>그리고 수술 방법에 따라,<br>근육과 건, 그리고 근막에 주는<br>영향은 완전히 다른데<br>그래서 전혀 다른 수술이라는 것을 깨달았다.<br>우리는 그냥 유방암 환자 운동프로그램<br>사실 Evidence 가 부족한 운동프로그램을<br>만들고 제시하고 있었다.<br>과연 그래도 될까?<br>수술을 참관하고,<br>학생들에게, 앞으로 유방암 수술방법<br>그리고 회복의 정도에 따라 운동프로그램을<br>다르게 적용해야 한다고 랩미팅에서 이야기 한지<br>거의 7년이 흘렀다.<br>그런데, 수술 방법에 따라 과연 상지기능의 회복속도가 다를까?<br>그럼, 언제부터 운동해도 될까?<br>수술 다음날 부터 운동하는 것에 대해<br>수술을 집도한 의사는 어떻게 생각할까?<br>환자는 어떻게 받아드릴까?<br>이런 과정을 양적-질적 연구로 수행하며<br>운동프로그램을 만들었다.<br>지금은 국립암센터에 최초로<br>체육전공 정직원으로 근무하고 있는<br>'민지희박사'<br>내 이야기를 마음에 품고,<br>박사학위 논문 주제를<br>'유방암 운동프로그램' 으로 잡고<br>차근차근 유방암환자의 운동에 대한<br>태도를 조사하기 위해<br>Theory of Planned Behavior<br>설문지를 한국어로 번역하고<br>약 300 여명의 유방암 환자를 조사하고,<br>https://pubmed.ncbi.nlm.nih.gov/35792923/<br>70여명의 유방암 환자의 상지기능,<br>신체활동량, 근육량<br>삶의 질을, 수술방법에 따라 조사하고,<br>https://pubmed.ncbi.nlm.nih.gov/34362199/<br>https://pubmed.ncbi.nlm.nih.gov/36990840/<br>연수진 연구원과는<br>수술후 1주일에서 한달사이에 있는<br>약 30여명의 유방암 환자를<br>인터뷰 하며, 운동에 대해 어떻게 생각하는지<br>그리고, 운동의 제약요인은 무엇이며,<br>운동의 촉진요인은 무엇인지 조사하고<br>그 과정의 논문으로 발표하였고,<br>https://pubmed.ncbi.nlm.nih.gov/35896295/<br>https://www.ksep-es.org/journal/view.php?number=908<br>이러한 결과를 바탕으로<br>유방암환자 수술 후 재활 운동프로그램을 개발했다.<br>그리고, 개발한 프로그램을<br>환자가 어떻게 받아들일지를<br>조사하는 예비 연구 총 3차례~~<br>사실 각각의 예비조사 연구결과가<br>논문이 될 수 있었지만,<br>우리의 연구 결과를 좀더 좋은 저널에<br>개제할 수 있게<br>이 모든 결과를 정리하고 아껴 두었다.<br>그리고, 민지희 박사의 박사학위 논문 결과와<br>그 연구를 이어 받은 류지인 연구원의<br>석사학위 논문 결과<br>그 후속 연구의 결과를 포함한 연구 결과를<br>1년여에 걸쳐 작성하였다.<br>이 연구 결과를 바탕으로<br>유방외과 박세호 교수님과 중견도전<br>현재 100명을 모집해 1년간 운동하는 연구 진행중<br>https://pubmed.ncbi.nlm.nih.gov/36864418/<br>연구의 수행을 가능하게 한<br>유방외과 김지예 교수님, 김승일 교수님과<br>미국의 공동연구자,<br>캐나다의 공동연구자와 공유하고<br>조언을 받고, 논문을 수정하기 6개월...<br>작년 가을 캐나다에서 애들 밥해주며<br>열심히 논문을 수정했다.<br>분야 탑저널<br>Journal of Clinical Oncology 에 투고<br>심사까지 받는 어려운 과정을 통과했지만 REJECT<br>이어, 코멘트를 바탕으로 JAMA Oncology 도전<br>이번에는 리뷰도 못 받고 낙방<br>추가 수정해서 JAMA Surgery 에 투고.<br>우리의 노력에 하나님께서 도와주신 걸까.<br>Accept with minor revision<br>한번에 Accept 가 되었다. 이런 경우가...<br>결국 이 논문이 우여곡절 끝에<br>어제 자 JAMA Surgery 에 나오게 되었다.<br>이 논문의 결과를 요약하면 다음과 같다.<br>1. 그동안 우리는 유방암 수술후 상지기능 장애를 당연히 여겼다.<br>2. 회복이 안되면, 원래 수술했으니, 그럴거라 생각했다.<br>3. 운동은 수술 후 다 회복된 6주 후부터 하라고 대부분 권고했다.<br>4. 수술 후 하루부터 가능한 운동 (증상과 관절가동범위 고려)<br>5. 외과 의사 만나러 오는 날 ROM 과 어깨 기능 확인 후 운동처방<br>6. 집에서 혼자 우리가 제공한 맞춤형 운동 비디오 보며 운동<br>7. 한달 4번의 운동 교육과 운동처방사와 운동. 비디오와 책자보며 혼자 집에서 운동.<br>8. 2-3주 후면, 거의 대부분의 상지기능 회복<br>9. 한달후67.9%의 환자 상지기능 수술전 수준 회복 (대조군 3.6%)<br>10. 6개월 후 85.7% 상지기능 수술전 수준회복 (대조군 21.4%)<br>11. 대조군 대비 6개월 삶의 질 훨씬 좋고, 신체활동 많이 하고, 근육량 유지<br>12. 논문의 Supplementary 자료만 40페이지<br>유방암환자 수술후 하루 부터 운동시작 가능<br>사실, 상지 제약은 있지만, 스쿼트는 당장 할 수 있고,<br>견갑골 mobility 운동은 바로 가능함!!!<br>글을 쓰다 보니 장문의 글이 되었지만 결론은<br>1. 운동이 약이다.<br>2. 운동이 최고의 치료다.<br>3. 앞으로 갈길이 멀다.<br>4. 민지희 박사 축하한다.<br>5. 민지희 박사 고생 많았다.<br>논문을 Open access 로 하려니, 돈을 많이 내야 해서<br>기관에서 논문을 구독하지 않으면 못봅니다.<br>혹시 논문 전문이 필요하면 jjeon@yonsei.ac.kr 로 메일 주세요.<br>#민지희#김승일#김지예#운동이약이다<br>https://jamanetwork.com/.../jama.../article-abstract/2819794</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02bDm6HGdgoY2HoRHb7dLNis2Mrjq8e5sT8uzFMCefHct7Bww8qBqydMBQvaoRH6kyl", "featured": false}, {"id": 225, "date": "2024년 6월 18일", "year": 2024, "title": "금요일에 항공권 구입", "themes": [13], "content_html": "<p>금요일에 항공권 구입<br>월요일에 폴란드 학회 참석차 출국<br>온라인 등록 마감으로 학회 등록도 안하고<br>숙소 예약도 안하고<br>그냥 바르샤바행 비행기에 몸을 실었다.<br>공항에서 유로로 환전해 오니<br>여긴 유로가 아닌 폴란드 돈을 쓴다. 헐...ㅠ<br>학회 장소는 바르샤바에서 2시간 떨어진 곳<br>기차를 두 번 갈아타고 밤늦게 도착<br>막연히 호텔 쪽으로 걸어가<br>예약도 없이 체크인<br>공항에서 기차역까지 가는 기차안에서<br>표를 구입하는 방법을 물었더니<br>자기의 표를 나에게 나눠 주며<br>BTS 팬이라고, 아미라고 한다.<br>BTS 가 정말 국위선양에 엄청난 역할을 한다.<br>학회에 현장 등록을 혹시 안 받아주면 어쩌나 하고<br>한시간 일찍 학회 장소로 출발..<br>도착해 보니, 내가 도착한 Medical University of Lodz, 학회 장소는 우버로 20분 떨어진<br>곳 ㅠㅠ.<br>이렇게 준비 없이 학회에 와 보긴 처음이다.<br>이 학회에 한국인은 나 하나다.<br>동양인은 거의 없다.<br>아직 생소한 제목 Salutogenesis<br>하지만, 너무 중요한 주제라<br>앞으로 한국에 많이 알려질 거라 생각한다.<br>올 가을에는 스터디 그룹<br>내년에는 한국에서 국내 심포지엄이 만들어지고<br>그 후년에는 아마 국제 심포지엄도 한국에서 열리지 않을까<br>생각한다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02sRJ57ayhjAj4GoH8CvN8k4dhStp6rG91wCso2VSuC6n1HwShHCJ9HBWhYK5k4egjl", "featured": false}, {"id": 226, "date": "2024년 6월 21일", "year": 2024, "title": "학회 등록 가능 여부도 모르고", "themes": [10, 13], "content_html": "<p>학회 등록 가능 여부도 모르고<br>그래서 호텔도 예약도 안하고<br>무작정 참석한 Salutogenesis 학회!!<br>새로운 것 많이 배우고 좋은 분들 많이 만나고<br>이제 한국의 일상으로 돌아갑니다~^^<br>혹시 Salutogenesis 검색해 보시고<br>관심이 가는 연구자 분들은 연락주세요!!<br>조만간 한국에서 Interest 그룹을<br>시작해 볼까 합니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0cqTtCP6Un86PskyPwgZHTGKFbS6YApie7mbbUaKApDjhaXQArDbdXtJ23wshwsrgl", "featured": false}, {"id": 227, "date": "2024년 8월 24일", "year": 2024, "title": "It take a village to raise a child.", "themes": [3, 4, 5, 6, 7, 8, 9, 14, 16], "content_html": "<p>It take a village to raise a child.<br>아이 하나를 키우는데 온 마을이 필요하다.<br>다른 사람들에게는 모르겠지만,<br>우리 기현이에게는 참 딱 맞는 말이다.<br>어려서 많이 아팠고,<br>항상 불안 불안 했다.<br>어려서 정말 많이 아팠던 기현이를 놓고<br>'우리 기현이 건강하게만 해 주세요'<br>그런데 정말 하나님께서 우리 기도를 들어주셔서<br>건강하게만 해 주시고, 공부는 잘 못했다.<br>그후 아내와 우리가 기도를 잘 못했나<br>후회도 했지만<br>정말 건강하게 잘 자라 주었다.<br>공부는 쭈욱 못했지만<br>고 1까지 다니다 캐나다<br>ADHD 특수 학교로 진학을 했고,<br>이번에 감사하게도 졸업을 했다.<br>난 졸업만 하면 되는 줄 알았는데,<br>내신과 캐나다식 수능 평균 50점을 못 넘으면<br>정식 졸업장 (diploma) 이 안나온다 해서.<br>제발 50점은 넘게 해 달라고 기도했다.<br>감사하게도 50점을 훌쩍 넘겼다.<br>정말 그동안 엄마의 수많은 잔소리<br>공부 시키던 형의 수많은 '욕'<br>안타까운 마음에 시험을 도와 주던 형친구들<br>넌 할 수 있어 라고 앞에선 이야기 했지만<br>과연 할 수 있을까? 라고 걱정하던 나<br>예전에 기현이가 학교생활을 잘 적응 못하던때<br>기현이가 합창을 하는데, 집중 못하고 두리번 거리며 합창하던 모습.<br>그때 기현이 합창팀이 부르던 가사<br>'하늘의 별이 다 화려한 빛을 내는 건 아니지만<br>각 별마다 자신의 빛을 내는 거야'<br>그 가사를 들으며 얼마나 울었던지.<br>옆을 보니 아내도 울고 있다가<br>서로 뻘쭘히 같이 울었던 모습이 생각났다.<br>'기현아 너의 빛을 반짝이렴'<br>기현이 주변 사람들은 다 공부 잘하는 것 같고<br>다 친구들과 잘 지내는 것 같고<br>다 문제가 없어 보이는 것 같은<br>착각을 했을때가 생각 났다.<br>기현이를 보며 '특별한 아이' 라고 격려하던<br>수많은 형, 누나, 이모, 고모, 삼촌들..<br>하늘에 계신 외할아버지와<br>지금도 기현이를 믿어주고 밀어주는 외 할머니<br>요양병원에 계신 서울 할아버지 할머니<br>기현이는 아빠가 필요해 라며<br>옆에 데리고 있으려 했으나<br>결국 다른 학교로 갔으면 하는 이야기를 듣고<br>캐나다 학교로 급하게 고 2부터 옮긴 것은 하나님의 계획이었다.<br>캐나다 집 앞에 텃밭을 분양받은게<br>기현이의 미래를 결정한 것은 하나님의 섭리일 듯<br>3평 남짓하는 텃밭에서<br>상추와 오이 토마토를 키우며<br>농부의 꿈을 꿨고<br>레고를 만들며 엔지니어의 꿈을 꿨는데<br>농기계 수리학과<br>Agriculture heavy duty mechanics<br>라는 전공이 있는지 아무도 생각 못했는데,<br>학교 설명회에서<br>Agriculture heavy duty mechanics<br>라는 말을 듣자 마자, 기준이 기현이 나<br>모두 '이거다'<br>라는 생각이 들며 소름이 돋았다.<br>결국 기현이는 이제 다음 주면,<br>캘거리 옆 'Olds' 라는 스몰 타운에서<br>도시를 나오는 대중 교통도 없는 시골에서<br>기술 대학생활을 시작한다.<br>벌써 머리에 트렉터를 타고 다니는<br>기현이의 얼굴이 떠오른다<br>지난 주 기현이가 3주간의 한국 방문을 마치고 캐나다로 가기 전날<br>그동안 기현이 어려서 부터<br>기현이의 선생님과<br>삼촌과 고모의 역할을 해 줬던<br>음악선생님, 체육선생님, 레고선생님,<br>기타선생님을 초대해<br>식사를 했다.<br>너무 감사한 기현이의 '지지자' 들이다.<br>그분들만이랴..<br>그동안 기현이를 위해 기도해주신 수 많은 분들<br>기현이를 위해 걱정해 주시고,<br>실질적인 도움을 준 분들<br>캐나다 외삼촌 숙모들,<br>캐나다와 한국의 고모와 고모부들<br>심지에 10년이 지난 시점에,<br>기현이 학교에 잘 다니냐 묻던<br>기현이의 학교 선생님들..<br>이제 새롭게 출발하는<br>아직 턱없이 부족한 기현이를 위해<br>계속 기도해 주시길,<br>그리고 응원해 주시길....<br>친구가 별로 없는 기현이를 위해 대신<br>친구가 되어 놀아주고,<br>튜터가 되어 준<br>나의 사랑하는 아내<br>'진아'야 수고했다.<br>It takes a village to raise a child<br>기현이에게 마을이 되어준<br>수많은 분들께 감사드립니다.<br>기현이를 위해 최고의 계획을 가지고 계신<br>하나님<br>감사합니다.<br>앞으로도 계속 인도해 주시길 간곡히 기도합니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0Dnx5zu1VYqNMGeBVWigpU3ZRUpswpbRFTaSCjooEXA8V3WCEYob7KWnP6RuvfwSUl", "images": ["pdf7_page47_img0.jpeg", "pdf7_page50_img0.jpeg"], "featured": false}, {"id": 228, "date": "2024년 9월 14일", "year": 2024, "title": "'난 괜찮아!'", "themes": [1, 3, 4, 7, 8, 9, 10, 12, 13, 16], "content_html": "<p>'난 괜찮아!'<br>'아마 더 좋은 일이 생기려고 그러나보지'<br>'액땜한거야!'<br>'고난은 축복의 다른 얼굴이야'<br>'인생은 새옹지마지'<br>늘 어떤 일이 생기면,<br>긍정적으로 해석하려고 노력한다.<br>난 늘 그랬다.<br>아마 매사에 긍정적으로 생각하시는<br>아버지의 영향을 받은 것 같다.<br>그러다 신앙이 생긴 후에는<br>더욱 당연히 그래야 하는 줄 알았다.<br>그래서 늘 '관점이 중요하다'<br>내러티브가 중요하다.<br>그렇게 이야기 하고 다녔다<br>(물론 난 지금도 그렇게 믿는다)<br>하지만,<br>그렇다고 힘든 현실이<br>갑자기 힘들지 않은 건 아니다.<br>그런데, 난 ‘힘들다’ 라고 인정하는건<br>내가 실패한 거라는 생각을 한 걸까?<br>나의 부족한 믿음이 드러난다고 생각을 한걸까?<br>힘들어도 힘든 걸 부정하고<br>다른 사람이 힘들다고 하면<br>그래도, 긍정적인 면을 바라보자고<br>밥맛 없는 소리만 해댔다.<br>어쩌면 스스로에게 ‘난 괜찮아’ 라고<br>자기 암시를 넘어 자기 최면을 하고 있었는지도</p>\n<p>난 요새 힘들다.</p>\n<p>어찌보면,<br>인생에서 가장 힘든 시간을 지나왔거나,<br>지금도 지나고 있는지도.<br>점점 쇠약해져 가는 부모님 모습을 보는 게<br>이렇게 힘들지 몰랐다.<br>치매 걸린 아버지의 급격한 악화<br>요양 병원으로 모셔야만 하는 아들의 마음<br>요양 병원에 가기 싫으신 치매 걸린 아버지의 마음<br>아버지를 병원에 모셔다 드리는 아들의 마음<br>집으로 다시 돌아온 아버지, ‘<br>집에서도 집으로 가자고 하시는 아버지<br>다시 요양병원으로 모실 수 밖에 없는 아들의 마음<br>(우리 누나들도 똑같이, 아니 더 힘들었을 것 같다)<br>아버지가 없는 어머니<br>급격히 건강이 더 안좋아 지신다.<br>이젠 거동도, 배변도 어려워 지셨다.<br>신부전으로 돌아가실 뻔,<br>패혈증으로 돌아기실 뻔,<br>자꾸 정성으로 돌보시는 누님들께<br>섭섭한 말씀을 하신다.<br>요양원을 힘들어 하신다<br>점점 더 아기같이 되어가신다.</p>\n<p>추석이다.<br>그런데, 부모님 집에는 부모님은 계시지 않는다.<br>지난 4월에 시작한 연구비<br>그저께로 마무리가 되었다.<br>수주한 연구비도 있고,<br>떨어진 연구비도 있고,<br>이제 제출을 마무리한 연구비도 있다.<br>오랜 기간 연구비 작성으로 몸과 마음이 힘들다.<br>'창조의 고통'<br>바빠도 수업은 해야 한다.<br>학생들 논문은 지도해야 한다.<br>우리 착한 대학원 생들은 바쁜 나의 눈치를 본다.<br>어머니가 패혈증으로 응급실에 입원하시고.<br>괜찮으시냐고 묻는 학생들과 동료 교수에게<br>또 ‘난 괜찮아’ 라고 입버릇처럼 이야기 한다.<br>‘사실 안 괜찮아도, 미칠 것 같은데도, 난 괜찮아야 한다.’</p>\n<p>캐나다에서 아내가 묻는다 ‘오빠 괜찮아?’<br>아들이 묻는다. ‘아빠 괜찮아?’<br>‘Fine thanks and you?’</p>\n<p>위로는 나의 도움이 필요한 부모님<br>아래로도 나의 도움이 필요한 자녀<br>함께 힘이 되어줄 아내가<br>캐나다에 있어서 더욱 힘들었던 것 같다.<br>이제 기현이 기숙사에 적응을 하고,<br>아내가 한국으로 돌아온다.<br>나의 마음도 진짜 괜찮아지길 기대해 본다.<br>'힘들어 하는 부모님을 보며,<br>어쩌면, 난 괜찮으면 안돼' 라고<br>자기 암시를 하고 있는지도.. ㅠㅠ</p>\n<p>그래서 그런지, 주변에 힘들어 하는 사람들의<br>마음에 조금 더 잘 보인다.<br>'괜찮아요' 하는 말 뒤의 담긴 의미들.....<br>그래도 괜찮아 보려고 한다.<br>'이 또한 지나가리라'<br>안괜찮아도 괜찮아<br>It's ok not to be ok<br>'Life goes on'<br>누나야. 힘들지..<br>함께 힘내보자.<br>#웃는게웃는게아냐#울어도괜찮아, #힘들어도괜찮아#옥시토신이야기</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid05SVdss1FJYBxN48ydUaCNAguFN2UEqxjFvqMvYJq1NHo5EcrSmDED6xEncK29mwzl", "featured": false}, {"id": 229, "date": "2024년 10월 10일", "year": 2024, "title": "오늘 오전 현진이가 유투브에서 봤다며 메시지를 보내왔다.", "themes": [3, 4, 8, 13, 14], "content_html": "<p>오늘 오전 현진이가 유투브에서 봤다며 메시지를 보내왔다.<br>링크와 자신의 센스있는 댓글도 챕쳐해 보내줬다 (현진아 고맙다~)<br>10월 9일 한글날,<br>무려 11시경에 시작한 인터뷰가<br>오후 5시경에 마무리 되었다.<br>다이어트에 대한 이야기<br>운동에 대한 이야기<br>옥시토신에 대한 이야기<br>사랑에 대한 이야기를<br>허심탄회하게 나누었다.<br>아..<br>그런데, 예상하지 않았던 부분에<br>눈물샘이 터졌다.<br>옥시토신과 회복탄력성을 이야기 하다<br>\"부모도 없고, 불우한 환경에서 자라던 아이중<br>회복탄력성이 높았던 아이는 그래도 곁에서<br>자신을 믿어준 어른 혹은 진정한 친구가 한명은 있었던<br>아이들이었다' 는 이야기를 하다가<br>말을 이어갈 수 없었다.<br>그 한명이 없어서 힘들어 하는 사람들 몇 몇이<br>눈앞에 아른 거렸다.<br>기숙사에서 친구들을 사귀고 싶지만,<br>힘들어 하는 아들의 모습 ㅠ<br>최근 보육원에서 알게된<br>너무도 이쁘고 소중한, 하지만, 아픔을 갖고 자라는 아이들<br>외로움에 몸부림치는<br>하지만, 스스로의 외로움을 부정하고<br>스스로 고립하는 세대들이 마음에 깊이 다가왔다.<br>마음이 열린 어른이 필요한 사람들<br>사랑받아 본적이 없어 어떻게 사랑할 줄 모르는 어른들<br>뭔가 해보려다 조언질과 잔소리만 하게 되는 어른들 (나포함)<br>아주 아주 미약하나마,<br>저들을 위해 무언가 할 수 있는 아주 작은 일이라도<br>뭐라도 해야겠다는 생각이 든다.<br>밥 한끼 함께 먹는 일이라도<br>아님, 짧은 기도 한 번이라도.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02JbsYDHhjB8jVt7tMsYLi5ggKrkMMLYQFSf9JsswPG9BcdxriRN8z6yjjnN2vaLvEl", "featured": false}, {"id": 230, "date": "2024년 11월 17일", "year": 2024, "title": "40년전에 날아온 편지", "themes": [2, 3, 4, 8, 9, 10, 12, 14], "content_html": "<p>40년전에 날아온 편지<br>정확히는 39년 전이다.<br>내 인생의 암흑기...<br>39년전 중학교 3학년 시절<br>만약에 인생의 리셋 버튼이 있었다면<br>아마 심하게 누르고 싶은 시절이었을 것이다.<br>뭐하나 잘하는 게 없었던 시절이었다.<br>중학교 1학년때는 B 형 간염에 걸려 치료받고<br>친구들은 나와 밥 먹기를 꺼리고<br>강북에서 강남으로 이사 가고<br>성적은 곤두박질 치고 (70명중 40여등)<br>그나마 좀 하는 건 싸움이었는데<br>나보다 싸움 못하는 애와 (그 친구는 다르게 생각할지도 모르지만)<br>이상한 싸움 상황에서 싸움을 피하고 싶은 난<br>돌아서다 휘두른 주먹에 턱을 맞아<br>턱뼈에 금이 가 병원에 입원하고 수술하고<br>병원에 있느라 고등학교 입시 체력장 빵점 맞고<br>여름방학 중 우반과 열반으로 나누어 보충수업을 하는데<br>난 열반에 배정되어 열 받아 학교 안 가고<br>(어쩌면 챙피하고 자존심 상해서)<br>혼자 독서실에서 공부할 때였다.<br>병원에서 퇴원하기 전날<br>난 '내 인생이 그렇게 끝났으면 좋겠다' 라고 생각했다.<br>학교에 돌아가서 애들을 어떻게 보지?<br>난 공부도 못하는데,<br>싸우다 맞아 턱뼈가 부러진 아이가 되었다.<br>다시 생각한 해도 참 찌질이 시절<br>옆집 아저씨가 운영하던 집에서 상당히 떨어진<br>잠실 배명 고등학교 앞 '승리 독서실'<br>난 그곳에서는 다른 아이였다.<br>내가 ADHD 라 집중력이 떨어져 공부를 못했지<br>공부를 열심히 안 한 것은 아니었다.<br>다들 내가 공부 잘하는 줄 알았다.<br>'용관아 너 몇등 하니?' 음.. 한 10등 정도?<br>ㅋㅋ 자존감이 낮은 그 시절 찌질이 용관이는<br>그렇게 공부 잘하는 척을 했다.<br>\"Fake it until you make it\"<br>그렇게 자존감 낮은 나를<br>유독 동생으로 이뻐 해 주던 누님이 있었다.<br>그 누님도 당시 강남에서 독서실을 다니셨다.<br>만나면 그렇게 반가워 해 주고<br>수시로 편지를 써 주고<br>라면 사 주시고...<br>얼마전 누님이 주신 편지를 다시 찾아 읽었다<br>당시 고 3이었던 누님의 편지를 읽어보니<br>삶의 고뇌가 상당히 깊이 묻어 있다.<br>생각이 쉬흔이 넘은 내가 다시 읽어도 감동적이다<br>얼마전 아내와 편지에 대해 이야기 하며<br>'하나님께서 나를 위해 당시 보내주셨던 천사'<br>라고 함께 결론을 내렸다.<br>너무 자존감이 낮아 인생을 리셋하고 싶었던 나<br>나 스스로 나 자신을 사랑하지 못했던 나<br>몸과 마음이 만신창이였던 나<br>그런 나에게 그분은 하나님께서 보내주신 천사였지 않을까?<br>당시 많이 아프셨었는 데..<br>지금 어디에서 건강히 잘 살고 계실까?<br>나에게 무한한 아가페 사랑을 보여주셨었는데<br>결혼해서 애들은 잘 키우고 계실까?<br>당시 Fake 하던 나는 열심히 Fake 하다 보니<br>Makt it 하게 되었다.<br>성적과 함께 자존감도 올랐었다.<br>그때 리셋 하지 않은 게 참 다행이다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02qPM9ghs768irC2EuKqPBLSLsX4iJJDFnsXWnbt1uW5vSvxMgDmNaAU2d5uQsyUDFl", "images": ["pdf7_page56_img0.jpeg"], "featured": false}, {"id": 231, "date": "2024년 12월 1일", "year": 2024, "title": "사실 '탈주' 제목만 보곤,", "themes": [1, 3, 4, 5, 8, 9], "content_html": "<p>사실 '탈주' 제목만 보곤,<br>그다지 구미가 당기지 않았다.<br>아내와 함께 머리를 식히고 싶었던 나<br>다른 재미있는 것을 찾을 수 없었던 우리<br>결국 '탈주'를 보았다.<br>중간에 쫄리는 장면을 살짝 넘기고<br>클라이막스로 가는 과정에<br>깊은 몰입에 빠졌다.<br>그러다, 다음 장면을 보던 중 마음 가운데서<br>'깊은 탄식이 흘러 나왔다'<br>맞다. 그거지...</p>\n<p>\"실패는 해볼 수 있지 않겠습니까?<br>해보고 싶은 것 해봤다가 실패하고<br>또 해봤다가 또 실패하고<br>멋지지 않습니까?<br>여기선 실패조차 할 수 없으니<br>내 마음 껏 실패하러 가는 겁니다~“</p>\n<p>실패를 밥먹듯이 하는 나에게 주는 메시지다.<br>아니 '헬조선' 이라며 주변을 탓하는 우리에게 주는 메시지다.<br>실패해도, 그래도, 다시 도전해 볼 수는 있으니까~.<br>그리고 영화의 끝장면에<br>\"죽음이 아닌 의미없는 삶을 두려워 하라\"<br>이 말을 실존주의 철학자 사르트르, 알베르 까뮈가 했는지<br>조다단 에드워드가 했는지<br>아니면 영화 시나리오 작가가 했던지.<br>어쨋든지, 마음 깊이 공감이 되었다.<br>.. 아~~</p>\n<p>오늘 출근한 나에게 사랑하는 북에서 오래전<br>한국으로 온 제자가 메시지를 보내왔다.<br>2006-2007년 연세대학교에서 새터민 학생들을 지도하던 시절<br>정부에서 나오는 지원금으론 핸드폰요금과 공과금 내면 남는게 없어<br>해외에 나가는 것은 생각도 못해본다고 하던 학생들.<br>학생들과 이룰 수 없는 꿈을 꿨다.<br>\"까이거 우리도 한 번 미국 가보자“</p>\n<p>최근 작고하신 총장님께서 미국 비자를 위한 재정 보증을 서 주셨고<br>연세대학교 30여명의 교수님께서 작게는 10만원<br>많게는 100만원을 지원해 주시고,<br>학생들은 자신의 용돈을 쪼개서<br>여러명의 새터민 학생들이 함께 미국에 다녀왔다.<br>그때 영현이는 '북한 인권을 돕는 변호사가 되고 싶습니다'<br>라고 미국의 교회들을 돌며 간증했었는데.</p>\n<p>2019년 변호사 시험에 최초로 합격해서 1호 북한 출신 변호사가 되었고<br>지금도 열심히 변호사로 활약중이다.<br>오늘 아침 따뜻한 메세지를 보내준 영현이<br>SNS 에 올려도 된다는 허락을 받고,<br>여기에 올려 본다.<br>네번의 변호사 시험에 실패하고<br>다섯 번째 도전에 성공한 영현이~!!<br>그리고, 의미 있는 삶을 추구하는 영현이~~!<br>영화의 스토리와 오버랩이 되어 글을 남겨 본다.<br>https://www.epochtimes.kr/2024/12/695594.html</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0AhQi6ws79jUUAyKnLdKN9HnpKZauC2zocvq7RwWvBUeCYPmArRoQhvMzm6uMQY8el", "images": ["pdf7_page58_img0.jpeg"], "featured": false}, {"id": 232, "date": "2024년 12월 24일", "year": 2024, "title": "성탄절 아침, 함께 하지 못하는 큰아들을 생각하며", "themes": [3, 4], "content_html": "<p>성탄절 아침, 함께 하지 못하는 큰아들을 생각하며<br>Family<br>BORN to be,<br>A thread of destiny.<br>HAPPEN to be,<br>An unchosen Mosaic.<br>OUGHT to be,<br>A bond of endless loyalty.<br>Sometimes,<br>HATE to be,<br>A weight too heavy to flee.<br>But most of the time,<br>HAPPY to be,<br>A haven where hearts find ease.<br>LOVE to be,<br>An eternal melody of “we.”<br>So deep the love, no words can store,<br>So pure the bond, life I'd lay down for.<br>Missing David in Vancouver</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02tTaZrhEQ2becztV5A8H2ckUJ22ENXcybZvWQU2Vkj4J7Peqib3jqtSDh5eMvFF1yl", "featured": false}, {"id": 233, "date": "2024년 12월 31일", "year": 2024, "title": "용관아!", "themes": [1, 3, 4, 5, 6, 7, 8, 9, 10, 13, 16], "content_html": "<p>용관아!<br>어느덧 2024년의 마지막 날이 되었다.<br>6시 전에는 퇴근할 예정이니,<br>마지막 한두시간이라고 할 수도 있겠네.<br>한해의 시작과 마무리<br>책을 읽을 때 바쁘면<br>맨 앞 페이지와 끝 페이지를 보는데<br>올해의 시작은 성공 보다는 성장이라고<br>수 많은 도전과 실패 속에서<br>캐나다에서 시작하며 스스로를 위안했는데<br>올해의 마지막은....<br>한국에서 파란 하늘을 바라보며 연구실에서 마무리 중이구나.<br>올 한해 고생 많았다.<br>부모님 요양원과 요양병원으로 모시면서<br>마음 고생이 많았고,<br>옥시토신 책 펴내고<br>책에 쓴 내용대로 살아본다고 노력하느라 애썼고<br>2월에 시작한 연구비 작성을<br>10월에야 마무리 하느라 애썼고<br>그 사이에 두 개의 연구비를 또 쓰느라 애썼고<br>아들들 서포트 하느라 아내가 캐나다에 있느라<br>혼자 외롭게 고생하며 사느라 애썼고<br>아들 대학 한 번 보내 보겠다고<br>마음 졸이고, 밥해주고, 협박하고, 격려하느라 애썼고<br>학생들 한 명 한 명, 부족하지만 응원하고 지원하느라 애썼고<br>새롭게 강의 만들어 매주 강의 준비하느라 애썼고<br>'뇌' 한 번 연구해 보겠다고, 공부하느라 애썼고<br>'뇌건강' 관련 특강 한다고, 수백시간 짬짭히 준비하느라 애썼고<br>살루토제네시스 연구한번 해 보겠다고<br>해외 다녀오고, 별로 반겨하지 않는지도 모르는 사람들 만난다고 애썼고<br>한다고 해도, 때론 진심을 오해받고,<br>오해받아 속상해 하고, 마음 아파하고, 스트레스 받고<br>도전하다 실패하고, 도전하다 실패하고 결국 해를 넘기는 일도 있고<br>마무리가 아직 되지 않아, 찝찝한 일들도 많지만,<br>이제 오늘과 내일 다 잊자.<br>잠시 쉬어보자. 그래도 된다. 용관아~<br>대한민국의 현재가 불안하고<br>대한민국의 미래가 걱정이 되지만<br>그래도, 하나님의 은혜로 대한민국은 다시 일어날 꺼라 믿으며<br>우리 아이들도 내년 이맘때에는 더욱 건강하고,<br>자신이 무엇을 하고 어떻게 살아가야 할 지 알고 있을 거라 믿으며<br>아내와 함께 더욱 건강하고, 사랑하고, 배려하며<br>학생들은 자신의 분야에서 성공하고 성취하며, 서로 사랑하고<br>내가 속한 연세대학교 스포츠응용산업학과의 구성원들은<br>탐구의 즐거움과 사랑과 존중으로 가득차게 될 것을 기대하고<br>올 한 해 마지막을 맞이해 보자.<br>다시 출근할 때에는 2025년이 되겠지~~<br>아듀 2024,</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0zCzsbRhPw7pjpoAPDmkMfVZ9BF9HjhCaFFu2JcYGdP5PkkZdJkDCe2ZuC46mDwPml", "images": ["pdf7_page60_img0.jpeg"], "featured": false}, {"id": 234, "date": "2025년 3월 10일", "year": 2025, "title": "엄마의 기억속에서 내가 사라졌다.", "themes": [3, 4, 6, 8, 12, 16], "content_html": "<p>엄마의 기억속에서 내가 사라졌다.<br>얼마 전까지만 해도 왔다갔다 하셨는데<br>이제는 날 알아보지도 못하신다.<br>이렇게 난 아버지와<br>엄마의 기억 속에서 모두 사라져 버렸다.<br>자식을 잊어버린<br>부모님의 마음이 되어보니<br>더더욱 슬프다.....<br>그럴수록 아버지와 엄마에 대한 나의 기억<br>특히 감사한 기억들은 더더욱 생생해진다.<br>두분을 부모님으로 만난<br>나는 최대의 행운아다.<br>사랑 많은 누님들이 많은 것은 덤!!^^<br>은혜다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid024xeMnxeZ8zLeRLDbkQvxzhswphCcDrgPJss9MWKcJp36v2J7Vwt6vQHHcQ1DPmXLl", "featured": false}, {"id": 235, "date": "2025년 4월 30일", "year": 2025, "title": "우리는 그동안", "themes": [9, 10, 13], "content_html": "<p>우리는 그동안<br>우리를 아프게 하는 것이 무엇인지 연구하고<br>우리를 아프게 하는 것을 제거하면<br>건강해 지는 줄 알았습니다.<br>이런 접근법을 Pathogenesis (질병기원) 접근법이라고 하죠.<br>'암' 제거해! '혈압' 낮춰, '혈당' 떨어뜨려!!!<br>그런데, 과연 이게 정답일까요?<br>물론, 암세포 제거 해야 하고,<br>혈당 떨어뜨려야 하죠.<br>그런데, 그런다고 다 건강해 지는 것은 아닙니다.<br>그럼, 어떻게 해야 할까요?<br>우리를 건강하게 하는 것을 무엇인지 알아서<br>그걸 하면 어떨까요?<br>What makes people healthy?<br>이런 접근법을 Salutogenesis 접근법<br>(건강기원) 이라고 합니다.<br>기존에 Pathogenesis 접근법으로 보면<br>그 대상은 환자이며, 질병치료, 혹은<br>질병 진행 예방 및 재활이 목적이 됩니다.<br>Pathogenesis 관점에서 보면 우리는<br>환자와 정상인으로 나뉩니다.<br>그런데, 과연 그럴까요?<br>비만은 다양한 내과 외과적 질병을 유발합니다.<br>그렇다고, 다양한 병원을 돌면서<br>비만으로 인해 생기는 질병을 치료하고,<br>혹은 증상을 관리하는 게 답일까요?<br>어쩌면, 우리를 비만하게 하는 라이프스타일을 고치는게 답이 아닐까요?<br>(이게 쉽지만은 않지만요)<br>Salutogenesis 접근법에서는 우리를<br>Dis-ease 와 Ease 의 Continium<br>연속선상에서 바라 봅니다.<br>Dis-ease 의 끝자락은 죽음이고<br>Ease 의 끝자락은 Thriving<br>(의미있고, 활력이 넘치는 삶) 이 됩니다.<br>지금도 고령화로인해<br>의료 재정 적자에 허덕이고 있는 현실에서<br>아픈 사람만 치료하는<br>Pathogenesis 의 관점을 지속하면,<br>향후 우리나라 의료 재정 건정성은<br>심각한 위협을 맞이할 겁니다.<br>관점을 빨리<br>Salutogenesis 관점으로 바꿔야 합니다.<br>지금 유치원부터 학업 스트레스로<br>기를 못피고 심지어 자살로 죽어가는<br>(10대 20대 사망원인 1위 자살)<br>대한민국의 다음 세대를 구해야 합니다.<br>우리 학교의 환경은 Pathogenic 인가요?<br>Salutogenic 인가요?<br>학교 정책을 돌아봐야 합니다.<br>스포츠 마케팅을 통해<br>기업은 더 많은 돈만 벌면 되나요?<br>사람 살리는 Salutogenic 마케팅을 해야 합니다.<br>직장환경은 어떤가요?<br>기업의 이익을 위해서 직원을 갈아 넣는 Pathogenic 한 환경인가요?<br>아니면, 기업과 사람을 동시에 살리는 Salutogenic 한 환경인가요?<br>이 글을 읽으며 여러분은 이미<br>Salutogenesis 의 개념을 50% 는 이해하셨습니다.<br>저는 우리 나라가<br>가장 Salutogenic 한 나라가 되면 좋겠습니다.<br>우리 서울이<br>가장 Salutogenic 한 도시가 되면 좋겠고<br>서대문구가<br>가장 Salutogenic 한 '구'가 되면 좋겠고<br>연세대학교, 세브란스가<br>가장 Salutogenic 한 기관이 되면 좋겠습니다.<br>연세대학교에서 국내에서 처음으로<br>Salutogenesis 심포지엄을 개최합니다.<br>노르웨이에서 Salutogenesis 전문가가 오셔서 워크샵을 진행하시고<br>저도 지난 1년간 열심히 공부한 Salutogenesis 를 국내에 소개하고<br>심리학과, 의과대학, 간호학과, 교육학과, 스포츠응용산업학과 교수님들이<br>자신의 전공을 Salutogenesis 와 연계해서 발표를 하십니다.<br>이런 이야기를 알버타 대학에 가서<br>학장과 20분 이야기 했는데,<br>연세대학교에 와서<br>Salutogenesis 를 배우겠다고 하고,<br>4명의 교수가 다음 주 한국을 방문합니다.<br>그리고, 일본에서도 3명의 학자와 와서 발표하고,<br>WHO 에서도 한 분 참여하십니다.<br>그래서, 이번 심포지엄은 총 5개국에서<br>거의 20명의 발표자와 좌장이 참여하는 뜻깊은 행사가 되었습니다.<br>연세대학교에 여러분을 초대합니다.<br>오셔서 함께 공부하시고,<br>함께 토론에 참여하시고,<br>함께 식사하시고,<br>서로 배우는 시간이 되면 좋겠습니다.<br>누구든지 참여 가능합니다.<br>꼭 학자일 필요 없고,<br>대학생 대학원생<br>직장인, 공무원, 가정 주부<br>누구나 참여 가능합니다.<br>참가비는 없습니다.<br>심지어는 유투브 라이브로도 진행이 됩니다.<br>참여를 원하시면, 아래 링크를 통해 등록하시거나, 포스터에 QR 코드를 통해 등록하시면 됩<br>니다.<br>https://docs.google.com/.../1dZOCS7zosvy91KJNejV.../viewform</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02qXsEykNdLsS1D2ZR9wWpNARk2YRLZksjRvtKVhfWvFAkgR2cX88xmVG4djmNSdy6l", "featured": false}, {"id": 236, "date": "2025년 5월 30일", "year": 2025, "title": "사랑하는 교수님~!", "themes": [3, 9, 11, 13], "content_html": "<p>사랑하는 교수님~!<br>원영신 교수님을 처음 뵌 것은 89년 일 듯 싶다.<br>교수님께서 연세대학교 강사이시던 시절<br>'현대무용' 과 '리듬체조' 를 교수님으로 부터 수강했다.<br>장난끼 많은 우리들은 몸 동작으로 '새'를<br>역동적 '폭포' 를 몸으로 표현하는<br>현대무용 수업이 낯설었지만<br>너무 재미있고 흥미로웠다.<br>나에게는 너무나 임팩트 있는 수업이었는지<br>어학 연수를 가서도 '현대무용' 공연을 갔다<br>어학연수를 마치고<br>한국에 돌아와 진로를 고민할때<br>교수님을 찾아 갔다.<br>체육을 통해서 세상에 봉사하고 싶은데요,<br>뭘 해야 할 까요?<br>교수님은 실제 부딪혀 봐야 한다며,<br>달동네 헬스장에 가서<br>웨이트를 가르치는 곳을 소개해 주셔서<br>처음으로 봉사라는 것을 해 보았다.<br>이후 장애인 체육을 하게 되고, 유학을 갔고<br>한국에 돌아오면 가끔 인사를 드렸다.<br>그랬던 교수님이 어느새 선배 교수님이 되었고<br>함께 연세대학교에서 거의 20년을 함께 있었다.<br>늘 후배 교수들을 챙기고,<br>쉴새 없이 새로운 것을 만들어 내고<br>여성체육학회, 사회체육학회, 스포츠미디어 학회,<br>노인체육등 정말 다양한 분야를 섬기시고,<br>때론 개척하시고<br>그렇게 열심히 일하시며,<br>후배들에게 귀감이 되시었다.<br>너무 무리하신 것이 었을까?<br>교수님께서 뇌종양이 발병하셨고,<br>거의 2년의 투병 끝에 지난 5월 7일 소천하셨다.<br>해외 손님들을 모시고<br>살루토제네시스 심포지엄을 개최 중이라<br>장지 까지 따라가지는 못한게 너무 아쉽다.<br>앞서 모범을 보여주신<br>나의 멘토 교수이신 원영신 교수님<br>사랑합니다. 존경합니다. 그립습니다 ㅠㅠ</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02JfuuNndPXS9xDaML1fs9wxT93wDUuEymdS6rzhaFSuhqt9rjKWsZWkGznrUGZeZFl", "images": ["pdf7_page66_img0.jpeg"], "featured": false}, {"id": 237, "date": "2025년 8월 27일", "year": 2025, "title": "20년의 교수 생활을 통해 깨달은 것이 있다.", "themes": [3, 4, 5, 8, 9, 10, 15], "content_html": "<p>20년의 교수 생활을 통해 깨달은 것이 있다.<br>새로운 것을 공부할 때 가장 효과적인 방법은<br>그 주제로 강의를 만드는 것이다.<br>생각해보라. 매주 3시간짜리 강의를 위해<br>최소 10시간을 준비하고,<br>이를 12-15주간 진행하면<br>그 주제에 대해 대략 200시간 가량 깊이 있는<br>공부를 하게 된다.<br>얼마나 좋은 학습법인가.<br>더욱이 학생들이 이해할 수 있도록 설명해야 하고,<br>학생들의 질문에 답해야 하다 보면(때로는 모른다고 솔직히 말하고 나중에 알려주기도 하지<br>만)<br>어느새 그 주제를 깊이 이해하게 된다.<br>그래서인지 연세대학교에 온 후<br>만든 수업만 15개가 넘고,<br>지금도 5-6개의 수업을<br>돌려가며 강의하고 있다.<br>가끔 아내로부터<br>\"왜 이렇게 새로운 강의를 만들어서<br>스트레스 받고 고생하느냐\"는 질책을 듣기도 한다.<br>깊은 성찰은 경계에 서서<br>경계를 바라보는 것이라고 한다.<br>새로운 강의를 만들다 보면<br>내가 무엇을 알고 무엇을 모르는지 명확해진다.<br>다시 말해 그 경계를 알게 된다.<br>지식과 무지의 경계에 서서<br>새로운 것을 알아가며<br>무지를 줄여가는 쾌감은 정말 엄청나다.<br>최근 유튜브(최겸, 함밥) 촬영을 하면서<br>이런 이야기를 했다.<br>노인과 젊은이의 차이는<br>이 경계를 넘어서는 것을 두려워하느냐,<br>아니냐로 결정된다고.<br>젊은이도 자신이 익숙한 것<br>(Comfort Zone) 안에만<br>머물러 있으면 젊은 꼰대가 될 수 있고,<br>노인도(스스로 노인이라고 인정하고 싶지 않지만)<br>새로운 꿈을 꾸고 경계를 넘어가는 것을<br>두려워하지 않으면 얼마든지 젊은 노인이 될 수 있다.<br>이번에 학교라는 나의 경계를 넘어<br>트레바리 클럽장에 도전해보기로 했다.<br>늘 교수로서 학생들에게 지식의 전달자,<br>경험의 기획자 역할을 했다면,<br>이번에는 일반인들과 4개월간(월 1회)<br>만나 책 이야기를 나누고<br>서로의 지식과 경험을 공유하는 것이다.<br>익숙하지 않을 테고 두렵기도 하지만,<br>새로운 경계를 넘어갈 기회라는 생각이 든다.<br>물론, 정원이 안되면 강의가<br>개설되지 않을 수도 있지만<br>그것도 괜찮을 것 같기도 하다.<br>https://trevar.in/C9jMfC<br>#트레바리,#전용관교수,#옥시토신이야기</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0cjnWHqrCW7zRwDFbUexNu8hdzZmN3oaZg8C1by1WDwYAUKjih9ayh3VNxC5ZfJa3l", "images": ["pdf7_page68_img0.jpeg"], "featured": false}, {"id": 238, "date": "2025년 9월 14일", "year": 2025, "title": "어떻게 그렇게 책을 재미있게 썼냐?", "themes": [1, 3, 4, 6, 12, 16], "content_html": "<p>어떻게 그렇게 책을 재미있게 썼냐?<br>때로는 웃으시고, 때로는 눈물을 훔치시며<br>옥시토신 이야기를 한 열 번을 읽으신<br>어머니......<br>내가 뭘 해도 응원해 주시던 어머니<br>그러고 생각해 보니,<br>난 엄마에게 꾸중을 들은 적이 별로 없다.<br>항상 아들을 믿고 지지해 주시던 어머니<br>초등학교도 못 마치셨지만,<br>항상 사리 판단이 밝으셨고<br>직관력이 뛰어나셨던 어머니<br>없는 집에 시집 오셔서<br>힘든 시집살이 속에<br>자식 여섯을 키우시고<br>40대부터 여러 번 아프셔서<br>죽을 고비를 여러 번 넘기신 어머니<br>1950년 인천 공장 직공으로 일하시며<br>놀던 시절을 이야기 하시며 웃으시던<br>그리고, 625가 터져 강화로 돌아오는 길에<br>전쟁통에 자신을 찾으러 서울로 올라오시던<br>외 할아버지를 만났다고 이야기 하시며<br>할아버지 생각에 눈물을 훔치시던 어머니<br>시집올 때 해온 게 없다고 구박하던 시어머니<br>그 이야기를 듣고 산을 몇 개 넘어<br>돼지 한 마리를 어머니에게 안겨 주시고<br>시집살이 하는 딸을 걱정하시며 가시던 길가에서<br>영원히 저 세상으로 가신 친정 엄마를 이야기 하며<br>눈물을 훔치시던 어머니<br>특히 웃음이 아름다우시던 어머니<br>나에게 ADHD 유전자를 물려주신 어머니<br>어머니<br>어머니께서 그리워 하시던<br>엄마의 아버지와 어머니를 만나셨나요?<br>먼저 간 사랑하는 막내딸도 만나셨나요?<br>어머니 수고하셨습니다.<br>고생 많으셨습니다.<br>사랑 합니다.<br>이제 세상에 엄마라고 부를 수 있는 분은 없지만,<br>어머니는 나와 우리 가족들의 마음에 늘 남아 있겠죠<br>엄마로, 할머니로, 이모와 고모로,<br>어머니의 수 많은 이야기들은<br>우리의 마음과 생각 속에 남아 있을 거예요.<br>어머니 사랑합니다.<br>엄마 잘가.....<br>엄마의 웃던 모습만 기억할께.<br>철없던 막내 아들이<br>93세 이셨던 우리 어머님은<br>지난 주에 만수를 다 누리시고<br>평안하게 하늘 나라로 가셨습니다.<br>함께 몸과 마음으로 지난 주 장례를<br>도와주신 분들께 감사를 드립니다.<br>제가 경황이 없어서<br>많은 분들에게 알리지 못해서 죄송합니다.</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0YPHqp3GAGeC7ZT6C6o6dcrjsmjrkT7y2xrrXNtHJPcBiDxW263KP78cubw72LkoAl", "images": ["pdf7_page70_img0.jpeg"], "featured": false}, {"id": 239, "date": "2025년 9월 21일", "year": 2025, "title": "태어나면 다 어른되고", "themes": [3, 4, 8, 10, 13, 16], "content_html": "<p>태어나면 다 어른되고<br>대학가고, 장가가고<br>애들 태어나고,<br>그리고 애들 결혼하고<br>뭐 이러는 줄 알았습니다.<br>그런데, 이 중 하나도 은혜가 아니면<br>안된다는 것을 연애 하면서 처음 깨달았죠<br>하나님의 은혜로<br>기준이는 캐나다에서 태어 났습니다.<br>그것도 제가 1년간 진행한 석사 학위 논문<br>마지막 실험이 있는날.<br>실험이 9시인 걸 알고 새벽 4시경 태어나 주었죠.<br>손자를 보러 한국에서 온 우리 엄마가<br>한국에 돌아가시는 날 당일<br>아내를 도와주러 한국에서 장모님이 오신 다음날<br>기준이는 항상 그랬어요.<br>우리 속을 썩인 적이 없었죠.<br>이름 처럼 늘 '기준' 같은 생활을 했고<br>알아서 공부하고,<br>알아서 놀고,<br>늘 우리의 든든한 큰 아들이었습니다.<br>그렇게 기준이가 커서<br>이제 아내를 만나고,<br>이제 장가를 가게 되었습니다.<br>하나가 둘이 되고<br>둘이 기준이가 태어나서 셋이 되고<br>기현이가 태어나 넷이 된 후<br>20년 만에 새 식구가 우리 가정에 들어오게 되었습니다.<br>지수가 이제 우리 새 식구가 되었습니다.<br>아들 둘을 키우며, 거칠어진 아내에게 딸 같은 존재<br>'아가야!' 부르기는,<br>시아버지, 할아버지는 아직 어색한 나에게<br>소중한 며느리<br>기준이에게는 소중한 아내<br>기현이에게는 좋아하는 누나, 이젠 형수<br>이렇게 우리 가정은 경계의 확장을 가져오게 되었습니다.<br>경계가 깨지는 일은 항상 쉬운 일은 아니겠지만,<br>모든 생명은 경계에 있으니,<br>우리 가정은 이렇게<br>더욱 다이나믹한 가정이 되겠네요.<br>시간 되시고,<br>기준이를 아시는 분,<br>혹은 저에게 소중한 아들 장가 보내는 시간에<br>함께 하실 분들은 함께 하시면<br>당일 인사드리겠습니다.<br>일시: 10월11일 토요일 오후 1시<br>장소: 연세대학교 동문회관</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid02Efx6JKa5fn5DCT3B1rHJu1HwenyxjnMFtxAmVHCyQTCHge5FVVKaZ4yFs9ayxZucl", "featured": false}, {"id": 240, "date": "2025년 10월 22일", "year": 2025, "title": "9.11 에서 10.11", "themes": [1, 3, 4, 5, 9, 10, 16], "content_html": "<p>9.11 에서 10.11<br>상주에서 혼주까지 지난 한달<br>아마도<br>내 인생에서 감정적으로 가장 힘든 시간이 아니었을까?<br>사랑하는 엄마가<br>작년 요양원에 들어가시고<br>점점 기력이 쇠퇴하시고<br>기억을 잃어가시고<br>알아보지도 못하시고<br>그렇게 그렇게<br>촛불이 꺼지듯<br>9월 11일<br>하늘로 돌아가셨다.<br>문상을 오신 분들에게<br>&#x27;어머니 93년 행복하게 만수를 누리고<br>이제 하늘나라고 가셨어요&#x27; 라며<br>씩씩하게 이야기 했지만<br>내가 사는 이 세상에<br>엄마가 함께 하지 않는 다는 생각에<br>나를 못 알아보는 엄마라도,<br>누워계신 엄마라도,<br>&#x27;좀 더 세상에 계시지&#x27;<br>손자 결혼식까지 만이라도 살아 계시지.....<br>휠체어에 태워서라도 모셔 오려<br>생각까지 했었는데 ㅠㅠ<br>이미 주변 가까운 분들에게<br>기준이 결혼식 초대를 했는데<br>기준이 결혼식보다 엄마 장례식에서 먼저 만났다.<br>기준이는<br>무엇을 하든 잘하고,<br>태어나면서 많이 아팠던 동생 때문에<br>늘 혼자서 척척 알아서 하는 아들<br>그랬던 기준이에게<br>이번 결혼식은 완전히<br>기준이와 지수에게 집중되는<br>세상 멋진 결혼식을 준비해 주고 싶었다.<br>그래서 그랬을까?<br>할머니의 소천이 기준이에게 미안했다.<br>기준이가 결혼을 위해 와 있는 동안<br>난 엄마 잃은 아들이기 전에<br>아들의 결혼식을 앞둔 아빠여야 했다.<br>슬픈 감정은 나에게 있어서는 안된다.<br>어머니 돌아가시는 날도 수업을 해야 했고,<br>독서클럽 트레바리를 인도해야 했다.<br>트레바리 중에 요즘 어때요? 라는 질문에<br>난 어떤 대답을 할 수 없었다.<br>나 어떻지?<br>......<br>슬픈 감정을 부인하고 억누르다 보니<br>모든 감정이 느껴지지 않는 것 같았다.<br>트라우마가 있는 사람이<br>몸에서 오는 신호를<br>느끼지 못한다는 말이 이해가 되었다.<br>How are you?<br>Fine thanks and you?<br>사랑하는 아들이 결혼식을 잘 하고<br>어제 캐나다로 돌아갔다.<br>그동안 엄마가 기다리셨던 걸까?<br>결혼식을 잘 마친 아들이 캐나다로 돌아간 어제 밤<br>꿈에 엄마가 나타났다.<br>늘 집에서 입던 가운을 입고.<br>엄마 잘 갔다 왔어?<br>나는 물었고<br>엄마는 그저 나를 향해 미소를 띄어 주셨다.<br>어제는<br>아들 내외를 캐나다로<br>엄마를 진심으로 하늘로 보내드린 날인가 보다.<br>2025.10.16<br>Justin Yong Kwan Jeon</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0qc1yZSK8DDsyW4Ng8smNoquwwNfnjZpHURnERwmXqEJBCxkdr2K1VYKpB52z3hL5l", "featured": false}, {"id": 241, "date": "2025년 11월 11일", "year": 2025, "title": "많은 분들의 도움으로", "themes": [4, 8, 13], "content_html": "<p>많은 분들의 도움으로<br>세상에 없던 '온코런' 이 태어났다.<br>산고가 있었다.<br>하지만 출생의 기쁨이 산고를 뛰어넘었다.<br>참가자 중 한 분이 (암 투병 중이심)<br>참가 후 너무 기뻐 하시며 내년에 꼭 해 주세요.<br>내년에 뵈어요!! 말고 말씀을 하셨다.<br>순간 우리 둘 의 눈동자가 흔들렸다.<br>내년 까지 살아 있을까?<br>내년 까지 살아 계실까?<br>저희 5년은 계속 할 꺼예요.<br>내년에 꼬옥 뵈어요.<br>많은 암환자분들과<br>그 가족분들과<br>이들을 지지하는 많은 분들<br>내가 불쌍해서 참여해 주신 분들도<br>모두가 즐겁게 참여해 주셨다.<br>주치의와 환자가 함께 뛰기도 했고<br>항암제 맞은지 5일째, 온코런에 참여하기도 했고,<br>3대가 (최고령 83세) 함께 걷기도 했다.<br>정말 올해 봤던 분들을<br>모두 건강하게 다시 봤으면 좋겠다.<br>이번 온코런은 성공적이었다.<br>그 이유는 아무도 다치지 않고<br>모두가 행복한 표정이었고<br>모두가 즐거워 했다.<br>참여하는 모든 분들의 얼굴이 밝았고<br>집으로 돌아가시는 발걸음이 가벼워 보였다.<br>내년에도 다시 할 수 있다면<br>정말 좋겠다.</p>\n<p>#온코런#옥시토신#살루토제네시스</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid033JDDJnKPxJ9DoQJ4gv2ZpayT6LgUs1H7CETZZ7egCt8y3vH75UkkxGD4EtDzByF7l", "images": ["pdf7_page75_img0.jpeg"], "featured": false}, {"id": 242, "date": "2025년 12월 9일", "year": 2025, "title": "치매로 고생하시는", "themes": [1, 3, 4, 5, 6, 7, 8, 9, 10, 13, 14, 15, 16], "content_html": "<p>치매로 고생하시는<br>사랑하는 아버지가<br>작년 4월에 요양 병원에 입원하신 후<br>처음이자 마지막으로 집에 오셨다.<br>1997년 이사 왔으니 28년간 이 집에 사셨다.<br>항상 창밖을 보시며 감사 기도를 드렸고<br>어쩌다 이런 좋은 집에 살게 되었냐!!!<br>하시고 늘 감사하셨다.<br>자식들을 시집 장가 보내고<br>엄마와 두 분이 오손도손 잘 사셨다.<br>한국에 돌아온 나는 주말이면<br>부모님과 함께 식사하고 외식하고<br>그렇게 많은 추억이 있는 집이다.<br>이제 이 집을 매매하게 되었고<br>누나의 제안으로 마지막으로<br>집에 모셔 캐나다 누나들과<br>영상 통화도 하고<br>55년 함께 사업과 인생의 동반자이신<br>영동 아저씨와도 인사를 나누셨다.<br>두 분의 상호 존중과 우정... ♡♡♡<br>이제 앰뷸란스를 타고 병원으로 복귀한다.<br>나도 연구비를 쓰기 위해 학교로 복귀한다<br>꿈 같은 나들이이자 아버지에게는 소풍이다.<br>우리네 인생이 소풍이라는 말이 불현듯<br>생각을 스친다.<br>더 많이 존중하고 사랑해야겠단<br>생각이 든다.<br>Justin Yong Kwan Jeon<br>1월 10일·<br>공유 대상: 전체 공개<br>난 오늘도 꿈에 강의를 했다.<br>강의 도중에 학생들 일부가 나갔다.<br>난 학생들을 혼냈고,<br>나갔던 학생들 일부는 다시 들어왔다.<br>그런데, 전체적으로 학생들은<br>빠져나가고 있었다.<br>난 수업 준비가 제대로 안 되어 있었다.<br>매 학기 강의 준비가 안 되어 있는 상태로 강의하는 꿈<br>적어도 한 학기 한 두 번은 꾸는 꿈이다.<br>이 꿈을 정신분석학 적으로<br>무슨 의미일까?<br>많은 사람들이 나를 운동<br>그리고 건강 전문가로 알고 있지만<br>공부를 할 수록 아는 것 보다<br>모르는 것이 더 많은 걸 깨닫는다.<br>유투브를 통해 간접적으로,<br>혹은 실제 만나는 분들 중에<br>운동이 원래 전공이 아닌데도,<br>나보다 해부학을 더 잘 알고<br>생리학 혹은 운동의학적<br>지식이 뛰어난 분들을 보게 된다.<br>교수가 되고,<br>강의를 하면서<br>혹은 사람들과 이야기를 하면서<br>이 사람들이 내가<br>이것도 모르는 것을 알까?<br>챙피해 더 공부를 하게 된다.<br>그 분들이 이야기 하는 것을<br>다 아는척 하고<br>연구실에 와서 열심히 자료를 찾아 본다.<br>그렇게 하면서 더 많은 지식을 쌓아 간다.<br>그런데 더 많은 지식이<br>꼭 유용한 것은 아니다.<br>지식과 지혜의 차이를 아는 건 중요하다.<br>지식에 사용 하는 지 知 는<br>알 지 자인 반면<br>지혜에 사용 하는 지 智 는<br>지혜 지 자다.<br>知 자는 화살시에<br>입구 자가 합쳐진 글자다.<br>우리는 지식을 가지고 화살을 쏘듯<br>다른 사람을 공격할 수 있다.<br>심지어 죽일 수도 있다.<br>반면에 지혜는 智<br>알 지자에 날 일 (日)<br>자신이 아는 지식을<br>빛 앞에 비추어 보는 것이다.<br>그 빛은<br>유교적으로 보면 하늘의 밝음이고<br>불교적으로 보면 법의 빛이고<br>기독교적으로 보면 진리의 빛일 것이다.<br>성경에서 지식은 사람을 교만하게 하지만<br>사랑은 다른 사람을 세운다고 했다<br>Knowledge puffs up, but love builds up. (고린도전서 8장 1절).<br>자칫 자신의 지식을 과시하고<br>다른 사람을 공격하고<br>다른 사람을 무시하는데 사용하면<br>그 화살을 자신을 향해 날아올 수 있다.<br>자신의 지식을 빛 앞에 비추어 보고<br>다른 사람을 돕고 세우는데 활용한다면<br>그 지식은 결국 자신을 세우고<br>자신의 무너진 부분을 다시 세우는데<br>다른 사람들이 돕는 일이 일어날 것 같다.<br>지혜로운 사람<br>지혜로운 어른이 될 수 있을까?<br>#지혜로운사람<br>#AI시대지식의의미<br>Justin Yong Kwan Jeon<br>1월 26일·<br>공유 대상: 전체 공개<br>우리의 싱가폴 행은<br>비행기 타기 2시간 전에 결정되었다.<br>뭔 소리냐고?<br>안식년을 맞이해<br>아내와의 7년만의 여행 계획은<br>캐나다 국적인 아내가<br>나트랑 입국에 비자가 필요하단 사실에<br>무참히 무너졌다.<br>집으로 돌아가야 하나?<br>난 대한항공 데스크에<br>&quot;지금 마일리지를 이용해 갈 수 있는 곳 알려주세요!&quot;<br>물었고 친절한 대한항공 직원이<br>안내해 준 곳들 중에<br>한 번도 간 적이 없는 싱가폴을 골랐다.<br>3박 4일의 짧은<br>하지만 쉼이 있는 여행<br>학회와 국제 회의 말고<br>휴가만을 목적으로 한 아내와의 여행<br>정말 오래간만이다.<br>쉴 수 있어서 좋다.<br>함께 여행할 아내가 있어서 좋다.<br>해외 여행을 할 수 있는 건강이 있어서 좋다.<br>마일리지가 있어서 좋다. ng Failure 인 것 같다.<br>내가 만약 유투브 채널을 만든다면<br>그 채널의 이름은 POF 실패의 능력! 이다.<br>실제로 한 번 해 볼까 한다.<br>다양한 사람들을 초대해.<br>성공한 이야기 보다는 실패한 이야기.<br>도전했지만, 아직 성공하지 못한 이야기.<br>죽을 만큼 힘들었던 이야기.<br>끝이 보이지 않을 정도로<br>계속된 실패의 연속<br>그런데,<br>아마 이 인터뷰에 나오는 분들은<br>자신의 실패에 머무른 분들은<br>아닐 것 같다.<br>실패를 디딤돌 삼아<br>더 나은 사람이 된 분들일 것 같다.<br>구독자 몇 명 안되는 채널이지만<br>기꺼이 출연을 원하시는 분들<br>약함이 강함을 이길 수 있다는 것<br>사랑은 자신의 취약함을<br>기꺼이 공유하는 것<br>그 취약함이<br>온전함을 만들 수 있다는 것<br>이런 생각을 가진 분들일 것 같다.<br>#poweroffailure<br>Justin Yong Kwan Jeon<br>3월 3일 오후 4:35·<br>공유 대상: 나만 보기<br>우리는 지금 정보와 콘텐츠의 홍수 속에서 살고 있다.<br>TV와 유튜브를 켜면 끊임없이 성공 이야기가 흐른다.<br>억만장자의 아침 루틴, CEO의 성공 전략,<br>20대에 큰 성공을 이룬 사람들의 이야기들.<br>이런 이야기를 듣다 보면 자연스럽게 이런 생각이 든다.<br>“나도 저렇게 되고 싶다.”<br>“저 사람이 한 대로 해보고 싶다.”<br>하지만 어느 순간 마음속에 또 다른 생각이 스며든다.<br>“나는 저렇게 못 할 것 같아.”<br>“저 사람은 좋겠다.”<br>심지어는 이런 생각이 들기도 한다.<br>“나는 왜 못했지?”<br>“저 사람은 되는데, 나는 왜 안 되지?”<br>성공 이야기를 들을수록 오히려 자신을 비교하게 되고,<br>때로는 자괴감과 우울감이 밀려오기도 한다.<br>물론 그 사람들의 성공 뒤에는 수많은 실패의 시간이 있었다.<br>하지만 사람들은 성공 이야기는 하고 싶어 하고, 실패 이야기는 숨기고 싶어 한다.<br>그래서 우리는 성공의 결과만 듣고, 실패의 과정은 듣지 못한 채 살아간다.<br>나는 오히려 실패 이야기를 하는 사람에게<br>더 큰 힘이 있다고 생각한다.<br>자신의 실패를 솔직하게 말할 수 있는 사람은<br>이미 그 실패를 넘어선 사람일 가능성이 크기 때문이다.<br>얼마 전 나는 지속적인 실패로 스스로를<br>“실패자”라고 부르는 친구를 만난 적이 있다.<br>그 친구의 이야기를 들으며 나는 이렇게 말했다.<br>“실패는 시도의 증거야.”<br>“시도해 봤기 때문에 실패한 거야.”<br>“넌 실패자가 아니라 도전자야.”<br>그 말이 얼마나 위로가 되었는지는 모르겠다.<br>하지만 이야기를 듣던 친구의 눈빛이 조금 달라지는 것을 느낄 수 있었다.<br>요즘 우리 사회에는 은둔형 외톨이가 점점 늘어나고 있다고 한다.<br>그중 상당수가 실패에 대한 두려움 때문에 세상과 거리를 두게 된다고 한다.<br>취업에 실패하고,<br>연애에 실패하고,<br>시험에 실패하고,<br>작은 실패들이 반복되면서 결국 아무것도 시도하지 않게 된다.<br>그리고 그렇게 사람은 시도하지 않는 삶 속으로 숨어든다.<br>하지만 나는 그들에게 이렇게 말하고 싶다.<br>“실패해도 괜찮다.”<br>실패는 약점이 아니라 힘이다.<br>실패를 통해 우리는 자신의 한계와 경계를 이해하게 된다.<br>그리고 실패를 통해 앞으로 나아갈 길을 발견한다.<br>물론 실패가 계속되면 힘들다.<br>하지만 실패가 전혀 없는 삶은 결국 아무것도 시도하지 않는 삶일 가능성이 크다.<br>우리는 토마스 에디슨이 수천 번의 실험 끝에 전구를 만들었다는 이야기,<br>아브라함 링컨이 여러 번 낙선 끝에 대통령이 되었다는 이야기에 익숙하다.<br>하지만 정작 지금 우리 곁에서 살아가는 사람들의 실패 이야기는 거의 듣지 못한다.<br>만약 실패가 힘이라면,<br>실패한 사람들의 이야기는 더 큰 힘을 가지고 있다.<br>그래서 나는 그런 이야기를 세상에 소개하고 싶다.<br>이것이 바로<br>“Power of Failure: Becoming” — 실패의 힘<br>이라는 채널을 시작하게 된 이유다.<br>이 채널은 성공한 사람들의<br>화려한 결과를 이야기하는 채널이 아니다.<br>오히려 그들이 겪었던 실패와 두려움,<br>그리고 다시 일어선 순간들을 이야기하는 채널이다.<br>특히 Season 1의 주제는<br>&quot;Power of Failure: Becoming&quot;<br>부재는 “Fear of Failure — Overcoming”<br>즉 실패에 대한 두려움을 넘어서기”이다.<br>실패보다 더 무서운 것은 실패 자체가 아니라<br>실패에 대한 두려움이다.<br>그 두려움 때문에 우리는 시도조차 하지 못하고,<br>시도하지 않기 때문에 우리는 실패도 경험하지 못하지만<br>결국 자신의 잠재력에도 도달하지 못하게 된다.<br>실패보다 더 큰 실패는 시도하지 않는 것이다.<br>이 채널을 통해 많은 사람들이 실패를 두려워하지 않고<br>자신의 삶에서 새로운 도전을 시작할 수 있기를 바란다.<br>두려워해도 괜찮다.<br>실패해도 괜찮다.<br>당신은 이미 충분히 용감하다.<br>Power of Failure: Becoming<br>#poweroffailure,#Fearoffailure,#Becoming</p>", "fb_link": "https://www.facebook.com/ursospecial2/posts/pfbid0u64FBcDHY2YyG49UGDr4H52ajAH91tLa9DxQnNnv9dWRoPcUHd2cSttCnBouC67ul", "images": ["pdf7_page77_img0.jpeg", "pdf7_page80_img0.jpeg", "pdf7_page81_img0.jpeg", "pdf7_page83_img0.jpeg", "pdf7_page89_img0.jpeg"], "featured": false}];
