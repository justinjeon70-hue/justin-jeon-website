<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <defs>
    <marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 z" fill="#8a8378"/>
    </marker>
    <marker id="arA" markerWidth="7" markerHeight="7" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 z" fill="#a8703f"/>
    </marker>
  </defs>

  <!-- 1. 녹아버림 -->
  <g>
    <circle cx="120" cy="118" r="62" fill="none" stroke="#c6bfb2" stroke-width="2" stroke-dasharray="2 7"/>
    <circle cx="105" cy="100" r="4" fill="#8a8378"/><circle cx="140" cy="132" r="4" fill="#8a8378"/>
    <circle cx="196" cy="96"  r="4" fill="#8a8378"/><circle cx="52"  cy="140" r="4" fill="#8a8378"/>
    <circle cx="168" cy="160" r="4" fill="#8a8378"/><circle cx="62"  cy="74"  r="4" fill="#8a8378"/>
    <line x1="88" y1="86" x2="44" y2="58" stroke="#8a8378" stroke-width="1.4" marker-end="url(#ar)"/>
    <line x1="152" y1="150" x2="196" y2="178" stroke="#8a8378" stroke-width="1.4" marker-end="url(#ar)"/>
    <line x1="186" y1="70" x2="142" y2="96" stroke="#8a8378" stroke-width="1.4" marker-end="url(#ar)"/>
    <text x="120" y="232" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="700" fill="#2c2925">녹아버림</text>
    <text x="120" y="258" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="13.5" fill="#7d746a">아무거나 드나든다</text>
    <text x="120" y="279" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="13.5" fill="#7d746a">안팎의 구별이 사라진다</text>
  </g>

  <!-- 2. 살아 있는 막 -->
  <g>
    <circle cx="380" cy="118" r="62" fill="none" stroke="#a8703f" stroke-width="3.4" stroke-dasharray="36 12.7"/>
    <circle cx="362" cy="104" r="4" fill="#a8703f"/><circle cx="398" cy="128" r="4" fill="#a8703f"/>
    <circle cx="374" cy="146" r="4" fill="#a8703f"/>
    <line x1="452" y1="86" x2="404" y2="104" stroke="#a8703f" stroke-width="1.6" marker-end="url(#arA)"/>
    <line x1="356" y1="140" x2="308" y2="160" stroke="#a8703f" stroke-width="1.6" marker-end="url(#arA)"/>
    <g stroke="#9c9384" stroke-width="1.6">
      <line x1="300" y1="78" x2="326" y2="92" marker-end="url(#ar)"/>
      <line x1="316" y1="86" x2="330" y2="72"/><line x1="316" y1="72" x2="330" y2="86"/>
    </g>
    <text x="380" y="232" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="700" fill="#a8703f">살아 있는 막</text>
    <text x="380" y="258" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="13.5" fill="#7d746a">가려서 들이고 내보낸다</text>
    <text x="380" y="279" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="13.5" fill="#7d746a">가르면서 동시에 잇는다</text>
  </g>

  <!-- 3. 굳어버림 -->
  <g>
    <circle cx="640" cy="118" r="62" fill="none" stroke="#3b3833" stroke-width="7"/>
    <circle cx="622" cy="104" r="4" fill="#8a8378"/><circle cx="658" cy="128" r="4" fill="#8a8378"/>
    <circle cx="634" cy="146" r="4" fill="#8a8378"/>
    <g stroke="#9c9384" stroke-width="1.6">
      <line x1="740" y1="70" x2="712" y2="84" marker-end="url(#ar)"/>
      <line x1="700" y1="76" x2="714" y2="90"/><line x1="700" y1="90" x2="714" y2="76"/>
      <line x1="560" y1="164" x2="572" y2="156" marker-end="url(#ar)"/>
      <line x1="566" y1="146" x2="580" y2="160"/><line x1="566" y1="160" x2="580" y2="146"/>
    </g>
    <text x="640" y="232" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="700" fill="#2c2925">굳어버림</text>
    <text x="640" y="258" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="13.5" fill="#7d746a">아무것도 드나들지 못한다</text>
    <text x="640" y="279" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="13.5" fill="#7d746a">안에서 먼저 말라 간다</text>
  </g>
</svg>
