name: Update Google Scholar stats

on:
  schedule:
    - cron: '0 21 * * 0'  # every Monday 06:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Scholar metrics
        run: python scripts/update_scholar_stats.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet scholar-stats.json; then
            git add scholar-stats.json
            git commit -m "Update Google Scholar stats"
            git push
          else
            echo "No changes in scholar stats"
          fi
