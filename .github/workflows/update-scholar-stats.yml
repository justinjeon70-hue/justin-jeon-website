name: Update Google Scholar stats

on:
  schedule:
    - cron: '0 21 * * 0'  # every Monday 06:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Google Scholar blocks GitHub's datacenter IPs, so this step usually
      # fails. It is a backup only: the primary updater is the Windows
      # scheduled task "UpdateScholarStats" on the author's PC.
      - name: Fetch Scholar metrics
        id: fetch
        continue-on-error: true
        run: python scripts/update_scholar_stats.py

      - name: Commit and push if changed
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet scholar-stats.json; then
            git add scholar-stats.json
            git commit -m "Update Google Scholar stats"
            git push
          else
            echo "No changes in scholar stats"
          fi

      - name: Report blocked fetch
        if: steps.fetch.outcome != 'success'
        run: echo "::warning::Scholar fetch blocked on the runner; stats still come from the local scheduled task."
